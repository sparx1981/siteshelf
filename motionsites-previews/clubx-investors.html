<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClubX Investors — Landing Page</title>
<!-- Video is stood in for by a canvas of drifting clouds over a pale-to-deep blue sky. Avatars are painted. "Instrumental Serif" in the prompt is not used by any element, so only Inter is loaded. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--background:201 100% 13%}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:'Inter',system-ui,sans-serif;background:hsl(var(--background));color:#111827;-webkit-font-smoothing:antialiased;overflow-x:clip}
a,button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #111827;outline-offset:3px}
.stats :focus-visible,.ondark:focus-visible{outline-color:#fff}
.page{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.bg{position:absolute;inset:0;z-index:0}
.bg canvas{width:100%;height:100%;display:block}
.z{position:relative;z-index:10}
nav{max-width:80rem;margin:0 auto;width:100%;padding:24px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{width:40px;height:40px;border-radius:50%;flex:none;display:block}
.links{display:none;list-style:none;padding:0;gap:32px}
.links a{font-size:14px;color:#4b5563;text-decoration:none;transition:color .2s;padding:6px 2px}
.links a:hover{color:#111827}
.links a.on{color:#111827;font-weight:500}
.pillbtn{display:inline-block;background:#111827;color:#fff;border:0;border-radius:999px;cursor:pointer;text-decoration:none;transition:transform .2s;white-space:nowrap}
.pillbtn:hover{transform:scale(1.03)}.pillbtn:active{transform:scale(.97)}
.pillbtn:focus-visible{outline-color:#fff;box-shadow:0 0 0 3px #111827}
.nav-cta{padding:10px 24px;font-size:14px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:128px 24px 48px;min-width:0}
.badge{display:inline-flex;align-items:center;gap:12px;border-radius:999px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:1px solid rgba(17,24,39,.1);padding:6px 18px 6px 8px;margin-bottom:32px;animation:fade-rise .8s ease-out both;max-width:100%}
.avs{display:flex;flex:none}
.av{width:32px;height:32px;border-radius:50%;overflow:hidden;position:relative;border:2px solid rgba(255,255,255,.85);background:#cfd8e6;margin-left:-10px;flex:none}
.av:first-child{margin-left:0}
.av svg{position:absolute;width:210%;left:-55%;top:-60%;height:auto}
.badge p{font-size:14px;color:#1f2937;text-align:left;line-height:1.3}
h1{font-weight:700;font-size:clamp(38px,11vw,48px);line-height:.95;letter-spacing:-1.5px;color:#111827;max-width:64rem;animation:fade-rise .8s ease-out both}
.sub{margin-top:24px;font-size:16px;color:#1f2937;max-width:42rem;line-height:1.625;animation:fade-rise .8s ease-out .2s both}
.cta{margin-top:36px;padding:16px 48px;font-size:14px;animation:fade-rise .8s ease-out .4s backwards}
@keyframes fade-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.stats{width:calc(100% - 32px);max-width:56rem;margin:56px auto 24px;border-radius:24px;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:1px solid rgba(17,24,39,.1);padding:24px 32px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px;color:#fff;list-style:none}
.stats b{display:block;font-weight:300;font-size:30px;letter-spacing:-.025em;line-height:1.1}
.stats span{display:block;font-size:14px;color:rgba(255,255,255,.7);margin-top:4px}
@media(min-width:640px){h1{font-size:60px}.sub{font-size:18px}.stats b{font-size:36px}}
@media(min-width:768px){.links{display:flex}h1{font-size:78.4px}}
@media(min-width:900px){.stats{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);margin:0;grid-template-columns:repeat(4,minmax(0,1fr))}.hero{padding-bottom:140px}}
@media(max-width:480px){nav{padding:20px}.badge{padding-right:14px}.badge p{font-size:13px}.stats{padding:20px}}
@media(prefers-reduced-motion:reduce){.badge,h1,.sub,.cta{animation:none}.pillbtn{transition:none}}
</style>
</head>
<body>
<div class="page">
  <div class="bg" aria-hidden="true"><canvas id="cv"></canvas></div>
  <nav class="z" aria-label="Primary">
    <a href="#home" aria-label="ClubX home"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a3d"/><stop offset="1" stop-color="#e5341f"/></linearGradient></defs><circle cx="20" cy="20" r="20" fill="url(#lg)"/><path d="M12.500 11.500l15 17M27.500 11.500l-15 17" stroke="#fff" stroke-width="3.600" stroke-linecap="round"/><path d="M20 20l7.500-8.500" stroke="#fff" stroke-width="3.600" stroke-linecap="round"/></svg></a>
    <ul class="links"><li><a class="on" href="#home" aria-current="page">Home</a></li><li><a href="#studio">Studio</a></li><li><a href="#about">About</a></li><li><a href="#journal">Journal</a></li><li><a href="#reach">Reach Us</a></li></ul>
    <a class="pillbtn nav-cta" href="#join">Begin Journey</a>
  </nav>
  <main class="hero z" id="home">
    <a class="badge" href="#members" aria-label="400+ tech investors join the club. Join us!" style="text-decoration:none">
      <span class="avs" id="avs" aria-hidden="true"></span>
      <p>400+ tech investors join the club. Join us!</p>
    </a>
    <h1>Finance. Freedom. Fellows.</h1>
    <p class="sub">Private club of top tech investors.</p>
    <a class="pillbtn cta" id="join" href="#join">Begin Journey</a>
  </main>
  <ul class="stats z" aria-label="ClubX in numbers">
    <li><b>410+</b><span>Tech professionals</span></li>
    <li><b>€11M</b><span>Invested</span></li>
    <li><b>14</b><span>Deals made</span></li>
    <li><b>2.5</b><span>Years on the market</span></li>
  </ul>
</div>
