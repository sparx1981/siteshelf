<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grow AI Talent Platform — SaaS</title>
<!-- Fonts: Geist Sans -> Inter (as the prompt's own fallback); General Sans -> Outfit (closest locally available). Background video replaced by a canvas light-flow animation that fades in/out on a loop like the prompt's JS. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--background:260 87% 3%;--foreground:40 6% 95%;--card:240 6% 9%;--primary:262 83% 58%;--muted-foreground:240 5% 65%;--border:240 4% 20%;--hero-heading:40 10% 96%;--hero-sub:40 6% 82%;--radius:.75rem}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:hsl(var(--background));color:hsl(var(--foreground));font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #a78bfa;outline-offset:3px}
svg{display:block}
.liquid-glass{background:rgba(255,255,255,.01);background-blend-mode:luminosity;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative;overflow:hidden}
.liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;transition:background .2s;color:hsl(var(--foreground))}
.btn-sec{padding:12px 24px;font-size:16px;font-weight:400}
.btn-sec:hover{background:rgba(255,255,255,.05)}
.btn-sm{padding:8px 16px;font-size:14px}
.hero{position:relative;overflow:hidden;background:hsl(var(--background))}
.hero::before{content:"";position:absolute;left:50%;top:-10%;width:min(1100px,140%);height:75%;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(58,123,191,.18),rgba(120,70,230,.08) 55%,transparent);pointer-events:none}
.nav{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:20px 32px}
.logo{display:flex;align-items:center;gap:8px;height:32px;font-weight:600;font-size:18px}
.nav-c{display:none;align-items:center;gap:4px}
.nav-c button{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;font-size:16px;color:hsl(var(--foreground)/.9);border-radius:9999px;transition:color .2s,background .2s}
.nav-c button:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-r{display:flex;align-items:center;gap:8px}
.burger{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.mmenu{position:absolute;z-index:20;left:16px;right:16px;top:70px;border-radius:20px;background:rgba(18,16,28,.92);border:1px solid rgba(255,255,255,.12);padding:12px;display:flex;flex-direction:column}
.mmenu button{text-align:left;padding:12px 14px;border-radius:12px;font-size:16px}
.mmenu button:hover{background:rgba(255,255,255,.06)}
.rule{margin-top:3px;width:100%;height:1px;background:linear-gradient(90deg,transparent,hsl(var(--foreground)/.2),transparent)}
.hero-c{position:relative;display:flex;flex-direction:column;align-items:center;padding:80px 16px 0;text-align:center}
h1{font-family:'General Sans','Outfit',sans-serif;font-weight:400;font-size:min(230px,31vw);line-height:1.02;letter-spacing:-.024em;background-image:linear-gradient(223deg,#E8E8E9 0%,#3A7BBF 104.15%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding:0 .04em}
.sub{color:hsl(var(--hero-sub));font-size:18px;line-height:32px;max-width:28rem;margin-top:16px;opacity:.8}
.cta{margin-top:32px;margin-bottom:66px}
.cta .btn{padding:24px 29px;font-size:16px}
.proof{position:relative;width:100%;overflow:hidden;background:hsl(var(--background))}
.proof canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.proof .ov{position:absolute;inset:0;background:linear-gradient(to bottom,hsl(var(--background)),transparent,hsl(var(--background)))}
.proof-c{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;padding:64px 16px 96px;gap:80px}
.spacer{height:160px}
.logos{display:flex;align-items:center;gap:32px;width:100%;max-width:64rem;min-width:0}
.logos .lbl{color:hsl(var(--foreground)/.5);font-size:14px;white-space:nowrap;flex:none;line-height:1.5}
.marq{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.track{display:flex;width:max-content;animation:marquee 20s linear infinite}
.logo-i{display:flex;align-items:center;gap:8px;margin-right:64px;font-size:16px;font-weight:600;color:hsl(var(--foreground))}
.logo-i i{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@media (min-width:900px){.nav-c{display:flex}.burger{display:none}}
@media (max-width:640px){
 .nav{padding:16px 16px}
 .hero-c{padding-top:56px}
 .sub{font-size:16px;line-height:28px}
 .logos{flex-direction:column;align-items:flex-start;gap:20px}
 .logos .lbl br{display:none}
 .marq{width:100%;flex:none}
 .cta .btn{padding:20px 24px}
}
@media (prefers-reduced-motion:reduce){.track{animation:none}}
</style>
</head>
<body>
<section class="hero" aria-labelledby="h">
  <header>
    <div class="nav">
      <a href="#" class="logo" aria-label="Grow home"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><rect width="30" height="30" rx="9" fill="#7c3aed"/><path d="M8 20c4 0 5-3 7-6s3-4 7-4M8 14c3 0 4-2 5-4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>Grow</a>
      <nav class="nav-c" aria-label="Primary">
        <button type="button">Features <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <button type="button">Solutions</button><button type="button">Plans</button>
        <button type="button">Learning <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      </nav>
      <div class="nav-r">
        <button class="btn btn-sm btn-sec liquid-glass" type="button">Sign Up</button>
        <button class="burger liquid-glass" id="burger" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="mm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
      <div class="mmenu" id="mm" hidden><button type="button">Features</button><button type="button">Solutions</button><button type="button">Plans</button><button type="button">Learning</button></div>
    </div>
    <div class="rule"></div>
  </header>
  <main class="hero-c">
    <h1 id="h">Grow</h1>
    <p class="sub">The most powerful AI ever deployed<br>in talent acquisition</p>
    <div class="cta"><button class="btn liquid-glass" type="button" id="consult">Schedule a Consult</button></div>
  </main>
</section>
<section class="proof" aria-label="Social proof">
  <canvas id="cv" aria-hidden="true"></canvas>
  <div class="ov" aria-hidden="true"></div>
  <div class="proof-c">
    <div class="spacer"></div>
    <div class="logos">
      <p class="lbl">Relied on by brands <br>across the globe</p>
      <div class="marq" aria-label="Customer logos"><div class="track" id="track"></div></div>
    </div>
  </div>
</section>
<script>
(function(){
 var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 var brands=[['Vortex','#7c3aed'],['Nimbus','#3A7BBF'],['Prysma','#0ea5a4'],['Cirrus','#6366f1'],['Kynder','#c2410c'],['Halcyn','#4d7c0f']];
 var tr=document.getElementById('track'),h='';
 for(var k=0;k<2;k++)brands.forEach(function(b){h+='<div class="logo-i" '+(k?'aria-hidden="true"':'')+'><i class="liquid-glass">'+b[0][0]+'</i>'+b[0]+'</div>'});
 tr.innerHTML=h;
 var bu=document.getElementById('burger'),mm=document.getElementById('mm');
 bu.addEventListener('click',function(){mm.hidden=!mm.hidden;bu.setAttribute('aria-expanded',String(!mm.hidden))});
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!mm.hidden){mm.hidden=true;bu.setAttribute('aria-expanded','false');bu.focus()}});
 var cb=document.getElementById('consult');
 cb.addEventListener('click',function(){var o=cb.textContent;cb.textContent='We will be in touch';setTimeout(function(){cb.textContent=o},1800)});
 // video stand-in: flowing light ribbons with fade-in / fade-out loop (8s)
 var c=document.getElementById('cv'),x=c.getContext('2d'),W=0,H=0,dpr=1;
 function fit(){var r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,1.5);W=c.width=Math.max(2,r.width*dpr);H=c.height=Math.max(2,r.height*dpr)}
 fit();addEventListener('resize',fit);
 var t=0,last=performance.now(),DUR=8;
 function draw(){
  x.fillStyle='#07030f';x.fillRect(0,0,W,H);
  var g=x.createRadialGradient(W*.5,H*.35,0,W*.5,H*.35,W*.6);g.addColorStop(0,'rgba(58,123,191,.45)');g.addColorStop(.5,'rgba(100,60,200,.22)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.globalCompositeOperation='lighter';
  for(var i=0;i<26;i++){
   x.beginPath();
   for(var k=0;k<=60;k++){var u=k/60,xx=W*u,yy=H*(.22+.5*(i/26))+Math.sin(u*5+t*.6+i*.4)*H*.09+Math.sin(u*11-t*.8+i)*H*.025;k?x.lineTo(xx,yy):x.moveTo(xx,yy)}
   x.strokeStyle='hsla('+(215+i*3.5)+',85%,'+(55+i)+'%,'+(.1+.25*Math.sin(i*.5)**2)+')';x.lineWidth=dpr*1.2;x.stroke();
  }
  x.globalCompositeOperation='source-over';
 }
 function frame(n){
  var dt=Math.min(.05,(n-last)/1000);last=n;
  if(!document.hidden){t+=dt;var ph=t%DUR,o=Math.min(1,ph/.5,(DUR-ph)/.5);c.style.opacity=reduce?.9:Math.max(0,o).toFixed(3);draw()}
  requestAnimationFrame(frame)}
 if(reduce){t=2;c.style.opacity=.9;draw()}else{t=.3;requestAnimationFrame(frame)}
})();
</script>
</body>
</html>
