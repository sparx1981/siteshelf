<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader Animation — Component</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--text:#f5f5f5;--muted:#888888;--stroke:#1f1f1f;--ease:cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:clip}
.font-display{font-family:'Instrument Serif',serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #89AACC;outline-offset:3px;border-radius:6px}
/* ---------- loader ---------- */
.loader{position:fixed;inset:0;z-index:9999;background:var(--bg);overflow:hidden;transition:opacity .6s var(--ease)}
.loader.out{opacity:0;pointer-events:none}
.lbl{position:absolute;top:32px;left:32px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3em;opacity:0;transform:translateY(-20px);animation:lbl .6s var(--ease) .1s forwards}
@media(min-width:768px){.lbl{top:48px;left:48px;font-size:14px}}
@keyframes lbl{to{opacity:1;transform:none}}
.words{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.word{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(2.25rem,9vw,2.25rem);color:rgba(245,245,245,.8);display:block;opacity:0;transform:translateY(20px);transition:opacity .4s var(--ease),transform .4s var(--ease)}
@media(min-width:768px){.word{font-size:3.75rem}}
@media(min-width:1024px){.word{font-size:4.5rem}}
.word.in{opacity:1;transform:none}
.word.leave{opacity:0;transform:translateY(-20px);position:absolute;transition-duration:.22s}
.count{position:absolute;bottom:32px;right:32px;font-family:'Instrument Serif',serif;font-size:3.75rem;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;opacity:0;transform:translateY(20px);animation:lbl .6s var(--ease) .1s forwards}
.count{animation-name:cnt}
@keyframes cnt{to{opacity:1;transform:none}}
@media(min-width:768px){.count{font-size:6rem;bottom:48px;right:48px}}
@media(min-width:1024px){.count{font-size:8rem}}
.track{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(31,31,31,.5)}
.fill{height:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#89AACC 0%,#4E85BF 100%);box-shadow:0 0 8px rgba(137,170,204,.35);transition:transform .1s linear}
/* ---------- page behind ---------- */
#page{opacity:0;transition:opacity .5s ease-out}
#page.show{opacity:1}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:20px 24px;background:rgba(10,10,10,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--stroke)}
@media(min-width:768px){header{padding:24px 48px}}
.logo{font-family:'Instrument Serif',serif;font-style:italic;font-size:26px}
nav ul{list-style:none;display:flex;gap:24px;align-items:center}
nav a{font-size:14px;color:var(--muted);padding:6px 2px;transition:color .2s}
nav a:hover{color:var(--text)}
.pill{border:1px solid #3a3a3a;border-radius:999px;color:var(--text)!important;padding:8px 16px!important}
.pill:hover{background:#1b1b1b}
@media(max-width:560px){nav li:not(:last-child){display:none}}
.hero{padding:96px 24px 56px;max-width:1280px;margin:0 auto}
@media(min-width:768px){.hero{padding:140px 48px 72px}}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.3em;color:var(--muted);margin-bottom:28px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(3rem,13vw,3.5rem);line-height:.95;letter-spacing:-.02em;max-width:14ch}
@media(min-width:768px){h1{font-size:7rem}}
h1 em{color:#89AACC}
.hero p{margin-top:28px;max-width:34rem;color:#a2a2a2;font-size:17px;line-height:1.6}
.hero .row{margin-top:36px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px;border-radius:999px;border:1px solid #3a3a3a;background:transparent;color:var(--text);font:500 14px/1 Inter,sans-serif;cursor:pointer;transition:background .2s,transform .15s}
.btn:hover{background:#1b1b1b}.btn:active{transform:scale(.97)}
.btn.solid{background:var(--text);color:#0a0a0a;border-color:var(--text)}
.btn.solid:hover{background:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1280px;margin:0 auto;padding:0 24px 96px}
@media(min-width:768px){.grid{padding:0 48px 120px;gap:28px}}
@media(max-width:620px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{display:block;min-width:0}
.card .im{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#141414;border:1px solid var(--stroke);transition:transform .4s var(--ease)}
.card:hover .im{transform:translateY(-4px)}
.im svg{width:100%;height:100%;display:block}
.card h3{margin-top:14px;font-family:'Instrument Serif',serif;font-weight:400;font-size:26px}
.card span{font-size:13px;color:var(--muted)}
footer{border-top:1px solid var(--stroke);padding:32px 24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;max-width:1280px;margin:0 auto}
@media(min-width:768px){footer{padding:32px 48px}}
@media(prefers-reduced-motion:reduce){.lbl,.count{animation:none;opacity:1;transform:none}.word,.word.leave{transition:opacity .2s;transform:none}#page{transition:opacity .2s}.loader{transition:opacity .2s}.card .im{transition:none}}
</style>
</head>
<body>
<div class="loader" id="loader" role="status" aria-label="Loading portfolio">
  <div class="lbl">Portfolio</div>
  <div class="words" aria-hidden="true"></div>
  <div class="count" id="count" aria-hidden="true">000</div>
  <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
</div>

<div id="page" aria-hidden="true">
  <header>
    <a class="logo" href="#" aria-label="Portfolio home">Studio Mara</a>
    <nav aria-label="Primary"><ul><li><a href="#work">Work</a></li><li><a href="#">About</a></li><li><a class="pill" href="#" id="replayTop">Replay loader</a></li></ul></nav>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">Portfolio 2026</p>
      <h1>Design, create, <em>inspire.</em></h1>
      <p>An independent studio crafting brand identities, websites and digital products for people who care about the details.</p>
      <div class="row"><a class="btn solid" href="#work">View selected work</a><button class="btn" type="button" id="replay">Replay loading screen</button></div>
    </section>
    <section class="grid" id="work" aria-label="Selected work"></section>
  </main>
  <footer><span>&copy; 2026 Studio Mara</span><span>hello@example.com</span></footer>
</div>

<script>
/*SCENES-START*/
