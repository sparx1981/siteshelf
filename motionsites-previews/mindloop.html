<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindloop — SaaS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#000;color:#fff;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;background:#000}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.bgfade{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.28),rgba(0,0,0,.55) 100%)}
h1,.brand{font-family:'Instrument Serif',serif;font-weight:400}
nav.bar{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 32px;max-width:80rem;margin:0 auto;width:100%}
.brand{font-size:1.875rem;letter-spacing:-.025em;line-height:1.2}
.brand sup{font-size:.75rem;font-family:'Inter',sans-serif;vertical-align:super}
.links{display:none;gap:40px;list-style:none;margin:0;padding:0;font-size:.875rem}
.links a{transition:opacity .2s;padding:6px 0}
.links a:hover{opacity:.8}
@media(min-width:768px){.links{display:flex}}
.liquid-glass{background:rgba(255,255,255,.01);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);position:relative;overflow:hidden}
.liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.btn{font:inherit;color:#fff;cursor:pointer;border-radius:9999px;transition:transform .25s}
.btn:hover{transform:scale(1.03)}
.btn-sm{padding:10px 24px;font-size:.875rem;white-space:nowrap}
.btn-lg{padding:20px 56px;font-size:1rem;margin-top:48px}
main{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:128px 24px 160px}
h1{margin:0;font-size:3rem;line-height:.95;letter-spacing:-2.46px;max-width:80rem;font-weight:400}
@media(min-width:640px){h1{font-size:4.5rem}}
@media(min-width:768px){h1{font-size:6rem}}
.sub{font-size:1rem;max-width:42rem;margin:32px 0 0;line-height:1.625}
@media(min-width:640px){.sub{font-size:1.125rem}}
@keyframes fade-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-rise{animation:fade-rise .8s ease-out both}
.animate-fade-rise-delay{animation:fade-rise .8s ease-out .2s both}
.animate-fade-rise-delay-2{animation:fade-rise .8s ease-out .4s both}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:50;padding:12px 22px;border-radius:9999px;background:rgba(0,0,0,.7);font-size:.875rem}
@media(max-width:480px){nav.bar{padding:18px 20px}.brand{font-size:1.6rem}.btn-lg{padding:18px 40px}main{padding:96px 20px 120px}}
@media (prefers-reduced-motion: reduce){.animate-fade-rise,.animate-fade-rise-delay,.animate-fade-rise-delay-2{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<section class="hero">
  <canvas class="bg" id="bg" aria-hidden="true"></canvas>
  <div class="bgfade" aria-hidden="true"></div>
  <header>
    <nav class="bar" aria-label="Primary">
      <a href="#top" class="brand" aria-label="Velorah home">Velorah<sup>®</sup></a>
      <ul class="links">
        <li><a href="#top">Home</a></li>
        <li><a href="#studio">Studio</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#journal">Journal</a></li>
        <li><a href="#reach">Reach Us</a></li>
      </ul>
      <button class="btn btn-sm liquid-glass" type="button" data-cta>Begin Journey</button>
    </nav>
  </header>
  <main id="top">
    <h1 class="animate-fade-rise">Focus in a Distracted World</h1>
    <p class="sub animate-fade-rise-delay">We're designing tools for deep thinkers, bold creators, and quiet rebels. Amid the chaos, we build digital spaces for sharp focus and inspired work.</p>
    <button class="btn btn-lg liquid-glass animate-fade-rise-delay-2" type="button" data-cta>Begin Journey</button>
  </main>
</section>
<div class="toast" id="toast" role="status" hidden>Welcome aboard — your journey begins here.</div>
<script>
(function(){
  // dark atmospheric stand-in for the background video: slow drifting light veils
  var cv=document.getElementById('bg'),ctx=cv.getContext('2d');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W,H,dpr;
  function size(){dpr=Math.min(devicePixelRatio||1,1.5);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.max(2,W*.5*dpr);cv.height=Math.max(2,H*.5*dpr)}
  size();addEventListener('resize',size);
  var veils=[
    {c:[70,96,140],a:.5,r:.62,x:.2,y:.35,ax:.14,ay:.1,s:.11,p:0},
    {c:[40,70,100],a:.55,r:.7,x:.75,y:.55,ax:.12,ay:.14,s:.09,p:2},
    {c:[110,130,170],a:.28,r:.4,x:.5,y:.2,ax:.2,ay:.08,s:.15,p:4},
    {c:[30,40,70],a:.6,r:.8,x:.5,y:.9,ax:.1,ay:.06,s:.07,p:1},
    {c:[150,170,200],a:.16,r:.3,x:.35,y:.7,ax:.18,ay:.12,s:.2,p:3}
  ];
  var t=0,last=0;
  function draw(){
    var w=cv.width,h=cv.height;
    ctx.globalCompositeOperation='source-over';
    var g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#05070b');g.addColorStop(1,'#020305');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    ctx.globalCompositeOperation='lighter';
    veils.forEach(function(v){
      var x=(v.x+Math.sin(t*v.s+v.p)*v.ax)*w,y=(v.y+Math.cos(t*v.s*1.3+v.p)*v.ay)*h,r=v.r*Math.max(w,h)*.7;
      var rg=ctx.createRadialGradient(x,y,0,x,y,r);
      rg.addColorStop(0,'rgba('+v.c+','+v.a+')');rg.addColorStop(1,'rgba('+v.c+',0)');
      ctx.fillStyle=rg;ctx.fillRect(0,0,w,h);
    });
    // fine light streaks
    ctx.globalAlpha=.07;ctx.strokeStyle='#cfe0ff';ctx.lineWidth=Math.max(1,w/900);
    for(var i=0;i<14;i++){
      var yy=(i/14+Math.sin(t*.05+i)*.03)*h;
      ctx.beginPath();ctx.moveTo(0,yy);
      for(var xx=0;xx<=w;xx+=w/12){ctx.lineTo(xx,yy+Math.sin(xx/w*5+t*.2+i*.7)*h*.04)}
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  draw();
  function loop(ts){
    if(document.hidden){last=0;requestAnimationFrame(loop);return}
    var dt=last?Math.min((ts-last)/1000,.1):0;last=ts;t+=dt;draw();requestAnimationFrame(loop);
  }
  if(!reduce){t=3;requestAnimationFrame(loop)}else{t=3;draw()}
  // CTA buttons
  var toast=document.getElementById('toast'),tm;
  document.querySelectorAll('[data-cta]').forEach(function(b){b.addEventListener('click',function(){
    toast.hidden=false;clearTimeout(tm);tm=setTimeout(function(){toast.hidden=true},2600);
  })});
  document.querySelectorAll('.links a').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault()})});
})();
</script>
</body>
</html>
