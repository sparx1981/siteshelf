<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Web3 — Web3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--background:150 20% 5%;--foreground:45 30% 90%;--accent:45 70% 75%;--accent-foreground:150 20% 5%}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:hsl(var(--background))}
body{font-family:'Instrument Serif',serif;color:hsl(var(--foreground));-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid hsl(var(--accent));outline-offset:4px;border-radius:6px}
.root{min-height:100vh;min-height:100svh;background:hsl(var(--background));display:flex;flex-direction:column;position:relative;overflow:visible}
/* stand-in for the background video: slow aurora + drifting motes in deep green */
.bg{position:absolute;inset:0;z-index:0;overflow:hidden;background:radial-gradient(90% 70% at 70% 30%,#12382a 0%,rgba(18,56,42,0) 60%),radial-gradient(70% 60% at 20% 90%,#1a3b22 0%,rgba(26,59,34,0) 60%),linear-gradient(180deg,#07130e,#040a07)}
.bg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,10,7,.65),rgba(4,10,7,0) 60%),linear-gradient(0deg,rgba(4,10,7,.6),rgba(4,10,7,0) 40%)}
.content{position:relative;z-index:10;display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
nav{display:flex;align-items:center;gap:32px;padding:24px 32px}
@media(min-width:768px){nav{padding:24px 64px}}
nav ul{list-style:none;display:flex;gap:24px}
nav ul a{font-size:16px;letter-spacing:.025em;transition:opacity .2s;display:inline-block;padding:6px 0}
nav ul a:hover{opacity:.8}
nav .logo{display:inline-flex;width:40px;height:40px;flex:none}
main{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:0 32px 40px}
@media(min-width:768px){main{padding:0 64px 40px}}
.mid{margin:auto 0;max-width:48rem;overflow:visible}
h1{font-weight:400;font-size:clamp(3.1rem,15.5vw,3.75rem);line-height:.95;letter-spacing:-.025em;color:hsl(var(--foreground));margin-bottom:48px;overflow:visible}
@media(min-width:768px){h1{font-size:6rem}}
@media(min-width:1024px){h1{font-size:7rem}}
@media(max-width:420px){h1{font-size:3.5rem}}
.gl{position:relative;display:inline-block;overflow:visible}
.gl i{position:absolute;inset:0;font-style:normal;color:hsl(0 0% 100%);pointer-events:none;user-select:none}
.gl .a{filter:blur(4px);-webkit-mask-image:linear-gradient(to bottom left,#fff 20%,transparent 50%);mask-image:linear-gradient(to bottom left,#fff 20%,transparent 50%)}
.gl .b{filter:blur(12px);opacity:.6;-webkit-mask-image:linear-gradient(to bottom left,#fff 25%,transparent 55%);mask-image:linear-gradient(to bottom left,#fff 25%,transparent 55%)}
.cta{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:16px 40px;border-radius:43px;border:0;cursor:pointer;background:hsl(var(--accent));color:hsl(var(--accent-foreground));font:400 20px/1.4 'Instrument Serif',serif;box-shadow:0 4px 95px 4px hsl(45 70% 50% / .6);overflow:hidden;transition:transform .3s ease}
.cta:hover{transform:scale(1.05)}
.cta:active{transform:scale(1.01)}
.cta .blob{position:absolute;left:50%;top:-12px;width:12rem;height:2.5rem;margin-left:-6rem;border-radius:999px;background:hsl(45 60% 95%);filter:blur(24px);pointer-events:none}
.cta span.t{position:relative;z-index:1}
.logos{margin-top:auto;width:100%;padding-top:48px}
@media(min-width:768px){.logos{width:50%}}
.logos p{color:hsl(var(--foreground)/.5);font-size:16px;margin-bottom:20px;text-align:left}
.mq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;width:max-content;animation:marquee 20s linear infinite}
.logos:hover .track{animation-play-state:paused}
.it{display:flex;align-items:center;gap:12px;margin:0 24px;color:hsl(var(--foreground)/.6);font-size:24px;letter-spacing:.025em;white-space:nowrap}
.it svg{width:24px;height:24px;flex:none}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.note{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;background:hsl(var(--foreground));color:hsl(var(--background));padding:10px 18px;border-radius:999px;font-size:18px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
@media(prefers-reduced-motion:reduce){.track{animation:none}.cta{transition:none}}
</style>
</head>
<body>
<div class="root">
  <div class="bg" aria-hidden="true"><canvas id="cv"></canvas></div>
  <div class="content">
    <nav aria-label="Primary">
      <a class="logo" href="#" aria-label="Orbit home"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10L14 30L20 16L26 30L32 10"/></svg></a>
      <ul><li><a href="#">Vault</a></li><li><a href="#">Send</a></li><li><a href="#">Receive</a></li><li><a href="#">Trade</a></li></ul>
    </nav>
    <main>
      <div class="mid">
        <h1>Own the future of<br>your <span class="gl">assets.<i class="a" aria-hidden="true">assets.</i><i class="b" aria-hidden="true">assets.</i></span></h1>
        <button class="cta" type="button" id="cta"><span class="blob" aria-hidden="true"></span><span class="t">Launch your orbit</span></button>
      </div>
      <section class="logos" aria-label="Trusted by">
        <p>Trusted by top builders</p>
        <div class="mq"><div class="track" id="track"></div></div>
      </section>
    </main>
  </div>
</div>
<div class="note" id="note" role="status" hidden>Orbit launching soon. This is a preview.</div>
<script>
(function(){
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
// Lucide-style icons (drawn inline)
var S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
var icons={
 sun:S+'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>',
 box:S+'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>',
 star:S+'<path d="M11.5 2.3a.6.6 0 0 1 1 0l2.3 4.7 5.1.8a.6.6 0 0 1 .3 1l-3.7 3.6.9 5.1a.6.6 0 0 1-.9.7L12 16l-4.6 2.4a.6.6 0 0 1-.9-.7l.9-5.1-3.7-3.6a.6.6 0 0 1 .3-1l5.1-.8Z"/></svg>',
 feather:S+'<path d="M12.67 19a2 2 0 0 0 1.42-.59l6.5-6.5a5 5 0 0 0-7.07-7.07L5.3 12.3a2 2 0 0 0-.59 1.41V18a1 1 0 0 0 1 1Z"/><path d="M16 8 2 22M17.5 15H9"/></svg>',
 sparkles:S+'<path d="M9.94 14.7a2 2 0 0 0-1.64-1.64L2.4 11.9a.5.5 0 0 1 0-.97l5.9-1.15a2 2 0 0 0 1.64-1.64l1.15-5.9a.5.5 0 0 1 .97 0l1.15 5.9a2 2 0 0 0 1.64 1.64l5.9 1.15a.5.5 0 0 1 0 .97l-5.9 1.15a2 2 0 0 0-1.64 1.64l-1.15 5.9a.5.5 0 0 1-.97 0Z"/><path d="M20 3v4M22 5h-4"/></svg>'};
var L=[['sun','Nebulon'],['box','Prismify'],['star','Nova Labs'],['feather','Zephyr'],['sparkles','Ignite']];
var h='';for(var r=0;r<2;r++)L.forEach(function(x){h+='<div class="it"'+(r?' aria-hidden="true"':'')+'>'+icons[x[0]]+'<span>'+x[1]+'</span></div>'});
document.getElementById('track').innerHTML=h;
document.querySelectorAll('a[href="#"]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault()})});
var note=document.getElementById('note'),nt;
document.getElementById('cta').addEventListener('click',function(){note.hidden=false;clearTimeout(nt);nt=setTimeout(function(){note.hidden=true},2500)});
// background canvas
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=1,H=1,dpr=1,t=0,last=0,raf=0;
function size(){var r=cv.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,1.5);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
var rs=3;function rnd(){rs=(rs*9301+49297)%233280;return rs/233280}
var motes=[];for(var i=0;i<90;i++)motes.push({x:rnd(),y:rnd(),r:rnd()*1.8+.4,v:.01+rnd()*.03,p:rnd()*6.28,a:.2+rnd()*.6});
function draw(){
 ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
 // light shafts from top right
 for(var i=0;i<5;i++){var ang=.35+i*.1+Math.sin(t*.15+i)*.03,x0=W*(.62+i*.07),w=W*(.05+i*.012);
  var g=ctx.createLinearGradient(x0,0,x0-Math.tan(ang)*H,H);g.addColorStop(0,'rgba(230,220,150,'+(.1-i*.012)+')');g.addColorStop(1,'rgba(230,220,150,0)');ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(x0,-10);ctx.lineTo(x0+w,-10);ctx.lineTo(x0+w-Math.tan(ang)*H*1.05,H);ctx.lineTo(x0-Math.tan(ang)*H*1.05,H);ctx.closePath();ctx.fill()}
 // aurora
 for(var k=0;k<3;k++){var g2=ctx.createLinearGradient(0,H*.2,0,H*.8);g2.addColorStop(0,'rgba(60,200,140,0)');g2.addColorStop(.5,'rgba(60,200,140,'+(.07+k*.02)+')');g2.addColorStop(1,'rgba(60,200,140,0)');ctx.fillStyle=g2;ctx.beginPath();
  for(var q=0;q<=40;q++){var x=q/40*W,y=H*(.35+k*.1)+Math.sin(x/W*4+t*.2+k*2)*H*.07;q?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  for(var q=40;q>=0;q--){var x=q/40*W,y=H*(.55+k*.1)+Math.sin(x/W*3+t*.17+k)*H*.08;ctx.lineTo(x,y)}ctx.closePath();ctx.fill()}
 for(var j=0;j<motes.length;j++){var m=motes[j];var x=((m.x+t*m.v*.5)%1)*W,y=((m.y-t*m.v)%1+1)%1*H;var a=m.a*(.6+.4*Math.sin(t+m.p));ctx.fillStyle='rgba(245,230,160,'+a+')';ctx.beginPath();ctx.arc(x,y,m.r,0,6.2832);ctx.fill()}
 ctx.globalCompositeOperation='source-over';
}
function loop(ts){raf=requestAnimationFrame(loop);var dt=Math.min(.05,(ts-last)/1000||0);last=ts;t+=dt;draw()}
function start(){if(!raf&&!reduce&&!document.hidden){last=performance.now();raf=requestAnimationFrame(loop)}}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}
size();t=2;draw();start();
addEventListener('resize',function(){size();draw()});
document.addEventListener('visibilitychange',function(){document.hidden?stop():start()});
})();
</script>
</body>
</html>
