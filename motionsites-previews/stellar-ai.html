<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellar AI — Hero Section</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g100:#f3f4f6;--g300:#d1d5db;--g500:#6b7280;--g600:#4b5563;--g700:#374151}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#fff;color:#000}
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:3px solid #6d28d9;outline-offset:3px}
.page{max-width:80rem;margin:0 auto;background:#fff;overflow-x:clip}
.fu{opacity:0;animation:fu .6s ease-out forwards}
@keyframes fu{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes fo{from{opacity:0}to{opacity:1}}
@keyframes sd{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
nav.top{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600}
.brand svg{width:20px;height:20px;fill:#000;stroke:#000}
.links{display:none;align-items:center;gap:32px;font-size:14px;color:var(--g700)}
.links a,.links button{background:none;border:0;padding:6px 0;font:inherit;color:inherit;display:flex;align-items:center;gap:4px;cursor:pointer}
.links a:hover,.links button:hover,.login:hover{color:#000}
.links svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rt{display:flex;align-items:center;gap:20px;font-size:14px}
.login{color:var(--g700)}
.btn{background:#000;color:#fff;border-radius:999px;font-weight:500;border:0;cursor:pointer;transition:background .2s;display:inline-block}
.btn:hover{background:#1f2937}
.btn.sm{padding:10px 20px;font-size:14px}
.hero{padding:96px 24px 128px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:8px;margin-bottom:32px;font-size:14px;font-weight:500}
.badge i{width:24px;height:24px;border:1px solid var(--g300);border-radius:4px;display:flex;align-items:center;justify-content:center}
.badge svg{width:14px;height:14px;fill:#000}
h1{margin:0 0 20px;font-weight:400;font-size:clamp(34px,9.4vw,60px);line-height:1.1;letter-spacing:-.025em}
h1 .gr{background:linear-gradient(to right,#000,#6b7280,#9ca3af);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block}
.lead{font-size:18px;color:var(--g600);max-width:42rem;margin:0 auto 32px;line-height:1.55}
.cta{padding:12px 32px;font-size:16px;margin-bottom:48px}
.tabs{display:inline-block;background:var(--g100);border-radius:8px;padding:4px;margin-bottom:24px;max-width:100%}
.tabs .m{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.tabs .d{display:none;align-items:center}
.tab{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;border:0;background:transparent;color:var(--g600);font-size:14px;font-weight:500;border-radius:6px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s;white-space:nowrap}
.tab:hover{color:#000}
.tab[aria-selected=true]{background:#fff;color:#000;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dv{width:1px;height:20px;background:var(--g300);margin:0 2px}
.stage{position:relative;border-radius:24px;overflow:hidden;height:400px;background:#1b1740;text-align:left}
.bgv{position:absolute;inset:0;overflow:hidden}
.bgv .pan{position:absolute;inset:-6%;animation:pan 24s ease-in-out infinite alternate}
.bgv .pan>svg{width:100%;height:100%;display:block}
@keyframes pan{from{transform:scale(1.02) translate(-1.5%,0)}to{transform:scale(1.12) translate(1.5%,-1%)}}
.ovl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,30,.28);animation:fo .4s ease-out forwards;padding:16px}
.card{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:sd .5s ease-out forwards;color:#111}
.card h3{margin:0 0 4px;font-size:17px;font-weight:600}
.card .sb{font-size:13px;color:var(--g500);margin:0 0 14px}
.bar{height:6px;background:var(--g100);border-radius:999px;overflow:hidden;margin-bottom:14px}
.bar b{display:block;height:100%;border-radius:999px;transition:width 1.2s ease-out;width:0}
.ls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.ls li{display:flex;align-items:center;gap:10px;color:var(--g700)}
.ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--g300);flex:none;display:flex;align-items:center;justify-content:center}
.ck.on{background:#7c3aed;border-color:#7c3aed}
.ck.on svg{display:block}
.ck svg{display:none;width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.ls li.cur{color:#000;font-weight:600}
.mets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.met{background:var(--g100);border-radius:10px;padding:9px 11px}
.met span{display:block;font-size:11px;color:var(--g500)}
.met strong{font-size:16px;font-weight:600}
.big{display:flex;align-items:baseline;gap:8px;margin:2px 0 10px}
.big b{font-size:34px;font-weight:700;color:#15803d;letter-spacing:-.02em}
.big span{font-size:13px;color:var(--g500)}
.ok{display:inline-flex;align-items:center;gap:6px;background:#dcfce7;color:#166534;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;margin-bottom:12px}
.dep{margin-top:14px;width:100%;padding:11px;font-size:14px;border-radius:10px}
.dep.done{background:#15803d}
.logos{margin-top:96px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:28px 48px;color:#6b7280;color:#4b5563}
.logos>*{display:flex;align-items:center;gap:8px;color:#4b5563;font-weight:700;letter-spacing:.04em}
.lg1{font-size:18px;letter-spacing:.12em}.lg2{font-size:18px;letter-spacing:.08em}
.lg4{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:26px;font-weight:700;letter-spacing:0}
.lg6{font-size:20px;font-weight:600;letter-spacing:-.01em}
.lg5 i{width:28px;height:28px;border-radius:50%;border:2px solid #4b5563;display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal}
.lg3 svg,.lg6 svg{width:20px;height:20px;fill:#4b5563}
.lg3{font-weight:600;font-size:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#000;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:768px){
 .links{display:flex}
 h1{font-size:72px}
 .lead{font-size:20px}
 .tabs .m{display:none}.tabs .d{display:flex}
 .stage{height:500px}
}
@media(min-width:1024px){h1{font-size:80px}}
@media(max-width:480px){.hero{padding:56px 16px 80px}.logos{gap:22px 30px;margin-top:64px}.card{padding:18px}}
@media(prefers-reduced-motion:reduce){.fu,.ovl,.card{animation:none;opacity:1}.bgv .pan{animation:none}.bar b{transition:none}}
</style>
</head>

</section>
</main>
</div>

<script>/*SCENES-START*/

  var tt;function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2400)}
  var msgs={'#start':'Demo preview: sign-up is not connected.','#trial':'Demo preview: trial sign-up is not connected.','#login':'Demo preview: login is not connected.'};
  document.querySelectorAll('a[href^="#"]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var m=msgs[a.getAttribute('href')];if(m)toast(m)})});
  show('analyse');start();
  document.addEventListener('visibilitychange',function(){if(document.hidden)clearInterval(timer);else start()});
})();
</script>
</body>
