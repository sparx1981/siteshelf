<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse — Analytics Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--bg:#0f1115;--pan:#171b22;--line:#232832;--ink:#e8ebf2;--mut:#8a93a6;--acc:#4c8dff;--tl:#2dd4bf;--am:#fbbf24;--ro:#fb7185;--up:#34d399}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 'Inter Tight',sans-serif;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100dvh}
aside{background:#14171d;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh}
.mark{font:700 22px 'Inter Tight',sans-serif;letter-spacing:-.03em;display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.mark i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--acc),var(--tl))}
.nvs{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--mut);text-decoration:none;font-weight:500}
.nv svg{width:18px;height:18px}.nv:hover{background:#1b2029;color:var(--ink)}.nv[aria-current=page]{background:#1d2431;color:#fff}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--line)}
.me b{display:block;font-weight:600;line-height:1.2}.me small{color:var(--mut)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);display:grid;place-items:center;font-weight:700;font-size:12px}
main{padding:24px 28px 48px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font:600 26px/1.2 'Inter Tight',sans-serif;margin:0;letter-spacing:-.02em}
.tools{display:flex;gap:10px;align-items:center}
.seg{display:flex;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--mut);padding:6px 14px;border-radius:7px;font:600 13px 'Inter Tight',sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:#252d3b;color:#fff}
.btn{background:var(--pan);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;font:600 13px 'Inter Tight',sans-serif;cursor:pointer}
.menu{display:none}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.ct{font-size:12px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.kv{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.kd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.dl{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px}
.dl.up{background:rgba(52,211,153,.14);color:var(--up)}.dl.dn{background:rgba(251,113,133,.14);color:var(--ro)}
.kd svg{width:80px;height:26px}
.big{margin-bottom:14px}
.bh{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center;margin-bottom:8px}
.lg{display:flex;gap:16px;font-size:13px;color:var(--mut)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.chart{position:relative}
svg.line{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
svg.line:focus-visible{outline-offset:4px;border-radius:6px}
.tip{position:absolute;pointer-events:none;background:#0b0d11;border:1px solid #2c3442;border-radius:10px;padding:8px 12px;font-size:12px;transform:translate(-50%,-110%);white-space:nowrap;opacity:0;transition:opacity .12s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tip b{display:block;margin-bottom:2px;color:var(--mut);font-weight:500}.tip span{display:flex;gap:8px;align-items:center}.tip i{width:8px;height:8px;border-radius:50%}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.dn-w{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.dn-w svg{width:190px;height:190px;flex:none}
.dn-w path{transition:transform .2s;transform-origin:100px 100px;cursor:pointer}
.dn-w text{fill:var(--ink)}
.dl2{display:grid;gap:8px;flex:1;min-width:140px}
.dl2 button{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink);font:500 13px 'Inter Tight',sans-serif;cursor:pointer;padding:3px 0;text-align:left}
.dl2 button i{width:10px;height:10px;border-radius:3px;flex:none}
.dl2 button[aria-pressed=false]{opacity:.4;text-decoration:line-through}
.dl2 button span{margin-left:auto;color:var(--mut)}
.pg{display:grid;gap:12px}
.pg div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px}
.pg em{font-style:normal;color:var(--mut)}
.pg .br{grid-column:1/3;height:6px;border-radius:3px;background:#222a37;overflow:hidden}
.pg .br i{display:block;height:100%;border-radius:3px;background:var(--acc);transition:width .5s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1100px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px}.mark{padding:0 8px 0 0}.menu{display:inline-flex;margin-left:auto}.nvs{display:none;width:100%;flex-direction:column}.nvs.open{display:flex}.me{display:none}main{padding:18px 16px 40px}.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){.kp{grid-template-columns:minmax(0,1fr)}.dn-w{justify-content:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="app">
<aside><div class="mark"><i></i>Pulse</div><button class="btn menu" id="mn" aria-expanded="false" aria-controls="nvs">Menu</button>
<nav class="nvs" id="nvs" aria-label="Main"></nav>
<div class="me"><span class="av">RK</span><span><b>Rae Kim</b><small>Product lead</small></span></div></aside>
<main><div class="top"><h1>Overview</h1><div class="tools"><div class="seg" role="group" aria-label="Date range"><button data-r="7" aria-pressed="false">7D</button><button data-r="30" aria-pressed="true">30D</button><button data-r="90" aria-pressed="false">90D</button></div><button class="btn">Export</button></div></div>
<div class="kp" id="kp"></div>
<section class="card big"><div class="bh"><p class="ct" style="margin:0">Visitors and sign-ups</p><div class="lg"><span><i style="background:var(--acc)"></i>Visitors</span><span><i style="background:var(--tl)"></i>Sign-ups</span></div></div>
<div class="chart" id="ch"><svg class="line" id="ln" viewBox="0 0 800 280" tabindex="0" role="img"></svg><div class="tip" id="tip"></div></div></section>
<div class="two"><section class="card"><p class="ct">Traffic sources</p><div class="dn-w"><svg id="dn" viewBox="0 0 200 200" role="img"></svg><div class="dl2" id="dl"></div></div></section>
<section class="card"><p class="ct">Top pages</p><div class="pg" id="pg"></div></section></div>
<div class="sr" id="live" aria-live="polite"></div></main></div>
<script>
const $=i=>document.getElementById(i),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NAV=[['Overview','M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10'],['Audience','M16 11a4 4 0 1 0-8 0M4 20a8 8 0 0 1 16 0'],['Acquisition','M4 20V10M10 20V4M16 20v-7M22 20H2'],['Behaviour','M5 12h4l3-8 4 16 3-8h2'],['Reports','M6 3h9l4 4v14H6zM14 3v5h5']];
$('nvs').outerHTML=`<nav class="nvs" id="nvs" aria-label="Main" >${NAV.map((n,i)=>`<a class="nv" href="#" ${i?'':'aria-current="page"'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${n[1]}"/></svg>${n[0]}</a>`).join('')}</nav>`;
document.querySelectorAll('.nv').forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelectorAll('.nv').forEach(x=>x.removeAttribute('aria-current'));a.setAttribute('aria-current','page');document.querySelector('h1').textContent=a.textContent})
$('mn').onclick=function(){const o=$('nvs').classList.toggle('open');this.setAttribute('aria-expanded',o)};
let range=30,seedBase=3;
function rng(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function data(n){const r=rng(seedBase*100+n),v=[],s=[];let b=4200;for(let i=0;i<n;i++){b+=(r()-.45)*260;const wk=(i%7>4)?.82:1;const x=Math.max(900,b*wk*(1+Math.sin(i/3)*.05));v.push(Math.round(x));s.push(Math.round(x*(.045+r()*.012)))}return{v,s}}
const SRC=[['Search',42,'#4c8dff'],['Direct',24,'#2dd4bf'],['Social',18,'#fbbf24'],['Email',10,'#fb7185'],['Referral',6,'#a78bfa']];
const PAGES=[['/pricing',18400],['/',15200],['/features/automation',9800],['/blog/launch-notes',7100],['/docs/getting-started',6400],['/signup',5200]];
let D,off=new Set(),inter=0;
const fmt=n=>n.toLocaleString('en-GB');
function kpis(){const n=range,sumV=D.v.reduce((a,b)=>a+b,0),sumS=D.s.reduce((a,b)=>a+b,0);const half=Math.floor(n/2);const dv=(D.v.slice(half).reduce((a,b)=>a+b,0)/D.v.slice(0,half).reduce((a,b)=>a+b,0)-1)*100,ds=(D.s.slice(half).reduce((a,b)=>a+b,0)/D.s.slice(0,half).reduce((a,b)=>a+b,0)-1)*100;
 const conv=sumS/sumV*100,rev=sumS*38;return[['Visitors',sumV,fmt,dv,D.v,'#4c8dff'],['Sign-ups',sumS,fmt,ds,D.s,'#2dd4bf'],['Conversion',conv,x=>x.toFixed(2)+'%',ds-dv,D.s.map((s,i)=>s/D.v[i]),'#fbbf24'],['Revenue',rev,x=>'£'+fmt(Math.round(x)),ds*.9,D.s.map(s=>s*38),'#fb7185']]}
function spark(a,c){const mn=Math.min(...a),mx=Math.max(...a);return `<svg viewBox="0 0 80 26" aria-hidden="true"><polyline fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round" points="${a.map((v,i)=>`${i/(a.length-1)*80},${24-(v-mn)/(mx-mn||1)*22}`).join(' ')}"/></svg>`}
function drawKpi(first){const K=kpis();$('kp').innerHTML=K.map((k,i)=>`<div class="card"><p class="ct">${k[0]}</p><div class="kv" data-i="${i}">${k[2](k[1])}</div><div class="kd"><span class="dl ${k[3]>=0?'up':'dn'}">${k[3]>=0?'▲':'▼'} ${Math.abs(k[3]).toFixed(1)}%</span>${spark(k[4],k[5])}</div></div>`).join('');
 if(!reduce)K.forEach((k,i)=>{const el=document.querySelector(`.kv[data-i="${i}"]`),t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/600);el.textContent=k[2](k[1]*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}
const W=800,H=280,L=44,R=12,T=14,B=26;let pts=[];
function line(){const n=D.v.length,mx=Math.ceil(Math.max(...D.v)/1000)*1000;const x=i=>L+i/(n-1)*(W-L-R),y=v=>T+(1-v/mx)*(H-T-B),y2=v=>T+(1-v*18/mx)*(H-T-B);
 const path=(a,fy)=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+fy(v).toFixed(1)).join(' ');
 let g='';for(let i=0;i<=4;i++){const v=mx*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#232832"/><text x="${L-8}" y="${yy+4}" text-anchor="end" fill="#8a93a6" font-size="11">${v>=1000?v/1000+'k':v}</text>`}
 const lbl=[0,Math.floor(n/3),Math.floor(2*n/3),n-1];const day=i=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return d};
 lbl.forEach(i=>g+=`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" fill="#8a93a6" font-size="11">${day(i).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</text>`);
 const p1=path(D.v,y),p2=path(D.s,y2);
 $('ln').innerHTML=`<defs><linearGradient id="af" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c8dff" stop-opacity=".3"/><stop offset="1" stop-color="#4c8dff" stop-opacity="0"/></linearGradient></defs>${g}<path d="${p1} L${x(n-1)} ${H-B} L${x(0)} ${H-B}Z" fill="url(#af)"/><path id="l1" d="${p1}" fill="none" stroke="#4c8dff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path id="l2" d="${p2}" fill="none" stroke="#2dd4bf" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><g id="cr" opacity="0"><line id="cl" y1="${T}" y2="${H-B}" stroke="#5a6478" stroke-dasharray="3 4"/><circle id="c1" r="5" fill="#0f1115" stroke="#4c8dff" stroke-width="2.4"/><circle id="c2" r="5" fill="#0f1115" stroke="#2dd4bf" stroke-width="2.4"/></g>`;
 pts={x,y,y2,n,day};$('ln').setAttribute('aria-label',`Line chart of visitors and sign-ups over ${n} days. Visitors range from ${fmt(Math.min(...D.v))} to ${fmt(Math.max(...D.v))}. Focus the chart and use arrow keys to read values.`);
 if(!reduce)['l1','l2'].forEach((id,k)=>{const p=$(id),len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len;p.getBoundingClientRect();p.style.transition='stroke-dashoffset .9s ease '+k*.1+'s';p.style.strokeDashoffset=0})}
function showAt(i){i=Math.max(0,Math.min(pts.n-1,i));inter=i;const X=pts.x(i);$('cr').setAttribute('opacity',1);$('cl').setAttribute('x1',X);$('cl').setAttribute('x2',X);$('c1').setAttribute('cx',X);$('c1').setAttribute('cy',pts.y(D.v[i]));$('c2').setAttribute('cx',X);$('c2').setAttribute('cy',pts.y2(D.s[i]));
 const box=$('ln').getBoundingClientRect(),k=box.width/W;const tip=$('tip');const d=pts.day(i).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
 tip.innerHTML=`<b>${d}</b><span><i style="background:#4c8dff"></i>Visitors ${fmt(D.v[i])}</span><span><i style="background:#2dd4bf"></i>Sign-ups ${fmt(D.s[i])}</span>`;tip.style.left=Math.max(80,Math.min(box.width-80,X*k))+'px';tip.style.top=(pts.y(D.v[i])*k)+'px';tip.style.opacity=1;
 $('live').textContent=`${d}: ${fmt(D.v[i])} visitors, ${fmt(D.s[i])} sign-ups`}
function hide(){$('cr').setAttribute('opacity',0);$('tip').style.opacity=0}
function pos(e){const b=$('ln').getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX),f=((cx-b.left)/b.width*W-L)/(W-L-R);showAt(Math.round(f*(pts.n-1)))}
$('ln').addEventListener('pointermove',pos);$('ln').addEventListener('pointerdown',pos);$('ln').addEventListener('pointerleave',hide);
$('ln').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();showAt(inter+1)}else if(e.key==='ArrowLeft'){e.preventDefault();showAt(inter-1)}else if(e.key==='Home'){e.preventDefault();showAt(0)}else if(e.key==='End'){e.preventDefault();showAt(pts.n-1)}});
$('ln').addEventListener('focus',()=>showAt(inter||pts.n-1));$('ln').addEventListener('blur',hide);
function arc(a0,a1,ro,ri){const p=(a,r)=>[100+r*Math.sin(a),100-r*Math.cos(a)],l=a1-a0>Math.PI?1:0,A=p(a0,ro),Bq=p(a1,ro),C=p(a1,ri),Dd=p(a0,ri);return `M${A}A${ro} ${ro} 0 ${l} 1 ${Bq}L${C}A${ri} ${ri} 0 ${l} 0 ${Dd}Z`}
function donut(){const on=SRC.filter(s=>!off.has(s[0])),tot=on.reduce((a,s)=>a+s[1],0);let a=-0.0,h='';const TWO=Math.PI*2;
 on.forEach(s=>{const sw=s[1]/tot*TWO-(on.length>1?.03:0);const p=arc(a+.015,a+.015+sw,92,60);h+=`<path d="${p}" fill="${s[2]}" data-n="${s[0]}" data-p="${Math.round(s[1]/tot*100)}" tabindex="0" aria-label="${s[0]} ${Math.round(s[1]/tot*100)} percent"/>`;a+=s[1]/tot*TWO});
 $('dn').innerHTML=h+`<text x="100" y="98" text-anchor="middle" font-size="26" font-weight="600" id="dv">${fmt(D.v.reduce((x,y)=>x+y,0)*0+Math.round(D.v.reduce((x,y)=>x+y,0)/1000))}k</text><text x="100" y="118" text-anchor="middle" font-size="11" fill="#8a93a6" id="dk" style="fill:#8a93a6">visits</text>`;
 $('dn').setAttribute('aria-label','Traffic sources: '+SRC.filter(s=>!off.has(s[0])).map(s=>`${s[0]} ${s[1]} percent`).join(', '));
 const tv=Math.round(D.v.reduce((x,y)=>x+y,0)/1000);
 $('dn').querySelectorAll('path').forEach(p=>{const set=()=>{p.style.transform='scale(1.05)';$('dv').textContent=p.dataset.p+'%';$('dk').textContent=p.dataset.n};const rs=()=>{p.style.transform='';$('dv').textContent=tv+'k';$('dk').textContent='visits'};p.onmouseenter=set;p.onfocus=set;p.onmouseleave=rs;p.onblur=rs});
 $('dl').innerHTML=SRC.map(s=>`<button aria-pressed="${!off.has(s[0])}" data-n="${s[0]}"><i style="background:${s[2]}"></i>${s[0]}<span>${s[1]}%</span></button>`).join('')}
$('dl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=b.dataset.n;if(off.has(n))off.delete(n);else if(off.size<SRC.length-1)off.add(n);donut();$('dl').querySelector(`[data-n="${n}"]`).focus()};
function pages(){const sc=range/30,mx=PAGES[0][1]*sc;$('pg').innerHTML=PAGES.map(p=>`<div><span>${p[0]}</span><em>${fmt(Math.round(p[1]*sc))}</em><span class="br"><i style="width:${p[1]*sc/mx*100}%"></i></span></div>`).join('')}
function all(){D=data(range);drawKpi();line();donut();pages();hide()}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{range=+b.dataset.r;seedBase=range;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));all()});
seedBase=30;all();
</script></body></html>
