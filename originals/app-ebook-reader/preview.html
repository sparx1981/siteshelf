<style>

<script>

['The Lamp at Kestrel Point',['Every evening at the turn of the tide, Wren climbed the one hundred and twelve steps of the lighthouse with a basket on her arm and a small brass key in her pocket. The steps were worn into shallow bowls by two centuries of boots, and she knew each one the way you know the stairs of a house you were born in.','The keeper before her had been a quiet man called Tobias Reyes who spoke mostly to the gulls. He had left her the lamp, a stove that smoked when the wind came from the west, and a cupboard of charts so old that the coastlines on them looked like the wrong answers to a very patient question.','On her first night she had read one of the charts by lantern light and found, in the margin, a line of tiny handwriting. It said only: the sea keeps a second map. She had laughed, and then she had not slept.','Now, years later, she still thought of that line each time she lit the lamp. The beam swept the water in a long slow circle, and for a moment everything it touched was clear, a road of silver laid across the dark, before the dark closed up behind it like a door.']],
['The Second Map',['The harbour master, Odette Marlow, kept a shop that sold rope, tea and opinions in roughly equal measure. She listened to Wren describe the margin note without once looking up from the knot she was tying.','"Everyone who keeps that light finds that line," she said at last. "Tobias found it. His keeper before him found it. Nobody ever agrees who wrote it."','"And what does it mean?"','"It means you should go out in a boat on a very still night and look down," said Odette, and bit through the cord. "That is all I know, and I have known it for forty years without being brave enough to try."']],
['A Very Still Night',['It was three weeks before the sea was calm enough. Wren borrowed a rowing boat from the Calloway family, packed a flask of tea, a blanket and the brass key, which she could not have explained, and pushed off from the slipway just after midnight.','The water was so flat that the stars lay on it whole. She rowed out past the harbour wall until the town was a handful of amber windows, shipped the oars, and let the boat drift. Then she leaned over the side and looked down.','At first there was only her own face, pale and wavering. Then the starlight seemed to settle, the way dust settles in a shaft of sun, and beneath it she saw lines: faint, luminous threads running along the seabed, branching and rejoining, a map drawn in something that was neither light nor water.']],
['What the Threads Showed',['She followed them with her eyes for a long time. They traced channels she knew, the deep cut by the harbour mouth, the shelf where the lobster pots were set, and others she did not: a spiral off the headland, a straight line that ran out toward the open sea and kept going beyond what she could see.','The key grew warm in her pocket. She took it out and held it above the water, and the nearest thread brightened in answer, as if it had been waiting for exactly that.','Wren understood then that the map was not a record of where the sea had been. It was a record of where it was willing to go, and the key was only a way of asking politely.']],
['Odette Tells the Truth',['In the morning she told Odette everything, and Odette sat down on a coil of rope and was quiet for so long that Wren worried she had broken something.','"Forty years," said Odette finally, and laughed until she had to wipe her eyes. "Forty years I have been telling myself I was too sensible to row out there. And you went in a fortnight."','"I was not brave," said Wren. "I was curious. It is a lighter thing to carry."','They made tea. They drew the spiral on the back of a ship\'s manifest. By noon half the harbour knew, and by evening the other half had pretended not to.']],
['The Atlas',['That winter Wren stopped copying out the old charts and began making new ones. On each still night she went out, followed the threads, and drew what she saw. Odette sold the pages in the shop beside the rope and the tea, and people came from three counties to read them.','The book that grew from those pages was called, for lack of a better word, an atlas. It showed the coast the way the sea understood it: not as a border between two things, but as a long conversation that nobody had ever finished.','And every evening, as the tide turned, she still climbed the one hundred and twelve steps and lit the lamp. The beam swept the water, a road of silver across the dark, and somewhere below it the second map shone back, faintly, to say it had been seen.']]];
var KEY='er-lantern',cw=0,pages=1,page=1,words=0,bms=[],off=0,chStart=[],resizeT;

st.innerHTML=CH.map(function(c,i){var ps=c[1].map(function(p){words+=p.split(/\s+/).length;return '<p>'+p+'</p>'}).join('');return '<h2 id="c'+i+'" tabindex="-1"'+(i?' class="cs"':'')+'><small>Chapter '+(i+1)+'</small>'+c[0]+'</h2>'+ps}).join('');
function metrics(){var wide=innerWidth>900,pgw=vp.clientWidth-parseFloat(getComputedStyle(vp).paddingLeft)*2,mx=parseFloat(getComputedStyle(vp).paddingLeft);var gt=wide?64:0;var c=wide?(pgw-gt)/2:pgw;cw=c;st.style.setProperty('--cw',c+'px');st.style.setProperty('--gt',gt+'px');root.style.setProperty('--gt',gt+'px');$('#gu').style.display=wide?'':'none';return {step:wide?pgw+gt:c+gt,wide:wide,w:pgw,gt:gt}}

 $('#sl').max=pages;if(keep!==false){goto_(Math.max(1,Math.min(pages,off?pageOfOff(off):page)),true)}else goto_(page,true)}
function pageOfOff(o){var n=0,total=0;var ps=st.querySelectorAll('h2,p');for(var i=0;i<ps.length;i++){n+=ps[i].textContent.length;if(n>=o){return Math.max(1,Math.round(ps[i].offsetLeft/(cw+M.gt))+1)}}return 1}
function offOfPage(p){var n=0,ps=st.querySelectorAll('h2,p');for(var i=0;i<ps.length;i++){if(Math.round(ps[i].offsetLeft/(cw+M.gt))+1>=p)return n;n+=ps[i].textContent.length}return n}

var lt=0;function ui(silent){var per=M.wide?2:1,last=Math.min(pages,page+per-1);$('#pn').textContent=per===2&&last>page?'Pages '+page+'–'+last+' of '+pages:'Page '+page+' of '+pages;$('#sl').value=page;
 var ch=0;chStart.forEach(function(s,i){if(page>=s||(per===2&&page+1>=s))ch=i});$('#cn').textContent='Chapter '+(ch+1)+': '+CH[ch][0];
 var left=Math.round(words*(1-page/pages)/230);$('#tl').textContent=Math.round(page/pages*100)+'% · about '+left+' min left';

var sx=null;vp.addEventListener('pointerdown',function(e){sx=e.clientX});vp.addEventListener('pointerup',function(e){if(sx===null)return;var d=e.clientX-sx;sx=null;if(Math.abs(d)>60){turn(d<0?1:-1);return}if(Math.abs(d)<8&&!window.getSelection().toString()){var r=vp.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(x>.7)turn(1);else if(x<.3)turn(-1)}});

function openD(v){$('#dr').classList.toggle('on',v);$('#sc').classList.toggle('on',v);if(v){drawer();setTimeout(function(){var f=$('#dl button')||$('#t0');f.focus()},60)}else $('#ct').focus()}
