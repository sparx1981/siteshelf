$('#ag').addEventListener('keydown',function(e){var rc=e.target.closest('.rc');if(!rc)return;var li=rc.closest('.rw'),id=li.dataset.id,rows=[].slice.call($('#ag').querySelectorAll('.rw:not(.hid) .rc'));
 if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();var i=L.findIndex(function(x){return x.id===id}),dir=e.key==='ArrowUp'?-1:1,j=i+dir;while(j>=0&&j<L.length&&L[j].a!==L[i].a)j+=dir;if(j<0||j>=L.length)return;var t=L[i];L[i]=L[j];L[j]=t;render();document.querySelector('.rw[data-id="'+id+'"] .rc').focus();return}
 var k=rows.indexOf(rc);if(e.target===rc){if(e.key==='ArrowDown'){e.preventDefault();(rows[k+1]||rc).focus()}else if(e.key==='ArrowUp'){e.preventDefault();(rows[k-1]||rc).focus()}else if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle(id)}else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();remove(id)}}});
document.addEventListener('keydown',function(e){if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#an').focus()}});
function wire(li){var rc=li.querySelector('.rc'),r=li.querySelector('.bk.r'),l=li.querySelector('.bk.l'),sx=0,dx=0,on=false,mv=false;
 r.style.opacity=0;l.style.opacity=0;
 rc.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;on=true;mv=false;sx=e.clientX;dx=0});
 rc.addEventListener('pointermove',function(e){if(!on)return;dx=e.clientX-sx;if(!mv&&Math.abs(dx)>8){mv=true;rc.classList.add('dr');try{rc.setPointerCapture(e.pointerId)}catch(_){}}if(!mv)return;dx=Math.max(-160,Math.min(160,dx));rc.style.transform='translateX('+dx+'px)';r.style.opacity=dx>0?Math.min(1,dx/90):0;l.style.opacity=dx<0?Math.min(1,-dx/90):0});
 function up(){if(!on)return;on=false;rc.classList.remove('dr');if(mv){if(dx>90){rc.style.transform='';var id=li.dataset.id;toggle(id)}else if(dx<-90){remove(li.dataset.id)}else{rc.style.transform='';r.style.opacity=0;l.style.opacity=0}}}
 rc.addEventListener('pointerup',up);rc.addEventListener('pointercancel',up)}
$('#sm').addEventListener('click',function(){shop=!shop;this.setAttribute('aria-pressed',shop);render();live.textContent=shop?'Shop mode on, ticked items hidden':'Shop mode off'});
$('#sh').addEventListener('click',function(){var b=this,t=L.map(function(i){return (i.d?'[x] ':'[ ] ')+i.n+(i.q?' ('+i.q+')':'')}).join('\n');var ok=function(){b.textContent='Copied';setTimeout(function(){b.textContent='Share list'},1500)};try{navigator.clipboard.writeText(t).then(ok,function(){b.textContent='Blocked'})}catch(e){b.textContent='Blocked'}});

document.querySelector('[name=st][value="'+store+'"]').checked=true;render();
})();
