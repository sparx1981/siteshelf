<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meditation Timer — App UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--pc:#7be0ff}
body{margin:0;min-height:100vh;background:#0f1426;color:#eaeefc;font:400 16px/1.5 Outfit,system-ui,sans-serif;overflow-x:hidden;position:relative}
.bgp{position:fixed;inset:0;z-index:0;pointer-events:none}.bgp svg{width:100%;height:100%;display:block}
.bgp:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(15,20,38,.35),rgba(15,20,38,.65))}
.bloom{position:fixed;left:50%;bottom:-10%;width:60vw;height:50vh;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 20%,color-mix(in srgb,var(--pc) 45%,transparent),transparent 65%);opacity:.5;pointer-events:none;transition:background .8s;z-index:0}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #0f1426}
.w{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:40px 22px 56px}
.eb{font:600 13px Outfit;letter-spacing:.18em;text-transform:uppercase;color:#7be0ff;margin:0 0 10px}
h1{font:600 clamp(36px,6vw,64px)/1.02 "Cormorant Garamond",serif;margin:0 0 8px;text-shadow:0 2px 20px rgba(0,0,0,.4)}.lead{color:#c4cdee;margin:0 0 26px;font-size:18px}
.g{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px;align-items:start}
.sg,.pn{background:rgba(23,29,54,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #2a3358;border-radius:24px;padding:24px;min-width:0}
.sg{text-align:center}
.cv{position:relative;width:min(380px,100%);aspect-ratio:1;margin:0 auto}
.pr{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.pr circle{fill:none;stroke-width:3}.pr .a{stroke:#2a3358}.pr .b{stroke:var(--pc);stroke-linecap:round;transition:stroke .6s}
.ci{position:absolute;left:50%;top:50%;width:min(300px,76vw);aspect-ratio:1;margin:calc(min(300px,76vw)/-2) 0 0 calc(min(300px,76vw)/-2);border-radius:50%;transform:scale(var(--s,.55));will-change:transform}
.ci i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--pc) 70%,#fff),var(--pc) 55%,color-mix(in srgb,var(--pc) 40%,#0f1426));box-shadow:0 0 80px color-mix(in srgb,var(--pc) 50%,transparent);transition:background .8s,box-shadow .8s}
.ci i:nth-child(2){inset:-14%;background:none;border:2px solid color-mix(in srgb,var(--pc) 45%,transparent);box-shadow:none;opacity:.7}.ci i:nth-child(3){inset:-30%;background:none;border:1.5px solid color-mix(in srgb,var(--pc) 25%,transparent);box-shadow:none;opacity:.6}
.nm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:600 64px/1 "Cormorant Garamond",serif;color:#04202a;font-variant-numeric:tabular-nums;pointer-events:none}
.fl{position:absolute;inset:0;border-radius:50%;background:#fff;opacity:0;pointer-events:none}.fl.go{animation:fh 1.2s ease-out}@keyframes fh{from{opacity:.5}to{opacity:0}}
.ph{font:600 40px/1.1 "Cormorant Garamond",serif;margin:8px 0 2px;min-height:44px;transition:color .6s;color:var(--pc)}
.tm{font:500 56px/1 "Cormorant Garamond",serif;font-variant-numeric:tabular-nums;color:#eaeefc}.sb{color:#a0abd4;font-size:15px;margin:2px 0 14px}
.ac{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bt{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 28px;border-radius:999px;font:600 16px Outfit;min-height:48px;border:1.5px solid #5a6aa8;color:#eaeefc}.bt:hover{background:rgba(255,255,255,.08)}.bt.p{background:#7be0ff;border-color:#7be0ff;color:#04202a}.bt.p:hover{background:#9be9ff}.bt:focus-visible{outline:3px solid #fff;outline-offset:3px}.bt[aria-disabled=true]{opacity:.4;cursor:default}
.pn fieldset{border:0;margin:0 0 18px;padding:0}.pn legend,.pn h2{font:600 12px Outfit;letter-spacing:.14em;text-transform:uppercase;color:#a0abd4;margin:0 0 8px;padding:0}
.ch{display:flex;gap:8px;flex-wrap:wrap}.ch label{position:relative}.ch input{position:absolute;opacity:0;width:1px;height:1px}.ch span{display:block;padding:9px 16px;border-radius:999px;border:1.5px solid #3a4676;font-weight:500;cursor:pointer;min-height:42px}.ch input:checked+span{background:#eaeefc;color:#0f1426;border-color:#eaeefc}.ch input:focus-visible+span{outline:3px solid #7be0ff;outline-offset:2px}
.cu{display:flex;gap:8px;align-items:center;margin-top:8px}.cu input{width:84px;font:500 16px Outfit;padding:8px 10px;border-radius:10px;border:1.5px solid #3a4676;background:#0f1426;color:#eaeefc;min-height:42px}
.pt{display:grid;gap:8px}.pt label{position:relative}.pt input{position:absolute;opacity:0;width:1px;height:1px}.pt span{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-radius:14px;border:1.5px solid #3a4676;cursor:pointer;align-items:center}.pt b{font-weight:600}.pt small{color:#a0abd4;grid-column:1}.pt svg{grid-row:1/3;grid-column:2;width:70px;height:28px}
.pt input:checked+span{border-color:#7be0ff;background:rgba(123,224,255,.08)}.pt input:focus-visible+span{outline:3px solid #7be0ff;outline-offset:2px}
.sw{display:flex;gap:10px;align-items:center;margin:6px 0;cursor:pointer;font-weight:500}.sw input{position:absolute;opacity:0;width:1px;height:1px}.sw i{width:44px;height:26px;border-radius:13px;background:#3a4676;position:relative;transition:background .2s;flex:none}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}.sw input:checked+i{background:#7be0ff}.sw input:checked+i:after{transform:translateX(18px)}.sw input:focus-visible+i{outline:3px solid #fff;outline-offset:3px}
.lg{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:170px;overflow:auto}.lg li{display:flex;justify-content:space-between;gap:10px;background:#0f1426;border-radius:10px;padding:9px 12px;font-size:14px}.lg li span{color:#a0abd4}.lg .ok{color:#7be0ff;font-weight:600}.lg .no{color:#ffc3a0;font-weight:600}
.cl{all:unset;cursor:pointer;color:#a0abd4;text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:6px 2px;margin-left:8px}.cl:focus-visible{outline:3px solid #fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.g{grid-template-columns:minmax(0,1fr)}.w{padding:28px 14px 44px}.nm{font-size:52px}}
@media (prefers-reduced-motion:reduce){.ci{transform:scale(.8)!important}.ci i{box-shadow:none}.fl.go{animation:none}.ph{transition:none}.bloom{display:none}}
</style></head><body>
<div class="bgp" id="bgp" aria-hidden="true"></div><div class="bloom" aria-hidden="true"></div>
<div class="w"><p class="eb">Stillwater</p><h1>Breathe for a few minutes.</h1><p class="lead">Follow the circle. In when it grows, out when it shrinks. That is all there is to it.</p>
<div class="g"><section class="sg" aria-label="Breathing session"><div class="cv" id="cv" role="timer" aria-label="Meditation timer, ready"><svg class="pr" viewBox="0 0 100 100" aria-hidden="true"><circle class="a" cx="50" cy="50" r="48"/><circle class="b" id="rg" cx="50" cy="50" r="48" stroke-dasharray="301.6" stroke-dashoffset="301.6"/></svg><div class="ci" id="ci" aria-hidden="true"><i></i><i></i><i></i><span class="fl" id="fl"></span></div><div class="nm" id="nm" aria-hidden="true"></div></div>
<div class="ph" id="ph" aria-hidden="true">Ready</div><div class="tm" id="tm">05:00</div><p class="sb" id="sb">Calm pattern · 5 minutes</p>
<div class="ac"><button class="bt p" id="st" type="button">Start</button><button class="bt" id="en" type="button" aria-disabled="true">End</button></div></section>
<aside class="pn"><fieldset id="fs" style="border:0;padding:0;margin:0"><fieldset><legend>Duration</legend><div class="ch"><label><input type="radio" name="d" value="5" checked><span>5 min</span></label><label><input type="radio" name="d" value="10"><span>10 min</span></label><label><input type="radio" name="d" value="20"><span>20 min</span></label><label><input type="radio" name="d" value="c"><span>Custom</span></label></div><div class="cu" id="cu" hidden><label for="cm">Minutes</label><input id="cm" type="number" min="1" max="60" value="7"></div></fieldset>
<fieldset><legend>Breathing pattern</legend><div class="pt"><label><input type="radio" name="p" value="calm" checked><span><b>Calm</b><svg viewBox="0 0 70 28" aria-hidden="true"><path d="M2 24Q18 2 35 24T68 24" fill="none" stroke="#7be0ff" stroke-width="2"/></svg><small>In 5 s, out 5 s</small></span></label><label><input type="radio" name="p" value="box"><span><b>Box</b><svg viewBox="0 0 70 28" aria-hidden="true"><path d="M2 24L18 4H34L50 24H68" fill="none" stroke="#b79cff" stroke-width="2"/></svg><small>In 4, hold 4, out 4, hold 4</small></span></label><label><input type="radio" name="p" value="relax"><span><b>Relax</b><svg viewBox="0 0 70 28" aria-hidden="true"><path d="M2 24L16 4H38L68 24" fill="none" stroke="#ffc3a0" stroke-width="2"/></svg><small>In 4, hold 7, out 8</small></span></label></div></fieldset>
<fieldset><legend>Interval bell</legend><div class="ch"><label><input type="radio" name="b" value="0" checked><span>None</span></label><label><input type="radio" name="b" value="2"><span>Every 2 min</span></label><label><input type="radio" name="b" value="5"><span>Every 5 min</span></label></div><label class="sw"><input type="checkbox" id="ch"><i></i>Soft chime sound</label><label class="sw"><input type="checkbox" id="vb"><i></i>Gentle vibration</label><label class="sw"><input type="checkbox" id="sc" checked><i></i>Screen reader cues</label></fieldset></fieldset>
<h2>Session log <button class="cl" id="cl" type="button">Clear</button></h2><ul class="lg" id="lg"></ul></aside></div></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<script>/*SCENES-START*/
var SC=(function(){
 var uid=0,s=1;function id(p){return p+(++uid)}

 function grad(i,stops,vert){var n=stops.length;return '<linearGradient id="'+i+'" x1="0" y1="0" x2="'+(vert===false?1:0)+'" y2="'+(vert===false?0:1)+'">'+stops.map(function(c,k){return '<stop offset="'+(k/(n-1)).toFixed(2)+'" stop-color="'+c+'"/>'}).join('')+'</linearGradient>'}

 function landscape(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),g2=id('sn');var sunY=o.sunY!=null?o.sunY:h*.52,sunX=o.sunX!=null?o.sunX:w*(.3+r()*.4);

  var bases=[h*.56,h*.64,h*.74,h*.86];P.ridge.forEach(function(col,i){out+=ridge(r,w,bases[i],h*(.07+i*.01),col,.5-i*.08);if(i<P.ridge.length-1){var mi=id('ms');out+='<defs><linearGradient id="'+mi+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P.mist+'" stop-opacity="0"/><stop offset="1" stop-color="'+P.mist+'" stop-opacity=".45"/></linearGradient></defs><rect y="'+(bases[i]-10)+'" width="'+w+'" height="'+(h*.2)+'" fill="url(#'+mi+')"/>'}});

 function city(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'night'],r=R(seed),g=id('sk');var out='<defs>'+grad(g,P.sky)+'</defs><rect width="'+w+'" height="'+h+'" fill="url(#'+g+')"/>';
