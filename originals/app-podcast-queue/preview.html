<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast Queue Player — App UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#14110f;color:#f6efe6;font:500 15px/1.5 Manrope,system-ui,sans-serif;overflow-x:hidden;position:relative}
.bg{position:fixed;inset:-10%;z-index:0;filter:blur(60px) saturate(1.2);opacity:.38;pointer-events:none}.bg .l{position:absolute;inset:0;transition:opacity .7s}.bg svg{width:100%;height:100%;display:block}
.bg.dr{animation:dr 40s ease-in-out infinite alternate}@keyframes dr{to{transform:translate(2%,-2%) scale(1.06)}}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #14110f}
.w{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:36px 22px 52px}
.eb{font:800 13px Manrope;letter-spacing:.18em;text-transform:uppercase;color:#ffb454;margin:0 0 8px}
.sl{margin:0 0 14px;min-height:30px}.sl span{display:inline-flex;gap:8px;align-items:center;background:rgba(255,180,84,.18);color:#ffd9a8;border-radius:999px;padding:4px 14px;font-weight:700;font-size:13px}
.g{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start}
.gl{background:rgba(29,25,22,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:26px;min-width:0}
.np{display:grid;grid-template-columns:300px minmax(0,1fr);gap:26px}
.cv{width:300px;height:300px;border-radius:20px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);position:relative}.cv svg{width:100%;height:100%;display:block}.cv:after{content:"";position:absolute;inset:0;border-radius:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 40%)}
.ref{width:300px;height:40px;margin-top:-4px;opacity:.25;transform:scaleY(-1);filter:blur(2px);-webkit-mask:linear-gradient(transparent 20%,#000);mask:linear-gradient(transparent 20%,#000);overflow:hidden;border-radius:0 0 20px 20px}.ref svg{width:100%;height:300px;display:block}
.in{min-width:0;display:flex;flex-direction:column}.sh{color:#b3a99a;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase}.in h1{font:700 30px/1.15 Fraunces,serif;margin:4px 0 12px;letter-spacing:-.01em}
.cp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.cp button{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.2);font-weight:700;font-size:12.5px;min-height:36px;display:inline-flex;align-items:center}.cp button[aria-current=true]{background:#ffb454;color:#2a1700;border-color:#ffb454}.cp button:hover{background:rgba(255,255,255,.1)}.cp button[aria-current=true]:hover{background:#ffc274}.cp button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sb{position:relative;height:30px;display:flex;align-items:center;cursor:pointer;touch-action:none;margin:0 6px}
.sb .tr{position:absolute;left:0;right:0;height:6px;border-radius:3px;background:rgba(255,255,255,.16)}.sb .bf{position:absolute;left:0;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}.sb .fl{position:absolute;left:0;height:6px;border-radius:3px;background:#ffb454}.sb .ck{position:absolute;top:8px;width:2px;height:14px;background:rgba(255,255,255,.5)}
.sb .th{position:absolute;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);top:6px;pointer-events:none}.sb:focus-visible{outline:3px solid #fff;outline-offset:6px;border-radius:6px}
.sb .pv{position:absolute;top:-30px;transform:translateX(-50%);background:#fff;color:#14110f;font:800 12px Manrope;border-radius:6px;padding:2px 8px;opacity:0;pointer-events:none;font-variant-numeric:tabular-nums}.sb.hv .pv{opacity:1}
.tm{display:flex;justify-content:space-between;font-size:13px;color:#b3a99a;font-variant-numeric:tabular-nums;font-weight:700;margin:2px 6px 10px}
.tp{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}.tp button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;position:relative}.tp button:hover{background:rgba(255,255,255,.1)}.tp button:focus-visible{outline:3px solid #fff;outline-offset:2px}.tp svg{width:26px;height:26px;fill:currentColor}.tp .n{font:800 10px Manrope;position:absolute;bottom:6px}
.tp .pl{width:72px;height:72px;background:#ffb454;color:#2a1700}.tp .pl:hover{background:#ffc274}.tp .pl svg{width:32px;height:32px}
.ex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.ex button,.ex select{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.22);font-weight:700;font-size:13.5px;min-height:40px;position:relative;background:transparent;color:inherit}.ex button:hover{background:rgba(255,255,255,.1)}.ex button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.vl{display:flex;gap:8px;align-items:center;margin-left:auto;font-size:13px;color:#b3a99a;font-weight:700}input[type=range]{accent-color:#ffb454;width:100px;height:28px}
.mn{position:absolute;z-index:20;background:#2a2420;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:6px;box-shadow:0 20px 40px -10px rgba(0,0,0,.6);min-width:150px}.mn button{all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:700;min-height:44px}.mn button:hover,.mn button:focus-visible{background:rgba(255,255,255,.1)}.mn button:focus-visible{outline:3px solid #fff;outline-offset:-3px}.mn button[aria-checked=true]{color:#ffb454}
.qh{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}.qh h2{font:700 20px Fraunces,serif;margin:0}.qh span{color:#b3a99a;font-size:13px;font-weight:700}
.q{list-style:none;margin:0;padding:0;display:grid;gap:6px;position:relative}
.qi{display:grid;grid-template-columns:32px 44px minmax(0,1fr) auto 44px;gap:10px;align-items:center;padding:6px 6px 6px 4px;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid transparent;position:relative;transition:transform .18s}
.qi.cur{border-color:#ffb454;background:rgba(255,180,84,.1)}.qi.lift{z-index:5;box-shadow:0 14px 30px rgba(0,0,0,.5);background:#2a2420;transition:none}
.hd{all:unset;box-sizing:border-box;width:32px;height:44px;display:grid;place-items:center;cursor:grab;color:#b3a99a;touch-action:none;border-radius:8px}.hd:hover{color:#fff}.hd:focus-visible{outline:3px solid #fff;outline-offset:-2px}.hd svg{width:16px;height:16px;fill:currentColor}
.qi .tn{width:44px;height:44px;border-radius:10px;overflow:hidden}.qi .tn svg{width:100%;height:100%;display:block}
.qi button.tt{all:unset;cursor:pointer;min-width:0;display:block}.qi button.tt:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:6px}.qi b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}.qi small{color:#b3a99a;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.qi .du{font-size:12.5px;color:#b3a99a;font-variant-numeric:tabular-nums;font-weight:700}
.qm{all:unset;box-sizing:border-box;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:20px;color:#b3a99a;position:relative}.qm:hover{background:rgba(255,255,255,.1);color:#fff}.qm:focus-visible{outline:3px solid #fff;outline-offset:-2px}
.sg{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}.sg button{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 14px;border-radius:999px;border:1.5px dashed rgba(255,255,255,.3);font-weight:700;font-size:13px;min-height:40px}.sg button:hover{background:rgba(255,255,255,.08)}.sg button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:#f6efe6;color:#14110f;padding:10px 20px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.g{grid-template-columns:minmax(0,1fr)}.np{grid-template-columns:minmax(0,1fr);justify-items:center}.cv,.ref{width:min(300px,70vw);height:min(300px,70vw)}.ref{height:40px}.in{width:100%}.w{padding:26px 14px 44px}.vl{margin-left:0}}
@media (prefers-reduced-motion:reduce){.bg.dr{animation:none}.bg .l,.qi,.toast{transition:none}}
</style></head><body>

<div class="ex"><span style="position:relative"><button type="button" id="spd" aria-haspopup="menu" aria-expanded="false">Speed 1×</button></span><span style="position:relative"><button type="button" id="slp" aria-haspopup="menu" aria-expanded="false">Sleep: Off</button></span><label class="vl">Volume <input type="range" id="vo" min="0" max="100" value="80" aria-label="Volume"></label></div></div></section>
<section class="gl" aria-labelledby="qh"><div class="qh"><h2 id="qh">Up next</h2><span id="qc"></span></div><ol class="q" id="q"></ol><div class="sg" id="sg" aria-label="Add an episode"></div></section></div></div>
<div class="toast" id="toast" role="status"></div><div class="sr" id="live" role="status" aria-live="polite"></div>
<script>/*SCENES-START*/
var SC=(function(){
 var uid=0,s=1;function id(p){return p+(++uid)}

 function grad(i,stops,vert){var n=stops.length;return '<linearGradient id="'+i+'" x1="0" y1="0" x2="'+(vert===false?1:0)+'" y2="'+(vert===false?0:1)+'">'+stops.map(function(c,k){return '<stop offset="'+(k/(n-1)).toFixed(2)+'" stop-color="'+c+'"/>'}).join('')+'</linearGradient>'}
 function grain(op){var i=id('gn');return '<filter id="'+i+'" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .6 0"/></filter><rect width="100%" height="100%" filter="url(#'+i+')" opacity="'+(op==null?.22:op)+'" style="mix-blend-mode:overlay"/>'}

 function ridge(r,w,base,amp,col,rough,id2){var d='M0 '+(base+amp)+' ',x=0,y;var pts=[];var n=Math.round(w/16);var ph=r()*6;for(var i=0;i<=n;i++){var xx=i/n*w,v=Math.sin(i*.35+ph)*.5+Math.sin(i*.9+ph*2)*.25+(r()-.5)*rough;pts.push([xx,base-v*amp])}d='M0 '+(base+amp*3)+' L'+pts.map(function(p){return p[0].toFixed(0)+' '+p[1].toFixed(1)}).join(' L')+' L'+w+' '+(base+amp*3)+'Z';return '<path d="'+d+'" fill="'+col+'"/>'}
 function landscape(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),g2=id('sn');var sunY=o.sunY!=null?o.sunY:h*.52,sunX=o.sunX!=null?o.sunX:w*(.3+r()*.4);

  var bases=[h*.56,h*.64,h*.74,h*.86];P.ridge.forEach(function(col,i){out+=ridge(r,w,bases[i],h*(.07+i*.01),col,.5-i*.08);if(i<P.ridge.length-1){var mi=id('ms');out+='<defs><linearGradient id="'+mi+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P.mist+'" stop-opacity="0"/><stop offset="1" stop-color="'+P.mist+'" stop-opacity=".45"/></linearGradient></defs><rect y="'+(bases[i]-10)+'" width="'+w+'" height="'+(h*.2)+'" fill="url(#'+mi+')"/>'}});

 function city(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'night'],r=R(seed),g=id('sk');var out='<defs>'+grad(g,P.sky)+'</defs><rect width="'+w+'" height="'+h+'" fill="url(#'+g+')"/>';

   var step=wl?11:16;for(var yy=base-bh+10;yy<base-4;yy+=step){for(var xx=x+6;xx<x+bw-8;xx+=step){if(r()>(wl?.55:.7))out+='<rect x="'+xx.toFixed(0)+'" y="'+yy.toFixed(0)+'" width="4" height="6" fill="'+(r()>.6?'#ffe2a0':'#ffc66e')+'" opacity="'+(.5+r()*.5).toFixed(2)+'"/>'}}x+=bw+2+r()*6}

function sl(){var t='Off';if(sleep===-1)t='End of episode';else if(sleep>0&&sleepAt){var l=Math.max(0,Math.round((sleepAt-Date.now())/60000));t=l+' min'}$('#slp').textContent='Sleep: '+t;$('#sl').innerHTML=sleep?'<span>🌙 Sleep timer: '+t+' left</span>':''}
function toast(m){$('#toast').textContent=m;$('#toast').classList.add('on');setTimeout(function(){$('#toast').classList.remove('on')},2200)}
$('#pl').addEventListener('click',function(){play(!playing)});
function seek(s,say){var e=ep(cur);pos=Math.max(0,Math.min(e.d-1,s));ui();save();if(say)live.textContent=words(pos)}
$('#b15').addEventListener('click',function(){seek(pos-15)});$('#f30').addEventListener('click',function(){seek(pos+30)});
$('#nx').addEventListener('click',function(){if(cur<Q.length-1){var p=playing;load(cur+1);if(p)play(true);live.textContent='Next: '+ep(cur).t}});
$('#pv2').addEventListener('click',function(){if(pos>3){seek(0)}else if(cur>0){var p=playing;load(cur-1);if(p)play(true)}});
$('#cp').addEventListener('click',function(e){var b=e.target.closest('button');if(b)seek(+b.dataset.t,true)});
var drag=false;function sx(e){var r=$('#sb').getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))}
$('#sb').addEventListener('pointerdown',function(e){drag=true;$('#sb').setPointerCapture(e.pointerId);seek(sx(e)*ep(cur).d);$('#sb').focus({preventScroll:true})});
$('#sb').addEventListener('pointermove',function(e){var k=sx(e);$('#pv').style.left=(k*100)+'%';$('#pv').textContent=fmt(k*ep(cur).d);$('#sb').classList.add('hv');if(drag)seek(k*ep(cur).d)});
$('#sb').addEventListener('pointerleave',function(){$('#sb').classList.remove('hv')});['pointerup','pointercancel'].forEach(function(n){$('#sb').addEventListener(n,function(){drag=false})});
$('#sb').addEventListener('keydown',function(e){var k=e.key,d=null;if(k==='ArrowRight'||k==='ArrowUp')d=e.shiftKey?30:5;else if(k==='ArrowLeft'||k==='ArrowDown')d=e.shiftKey?-30:-5;else if(k==='PageUp')d=60;else if(k==='PageDown')d=-60;else if(k==='Home'){e.preventDefault();seek(0,true);return}else if(k==='End'){e.preventDefault();seek(ep(cur).d-1,true);return}if(d!==null){e.preventDefault();seek(pos+d,true)}});
document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.closest&&e.target.closest('.mn'))return;if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();play(!playing)}else if(e.key==='j'||e.key==='J')seek(pos-15,true);else if(e.key==='l'||e.key==='L')seek(pos+30,true);else if(e.key==='n'||e.key==='N')$('#nx').click()});
$('#vo').addEventListener('input',function(){vol=+this.value});
/* menus */
var menu=null;function closeM(back){if(menu){var t=menu.t;menu.el.remove();t.setAttribute('aria-expanded','false');menu=null;if(back)t.focus()}}
function openM(btn,items,cb,checked){closeM();var m=document.createElement('div');m.className='mn';m.setAttribute('role','menu');m.innerHTML=items.map(function(it,i){return '<button type="button" role="menuitemradio" aria-checked="'+(checked===i)+'" data-i="'+i+'">'+it+'</button>'}).join('');btn.parentNode.appendChild(m);m.style.top='calc(100% + 6px)';m.style.left='0';btn.setAttribute('aria-expanded','true');menu={el:m,t:btn};var fs=[].slice.call(m.children);(fs[checked]||fs[0]).focus();
 m.addEventListener('click',function(e){var b=e.target.closest('button');if(b){cb(+b.dataset.i);closeM(true)}});
 m.addEventListener('keydown',function(e){var i=fs.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();fs[(i+1)%fs.length].focus()}else if(e.key==='ArrowUp'){e.preventDefault();fs[(i+fs.length-1)%fs.length].focus()}else if(e.key==='Escape'){e.preventDefault();closeM(true)}else if(e.key==='Tab')closeM(false)})}
document.addEventListener('click',function(e){if(menu&&e.composedPath().indexOf(menu.el)<0&&e.composedPath().indexOf(menu.t)<0)closeM(false)});
var SP=[.8,1,1.2,1.5,1.75,2];$('#spd').addEventListener('click',function(){if(menu&&menu.t===this){closeM(true);return}openM(this,SP.map(function(s){return s+'×'}),function(i){spd=SP[i];$('#spd').textContent='Speed '+spd+'×';ui();live.textContent='Speed '+spd})},SP.indexOf(spd));
$('#spd').addEventListener('click',function(){});
var SL=[['Off',0],['15 min',15],['30 min',30],['45 min',45],['End of episode',-1]];$('#slp').addEventListener('click',function(){if(menu&&menu.t===this){closeM(true);return}openM(this,SL.map(function(s){return s[0]}),function(i){var v=SL[i][1];sleep=v;sleepAt=v>0?Date.now()+v*60000:0;sl();live.textContent='Sleep timer '+SL[i][0]})});
/* queue */
var SUGG=[['Slow mornings (repeat)','The Long Tide'],['Fractions part two','Kitchen Table Maths'],['The spark plug','Quiet Engines']];
function drawQ(){$('#qc').textContent=Q.length+' episodes · '+fmt(Q.reduce(function(a,id,i){return a+EP.filter(function(e){return e.id===id})[0].d},0)/60*0+Q.reduce(function(a,id){return a+EP.filter(function(e){return e.id===id})[0].d},0)).replace(/^(\d+):(\d+):.*/,'$1 h $2 m')+' total';
 $('#q').innerHTML=Q.map(function(id,i){var e=EP.filter(function(x){return x.id===id})[0];return '<li class="qi'+(i===cur?' cur':'')+'" data-i="'+i+'"><button class="hd" type="button" aria-label="Reorder '+e.t+'. Use Alt plus arrow keys or drag." aria-describedby="rh"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="5" cy="3" r="1.4"/><circle cx="11" cy="3" r="1.4"/><circle cx="5" cy="8" r="1.4"/><circle cx="11" cy="8" r="1.4"/><circle cx="5" cy="13" r="1.4"/><circle cx="11" cy="13" r="1.4"/></svg></button><span class="tn" aria-hidden="true">'+e.cv(88)+'</span><button type="button" class="tt" data-play="'+i+'"><b>'+e.t+'</b><small>'+e.sh+(i===cur?' · Now playing':'')+'</small></button><span class="du">'+fmt(e.d)+'</span><span style="position:relative"><button type="button" class="qm" aria-label="More actions for '+e.t+'" aria-haspopup="menu" aria-expanded="false" data-m="'+i+'">⋯</button></span></li>'}).join('')+'<p class="sr" id="rh">Alt plus arrow up or down moves the episode in the queue.</p>';
 $('#sg').innerHTML=SUGG.map(function(s){return '<button type="button">+ '+s[0]+'</button>'}).join('')}
$('#q').addEventListener('click',function(e){var p=e.target.closest('[data-play]');if(p){var i=+p.dataset.play;load(i);play(true);return}var m=e.target.closest('[data-m]');if(m){var i2=+m.dataset.m;if(menu&&menu.t===m){closeM(true);return}openM(m,['Play next','Move to top','Remove'],function(k){var id=Q[i2],c=Q[cur];if(k===0&&i2!==cur){Q.splice(i2,1);var ci=Q.indexOf(c);Q.splice(ci+1,0,id)}else if(k===1){Q.splice(i2,1);Q.unshift(id)}else if(k===2){if(Q.length<2)return;Q.splice(i2,1);if(id===c){cur=Math.min(cur,Q.length-1);load(cur);return}}cur=Q.indexOf(c);if(cur<0)cur=0;drawQ();save();live.textContent='Queue updated'},-1)}});
function move(i,j){if(j<0||j>=Q.length)return;var c=Q[cur],id=Q.splice(i,1)[0];Q.splice(j,0,id);cur=Q.indexOf(c);drawQ();var h=$('#q [data-i="'+j+'"] .hd');if(h)h.focus();live.textContent='Moved to position '+(j+1)+' of '+Q.length;save()}
$('#q').addEventListener('keydown',function(e){var h=e.target.closest('.hd');if(!h)return;var i=+h.closest('.qi').dataset.i;if(e.altKey&&e.key==='ArrowUp'){e.preventDefault();move(i,i-1)}else if(e.altKey&&e.key==='ArrowDown'){e.preventDefault();move(i,i+1)}});
var dr=null;$('#q').addEventListener('pointerdown',function(e){var h=e.target.closest('.hd');if(!h)return;var li=h.closest('.qi'),r=li.getBoundingClientRect();dr={li:li,i:+li.dataset.i,y0:e.clientY,rows:[].slice.call($('#q').querySelectorAll('.qi')),h:r.height+6};li.classList.add('lift');h.setPointerCapture(e.pointerId)});
$('#q').addEventListener('pointermove',function(e){if(!dr)return;var dy=e.clientY-dr.y0;dr.li.style.transform='translateY('+dy+'px)';var to=Math.max(0,Math.min(Q.length-1,dr.i+Math.round(dy/dr.h)));dr.to=to;dr.rows.forEach(function(r,k){if(r===dr.li)return;var sh=0;if(dr.i<to&&k>dr.i&&k<=to)sh=-dr.h;else if(dr.i>to&&k<dr.i&&k>=to)sh=dr.h;r.style.transform=sh?'translateY('+sh+'px)':''})});
function endD(){if(!dr)return;var d=dr;dr=null;d.rows.forEach(function(r){r.style.transform='';r.classList.remove('lift')});if(d.to!=null&&d.to!==d.i)move(d.i,d.to)}
$('#q').addEventListener('pointerup',endD);$('#q').addEventListener('pointercancel',endD);
$('#sg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;toast('Added to the queue (demo)');live.textContent=b.textContent+' added'});
load(0,true);ui(true);
if(!reduce&&!pos){pos=412;ui()}
})();
</script></body></html>
