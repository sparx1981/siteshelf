<style>

.v{all:unset;box-sizing:border-box;display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:6px 12px;border-radius:16px;border:2px solid transparent;cursor:pointer;min-height:58px;position:relative}
.v:hover{background:#f6f7fb}.v[aria-checked=true]{border-color:#3a3fd8;background:#eef0ff}.v:focus-visible{outline:3px solid #14161f;outline-offset:2px}

function carSvg(c){return '<svg class="c" viewBox="0 0 78 50" aria-hidden="true"><ellipse cx="39" cy="42" rx="30" ry="4" fill="rgba(0,0,0,.22)"/><path d="M8 34 q0-10 8-12 l8-8 q4-3 10-3 h12 q6 0 10 4 l8 7 q6 2 6 12 v3 q0 3-3 3 H11 q-3 0-3-3z" fill="'+c+'"/><path d="M26 15 h10 v9 H20z M40 15 h8 q3 1 6 5 l3 4 H40z" fill="#cfe3f2" opacity=".9"/><path d="M8 30 H70" stroke="rgba(255,255,255,.35)" stroke-width="2"/><circle cx="21" cy="39" r="6" fill="#1b1d26"/><circle cx="21" cy="39" r="2.5" fill="#9aa0b0"/><circle cx="58" cy="39" r="6" fill="#1b1d26"/><circle cx="58" cy="39" r="2.5" fill="#9aa0b0"/></svg>'}
var fares={};function calc(i){var rush=$("#rs").checked?1.1:1,f=(2.2+km*VEH[i][3]*.35+mins*.08)*rush;return Math.round(f*10)/10}
function drawV(){$('#vh').innerHTML=VEH.map(function(v,i){var rush=$('#rs').checked;return '<button class="v" type="button" role="radio" aria-checked="'+(i===vsel)+'" tabindex="'+(i===vsel?0:-1)+'" data-i="'+i+'">'+carSvg(v[4])+'<b>'+v[0]+'</b><small>'+v[1]+' · '+(v[2]+(rush?3:0))+' min away</small><span class="fa">£'+calc(i).toFixed(2)+'</span></button>'}).join('');$('#rq').textContent='Request '+VEH[vsel][0]}
$('#vh').addEventListener('click',function(e){var b=e.target.closest('.v');if(b){vsel=+b.dataset.i;drawV();$('#vh [data-i="'+vsel+'"]').focus()}});
$('#vh').addEventListener('keydown',function(e){var n=null;if(e.key==='ArrowDown'||e.key==='ArrowRight')n=(vsel+1)%3;else if(e.key==='ArrowUp'||e.key==='ArrowLeft')n=(vsel+2)%3;if(n!==null){e.preventDefault();vsel=n;drawV();$('#vh [data-i="'+n+'"]').focus()}});
function route(anim){var a=pos(A[0]),b=pos(A[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;var d='M'+a[0]+' '+a[1]+' L'+a[0]+' '+(a[1]+(b[1]-a[1])*.5>520?480:b[1]+(a[1]-b[1])*.3)+' L'+b[0]+' '+(b[1]+(a[1]-b[1])*.3)+' L'+b[0]+' '+b[1];
 d='M'+a[0]+' '+a[1]+' L'+a[0]+' '+((a[1]+b[1])/2).toFixed(0)+' L'+b[0]+' '+((a[1]+b[1])/2).toFixed(0)+' L'+b[0]+' '+b[1];
 var g=$('#rt');g.innerHTML='<path id="rp" d="'+d+'" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path id="rq2" d="'+d+'" stroke="#3a3fd8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle class="pul" cx="'+a[0]+'" cy="'+a[1]+'" r="8" fill="#3a3fd8" opacity=".5"/><circle cx="'+a[0]+'" cy="'+a[1]+'" r="8" fill="#fff" stroke="#14161f" stroke-width="3"/><g transform="translate('+b[0]+' '+b[1]+')"><path d="M0 0 c-12 -14 -14 -26 0 -32 14 6 12 18 0 32z" fill="#3a3fd8"/><rect x="-5" y="-26" width="10" height="10" rx="2" fill="#fff"/></g><g id="car" opacity="0"><rect x="-9" y="-9" width="18" height="18" rx="5" fill="#14161f" stroke="#fff" stroke-width="2"/></g>';
 var p=$('#rq2'),L=p.getTotalLength();km=Math.round(L/62*10)/10+0.9;mins=Math.round(km*2.6+3);$('#tr').textContent=km.toFixed(1)+' km · '+mins+' min';
 if(anim&&!reduce){p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.getBoundingClientRect();p.style.transition='stroke-dashoffset .5s ease';p.style.strokeDashoffset=0}drawV()}
function drawSug(i,q){var l=SUG.filter(function(s){return !q||s[0].toLowerCase().indexOf(q.toLowerCase())>-1||s[1].toLowerCase().indexOf(q.toLowerCase())>-1});$('#ls').innerHTML=l.map(function(s,k){return '<div role="option" id="o'+k+'" data-v="'+s[0]+'" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span>'+s[0]+'<small>'+s[1]+'</small></span></div>'}).join('')||'<div style="padding:12px 14px;color:#5c6275">No matches. Press Enter to use your text.</div>'}
var cur=-1,act=null;
['p0','p1'].forEach(function(id,i){var el=$('#'+id);el.addEventListener('focus',function(){act=i;drawSug(i,'');var sg=$('#sg');sg.hidden=false;sg.style.top=(i===0?'50%':'100%');el.setAttribute('aria-expanded','true');cur=-1;el.select()});
 el.addEventListener('input',function(){drawSug(i,el.value);cur=-1;el.removeAttribute('aria-activedescendant')});
 el.addEventListener('keydown',function(e){var o=[].slice.call($('#ls').querySelectorAll('[role=option]'));if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!o.length)return;cur=(cur+(e.key==='ArrowDown'?1:-1)+o.length)%o.length;o.forEach(function(x,k){x.setAttribute('aria-selected',k===cur)});el.setAttribute('aria-activedescendant',o[cur].id)}else if(e.key==='Enter'){e.preventDefault();pick(i,cur>=0?o[cur].dataset.v:el.value)}else if(e.key==='Escape'){closeSug()}});
 el.addEventListener('blur',function(){setTimeout(function(){if(document.activeElement!==$('#p0')&&document.activeElement!==$('#p1'))closeSug()},120)})});
$('#ls').addEventListener('mousedown',function(e){e.preventDefault()});$('#ls').addEventListener('click',function(e){var o=e.target.closest('[role=option]');if(o)pick(act,o.dataset.v)});
function closeSug(){$('#sg').hidden=true;['p0','p1'].forEach(function(id){$('#'+id).setAttribute('aria-expanded','false')})}
function pick(i,v){v=(v||'').trim();if(!v)return;A[i]=v;$('#p'+i).value=v;closeSug();route(true);live.textContent=(i?'Drop-off':'Pickup')+' set to '+v+'. '+km.toFixed(1)+' kilometres, '+mins+' minutes.'}
$('#sw').addEventListener('click',function(){var t=A[0];A[0]=A[1];A[1]=t;$('#p0').value=A[0];$('#p1').value=A[1];this.classList.toggle('rt');route(true);live.textContent='Pickup and drop-off swapped'});
$('#rs').addEventListener('change',function(){$('#su').hidden=!this.checked;drawV();live.textContent=this.checked?'Rush hour pricing on':'Rush hour pricing off'});
/* sheet drag */
var sh=$('#sh'),state='open',dy=0,sy=0,drag=false;
function setSheet(s){state=s;sh.style.transform=s==='open'?'translateY(0)':'translateY('+(sh.offsetHeight-150)+'px)';$('#hd').setAttribute('aria-expanded',s==='open')}
$('#hd').addEventListener('pointerdown',function(e){drag=true;sy=e.clientY;sh.classList.add('drag');$('#hd').setPointerCapture(e.pointerId)});
$('#hd').addEventListener('pointermove',function(e){if(!drag)return;var base=state==='open'?0:sh.offsetHeight-150,v=Math.max(0,Math.min(sh.offsetHeight-150,base+e.clientY-sy));sh.style.transform='translateY('+v+'px)';dy=e.clientY-sy});
$('#hd').addEventListener('pointerup',function(){if(!drag)return;drag=false;sh.classList.remove('drag');if(Math.abs(dy)>40)setSheet(dy>0?'closed':'open');else setSheet(state);dy=0});
$('#hd').addEventListener('click',function(e){if(Math.abs(dy)<5&&e.detail===0)setSheet(state==='open'?'closed':'open')});
$('#hd').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();setSheet(state==='open'?'closed':'open')}});
/* request */
var timers=[],raf=0;
function cancel(){timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);sh.classList.remove('state-find','state-drv');$('#bn').hidden=true;var c=$('#car');if(c)c.setAttribute('opacity',0);live.textContent='Request cancelled'}
$('#rq').addEventListener('click',function(){sh.classList.add('state-find');live.textContent='Finding your driver';timers.push(setTimeout(function(){sh.classList.remove('state-find');sh.classList.add('state-drv');$('#pt').innerHTML=SC.portrait(7,{w:128,h:128,skin:'#8a5a3a',hair:'#1a1a1a',cloth:'#2f6b4f',bg:'#e4d0d8',long:true});live.textContent='Driver found. Mira is arriving in 4 minutes.';car()},reduce?200:3000))});
$('#cx').addEventListener('click',cancel);$('#cx2').addEventListener('click',cancel);
function car(){var p=$('#rq2'),L=p.getTotalLength(),c=$('#car');c.setAttribute('opacity',1);var t0=performance.now(),D=reduce?1:6000;(function f(t){var k=Math.min(1,(t-t0)/D),pt=p.getPointAtLength(L*(1-k*.9));c.setAttribute('transform','translate('+pt.x+' '+pt.y+')');$('#eta').textContent=Math.max(1,Math.ceil(4*(1-k)));if(k<1)raf=requestAnimationFrame(f)})(t0)}
route(false);drawV();
})();
</script></body></html>
