<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Thermostat — App UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--mc:#ff8a4c}
body{margin:0;min-height:100vh;background:#1b1f27;color:#f4f6fa;font:400 15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden;position:relative}
.rm{position:fixed;inset:0;z-index:0}.rm .l{position:absolute;inset:0;transition:opacity .8s}.rm svg{width:100%;height:100%;display:block}
.rm:after{content:"";position:absolute;inset:0;background:radial-gradient(900px 600px at 50% 50%,rgba(10,12,16,.1),rgba(10,12,16,.55))}
.tn{position:absolute;inset:0;mix-blend-mode:soft-light;transition:background .8s,opacity .8s}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #0f1318}
.w{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:36px 22px 52px}
.eb{font:600 13px Outfit;letter-spacing:.18em;text-transform:uppercase;color:#ffd0a8;margin:0 0 8px}
h1{font:500 clamp(30px,4.6vw,48px)/1.05 Outfit;margin:0 0 20px;letter-spacing:-.01em;text-shadow:0 2px 20px rgba(0,0,0,.45)}
.g{display:grid;grid-template-columns:420px minmax(0,1fr);gap:20px;align-items:start}
.gl{background:rgba(15,19,24,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:22px;min-width:0}
.dl{position:relative;width:min(360px,100%);aspect-ratio:1;margin:0 auto;touch-action:none}
.dl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tk{stroke:rgba(255,255,255,.28);stroke-width:1.2}.tk.b{stroke:rgba(255,255,255,.6);stroke-width:2}
.tr{fill:none;stroke:rgba(255,255,255,.12);stroke-width:14;stroke-linecap:round}.va{fill:none;stroke:var(--mc);stroke-width:14;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--mc));transition:stroke .5s}
.kn{fill:#fff;stroke:var(--mc);stroke-width:5;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.dr{position:absolute;inset:0;border-radius:50%;cursor:pointer;outline:0}.dr:focus-visible{outline:3px solid #fff;outline-offset:6px}
.ct{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:62%}
.tg{font:300 112px/1 Outfit;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.tg sup{font-size:40px;vertical-align:top;position:relative;top:14px;margin-left:2px;font-weight:300}
.md{font:600 15px Outfit;letter-spacing:.14em;text-transform:uppercase;color:var(--mc);margin-top:2px}.nw{color:#aab3c2;font-size:14px;margin-top:6px}
.pm{position:absolute;bottom:4%;display:flex;gap:10px;left:50%;transform:translateX(-50%);z-index:2}.pm button{all:unset;box-sizing:border-box;width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;cursor:pointer;font:500 26px Outfit;user-select:none;touch-action:manipulation}.pm button:hover{background:rgba(255,255,255,.12)}.pm button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.stt{text-align:center;margin-top:10px;font-weight:500;color:#e8ecf4;min-height:24px}
.cd{margin-bottom:14px}.cd h2{font:600 13px Outfit;letter-spacing:.14em;text-transform:uppercase;color:#aab3c2;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.mo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.mo button{all:unset;box-sizing:border-box;display:grid;justify-items:center;gap:4px;padding:10px 4px;border-radius:16px;border:1.5px solid rgba(255,255,255,.2);cursor:pointer;font-weight:600;font-size:13.5px;min-height:64px;transition:background .2s,border-color .2s}.mo button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mo button[aria-checked=true]{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:var(--c);color:#fff}.mo button:hover{background:rgba(255,255,255,.08)}.mo button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ec{display:flex;justify-content:space-between;align-items:center;gap:12px}.ec p{margin:0;color:#aab3c2;font-size:14px}.ec b{color:#7fe0a0}
.sw{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:600}.sw input{position:absolute;opacity:0;width:1px;height:1px}.sw i{width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,.25);position:relative;transition:background .2s;flex:none}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}.sw input:checked+i{background:#7fe0a0}.sw input:checked+i:after{transform:translateX(18px)}.sw input:focus-visible+i{outline:3px solid #fff;outline-offset:3px}
.sc{width:100%;border-collapse:separate;border-spacing:4px;font-size:12.5px}.sc th{font-weight:600;color:#aab3c2;text-align:center;padding:2px}.sc th.d{text-align:left;width:38px}
.sc td button{all:unset;box-sizing:border-box;width:100%;text-align:center;padding:8px 2px;border-radius:10px;background:color-mix(in srgb,var(--c) 28%,rgba(255,255,255,.04));cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;min-height:38px;border:1.5px solid transparent}.sc td button:hover{border-color:rgba(255,255,255,.5)}.sc td button:focus-visible{outline:3px solid #fff;outline-offset:1px}.sc td button.now{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.ed{margin-top:10px;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;flex-wrap:wrap}.ed b{font-weight:600}.ed button{all:unset;box-sizing:border-box;width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;cursor:pointer;font-size:20px}.ed button:hover{background:rgba(255,255,255,.12)}.ed button:focus-visible{outline:3px solid #fff}.ed output{font:500 24px Outfit;min-width:64px;text-align:center}
.ov{display:inline-flex;gap:8px;align-items:center;background:rgba(255,200,120,.2);color:#ffd9a8;border-radius:999px;padding:3px 12px;font-weight:600;font-size:13px}.ov button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.ov button:focus-visible{outline:3px solid #fff}
.en{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:end}.en b{font:500 30px Outfit}.en small{color:#aab3c2;font-size:13px}.en svg{width:100%;height:56px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.g{grid-template-columns:minmax(0,1fr)}.w{padding:26px 14px 44px}.tg{font-size:88px}}
@media (prefers-reduced-motion:reduce){.rm .l,.tn,.va,.mo button{transition:none}}
</style></head><body>

<script>/*SCENES-START*/

$('#dl').addEventListener('pointerdown',function(e){if(e.target.closest('.pm'))return;drag=true;$('#dl').setPointerCapture(e.pointerId);at(e);$('#dr').focus({preventScroll:true})});
$('#dl').addEventListener('pointermove',function(e){if(drag)at(e)});['pointerup','pointercancel'].forEach(function(n){$('#dl').addEventListener(n,function(){drag=false})});
$('#dr').addEventListener('keydown',function(e){var k=e.key,v=S.target,n=null;if(k==='ArrowUp'||k==='ArrowRight')n=v+.5;else if(k==='ArrowDown'||k==='ArrowLeft')n=v-.5;else if(k==='PageUp')n=v+2;else if(k==='PageDown')n=v-2;else if(k==='Home')n=MIN;else if(k==='End')n=MAX;if(n!==null){e.preventDefault();set(n,true)}});
function hold(btn,d){var t1,t2,n=0;function stop(){clearTimeout(t1);clearTimeout(t2)}function loop(){set(S.target+d,true);n++;t2=setTimeout(loop,n>8?60:140)}btn.addEventListener('pointerdown',function(e){e.preventDefault();set(S.target+d,true);t1=setTimeout(function(){n=0;loop()},400)});['pointerup','pointerleave','pointercancel','blur'].forEach(function(x){btn.addEventListener(x,stop)});btn.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();set(S.target+d,true)}})}
hold($('#mn'),-.5);hold($('#pl'),.5);
$('#mo').addEventListener('click',function(e){var b=e.target.closest('button');if(b){S.mode=b.dataset.m;render();$('#mo [data-m="'+S.mode+'"]').focus();live.textContent='Mode '+b.textContent}});
$('#mo').addEventListener('keydown',function(e){var ms=MODES.map(function(m){return m[0]}),i=ms.indexOf(S.mode),n=null;if(e.key==='ArrowRight'||e.key==='ArrowDown')n=(i+1)%4;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')n=(i+3)%4;if(n!==null){e.preventDefault();S.mode=ms[n];render();$('#mo [data-m="'+S.mode+'"]').focus()}});
$('#ek').addEventListener('change',function(){S.away=this.checked;render();live.textContent=S.away?'Away mode on':'Away mode off'});
/* schedule */
function col(t){return t<19?'#6fd0ff':t<22?'#ffd27a':'#ff8a4c'}
function now(){var h=new Date().getHours()+new Date().getMinutes()/60,b=h<6.5?3:h<9?0:h<17.5?1:h<22?2:3;return b}
var today=(new Date(2026,9,12).getDay()+6)%7;
function drawS(){$('#sc tbody').innerHTML=DN.map(function(d,i){return '<tr><th class="d" scope="row">'+d+'</th>'+S.sched[i].map(function(t,j){return '<td><button type="button" data-d="'+i+'" data-b="'+j+'" style="--c:'+col(t)+'" class="'+(i===today&&j===1?'now':'')+'" aria-label="'+d+' '+BT[j]+', '+t.toFixed(1)+' degrees. Press to edit.">'+t.toFixed(1)+'°</button></td>'}).join('')+'</tr>'}).join('')}
$('#sc').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.edit=[+b.dataset.d,+b.dataset.b];edit();$('#ed').hidden=false});
function edit(){var e=S.edit;$('#el').textContent=DN[e[0]]+' '+BT[e[1]];$('#eo').textContent=S.sched[e[0]][e[1]].toFixed(1)+'°'}
function ed(d){var e=S.edit;S.sched[e[0]][e[1]]=Math.max(MIN,Math.min(MAX,S.sched[e[0]][e[1]]+d));edit();var f=$('#sc [data-d="'+e[0]+'"][data-b="'+e[1]+'"]');drawS();save()}
$('#em').addEventListener('click',function(){ed(-.5)});$('#ep').addEventListener('click',function(){ed(.5)});$('#ex').addEventListener('click',function(){var e=S.edit;$('#ed').hidden=true;var b=$('#sc [data-d="'+e[0]+'"][data-b="'+e[1]+'"]');if(b)b.focus()});
$('#ed').addEventListener('keydown',function(e){if(e.key==='Escape'){$('#ex').click()}});
$('#rs').addEventListener('click',function(){S.override=false;S.target=S.sched[today][1];render();live.textContent='Schedule resumed'});
/* drift */
setInterval(function(){if(S.mode==='off')return;var e=eff();if(S.mode==='cool'){if(S.now>e+.05)S.now=Math.round((S.now-.1)*10)/10}else{if(S.now<e-.05)S.now=Math.round((S.now+.1)*10)/10;else if(S.now>e+.05)S.now=Math.round((S.now-.05)*100)/100}render()},reduce?1000:3000);
/* sparkline */
(function(){var d=[3.8,4.2,3.1,2.9,3.6,4.4,3.4],mx=5,h='';var pts=d.map(function(v,i){return [i*(140/6),52-v/mx*48]});h='<path d="M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' L')+' L140 56 L0 56Z" fill="rgba(255,138,76,.25)"/><path d="M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' L')+'" stroke="#ff8a4c" stroke-width="2" fill="none" stroke-linejoin="round"/>';$('#sp').innerHTML=h})();
drawS();render();
})();
</script></body></html>
