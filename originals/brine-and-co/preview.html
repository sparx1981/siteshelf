<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brine &amp; Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0f3d4c;color:#fdf6e7;font:400 16px/1.5 'Instrument Sans',system-ui,sans-serif;overflow-x:hidden}
.hero{min-height:100svh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:32px;padding:24px 56px}
.top b{font:400 26px 'DM Serif Display',serif;margin-right:auto}
.top a{color:#fdf6e7;text-decoration:none;font-size:15px}
.top a.p{background:#ff7a45;color:#0f3d4c;font-weight:600;height:40px;padding:0 22px;border-radius:20px;display:inline-flex;align-items:center}
.main{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:56px;padding:32px 56px;align-items:center}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:#ff7a45}
h1{font:400 clamp(52px,8vw,132px)/.95 'DM Serif Display',serif;letter-spacing:-.02em;margin:18px 0 22px}
.l p{max-width:440px;color:rgba(253,246,231,.78);margin:0}
.card{border:1px solid rgba(253,246,231,.35);padding:28px}
.tabs{position:relative;display:flex;gap:28px;border-bottom:1px solid rgba(253,246,231,.2);margin-bottom:8px}
.tabs button{background:none;border:0;color:rgba(253,246,231,.6);font:600 12px 'Instrument Sans';text-transform:uppercase;letter-spacing:.12em;padding:0 0 14px;cursor:pointer}
.tabs button[aria-selected=true]{color:#fdf6e7}
.bar{position:absolute;left:0;bottom:-1px;height:3px;background:#ff7a45;transition:transform .3s,width .3s}
.dish{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid rgba(253,246,231,.15)}
.dish:last-child{border-bottom:0}
.dish h3{font:400 28px/1.15 'DM Serif Display',serif;margin:0}
.dish span{color:rgba(253,246,231,.7);font-size:15px}
.dish b{font-weight:600;white-space:nowrap;padding-top:6px}
#pane{animation:fi .2s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.tick{background:#ff7a45;color:#0f3d4c;height:52px;overflow:hidden;display:flex;align-items:center}
.track{display:flex;white-space:nowrap;font:600 14px 'Instrument Sans';letter-spacing:.1em;animation:mq 40s linear infinite}
.tick:hover .track{animation-play-state:paused}
.track span{padding-right:22px}
@keyframes mq{to{transform:translateX(-50%)}}
@media(max-width:900px){.top{padding:20px}.top a:not(.p){display:none}.main{grid-template-columns:1fr;padding:24px 20px;gap:32px}}
@media(prefers-reduced-motion:reduce){.track{animation:none}.bar{transition:none}#pane{animation:none}}
</style></head><body>
<main class="hero">
<div class="top"><b>Brine &amp; Co.</b><a href="#">Menu</a><a href="#">Book</a><a href="#">Find us</a><a class="p" href="#">Reserve</a></div>
<div class="main"><section class="l"><div class="lab">Fish house, Leith Docks</div><h1>Fresh off the boat, onto the plate.</h1><p>Day-boat catch from Pittenweem, cooked simply over fire or in a hot pan.</p></section>
<section class="card"><div class="tabs" role="tablist" id="tabs"><span class="bar" id="bar"></span></div><div id="pane" role="tabpanel"></div></section></div>
<div class="tick" aria-label="Today's catch"><div class="track" id="tr"></div></div>
</main>
<script>
const M={Raw:[['Orkney Oysters','Six, with shallot vinegar','£18'],['Cured Mackerel','Beetroot, horseradish','£11'],['Scallop Crudo','Lime, chilli, apple','£14']],
Fried:[['Haddock & Chips','Beer batter, mushy peas','£16'],['Salt & Pepper Squid','Lemon mayo','£12'],['Whitebait','Cayenne, tartare','£9']],
Grill:[['Whole Sea Bream','Fennel, salsa verde','£26'],['Monkfish Skewer','Bay leaf, smoked butter','£22'],['Langoustines','Garlic butter, charred lemon','£28']]};
const tabs=document.getElementById('tabs'),bar=document.getElementById('bar'),pane=document.getElementById('pane');
const names=Object.keys(M);let btns=[];
names.forEach((k,i)=>{const b=document.createElement('button');b.role='tab';b.textContent=k;b.id='t'+i;b.addEventListener('click',()=>sel(i));b.addEventListener('keydown',e=>{if(e.key=='ArrowRight')sel((i+1)%3,1);if(e.key=='ArrowLeft')sel((i+2)%3,1)});tabs.appendChild(b);btns.push(b)});
function sel(i,f){btns.forEach((b,j)=>{b.setAttribute('aria-selected',j==i);b.tabIndex=j==i?0:-1});
 bar.style.width=btns[i].offsetWidth+'px';bar.style.transform='translateX('+btns[i].offsetLeft+'px)';
 pane.style.animation='none';pane.offsetHeight;pane.style.animation='';
 pane.innerHTML=M[names[i]].map(d=>'<div class="dish"><div><h3>'+d[0].replace('&','&amp;')+'</h3><span>'+d[1]+'</span></div><b>'+d[2]+'</b></div>').join('');if(f)btns[i].focus()}
sel(0);addEventListener('resize',()=>{const i=btns.findIndex(b=>b.getAttribute('aria-selected')=='true');sel(i)});document.fonts&&document.fonts.ready.then(()=>{const i=btns.findIndex(b=>b.getAttribute('aria-selected')=='true');sel(i)});
const s="TODAY'S CATCH · HADDOCK · MACKEREL · SCALLOPS · LANGOUSTINES · BREAM · ";
document.getElementById('tr').innerHTML=('<span>'+s+'</span>').repeat(16);
</script></body></html>
