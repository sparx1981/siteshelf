<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Month Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--ink:#1d1b17;--mut:#7a7366;--line:#eee9e0;--navy:#1f3a5f}
*{box-sizing:border-box}
body{margin:0;background:#faf8f5;color:var(--ink);font:400 15px/1.45 'Hanken Grotesk',sans-serif;padding:28px}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,2fr) 320px;gap:24px;align-items:start}
.card{background:#fff;border:1px solid #e8e2d8;border-radius:18px;overflow:hidden}
.hd{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:18px 20px}
h1{font:400 40px/1 'Young Serif',serif;margin:0;flex:1 1 auto;letter-spacing:-.01em}
h1 span{color:var(--mut)}
.nv{display:flex;gap:6px}
.b{border:1px solid #e0d9cc;background:#fff;border-radius:10px;min-width:40px;height:40px;padding:0 14px;font:600 14px 'Hanken Grotesk',sans-serif;cursor:pointer;color:var(--ink)}
.b:hover{background:#f6f2ea}.b.p{background:var(--navy);border-color:var(--navy);color:#fff}.b.p:hover{background:#2a4b78}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.wd div{padding:8px 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));transition:opacity .25s,transform .25s}
.g.sw{opacity:0;transform:translateX(12px)}
.c{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 4px;cursor:pointer;background:#fff;text-align:left;font:inherit;display:block;min-width:0;border-top:0;border-left:0;border-radius:0}
.c:nth-child(7n){border-right:0}
.c.we{background:#fcfaf7}.c.om .d{color:#b5ad9e}
.c:hover{background:#f6f2ea}
.c:focus-visible{outline-offset:-3px;position:relative;z-index:1}
.d{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:600;margin-bottom:2px}
.c.td .d{background:var(--navy);color:#fff}
.ev{display:block;width:100%;border:0;border-radius:6px;padding:2px 7px;margin-top:3px;font:600 12px/1.4 'Hanken Grotesk',sans-serif;color:#fff;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev:hover{filter:brightness(1.1)}
.more{display:block;font-size:12px;color:var(--mut);margin-top:3px;padding-left:2px}
.side{padding:20px}
.side h2{font:400 22px 'Young Serif',serif;margin:0 0 14px}
.grp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
.up{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:8px 0;cursor:pointer;font:inherit;color:inherit;border-radius:8px}
.up:hover{background:#faf8f5}
.up i{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.up b{display:block;font-weight:600}.up small{color:var(--mut)}
.none{color:var(--mut)}
dialog{border:1px solid #e8e2d8;border-radius:18px;padding:24px;width:min(420px,calc(100vw - 32px));color:var(--ink)}
dialog::backdrop{background:rgba(29,27,23,.45)}
dialog h2{font:400 24px 'Young Serif',serif;margin:0 0 14px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;margin-bottom:12px}
.f input[type=text],.f input[type=date],.f input[type=time]{border:1px solid #e0d9cc;border-radius:10px;padding:10px 12px;font:inherit;width:100%}
.sws{display:flex;gap:10px;margin:4px 0 18px}
.sws label{position:relative;cursor:pointer}
.sws input{position:absolute;opacity:0}
.sws span{display:block;width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d6cfc1}
.sws input:checked+span{box-shadow:0 0 0 3px var(--ink)}
.sws input:focus-visible+span{box-shadow:0 0 0 3px var(--navy)}
.dr{display:flex;gap:8px;justify-content:flex-end}
.dr .del{margin-right:auto;color:#b91c1c}
.dl .up{cursor:default}
@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}body{padding:14px}h1{font-size:32px}}
@media(max-width:600px){.c{min-height:64px;padding:4px 2px;text-align:center}.ev{display:inline-block;width:8px;height:8px;padding:0;border-radius:50%;margin:3px 1px 0;font-size:0}.more{display:none}.wd div{padding:6px 2px;text-align:center;font-size:11px;letter-spacing:0}.hd{padding:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap">
<section class="card" aria-label="Calendar"><div class="hd"><h1 id="ttl" aria-live="polite"></h1><div class="nv"><button class="b" id="prev" aria-label="Previous month">←</button><button class="b" id="tod">Today</button><button class="b" id="next" aria-label="Next month">→</button></div></div>
<div class="wd" aria-hidden="true"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
<div class="g" id="g" role="grid" aria-labelledby="ttl"></div></section>
<aside class="card side"><button class="b p" id="new" style="width:100%;margin-bottom:18px">New event</button><h2>Upcoming</h2><div id="upc"></div></aside></div>
<dialog id="dlg"><form method="dialog" id="fm"><h2 id="dt">New event</h2><label class="f">Title<input type="text" id="t" required maxlength="40" placeholder="Team lunch"></label><label class="f">Date<input type="date" id="dd" required></label><label class="f">Start time<input type="time" id="tm" value="10:00"></label>
<div class="f" style="margin-bottom:0"><span id="cl">Colour</span></div><div class="sws" role="radiogroup" aria-labelledby="cl" id="sws"></div><div class="dr"><button type="button" class="b del" id="del" hidden>Delete</button><button type="button" class="b" id="cn">Cancel</button><button class="b p" id="sv">Save</button></div></form>
<div id="dl" class="dl" hidden></div></dialog>
<script>
const COL=['#1f3a5f','#e8704f','#6a9a7b','#d9a441','#8a5a9b'];
const $=i=>document.getElementById(i);const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=new Date();let view=new Date(now.getFullYear(),now.getMonth(),1),focus=key(now),opener=null,edit=null,uid=0;
const E=[];const seed=(d,t,time,c)=>E.push({id:++uid,t,time,c,date:key(new Date(now.getFullYear(),now.getMonth(),d))});
[[2,'Design crit','10:00',0],[5,'Dentist','08:30',1],[8,'Sprint planning','09:30',0],[8,'Lunch with Mei','12:30',2],[12,'Launch day','11:00',1],[15,'Payroll','09:00',3],[19,'Book club','19:00',4],[23,'Studio offsite','09:00',2],[27,'Quarterly review','14:00',0]].forEach(a=>seed(...a));
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const evs=k=>E.filter(e=>e.date===k).sort((a,b)=>a.time.localeCompare(b.time));
function build(slide){const g=$('g');if(slide){g.classList.add('sw')}
 setTimeout(()=>{ $('ttl').innerHTML=`${MN[view.getMonth()]} <span>${view.getFullYear()}</span>`;
 const first=new Date(view.getFullYear(),view.getMonth(),1),off=(first.getDay()+6)%7,start=new Date(first);start.setDate(1-off);let h='';
 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d),es=evs(k),om=d.getMonth()!==view.getMonth(),we=i%7>4,td=k===key(now);
  h+=`<div class="c${om?' om':''}${we?' we':''}${td?' td':''}" role="gridcell" tabindex="${k===focus?0:-1}" data-k="${k}" aria-label="${d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}${es.length?', '+es.length+' event'+(es.length>1?'s':''):''}"><span class="d">${d.getDate()}</span>${es.slice(0,3).map(e=>`<button class="ev" data-id="${e.id}" style="background:${COL[e.c]}" tabindex="-1" title="${e.time} ${e.t}">${e.time} ${e.t}</button>`).join('')}${es.length>3?`<span class="more">+${es.length-3} more</span>`:''}</div>`}
 g.innerHTML=h;g.classList.remove('sw');upc()},slide?180:0)}
function upc(){const t=key(now),L=E.filter(e=>e.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,7);let h='',last='';
 L.forEach(e=>{if(e.date!==last){last=e.date;const d=new Date(e.date+'T00:00');h+=`<div class="grp">${e.date===t?'Today':d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</div>`}h+=`<button class="up" data-id="${e.id}"><i style="background:${COL[e.c]}"></i><span><b>${e.t}</b><small>${e.time}</small></span></button>`});
 $('upc').innerHTML=h||'<p class="none">Nothing coming up. Enjoy the quiet.</p>'}
function go(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);focus=key(new Date(view.getFullYear(),view.getMonth(),Math.min(+focus.slice(8),28)));build(true)}
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('tod').onclick=()=>{view=new Date(now.getFullYear(),now.getMonth(),1);focus=key(now);build(true)};
$('sws').innerHTML=COL.map((c,i)=>`<label><input type="radio" name="col" value="${i}" ${i?'':'checked'} aria-label="Colour ${i+1}"><span style="background:${c}"></span></label>`).join('');
function openDlg(k,e,el){opener=el||null;edit=e||null;$('dl').hidden=true;$('fm').hidden=false;$('dt').textContent=e?'Edit event':'New event';$('t').value=e?e.t:'';$('dd').value=e?e.date:k;$('tm').value=e?e.time:'10:00';
 document.querySelector(`#sws input[value="${e?e.c:0}"]`).checked=true;$('del').hidden=!e;$('dlg').showModal();$('t').focus()}
$('g').addEventListener('click',ev=>{const c=ev.target.closest('.c');if(!c)return;const b=ev.target.closest('.ev');focus=c.dataset.k;
 if(matchMedia('(max-width:600px)').matches&&!b){dayList(c.dataset.k,c);return}
 openDlg(c.dataset.k,b?E.find(e=>e.id==b.dataset.id):null,c)});
function dayList(k,el){opener=el;const es=evs(k);$('fm').hidden=true;$('dl').hidden=false;$('dl').innerHTML=`<h2>${new Date(k+'T00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</h2>`+(es.length?es.map(e=>`<button class="up" data-id="${e.id}"><i style="background:${COL[e.c]}"></i><span><b>${e.t}</b><small>${e.time}</small></span></button>`).join(''):'<p class="none">No events.</p>')+`<div class="dr" style="margin-top:12px"><button class="b" id="dcl">Close</button><button class="b p" id="dad">Add event</button></div>`;
 $('dlg').showModal();$('dcl').onclick=()=>$('dlg').close();$('dad').onclick=()=>{$('dlg').close();openDlg(k,null,el)}}
$('dl').addEventListener('click',e=>{const b=e.target.closest('.up');if(b){$('dlg').close();openDlg(null,E.find(x=>x.id==b.dataset.id),opener)}});
$('upc').addEventListener('click',e=>{const b=e.target.closest('.up');if(b)openDlg(null,E.find(x=>x.id==b.dataset.id),b)});
$('g').addEventListener('keydown',e=>{const c=e.target.closest('.c');if(!c||e.target.closest('.ev'))return;const k=c.dataset.k,d=new Date(k+'T00:00');const m={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
 if(m){e.preventDefault();d.setDate(d.getDate()+m);focus=key(d);if(d.getMonth()!==view.getMonth()){view=new Date(d.getFullYear(),d.getMonth(),1);build(false)}else build(false);setTimeout(()=>{const n=$('g').querySelector(`[data-k="${focus}"]`);n&&n.focus()},0)}
 else if(e.key==='PageDown'||e.key==='PageUp'){e.preventDefault();go(e.key==='PageDown'?1:-1);setTimeout(()=>{const n=$('g').querySelector(`[data-k="${focus}"]`);n&&n.focus()},260)}
 else if(e.key==='Enter'||e.key===' '){e.preventDefault();openDlg(k,null,c)}});
$('new').onclick=e=>openDlg(focus,null,e.currentTarget);
$('cn').onclick=()=>$('dlg').close();
$('fm').addEventListener('submit',e=>{e.preventDefault();const t=$('t').value.trim();if(!t)return;const o={t,date:$('dd').value,time:$('tm').value||'09:00',c:+document.querySelector('#sws input:checked').value};
 if(edit)Object.assign(edit,o);else E.push({id:++uid,...o});const d=new Date(o.date+'T00:00');focus=o.date;if(d.getMonth()!==view.getMonth()||d.getFullYear()!==view.getFullYear())view=new Date(d.getFullYear(),d.getMonth(),1);$('dlg').close();build(false)});
$('del').onclick=()=>{const i=E.indexOf(edit);if(i>-1)E.splice(i,1);$('dlg').close();build(false)};
$('dlg').addEventListener('close',()=>{setTimeout(()=>{const n=$('g').querySelector(`[data-k="${focus}"]`);(opener&&document.contains(opener)?opener:n)?.focus?.()},0)});
build(false);
</script></body></html>
