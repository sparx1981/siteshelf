<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peel Corner Cards — Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
@property --s{syntax:"<length>";inherits:true;initial-value:0px}
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--k:1}
body{margin:0;min-height:100vh;background:repeating-linear-gradient(45deg,rgba(0,0,0,.025) 0 2px,transparent 2px 4px),#f2ece0;color:#2a241b;font:400 16px/1.55 Karla,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #2a241b;outline-offset:3px;box-shadow:0 0 0 6px #fff}
.w{max-width:1100px;margin:0 auto;padding:48px 24px 64px}
.eb{font:700 13px Karla;letter-spacing:.16em;text-transform:uppercase;color:#d9482b;margin:0 0 10px}
h1{font:400 clamp(36px,5.6vw,64px)/1 "Young Serif",serif;margin:0 0 12px;letter-spacing:-.01em}.lead{margin:0 0 30px;color:#6a5f4d;font-size:18px;max-width:50ch}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.cd{position:relative;aspect-ratio:4/5;min-height:380px;--c:#d9482b;--s:0px;transition:--s .38s cubic-bezier(.3,1.2,.5,1);filter:drop-shadow(0 18px 24px rgba(60,40,10,.22))}
.cd:nth-child(even){--c:#1f6f54}
.cd:hover,.cd:focus-within,.cd.peek{--s:calc(84px*var(--k))}
.cd.open{--s:calc(190px*var(--k))}
.fc{position:absolute;inset:0;background:#fffdf8;border:1px solid #e2d8c4;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--s)),calc(100% - var(--s)) 100%,0 100%)}
.fc svg{display:block;width:100%;flex:1;min-height:0}
.tx{padding:14px 20px 20px}
.tx h2{font:400 24px/1.1 "Young Serif",serif;margin:0 0 4px}.tx p{margin:0 0 8px;color:#6a5f4d;font-size:15px}.tx b{font-size:18px}
.tx small{position:absolute;right:16px;bottom:14px;font:700 12px Karla;letter-spacing:.06em;text-transform:uppercase;color:#8a7d66}
.un{position:absolute;right:0;bottom:0;width:var(--s);height:var(--s);background:var(--c);clip-path:polygon(100% 0,100% 100%,0 100%);border-bottom-right-radius:22px;color:#fff;overflow:hidden}
.un .v{position:absolute;right:calc(var(--s)*.08);bottom:calc(var(--s)*.12);font:400 calc(var(--s)*.2)/1 "Young Serif",serif;text-align:right;max-width:calc(var(--s)*.6);opacity:calc((var(--s) - 30px)/40px);white-space:nowrap}
.un .co{position:absolute;right:16px;bottom:16px;text-align:right;display:none;max-width:160px}
.cd.open .un .v{display:none}.cd.open .un .co{display:block}
.co b{font:400 28px/1 "Young Serif",serif;display:block;margin-bottom:4px;white-space:nowrap}.co span{font-size:13px;display:block;margin-bottom:8px;font-weight:700}
.co button{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;color:#2a241b;font:700 13px Karla;padding:8px 12px;border-radius:999px;min-height:36px}.co button:hover{background:#f2ece0}.co button:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:none}
.fp{position:absolute;right:0;bottom:0;width:var(--s);height:var(--s);clip-path:polygon(0 0,100% 0,0 100%);background:linear-gradient(135deg,#f4eddc 0,#e7dfcf 55%,#cfc4ac 100%);border-top-left-radius:6px;box-shadow:-6px -6px 14px rgba(0,0,0,.25);pointer-events:none;transform-origin:100% 100%}
.fp:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.65),transparent 55%)}
.pb{all:unset;box-sizing:border-box;position:absolute;right:0;bottom:0;width:calc(72px*var(--k));height:calc(72px*var(--k));cursor:pointer;z-index:3;border-radius:0 0 22px 0}
.pb:focus-visible{outline:3px solid #2a241b;outline-offset:-6px;box-shadow:0 0 0 3px #fff inset;border-radius:0 0 22px 0}
.cl{all:unset;box-sizing:border-box;position:absolute;left:12px;top:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,253,248,.92);display:none;place-items:center;cursor:pointer;z-index:5;font:700 20px Karla;box-shadow:0 2px 8px rgba(0,0,0,.2)}.cd.open .cl{display:grid}.cl:focus-visible{outline:3px solid #2a241b;outline-offset:2px}
.cd.open .pb{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:980px){.g{grid-template-columns:repeat(2,minmax(0,1fr))}:root{--k:.92}}
@media (max-width:600px){.g{grid-template-columns:minmax(0,1fr)}.w{padding:32px 16px 48px}:root{--k:.85}.cd{min-height:400px}}
@media (prefers-reduced-motion:reduce){.cd{transition:none}}
</style></head><body>
<div class="w"><p class="eb">Marlow &amp; Pine</p><h1>Peek under the corner.</h1><p class="lead">Hover or focus a card and its corner curls back. Tap the corner to open the whole offer.</p>
<div class="g" id="g"></div></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var P=[['Linen throw','Stonewashed, heavy and soft','£68','-20%','PINE20','#e9d9c0','<rect x="40" y="70" width="220" height="120" rx="10" fill="#c9b48e"/><path d="M40 100h220M40 130h220M40 160h220" stroke="#b49c70" stroke-width="3"/>'],['Ceramic jug','Hand-glazed in speckled oat','£34','Free delivery','SHIPFREE','#d6e4de','<path d="M110 60h70l16 20v90q0 20-20 20h-70q-20 0-20-20V80z" fill="#f4efe4" stroke="#b9ad92" stroke-width="3"/><path d="M196 90q36 0 36 30t-36 30" fill="none" stroke="#b9ad92" stroke-width="10"/>'],['Brass lamp','A warm, adjustable reading light','£92','2 for 1','TWOLAMPS','#efd8cf','<path d="M150 40l50 70h-100z" fill="#d6a640"/><rect x="146" y="110" width="8" height="70" fill="#a8801e"/><ellipse cx="150" cy="186" rx="40" ry="10" fill="#a8801e"/>'],['Oak stool','Solid oak, pegged joints','£120','-15%','OAK15','#e4dcc9','<ellipse cx="150" cy="80" rx="64" ry="16" fill="#c79a5e"/><path d="M96 90l-14 96M204 90l14 96M150 96v90" stroke="#a97a3f" stroke-width="10" stroke-linecap="round"/>'],['Wool rug','Flat-woven in Pennick Bay','£210','Free gift','RUGGIFT','#dfe3ef','<rect x="50" y="70" width="200" height="120" fill="#6e7fb3"/><rect x="62" y="82" width="176" height="96" fill="none" stroke="#e9d9c0" stroke-width="4"/><path d="M80 130h140" stroke="#e9d9c0" stroke-width="4"/>'],['Glass vase','Green recycled glass','£28','-10%','GREEN10','#dcead9','<path d="M130 50h40v40q30 30 30 60 0 36-50 36t-50-36q0-30 30-60z" fill="#7fb59a" opacity=".85"/>']];
var open=null,live=$('#live');
$('#g').innerHTML=P.map(function(p,i){return '<article class="cd" data-i="'+i+'"><div class="fc"><svg viewBox="0 0 300 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="220" fill="'+p[5]+'"/>'+p[6]+'</svg><div class="tx"><h2>'+p[0]+'</h2><p>'+p[1]+'</p><b>'+p[2]+'</b><small aria-hidden="true">Peel for an offer</small></div></div>'+
 '<div class="un"><span class="v" aria-hidden="true">'+p[3]+'</span><div class="co"><b>'+p[3]+'</b><span>Use code '+p[4]+'</span><button type="button" data-copy="'+p[4]+'">Copy code</button></div></div><div class="fp" aria-hidden="true"></div>'+
 '<button class="pb" type="button" aria-expanded="false" aria-label="Reveal offer for '+p[0]+'"></button><button class="cl" type="button" aria-label="Close offer for '+p[0]+'">×</button></article>'}).join('');
function setOpen(c,v,focus){if(!c)return;var pb=c.querySelector('.pb');c.classList.toggle('open',v);pb.setAttribute('aria-expanded',v);if(v){if(open&&open!==c)setOpen(open,false);open=c;live.textContent='Offer revealed: '+c.querySelector('.co b').textContent+', code '+c.querySelector('.co span').textContent.replace('Use code ','');var b=c.querySelector('.co button');setTimeout(function(){b&&b.focus()},40)}else{if(open===c)open=null;if(focus)pb.focus()}}
$('#g').addEventListener('click',function(e){var c=e.target.closest('.cd');if(!c)return;
 if(e.target.closest('.pb'))setOpen(c,!c.classList.contains('open'));
 else if(e.target.closest('.cl'))setOpen(c,false,true);
 else if(e.target.closest('[data-copy]')){var code=e.target.closest('[data-copy]').dataset.copy,btn=e.target.closest('[data-copy]');
  var done=function(){btn.textContent='Copied';live.textContent='Code '+code+' copied';setTimeout(function(){btn.textContent='Copy code'},1500)};
  try{navigator.clipboard.writeText(code).then(done,function(){fb(code,done)})}catch(x){fb(code,done)}}});
function fb(t,done){try{var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done()}catch(e){live.textContent='Select the code to copy: '+t}}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&open){setOpen(open,false,true)}});
document.addEventListener('click',function(e){if(open&&e.composedPath().indexOf(open)<0)setOpen(open,false)});
var first=document.querySelector('.cd');first.classList.add('peek');function unpeek(){first.classList.remove('peek');document.removeEventListener('pointerdown',unpeek);document.removeEventListener('keydown',unpeek)}document.addEventListener('pointerdown',unpeek);document.addEventListener('keydown',unpeek);first.addEventListener('mouseenter',unpeek);
})();
</script></body></html>
