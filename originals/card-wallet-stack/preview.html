<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet Card Stack — Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(700px 500px at 30% 20%,#f8fafd,transparent 70%),#e9edf3;color:#151a24;font:500 15px/1.5 Manrope,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #151a24;outline-offset:3px;box-shadow:0 0 0 6px #fff}
.w{max-width:1040px;margin:0 auto;padding:48px 24px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:56px;align-items:center;min-height:100vh}
.eb{font:800 13px Manrope;letter-spacing:.16em;text-transform:uppercase;color:#2457ff;margin:0 0 12px}
h1{font:800 clamp(36px,5.2vw,60px)/1.02 Manrope;margin:0 0 14px;letter-spacing:-.03em;max-width:12ch}.lead{color:#4b5668;font-size:18px;max-width:38ch;margin:0}
.wl{background:#f6f8fb;border:1px solid #d8dfe9;border-radius:28px;padding:20px;box-shadow:0 40px 80px -40px rgba(21,26,36,.5);width:400px;min-width:0}
.wh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.wh small{color:#5b6678;font-weight:600;display:block}.wh b{font:800 26px Manrope;letter-spacing:-.02em}
.ad{all:unset;box-sizing:border-box;width:44px;height:44px;border-radius:50%;background:#151a24;color:#fff;display:grid;place-items:center;cursor:pointer;font:600 22px Manrope}.ad:hover{background:#2a3244}.ad:focus-visible{outline:3px solid #2457ff;outline-offset:3px}
.sk{position:relative;transition:height .42s cubic-bezier(.3,1.1,.4,1)}
.cd{all:unset;box-sizing:border-box;position:absolute;left:0;right:0;height:200px;border-radius:22px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));cursor:pointer;overflow:hidden;box-shadow:0 12px 24px -12px rgba(0,0,0,.55);transition:top .42s cubic-bezier(.3,1.1,.4,1),transform .2s;display:block}
.cd:hover{transform:translateY(-2px)}.cd:focus-visible{outline:3px solid #151a24;outline-offset:3px;box-shadow:0 0 0 6px #fff}
.cd.dk{color:#2a1500}.cd.dk .mk i{background:rgba(42,21,0,.55)}.cd.dk:focus-visible{outline-color:#151a24}
.cd .tp{position:absolute;left:20px;right:20px;top:18px;display:flex;justify-content:space-between;align-items:center;height:28px}.cd .nm{font:800 17px Manrope}.cd .bl{font:500 15px "IBM Plex Mono",monospace}
.cd .bd{position:absolute;left:20px;right:20px;top:58px;opacity:0;transition:opacity .25s}.cd.ex .bd{opacity:1;transition-delay:.15s}
.ch{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#f4d27a,#c89a2c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);margin-bottom:14px;position:relative}.ch:after{content:"";position:absolute;inset:6px 10px;border:1px solid rgba(0,0,0,.25);border-radius:3px}
.num{font:500 20px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;margin-bottom:16px}
.ft{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;gap:8px}.ft b{display:block;font:700 15px Manrope}
.mk{position:relative;width:44px;height:28px;flex:none}.mk i{position:absolute;top:0;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.75)}.mk i:first-child{left:0;opacity:.85}.mk i:last-child{left:16px;mix-blend-mode:screen}
.nf{position:absolute;right:62px;top:20px;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;opacity:.8}
.fr{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(220,235,255,.55)),repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 6px,transparent 6px 14px);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;transition:opacity .3s;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:10px;color:#1c3358;font:800 16px Manrope;border-radius:22px}
.cd.fz .fr{opacity:1}.fr svg{width:28px;height:28px;stroke:#1c3358;fill:none;stroke-width:2;stroke-linecap:round}
.dt{margin-top:18px;background:#fff;border:1px solid #e1e6ee;border-radius:20px;padding:16px 18px}
.dt h2{font:800 16px Manrope;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}.dt h2 span{font:500 13px "IBM Plex Mono",monospace;color:#5b6678}
.rw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #eef1f5}
.rw:first-of-type{border-top:0}.rw>span{color:#5b6678}
.sw{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:700}.sw input{position:absolute;opacity:0;width:1px;height:1px}.sw i{width:46px;height:28px;border-radius:14px;background:#b8c1d0;position:relative;transition:background .2s;flex:none}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}.sw input:checked+i{background:#2457ff}.sw input:checked+i:after{transform:translateX(18px)}.sw input:focus-visible+i{outline:3px solid #151a24;outline-offset:3px}
.bs{display:flex;gap:8px;margin:10px 0 12px;flex-wrap:wrap}
.bt{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 14px;border-radius:999px;border:1.5px solid #c6cfdd;font:700 13px Manrope;min-height:40px}.bt:hover{background:#f1f4f9}.bt:focus-visible{outline:3px solid #2457ff;outline-offset:2px}
.tx{list-style:none;margin:0;padding:0}.tx li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #eef1f5;font-size:14px}.tx li:first-child{border-top:0}.tx span{color:#5b6678;font-size:13px;display:block}.tx b{font:500 14px "IBM Plex Mono",monospace}.tx .pl{color:#0e8f6c}
.msg{font-size:13px;color:#0e8f6c;min-height:18px;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.w{grid-template-columns:minmax(0,1fr);gap:24px;padding:32px 16px;min-height:0;justify-items:center}.w>div:first-child{justify-self:stretch}.wl{max-width:100%}}
@media (max-width:440px){.wl{padding:14px;border-radius:22px}.cd{padding:14px 16px}.cd .tp{left:16px;right:16px}.num{font-size:17px}.cd .bd{left:16px;right:16px}.wh b{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="w"><div><p class="eb">Pocketbank</p><h1>Your cards, neatly stacked.</h1><p class="lead">Tap a card to bring it forward. Freeze it in one tap if it goes missing, and thaw it just as quickly.</p></div>
<section class="wl" aria-label="Wallet"><div class="wh"><div><small>Total balance</small><b>£8,420.50</b></div><button class="ad" type="button" aria-label="Add a card">+</button></div>
<div class="sk" id="sk" role="group" aria-label="Your cards"></div>
<div class="dt" id="dt" role="region" aria-live="polite" aria-label="Card details"></div></section></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var C=[{n:'Everyday',a:'#2457ff',b:'#6a96ff',l:'4821',bal:'£1,248.30',cap:['Available','£1,248.30'],full:'5201 7340 9086 4821',exp:'09/29',tx:[['Lantern Bakery','Today, 08:12','-£4.20'],['Kestrel Rail','Yesterday','-£23.80'],['Wren Books','Mon','-£12.99']]},
{n:'Savings',a:'#0e8f6c',b:'#43d1a0',l:'7730',bal:'£5,100.00',cap:['Goal: holiday','£5,100 of £6,000'],full:'5201 7340 2217 7730',exp:'02/30',tx:[['Monthly saving','1 Oct','+£250.00'],['Interest','30 Sep','+£9.12'],['Monthly saving','1 Sep','+£250.00']],pl:1},
{n:'Travel',a:'#ff7a45',b:'#ffc15e',l:'0364',bal:'£672.20',dk:1,cap:['Available','£672.20'],full:'5201 7340 5518 0364',exp:'11/28',tx:[['Harbour Ferries','Sat','-£36.00'],['Saltmarsh Inn','Fri','-£94.50'],['Pier Café','Fri','-£8.40']]},
{n:'Business',a:'#1b1f2a',b:'#434b60',l:'9157',bal:'£1,400.00',cap:['Available','£1,400.00'],full:'5201 7340 7733 9157',exp:'06/27',tx:[['Marlow Print Co.','Thu','-£212.00'],['Client payment','Wed','+£640.00'],['Cloud hosting','Tue','-£29.00']]}];
var frozen={};try{frozen=JSON.parse(localStorage.getItem('pb-frozen')||'{}')||{}}catch(e){}
var ex=0,sk=$('#sk'),cards=[],show=false,showT=null,live=$('#live');
var SN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M4 6.5l16 11M20 6.5l-16 11M9 3l3 3 3-3M9 21l3-3 3 3"/></svg>';
C.forEach(function(c,i){var b=document.createElement('button');b.type='button';b.className='cd'+(c.dk?' dk':'');b.style.setProperty('--a',c.a);b.style.setProperty('--b',c.b);b.setAttribute('aria-expanded','false');b.setAttribute('aria-controls','dt');b.dataset.i=i;b.style.zIndex=i+1;
 b.innerHTML='<span class="tp"><span class="nm">'+c.n+'</span><span class="bl">•••• '+c.l+'</span></span><span class="bd"><span class="ch" style="display:block" aria-hidden="true"></span><svg class="nf" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7a7 7 0 0 1 0 10M12 5a11 11 0 0 1 0 14M16 3a15 15 0 0 1 0 18"/></svg><span class="num" style="display:block">•••• •••• •••• '+c.l+'</span><span class="ft"><span><small>Expires</small><b>'+c.exp+'</b></span><span class="mk" aria-hidden="true"><i></i><i></i></span></span></span><span class="fr" aria-hidden="true">'+SN+'Frozen</span>';
 b.addEventListener('click',function(){select(i===ex&&!allCollapsed?-1:i)});
 b.addEventListener('keydown',function(e){var n=null;if(e.key==='ArrowDown')n=Math.min(3,i+1);else if(e.key==='ArrowUp')n=Math.max(0,i-1);else if(e.key==='Home')n=0;else if(e.key==='End')n=3;if(n!==null){e.preventDefault();cards[n].focus()}});
 sk.appendChild(b);cards.push(b)});
var allCollapsed=false;
function layout(){var y=0,H=200,S=64,gap=-6;cards.forEach(function(b,i){b.style.top=y+'px';var open=!allCollapsed&&i===ex;b.classList.toggle('ex',open);b.setAttribute('aria-expanded',open);b.style.height=H+'px';b.classList.toggle('fz',!!frozen[i]);y+=open?H+8:(allCollapsed?S+10:S);});
 var last=allCollapsed?0:ex,tot=0;sk.style.height=(allCollapsed?(3*(S+10)+H):((function(){var t=0;for(var i=0;i<4;i++)t+=(i===ex?H+8:S);return t-S+H-(ex===3?H-S:0)+ (ex===3?0:0)})()))+'px';}
function select(i){if(i<0){allCollapsed=true}else{allCollapsed=false;ex=i}layout();detail();if(i>=0)live.textContent=C[i].n+' card selected'+(frozen[i]?', frozen':'')}
function detail(){var c=C[ex],i=ex;$('#dt').innerHTML='<h2>'+c.n+'<span>•••• '+c.l+'</span></h2><div class="rw"><span>'+c.cap[0]+'</span><b>'+c.cap[1]+'</b></div><div class="rw"><label class="sw"><input type="checkbox" id="fz" role="switch"'+(frozen[i]?' checked':'')+'><i></i>Freeze card</label><span id="fs">'+(frozen[i]?'Frozen':'Active')+'</span></div>'+
 '<div class="bs"><button class="bt" type="button" id="sn" aria-pressed="'+show+'">'+(show?'Hide number':'Show number')+'</button><button class="bt" type="button" id="cp">Copy number</button></div><div class="msg" id="mg" role="status"></div>'+(show?'<div class="rw" style="border-top:0"><span>Card number</span><b style="font:500 15px \'IBM Plex Mono\',monospace">'+c.full+'</b></div>':'')+
 '<ul class="tx">'+c.tx.map(function(t){return '<li><div>'+t[0]+'<span>'+t[1]+'</span></div><b class="'+(t[2][0]==='+'?'pl':'')+'">'+t[2]+'</b></li>'}).join('')+'</ul>';
 $('#fz').addEventListener('change',function(){frozen[i]=this.checked;try{localStorage.setItem('pb-frozen',JSON.stringify(frozen))}catch(e){}$('#fs').textContent=this.checked?'Frozen':'Active';layout();live.textContent=C[i].n+(this.checked?' card frozen':' card active')});
 $('#sn').addEventListener('click',function(){show=!show;clearTimeout(showT);if(show)showT=setTimeout(function(){show=false;detail()},8000);detail();$('#sn').focus()});
 $('#cp').addEventListener('click',function(){var m=$('#mg'),t=c.full.replace(/ /g,''),ok=function(){m.textContent='Card number copied';setTimeout(function(){m.textContent=''},1800)};try{navigator.clipboard.writeText(t).then(ok,function(){m.textContent='Copy is blocked here'})}catch(e){m.textContent='Copy is blocked here'}})}
layout();detail();
})();
</script></body></html>
