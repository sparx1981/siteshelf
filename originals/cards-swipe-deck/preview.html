<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wander Deck — Swipe Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b2e;--mut:#6b6885;--ok:#10b981;--no:#f43f5e;--ac:#6d28d9}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#fdf2f8,#eef2ff);color:var(--ink);font:15px/1.5 Poppins,system-ui,sans-serif;display:grid;place-items:center;padding:24px 12px;overflow-x:hidden}
.m{display:grid;gap:20px;justify-items:center;width:100%}
h1{margin:0;font-size:22px;font-weight:700}.sub{color:var(--mut);margin:-14px 0 0;font-size:14px}
.dk{position:relative;width:min(340px,86vw);height:min(460px,calc(86vw*1.35));touch-action:pan-y}
.cd{position:absolute;inset:0;border-radius:24px;background:#fff;box-shadow:0 18px 40px #4c1d9526;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;will-change:transform}
.cd.drag{transition:none;cursor:grabbing}
.cd.top{cursor:grab}
.art{flex:1;position:relative;overflow:hidden}.art i{position:absolute;display:block}
.inf{padding:16px 18px 18px;display:grid;gap:4px}
.inf h2{margin:0;font-size:26px;line-height:1.1}.inf span{color:var(--mut);font-size:14px}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.tg b{font-size:12px;font-weight:600;background:#f1effb;color:#4c1d95;border-radius:99px;padding:2px 10px}
.st{position:absolute;top:26px;font:700 28px Poppins;border:4px solid;border-radius:12px;padding:0 12px;opacity:0;letter-spacing:.05em;pointer-events:none;background:#fff9}
.st.l{left:20px;color:var(--ok);transform:rotate(-14deg)}.st.n{right:20px;color:var(--no);transform:rotate(14deg)}
.bt{display:flex;gap:18px;align-items:center}
.bt button{width:58px;height:58px;border-radius:50%;border:0;background:#fff;box-shadow:0 8px 20px #4c1d9526;font-size:24px;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.bt button:hover:not(:disabled){transform:scale(1.08)}.bt button:disabled{opacity:.4;cursor:not-allowed}
.bt .p{color:var(--no)}.bt .l{color:var(--ok)}.bt .u{width:48px;height:48px;font-size:20px;color:var(--ac)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.ct{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.sm{text-align:center;display:grid;gap:14px;justify-items:center;max-width:380px}
.sm .ch{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.sm .ch span{background:#fff;border-radius:99px;padding:6px 16px;font-weight:600;box-shadow:0 4px 12px #4c1d9518}
.sm button{border:0;background:var(--ac);color:#fff;border-radius:99px;min-height:48px;padding:0 26px;font:600 15px Poppins;cursor:pointer}
.kb{color:var(--mut);font-size:12px}
@media(prefers-reduced-motion:reduce){.cd{transition:opacity .2s!important}}
</style></head><body><div class="m"><h1>Wander Deck</h1><p class="sub">Swipe right on places you'd go.</p>
<div class="dk" id="dk" role="list" aria-label="Destination cards"></div>
<div class="sm" id="sm" hidden><h2 style="margin:0">You liked <span id="n">0</span> places</h2><div class="ch" id="ch"></div><button id="rs">Start over</button></div>
<div class="bt" id="bt"><button class="p" id="bp" aria-label="Pass">✕</button><button class="u" id="bu" aria-label="Undo last choice" disabled>↺</button><button class="l" id="bl" aria-label="Like">♥</button></div>
<div class="ct" id="ct"></div><div class="kb">← pass · → like · Backspace undo</div></div>
<div id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden"></div>
<script>
const $=s=>document.querySelector(s),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
const D=[["Lisbon","Portugal","Tiles, trams and custard tarts.",["City","Food","Coast"],["#ffd1a0","#ff7e6b","#5b4b8a"]],["Hokkaido","Japan","Powder snow and hot springs.",["Snow","Onsen","Nature"],["#cfe8ff","#7fb2ff","#2c3e75"]],["Oaxaca","Mexico","Mezcal, markets and mole.",["Culture","Food","Craft"],["#ffe08a","#ef8a3a","#7a2e1c"]],["Tromsø","Norway","Chase the northern lights.",["Arctic","Aurora","Quiet"],["#0e1b3d","#2fb38f","#7b5cd6"]],["Kyoto","Japan","Temples, tea and lantern-lit lanes.",["Culture","Gardens","Slow"],["#ffd6e7","#e46a8f","#3b2a4d"]],["Cape Town","South Africa","Where the mountain meets the sea.",["Coast","Hiking","Wine"],["#b6e5ff","#3fa0d8","#1c3b57"]],["Dolomites","Italy","Jagged peaks and alpine huts.",["Alps","Hiking","Views"],["#e8f1d8","#8cc1a1","#33524a"]],["Reykjavík","Iceland","Geysers, glaciers and good coffee.",["Volcano","Spa","Road trip"],["#d8e3ee","#6e8fb3","#27364a"]]];
let i=0,hist=[];const likes=[];const say=m=>{const l=$("#live");l.textContent="";setTimeout(()=>l.textContent=m,60)};
function card(d,k){const c=document.createElement("div");c.className="cd";c.setAttribute("role","listitem");c.dataset.k=k;const[a,b,e]=d[4];c.innerHTML=`<div class="art" style="background:linear-gradient(180deg,${a},${b} 62%,${e} 62%)"><i style="width:34%;aspect-ratio:1;border-radius:50%;background:#fff8;right:12%;top:12%"></i><i style="left:-10%;bottom:36%;width:70%;height:36%;background:${e};clip-path:polygon(0 100%,35% 10%,60% 70%,80% 30%,100% 100%);opacity:.5"></i></div><span class="st l" aria-hidden="true">LIKE</span><span class="st n" aria-hidden="true">NOPE</span><div class="inf"><h2></h2><span></span><div class="tg">${d[3].map(t=>`<b>${t}</b>`).join("")}</div><span>${d[2]}</span></div>`;c.querySelector("h2").textContent=d[0];c.querySelectorAll(".inf>span")[0].textContent=d[1];return c}
function layout(){const dk=$("#dk");[...dk.children].forEach(c=>{const p=+c.dataset.k-i;c.style.zIndex=10-p;if(p<0)return;if(p>2){c.style.opacity=0;c.style.pointerEvents="none"}else{c.style.opacity=1}if(!c.classList.contains("drag")&&!c.dataset.gone){c.style.transform=`translateY(${p*12}px) scale(${1-p*.05})`}c.classList.toggle("top",p==0);c.setAttribute("aria-hidden",p==0?"false":"true");c.tabIndex=p==0?0:-1})}
function build(){const dk=$("#dk");dk.innerHTML="";D.forEach((d,k)=>dk.append(card(d,k)));i=0;hist=[];likes.length=0;$("#sm").hidden=true;$("#bt").hidden=false;dk.hidden=false;layout();upd();attach()}
function upd(){$("#ct").textContent=i<D.length?`${i+1} of ${D.length}`:"";$("#bu").disabled=!hist.length;$("#bp").disabled=$("#bl").disabled=i>=D.length}
function finish(){$("#dk").hidden=true;$("#bt").hidden=true;$("#ct").textContent="";$("#sm").hidden=false;$("#n").textContent=likes.length;$("#ch").innerHTML=likes.length?likes.map(l=>`<span>${l}</span>`).join(""):'<span style="color:#6b6885">None this time</span>';say(`Deck finished. You liked ${likes.length} places.`)}
function decide(dir,fromDrag){if(i>=D.length)return;const c=$("#dk").children[i],like=dir>0;c.dataset.gone=1;c.classList.remove("drag");if(rm){c.style.opacity=0}else c.style.transform=`translate(${dir*(innerWidth+300)}px,40px) rotate(${dir*28}deg)`;c.style.pointerEvents="none";c.querySelector(".st."+(like?"l":"n")).style.opacity=1;hist.push({like,k:i});if(like)likes.push(D[i][0]);say(`${like?"Liked":"Passed"} ${D[i][0]}`);i++;layout();upd();if(i>=D.length)setTimeout(finish,rm?150:450)}
function undo(){if(!hist.length)return;const h=hist.pop();if(h.like)likes.pop();i=h.k;if(!$("#dk").hidden||true){$("#dk").hidden=false;$("#bt").hidden=false;$("#sm").hidden=true}const c=$("#dk").children[i];delete c.dataset.gone;c.style.opacity=1;c.style.pointerEvents="";c.querySelectorAll(".st").forEach(s=>s.style.opacity=0);layout();upd();say("Undid "+D[i][0])}
function attach(){const dk=$("#dk");let st=null,c=null;dk.onpointerdown=e=>{c=dk.children[i];if(!c||!c.contains(e.target)||i>=D.length)return;st={x:e.clientX,y:e.clientY};c.classList.add("drag");c.setPointerCapture&&c.setPointerCapture(e.pointerId)};
dk.onpointermove=e=>{if(!st||!c)return;const dx=e.clientX-st.x,dy=(e.clientY-st.y)*.4;c.style.transform=`translate(${dx}px,${dy}px) rotate(${Math.max(-15,Math.min(15,dx/12))}deg)`;c.querySelector(".st.l").style.opacity=Math.max(0,Math.min(1,(dx-20)/60));c.querySelector(".st.n").style.opacity=Math.max(0,Math.min(1,(-dx-20)/60))};
const end=e=>{if(!st||!c)return;const dx=e.clientX-st.x;c.classList.remove("drag");if(Math.abs(dx)>110)decide(dx>0?1:-1,true);else{c.style.transform="";c.querySelectorAll(".st").forEach(s=>s.style.opacity=0);layout()}st=null;c=null};dk.onpointerup=end;dk.onpointercancel=end}
$("#bp").onclick=()=>decide(-1);$("#bl").onclick=()=>decide(1);$("#bu").onclick=undo;$("#rs").onclick=build;
document.addEventListener("keydown",e=>{if(e.key=="ArrowLeft"){e.preventDefault();decide(-1)}else if(e.key=="ArrowRight"){e.preventDefault();decide(1)}else if(e.key=="Backspace"||e.key.toLowerCase()=="z"){if(e.target.tagName!="INPUT"){e.preventDefault();undo()}}});
build();
</script></body></html>
