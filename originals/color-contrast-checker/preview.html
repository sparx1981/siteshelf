<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour Contrast Checker — Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--bg:#f5f6f8;--ink:#14171f;--mut:#5d6475;--bd:#dde0e6;--ac:#0b6bcb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 'Manrope',system-ui,sans-serif;padding:32px 16px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.app{max-width:1000px;margin:0 auto}
header{margin-bottom:20px}
header h1{font:800 28px 'Manrope',sans-serif;margin:0;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mut)}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px}
.lab{font:700 12px 'Manrope',sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:block;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:stretch}
.row input[type=color]{width:56px;height:52px;border:1px solid var(--bd);border-radius:10px;padding:3px;background:#fff;cursor:pointer}
.hx{flex:1;min-width:0;font:500 18px 'IBM Plex Mono',monospace;border:2px solid var(--bd);border-radius:10px;padding:0 14px;min-height:52px;text-transform:uppercase;color:var(--ink);background:#fff}
.hx.bad{border-color:#c4301f;background:#fff4f2}
.err{color:#b02a1a;font-size:13px;min-height:20px;margin:4px 0 0}
.swap{display:grid;place-items:center;margin:2px 0}
.swap button{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:#fff;cursor:pointer;font-size:18px;transition:transform .25s}
.swap button:hover{border-color:var(--ac);transform:rotate(180deg)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:0 18px;min-height:46px;font:700 15px 'Manrope',sans-serif;cursor:pointer;margin:12px 0 4px}
.btn:hover{background:var(--ac)}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.pre{border:1px solid var(--bd);border-radius:10px;padding:10px 6px;font:800 15px 'Manrope',sans-serif;cursor:pointer;min-height:44px}
.pre:hover{box-shadow:0 0 0 2px var(--ac)}
.big{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.big b{font:800 clamp(56px,10vw,96px)/1 'Manrope',sans-serif;letter-spacing:-.04em}
.big span{font:700 28px 'Manrope',sans-serif;color:var(--mut)}
.verdict{font:800 18px 'Manrope',sans-serif;margin:2px 0 16px}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bg{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.bg small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.bg strong{font-size:14px}
.res{font:800 13px 'Manrope',sans-serif;padding:4px 10px;border-radius:99px;white-space:nowrap}
.res.p{background:#dff4e6;color:#0e6b32}
.res.f{background:#fde3df;color:#9c2314}
.pv{margin-top:18px;border-radius:14px;padding:22px;border:1px solid var(--bd)}
.pv h2{margin:0 0 6px;font:800 22px 'Manrope',sans-serif}
.pv p{margin:0 0 14px}
.pv .b{border:2px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:8px 16px;font:700 14px 'Manrope',sans-serif;cursor:pointer;margin-right:12px}
.pv a{color:inherit;font-weight:700}
.live{position:absolute;left:-9999px}
@media(max-width:820px){.card{grid-template-columns:minmax(0,1fr);gap:24px}.res-col{order:-1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app"><header><h1>Hueproof</h1><p>Check WCAG contrast for any text and background pair.</p></header>
<div class="card">
<section aria-label="Colours">
<span class="lab" id="l1">Text colour</span>
<div class="row"><input type="color" id="c1" value="#1d4f91" aria-label="Text colour picker"><input class="hx" id="h1" value="#1D4F91" maxlength="7" aria-labelledby="l1" aria-describedby="e1" spellcheck="false" autocomplete="off"></div><p class="err" id="e1" role="alert"></p>
<div class="swap"><button type="button" id="sw" aria-label="Swap text and background colours">⇅</button></div>
<span class="lab" id="l2">Background colour</span>
<div class="row"><input type="color" id="c2" value="#f2f6fc" aria-label="Background colour picker"><input class="hx" id="h2" value="#F2F6FC" maxlength="7" aria-labelledby="l2" aria-describedby="e2" spellcheck="false" autocomplete="off"></div><p class="err" id="e2" role="alert"></p>
<button class="btn" type="button" id="fix">Suggest a fix</button>
<p id="fm" style="margin:6px 0 14px;color:var(--mut);font-size:14px;min-height:21px"></p>
<span class="lab">Presets</span><div class="presets" id="pr"></div>
</section>
<section class="res-col" aria-label="Results">
<span class="lab">Contrast ratio</span>
<div class="big"><b id="ra">0</b><span>:1</span></div><div class="verdict" id="vd"></div>
<div class="badges" id="bd"></div>
<div class="pv" id="pv"><h2>Preview heading</h2><p>This is how body copy looks with your chosen colours. Longer passages are where low contrast hurts the most.</p><button class="b" type="button">Button</button><a href="#">A link</a></div>
</section></div>
<div class="live" id="lv" aria-live="polite"></div></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var fg='#1d4f91',bg='#f2f6fc';
function norm(v){v=v.trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(v))v=v.split('').map(function(c){return c+c}).join('');return /^[0-9a-f]{6}$/i.test(v)?'#'+v.toLowerCase():null}
function rgb(h){return[1,3,5].map(function(i){return parseInt(h.substr(i,2),16)})}
function lum(h){var c=rgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function ratio(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function hsl(h){var c=rgb(h).map(function(v){return v/255}),mx=Math.max.apply(0,c),mn=Math.min.apply(0,c),l=(mx+mn)/2,s=0,hh=0,d=mx-mn;if(d){s=d/(1-Math.abs(2*l-1));if(mx===c[0])hh=((c[1]-c[2])/d)%6;else if(mx===c[1])hh=(c[2]-c[0])/d+2;else hh=(c[0]-c[1])/d+4;hh*=60;if(hh<0)hh+=360}return[hh,s,l]}
function hex(h,s,l){var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r,g,b;
 if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
 return'#'+[r,g,b].map(function(v){return Math.round((v+m)*255).toString(16).padStart(2,'0')}).join('')}
var T=[['Normal text','AA',4.5],['Normal text','AAA',7],['Large text','AA',3],['Large text','AAA',4.5],['UI components','AA',3],['Graphics','AA',3]];
var last='';
function paint(announce){
 var r=ratio(fg,bg),rr=Math.floor(r*100)/100;
 $('#ra').textContent=rr.toFixed(2).replace(/\.00$/,'.0');
 $('#vd').textContent=r>=7?'Excellent contrast':r>=4.5?'Good contrast':r>=3?'Poor contrast — large text only':'Fails every WCAG level';
 $('#bd').innerHTML=T.map(function(t){var p=r>=t[2];return '<div class="bg"><div><strong>'+t[0]+'</strong><small>WCAG '+t[1]+' · '+t[2]+':1</small></div><span class="res '+(p?'p':'f')+'">'+(p?'✓ Pass':'✕ Fail')+'</span></div>'}).join('');
 var pv=$('#pv');pv.style.color=fg;pv.style.background=bg;
 $('#c1').value=fg;$('#c2').value=bg;if(document.activeElement.id!=='h1')$('#h1').value=fg.toUpperCase();if(document.activeElement.id!=='h2')$('#h2').value=bg.toUpperCase();
 var msg='Contrast ratio '+rr.toFixed(2)+' to 1. '+(r>=4.5?'Passes AA for normal text.':r>=3?'Passes AA for large text only.':'Fails AA.');
 if(announce&&msg!==last){clearTimeout(paint.t);paint.t=setTimeout(function(){$('#lv').textContent=msg},350);last=msg}
}
function bind(n,set){var h=$('#h'+n),c=$('#c'+n),e=$('#e'+n);
 h.addEventListener('input',function(){var v=norm(h.value);if(v){h.classList.remove('bad');h.removeAttribute('aria-invalid');e.textContent='';set(v);paint(true)}else{h.classList.add('bad');h.setAttribute('aria-invalid','true');e.textContent='Enter a 3 or 6 digit hex colour, like #1D4F91.'}});
 h.addEventListener('blur',function(){h.classList.remove('bad');e.textContent='';h.removeAttribute('aria-invalid');h.value=(n==='1'?fg:bg).toUpperCase()});
 c.addEventListener('input',function(){set(c.value);h.classList.remove('bad');e.textContent='';paint(true)})}
bind('1',function(v){fg=v});bind('2',function(v){bg=v});
$('#sw').addEventListener('click',function(){var t=fg;fg=bg;bg=t;paint(true)});
$('#fix').addEventListener('click',function(){var m=$('#fm');if(ratio(fg,bg)>=4.5){m.textContent='Already passes AA for normal text — no change needed.';return}
 var a=hsl(fg),bl=lum(bg),dir=bl>.4?-1:1,l=a[2],h=fg;
 for(var i=0;i<100&&ratio(h,bg)<4.5;i++){l=Math.min(1,Math.max(0,l+dir*.01));h=hex(a[0],a[1],l)}
 if(ratio(h,bg)<4.5){var h2=dir<0?'#000000':'#ffffff';h=ratio(h2,bg)>ratio(h,bg)?h2:h}
 fg=h;m.textContent='Adjusted text to '+fg.toUpperCase()+' for '+ratio(fg,bg).toFixed(2)+':1.';paint(true)});
var P=[['#1d4f91','#f2f6fc'],['#767676','#ffffff'],['#ffffff','#0b6bcb'],['#222222','#ffd54a'],['#9aa4b2','#10131a'],['#ffffff','#e06c3c']];
$('#pr').innerHTML=P.map(function(p,i){return '<button class="pre" type="button" data-i="'+i+'" style="color:'+p[0]+';background:'+p[1]+'" aria-label="Preset '+(i+1)+': text '+p[0]+' on '+p[1]+'">Aa</button>'}).join('');
$('#pr').addEventListener('click',function(e){var b=e.target.closest('.pre');if(!b)return;var p=P[+b.dataset.i];fg=p[0];bg=p[1];$('#fm').textContent='';paint(true)});
paint(false);
})();
</script></body></html>
