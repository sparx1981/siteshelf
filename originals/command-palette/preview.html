<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace — Command Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f13;--pn:#16181e;--bd:#262932;--tx:#e7e9ee;--mu:#8a90a0;--ac:#7c8cff;--hv:rgba(124,140,255,.14);--sc:rgba(5,6,10,.62)}
[data-theme=light]{--bg:#f6f7f9;--pn:#fff;--bd:#e3e5ea;--tx:#14161b;--mu:#6a7080;--ac:#4f5df5;--hv:rgba(79,93,245,.1);--sc:rgba(30,34,48,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,sans-serif;transition:background .25s,color .25s}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100svh}
.sb{border-right:1px solid var(--bd);padding:20px 14px;background:var(--pn)}
.sb b{display:block;font-weight:600;font-size:16px;margin:0 8px 18px}
.sb a{display:block;padding:8px 10px;border-radius:8px;color:var(--mu);text-decoration:none}
.sb a.on{background:var(--hv);color:var(--tx)}
main{padding:40px max(20px,5vw)}
h1{font:600 30px/1.2 Inter,sans-serif;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--mu);margin:0 0 28px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.c{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:18px}
.c small{color:var(--mu);display:block}.c strong{font-size:28px;font-weight:600}
.open{display:inline-flex;align-items:center;gap:10px;background:var(--pn);border:1px solid var(--bd);border-radius:999px;padding:9px 16px;color:var(--mu);cursor:pointer;font:inherit}
.open:hover{border-color:var(--ac);color:var(--tx)}
kbd{font:500 12px "JetBrains Mono",ui-monospace,monospace;border:1px solid var(--bd);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--mu);background:var(--bg)}
.scrim{position:fixed;inset:0;background:var(--sc);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;display:none;justify-content:center;align-items:flex-start;padding-top:14vh}
.scrim.on{display:flex}
.pal{width:min(620px,calc(100% - 24px));max-height:70vh;display:flex;flex-direction:column;background:var(--pn);border:1px solid var(--bd);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden;animation:in .16s ease-out}
@keyframes in{from{opacity:0;transform:scale(.97) translateY(-6px)}}
.in{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--bd)}
.in svg{flex:none;color:var(--mu)}
.in input{flex:1;min-width:0;height:58px;background:none;border:0;outline:0;color:var(--tx);font:400 18px Inter,sans-serif}
.res{overflow-y:auto;padding:8px}
.g{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);padding:12px 10px 6px}
.r{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer}
.r[aria-selected=true]{background:var(--hv)}
.ic{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);display:grid;place-items:center;flex:none;font-size:14px;background:var(--bg)}
.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t mark{background:none;color:var(--ac);font-weight:600}
.k{display:flex;gap:4px}
.em{padding:36px 12px;text-align:center;color:var(--mu)}
.ft{display:flex;gap:18px;padding:10px 16px;border-top:1px solid var(--bd);color:var(--mu);font-size:12.5px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(max-width:700px){.app{grid-template-columns:minmax(0,1fr)}.sb{display:none}.ft .h,.k{display:none}.in input{font-size:17px}}
@media(prefers-reduced-motion:reduce){.pal{animation:none}*{transition:none!important}}
</style></head><body>
<div class="app">
 <aside class="sb"><b>◆ Northbeam</b><a class="on" href="#" data-p="Workspace">Workspace</a><a href="#" data-p="Projects">Projects</a><a href="#" data-p="Team">Team</a><a href="#" data-p="Billing">Billing</a></aside>
 <main><h1 id="h">Workspace</h1><p class="sub" id="sub">Everything your team is working on this week.</p>
  <div class="cards" id="cards"><div class="c"><small>Open tasks</small><strong>128</strong></div><div class="c"><small>Active projects</small><strong>9</strong></div><div class="c"><small>Team members</small><strong>14</strong></div></div>
  <button class="open" id="open" type="button">Open command palette <span><kbd>⌘</kbd> <kbd>K</kbd></span></button></main>
</div>
<div class="scrim" id="scrim"><div class="pal" role="dialog" aria-modal="true" aria-label="Command palette">
 <div class="in"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="text" placeholder="Search commands…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="res" aria-label="Search commands"><kbd>esc</kbd></div>
 <div class="res" id="res" role="listbox"></div>
 <div class="ft"><span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> select</span><span class="h"><kbd>esc</kbd> close</span></div>
</div></div>
<div id="toast" role="status"></div>
<script>
(function(){
var cmds=[
{id:'go-ws',g:'Navigation',t:'Go to Workspace',i:'⌂',k:['G','W'],run:function(){nav('Workspace','Everything your team is working on this week.')}},
{id:'go-pr',g:'Navigation',t:'Go to Projects',i:'▤',k:['G','P'],run:function(){nav('Projects','Nine active projects across three teams.')}},
{id:'go-tm',g:'Navigation',t:'Go to Team',i:'☺',k:['G','T'],run:function(){nav('Team','Fourteen people, four time zones.')}},
{id:'go-bl',g:'Navigation',t:'Go to Billing',i:'£',k:['G','B'],run:function(){nav('Billing','Invoices, plans and payment methods.')}},
{id:'new',g:'Actions',t:'New project',i:'+',k:['N'],run:function(){var d=document.createElement('div');d.className='c';d.innerHTML='<small>New project</small><strong>0</strong>';document.getElementById('cards').appendChild(d);toast('Project created')}},
{id:'link',g:'Actions',t:'Copy link to this page',i:'⧉',k:['⌘','L'],run:function(){try{navigator.clipboard.writeText(location.href).catch(function(){})}catch(e){}toast('Link copied')}},
{id:'inv',g:'Actions',t:'Invite teammate',i:'✉',k:[],run:function(){toast('Invite link ready')}},
{id:'theme',g:'Settings',t:'Toggle theme',i:'◐',k:['⌘','T'],run:function(){var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';toast('Theme: '+r.dataset.theme)}},
{id:'notif',g:'Settings',t:'Notification settings',i:'♪',k:[],run:function(){toast('Opened notification settings')}},
{id:'keys',g:'Settings',t:'Keyboard shortcuts',i:'⌨',k:['?'],run:function(){toast('Shortcuts: ⌘K opens this palette')}}
];
var scrim=document.getElementById('scrim'),q=document.getElementById('q'),res=document.getElementById('res'),openBtn=document.getElementById('open');
var recent=[],active=0,list=[],lastFocus=null,tt;
function nav(h,s){document.getElementById('h').textContent=h;document.getElementById('sub').textContent=s;document.querySelectorAll('.sb a').forEach(function(a){a.classList.toggle('on',a.dataset.p===h)})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2000)}
function fuzzy(s,qs){if(!qs)return{score:0,idx:[]};var l=s.toLowerCase(),idx=[],p=0;qs=qs.toLowerCase();for(var i=0;i<qs.length;i++){var f=l.indexOf(qs[i],p);if(f<0)return null;idx.push(f);p=f+1}
 return{score:idx[0]*2+(idx[idx.length-1]-idx[0]),idx:idx}}
function hl(s,idx){var o='',set={};idx.forEach(function(i){set[i]=1});for(var i=0;i<s.length;i++){var c=s[i].replace(/&/g,'&amp;').replace(/</g,'&lt;');o+=set[i]?'<mark>'+c+'</mark>':c}return o}
function render(){
 var v=q.value.trim(),rows=[];
 if(!v){recent.forEach(function(id){var c=cmds.filter(function(x){return x.id===id})[0];rows.push({c:c,g:'Recent',idx:[]})});
  cmds.forEach(function(c){rows.push({c:c,g:c.g,idx:[]})})}
 else{cmds.forEach(function(c){var m=fuzzy(c.t,v);if(m)rows.push({c:c,g:c.g,idx:m.idx,s:m.score})});rows.sort(function(a,b){return a.s-b.s})}
 list=rows;if(active>=list.length)active=0;
 if(!list.length){res.innerHTML='<div class="em">No commands match “'+v.replace(/</g,'&lt;')+'”</div>';q.removeAttribute('aria-activedescendant');return}
 var html='',last='';
 list.forEach(function(r,i){var grp=v?r.c.g:r.g;if(!v||grp!==last){}
  if(r.g!==last&&!v||v&&grp!==last){html+='<div class="g" role="presentation">'+(v?grp:r.g)+'</div>';last=v?grp:r.g}
  html+='<div class="r" role="option" id="o'+i+'" data-i="'+i+'" aria-selected="'+(i===active)+'"><span class="ic" aria-hidden="true">'+r.c.i+'</span><span class="t">'+hl(r.c.t,r.idx)+'</span><span class="k">'+r.c.k.map(function(k){return'<kbd>'+k+'</kbd>'}).join('')+'</span></div>'});
 res.innerHTML=html;q.setAttribute('aria-activedescendant','o'+active);
}
function setActive(n,scroll){active=(n+list.length)%list.length;[].forEach.call(res.querySelectorAll('.r'),function(el){el.setAttribute('aria-selected',String(+el.dataset.i===active))});var el=document.getElementById('o'+active);q.setAttribute('aria-activedescendant','o'+active);if(scroll&&el)el.scrollIntoView({block:'nearest'})}
function open(){lastFocus=document.activeElement;scrim.classList.add('on');q.value='';active=0;render();q.focus()}
function close(){scrim.classList.remove('on');if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function run(i){var r=list[i];if(!r)return;recent=[r.c.id].concat(recent.filter(function(x){return x!==r.c.id})).slice(0,3);close();r.c.run()}
q.addEventListener('input',function(){active=0;render()});
res.addEventListener('mousemove',function(e){var el=e.target.closest('.r');if(el&&+el.dataset.i!==active)setActive(+el.dataset.i,false)});
res.addEventListener('click',function(e){var el=e.target.closest('.r');if(el)run(+el.dataset.i)});
scrim.addEventListener('mousedown',function(e){if(e.target===scrim)close()});
openBtn.addEventListener('click',open);
addEventListener('keydown',function(e){
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();scrim.classList.contains('on')?close():open();return}
 if(!scrim.classList.contains('on'))return;
 if(e.key==='Escape'){e.preventDefault();close()}
 else if(e.key==='ArrowDown'){e.preventDefault();setActive(active+1,true)}
 else if(e.key==='ArrowUp'){e.preventDefault();setActive(active-1,true)}
 else if(e.key==='Enter'){e.preventDefault();run(active)}
 else if(e.key==='Tab'){e.preventDefault();q.focus()}
});
document.querySelectorAll('.sb a').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();nav(a.dataset.p,'')})});
})();
</script>
</body></html>
