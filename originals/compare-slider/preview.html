<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>See the difference</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#101114;color:#f2f2f5;font:400 16px/1.5 "Hanken Grotesk",system-ui,sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:24px 16px}
.card{width:min(1000px,100%);background:#17181d;border:1px solid #26272e;border-radius:24px;padding:24px}
h1{font:800 30px "Hanken Grotesk",sans-serif;letter-spacing:-.02em;margin:0 0 4px}
.sub{margin:0 0 18px;color:#9a9ba6}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{border:1px solid #2d2e37;background:#1e1f26;color:#c9cad3;font:600 15px "Hanken Grotesk",sans-serif;border-radius:999px;padding:9px 18px;cursor:pointer}
.tabs button[aria-selected=true]{background:#ffd166;border-color:#ffd166;color:#201700}
:focus-visible{outline:2px solid #ffd166;outline-offset:3px}
.fr{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;cursor:ew-resize;touch-action:pan-y;user-select:none;-webkit-user-select:none;--p:50%}
.sc{position:absolute;inset:0;overflow:hidden}
.sc.b{clip-path:inset(0 calc(100% - var(--p)) 0 0);filter:grayscale(.8) contrast(.7) brightness(.8) blur(1.5px)}
.sc.b>div{transform:scale(1.02)}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
.fr.fade .sc{animation:fd .35s}
@keyframes fd{from{opacity:.4}}
.dv{position:absolute;top:0;bottom:0;left:var(--p);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.4);pointer-events:none}
.hd{position:absolute;top:50%;left:var(--p);width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#fff;color:#17181d;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:3}
.hd:focus-visible{outline:3px solid #ffd166;outline-offset:3px}
.hd.pulse{animation:pl 1.2s ease-out 2}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7),0 6px 20px rgba(0,0,0,.4)}100%{box-shadow:0 0 0 22px rgba(255,255,255,0),0 6px 20px rgba(0,0,0,.4)}}
.lb{position:absolute;top:14px;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:700 12px "Hanken Grotesk",sans-serif;letter-spacing:.14em;z-index:2;transition:opacity .15s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lb.l{left:14px}.lb.r{right:14px}
/* mountains */
.m1{background:linear-gradient(#ff9a6b,#ffd9a0 55%,#9fd6e8 55.1%,#4aa3c8)}
.m1 .sun{position:absolute;left:62%;top:16%;width:12%;aspect-ratio:1;border-radius:50%;background:#fff6c9;box-shadow:0 0 60px #ffe9a8}
.m1 svg{position:absolute;left:0;bottom:44%;width:100%;height:46%}
.m1 .ref{position:absolute;left:0;right:0;bottom:0;height:44%;background:linear-gradient(rgba(255,255,255,.18),transparent 60%)}
/* room */
.r1{background:linear-gradient(#f2e3cf,#e9d3b8 70%,#a9784c 70.1%,#8c5f38)}
.r1 .sofa{position:absolute;left:18%;bottom:20%;width:44%;height:26%;border-radius:18px 18px 8px 8px;background:#2f6f8f;box-shadow:inset 0 -12px 0 rgba(0,0,0,.15)}
.r1 .sofa:before,.r1 .sofa:after{content:"";position:absolute;bottom:0;width:8%;height:150%;background:#2a6482;border-radius:12px;top:-30%}
.r1 .sofa:before{left:-4%}.r1 .sofa:after{right:-4%}
.r1 .lamp{position:absolute;right:16%;bottom:24%;width:2%;height:34%;background:#4a3a2a}
.r1 .lamp:before{content:"";position:absolute;left:-190%;top:-18%;width:480%;height:34%;background:#ffe6a3;border-radius:6px 6px 40% 40%;box-shadow:0 0 70px 24px rgba(255,214,120,.65)}
.r1 .pic{position:absolute;left:34%;top:14%;width:20%;aspect-ratio:4/3;background:linear-gradient(135deg,#ff9a6b,#ffd166 50%,#4aa3c8);border:6px solid #5b3b24;box-shadow:0 6px 12px rgba(0,0,0,.2)}
.r1 .rug{position:absolute;left:12%;bottom:6%;width:56%;height:12%;background:#c4504a;border-radius:50%}
/* city */
.c1{background:linear-gradient(#0b1030,#2a2060 70%,#6c3a7c)}
.c1 .moon{position:absolute;left:14%;top:12%;width:8%;aspect-ratio:1;border-radius:50%;background:#fff6dc;box-shadow:0 0 40px rgba(255,246,220,.7)}
.c1 .st{position:absolute;inset:0 0 40%;background:radial-gradient(circle,#fff 0 1px,transparent 1.5px) 0 0/70px 55px,radial-gradient(circle,#fff 0 1px,transparent 1.5px) 25px 20px/110px 80px;opacity:.7}
.c1 .sk{position:absolute;left:0;right:0;bottom:0;height:56%;display:flex;align-items:flex-end;gap:1.2%;padding:0 3%}
.c1 .sk i{flex:1;background:#12122c;background-image:repeating-linear-gradient(90deg,transparent 0 8px,rgba(255,214,120,.9) 8px 12px,transparent 12px 20px),repeating-linear-gradient(0deg,#12122c 0 10px,transparent 10px 20px);background-blend-mode:normal;border-radius:2px 2px 0 0;position:relative}
.c1 .sk i:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#12122c 0 9px,transparent 9px 18px)}
@media(max-width:640px){.card{padding:16px}h1{font-size:25px}.hd{width:44px;height:44px;margin:-22px 0 0 -22px}.lb{top:8px;font-size:11px;padding:4px 10px}.lb.l{left:8px}.lb.r{right:8px}}
@media(prefers-reduced-motion:reduce){.hd.pulse{animation:none}.fr.fade .sc{animation:none}}
</style></head><body>
<main class="card">
 <h1>See the difference</h1><p class="sub">Drag the handle, tap the image or use the arrow keys.</p>
 <div class="tabs" role="tablist" id="tabs"></div>
 <div class="fr" id="fr" role="group" aria-label="Before and after comparison">
  <div class="sc a" id="sa"></div><div class="sc b" id="sb"></div>
  <span class="lb l" id="lbl">BEFORE</span><span class="lb r" id="lbr">AFTER</span>
  <div class="dv"></div>
  <div class="hd pulse" id="hd" role="slider" tabindex="0" aria-label="Comparison position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg></div>
 </div>
</main>
<script>
(function(){
var S=[['Mountains','<div class="scene m1 on"><div class="sun"></div><svg viewBox="0 0 100 46" preserveAspectRatio="none"><path d="M0 46V26l14-14 12 10 16-18 18 22 14-12 26 20v12z" fill="#7a5c8a"/><path d="M0 46V34l18-12 14 8 20-16 22 20 12-8 14 12v8z" fill="#4e3d70"/><path d="M0 46V40l22-10 16 6 24-14 20 14 18-6v16z" fill="#2c2552"/></svg><div class="ref"></div></div>'],
['Living room','<div class="scene r1 on"><div class="pic"></div><div class="rug"></div><div class="sofa"></div><div class="lamp"></div></div>'],
['City night','<div class="scene c1 on"><div class="st"></div><div class="moon"></div><div class="sk">'+[40,62,48,80,56,70,44,90,58,66,50,76].map(function(h){return'<i style="height:'+h+'%"></i>'}).join('')+'</div></div>']];
var cur=0,p=50,fr=document.getElementById('fr'),hd=document.getElementById('hd'),sa=document.getElementById('sa'),sb=document.getElementById('sb'),tabs=document.getElementById('tabs');
var rm=matchMedia('(prefers-reduced-motion: reduce)').matches,anim=0;
function set(v){p=Math.max(0,Math.min(100,v));fr.style.setProperty('--p',p+'%');hd.setAttribute('aria-valuenow',Math.round(p));document.getElementById('lbl').style.opacity=Math.min(1,Math.max(0,(p-14)/10));document.getElementById('lbr').style.opacity=Math.min(1,Math.max(0,(86-p)/10))}
function scene(){sa.innerHTML=S[cur][1];sb.innerHTML='<div style="position:absolute;inset:0">'+S[cur][1]+'</div>';tabs.innerHTML='';S.forEach(function(s,i){var b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(i===cur));b.textContent=s[0];b.onclick=function(){cur=i;cancelAnimationFrame(anim);hd.classList.remove('pulse');fr.classList.remove('fade');void fr.offsetWidth;fr.classList.add('fade');set(50);scene()};tabs.appendChild(b)})}
function pos(e){var r=fr.getBoundingClientRect();set((e.clientX-r.left)/r.width*100)}
var drag=false;fr.addEventListener('pointerdown',function(e){cancelAnimationFrame(anim);hd.classList.remove('pulse');drag=true;fr.setPointerCapture(e.pointerId);pos(e)});fr.addEventListener('pointermove',function(e){if(drag)pos(e)});fr.addEventListener('pointerup',function(){drag=false});fr.addEventListener('pointercancel',function(){drag=false});
hd.addEventListener('keydown',function(e){var st=e.shiftKey?10:2;if(e.key==='ArrowLeft'){e.preventDefault();set(p-st)}else if(e.key==='ArrowRight'){e.preventDefault();set(p+st)}else if(e.key==='Home'){e.preventDefault();set(0)}else if(e.key==='End'){e.preventDefault();set(100)}});
scene();set(50);
if(rm)hd.classList.remove('pulse');else{var t0=null,path=[[0,50],[.25,35],[.65,65],[1,50]];(function f(n){if(t0===null)t0=n;var t=Math.min((n-t0)/1600,1),i=1;while(path[i][0]<t)i++;var a=path[i-1],b=path[i],k=(t-a[0])/(b[0]-a[0]);set(a[1]+(b[1]-a[1])*(.5-Math.cos(k*Math.PI)/2));if(t<1)anim=requestAnimationFrame(f)})(performance.now())}
})();
</script>
</body></html>
