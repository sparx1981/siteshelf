<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity — Contribution Heatmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--ink:#e6edf3;--mut:#8b949e;--line:#30363d;--acc:#58a6ff;--l0:#21262d;--l1:#0e4429;--l2:#006d32;--l3:#26a641;--l4:#39d353}
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:var(--ink);font:400 14px/1.5 'IBM Plex Sans',sans-serif;padding:32px 16px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{max-width:1080px;margin:0 auto;background:#161b22;border:1px solid var(--line);border-radius:14px;padding:24px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font:600 22px/1.2 'IBM Plex Sans',sans-serif;margin:0}.hd p{margin:2px 0 0;color:var(--mut)}
.yr{display:flex;gap:6px}
.yr button{border:1px solid var(--line);background:#0d1117;color:var(--mut);border-radius:8px;padding:6px 14px;font:500 14px 'IBM Plex Sans',sans-serif;cursor:pointer}
.yr button:hover{color:var(--ink)}.yr button[aria-pressed=true]{background:#1f6feb;border-color:#1f6feb;color:#fff}
.sc{overflow-x:auto;padding-bottom:10px}
.hm{display:inline-block;min-width:max-content}
.mo{display:grid;grid-auto-flow:column;grid-auto-columns:15px;height:18px;margin-left:34px;font-size:12px;color:var(--mut);position:relative}
.mo button{all:unset;position:absolute;cursor:pointer;color:var(--mut);padding:0 2px;border-radius:4px;font-size:12px}
.mo button:hover,.mo button[aria-pressed=true]{color:var(--ink);background:#21262d}.mo button:focus-visible{outline:2px solid var(--acc)}
.b{display:flex;gap:4px}
.dl{display:grid;grid-template-rows:repeat(7,12px);gap:3px;width:30px;font-size:11px;color:var(--mut);line-height:12px;text-align:right;flex:none;margin-top:0}
.g{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px}
.d{width:12px;height:12px;border-radius:3px;background:var(--l0);border:0;padding:0;cursor:pointer;outline-offset:1px;opacity:0;animation:in .35s forwards;animation-delay:calc(var(--c)*8ms)}
.d.e{visibility:hidden}
.d[data-l="1"]{background:var(--l1)}.d[data-l="2"]{background:var(--l2)}.d[data-l="3"]{background:var(--l3)}.d[data-l="4"]{background:var(--l4)}
.d:hover,.d:focus-visible{box-shadow:0 0 0 1.5px #fff}
.g.dim .d:not(.hi){opacity:.25!important}
@keyframes in{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.lg{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:12px;color:var(--mut);margin-top:10px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tip{position:fixed;pointer-events:none;background:#010409;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 12px 'IBM Plex Mono',monospace;z-index:20;transform:translate(-50%,-130%);white-space:nowrap;opacity:0;transition:opacity .1s}
.tip b{color:#fff}
.st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0 16px}
.sx{background:#0d1117;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.sx small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.sx b{display:block;font:600 32px/1.2 'IBM Plex Sans',sans-serif;font-variant-numeric:tabular-nums}
.sx span{color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
.wd h2,.bm h2{font:600 14px 'IBM Plex Sans',sans-serif;margin:0 0 12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.wr{display:grid;grid-template-columns:34px minmax(0,1fr) 40px;gap:10px;align-items:center;margin-bottom:8px;font-size:13px}
.wr .t{height:10px;border-radius:5px;background:#21262d;overflow:hidden}.wr .t i{display:block;height:100%;background:linear-gradient(90deg,var(--l2),var(--l4));border-radius:5px;transition:width .5s}
.wr span:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--mut)}
.bm b{font:600 28px 'IBM Plex Sans',sans-serif;display:block}.bm p{margin:4px 0 0;color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:800px){.st{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:420px){.st{grid-template-columns:minmax(0,1fr)}.card{padding:16px}body{padding:16px 12px}}
@media(prefers-reduced-motion:reduce){.d{animation:none;opacity:1}.tip{transition:none}.wr .t i{transition:none}}
</style></head><body><main class="card">
<div class="hd"><div><h1>Activity</h1><p id="tot"></p></div><div class="yr" role="group" aria-label="Year" id="yr"></div></div>
<div class="sc" id="sc"><div class="hm"><div class="mo" id="mo"></div><div class="b"><div class="dl" aria-hidden="true"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div><div class="g" id="g" role="grid" aria-label="Contribution calendar"></div></div></div></div>
<div class="lg">Less <i style="background:var(--l0)"></i><i style="background:var(--l1)"></i><i style="background:var(--l2)"></i><i style="background:var(--l3)"></i><i style="background:var(--l4)"></i> More</div>
<div class="st" id="st"></div>
<div class="two"><section class="sx wd"><h2>Average per weekday</h2><div id="wd"></div></section><section class="sx bm"><h2>Busiest month</h2><b id="bm"></b><p id="bp"></p></section></div>
<div class="tip" id="tip"></div><div class="sr" id="live" aria-live="polite"></div></main>
<script>
const $=i=>document.getElementById(i),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const YEARS=[2024,2025,2026];let year=2025,data=[],mon=null,fr=0,fc=0;
function rng(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function gen(y){const r=rng(y*7919),out=[],d0=new Date(y,0,1),n=(new Date(y+1,0,1)-d0)/864e5;let burst=0;
 for(let i=0;i<n;i++){const d=new Date(y,0,1+i),wd=(d.getDay()+6)%7,m=d.getMonth();let p=wd<5?.78:.32;if(m===7)p*=.35;if(m===11&&d.getDate()>22)p*=.2;if(i%38===0)burst=4;let c=0;if(r()<p){c=Math.floor(r()*r()*9)+1}
  if(burst>0){c+=Math.floor(r()*6)+2;burst--}out.push({d,c:Math.min(c,16)})}
 const today=new Date();if(y===today.getFullYear())out.forEach(o=>{if(o.d>today)o.c=0,o.f=1});return out}
const lv=c=>c===0?0:c<=2?1:c<=5?2:c<=9?3:4;
$('yr').innerHTML=YEARS.map(y=>`<button data-y="${y}" aria-pressed="${y===year}">${y}</button>`).join('');
function draw(){data=gen(year);const first=data[0].d,off=(first.getDay()+6)%7;const cells=Array(off).fill(null).concat(data);const cols=Math.ceil(cells.length/7);
 $('g').style.gridTemplateColumns=`repeat(${cols},12px)`;
 $('g').innerHTML=cells.map((o,i)=>{const c=Math.floor(i/7),r=i%7;if(!o)return `<span class="d e" style="--c:${c}"></span>`;const t=o.d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});return `<button class="d" data-l="${lv(o.c)}" data-c="${c}" data-r="${r}" data-i="${i}" style="--c:${c}" role="gridcell" tabindex="${c===fc&&r===fr?0:-1}" aria-label="${o.c} contribution${o.c===1?'':'s'} on ${t}"></button>`}).join('');
 $('g').dataset.cols=cols;
 const marks=[];let last=-3;for(let m=0;m<12;m++){const i=data.findIndex(o=>o.d.getMonth()===m)+off,c=Math.floor(i/7);if(c-last>=3){marks.push([m,c]);last=c}}
 $('mo').style.gridTemplateColumns=`repeat(${cols},15px)`;$('mo').innerHTML=marks.map(([m,c])=>`<button style="left:${c*15}px" data-m="${m}" aria-pressed="${mon===m}" aria-label="Highlight ${MN[m]}">${MN[m]}</button>`).join('');
 stats();hl()}
function stats(){const tot=data.reduce((a,o)=>a+o.c,0);$('tot').textContent=`${tot.toLocaleString('en-GB')} contributions in ${year}`;
 let best={c:-1},long=0,run=0,cur=0;data.forEach(o=>{if(o.c>best.c)best=o;if(o.c>0){run++;long=Math.max(long,run)}else run=0});
 const active=data.filter(o=>!o.f);for(let i=active.length-1;i>=0;i--){if(active[i].c>0)cur++;else if(i===active.length-1)continue;else break}
 const act=data.filter(o=>o.c>0).length;
 $('st').innerHTML=[['Total',tot.toLocaleString('en-GB'),`${act} active days`],['Longest streak',long+' days','Consecutive active days'],['Current streak',cur+' days',cur?'Keep it going':'Start a new one today'],['Best day',best.c,best.d.toLocaleDateString('en-GB',{day:'numeric',month:'long'})]].map(([a,b,c])=>`<div class="sx"><small>${a}</small><b>${b}</b><span>${c}</span></div>`).join('');
 const sums=Array(7).fill(0),cnt=Array(7).fill(0);data.forEach(o=>{if(o.f)return;const w=(o.d.getDay()+6)%7;sums[w]+=o.c;cnt[w]++});const av=sums.map((s,i)=>s/(cnt[i]||1)),mx=Math.max(...av);
 $('wd').innerHTML=av.map((a,i)=>`<div class="wr"><span>${WD[i]}</span><div class="t"><i style="width:${a/mx*100}%"></i></div><span>${a.toFixed(1)}</span></div>`).join('');
 const ms=Array(12).fill(0);data.forEach(o=>ms[o.d.getMonth()]+=o.c);const bi=ms.indexOf(Math.max(...ms));$('bm').textContent=new Date(year,bi,1).toLocaleDateString('en-GB',{month:'long'});$('bp').textContent=ms[bi].toLocaleString('en-GB')+' contributions'}
function hl(){const g=$('g');g.classList.toggle('dim',mon!==null);g.querySelectorAll('.d[data-i]').forEach(b=>{const o=cellsOf(+b.dataset.i);b.classList.toggle('hi',mon!==null&&o&&o.d.getMonth()===mon)});$('mo').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.m===mon))}
function cellsOf(i){const off=(data[0].d.getDay()+6)%7;return data[i-off]}
const tip=$('tip');
function show(b){const o=cellsOf(+b.dataset.i);if(!o)return;const r=b.getBoundingClientRect();const t=o.d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});tip.innerHTML=`<b>${o.c} contribution${o.c===1?'':'s'}</b> on ${t}`;tip.style.left=Math.max(120,Math.min(innerWidth-120,r.left+6))+'px';tip.style.top=r.top+'px';tip.style.opacity=1;$('live').textContent=`${o.c} contributions on ${t}`}
$('g').addEventListener('mouseover',e=>{const b=e.target.closest('.d[data-i]');if(b)show(b)});$('g').addEventListener('mouseout',()=>tip.style.opacity=0);
$('g').addEventListener('focusin',e=>{const b=e.target.closest('.d[data-i]');if(b){fc=+b.dataset.c;fr=+b.dataset.r;show(b)}});$('g').addEventListener('focusout',()=>tip.style.opacity=0);
$('g').addEventListener('keydown',e=>{const b=e.target.closest('.d[data-i]');if(!b)return;const cols=+$('g').dataset.cols;let c=+b.dataset.c,r=+b.dataset.r;const m={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]}[e.key];
 if(m){c+=m[0];r+=m[1]}else if(e.key==='Home')c=0;else if(e.key==='End')c=cols-1;else return;e.preventDefault();c=Math.max(0,Math.min(cols-1,c));r=Math.max(0,Math.min(6,r));
 let t=$('g').querySelector(`.d[data-i="${c*7+r}"]`);if(!t){const alt=[...$('g').querySelectorAll('.d[data-i]')].reduce((a,x)=>Math.abs(+x.dataset.c-c)+Math.abs(+x.dataset.r-r)<Math.abs(+a.dataset.c-c)+Math.abs(+a.dataset.r-r)?x:a);t=alt}
 $('g').querySelectorAll('.d').forEach(x=>x.tabIndex=-1);t.tabIndex=0;t.focus();t.scrollIntoView({block:'nearest',inline:'nearest'})});
$('mo').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mon=mon===+b.dataset.m?null:+b.dataset.m;hl()});
$('yr').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;year=+b.dataset.y;mon=null;fc=0;fr=0;[...$('yr').children].forEach(x=>x.setAttribute('aria-pressed',x===b));draw();$('sc').scrollLeft=$('sc').scrollWidth});
addEventListener('scroll',()=>tip.style.opacity=0,true);
draw();$('sc').scrollLeft=$('sc').scrollWidth;
</script></body></html>
