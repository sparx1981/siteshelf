<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotary Knob Control — Form Controls</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(800px 500px at 50% 0,#26262c,#121214 70%);color:#e8e8ee;font:400 16px/1.5 Inconsolata,monospace;overflow-x:hidden}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.w{max-width:820px;margin:0 auto;padding:44px 20px 56px}
.eb{font:600 14px Oswald;letter-spacing:.2em;text-transform:uppercase;color:#ffb020;margin:0 0 8px}
h1{font:700 clamp(36px,6vw,60px)/1 Oswald;letter-spacing:.01em;text-transform:uppercase;margin:0 0 10px}.lead{color:#9a9aa6;margin:0 0 24px;max-width:48ch;font-size:18px}
.pd{position:relative;background:repeating-linear-gradient(#1f1f24 0 2px,#1b1b20 2px 4px);border:1px solid #2c2c33;border-radius:24px;padding:26px 28px 28px;box-shadow:0 40px 80px -30px #000,inset 0 1px 0 rgba(255,255,255,.06)}
.sc{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bbb,#555);box-shadow:inset 0 0 0 1px #000}.sc:after{content:"";position:absolute;left:2px;right:2px;top:5px;height:2px;background:#222;transform:rotate(30deg)}
.sc.a{left:14px;top:14px}.sc.b{right:14px;top:14px}.sc.c{left:14px;bottom:14px}.sc.d{right:14px;bottom:14px}
.np{display:flex;justify-content:space-between;align-items:baseline;margin:0 8px 14px;font:700 26px Oswald;letter-spacing:.14em}.np small{font:600 14px Oswald;color:#9a9aa6;letter-spacing:.2em}
.scr{height:120px;border-radius:14px;background:#06100a;border:2px solid #2a2a30;box-shadow:inset 0 0 40px rgba(93,242,154,.12);margin-bottom:22px;overflow:hidden;position:relative}
.scr canvas{width:100%;height:100%;display:block}
.scr:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.2) 2px 3px);pointer-events:none}
.kn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;justify-items:center}
.k{display:grid;justify-items:center;gap:6px;min-width:0}
.k b{font:600 16px Oswald;letter-spacing:.14em;text-transform:uppercase}.k output{font:600 20px Inconsolata;color:var(--c);min-width:4ch;text-align:center;text-shadow:0 0 10px color-mix(in srgb,var(--c) 50%,transparent)}
.kb{position:relative;width:var(--ks,120px);height:var(--ks,120px);touch-action:none;cursor:grab;outline:0;border-radius:50%;-webkit-tap-highlight-color:transparent}
.kb.dr{cursor:grabbing}
.kb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.kb:focus-visible .fr{opacity:1}
.fr{opacity:0;fill:none;stroke:#fff;stroke-width:3}
.cap{position:absolute;left:19%;top:19%;width:62%;height:62%;border-radius:50%;background:conic-gradient(from 20deg,#e9e9ee,#9a9aa4,#f4f4f8,#8e8e98,#e9e9ee);box-shadow:0 8px 14px rgba(0,0,0,.6),inset 0 0 0 3px #4a4a52,inset 0 0 0 5px #c6c6cf,inset 0 0 14px rgba(0,0,0,.35);transform:rotate(var(--r,0deg));transition:transform .12s ease-out}
.kb.dr .cap{transition:none}
.cap:before{content:"";position:absolute;left:50%;top:7%;width:3px;height:26%;margin-left:-1.5px;border-radius:2px;background:#ffb020;box-shadow:0 0 6px #ffb020}
.cap:after{content:"";position:absolute;inset:24%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fafafa,#8c8c96);box-shadow:inset 0 -3px 6px rgba(0,0,0,.3)}
.tk{stroke:#6a6a76;stroke-width:2;stroke-linecap:round}.tk.big{stroke:#d8d8e0;stroke-width:2.6}
.tr{fill:none;stroke:#2a2a32;stroke-width:5;stroke-linecap:round}.va{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--c))}
.nm{font:600 11px Inconsolata;fill:#9a9aa6;text-anchor:middle}
.ps{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}.ps span{color:#9a9aa6;font-size:15px;margin-right:4px}
.pb{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 18px;border-radius:999px;border:1.5px solid #4a4a54;font:600 15px Oswald;letter-spacing:.08em;text-transform:uppercase;min-height:40px;color:#e8e8ee;transition:border-color .2s,color .2s}.pb:hover{border-color:#ffb020;color:#ffb020}.pb:focus-visible{outline:3px solid #fff;outline-offset:3px}.pb.r{margin-left:auto;border-color:#33333b;color:#9a9aa6}
.hint{color:#8a8a96;font-size:14px;margin-top:14px}.hint kbd{border:1px solid #3a3a44;border-radius:5px;padding:0 6px;font:600 13px Inconsolata;color:#c8c8d2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){.kb{--ks:84px}.pd{padding:22px 14px}.k b{font-size:13px}.k output{font-size:17px}}
@media (max-width:480px){.kn{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 8px}.kb{--ks:104px}}
@media (prefers-reduced-motion:reduce){.cap{transition:none}}
</style></head><body>
<div class="w"><p class="eb">Tonewheel Audio</p><h1>Turn it up. Gently.</h1><p class="lead">Four knobs you can drag, scroll, or tab to. The screen shows what each one does to the signal.</p>
<div class="pd"><i class="sc a"></i><i class="sc b"></i><i class="sc c"></i><i class="sc d"></i><div class="np"><span>BLOOM</span><small>OVERDRIVE</small></div><div class="scr"><canvas id="cv" aria-hidden="true"></canvas></div><div class="kn" id="kn"></div>
<div class="ps" id="ps"><span>Presets</span><button class="pb" data-p="0" type="button">Clean</button><button class="pb" data-p="1" type="button">Crunch</button><button class="pb" data-p="2" type="button">Lead</button><button class="pb" data-p="3" type="button">Ambient</button><button class="pb r" id="rs" type="button">Reset all</button></div></div>
<p class="hint"><kbd>←</kbd><kbd>→</kbd> fine, <kbd>Shift</kbd> coarse, <kbd>PgUp</kbd><kbd>PgDn</kbd> by one, <kbd>Esc</kbd> reset. Double-click a knob to reset it.</p></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,live=$('#live'),lt;
var K=[{n:'Drive',c:'#ffb020',d:5},{n:'Tone',c:'#3fe0ff',d:5},{n:'Volume',c:'#5df29a',d:6},{n:'Reverb',c:'#ff5bd0',d:2}];
var PR=[[2,5,6,1],[5.5,6,6,2],[8.2,7.5,5.5,1.5],[3,4,5.5,8]];
var S0=-135,SW=270,val=K.map(function(k){return k.d}),els=[];
function polar(cx,cy,r,deg){var a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function arc(cx,cy,r,a0,a1){var p0=polar(cx,cy,r,a0),p1=polar(cx,cy,r,a1),lg=a1-a0>180?1:0;return 'M'+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+' A'+r+' '+r+' 0 '+lg+' 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2)}
function build(){var kn=$('#kn');K.forEach(function(k,i){var d=document.createElement('div');d.className='k';d.style.setProperty('--c',k.c);
 var t='';for(var j=0;j<=10;j++){var a=S0+j*SW/10,p0=polar(60,60,j%5===0?50:52,a),p1=polar(60,60,57,a);t+='<line class="tk'+(j%5===0?' big':'')+'" x1="'+p0[0].toFixed(2)+'" y1="'+p0[1].toFixed(2)+'" x2="'+p1[0].toFixed(2)+'" y2="'+p1[1].toFixed(2)+'"/>'}
 var nm='';[0,5,10].forEach(function(j){var p=polar(60,60,66,S0+j*SW/10);nm+='<text class="nm" x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'">'+j+'</text>'});
 d.innerHTML='<b id="l'+i+'">'+k.n+'</b><div class="kb" tabindex="0" role="slider" aria-labelledby="l'+i+'" aria-valuemin="0" aria-valuemax="10" aria-valuenow="'+k.d+'" aria-valuetext="'+k.d.toFixed(1)+' out of 10" data-i="'+i+'"><svg viewBox="-12 -12 144 144" aria-hidden="true"><circle class="fr" cx="60" cy="60" r="60"/>'+t+'<path class="tr" d="'+arc(60,60,45,S0,S0+SW)+'"/><path class="va" d="'+arc(60,60,45,S0,S0+.01)+'"/>'+nm+'</svg><div class="cap" aria-hidden="true"></div></div><output for="l'+i+'">'+k.d.toFixed(1)+'</output>';
 kn.appendChild(d);els.push({kb:d.querySelector('.kb'),cap:d.querySelector('.cap'),va:d.querySelector('.va'),out:d.querySelector('output')})});}
build();
function paint(i){var v=val[i],a=S0+v*SW/10,e=els[i];e.cap.style.setProperty('--r',a+'deg');e.va.setAttribute('d',arc(60,60,45,S0,Math.max(S0+.01,a)));e.out.textContent=v.toFixed(1);e.kb.setAttribute('aria-valuenow',v.toFixed(1));e.kb.setAttribute('aria-valuetext',v.toFixed(1)+' out of 10')}
function say(i){clearTimeout(lt);lt=setTimeout(function(){live.textContent=K[i].n+' '+val[i].toFixed(1)+' out of 10'},300)}
function set(i,v,silent){v=Math.max(0,Math.min(10,Math.round(v*100)/100));val[i]=v;paint(i);wave();if(!silent)say(i)}
els.forEach(function(e,i){var kb=e.kb,drag=false,lastA=0,acc=0;
 function ang(ev){var r=kb.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;return Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI}
 kb.addEventListener('pointerdown',function(ev){if(ev.button>0)return;drag=true;kb.classList.add('dr');kb.setPointerCapture(ev.pointerId);lastA=ang(ev);kb.focus({preventScroll:true});ev.preventDefault()});
 kb.addEventListener('pointermove',function(ev){if(!drag)return;var a=ang(ev),d=a-lastA;if(d>180)d-=360;if(d<-180)d+=360;lastA=a;var k=ev.shiftKey?.2:1;set(i,val[i]+d*k/SW*10)});
 ['pointerup','pointercancel'].forEach(function(n){kb.addEventListener(n,function(){drag=false;kb.classList.remove('dr')})});
 kb.addEventListener('wheel',function(ev){ev.preventDefault();set(i,val[i]+(ev.deltaY<0?1:-1)*(ev.shiftKey?.02:.1))},{passive:false});
 kb.addEventListener('dblclick',function(){set(i,K[i].d)});
 kb.addEventListener('keydown',function(ev){var k=ev.key,v=val[i],n=null;if(k==='ArrowRight'||k==='ArrowUp')n=v+(ev.shiftKey?1:.1);else if(k==='ArrowLeft'||k==='ArrowDown')n=v-(ev.shiftKey?1:.1);else if(k==='PageUp')n=v+1;else if(k==='PageDown')n=v-1;else if(k==='Home')n=0;else if(k==='End')n=10;else if(k==='Escape')n=K[i].d;if(n!==null){ev.preventDefault();set(i,n)}})});
function anim(to){if(reduce){to.forEach(function(v,i){set(i,v,true)});return}var from=val.slice(),t0=performance.now();(function f(t){var k=Math.min(1,(t-t0)/400),e=1-Math.pow(1-k,3);to.forEach(function(v,i){set(i,from[i]+(v-from[i])*e,true)});if(k<1)requestAnimationFrame(f)})(t0)}
document.querySelectorAll('[data-p]').forEach(function(b){b.addEventListener('click',function(){anim(PR[+b.dataset.p]);live.textContent=b.textContent+' preset applied'})});
$('#rs').addEventListener('click',function(){anim(K.map(function(k){return k.d}));live.textContent='All knobs reset'});
var cv=$('#cv'),ctx=cv.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
function wave(){var b=cv.getBoundingClientRect(),W=cv.width=Math.round(b.width*dpr),H=cv.height=Math.round(b.height*dpr);ctx.clearRect(0,0,W,H);
 var dr=val[0]/10,tn=val[1]/10,vo=val[2]/10,rv=val[3]/10,mid=H/2;ctx.strokeStyle='rgba(93,242,154,.12)';ctx.lineWidth=1*dpr;ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(W,mid);ctx.stroke();
 function y(x){var u=x/W*4*Math.PI*2*.5,s=Math.sin(u)+tn*.5*Math.sin(3*u)/1.2+tn*.25*Math.sin(5*u);s*=.6;var g=1+dr*7;s=Math.tanh(s*g)/Math.tanh(g*.9);var env=1;if(rv>0){var tail=Math.max(0,(x/W-.62)/.38);env=1-tail*(1-rv*.55)}return s*vo*env*(H*.42)}
 ctx.lineWidth=2.4*dpr;ctx.lineJoin='round';ctx.strokeStyle='#5df29a';ctx.shadowColor='#5df29a';ctx.shadowBlur=10*dpr;ctx.beginPath();for(var x=0;x<=W;x+=2){var yy=mid-y(x);if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.stroke();
 if(rv>.02){ctx.shadowBlur=0;ctx.strokeStyle='rgba(93,242,154,'+(.18+rv*.3)+')';ctx.lineWidth=1.4*dpr;ctx.beginPath();for(var x2=0;x2<=W;x2+=3){var y2=mid-y(Math.max(0,x2-W*.08))*.6;if(x2===0)ctx.moveTo(x2,y2);else ctx.lineTo(x2,y2)}ctx.stroke()}}
els.forEach(function(e,i){paint(i)});wave();addEventListener('resize',wave);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(wave);
if(!reduce)setTimeout(function(){anim([6.8,5.5,6,3.2])},500);
})();
</script></body></html>
