<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Air Quality Board — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eaf4fb,#f7fafc);color:#11263a;font:400 14px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #11263a;outline-offset:2px;box-shadow:0 0 0 6px #fff;border-radius:10px}
.tb{display:flex;align-items:center;gap:12px;padding:14px clamp(14px,3vw,36px);flex-wrap:wrap}.logo{font:800 22px Manrope,sans-serif;letter-spacing:-.03em;margin-right:auto}.logo i{display:inline-block;width:16px;height:16px;border-radius:50%;border:4px solid #2bb673;margin-right:8px}
.sg{display:flex;background:#fff;border:1px solid #dbe7f1;border-radius:12px;padding:3px}.sg button{font:700 13px Manrope,sans-serif;border:0;background:none;color:#526a80;padding:7px 13px;border-radius:9px;cursor:pointer}.sg button[aria-pressed=true]{background:#11263a;color:#fff}
.up{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #dbe7f1;border-radius:99px;padding:5px 14px;font-size:13px;color:#526a80}.up i{width:8px;height:8px;border-radius:50%;background:#2bb673;animation:pu 1.6s infinite}@keyframes pu{0%{box-shadow:0 0 0 0 rgba(43,182,115,.6)}100%{box-shadow:0 0 0 9px rgba(43,182,115,0)}}
.w{max-width:1280px;margin:0 auto;padding:6px clamp(14px,3vw,36px) 60px}h1{font:800 clamp(26px,3.4vw,34px)/1.1 Manrope,sans-serif;letter-spacing:-.02em;margin:0 0 14px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;margin-bottom:18px}.c{background:#fff;border:1px solid #dbe7f1;border-radius:20px;padding:20px;box-shadow:0 20px 40px -32px rgba(17,38,58,.5)}
.gz{text-align:center}.gz svg{width:min(100%,320px);overflow:visible}.gz b{display:block;font:800 52px/1 Manrope,sans-serif;margin-top:4px}.bn{display:inline-block;border-radius:99px;padding:3px 14px;font:700 14px Manrope,sans-serif;margin-top:6px;background:var(--b);color:var(--f)}
.ad h2{font:800 18px Manrope,sans-serif;margin:0 0 8px}.ad ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:8px}.ad li{background:#f2f7fb;border-radius:12px;padding:10px 14px;display:flex;gap:10px}.ad li b{min-width:74px;font-family:Manrope,sans-serif}
.gr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.t{all:unset;box-sizing:border-box;display:block;background:#fff;border:2px solid #dbe7f1;border-radius:20px;padding:16px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}.t:hover{transform:translateY(-3px);box-shadow:0 18px 30px -22px rgba(17,38,58,.7)}.t:focus-visible{outline:3px solid #11263a;outline-offset:2px;box-shadow:0 0 0 6px #fff}.t.fl{animation:fl 1.2s}@keyframes fl{30%{border-color:#11263a}}
.th{display:flex;gap:12px;align-items:center}.th h3{flex:1;margin:0;font:700 15px Manrope,sans-serif}.ai{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--b);color:var(--f);font:800 20px Manrope,sans-serif;transition:background .5s}
.bl{font:700 12px Manrope,sans-serif;display:block;margin-top:2px;color:#526a80}
.pb{margin:12px 0 8px;display:grid;gap:6px}.pb div{display:grid;grid-template-columns:44px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:12px}.pb .tr{height:7px;background:#e8f0f6;border-radius:99px;position:relative;overflow:visible}.pb .tr i{display:block;height:100%;border-radius:99px;background:var(--b);transition:width .6s}.pb .tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#11263a;opacity:.5}.pb b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.sp{width:100%;height:44px;display:block;outline:none}.sp:focus-visible{outline:3px solid #11263a;outline-offset:2px;border-radius:6px}.rd{font-size:12px;color:#526a80;min-height:18px}
dialog{border:0;border-radius:24px;padding:24px;max-width:560px;width:calc(100% - 28px);color:#11263a}dialog::backdrop{background:rgba(17,38,58,.55)}dialog h3{font:800 24px Manrope,sans-serif;margin:0}dialog .x{position:absolute;top:14px;right:14px;all:unset;cursor:pointer;font-size:24px;padding:4px 10px;border-radius:8px}dialog .x:focus-visible{outline:3px solid #11263a}
.fc{display:flex;align-items:flex-end;gap:6px;height:100px;margin:10px 0}.fc i{flex:1;background:var(--b);border-radius:5px 5px 0 0;position:relative}.fc span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:#526a80}
.sw{display:flex;gap:10px;align-items:center;margin-top:28px;font-weight:600}.sw button{width:44px;height:26px;border-radius:99px;border:0;background:#c3d2de;position:relative;cursor:pointer;transition:background .2s}.sw button:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}.sw button[aria-checked=true]{background:#2bb673}.sw button[aria-checked=true]:after{transform:translateX(18px)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1000px){.gr{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr)}}@media(max-width:560px){.gr{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="tb"><div class="logo"><i></i>clearair</div><div class="sg" role="group" aria-label="City" id="cg"></div><div class="sg" role="group" aria-label="Pollutant" id="pg"></div><span class="up"><i></i><span id="ud">Updated 0 s ago</span></span></div>
<main class="w"><h1 id="h1">Marlowe air quality</h1>
<div class="hero"><section class="c gz" aria-label="Citywide AQI"><svg viewBox="0 0 200 118" aria-hidden="true"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#2bb673"/><stop offset=".25" stop-color="#e6c229"/><stop offset=".5" stop-color="#f08a24"/><stop offset=".72" stop-color="#e0483f"/><stop offset="1" stop-color="#8e3fbf"/></linearGradient></defs><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="#e8f0f6" stroke-width="16" stroke-linecap="round"/><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round"/><g id="nd" style="transform-origin:100px 100px;transition:transform 1s cubic-bezier(.3,1.2,.5,1)"><path d="M100 100L100 34" stroke="#11263a" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="8" fill="#11263a"/></g></svg><b id="cv">0</b><span class="bn" id="cb"></span></section>
<section class="c ad" aria-live="polite"><h2 id="at"></h2><p id="ap" style="margin:0;color:#526a80"></p><ul id="al"></ul></section></div>
<div class="gr" id="gr"></div><div class="vh" id="lv" aria-live="polite"></div></main>
<dialog id="dlg" aria-labelledby="dh"><button class="x" type="button" id="dx" aria-label="Close">×</button><h3 id="dh"></h3><p id="ds" style="margin:2px 0 10px;color:#526a80"></p><svg id="db" viewBox="0 0 520 150" style="width:100%" role="img" aria-label="24 hour chart"></svg><b>Next 6 hours</b><div class="fc" id="fc"></div><div class="sw"><span id="swl">Alert me when unhealthy</span><button type="button" role="switch" aria-checked="false" aria-labelledby="swl" id="sw"></button></div></dialog>
<script>
(function(){
var B=[[50,'Good','#2bb673','#fff'],[100,'Moderate','#e6c229','#1a1200'],[150,'Unhealthy for sensitive groups','#f08a24','#1a1200'],[200,'Unhealthy','#e0483f','#fff'],[300,'Very unhealthy','#8e3fbf','#fff']];
function band(v){for(var i=0;i<B.length;i++)if(v<=B[i][0])return B[i];return B[4]}
var CITY={Marlowe:['Riverside Park','Market Square','Ring Road North','Harbour Lane','Old Mill','Station Approach','University Quad','Kiln Heights'],Northgate:['Castle Gate','Brewery Row','Hospital Road','Canal Basin','Cathedral Close','Retail Park','Kestrel Estate','Ash Lane'],Harbourside:['Quay 4','Ferry Terminal','Fish Market','Lighthouse Rd','Salt Marsh','Dockside East','Marina Walk','Customs House']},POL=['AQI','PM2.5','PM10','NO₂','O₃'],GUIDE={'PM2.5':15,'PM10':45,'NO₂':25,'O₃':100};
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,city='Marlowe',pol='AQI',data={},tiles=[],seed=4,lastAnn=0,upd=0;
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
function mk(c){var r=rng(c.length*31+7),o=[];CITY[c].forEach(function(n,i){var base=30+r()*90,h=[];for(var k=0;k<24;k++)h.push(Math.max(8,Math.round(base+Math.sin(k/24*6.28+i)*18+(r()-.5)*14)));o.push({n:n,h:h,pm25:h[23]*.32,pm10:h[23]*.55,no2:h[23]*.5,o3:h[23]*.9})});return o}
Object.keys(CITY).forEach(function(c){data[c]=mk(c)});
function idx(s,p){var h=s.h[23];return p==='AQI'?h:p==='PM2.5'?Math.round(s.pm25/15*50):p==='PM10'?Math.round(s.pm10/45*50):p==='NO₂'?Math.round(s.no2/25*50):Math.round(s.o3/100*50)}
function serie(s,p){return p==='AQI'?s.h:s.h.map(function(v){return Math.round(v*({'PM2.5':.32/15*50,'PM10':.55/45*50,'NO₂':.5/25*50,'O₃':.9/100*50}[p]))})}
var cg=document.getElementById('cg'),pg=document.getElementById('pg'),gr=document.getElementById('gr');
Object.keys(CITY).forEach(function(c){var b=document.createElement('button');b.type='button';b.textContent=c;b.setAttribute('aria-pressed',c===city);b.addEventListener('click',function(){city=c;[].forEach.call(cg.children,function(x){x.setAttribute('aria-pressed',x===b)});build()});cg.appendChild(b)});
POL.forEach(function(p){var b=document.createElement('button');b.type='button';b.textContent=p;b.setAttribute('aria-pressed',p===pol);b.addEventListener('click',function(){pol=p;[].forEach.call(pg.children,function(x){x.setAttribute('aria-pressed',x===b)});paint(true)});pg.appendChild(b)});
function spark(h,w,hh){var mx=Math.max.apply(null,h),mn=Math.min.apply(null,h),pts=h.map(function(v,i){return[i/(h.length-1)*w,hh-4-(v-mn)/(mx-mn||1)*(hh-10)]});return pts}
function build(){document.getElementById('h1').textContent=city+' air quality';gr.innerHTML='';tiles=[];data[city].forEach(function(s,i){var t=document.createElement('button');t.type='button';t.className='t';t.setAttribute('aria-haspopup','dialog');t.innerHTML='<div class="th"><h3>'+s.n+'</h3><span class="ai"></span></div><span class="bl"></span><div class="pb"></div><svg class="sp" viewBox="0 0 220 44" tabindex="0" role="img" aria-label=""></svg><div class="rd"></div>';t.addEventListener('click',function(e){if(e.target.closest('.sp')&&e.detail===0)return;openD(s)});tiles.push(t);gr.appendChild(t);
var sp=t.querySelector('.sp');sp.addEventListener('click',function(e){e.stopPropagation()});sp.addEventListener('keydown',function(e){var d={ArrowRight:1,ArrowLeft:-1}[e.key];if(d){e.preventDefault();e.stopPropagation();var cur=sp._i===undefined?23:sp._i;sp._i=Math.max(0,Math.min(23,cur+d));rd(t,s,sp._i)}else if(e.key===' '||e.key==='Enter'){e.stopPropagation()}});sp.addEventListener('pointermove',function(e){var r=sp.getBoundingClientRect();sp._i=Math.max(0,Math.min(23,Math.round((e.clientX-r.left)/r.width*23)));rd(t,s,sp._i)});sp.addEventListener('pointerleave',function(){sp._i=undefined;t.querySelector('.rd').textContent=''});
t.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target!==t){e.preventDefault()}})});paint(false)}
function rd(t,s,i){var h=serie(s,pol),hrs=(23-i);t.querySelector('.rd').textContent=(hrs?hrs+' h ago':'Now')+': '+(pol==='AQI'?'AQI ':pol+' index ')+h[i]+' ('+band(h[i])[1]+')'}
function paint(anim){var tot=0;data[city].forEach(function(s,i){var t=tiles[i],v=idx(s,pol),b=band(v),was=t._b;tot+=v;t.style.setProperty('--b',b[2]);t.style.setProperty('--f',b[3]);t.querySelector('.ai').textContent=v;t.querySelector('.bl').textContent=b[1];
var pb=[['PM2.5',s.pm25,'µg'],['NO₂',s.no2,'µg'],['O₃',s.o3,'µg']];t.querySelector('.pb').innerHTML=pb.map(function(p){var g=GUIDE[p[0]];return'<div><span>'+p[0]+'</span><span class="tr"><i style="width:'+Math.min(100,p[1]/(g*3)*100)+'%"></i><u style="left:'+(1/3*100)+'%"></u></span><b>'+p[1].toFixed(1)+'</b></div>'}).join('');
var h=serie(s,pol),pts=spark(h,220,44),sp=t.querySelector('.sp');sp.innerHTML='<polyline points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'" fill="none" stroke="'+b[2]+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+pts[23][0]+'" cy="'+pts[23][1]+'" r="4" fill="'+b[2]+'" stroke="#fff" stroke-width="2"/>';sp.setAttribute('aria-label','24 hour trend for '+s.n+'. Now '+h[23]+', '+band(h[23])[1]+'. Use arrow keys to read earlier hours.');t.setAttribute('aria-label',s.n+', '+(pol==='AQI'?'AQI ':pol+' index ')+v+', '+b[1]);
if(was&&was!==b[1]&&!anim){t.classList.remove('fl');void t.offsetWidth;t.classList.add('fl');var n=Date.now();if(n-lastAnn>10000){lastAnn=n;document.getElementById('lv').textContent=s.n+' is now '+b[1]}}t._b=b[1]});
var avg=Math.round(tot/8),b=band(avg);var cv=document.getElementById('cv'),from=+cv.textContent||0,t0=performance.now();(function f(n){var k=reduce?1:Math.min(1,(n-t0)/700);cv.textContent=Math.round(from+(avg-from)*k);if(k<1)requestAnimationFrame(f)})(t0);
var nd=document.getElementById('nd');nd.style.transform='rotate('+(Math.min(300,avg)/300*180-90)+'deg)';if(reduce)nd.style.transition='none';var cb=document.getElementById('cb');cb.textContent=b[1];cb.style.setProperty('--b',b[2]);cb.style.setProperty('--f',b[3]);
var ADV={Good:['Air quality is good. Enjoy the outdoors.',['Everyone|Normal outdoor activity is fine.']],Moderate:['Air quality is acceptable.',['Sensitive|Unusually sensitive people should reduce long outdoor exertion.','Everyone|Normal activity is fine.']],'Unhealthy for sensitive groups':['Some people may feel effects.',['Sensitive|Reduce prolonged or heavy exertion outdoors.','Asthma|Keep your quick-relief inhaler handy.','Everyone|Shorter outdoor sessions are fine.']],Unhealthy:['Everyone may begin to feel effects.',['Everyone|Reduce prolonged outdoor exertion.','Sensitive|Stay indoors when you can.','Tip|Keep windows closed near busy roads.']],'Very unhealthy':['Health warning for everyone.',['Everyone|Avoid outdoor exertion.','Tip|Use a well-fitted mask if you must go out.']]}[b[1]];
document.getElementById('at').textContent='Health advice: '+b[1];document.getElementById('ap').textContent=ADV[0];document.getElementById('al').innerHTML=ADV[1].map(function(x){var p=x.split('|');return'<li><b>'+p[0]+'</b><span>'+p[1]+'</span></li>'}).join('')}
function drift(){var r=rng(seed++);Object.keys(CITY).forEach(function(c){data[c].forEach(function(s){var d=Math.round((r()-.45)*14);s.h.shift();s.h.push(Math.max(8,Math.min(210,s.h[22]+d)));var v=s.h[23];s.pm25=v*.32;s.pm10=v*.55;s.no2=v*.5;s.o3=v*.9})});upd=0;paint(false)}
setInterval(drift,5000);setInterval(function(){upd++;document.getElementById('ud').textContent='Updated '+upd+' s ago'},1000);
var dlg=document.getElementById('dlg'),cur=null;function openD(s){cur=s;var h=serie(s,pol),b=band(h[23]);document.getElementById('dh').textContent=s.n;document.getElementById('ds').textContent=(pol==='AQI'?'AQI ':pol+' index ')+h[23]+' · '+b[1];var W=520,H=150,mx=Math.max.apply(null,h)+10,pts=h.map(function(v,i){return[20+i/23*(W-30),H-22-(v/mx)*(H-34)]}),g='';[50,100,150].forEach(function(l){if(l<mx){var y=H-22-(l/mx)*(H-34);g+='<line x1="20" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#dbe7f1"/><text x="2" y="'+(y+4)+'" font-size="10" fill="#526a80">'+l+'</text>'}});
document.getElementById('db').innerHTML=g+'<polyline points="'+pts.map(function(p){return p[0]+','+p[1]}).join(' ')+'" fill="none" stroke="'+b[2]+'" stroke-width="3" stroke-linejoin="round"/>'+[0,6,12,18,23].map(function(i){return'<text x="'+pts[i][0]+'" y="'+(H-4)+'" font-size="10" fill="#526a80" text-anchor="middle">'+(i===23?'now':(23-i)+'h ago')+'</text>'}).join('');
var r=rng(s.n.length*5),f=[];for(var i=1;i<=6;i++)f.push(Math.max(8,Math.round(h[23]+(r()-.4)*30)));document.getElementById('fc').innerHTML=f.map(function(v,i){var bb=band(v);return'<i style="height:'+Math.min(100,v/mx*100)+'%;--b:'+bb[2]+'" title="+'+(i+1)+' h: '+v+' '+bb[1]+'"><span>+'+(i+1)+'h</span></i>'}).join('');dlg.style.setProperty('--b',b[2]);dlg.showModal()}
document.getElementById('dx').addEventListener('click',function(){dlg.close()});dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});var sw=document.getElementById('sw');sw.addEventListener('click',function(){sw.setAttribute('aria-checked',sw.getAttribute('aria-checked')!=='true')});
build();
})();
</script></body></html>
