<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ward Bed Board — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#f1f6f7;color:#12292e;font:400 14px/1.45 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #12292e;outline-offset:2px;box-shadow:0 0 0 6px #fff;border-radius:10px}
.tb{display:flex;align-items:center;gap:14px;padding:14px clamp(14px,3vw,32px);background:#fff;border-bottom:1px solid #d7e4e6;flex-wrap:wrap}.tb h1{font:700 22px Sora,sans-serif;margin:0;margin-right:auto;letter-spacing:-.01em}.tb h1 small{font:500 14px Inter,sans-serif;color:#4f6a70;margin-left:8px}
.chp{background:#e4f2f3;color:#0a5a62;border-radius:99px;padding:4px 14px;font-weight:600;font-size:13px}.ck{font:600 14px Sora,sans-serif;font-variant-numeric:tabular-nums;color:#4f6a70}.btn{font:600 13px Inter,sans-serif;background:#fff;border:1.5px solid #b7cfd2;border-radius:10px;padding:8px 14px;cursor:pointer;color:#12292e}
.w{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;max-width:1320px;margin:0 auto;padding:16px clamp(14px,3vw,32px) 50px;align-items:start}
.fs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.fs button{font:600 13px Inter,sans-serif;border:1.5px solid #c3d8da;background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;color:#12292e;display:flex;gap:8px;align-items:center}.fs button b{background:#e8f0f1;border-radius:99px;padding:0 8px;font:700 12px Sora,sans-serif}.fs button[aria-pressed=true]{background:#12292e;color:#fff;border-color:#12292e}.fs button[aria-pressed=true] b{background:rgba(255,255,255,.2)}
.bays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.bay{background:#fff;border:1px solid #d7e4e6;border-radius:16px;padding:14px}.bay h2{font:700 15px Sora,sans-serif;margin:0 0 10px;display:flex;justify-content:space-between}.bay h2 span{font:500 12px Inter,sans-serif;color:#4f6a70}
.bg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.bay.sr2 .bg{grid-template-columns:repeat(2,minmax(0,1fr))}.bay.sr2{grid-column:1/-1}.bay.sr2 .bg{grid-template-columns:repeat(4,minmax(0,1fr))}
.t{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:12px;min-height:84px;cursor:pointer;background:var(--b);color:var(--f);transition:transform .15s,opacity .25s,box-shadow .15s;border:2px solid transparent}
.t:hover{transform:translateY(-2px);box-shadow:0 8px 16px -8px rgba(0,0,0,.4)}.t:focus-visible{outline:3px solid #12292e;outline-offset:2px;box-shadow:0 0 0 6px #fff}.t[aria-pressed=true]{border-color:#12292e;box-shadow:0 0 0 3px #fff,0 0 0 5px #12292e}
.t.pop{animation:pp .3s}@keyframes pp{40%{transform:scale(1.08)}}.t.dim{opacity:.2}
.t b{font:700 15px Sora,sans-serif}.t .s{font:600 12px Inter,sans-serif;display:flex;gap:5px;align-items:center}.t .p{font:500 12px Inter,sans-serif;opacity:.95;margin-top:auto}
.st{position:sticky;top:14px;display:flex;flex-direction:column;gap:14px}.cd{background:#fff;border:1px solid #d7e4e6;border-radius:16px;padding:18px}
.rn{display:flex;gap:16px;align-items:center}.rn svg{width:104px;height:104px;transform:rotate(-90deg);flex:none}.rn b{display:block;font:700 30px Sora,sans-serif}.rn span{color:#4f6a70}
.cn{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}.cn li{display:flex;gap:8px;align-items:center;font-size:13px}.cn i{width:12px;height:12px;border-radius:4px}.cn b{margin-left:auto;font-family:Sora,sans-serif}
.dt h2{font:700 20px Sora,sans-serif;margin:0 0 4px}.dt .bdg{display:inline-flex;gap:6px;align-items:center;padding:3px 12px;border-radius:99px;font:600 12px Inter,sans-serif;background:var(--b);color:var(--f)}
.dt dl{margin:12px 0}.dt dt{font:600 11px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#4f6a70;margin-top:8px}.dt dd{margin:0}
.ac{display:flex;flex-direction:column;gap:8px;margin-top:12px}.ac button{font:600 14px Inter,sans-serif;border-radius:10px;padding:11px;cursor:pointer;border:1.5px solid #0e7c86;background:#0e7c86;color:#fff}.ac button.o{background:#fff;color:#0e7c86}.ac button:hover{filter:brightness(1.08)}
.lg{list-style:none;margin:8px 0 0;padding:0;font-size:13px;color:#4f6a70}.lg li{padding:4px 0;border-bottom:1px dashed #e0ebec}.lg time{font:600 12px Sora,sans-serif;color:#12292e;margin-right:6px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1000px){.w{grid-template-columns:minmax(0,1fr)}.st{position:static}}@media(max-width:560px){.bays{grid-template-columns:minmax(0,1fr)}.bay.sr2 .bg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="tb"><h1>Ward 6B <small>Marlowe General</small></h1><span class="chp">Day shift, 07:00 to 19:30</span><span class="ck" id="ck"></span><button class="btn" type="button" id="pr">Print handover</button></div>
<main class="w"><div><div class="fs" role="group" aria-label="Filter by status" id="fs"></div><div class="bays" id="bays"></div></div>
<aside class="st"><section class="cd" aria-label="Occupancy"><div class="rn"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="#e1ecee" stroke-width="12"/><circle id="rg" cx="50" cy="50" r="40" fill="none" stroke="#0e7c86" stroke-width="12" stroke-linecap="round" stroke-dasharray="251.3" style="transition:stroke-dashoffset .5s"/></svg><div><b id="pc">0%</b><span id="oc"></span></div></div><ul class="cn" id="cn"></ul></section>
<section class="cd dt" id="dt" aria-live="polite"></section><section class="cd"><b style="font:700 14px Sora,sans-serif">Recent changes</b><ul class="lg" id="lg"></ul></section></aside></main><div class="vh" id="lv" aria-live="polite"></div>
<script>
var S={occ:['Occupied','#0e7c86','#fff','●'],dis:['Discharge pending','#e08a00','#2b1a00','➜'],cln:['Cleaning','#6b5bd6','#fff','✦'],rdy:['Ready','#2f9e5a','#fff','✓'],blk:['Blocked','#6b7a80','#fff','⛔']},reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function(){
var INI=['A.K.','M.R.','J.O.','S.P.','T.H.','L.N.','D.B.','F.C.','R.W.','E.M.','G.S.','H.T.','P.A.','N.D.','C.V.','B.L.'],AG=['30s','40s','50s','60s','70s','80s'],DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'];
var st='occ occ dis occ rdy occ occ cln occ occ occ dis occ rdy occ occ occ blk occ cln occ occ occ rdy occ occ occ occ'.split(' ').slice(0,28),B=[];
var bays=[['Bay A',1,6],['Bay B',7,12],['Bay C',13,18],['Bay D',19,24],['Side rooms',25,28]];
for(var i=0;i<28;i++){var s=st[i]||'occ';B.push({n:i+1,s:s,p:(s==='occ'||s==='dis')?INI[i%16]:'',a:AG[i%6],e:DAYS[(i*2)%6],note:s==='blk'?'Bed rail fault, awaiting engineer.':s==='cln'?'Deep clean requested after isolation.':s==='dis'?'Medication and transport arranged.':s==='occ'?'Stable. Obs every 4 hours.':''})}
var flt='all',sel=-1,logs=[],bayEl=document.getElementById('bays'),tiles=[];
var clk=function(){var d=new Date();return('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)};
function tick(){document.getElementById('ck').textContent=clk()}tick();setInterval(tick,30000);
bays.forEach(function(bay,bi){var sec=document.createElement('section');sec.className='bay'+(bi===4?' sr2':'');sec.innerHTML='<h2>'+bay[0]+'<span>'+(bay[2]-bay[1]+1)+' beds</span></h2><div class="bg"></div>';var g=sec.lastChild;for(var n=bay[1];n<=bay[2];n++){(function(b){var t=document.createElement('button');t.type='button';t.className='t';t.tabIndex=-1;t.setAttribute('aria-pressed','false');t.addEventListener('click',function(){pick(b.n-1)});t.addEventListener('keydown',function(e){var all=tiles,i=b.n-1,d={ArrowRight:1,ArrowLeft:-1,ArrowDown:3,ArrowUp:-3}[e.key];if(d){e.preventDefault();var j=Math.max(0,Math.min(27,i+d));all[j].focus()}});g.appendChild(t);tiles[b.n-1]=t})(B[n-1])}bayEl.appendChild(sec)});
function paint(i,pop){var b=B[i],t=tiles[i],s=S[b.s];t.style.setProperty('--b',s[1]);t.style.setProperty('--f',s[2]);t.innerHTML='<b>Bed '+b.n+'</b><span class="s"><span aria-hidden="true">'+s[3]+'</span>'+s[0]+'</span><span class="p">'+(b.p?b.p+(b.s==='dis'?' · EDD today':' · EDD '+b.e):'&nbsp;')+'</span>';t.setAttribute('aria-label','Bed '+b.n+', '+s[0]+(b.p?', patient '+b.p:''));t.classList.toggle('dim',flt!=='all'&&b.s!==flt);if(pop&&!reduce){t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop')}}
function counts(){var c={occ:0,dis:0,cln:0,rdy:0,blk:0};B.forEach(function(b){c[b.s]++});return c}
function summary(){var c=counts(),occ=c.occ+c.dis,pct=Math.round(occ/28*100);document.getElementById('pc').textContent=pct+'%';document.getElementById('oc').textContent=occ+' of 28 beds occupied';document.getElementById('rg').style.strokeDashoffset=251.3*(1-occ/28);
document.getElementById('cn').innerHTML=Object.keys(S).map(function(k){return'<li><i style="background:'+S[k][1]+'"></i>'+S[k][0]+'<b>'+c[k]+'</b></li>'}).join('');
var fs=document.getElementById('fs');fs.innerHTML='';[['all','All',28]].concat(Object.keys(S).map(function(k){return[k,S[k][0],c[k]]})).forEach(function(f){var b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',flt===f[0]);b.innerHTML=f[1]+'<b>'+f[2]+'</b>';b.addEventListener('click',function(){flt=f[0];B.forEach(function(_,i){paint(i)});summary()});fs.appendChild(b)})}
var NEXT={occ:[['dis','Mark ready for discharge']],dis:[['cln','Patient left, send for cleaning']],cln:[['rdy','Cleaning complete']],rdy:[['occ','Admit patient'],['blk','Block bed','o']],blk:[['rdy','Unblock bed']]};
function pick(i){sel=i;tiles.forEach(function(t,k){t.setAttribute('aria-pressed',k===i);t.tabIndex=k===i?0:-1});detail()}
function detail(){var el=document.getElementById('dt');if(sel<0){el.innerHTML='<p style="margin:0;color:#4f6a70">Select a bed to see details and actions.</p>';return}var b=B[sel],s=S[b.s];el.style.setProperty('--b',s[1]);el.style.setProperty('--f',s[2]);
el.innerHTML='<h2>Bed '+b.n+'</h2><span class="bdg"><span aria-hidden="true">'+s[3]+'</span>'+s[0]+'</span><dl><dt>Patient</dt><dd>'+(b.p?b.p+', age '+b.a:'None')+'</dd><dt>Notes</dt><dd>'+(b.note||'No notes.')+'</dd></dl><div class="ac">'+NEXT[b.s].map(function(a){return'<button type="button" data-t="'+a[0]+'" class="'+(a[2]||'')+'">'+a[1]+'</button>'}).join('')+'</div>';
el.querySelectorAll('.ac button').forEach(function(btn){btn.addEventListener('click',function(){move(sel,btn.dataset.t)})})}
function move(i,to){var b=B[i],from=b.s;b.s=to;if(to==='occ'&&from==='rdy'){b.p=INI[(i*5+3)%16];b.a=AG[(i+2)%6];b.e=DAYS[(i+1)%6];b.note='Admitted from A&E. Awaiting bloods.'}if(to==='cln'){b.p='';b.note='Standard clean in progress.'}if(to==='rdy'&&from==='cln')b.note='';if(to==='blk')b.note='Blocked by bed manager.';if(to==='dis')b.note='Medication and transport arranged.';
paint(i,true);summary();detail();var msg=clk()+' Bed '+b.n+' '+(to==='dis'?'ready for discharge':to==='cln'?'sent for cleaning':to==='rdy'?(from==='blk'?'unblocked':'ready'):to==='blk'?'blocked':'admitted');logs.unshift(msg);logs=logs.slice(0,5);document.getElementById('lg').innerHTML=logs.map(function(l){return'<li><time>'+l.slice(0,5)+'</time>'+l.slice(6)+'</li>'}).join('');document.getElementById('lv').textContent=msg;var f=el=document.querySelector('.ac button');}
B.forEach(function(_,i){paint(i)});summary();tiles[0].tabIndex=0;detail();
document.getElementById('pr').addEventListener('click',function(){document.getElementById('lv').textContent='Handover sheet prepared.'});
})();
</script></body></html>
