<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CI Pipeline Dashboard — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#0d1117;color:#e6edf3;font:400 14px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}

.j{all:unset;box-sizing:border-box;display:block;background:#0f151c;border:1.5px solid #283241;border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s}.j:hover{border-color:#44546a}.j:focus-visible{outline:3px solid #58a6ff}.j[aria-pressed=true]{border-color:#58a6ff;background:#13243a}

.cp{font:600 12px Inter,sans-serif;background:#1c2430;border:1px solid #283241;color:#e6edf3;border-radius:8px;padding:5px 12px;cursor:pointer}
.g2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #222c3a}th{font:600 11px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#8b98a9}.fr{display:inline-block;width:60px;height:5px;border-radius:99px;background:#283241;vertical-align:middle;margin-right:8px;overflow:hidden}.fr i{display:block;height:100%;background:#d29922}
.ab button{font:600 12px Inter,sans-serif;background:#1c2430;border:1px solid #283241;color:#e6edf3;border-radius:7px;padding:4px 10px;cursor:pointer;margin-right:6px}.ab button:hover{border-color:#58a6ff}
.sv{background:#13241a;border:1px solid #1f4a2a;color:#7ee787;border-radius:10px;padding:8px 14px;margin-bottom:12px}
.q{margin-top:12px;color:#8b98a9}.q button{background:none;border:0;color:#58a6ff;cursor:pointer;text-decoration:underline;font:inherit}
@media(prefers-reduced-motion:reduce){.ic.running{animation:none;border-top-color:#58a6ff}*{transition:none!important}}
</style></head><body>
<div class="tb"><div class="logo"><i></i>pipewise</div><div class="bc">northwind / <b>web</b></div><select id="br" aria-label="Branch"><option>main</option><option>release/4.2</option><option>fix/cart-total</option></select><button class="btn" type="button" id="rn" aria-disabled="false">▸ Run pipeline</button></div>
<main class="w"><section class="p"><h2>Recent runs</h2><div class="hs" id="hs" role="listbox" aria-label="Pipeline runs"></div></section>
<section class="p"><div class="rh"><h1 id="rt"></h1><span class="mn" id="rm"></span><span class="bd" id="rb"></span></div></section>
<section class="p"><h2>Pipeline</h2><div class="gw"><div class="gr" id="gr"><svg id="sv" aria-hidden="true"></svg></div></div></section>
<section class="p"><h2><span id="lt">Log</span><button class="cp" type="button" id="cp">Copy log</button></h2><div class="lg" id="lg" role="log" tabindex="0"></div></section>
<section class="p"><h2>Flaky tests</h2><div class="sv" id="sv2">CI minutes saved by quarantining this week: <b id="sm">42</b></div><div class="tw"><table><thead><tr><th>Test</th><th>Failure rate</th><th>Last seen</th><th>Impact</th><th></th></tr></thead><tbody id="ft"></tbody></table></div><div class="q" id="qq"></div></section></main>
<script>
(function(){
var ST=[['Checkout',[['checkout',2]]],['Install',[['npm ci',48]]],['Verify',[['Lint',31],['Types',44],['Unit tests',92]]],['Build',[['Build app',76]]],['End-to-end',[['Chrome',134],['Mobile',121]]],['Deploy',[['Deploy preview',22]]]];
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,JOBS=[];ST.forEach(function(s,si){s[1].forEach(function(j){JOBS.push({n:j[0],d:j[1],si:si})})});
var STAT={passed:['Passed','✓'],failed:['Failed','✕'],running:['Running',''],queued:['Queued','·'],skipped:['Skipped','–'],flaky:['Flaky','!']};
var MSG=['Fix rounding in cart total','Add retry to payment webhook','Update Node to 22.x','Refactor product card grid','Bump dependencies','Tidy checkout copy','Fix flaky basket test','Add currency formatter','Improve image loading','Speed up search index','Handle empty wishlist','Add promo banner','Cache category pages','Fix typo in footer'],AU=['PN','CR','JM','IC','NH','JF','IT','MQ'];
var runs=[];for(var i=0;i<14;i++){var o={};var fail=i===2?'Types':i===6?'Chrome':i===10?'Unit tests':null;JOBS.forEach(function(j,k){var s='passed';if(fail){var fi=JOBS.findIndex(function(x){return x.n===fail});if(k===fi)s='failed';else if(k>fi&&j.si>JOBS[fi].si&&!(j.si===JOBS[fi].si))s='skipped'}o[j.n]=s});runs.push({n:2841-i,msg:MSG[i],au:AU[i%8],h:('a1b2c3d4e5f6a7b8'.slice(i,i+7)),st:fail?'failed':'passed',dur:fail?(200+i*7):(412+i*9),br:i%5===3?'fix/cart-total':'main',jobs:o,t:(i*47+12)+' min ago'})}
var sel=0,selJob='Unit tests',hs=document.getElementById('hs'),running=false,timers=[];
function badge(s){return'<span class="ic '+s+'" aria-hidden="true">'+STAT[s][1]+'</span>'}
function fmt(s){return Math.floor(s/60)+'m '+('0'+s%60).slice(-2)+'s'}
function hist(){hs.innerHTML='';runs.forEach(function(r,i){var b=document.createElement('button');b.type='button';b.setAttribute('role','option');b.setAttribute('aria-selected',i===sel);b.tabIndex=i===sel?0:-1;b.setAttribute('aria-label','Run '+r.n+', '+STAT[r.st][0]+', '+fmt(r.dur));b.innerHTML=badge(r.st)+'#'+r.n+' <span style="color:#8b98a9">'+fmt(r.dur)+'</span>';b.addEventListener('click',function(){sel=i;render()});b.addEventListener('keydown',function(e){var k={ArrowRight:1,ArrowLeft:-1}[e.key];if(k){e.preventDefault();var j=Math.max(0,Math.min(runs.length-1,i+k));sel=j;render();hs.children[j].focus()}});hs.appendChild(b)})}
function header(){var r=runs[sel];document.getElementById('rt').textContent=r.msg;document.getElementById('rm').innerHTML=r.au+' · <span class="mn">'+r.h+'</span> · <span class="mn">'+r.br+'</span> · '+r.t+' · '+fmt(r.dur);var b=document.getElementById('rb');b.className='bd '+r.st;b.innerHTML=badge(r.st)+STAT[r.st][0]}
function graph(){var gr=document.getElementById('gr'),r=runs[sel];gr.querySelectorAll('.st').forEach(function(x){x.remove()});ST.forEach(function(s,si){var d=document.createElement('div');d.className='st';d.innerHTML='<h3>'+s[0]+'</h3>';s[1].forEach(function(j){var st=r.jobs[j[0]],b=document.createElement('button');b.type='button';b.className='j';b.dataset.n=j[0];b.setAttribute('aria-pressed',j[0]===selJob);b.setAttribute('aria-label',j[0]+', '+STAT[st][0]+(st==='running'?'':', '+fmt(j[1])));b.innerHTML='<div>'+badge(st)+'<b>'+j[0]+'</b><small>'+(st==='skipped'||st==='queued'?'—':fmt(j[1]))+'</small></div>'+(st==='running'?'<div class="pg"><i id="pg-'+j[0].replace(/\W/g,'')+'"></i></div>':'');b.addEventListener('click',function(){selJob=j[0];graph();logs()});d.appendChild(b)});gr.appendChild(d)});setTimeout(lines,0)}
function lines(){var gr=document.getElementById('gr'),sv=document.getElementById('sv'),g=gr.getBoundingClientRect(),h='';var cols=[].slice.call(gr.querySelectorAll('.st'));for(var i=0;i<cols.length-1;i++){[].forEach.call(cols[i].querySelectorAll('.j'),function(a){[].forEach.call(cols[i+1].querySelectorAll('.j'),function(b){var ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect(),x1=ra.right-g.left,y1=ra.top+ra.height/2-g.top,x2=rb.left-g.left,y2=rb.top+rb.height/2-g.top,mx=(x1+x2)/2;h+='<path d="M'+x1+' '+y1+'C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="#3a4658" stroke-width="2"/>'})})}sv.setAttribute('viewBox','0 0 '+g.width+' '+g.height);sv.innerHTML=h}
function logs(){var r=runs[sel],st=r.jobs[selJob],j=JOBS.find(function(x){return x.n===selJob}),el=document.getElementById('lg'),L=[];document.getElementById('lt').textContent='Log · '+selJob+' · '+STAT[st][0];
if(st==='skipped'){L=['<span class="dm">This job was skipped because an earlier job failed.</span>']}else if(st==='queued'){L=['<span class="dm">Waiting for a runner…</span>']}else{L=['<span class="dm">[00:00]</span> $ '+(selJob==='Unit tests'?'npx vitest run --coverage':selJob==='Lint'?'npx eslint . --max-warnings 0':selJob==='Types'?'npx tsc --noEmit':selJob.indexOf('Build')===0?'npm run build':selJob==='Chrome'||selJob==='Mobile'?'npx playwright test --project='+selJob.toLowerCase():selJob==='Deploy preview'?'pipewise deploy --preview':'./scripts/'+selJob.replace(/\W+/g,'-')),'<span class="dm">[00:02]</span> Using Node 22.4.0, cache restored (412 MB)','<span class="dm">[00:09]</span> Collecting files… <span class="ok">done</span>'];
if(selJob==='Unit tests')L.push('<span class="dm">[00:31]</span> <span class="ok">✓</span> cart/total.test.ts (14 tests)','<span class="dm">[00:44]</span> <span class="ok">✓</span> product/price.test.ts (22 tests)','<span class="dm">[01:02]</span> <span class="wn">⚠ basket/sync.test.ts passed on retry (flaky)</span>');else L.push('<span class="dm">[00:20]</span> Running '+(j.d>40?'steps in parallel':'checks')+'…','<span class="dm">[00:'+Math.min(59,Math.round(j.d*.6))+']</span> <span class="ok">✓</span> 0 problems found');
if(st==='failed')L.push('<span class="er">✕ Error: Type "string" is not assignable to type "number" (src/cart/total.ts:48)</span>','<span class="er">Process exited with code 1</span>');else if(st==='running')L.push('<span class="dm">… still running</span>');else L.push('<span class="ok">Done in '+fmt(j.d)+'. Exit code 0.</span>')}el.innerHTML=L.join('\n')}
function render(){hist();header();graph();logs()}
document.getElementById('cp').addEventListener('click',function(){var b=this;try{navigator.clipboard.writeText(document.getElementById('lg').textContent).then(d,d)}catch(e){d()}function d(){b.textContent='Copied ✓';setTimeout(function(){b.textContent='Copy log'},1500)}});
document.getElementById('rn').addEventListener('click',function(){if(running)return;running=true;var btn=this;btn.setAttribute('aria-disabled','true');btn.textContent='Running…';var o={};JOBS.forEach(function(j){o[j.n]='queued'});var br=document.getElementById('br').value,r={n:2842,msg:'Run from dashboard on '+br,au:'ME',h:'e7f8a9b',st:'running',dur:0,br:br,jobs:o,t:'just now'};runs.unshift(r);sel=0;selJob='Unit tests';render();
var start=0,order=ST.map(function(s){return s[1].map(function(j){return j[0]})}),tm=reduce?200:800,pgv={};
order.forEach(function(stage,si){stage.forEach(function(n,k){setTimeout(function(){r.jobs[n]='running';r.dur+=5;graph();header();var id='pg-'+n.replace(/\W/g,''),p=0;var iv=setInterval(function(){p+=reduce?50:20;var e=document.getElementById(id);if(e)e.style.width=Math.min(100,p)+'%';if(p>=100)clearInterval(iv)},reduce?30:60);
setTimeout(function(){var fail=n==='Chrome'&&!r.retried;if(fail){r.retried=true;r.jobs[n]='failed';graph();setTimeout(function(){r.jobs[n]='running';graph();setTimeout(function(){r.jobs[n]='passed';r.dur+=22;finish()},tm)},tm)}else{r.jobs[n]='passed';r.dur+=Math.round(JOBS.find(function(x){return x.n===n}).d/6);finish()}},tm*(1.2+k*.5))},si*tm*2.2+(reduce?0:300))});});
function finish(){graph();header();hist();logs();var all=JOBS.every(function(j){return r.jobs[j.n]==='passed'});if(all&&running){r.st='passed';r.dur=388;running=false;btn.setAttribute('aria-disabled','false');btn.textContent='▸ Run pipeline';render()}}});
var FT=[['basket/sync.test.ts › merges guest basket',18,'12 min ago','High'],['checkout/payment.e2e › 3-D Secure redirect',11,'1 h ago','High'],['search/index.test.ts › debounced query',9,'3 h ago','Medium'],['gallery.e2e › swipe to next image',7,'yesterday','Low']],quar=[],ft=document.getElementById('ft');
function ftDraw(){ft.innerHTML=FT.map(function(t,i){return'<tr><td class="mn">'+t[0]+'</td><td><span class="fr"><i style="width:'+t[1]*4+'%"></i></span>'+t[1]+'%</td><td>'+t[2]+'</td><td>'+t[3]+'</td><td class="ab"><button type="button" data-a="rerun" data-i="'+i+'">Rerun</button><button type="button" data-a="q" data-i="'+i+'">Quarantine</button></td></tr>'}).join('');
ft.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){var i=+b.dataset.i;if(!b.isConnected||!FT[i])return;if(b.dataset.a==='q'){quar.push(FT.splice(i,1)[0]);document.getElementById('sm').textContent=42+quar.length*13;ftDraw()}else{b.textContent='Queued…';b.disabled=true;setTimeout(function(){b.textContent='Passed ✓'},reduce?200:1200)}})});
document.getElementById('qq').innerHTML=quar.length?'Quarantined ('+quar.length+'): '+quar.map(function(q,i){return q[0].split(' › ')[0]+' <button type="button" data-u="'+i+'">Undo</button>'}).join(' · '):'';document.querySelectorAll('[data-u]').forEach(function(b){b.addEventListener('click',function(){if(!quar[+b.dataset.u])return;FT.push(quar.splice(+b.dataset.u,1)[0]);document.getElementById('sm').textContent=42+quar.length*13;ftDraw()})})}
ftDraw();render();addEventListener('resize',lines);
})();
</script></body></html>
