<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleet Tracker Board — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#0f1318;color:#e9eef5;font:400 14px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #38d39f;outline-offset:2px;border-radius:10px}
.tb{display:flex;align-items:center;gap:14px;padding:14px clamp(14px,2.5vw,28px);border-bottom:1px solid #222b37;flex-wrap:wrap}.logo{font:700 22px 'Space Grotesk',sans-serif;letter-spacing:-.02em;margin-right:auto}.logo i{display:inline-block;width:14px;height:14px;background:#38d39f;border-radius:4px;margin-right:8px;transform:rotate(45deg)}
.ck{font:600 14px 'Space Grotesk',sans-serif;color:#98a6b8;font-variant-numeric:tabular-nums}.lv{display:flex;align-items:center;gap:8px;background:#171d25;border:1px solid #2a3340;border-radius:99px;padding:5px 14px;font-weight:600;font-size:13px}.lv i{width:8px;height:8px;border-radius:50%;background:#38d39f;animation:pu 1.6s infinite}@keyframes pu{0%{box-shadow:0 0 0 0 rgba(56,211,159,.6)}100%{box-shadow:0 0 0 9px rgba(56,211,159,0)}}
.w{display:grid;grid-template-columns:360px minmax(0,1fr) 320px;gap:14px;padding:14px clamp(14px,2.5vw,28px) 40px;align-items:start}
.p{background:#171d25;border:1px solid #2a3340;border-radius:16px}.lp{max-height:calc(100vh - 100px);display:flex;flex-direction:column;min-height:0}
.ft{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}.chs{display:flex;gap:6px;flex-wrap:wrap}.chs button{font:600 13px Inter,sans-serif;border:1px solid #2f3a48;background:#11161d;color:#c5d0de;border-radius:99px;padding:5px 12px;cursor:pointer}.chs button[aria-pressed=true]{background:#e9eef5;color:#0f1318;border-color:#e9eef5}
.so{display:flex;align-items:center;gap:8px;font-size:13px;color:#98a6b8}.so select{flex:1;font:500 13px Inter,sans-serif;background:#11161d;color:#e9eef5;border:1px solid #2f3a48;border-radius:10px;padding:7px 10px}
.ls{list-style:none;margin:0;padding:0 8px 10px;overflow:auto;flex:1;min-height:0}.ls li{margin-bottom:4px}
.r{all:unset;box-sizing:border-box;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px;border-radius:12px;border-left:3px solid transparent;cursor:pointer;transition:background .15s}.r:hover{background:#1e2631}.r:focus-visible{outline:3px solid #38d39f;outline-offset:-1px}.r[aria-pressed=true]{background:#1f2a35;border-left-color:#38d39f}
.vi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 12px 'Space Grotesk',sans-serif;color:#0f1318;background:var(--c)}.r b{display:block;font:600 14px 'Space Grotesk',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.r small{display:block;color:#98a6b8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eta{text-align:right;font:700 15px 'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}.eta small{display:block;font:500 11px Inter,sans-serif;color:var(--c)}.fb{height:3px;border-radius:3px;background:#2a3340;margin-top:5px;overflow:hidden;width:100%}.fb i{display:block;height:100%;background:#7aa7d9}.fb.lo i{background:#ff6b6b}
.al{display:inline-block;background:#ff6b6b;color:#1a0505;font:700 10px Inter,sans-serif;border-radius:99px;padding:0 7px;margin-left:6px;vertical-align:1px}
.mp{position:relative;overflow:hidden}.mp svg{width:100%;height:auto;display:block;background:#0b1016}.mk{cursor:pointer;transition:opacity .25s}.mk:focus-visible{outline:none}.mk:focus-visible circle.ring{stroke:#fff;stroke-width:3}
.mk text{font:600 10px 'Space Grotesk',sans-serif;fill:#e9eef5;paint-order:stroke;stroke:#0b1016;stroke-width:3px}
.dt{padding:18px}.dt h2{font:700 20px 'Space Grotesk',sans-serif;margin:0}.dt .dr{display:flex;gap:12px;align-items:center;margin:12px 0}.av{width:46px;height:46px;border-radius:50%;background:#2c3a4d;display:grid;place-items:center;font:700 16px 'Space Grotesk',sans-serif}
.st{display:inline-flex;gap:6px;align-items:center;font:600 12px Inter,sans-serif;border-radius:99px;padding:3px 10px;background:rgba(255,255,255,.08);color:var(--c)}.st:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.gr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.gr div{background:#11161d;border-radius:12px;padding:10px 12px}.gr small{color:#98a6b8;font-size:12px}.gr b{display:block;font:700 24px 'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}
.pg{margin:12px 0}.pg div{display:flex;justify-content:space-between;font-size:13px;color:#98a6b8;margin-bottom:5px}.pg .tr{height:8px;background:#2a3340;border-radius:99px;overflow:hidden}.pg .tr i{display:block;height:100%;background:#38d39f;border-radius:99px;transition:width .4s}
.nx{background:#11161d;border-radius:12px;padding:12px;margin-bottom:14px}.nx small{color:#98a6b8}.nx b{display:block}
.ac{display:flex;gap:8px}.ac button{flex:1;font:600 14px Inter,sans-serif;border-radius:10px;padding:10px;cursor:pointer;border:1px solid #38d39f;background:transparent;color:#38d39f;transition:background .2s}.ac button:hover{background:rgba(56,211,159,.12)}.ac .p2{background:#38d39f;color:#05150f}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);background:#e9eef5;color:#0f1318;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1100px){.w{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mp{grid-column:1/-1;order:-1}.lp{max-height:520px}}
@media(max-width:700px){.w{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.lv i{animation:none}*{transition:none!important}}
</style></head><body>
<div class="tb"><div class="logo"><i></i>convoy</div><span class="ck" id="ck"></span><span class="lv"><i></i>12 vehicles live</span></div>
<main class="w"><section class="p lp" aria-label="Vehicles"><div class="ft"><div class="chs" role="group" aria-label="Filter by status" id="chs"></div><label class="so">Sort<select id="so"><option value="eta">ETA, soonest first</option><option value="name">Name</option><option value="fuel">Fuel, lowest first</option></select></label></div><ul class="ls" id="ls"></ul></section>
<section class="p mp" aria-label="Live map"><svg id="map" viewBox="0 0 800 520" role="img" aria-label="Map of Northline Couriers vehicles across the city"></svg></section>
<aside class="p dt" id="dt" aria-live="polite"></aside></main><div class="toast" id="toast" role="status"></div><div class="sr" id="sr"></div>
<script>
(function(){
var COL={Moving:'#38d39f',Idle:'#ffb454',Offline:'#8a95a6',Alert:'#ff6b6b'},reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var P=[ 'M60 440 C160 400 240 360 330 330 S520 260 640 200 S740 120 760 80','M80 90 C170 130 230 190 300 220 S440 290 520 380 S650 470 730 470','M400 40 C400 120 390 200 400 260 S420 380 410 490','M40 250 C140 240 260 250 380 250 S600 240 770 270'];
var V=[['VAN 01','Priya N.','NL 01 KTD','Moving',0,.16,.012,74,'Harbour Wharf','8 min',3],['VAN 02','Callum R.','NL 02 KTD','Moving',1,.4,.009,52,'Mill Road Depot','21 min',5],['VAN 03','Joan M.','NL 03 KTD','Idle',2,.5,0,0,'Parked at Depot','—',2],['VAN 04','Idris C.','NL 04 KTD','Moving',3,.2,.014,63,'Station Square','14 min',6],['VAN 05','Noor H.','NL 05 KTD','Moving',0,.62,.007,46,'Elm Court','32 min',4],['VAN 06','Joss F.','NL 06 KTD','Offline',1,.7,0,0,'No signal 41 min','—',1],['VAN 07','Iris T.','NL 07 KTD','Alert',2,.28,.006,31,'Kiln Lane, late 12 min','26 min',7],['VAN 08','Mara Q.','NL 08 KTD','Moving',3,.55,.011,58,'Orchard Park','11 min',4],['VAN 09','Tom B.','NL 09 KTD','Idle',0,.85,0,0,'Waiting at Dock 3','—',3],['VAN 10','Aiko S.','NL 10 KTD','Moving',1,.78,.01,49,'Bridge Street','17 min',8],['VAN 11','Ben L.','NL 11 KTD','Offline',2,.88,0,0,'No signal 2 h','—',0],['VAN 12','Zara D.','NL 12 KTD','Moving',3,.1,.013,67,'Canal Basin','19 min',2]].map(function(v,i){return{id:i,n:v[0],dr:v[1],pl:v[2],st:v[3],path:v[4],t:v[5],sp:v[6],kmh:v[7],nxt:v[8],eta:v[9],done:v[10],fuel:[82,64,45,71,33,58,24,90,55,67,19,76][i],etaN:v[9]==='—'?999:parseInt(v[9])}});
var sel=0,flt='All',sortBy='eta',map=document.getElementById('map'),paths=[];
var h='<rect width="800" height="520" fill="#0b1016"/><path d="M0 330C120 300 190 360 300 380S520 400 600 470L640 520H0z" fill="#12304a" opacity=".8"/><rect x="560" y="60" width="120" height="90" rx="10" fill="#12261f"/><rect x="90" y="150" width="90" height="70" rx="10" fill="#12261f"/><rect x="450" y="300" width="100" height="70" rx="10" fill="#12261f"/>';
for(var x=50;x<800;x+=70)h+='<path d="M'+x+' 0V520" stroke="#1c2530" stroke-width="5"/>';for(var y=40;y<520;y+=65)h+='<path d="M0 '+y+'H800" stroke="#1c2530" stroke-width="5"/>';
P.forEach(function(d,i){h+='<path id="r'+i+'" d="'+d+'" fill="none" stroke="#2f3d50" stroke-width="12" stroke-linecap="round"/><path d="'+d+'" fill="none" stroke="#3a4b62" stroke-width="2" stroke-dasharray="8 10"/>'});
h+='<g id="hl"></g>';[['Depot',400,260],['Harbour Wharf',300,330],['Station Sq',520,260],['Kiln Lane',290,210],['Canal Basin',180,252],['Bridge St',640,200]].forEach(function(d){h+='<g><rect x="'+(d[1]-6)+'" y="'+(d[2]-6)+'" width="12" height="12" rx="3" fill="#e9eef5"/><text x="'+(d[1]+10)+'" y="'+(d[2]-8)+'" style="font:600 10px Space Grotesk,sans-serif;fill:#98a6b8">'+d[0]+'</text></g>'});
h+='<g id="vs"></g>';map.innerHTML=h;
var pEls=P.map(function(_,i){return document.getElementById('r'+i)}),lens=pEls.map(function(p){return p.getTotalLength()}),vs=document.getElementById('vs');
V.forEach(function(v){var g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','mk');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',v.n+', '+v.dr+', '+v.st+(v.eta!=='—'?', ETA '+v.eta:''));g.innerHTML='<circle class="ring" r="11" fill="'+COL[v.st]+'" stroke="#fff" stroke-width="2" '+(v.st==='Offline'?'stroke-dasharray="3 3"':'')+'/><text y="3.5" text-anchor="middle" style="font:700 9px Space Grotesk,sans-serif;fill:#0b1016;stroke:none">'+(v.id+1)+'</text>';g.addEventListener('click',function(){select(v.id)});g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();select(v.id)}});vs.appendChild(g);v.el=g});
function place(v){var L=lens[v.path],pt=pEls[v.path].getPointAtLength(v.t*L);v.el.setAttribute('transform','translate('+pt.x+' '+pt.y+')')}
function mv(){V.forEach(function(v){if(v.sp&&(v.st==='Moving'||v.st==='Alert')){v.t+=v.sp*(reduce?1:.05)/(reduce?1:.5)*(reduce?.2:.01)*5;if(v.t>1)v.t-=1}place(v)})}
var last=0;function loop(t){if(t-last>(reduce?2000:50)){last=t;mv()}requestAnimationFrame(loop)}
function ok(v){return flt==='All'||v.st===flt||(flt==='Moving'&&v.st==='Alert')}
function counts(){return{All:12,Moving:V.filter(function(v){return v.st==='Moving'||v.st==='Alert'}).length,Idle:V.filter(function(v){return v.st==='Idle'}).length,Offline:V.filter(function(v){return v.st==='Offline'}).length}}
var chs=document.getElementById('chs'),C=counts();['All','Moving','Idle','Offline'].forEach(function(f){var b=document.createElement('button');b.type='button';b.textContent=f+' '+C[f];b.setAttribute('aria-pressed',f==='All');b.addEventListener('click',function(){flt=f;[].forEach.call(chs.children,function(x){x.setAttribute('aria-pressed',x===b)});renderList(true)});chs.appendChild(b)});
var ls=document.getElementById('ls');
function sorted(){var a=V.filter(ok);if(sortBy==='eta')a.sort(function(x,y){return x.etaN-y.etaN});else if(sortBy==='name')a.sort(function(x,y){return x.dr.localeCompare(y.dr)});else a.sort(function(x,y){return x.fuel-y.fuel});return a}
function renderList(flip){var first={};if(flip&&!reduce)[].forEach.call(ls.children,function(li){first[li.dataset.id]=li.getBoundingClientRect().top});ls.innerHTML='';sorted().forEach(function(v){var li=document.createElement('li');li.dataset.id=v.id;var c=COL[v.st];li.innerHTML='<button class="r" type="button" aria-pressed="'+(v.id===sel)+'" style="--c:'+c+'"><span class="vi">'+(v.id+1)+'</span><span style="min-width:0"><b>'+v.n+' · '+v.dr.split(' ')[0]+(v.st==='Alert'?'<span class="al">LATE</span>':'')+'</b><small>'+v.nxt+'</small><div class="fb'+(v.fuel<30?' lo':'')+'"><i style="width:'+v.fuel+'%"></i></div></span><span class="eta">'+(v.eta==='—'?'—':v.eta)+'<small>'+v.st+'</small></span></button>';
var b=li.firstChild;b.addEventListener('click',function(){select(v.id)});b.addEventListener('keydown',function(e){var n=e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0;if(n){e.preventDefault();var all=[].slice.call(ls.querySelectorAll('.r')),j=all.indexOf(b)+n;if(all[j])all[j].focus()}});ls.appendChild(li);if(flip&&!reduce&&first[v.id]!==undefined){var dy=first[v.id]-li.getBoundingClientRect().top;if(dy){li.style.transform='translateY('+dy+'px)';li.style.transition='none';requestAnimationFrame(function(){li.style.transition='transform .3s';li.style.transform=''})}}});
V.forEach(function(v){v.el.style.opacity=ok(v)?1:.15});document.getElementById('sr').textContent=sorted().map(function(v){return v.n+' '+v.st}).join('. ')}
function select(i){sel=i;renderList(false);var v=V[i];document.getElementById('hl').innerHTML='<path d="'+P[v.path]+'" fill="none" stroke="#38d39f" stroke-width="4" stroke-linecap="round" style="filter:drop-shadow(0 0 6px #38d39f)"/>';vs.appendChild(v.el);detail(v)}
var kmh=0;function detail(v){var c=COL[v.st],el=document.getElementById('dt');el.innerHTML='<h2>'+v.n+' <span class="st" style="--c:'+c+'">'+v.st+'</span></h2><div class="dr"><span class="av">'+v.dr.split(' ').map(function(w){return w[0]}).join('')+'</span><div><b>'+v.dr+'</b><br><small style="color:#98a6b8">'+v.pl+'</small></div></div><div class="gr"><div><small>Speed</small><b><span id="spd">0</span> <small>km/h</small></b></div><div><small>Fuel</small><b>'+v.fuel+'<small>%</small></b></div></div><div class="pg"><div><span>Stops today</span><span>'+v.done+' of 9</span></div><div class="tr"><i style="width:'+(v.done/9*100)+'%"></i></div></div><div class="nx"><small>Next stop</small><b>'+v.nxt+'</b><small>ETA '+(v.eta==='—'?'not available':v.eta)+'</small></div><div class="ac"><button type="button" class="p2" data-t="Calling '+v.dr+'…">Call driver</button><button type="button" data-t="ETA link copied">Share ETA</button></div>';
var from=kmh,to=v.kmh,t0=performance.now();kmh=to;(function f(n){var k=reduce?1:Math.min(1,(n-t0)/500);var e=document.getElementById('spd');if(e)e.textContent=Math.round(from+(to-from)*k);if(k<1)requestAnimationFrame(f)})(t0);
el.querySelectorAll('.ac button').forEach(function(b){b.addEventListener('click',function(){var t=document.getElementById('toast');t.textContent=b.dataset.t;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1700)})})}
document.getElementById('so').addEventListener('change',function(e){sortBy=e.target.value;renderList(true)});
function clock(){document.getElementById('ck').textContent=new Date().toLocaleTimeString('en-GB')}clock();setInterval(clock,1000);
V.forEach(place);renderList(false);select(0);requestAnimationFrame(loop);
})();
</script></body></html>
