<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Gradebook — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Inter:wght@400;500;600&family=Newsreader:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#f8f5ee;color:#22201a;font:400 14px/1.45 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #2a5fc7;outline-offset:1px;border-radius:6px}
.tb{display:flex;align-items:center;gap:12px;padding:12px clamp(14px,2.5vw,28px);border-bottom:1px solid #e6dfce;flex-wrap:wrap;background:#fffdf8}.tb h1{font:600 28px Newsreader,serif;margin:0;margin-right:auto}.tb h1 small{display:block;font:500 13px Inter,sans-serif;color:#66604f}
.chp{background:#e4f1e9;color:#17563a;border-radius:99px;padding:3px 14px;font-weight:600;font-size:13px}.tb input[type=search]{font:500 14px Inter,sans-serif;padding:8px 14px;border:1.5px solid #dcd3be;border-radius:99px;background:#fff;min-width:200px}.btn{font:600 13px Inter,sans-serif;background:#1f6b47;color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
.w{max-width:1500px;margin:0 auto;padding:14px clamp(14px,2.5vw,28px) 50px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.p{background:#fff;border:1px solid #e6dfce;border-radius:14px;padding:16px}.p h2{font:600 18px Newsreader,serif;margin:0 0 10px}
.gw{position:relative;overflow:auto;max-height:620px;border:1px solid #e6dfce;border-radius:12px}table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
th,td{padding:0;border-bottom:1px solid #efe9d8;border-right:1px solid #f3eede;font-variant-numeric:tabular-nums}thead th{position:sticky;top:0;background:#f3eedf;z-index:3;font:600 12px Inter,sans-serif;padding:8px 6px;text-align:center;white-space:nowrap}thead tr:first-child th{top:0}thead tr.g2 th{top:34px}
th.nm,td.nm{position:sticky;left:0;z-index:2;background:#fffdf8;text-align:left;padding:8px 12px;min-width:170px;font-weight:600;border-right:2px solid #e6dfce}thead th.nm{z-index:4;background:#f3eedf}
.cat{font:600 11px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#66604f}.cat.h{background:#e8f0ff}.cat.q{background:#fdf1d9}.cat.t{background:#e6f3e8}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;padding:2px 4px;border-radius:5px}th button:focus-visible{outline:3px solid #2a5fc7}
.c input{width:100%;min-width:58px;height:38px;border:0;background:var(--b,transparent);text-align:center;font:400 13px 'DM Mono',monospace;color:#22201a;padding:0 4px;transition:background .3s}.c input:focus{outline:3px solid #2a5fc7;outline-offset:-3px;border-radius:4px}.c input[aria-invalid=true]{outline:3px solid #d1383a;outline-offset:-3px;background:#ffe6e6}.c input.fl{animation:fl .6s}@keyframes fl{from{background:#fff2a8}}.c.ms input{background:#ffe3ee}
.tt{font:600 13px 'DM Mono',monospace;text-align:center;min-width:120px}.gl{display:inline-block;min-width:24px;text-align:center;border-radius:6px;padding:1px 6px;margin-left:6px;font:700 12px Inter,sans-serif;color:#fff;background:var(--b)}.gl.C{color:#2a1f00}.tr{text-align:center;font-weight:700;min-width:60px}.tr.u{color:#2f9e5a}.tr.d{color:#d1383a}.tr.s{color:#66604f}
tfoot td{background:#faf6ea;font:500 12px 'DM Mono',monospace;text-align:center;padding:7px 4px;position:sticky;bottom:0}tfoot td.nm{font:600 12px Inter,sans-serif;z-index:3}
.er{color:#c22;font-size:13px;min-height:18px;margin:6px 0}.opt{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;color:#66604f}.opt input{accent-color:#1f6b47;width:16px;height:16px}
.side{display:grid;gap:14px}.dist{display:flex;align-items:flex-end;gap:10px;height:120px;margin:10px 0 4px}.dist div{flex:1;text-align:center}.dist i{display:block;border-radius:6px 6px 0 0;background:var(--b);transition:height .4s;min-height:3px}.dist span{font:700 12px Inter,sans-serif}.dist b{display:block;font:500 12px 'DM Mono',monospace;margin-bottom:2px}
.avg{display:flex;gap:16px;align-items:center}.avg svg{width:86px;height:86px;transform:rotate(-90deg)}.avg b{font:600 34px Newsreader,serif}.avg small{color:#66604f}
.ar{list-style:none;margin:0;padding:0;display:grid;gap:8px}.ar li{display:flex;gap:10px;align-items:center;background:#fff5f4;border:1px solid #f3cfcc;border-radius:10px;padding:8px 10px}.ar li div{flex:1;min-width:0}.ar b{display:block}.ar small{color:#66604f}.ar button{font:600 12px Inter,sans-serif;border:1.5px solid #d1383a;background:#fff;color:#a8252a;border-radius:99px;padding:3px 10px;cursor:pointer}.ar button[aria-pressed=true]{background:#d1383a;color:#fff}
.wr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.wr label{font-size:12px;font-weight:600;color:#66604f;display:block}.wr input{width:100%;font:500 14px 'DM Mono',monospace;padding:8px;border:1.5px solid #dcd3be;border-radius:8px}.wr input[aria-invalid=true]{border-color:#d1383a}
.ap{width:100%;margin-top:10px;font:600 13px Inter,sans-serif;background:#2a5fc7;color:#fff;border:0;border-radius:10px;padding:10px;cursor:pointer}.ap[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);background:#22201a;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1100px){.w{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.c input.fl{animation:none}*{transition:none!important}}
</style></head><body>
<div class="tb"><h1>Year 9 Science<small>Mrs. Adeyemi · Larchwood School</small></h1><span class="chp">Autumn term</span><label class="vh" for="sq">Search students</label><input type="search" id="sq" placeholder="Search students"><button class="btn" type="button" id="ex">Export CSV</button></div>
<main class="w"><section class="p"><h2>Gradebook</h2><label class="opt"><input type="checkbox" id="ms"> Highlight missing marks</label><div class="gw"><table id="tbl" aria-label="Gradebook"></table></div><div class="vh" id="lv" aria-live="polite"></div></section>
<aside class="side"><section class="p"><h2>Class overview</h2><div class="avg"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="#efe9d8" stroke-width="12"/><circle id="rg" cx="50" cy="50" r="40" fill="none" stroke="#1f6b47" stroke-width="12" stroke-linecap="round" stroke-dasharray="251.3" style="transition:stroke-dashoffset .5s"/></svg><div><b id="av">0%</b><br><small>class average</small></div></div><div class="dist" id="dist" aria-label="Grade distribution"></div></section>
<section class="p"><h2>At risk</h2><ul class="ar" id="ar"></ul></section>
<section class="p"><h2>Category weights</h2><div class="wr"><div><label for="w1">Homework</label><input id="w1" type="number" min="0" max="100" value="20"></div><div><label for="w2">Quizzes</label><input id="w2" type="number" min="0" max="100" value="30"></div><div><label for="w3">Tests</label><input id="w3" type="number" min="0" max="100" value="50"></div></div><div class="er" id="we" role="alert"></div><button class="ap" type="button" id="ap">Apply weights</button></section></aside></main><div class="toast" id="toast" role="status"></div>
<script>
(function(){
var NM=['Amara Okeke','Ben Whitlock','Chloe Ferreira','Dev Malhotra','Elena Rossi','Freddie Nash','Grace Mwangi','Hugo Lindqvist','Isla McBride','Jamal Idris','Kira Novak','Leo Hartmann','Mia Tran','Noah Bellamy'],A=['HW1','HW2','HW3','Q1','Q2','Q3','Mid-term','End-unit'],CAT=[[0,3,'h','Homework'],[3,6,'q','Quizzes'],[6,8,'t','Tests']],W=[20,30,50],GR=[['A',80,'#2f9e5a'],['B',70,'#7bb342'],['C',60,'#e0b030'],['D',50,'#e07a2f'],['F',0,'#d1383a']];
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
var M=NM.map(function(n,i){var r=rng(i*57+11),lvl=40+r()*55;return A.map(function(a,k){var v=Math.round(Math.max(18,Math.min(100,lvl+(r()-.5)*28))*2)/2;if(r()<.07&&k<6)return null;return v})});M[3][1]=null;M[3][2]=null;M[6][0]=null;M[6][5]=null;M[10]=M[10].map(function(v){return v===null?null:Math.round(v*.62*2)/2});
var prev=NM.map(function(_,i){return 40+rng(i*3+1)()*50}),sortKey='name',sortDir=1,flags={},q='',showMs=false,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,live=document.getElementById('lv');
var grade=function(v){for(var i=0;i<GR.length;i++)if(v>=GR[i][1])return GR[i]};
function cat(r,c){var vals=[];for(var k=CAT[c][0];k<CAT[c][1];k++)if(M[r][k]!==null)vals.push(M[r][k]);return vals.length?vals.reduce(function(a,b){return a+b},0)/vals.length:null}
function total(r){var s=0,w=0;for(var c=0;c<3;c++){var v=cat(r,c);if(v!==null){s+=v*W[c];w+=W[c]}}return w?s/w:null}
var tbl=document.getElementById('tbl');
function build(){var h='<thead><tr><th class="nm" rowspan="2"><button type="button" data-k="name">Student <span aria-hidden="true"></span></button></th>'+CAT.map(function(c){return'<th class="cat '+c[2]+'" colspan="'+(c[1]-c[0])+'" scope="colgroup">'+c[3]+' '+W[CAT.indexOf(c)]+'%</th>'}).join('')+'<th rowspan="2" class="tt"><button type="button" data-k="total">Total <span aria-hidden="true"></span></button></th><th rowspan="2" class="tr">Trend</th></tr><tr class="g2">'+A.map(function(a,k){return'<th scope="col"><button type="button" data-k="'+k+'">'+a+' <span aria-hidden="true"></span></button></th>'}).join('')+'</tr></thead><tbody></tbody><tfoot></tfoot>';tbl.innerHTML=h;
tbl.querySelectorAll('th button').forEach(function(b){b.addEventListener('click',function(){var k=b.dataset.k===undefined?'name':b.dataset.k;if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=k==='name'?1:-1}rows()})})}
function order(){var idx=NM.map(function(_,i){return i}).filter(function(i){return!q||NM[i].toLowerCase().indexOf(q)>-1});idx.sort(function(a,b){var x,y;if(sortKey==='name')return NM[a].localeCompare(NM[b])*sortDir;if(sortKey==='total'){x=total(a);y=total(b)}else{x=M[a][+sortKey];y=M[b][+sortKey]}x=x===null?-1:x;y=y===null?-1:y;return(x-y)*sortDir});return idx}
function rows(){var tb=tbl.tBodies[0],act=document.activeElement,ar=act&&act.dataset?[act.dataset.r,act.dataset.c]:null;tb.innerHTML='';order().forEach(function(r){var tr=document.createElement('tr'),t=total(r),g=t===null?null:grade(t),h='<th class="nm" scope="row">'+NM[r]+'</th>';A.forEach(function(a,k){var v=M[r][k],gg=v===null?null:grade(v);h+='<td class="c'+(v===null?' ms':'')+'"><input type="text" inputmode="decimal" data-r="'+r+'" data-c="'+k+'" value="'+(v===null?'':v)+'" placeholder="–" aria-label="'+NM[r]+', '+a+'" style="--b:'+(gg?gg[2]+'30':'transparent')+'"></td>'});
var d=t===null?0:t-prev[r];h+='<td class="tt">'+(t===null?'–':t.toFixed(1)+'%')+(g?'<span class="gl '+g[0]+'" style="--b:'+g[2]+'">'+g[0]+'</span>':'')+'</td><td class="tr '+(d>2?'u':d<-2?'d':'s')+'">'+(d>2?'▲':d<-2?'▼':'▬')+'<span class="vh">'+(d>2?'up':d<-2?'down':'steady')+'</span></td>';tr.innerHTML=h;tb.appendChild(tr)});
tb.querySelectorAll('input').forEach(wire);
var tf=tbl.tFoot;tf.innerHTML='';[['Class average',function(k){var v=M.map(function(r){return r[k]}).filter(function(x){return x!==null});return v.length?(v.reduce(function(a,b){return a+b},0)/v.length).toFixed(1):'–'}],['Highest',function(k){var v=M.map(function(r){return r[k]}).filter(function(x){return x!==null});return v.length?Math.max.apply(null,v):'–'}],['Lowest',function(k){var v=M.map(function(r){return r[k]}).filter(function(x){return x!==null});return v.length?Math.min.apply(null,v):'–'}]].forEach(function(f){tf.insertAdjacentHTML('beforeend','<tr><td class="nm">'+f[0]+'</td>'+A.map(function(a,k){return'<td>'+f[1](k)+'</td>'}).join('')+'<td></td><td></td></tr>')});
tbl.querySelectorAll('th button').forEach(function(b){var k=b.dataset.k===undefined?'name':b.dataset.k,on=String(k)===String(sortKey);b.querySelector('span').textContent=on?(sortDir>0?'▲':'▼'):'';b.closest('th').setAttribute('aria-sort',on?(sortDir>0?'ascending':'descending'):'none')});
tbl.classList.toggle('sm',showMs);if(ar){var e=tbl.querySelector('input[data-r="'+ar[0]+'"][data-c="'+ar[1]+'"]');e&&e.focus()}side()}
function wire(inp){var orig=inp.value;inp.addEventListener('focus',function(){orig=inp.value;inp.select()});
inp.addEventListener('keydown',function(e){var r=+inp.dataset.r,c=+inp.dataset.c,all=[].slice.call(tbl.tBodies[0].querySelectorAll('tr')),ri=all.indexOf(inp.closest('tr')),mv=null;
if(e.key==='Enter'){commit(inp);mv=[ri+1,c];e.preventDefault()}else if(e.key==='Escape'){inp.value=orig;inp.removeAttribute('aria-invalid');document.getElementById('lv').textContent='';e.preventDefault()}else if(e.key==='ArrowDown'){mv=[ri+1,c];e.preventDefault()}else if(e.key==='ArrowUp'){mv=[ri-1,c];e.preventDefault()}else if(e.key==='ArrowLeft'&&inp.selectionStart===0){mv=[ri,c-1];e.preventDefault()}else if(e.key==='ArrowRight'&&inp.selectionEnd===inp.value.length){mv=[ri,c+1];e.preventDefault()}
if(mv){var tr=tbl.tBodies[0].querySelectorAll('tr')[mv[0]];if(tr){var t=tr.querySelectorAll('input')[mv[1]];t&&t.focus()}}});
inp.addEventListener('blur',function(){commit(inp)});inp.addEventListener('input',function(){inp.removeAttribute('aria-invalid')})}
function commit(inp){if(!inp.isConnected)return;var r=+inp.dataset.r,c=+inp.dataset.c,v=inp.value.trim(),old=M[r][c];if(v===''){if(old!==null){M[r][c]=null;upd(inp,r)}return}var n=Number(v);if(!/^\d{1,3}(\.\d)?$/.test(v)||n<0||n>100){inp.setAttribute('aria-invalid','true');live.textContent='Enter 0 to 100.';inp.value=old===null?'':old;setTimeout(function(){inp.removeAttribute('aria-invalid')},1500);return}if(n!==old){M[r][c]=n;upd(inp,r)}}
function upd(inp,r){var ac=document.activeElement,key=ac&&ac.dataset&&ac.dataset.r!==undefined?[ac.dataset.r,ac.dataset.c]:null;rows();if(!reduce){var e=tbl.querySelector('input[data-r="'+inp.dataset.r+'"][data-c="'+inp.dataset.c+'"]');if(e){e.classList.add('fl')}}if(key){var f=tbl.querySelector('input[data-r="'+key[0]+'"][data-c="'+key[1]+'"]');f&&f!==document.activeElement&&f.focus()}live.textContent=NM[r]+' now at '+(total(r)===null?'no total':total(r).toFixed(1)+'%')+'. Class average '+classAvg().toFixed(1)+'%.'}
function classAvg(){var t=NM.map(function(_,i){return total(i)}).filter(function(x){return x!==null});return t.reduce(function(a,b){return a+b},0)/t.length}
function side(){var a=classAvg();document.getElementById('av').textContent=a.toFixed(1)+'%';document.getElementById('rg').style.strokeDashoffset=251.3*(1-a/100);
var cnt={A:0,B:0,C:0,D:0,F:0};NM.forEach(function(_,i){var t=total(i);if(t!==null)cnt[grade(t)[0]]++});var mx=Math.max.apply(null,Object.keys(cnt).map(function(k){return cnt[k]}))||1;document.getElementById('dist').innerHTML=GR.map(function(g){return'<div><b>'+cnt[g[0]]+'</b><i style="height:'+(cnt[g[0]]/mx*90+3)+'px;--b:'+g[2]+'"></i><span>'+g[0]+'</span></div>'}).join('');
var risk=[];NM.forEach(function(n,i){var t=total(i),miss=M[i].filter(function(x){return x===null}).length;if(t!==null&&t<55||miss>=2)risk.push([i,t,miss])});document.getElementById('ar').innerHTML=risk.length?risk.map(function(r){return'<li><div><b>'+NM[r[0]]+'</b><small>'+(r[1]===null?'No total':r[1].toFixed(1)+'%')+' · '+r[2]+' missing</small></div><button type="button" data-i="'+r[0]+'" aria-pressed="'+!!flags[r[0]]+'">'+(flags[r[0]]?'Noted ✓':'Add note')+'</button></li>'}).join(''):'<li style="background:#eef7f0;border-color:#cde5d3">Nobody at risk right now.</li>';
document.querySelectorAll('#ar button').forEach(function(b){b.addEventListener('click',function(){flags[b.dataset.i]=!flags[b.dataset.i];side()})})}
document.getElementById('sq').addEventListener('input',function(e){q=e.target.value.toLowerCase().trim();rows()});document.getElementById('ms').addEventListener('change',function(e){showMs=e.target.checked;tbl.classList.toggle('sm',showMs);document.querySelectorAll('td.ms').forEach(function(td){td.style.setProperty('--x',1)})});
var st=document.createElement('style');st.textContent='#tbl:not(.sm) td.c.ms input{background:var(--b,transparent)}#tbl.sm td.c.ms input{background:#ffe3ee}';document.head.appendChild(st);
var ws=['w1','w2','w3'].map(function(i){return document.getElementById(i)}),ap=document.getElementById('ap'),we=document.getElementById('we');
function wv(){var v=ws.map(function(e){return Number(e.value)||0}),s=v[0]+v[1]+v[2],ok=s===100;we.textContent=ok?'':'Weights add up to '+s+'. They must total 100.';ws.forEach(function(e){e.setAttribute('aria-invalid',!ok)});ap.setAttribute('aria-disabled',!ok);return ok}ws.forEach(function(e){e.addEventListener('input',wv)});
ap.addEventListener('click',function(){if(!wv())return;W=ws.map(function(e){return Number(e.value)});build();rows();live.textContent='Weights applied. Class average '+classAvg().toFixed(1)+'%.'});
document.getElementById('ex').addEventListener('click',function(){var t=document.getElementById('toast');t.textContent='CSV exported';t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1700)});
build();rows();
})();
</script></body></html>
