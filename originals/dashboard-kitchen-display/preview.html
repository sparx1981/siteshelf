<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen Order Display — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#101114;color:#f4f5f7;font:500 17px/1.4 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:4px solid #fff;outline-offset:2px;border-radius:10px}
.tb{display:flex;align-items:center;gap:12px;padding:12px clamp(12px,2vw,24px);border-bottom:1px solid #26292f;flex-wrap:wrap}.logo{font:600 24px Oswald,sans-serif;letter-spacing:.14em;margin-right:12px}.ck{font:600 22px Oswald,sans-serif;font-variant-numeric:tabular-nums;color:#a3a8b3;margin-right:auto}
.chs{display:flex;gap:6px;flex-wrap:wrap}.chs button,.sp button{font:600 15px Inter,sans-serif;border:1.5px solid #3a3e47;background:#17191e;color:#f4f5f7;border-radius:99px;padding:7px 16px;cursor:pointer}.chs button[aria-pressed=true],.sp button[aria-pressed=true]{background:#f4f5f7;color:#101114;border-color:#f4f5f7}
.sp{display:flex;gap:4px;align-items:center;color:#a3a8b3;font-size:14px}.add{font:600 15px Inter,sans-serif;background:#2fd07d;color:#04170d;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}.sv{font:600 14px Oswald,sans-serif;letter-spacing:.06em;color:#a3a8b3}.sv b{color:#f4f5f7;font-size:20px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px clamp(12px,2vw,24px) 30px;align-items:start}.tabs{display:none}
.col h2{font:600 18px Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;display:flex;justify-content:space-between;color:#a3a8b3}.col h2 b{background:#26292f;color:#f4f5f7;border-radius:99px;padding:0 12px}
.ls{display:flex;flex-direction:column;gap:12px;min-height:120px}
.t{background:#1b1d22;border:2px solid #2d3037;border-radius:14px;overflow:hidden;transition:transform .25s,opacity .25s,max-height .35s,margin .35s;animation:in .3s;max-height:640px}
@keyframes in{from{opacity:0;transform:translateY(-10px)}}.t.out{opacity:0;max-height:0;margin:-6px 0;border-width:0;transform:scale(.96)}
.t[data-s=fresh]{border-color:#245c3d}.t[data-s=warn]{border-color:#7a5712}.t[data-s=late]{border-color:#8a2f2f}
.th{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--c);color:#0a0a0a}.t[data-s=fresh]{--c:#2fd07d}.t[data-s=warn]{--c:#ffb020}.t[data-s=late]{--c:#ff5a5a}
.th b{font:600 26px Oswald,sans-serif}.th .ch{font:600 13px Inter,sans-serif;background:rgba(0,0,0,.18);border-radius:99px;padding:1px 10px}.th .tm{margin-left:auto;font:600 30px Oswald,sans-serif;font-variant-numeric:tabular-nums}.th .lb{font:700 11px Inter,sans-serif;letter-spacing:.1em}
.t[data-s=late]{animation:in .3s,pu 60s ease-in-out infinite}@keyframes pu{0%,98%,100%{transform:none}99%{transform:scale(1.015)}}
.tbd{padding:10px 14px}.it{padding:6px 0;border-bottom:1px solid #2a2d34;transition:opacity .2s}.it:last-child{border:0}.it.dim{opacity:.28}.it b{font:600 19px Inter,sans-serif}.it small{display:block;color:#a3a8b3;font-size:14px}
.tg{display:inline-block;font:700 11px Inter,sans-serif;letter-spacing:.04em;border-radius:6px;padding:1px 7px;margin:3px 4px 0 0;background:#2b2f37;color:#d5d9e2}.tg.al{background:#ff5a5a;color:#1a0000}.tg.st{background:transparent;border:1px solid #4a4f5a;color:#a3a8b3}
.tf{padding:0 14px 14px}.bt{width:100%;font:600 20px Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase;border:0;border-radius:10px;padding:14px;cursor:pointer;color:#0a0a0a;background:#e8eaef;transition:filter .15s}.bt:hover{filter:brightness(1.08)}.bt.go{background:#7cc4ff}.bt.rd{background:#2fd07d}.bt.clr{background:#3a3e47;color:#f4f5f7}
.em{border:2px dashed #2d3037;border-radius:14px;padding:26px;text-align:center;color:#6f7581}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1000px){.tabs{display:flex;gap:6px;padding:10px 12px 0}.tabs button{flex:1;font:600 16px Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid #3a3e47;background:#17191e;color:#f4f5f7;border-radius:10px;padding:9px}.tabs button[aria-selected=true]{background:#f4f5f7;color:#101114}.cols{grid-template-columns:minmax(0,1fr)}.col{display:none}.col.on{display:block}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="tb"><div class="logo">THE PASS</div><span class="ck" id="ck"></span><div class="chs" role="group" aria-label="Station" id="st"></div><div class="sp" role="group" aria-label="Timer speed">Speed <button type="button" aria-pressed="false" data-v="1">Real</button><button type="button" aria-pressed="true" data-v="10">×10</button><button type="button" aria-pressed="false" data-v="30">×30</button></div><span class="sv">SERVED <b id="sv">0</b></span><button class="add" type="button" id="ad">+ Add order</button></div>
<div class="tabs" role="tablist" aria-label="Columns" id="tabs"></div>
<main class="cols" id="cols"></main><div class="vh" id="lv" aria-live="polite"></div>
<script>
(function(){
var MENU=[['Smoked haddock chowder','Cold',['Dairy','Gluten'],0],['Chargrilled ribeye 8oz','Grill',[],0],['Beer-battered cod','Fry',['Gluten'],0],['Burrata and heritage tomato','Cold',['Dairy'],0],['Miso aubergine','Grill',[],0],['Truffle fries','Fry',[],0],['Sticky toffee pudding','Pastry',['Dairy','Gluten'],0],['Almond tart','Pastry',['Nuts','Gluten'],1],['Lamb rump, salsa verde','Grill',[],0],['Crab and fennel salad','Cold',['Shellfish'],1],['Halloumi fries','Fry',['Dairy'],0],['Chocolate fondant','Pastry',['Dairy','Gluten'],0]],MOD=['no onions','extra lemon','sauce on the side','medium rare','gluten-free swap','no butter'],CH=[['Dine-in T12','#7cc4ff'],['Takeaway','#d6a8ff'],['Delivery','#ffd27a'],['Dine-in T4','#7cc4ff'],['Dine-in T7','#7cc4ff']];
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,speed=10,stn='All',T=[],next=4821,served=0,tab=0,seed=17;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
function mk(age,col){var n=1+Math.floor(rnd()*3),items=[],used={};for(var i=0;i<n;i++){var m=MENU[Math.floor(rnd()*MENU.length)];if(used[m[0]])continue;used[m[0]]=1;items.push({q:1+Math.floor(rnd()*2),m:m,mod:rnd()<.5?MOD[Math.floor(rnd()*MOD.length)]:''})}var c=CH[Math.floor(rnd()*CH.length)];return{id:next++,age:age,col:col,items:items,ch:c[0],cc:c[1]}}
[[70,0],[220,0],[330,1],[405,1],[500,1],[545,2]].forEach(function(a){T.push(mk(a[0],a[1]))});
var cols=document.getElementById('cols'),NAMES=['New','Cooking','Ready'],els=[];
NAMES.forEach(function(nm,i){var c=document.createElement('section');c.className='col'+(i===0?' on':'');c.innerHTML='<h2>'+nm+' <b id="n'+i+'">0</b></h2><div class="ls" id="l'+i+'"></div>';cols.appendChild(c);els.push(c);var b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.textContent=nm;b.setAttribute('aria-selected',i===0);b.addEventListener('click',function(){tab=i;els.forEach(function(e,k){e.classList.toggle('on',k===i)});[].forEach.call(document.getElementById('tabs').children,function(x,k){x.setAttribute('aria-selected',k===i)})});document.getElementById('tabs').appendChild(b)});
['All','Grill','Fry','Cold','Pastry'].forEach(function(s){var b=document.createElement('button');b.type='button';b.textContent=s;b.setAttribute('aria-pressed',s==='All');b.addEventListener('click',function(){stn=s;[].forEach.call(document.getElementById('st').children,function(x){x.setAttribute('aria-pressed',x===b)});draw()});document.getElementById('st').appendChild(b)});
document.querySelectorAll('.sp button').forEach(function(b){b.addEventListener('click',function(){speed=+b.dataset.v;document.querySelectorAll('.sp button').forEach(function(x){x.setAttribute('aria-pressed',x===b)})})});
function state(a){return a>=480?'late':a>=300?'warn':'fresh'}
var mm=function(a){return Math.floor(a/60)+':'+('0'+Math.floor(a%60)).slice(-2)};
function draw(){[0,1,2].forEach(function(c){var ls=document.getElementById('l'+c),lst=T.filter(function(t){return t.col===c}).sort(function(a,b){return b.age-a.age});document.getElementById('n'+c).textContent=lst.length;
var have={};[].forEach.call(ls.children,function(e){have[e.dataset.id]=e});var keep=document.activeElement&&document.activeElement.closest?document.activeElement.closest('.t'):null;
lst.forEach(function(t,i){var el=have[t.id];if(!el){el=build(t);ls.appendChild(el)}delete have[t.id];if(ls.children[i]!==el)ls.insertBefore(el,ls.children[i]||null);upd(el,t)});Object.keys(have).forEach(function(k){have[k].remove()});if(!lst.length&&!ls.querySelector('.em')){ls.innerHTML='<div class="em">No tickets</div>'}else if(lst.length){var e=ls.querySelector('.em');if(e)e.remove()}})}
function build(t){var el=document.createElement('article');el.className='t';el.dataset.id=t.id;el.tabIndex=0;el.setAttribute('aria-label','Order '+t.id);
el.innerHTML='<div class="th"><b>#'+t.id+'</b><span class="ch">'+t.ch+'</span><span class="tm"></span></div><div class="tbd">'+t.items.map(function(it){return'<div class="it" data-st="'+it.m[1]+'"><b>'+it.q+' × '+it.m[0]+'</b>'+(it.mod?'<small>'+it.mod+'</small>':'')+'<div>'+it.m[2].map(function(a){return'<span class="tg">'+a+'</span>'}).join('')+(it.m[3]?'<span class="tg al">ALLERGY</span>':'')+'<span class="tg st">'+it.m[1]+'</span></div></div>'}).join('')+'</div><div class="tf"><button class="bt" type="button"></button></div>';
el.querySelector('.bt').addEventListener('click',function(){adv(t.id)});el.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target===el){e.preventDefault();adv(t.id)}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){var all=[].slice.call(document.querySelectorAll('.t')),i=all.indexOf(el),n=all[i+(e.key==='ArrowDown'?1:-1)];if(n){e.preventDefault();n.focus()}}else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){var cs=[].slice.call(document.querySelectorAll('.col:not([style*=none]) .ls')),ci=cs.indexOf(el.parentNode),nc=cs[ci+(e.key==='ArrowRight'?1:-1)];if(nc&&nc.querySelector('.t')){e.preventDefault();nc.querySelector('.t').focus()}}});return el}
function upd(el,t){var s=state(t.age);el.dataset.s=s;el.querySelector('.tm').innerHTML=mm(t.age)+(s==='late'?' <span class="lb">LATE</span>':s==='warn'?' <span class="lb">WARN</span>':'');var b=el.querySelector('.bt');b.className='bt '+['go','rd','clr'][t.col];b.textContent=['Start','Bump to ready','Bump (clear)'][t.col];el.querySelectorAll('.it').forEach(function(i){i.classList.toggle('dim',stn!=='All'&&i.dataset.st!==stn)})}
function adv(id){var t=T.find(function(x){return x.id===id}),el=document.querySelector('.t[data-id="'+id+'"]');if(!t)return;if(t.col<2){t.col++;draw();var n=document.querySelector('.t[data-id="'+id+'"]');n&&n.focus()}else{if(el){el.classList.add('out');var go=function(){T=T.filter(function(x){return x.id!==id});served++;document.getElementById('sv').textContent=served;draw()};setTimeout(go,reduce?0:350)}}}
function add(){if(T.length>=10)return;var t=mk(0,0);T.push(t);draw();document.getElementById('lv').textContent='New order #'+t.id+', '+t.ch}
document.getElementById('ad').addEventListener('click',add);
setInterval(function(){T.forEach(function(t){if(t.col<3)t.age+=speed});document.querySelectorAll('.t').forEach(function(el){var t=T.find(function(x){return x.id==el.dataset.id});if(t)upd(el,t)});var d=new Date();document.getElementById('ck').textContent=d.toLocaleTimeString('en-GB')},1000);
setInterval(function(){if(T.filter(function(t){return t.col<2}).length<8)add()},12000);
document.getElementById('ck').textContent=new Date().toLocaleTimeString('en-GB');draw();
})();
</script></body></html>
