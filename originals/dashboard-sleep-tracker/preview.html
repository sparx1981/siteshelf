<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sleep Insights Dashboard — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,rgba(99,70,200,.25),transparent 45%),#0f0b24;color:#efeaff;font:400 14px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #ffe08a;outline-offset:2px;border-radius:10px}
.tb{display:flex;align-items:center;gap:14px;padding:14px clamp(16px,3vw,36px)}.logo{font:700 22px Outfit,sans-serif;margin-right:auto;display:flex;align-items:center;gap:10px}.logo i{width:20px;height:20px;border-radius:50%;box-shadow:inset -6px -2px 0 0 #ffe08a;background:transparent}
.pf{background:#181238;border:1px solid #2d2466;border-radius:99px;padding:5px 14px;font-size:13px;color:#a99fd6}
.w{max-width:1200px;margin:0 auto;padding:6px clamp(16px,3vw,36px) 60px}h1{font:700 clamp(26px,3.4vw,36px)/1.1 Outfit,sans-serif;margin:0}.dt{color:#a99fd6;margin:2px 0 14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-width:70px;font:inherit;background:#181238;border:1.5px solid #2d2466;border-radius:16px;padding:8px 12px;color:#efeaff;cursor:pointer;text-align:center;transition:border-color .2s,background .2s}.tabs button small{display:block;color:#a99fd6;font-size:12px}.tabs button b{font:700 18px Outfit,sans-serif}.tabs button[aria-selected=true]{border-color:#ffe08a;background:#241b52}
.g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:14px;margin-bottom:14px}.p{background:#181238;border:1px solid #2d2466;border-radius:20px;padding:20px}.p h2{font:600 16px Outfit,sans-serif;margin:0 0 12px;color:#d7cffb}
.sc{display:flex;gap:20px;align-items:center}.rn{position:relative;width:150px;height:150px;flex:none}.rn svg{width:100%;height:100%;transform:rotate(-90deg)}.rn b{position:absolute;inset:0;display:grid;place-items:center;font:700 52px Outfit,sans-serif}.sc h3{font:600 22px Outfit,sans-serif;margin:0 0 4px}.sc p{margin:0;color:#a99fd6}
.sg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.s{background:#100b2c;border-radius:14px;padding:14px}.s small{color:#a99fd6}.s b{display:block;font:700 26px Outfit,sans-serif;font-variant-numeric:tabular-nums}
.hy{position:relative}.hy svg{width:100%;height:auto;display:block;outline:none}.hy:focus-visible{outline:3px solid #ffe08a;outline-offset:4px;border-radius:12px}.hy text{font:500 11px Inter,sans-serif;fill:#a99fd6}
.tip{position:absolute;background:#0a0620;border:1px solid #3d3290;border-radius:10px;padding:6px 12px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-120%);transition:opacity .12s;z-index:4}.tip.on{opacity:1}.tip b{display:block;font:600 14px Outfit,sans-serif}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:#a99fd6}.lg span{display:flex;gap:6px;align-items:center}.lg i{width:10px;height:10px;border-radius:3px}
.bk{display:grid;gap:12px}.bk div{display:grid;grid-template-columns:70px minmax(0,1fr) 92px;gap:10px;align-items:center}.bk .tr{height:12px;background:#100b2c;border-radius:99px;position:relative;overflow:hidden}.bk .tr i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.3,1,.5,1)}.bk .tg{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.6}.bk b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.wk svg{width:100%;height:auto;display:block}.wk text{font:500 11px Inter,sans-serif;fill:#a99fd6}.note{margin:8px 0 0;color:#a99fd6}
.ins{list-style:none;margin:0;padding:0;display:grid;gap:8px}.ins li{background:#100b2c;border-radius:14px;padding:12px 14px;display:flex;gap:12px}.ins li:before{content:"✦";color:#ffe08a}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:900px){.g{grid-template-columns:minmax(0,1fr)}.sc{flex-direction:column;text-align:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="tb"><div class="logo"><i></i>dozeful</div><span class="pf">Rowan · Sleep goal 7h 30m</span></div>
<main class="w"><h1>Last night</h1><p class="dt" id="dt"></p><div class="tabs" role="tablist" aria-label="Nights" id="tabs"></div>
<div class="g"><section class="p sc" aria-label="Sleep score"><div class="rn"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="#2d2466" stroke-width="9"/><circle id="rg" cx="50" cy="50" r="42" fill="none" stroke="#ffe08a" stroke-width="9" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9" style="transition:stroke-dashoffset .8s cubic-bezier(.3,1,.5,1)"/></svg><b id="sc">0</b></div><div><h3 id="sl"></h3><p id="ss"></p></div></section>
<section class="p" aria-label="Key numbers"><div class="sg"><div class="s"><small>Time asleep</small><b id="a1"></b></div><div class="s"><small>Bedtime</small><b id="a2"></b></div><div class="s"><small>Wake time</small><b id="a3"></b></div><div class="s"><small>Efficiency</small><b id="a4"></b></div></div></section></div>
<section class="p" style="margin-bottom:14px"><h2>Sleep stages</h2><div class="hy" id="hy" tabindex="0" role="img" aria-label=""><svg id="hs" viewBox="0 0 800 220"></svg><div class="tip" id="tip"></div></div><div class="lg"><span><i style="background:#ff8fa3"></i>Awake</span><span><i style="background:#7dd3fc"></i>REM</span><span><i style="background:#a78bfa"></i>Light</span><span><i style="background:#4338ca"></i>Deep</span></div><div class="vh" id="lv" aria-live="polite"></div></section>
<div class="g" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><section class="p"><h2>Stage breakdown</h2><div class="bk" id="bk"></div></section><section class="p wk"><h2>Bedtime consistency</h2><svg id="ws" viewBox="0 0 420 220"></svg><p class="note" id="wn"></p></section></div>
<section class="p" style="margin-top:14px"><h2>Insights for this night</h2><ul class="ins" id="ins"></ul></section></main>
<script>
(function(){
var SC=[['#ff8fa3','Awake'],['#7dd3fc','REM'],['#a78bfa','Light'],['#4338ca','Deep']],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
var N=[],D=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],today=new Date(2026,9,10);
for(var i=0;i<7;i++){var r=rng((i+3)*7919+12345);for(var w=0;w<6;w++)r();var bt=Math.round((22.2+r()*1.9)*60/5)*5,wake=Math.round((6.0+r()*1.8)*60/5)*5+1440,blocks=[],t=bt,cyc=0;
while(t<wake){var plan=cyc<2?[[2,2],[3,4],[2,2],[1,2]]:[[2,2],[3,2],[2,3],[1,3]];plan.forEach(function(p){var n=p[1]+(r()<.4?1:0);while(n-- >0&&t<wake){var st=p[0];if(r()<.11&&t>bt+60)st=0;blocks.push([t,st]);t+=30}});cyc++}
var span=function(b){return Math.min(30,wake-b[0])},asleep=0,by=[0,0,0,0],aw=0;blocks.forEach(function(b,k){by[b[1]]+=span(b);if(b[1]>0)asleep+=span(b);else if(k>0)aw++});
var score=Math.round(Math.max(55,Math.min(95,26+asleep/480*38+Math.min(by[3],100)/100*18+Math.min(by[1],110)/110*10-aw*2.5-Math.abs(bt-23*60)/60*2)));
var dd=new Date(today);dd.setDate(dd.getDate()-(6-i));N.push({d:dd,bt:bt,wake:wake,blocks:blocks,asleep:asleep,aw:aw,by:by,score:score})}
var cur=6,tabs=document.getElementById('tabs');
N.forEach(function(n,i){var b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.innerHTML='<small>'+D[(n.d.getDay()+6)%7]+'</small><b>'+n.score+'</b>';b.addEventListener('click',function(){pick(i)});b.addEventListener('keydown',function(e){var k={ArrowRight:1,ArrowLeft:-1}[e.key];if(k){e.preventDefault();var j=(i+k+7)%7;pick(j);tabs.children[j].focus()}});tabs.appendChild(b)});
var hm=function(m){m=m%1440;return('0'+Math.floor(m/60)).slice(-2)+':'+('0'+m%60).slice(-2)},dur=function(m){return Math.floor(m/60)+'h '+('0'+m%60).slice(-2)+'m'};
var shown={};function tween(id,to,fmt){var el=document.getElementById(id),from=shown[id]===undefined?to:shown[id];shown[id]=to;var t0=performance.now();if(reduce||from===to){el.textContent=fmt(to);return}(function f(n){var k=Math.min(1,(n-t0)/500);el.textContent=fmt(from+(to-from)*k);if(k<1)requestAnimationFrame(f)})(t0)}
function pick(i){cur=i;[].forEach.call(tabs.children,function(b,k){b.setAttribute('aria-selected',k===i);b.tabIndex=k===i?0:-1});var n=N[i];document.getElementById('dt').textContent=n.d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+(i===6?' · last night':'');
document.getElementById('rg').style.strokeDashoffset=263.9*(1-n.score/100);tween('sc',n.score,function(v){return Math.round(v)});document.getElementById('sl').textContent=n.score>=85?'Excellent':n.score>=75?'Good':n.score>=65?'Fair':'Needs work';document.getElementById('ss').textContent='You slept '+dur(n.asleep)+' and woke '+n.aw+(n.aw===1?' time.':' times.');
document.getElementById('a1').textContent=dur(n.asleep);document.getElementById('a2').textContent=hm(n.bt);document.getElementById('a3').textContent=hm(n.wake);document.getElementById('a4').textContent=Math.min(99,Math.round(n.asleep/(n.wake-n.bt)*100))+'%';
hypno(n);breakdown(n);week();insights(n)}
function hypno(n){var W=800,H=220,P={l:70,r:10,t:10,b:26},t0=n.bt,t1=n.wake,x=function(t){return P.l+(t-t0)/(t1-t0)*(W-P.l-P.r)},rowH=(H-P.t-P.b)/4,ord=[0,1,2,3],yv=function(s){return P.t+ord.indexOf(s)*rowH},h='';
ord.forEach(function(s,k){h+='<text x="'+(P.l-10)+'" y="'+(P.t+k*rowH+rowH/2+4)+'" text-anchor="end">'+SC[s][1]+'</text><line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+(P.t+k*rowH)+'" y2="'+(P.t+k*rowH)+'" stroke="#2d2466"/>'});
n.blocks.forEach(function(b,k){var x0=x(b[0]),x1=x(Math.min(b[0]+30,t1));h+='<rect class="hb" data-k="'+k+'" x="'+x0+'" y="'+yv(b[1])+'" width="'+(x1-x0+.5)+'" height="'+rowH+'" fill="'+SC[b[1]][0]+'" opacity=".88" rx="3"/>'});
for(var tt=Math.ceil(t0/60)*60;tt<=t1;tt+=120)h+='<text x="'+x(tt)+'" y="'+(H-6)+'" text-anchor="middle">'+hm(tt)+'</text>';
var svg=document.getElementById('hs');svg.innerHTML=h;var hy=document.getElementById('hy');hy.setAttribute('aria-label','Sleep stages from '+hm(n.bt)+' to '+hm(n.wake)+': '+n.by.map(function(m,s){return SC[s][1]+' '+dur(m)}).join(', '));
var tip=document.getElementById('tip'),idx=-1;function show(k){idx=k;var b=n.blocks[k],r=svg.querySelectorAll('.hb')[k].getBoundingClientRect(),c=hy.getBoundingClientRect();tip.innerHTML='<b>'+SC[b[1]][1]+'</b>'+hm(b[0])+' to '+hm(b[0]+30);tip.style.left=Math.max(50,Math.min(c.width-50,r.left-c.left+r.width/2))+'px';tip.style.top=(r.top-c.top)+'px';tip.classList.add('on');svg.querySelectorAll('.hb').forEach(function(e,j){e.setAttribute('opacity',j===k?1:.55)});document.getElementById('lv').textContent=SC[b[1]][1]+', '+hm(b[0])+' to '+hm(b[0]+30)}
function hide(){tip.classList.remove('on');idx=-1;svg.querySelectorAll('.hb').forEach(function(e){e.setAttribute('opacity',.88)})}
svg.querySelectorAll('.hb').forEach(function(e,k){e.addEventListener('pointerenter',function(){show(k)});e.addEventListener('pointerleave',hide)});
hy.onkeydown=function(e){var L=n.blocks.length;if(e.key==='ArrowRight'){e.preventDefault();show(idx<0?0:Math.min(L-1,idx+1))}else if(e.key==='ArrowLeft'){e.preventDefault();show(idx<0?L-1:Math.max(0,idx-1))}else if(e.key==='Escape')hide()};hy.onblur=hide}
var TG=[0,90,240,100];function breakdown(n){var tot=n.asleep+n.by[0],el=document.getElementById('bk');if(!el.children.length)el.innerHTML=SC.map(function(s,k){return'<div><span>'+s[1]+'</span><span class="tr"><i id="bi'+k+'" style="background:'+s[0]+';width:0"></i><span class="tg" style="left:'+(k?Math.min(100,TG[k]/(n.wake-n.bt)*100*3.6):0)+'%;display:'+(k?'block':'none')+'"></span></span><b id="bt'+k+'"></b></div>'}).join('');
SC.forEach(function(s,k){var pc=n.by[k]/(n.wake-n.bt)*100;document.getElementById('bi'+k).style.width=Math.min(100,pc*2.2)+'%';document.getElementById('bt'+k).textContent=Math.round(pc)+'% · '+dur(n.by[k])})}
function week(){var W=420,H=220,P={l:40,r:10,t:10,b:26},a=21*60,b=8*60+1440,y=function(t){return P.t+(t-a)/(b-a)*(H-P.t-P.b)},bw=(W-P.l-P.r)/7,h='',ab=N.reduce(function(s,n){return s+n.bt},0)/7,aw=N.reduce(function(s,n){return s+n.wake},0)/7;
[21,23,1,3,5,7].forEach(function(hh){var t=hh<12&&hh<9?hh*60+1440:hh*60;h+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="#2d2466"/><text x="'+(P.l-6)+'" y="'+(y(t)+4)+'" text-anchor="end">'+('0'+hh).slice(-2)+':00</text>'});
h+='<rect x="'+P.l+'" y="'+y(ab-20)+'" width="'+(W-P.l-P.r)+'" height="'+(y(ab+20)-y(ab-20))+'" fill="#ffe08a" opacity=".18"/><rect x="'+P.l+'" y="'+y(aw-20)+'" width="'+(W-P.l-P.r)+'" height="'+(y(aw+20)-y(aw-20))+'" fill="#7dd3fc" opacity=".18"/>';
N.forEach(function(n,i){var cx=P.l+i*bw+bw/2;h+='<rect x="'+(cx-9)+'" y="'+y(n.bt)+'" width="18" height="'+(y(n.wake)-y(n.bt))+'" rx="9" fill="'+(i===cur?'#ffe08a':'#7a6fd0')+'"/><text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+D[(n.d.getDay()+6)%7]+'</text>'});
document.getElementById('ws').innerHTML=h;var mn=Math.min.apply(null,N.map(function(n){return n.bt})),mx=Math.max.apply(null,N.map(function(n){return n.bt}));document.getElementById('wn').textContent='Your bedtime varied by '+(mx-mn)+' minutes this week. Aim for under 30.'}
function insights(n){var L=[];L.push(n.by[3]<75?'Deep sleep was '+dur(n.by[3])+', below your 1h 30m target. A cooler room (about 18°C) can help.':'Deep sleep was strong at '+dur(n.by[3])+'. Whatever you did yesterday evening, repeat it.');L.push(n.aw>3?'You woke '+n.aw+' times. Try limiting fluids in the last hour before bed.':'Few interruptions, only '+n.aw+'. Your sleep was well consolidated.');L.push(n.bt>23*60+30?'You went to bed at '+hm(n.bt)+'. A bedtime before 23:30 would add about 25 minutes of deep sleep.':'Your bedtime of '+hm(n.bt)+' is on target. Keep it within 30 minutes.');document.getElementById('ins').innerHTML=L.map(function(t){return'<li>'+t+'</li>'}).join('')}
pick(6);
})();
</script></body></html>
