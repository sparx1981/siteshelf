<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Reach Analytics — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#fbf6f1;color:#231a2e;font:500 14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #d6246e;outline-offset:2px;border-radius:8px}
.tb{display:flex;align-items:center;gap:14px;padding:14px clamp(16px,3vw,36px);border-bottom:1px solid #eadfd3;background:#fff;flex-wrap:wrap}.logo{font:800 22px 'Plus Jakarta Sans',sans-serif;margin-right:auto;letter-spacing:-.03em}.logo i{display:inline-block;width:14px;height:14px;border-radius:50% 50% 50% 0;background:#d6246e;margin-right:8px}
.sg{display:flex;background:#f4ebe2;border-radius:12px;padding:3px}.sg button{font:700 13px 'Plus Jakarta Sans',sans-serif;border:0;background:none;color:#6b5d78;padding:7px 14px;border-radius:9px;cursor:pointer}.sg button[aria-pressed=true]{background:#fff;color:#231a2e;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.btn{font:700 13px 'Plus Jakarta Sans',sans-serif;background:#231a2e;color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
.w{max-width:1240px;margin:0 auto;padding:20px clamp(16px,3vw,36px) 60px}h1{font:800 clamp(24px,3vw,30px)/1.1 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em;margin:0 0 14px}
.nets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.nets button{display:flex;gap:8px;align-items:center;font:700 13px 'Plus Jakarta Sans',sans-serif;border:1.5px solid #e0d2c3;background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;color:#231a2e}.nets i{width:9px;height:9px;border-radius:50%}.nets button[aria-pressed=true]{background:#231a2e;color:#fff;border-color:#231a2e}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.k,.p{background:#fff;border:1px solid #eadfd3;border-radius:18px;padding:18px}.k small{color:#6b5d78;font-weight:600}.k b{display:block;font:800 32px/1.15 'Plus Jakarta Sans',sans-serif;font-variant-numeric:tabular-nums}
.k .r{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.dl{display:inline-block;font:700 12px 'Plus Jakarta Sans',sans-serif;border-radius:99px;padding:2px 10px;margin-top:4px}.dl.u{background:#e3f6ec;color:#127046}.dl.d{background:#fde7ea;color:#a3182d}.k svg{width:70px;height:36px}
.p h2{font:800 17px 'Plus Jakarta Sans',sans-serif;margin:0;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sw{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px;color:#6b5d78}.sw button{width:38px;height:22px;border-radius:99px;border:0;background:#d9cdbd;position:relative;cursor:pointer;transition:background .2s}.sw button:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}.sw button[aria-checked=true]{background:#d6246e}.sw button[aria-checked=true]:after{transform:translateX(16px)}
.cw{position:relative;outline:none}.cw:focus-visible{outline:3px solid #d6246e;outline-offset:4px;border-radius:12px}.cw svg{width:100%;height:auto;display:block;overflow:visible}
.cw text{font:400 11px 'DM Mono',monospace;fill:#8d7e9a}
.tip{position:absolute;pointer-events:none;background:#231a2e;color:#fff;border-radius:10px;padding:8px 12px;font:400 12px 'DM Mono',monospace;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .15s;z-index:3}.tip.on{opacity:1}.tip b{display:block;font:800 15px 'Plus Jakarta Sans',sans-serif}
.tw{overflow-x:auto;margin-top:16px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #f1e7dd}th{font:700 12px 'Plus Jakarta Sans',sans-serif;color:#6b5d78;letter-spacing:.04em}th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}th button:focus-visible{outline:3px solid #d6246e;outline-offset:2px}
td{font-variant-numeric:tabular-nums}td:first-child{display:flex;gap:10px;align-items:center}td i{width:9px;height:9px;border-radius:50%;flex:none}.bar{display:inline-block;height:6px;border-radius:99px;background:#d6246e;vertical-align:middle;margin-left:8px;opacity:.6}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);background:#231a2e;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:900px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.k b{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="tb"><div class="logo"><i></i>chirpwise</div><div class="sg" role="group" aria-label="Date range" id="rg"><button type="button" aria-pressed="false" data-d="7">7 days</button><button type="button" aria-pressed="true" data-d="28">28 days</button><button type="button" aria-pressed="false" data-d="90">90 days</button></div><button class="btn" type="button" id="ex">Export</button></div>
<main class="w"><h1>Audience overview</h1><div class="nets" role="group" aria-label="Networks" id="nets"></div>
<div class="kp" id="kp"></div>
<section class="p"><h2><span>Reach over time</span><span class="sw"><span id="swl">Compare to previous period</span><button type="button" role="switch" aria-checked="true" aria-labelledby="swl" id="cmp"></button></span></h2>
<div class="cw" id="cw" tabindex="0" role="img" aria-label="Area chart of daily reach. Use left and right arrow keys to move through days."><svg id="svg" viewBox="0 0 900 280"></svg><div class="tip" id="tip"></div></div><div class="vh" id="lv" aria-live="polite"></div></section>
<section class="p" style="margin-top:16px"><h2>Top posts</h2><div class="tw"><table><caption class="vh">Top posts by reach</caption><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div></section></main>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
var NET={Loop:'#5b2a86',Frame:'#ff8a3d',Chirp:'#1fa3a3'},reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,days=28,net='All',cmp=true,idx=null,shown={};
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
function series(d,n,off){var key=(d*7+(n==='All'?1:n==='Loop'?2:n==='Frame'?3:4))*13+off,r=rng(key),base=n==='All'?9200:5200,a=[];for(var i=0;i<d;i++){var wk=1+.22*Math.sin(i/7*6.283+off),trend=1+(i/d)*(off?0:.18);a.push(Math.round(base*wk*trend*(.85+r()*.3)))}return a}
var POSTS=[['Behind the scenes: our spring launch','Loop','12 Sep',48200,6.4,1840],['5 tips for tidy spreadsheets','Chirp','9 Sep',36100,4.1,2210],["We're hiring a community lead",'Frame','5 Sep',29800,3.2,960],['Customer story: Bakery on Maple Street','Loop','2 Sep',27400,7.1,1480],['New feature: scheduled replies','Chirp','28 Aug',22600,5.2,1730],['Poll: which logo wins?','Frame','24 Aug',19900,8.6,640],['Ten-minute team stand-up template','Loop','20 Aug',17200,3.9,1290],['Our office plant census','Frame','16 Aug',14100,5.4,310],['A thank-you to our first 1,000 users','Chirp','11 Aug',12700,6.8,420],['How we plan a content week','Loop','7 Aug',9800,2.9,880]];
var NETS=['All'].concat(Object.keys(NET)),ne=document.getElementById('nets');
NETS.forEach(function(n){var b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',n==='All');b.innerHTML=(NET[n]?'<i style="background:'+NET[n]+'"></i>':'')+(n==='All'?'All networks':n);b.addEventListener('click',function(){net=n;[].forEach.call(ne.children,function(x){x.setAttribute('aria-pressed',x===b)});render()});ne.appendChild(b)});
document.querySelectorAll('#rg button').forEach(function(b){b.addEventListener('click',function(){days=+b.dataset.d;document.querySelectorAll('#rg button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});render()})});
var cm=document.getElementById('cmp');cm.addEventListener('click',function(){cmp=!cmp;cm.setAttribute('aria-checked',cmp);render(true)});
var sk='reach',sd=-1;
function tween(el,to,fmt){var from=shown[el.id]===undefined?to:shown[el.id];shown[el.id]=to;var t0=performance.now();if(reduce||from===to){el.textContent=fmt(to);return}(function f(n){var k=Math.min(1,(n-t0)/400);el.textContent=fmt(from+(to-from)*k);if(k<1)requestAnimationFrame(f)})(t0)}
var cur,prev;
function render(keep){cur=series(days,net,0);prev=series(days,net,1);var sum=function(a){return a.reduce(function(x,y){return x+y},0)},r=sum(cur),pr=sum(prev);
var K=[['Reach',r,pr,function(v){return Math.round(v).toLocaleString('en-GB')}],['Engagement rate',4.2+(r%7)/10,4.0+(pr%5)/10,function(v){return v.toFixed(1)+'%'}],['New followers',Math.round(r/62),Math.round(pr/60),function(v){return Math.round(v).toLocaleString('en-GB')}],['Link clicks',Math.round(r/9.4),Math.round(pr/9),function(v){return Math.round(v).toLocaleString('en-GB')}]];
var kp=document.getElementById('kp');if(!kp.children.length){K.forEach(function(k,i){kp.insertAdjacentHTML('beforeend','<div class="k"><small>'+k[0]+'</small><div class="r"><div><b id="kv'+i+'"></b><span class="dl" id="kd'+i+'"></span></div><svg viewBox="0 0 70 36" aria-hidden="true"><path id="ks'+i+'" fill="none" stroke="#d6246e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>')})}
K.forEach(function(k,i){var el=document.getElementById('kv'+i);tween(el,k[1],k[3]);var d=(k[1]-k[2])/k[2]*100,dl=document.getElementById('kd'+i);dl.className='dl '+(d>=0?'u':'d');dl.textContent=(d>=0?'▲ Up ':'▼ Down ')+Math.abs(d).toFixed(1)+'%';var s=cur.slice(-14),mx=Math.max.apply(null,s),mn=Math.min.apply(null,s);document.getElementById('ks'+i).setAttribute('d',s.map(function(v,j){return(j?'L':'M')+(j/(s.length-1)*70).toFixed(1)+' '+(34-(v-mn)/(mx-mn||1)*30).toFixed(1)}).join(''))});
chart();table();}
var W=900,H=280,P={l:46,r:12,t:12,b:28};
function xy(a,mx){return a.map(function(v,i){return[P.l+i/(a.length-1)*(W-P.l-P.r),P.t+(1-v/mx)*(H-P.t-P.b)]})}
function chart(){var mx=Math.ceil(Math.max.apply(null,cur.concat(prev))/2000)*2000,pc=xy(cur,mx),pp=xy(prev,mx),svg=document.getElementById('svg'),h='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6246e" stop-opacity=".35"/><stop offset="1" stop-color="#d6246e" stop-opacity="0"/></linearGradient></defs>';
for(var g=0;g<=4;g++){var yy=P.t+g/4*(H-P.t-P.b);h+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+yy+'" y2="'+yy+'" stroke="#eee3d8"/><text x="'+(P.l-8)+'" y="'+(yy+4)+'" text-anchor="end">'+Math.round(mx*(1-g/4)/1000)+'k</text>'}
var step=Math.max(1,Math.round(cur.length/7)),now=new Date(2026,9,11);for(var i=0;i<cur.length;i+=step){var d=new Date(now);d.setDate(d.getDate()-(cur.length-1-i));h+='<text x="'+pc[i][0]+'" y="'+(H-8)+'" text-anchor="middle">'+d.getDate()+' '+d.toLocaleDateString('en-GB',{month:'short'})+'</text>'}
var line=pc.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('');
h+='<path d="'+line+'L'+pc[pc.length-1][0]+' '+(H-P.b)+'L'+pc[0][0]+' '+(H-P.b)+'Z" fill="url(#g)"/>';
if(cmp)h+='<path d="'+pp.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('')+'" fill="none" stroke="#a89bb5" stroke-width="2" stroke-dasharray="5 5"/>';
h+='<path id="ln" d="'+line+'" fill="none" stroke="#d6246e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g id="cx" style="display:none"><line id="cl" y1="'+P.t+'" y2="'+(H-P.b)+'" stroke="#231a2e" stroke-dasharray="3 3"/><circle id="cc" r="6" fill="#fff" stroke="#d6246e" stroke-width="3"/></g><rect x="'+P.l+'" y="0" width="'+(W-P.l-P.r)+'" height="'+H+'" fill="transparent" id="hit"/>';svg.innerHTML=h;
var ln=document.getElementById('ln');if(!reduce){var L=ln.getTotalLength();ln.style.strokeDasharray=L;ln.style.strokeDashoffset=L;ln.getBoundingClientRect();ln.style.transition='stroke-dashoffset .6s ease';ln.style.strokeDashoffset=0}
svg._pc=pc;svg._mx=mx;var hit=document.getElementById('hit');hit.addEventListener('pointermove',function(e){var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i=Math.round((x-P.l)/(W-P.l-P.r)*(cur.length-1));setIdx(Math.max(0,Math.min(cur.length-1,i)),true)});hit.addEventListener('pointerleave',function(){setIdx(null)});idx=null}
function setIdx(i,silent){idx=i;var tip=document.getElementById('tip'),cx=document.getElementById('cx');if(i===null){tip.classList.remove('on');cx.style.display='none';return}var p=document.getElementById('svg')._pc[i],r=document.getElementById('svg').getBoundingClientRect(),wr=document.getElementById('cw').getBoundingClientRect(),d=new Date(2026,9,11);d.setDate(d.getDate()-(cur.length-1-i));cx.style.display='';document.getElementById('cl').setAttribute('x1',p[0]);document.getElementById('cl').setAttribute('x2',p[0]);var cc=document.getElementById('cc');cc.setAttribute('cx',p[0]);cc.setAttribute('cy',p[1]);
var txt=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});tip.innerHTML='<b>'+cur[i].toLocaleString('en-GB')+'</b>'+txt+(cmp?'<br>Previous: '+prev[i].toLocaleString('en-GB'):'');tip.style.left=(p[0]/W*r.width)+'px';tip.style.top=(p[1]/H*r.height)+'px';tip.classList.add('on');if(!silent)document.getElementById('lv').textContent=txt+', reach '+cur[i].toLocaleString('en-GB')}
document.getElementById('cw').addEventListener('keydown',function(e){var n=cur.length;if(e.key==='ArrowRight'){e.preventDefault();setIdx(idx===null?0:Math.min(n-1,idx+1))}else if(e.key==='ArrowLeft'){e.preventDefault();setIdx(idx===null?n-1:Math.max(0,idx-1))}else if(e.key==='Home'){e.preventDefault();setIdx(0)}else if(e.key==='End'){e.preventDefault();setIdx(n-1)}else if(e.key==='Escape')setIdx(null)});
document.getElementById('cw').addEventListener('blur',function(){setIdx(null)});
var H2=[['title','Post'],['pub','Published'],['reach','Reach'],['eng','Engagement'],['clk','Clicks']],th=document.getElementById('th');
H2.forEach(function(h){var t=document.createElement('th');t.scope='col';t.innerHTML='<button type="button">'+h[1]+' <span aria-hidden="true"></span></button>';t.firstChild.addEventListener('click',function(){if(sk===h[0])sd=-sd;else{sk=h[0];sd=h[0]==='title'?1:-1}table()});t.dataset.k=h[0];th.appendChild(t)});
function table(){var map={title:0,pub:2,reach:3,eng:4,clk:5},k=map[sk],f=net==='All'?POSTS.slice():POSTS.filter(function(p){return p[1]===net}),mul=days/28;f.sort(function(a,b){var x=a[k],y=b[k];if(sk==='pub'){x=POSTS.indexOf(a);y=POSTS.indexOf(b);return(x-y)*-sd}return typeof x==='string'?x.localeCompare(y)*sd:(x-y)*sd});
[].forEach.call(th.children,function(t){var on=t.dataset.k===sk;t.setAttribute('aria-sort',on?(sd>0?'ascending':'descending'):'none');t.querySelector('span').textContent=on?(sd>0?'▲':'▼'):''});
var mx=Math.max.apply(null,f.map(function(p){return p[3]}));document.getElementById('tb').innerHTML=f.map(function(p){return'<tr><td><i style="background:'+NET[p[1]]+'"></i>'+p[0]+'</td><td>'+p[2]+'</td><td>'+Math.round(p[3]*Math.max(.3,mul)).toLocaleString('en-GB')+'<span class="bar" style="width:'+Math.round(p[3]/mx*60)+'px"></span></td><td>'+p[4].toFixed(1)+'%</td><td>'+p[5].toLocaleString('en-GB')+'</td></tr>'}).join('')}
document.getElementById('ex').addEventListener('click',function(){var t=document.getElementById('toast');t.textContent='Report ready';t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1700)});
render();
})();
</script></body></html>
