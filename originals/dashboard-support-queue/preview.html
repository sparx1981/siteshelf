</style></head><body>
<div class="tb"><div class="logo"><i></i>helpline</div><label class="sr"><span class="vh">Search tickets</span><input id="q" type="search" placeholder="Search subject or customer"></label><span class="ag">You: Priya N.</span></div>

<script>
(function(){
var AG=['Priya N.','Callum R.','Joan M.','Idris C.','Noor H.'],PR={Urgent:['#d92d3a',0],High:['#e8710a',1],Normal:['#2f5bea',2],Low:['#6a7690',3]},CH=['Email','Chat','Phone'],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function side(){stl.innerHTML='';['All','Open','Pending','On hold','Solved'].forEach(function(s){var n=s==='All'?S.length:S.filter(function(t){return t.st===s}).length,li=document.createElement('li');li.innerHTML='<button type="button" aria-pressed="'+(s===st)+'">'+s+'<b>'+n+'</b></button>';li.firstChild.addEventListener('click',function(){st=s;render()});stl.appendChild(li)})}
var prl=document.getElementById('prl');Object.keys(PR).forEach(function(p){var l=document.createElement('label');l.className='c';l.innerHTML='<input type="checkbox" checked> '+p;l.firstChild.addEventListener('change',function(e){pr[p]=e.target.checked;render()});prl.appendChild(l)});
var as=document.getElementById('as');['Anyone','Me','Unassigned'].concat(AG).forEach(function(a){var o=document.createElement('option');o.textContent=a;as.appendChild(o)});as.addEventListener('change',function(){asg=as.value;render()});
document.getElementById('q').addEventListener('input',function(e){q=e.target.value.toLowerCase().trim();render()});document.getElementById('fast').addEventListener('change',function(e){fast=e.target.checked});
document.getElementById('v1').addEventListener('click',function(){st='All';asg='Me';as.value='Me';Object.keys(pr).forEach(function(k,i){pr[k]=k==='Urgent'});[].forEach.call(prl.children,function(l){l.firstChild.checked=l.textContent.trim()==='Urgent'});render()});
document.getElementById('v2').addEventListener('click',function(){st='All';asg='Unassigned';as.value='Unassigned';Object.keys(pr).forEach(function(k){pr[k]=true});[].forEach.call(prl.children,function(l){l.firstChild.checked=true});render()});
document.getElementById('sort').addEventListener('click',function(){asc=!asc;this.textContent='SLA '+(asc?'▲':'▼');this.parentNode.setAttribute('aria-sort',asc?'ascending':'descending');render()});
document.getElementById('ft').addEventListener('click',function(){var f=document.getElementById('fl');f.classList.toggle('open');this.setAttribute('aria-expanded',f.classList.contains('open'))});
function render(){side();var L=filt().sort(function(a,b){return(a.st==='Solved')-(b.st==='Solved')||(asc?a.sla-b.sla:b.sla-a.sla)});document.getElementById('cnt').textContent=L.length+(L.length===1?' ticket':' tickets');
tb.innerHTML='';L.forEach(function(t){var tr=document.createElement('tr');tr.className='r';tr.tabIndex=0;tr.dataset.id=t.id;var p=PR[t.p];tr.innerHTML='<td><span class="pr'+(t.p==='High'?' hi':'')+'" style="--c:'+p[0]+'">'+t.p+'</span></td><td><div class="t1">'+t.s+'</div><div class="t2">'+t.c+' · #'+t.id+' · '+t.st+' · '+t.up+'</div></td><td>'+t.ch+'</td><td class="as-c"></td><td class="sla-c"></td>';
var ac=tr.querySelector('.as-c');if(t.a){ac.innerHTML='<span class="av" aria-hidden="true">'+t.a.split(' ').map(function(w){return w[0]}).join('')+'</span>'+t.a}else{var b=document.createElement('button');b.type='button';b.className='as';b.textContent='Unassigned ▾';b.setAttribute('aria-haspopup','menu');b.addEventListener('click',function(e){e.stopPropagation();menu(b,t)});ac.appendChild(b)}
tr.addEventListener('click',function(){open(t,tr)});tr.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target===tr)open(t,tr);var n={ArrowDown:tr.nextSibling,ArrowUp:tr.previousSibling}[e.key];if(n&&e.target===tr){e.preventDefault();n.focus()}});tb.appendChild(tr)});clocks();load();kpis()}
function clocks(){[].forEach.call(tb.children,function(tr){var t=S.find(function(x){return x.id==tr.dataset.id}),s=slaS(t),c=tr.querySelector('.sla-c');c.innerHTML='<span class="sla'+(t.sla<0&&t.st!=='Solved'?' br':'')+'" style="--c:'+s[0]+'"><i></i>'+s[1]+'</span>'})}
setInterval(function(){S.forEach(function(t){if(t.st!=='Solved')t.sla-=fast?30:1});clocks();kpis()},1000);
function kpis(){var open=S.filter(function(t){return t.st!=='Solved'}),br=open.filter(function(t){return t.sla<0}).length;document.getElementById('kp').innerHTML=[['Open tickets',open.length],['Median first response','14 min'],['SLA met today',Math.round((open.length-br)/open.length*100)+'%'],['Unassigned',open.filter(function(t){return!t.a}).length]].map(function(k){return'<div class="k"><small>'+k[0]+'</small><b>'+k[1]+'</b></div>'}).join('')}
function load(){var ld=document.getElementById('ld'),H=ld.children.length===0;AG.forEach(function(a,i){var n=S.filter(function(t){return t.a===a&&t.st!=='Solved'}).length,c=n>=8?'#d92d3a':n>=6?'#c77a00':'#14935f',el=document.getElementById('ag'+i);if(!el){el=document.createElement('div');el.className='a';el.id='ag'+i;el.innerHTML='<div><b>'+a+'</b><span></span></div><div class="bar" aria-hidden="true"><i style="width:0"></i></div>';ld.appendChild(el);el.querySelector('.bar i').getBoundingClientRect()}el.querySelector('span').textContent=n+' of 8';var i2=el.querySelector('.bar i');i2.style.setProperty('--c',c);i2.style.width=Math.min(100,n/8*100)+'%'})}
function menu(b,t){var old=document.querySelector('.mn');if(old)old.remove();var m=document.createElement('div');m.className='mn';m.setAttribute('role','menu');AG.forEach(function(a){var x=document.createElement('button');x.type='button';x.setAttribute('role','menuitem');x.textContent=a;x.addEventListener('click',function(){t.a=a;m.remove();render();document.getElementById('lv')&&0});m.appendChild(x)});var r=b.getBoundingClientRect();m.style.left=Math.min(innerWidth-210,r.left+scrollX)+'px';m.style.top=(r.bottom+scrollY+4)+'px';document.body.appendChild(m);m.firstChild.focus();m.addEventListener('keydown',function(e){var k=[].slice.call(m.children),i=k.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();k[(i+1)%k.length].focus()}else if(e.key==='ArrowUp'){e.preventDefault();k[(i-1+k.length)%k.length].focus()}else if(e.key==='Escape'){m.remove();b.focus()}});setTimeout(function(){document.addEventListener('click',function h(e){if(!e.composedPath().includes(m)){m.remove();document.removeEventListener('click',h)}})},0)}
document.getElementById('lb').addEventListener('click',function(){var best=AG.map(function(a){return[a,S.filter(function(t){return t.a===a&&t.st!=='Solved'}).length]}).sort(function(x,y){return x[1]-y[1]})[0][0],t=S.filter(function(x){return!x.a&&x.st!=='Solved'}).sort(function(a,b){return a.sla-b.sla})[0];if(t){t.a=best;render()}});
var dr=document.getElementById('dr'),scr=document.getElementById('scr');
function open(t,tr){sel=t;last=tr;document.getElementById('dtt').textContent=t.s;var p=PR[t.p];document.getElementById('db').innerHTML='<p style="margin:0 0 12px;color:#56647f"><span class="pr'+(t.p==='High'?' hi':'')+'" style="--c:'+p[0]+'">'+t.p+'</span> &nbsp; '+t.c+' · '+t.ch+' · #'+t.id+'<br>'+t.c.toLowerCase().replace(/[^a-z]/g,'')+'@example.com</p><div class="msg c">Hi, '+t.s.toLowerCase()+'. Can you help me sort this out today?<small>'+t.c+', 2 hours ago</small></div><div class="msg a">Thanks for getting in touch, I am looking into this now.<small>Priya N., 1 hour ago</small></div><div class="msg c">Great, thank you. Let me know if you need anything else.<small>'+t.c+', 40 min ago</small></div><div class="rp"><div class="cc" role="group" aria-label="Canned replies"><button type="button">Send tracking link</button><button type="button">Offer refund</button><button type="button">Ask for photo</button></div><label class="vh" for="rt">Reply</label><textarea id="rt" placeholder="Write a reply…"></textarea></div><div class="da"><button type="button" id="dA">Assign to me</button><button type="button" id="dP">Set pending</button><button type="button" class="s" id="dS">Solve</button></div>';
var T={'Send tracking link':'Here is your tracking link: https://track.example.com/'+t.id+'. It updates every hour.','Offer refund':'I am sorry about this. I can refund the order in full, which takes 3 to 5 working days.','Ask for photo':'Could you send a photo of the item and the packaging? That helps us sort this faster.'};

})();
