<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warehouse Pick Heatmap — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=DM+Mono:wght@400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#14161a;color:#eceff4;font:400 14px/1.5 'Work Sans',system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #ffd400;outline-offset:1px;border-radius:4px}
.tb{display:flex;align-items:center;gap:14px;padding:12px clamp(14px,3vw,32px);border-bottom:1px solid #2c313a;flex-wrap:wrap}.logo{font:800 24px 'Big Shoulders Display',sans-serif;letter-spacing:.14em;color:#ffd400;margin-right:auto}.site{background:#1c1f25;border:1px solid #2c313a;border-radius:99px;padding:4px 14px;font-size:13px;color:#9aa3b2}
.sg{display:flex;background:#1c1f25;border:1px solid #2c313a;border-radius:10px;padding:3px}.sg button{font:600 13px 'Work Sans',sans-serif;border:0;background:none;color:#9aa3b2;padding:7px 12px;border-radius:7px;cursor:pointer}.sg button[aria-pressed=true]{background:#ffd400;color:#1a1500}
.w{max-width:1280px;margin:0 auto;padding:16px clamp(14px,3vw,32px) 50px}.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.k,.p{background:#1c1f25;border:1px solid #2c313a;border-radius:14px;padding:16px}.k small{color:#9aa3b2;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px}.k b{display:block;font:800 40px/1.1 'Big Shoulders Display',sans-serif;font-variant-numeric:tabular-nums;color:#fff}.k span{font-size:12px;color:#ffd400}
.g{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:14px;align-items:start}.p h2{font:800 20px 'Big Shoulders Display',sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fl{position:relative;background:#12141a;border-radius:12px;padding:12px 10px}.top{display:flex;justify-content:space-around;margin-bottom:8px;font:600 10px 'DM Mono',monospace;color:#9aa3b2}.top span{border:1px dashed #3a4150;border-radius:5px;padding:2px 10px}
.hd{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-bottom:4px}.hd button{all:unset;text-align:center;font:700 12px 'DM Mono',monospace;color:#9aa3b2;cursor:pointer;padding:2px 0;border-radius:4px}.hd button:hover{color:#fff}.hd button[aria-pressed=true]{color:#ffd400}.hd button:focus-visible{outline:3px solid #ffd400}
.mp{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}.ai{display:flex;flex-direction:column;gap:2px;padding:3px;border-radius:6px;border:2px solid transparent;transition:border-color .2s}.ai.sel{border-color:#ffd400}.ai.xa{margin-top:6px}
.c{all:unset;box-sizing:border-box;display:block;height:var(--ch,15px);border-radius:3px;background:var(--c);cursor:pointer;transition:background .35s,transform .1s,box-shadow .1s}.c:hover,.c:focus-visible{transform:scale(1.18);z-index:2;position:relative;box-shadow:0 0 0 2px #fff}.c:focus-visible{outline:none}
.dk{display:flex;justify-content:space-between;margin-top:10px}.dk span{font:600 10px 'DM Mono',monospace;color:#9aa3b2;border-top:3px solid #4a5160;padding-top:3px;width:15%;text-align:center}
.lg{display:flex;align-items:center;gap:10px;margin-top:10px;font:400 11px 'DM Mono',monospace;color:#9aa3b2}.lg i{flex:1;max-width:260px;height:10px;border-radius:99px;background:linear-gradient(90deg,#2a3a55,#3f6a8f,#4fa3a5,#9bd17a,#f5d34f,#f59f3a,#ee5a3a)}
.tip{position:fixed;z-index:50;background:#0b0c0f;border:1px solid #444c5c;border-radius:8px;padding:7px 11px;font:400 12px 'DM Mono',monospace;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap}.tip.on{opacity:1}.tip b{display:block;font:700 13px 'Work Sans',sans-serif}
.dt h3{font:800 34px 'Big Shoulders Display',sans-serif;margin:0 0 4px;color:#ffd400;letter-spacing:.04em}.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin:12px 0 4px}.bars i{flex:1;background:#ffd400;border-radius:3px 3px 0 0;transition:height .4s}.bl{display:flex;gap:4px;font:400 10px 'DM Mono',monospace;color:#9aa3b2}.bl span{flex:1;text-align:center}
.sk{list-style:none;margin:10px 0 0;padding:0}.sk li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2c313a}.sk b{font-family:'DM Mono',monospace}
.tips{margin-top:14px}.tips ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}.tips li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:#12141a;border-radius:10px;padding:10px 14px}.tips button{font:700 13px 'Work Sans',sans-serif;border:1.5px solid #ffd400;background:transparent;color:#ffd400;border-radius:8px;padding:7px 14px;cursor:pointer}.tips button[aria-pressed=true]{background:#ffd400;color:#1a1500}
@media(max-width:1000px){.g{grid-template-columns:minmax(0,1fr)}.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.mp,.hd{gap:3px}.c{--ch:12px}.k b{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="tb"><div class="logo">STOCKROOM</div><span class="site">Brightwater DC · Bay 3</span><div class="sg" role="group" aria-label="Shift" id="sh"></div><div class="sg" role="group" aria-label="Metric" id="mt"></div></div>
<main class="w"><div class="kp" id="kp"></div>
<div class="g"><section class="p"><h2>Floor map<span style="font:500 12px 'DM Mono',monospace;letter-spacing:0;color:#9aa3b2;text-transform:none" id="ml"></span></h2><div class="fl"><div class="top" aria-hidden="true"><span>PACK 1</span><span>PACK 2</span><span>PACK 3</span></div><div class="hd" id="hd"></div><div class="mp" id="mp" role="grid" aria-label="Warehouse floor heatmap"></div><div class="dk" aria-hidden="true"><span>DOCK 1</span><span>DOCK 2</span><span>DOCK 3</span><span>DOCK 4</span></div></div><div class="lg"><span id="lmin"></span><i></i><span id="lmax"></span></div></section>
<aside class="p dt" id="dt" aria-live="polite"></aside></div>
<section class="p tips"><h2>Slotting tips</h2><ul id="tips"></ul></section></main><div class="tip" id="tip"></div>
<script>
(function(){
var COL=['#2a3a55','#3f6a8f','#4fa3a5','#9bd17a','#f5d34f','#f59f3a','#ee5a3a'],SH=['Morning 06 to 14','Afternoon 14 to 22','Night 22 to 06'],MT=[['Picks per hour',''],['Travel seconds per pick','s'],['Congestion','%']],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var sh=0,mt=0,sel=6,applied={},A=12,B=20,SKU=['Oat cartons','Pasta 500g','Tinned tomatoes','Olive oil 1L','Rice 2kg','Cereal bars','Coffee beans','Tea bags','Crisps multi','Biscuits tin'];
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
var base=[];for(var a=0;a<A;a++){base[a]=[];for(var b=0;b<B;b++){var r=rng(a*97+b*13+5);r();r();var hot=Math.exp(-Math.pow((a-(a<6?1:7))/2.2,2))*.55+Math.exp(-Math.pow((b-3)/4,2))*.35;base[a][b]=Math.max(.04,Math.min(1,.06+hot*.8+r()*.3))}}
var tw=[[1,1.1,.8],[.9,1.2,.7],[.6,.8,1.3]];
function val(a,b){var s=base[a][b]*[.9,.8,.5][sh]*(1+.2*Math.sin(a*1.7+sh)),v=s;var ap=applied[0];if(ap){if(a===6&&b===11)v*=.45;if(a===1&&b===2)v*=1.18}return Math.max(0,Math.min(1,v))}
var mp=document.getElementById('mp'),cells=[],hd=document.getElementById('hd'),tip=document.getElementById('tip'),dt=document.getElementById('dt');
function unit(v){return mt===0?Math.round(v*60)+' picks/h':mt===1?Math.round(18+v*74)+' s/pick':Math.round(v*100)+'% congested'}
for(var a=0;a<A;a++){var l=document.createElement('button');l.type='button';l.textContent='A'+(a+1);l.setAttribute('aria-label','Select aisle A'+(a+1));l.setAttribute('aria-pressed',a===sel);(function(a){l.addEventListener('click',function(){pick(a)})})(a);hd.appendChild(l);
var col=document.createElement('div');col.className='ai';col.setAttribute('role','row');cells[a]=[];for(var b=0;b<B;b++){var c=document.createElement('button');c.type='button';c.className='c'+(b===6||b===13?' xa':'');c.setAttribute('role','gridcell');c.tabIndex=a===0&&b===0?0:-1;c.dataset.a=a;c.dataset.b=b;col.appendChild(c);cells[a][b]=c;(function(a,b,c){c.addEventListener('click',function(){pick(a)});c.addEventListener('pointerenter',function(e){show(a,b,c)});c.addEventListener('focus',function(){show(a,b,c)});c.addEventListener('pointerleave',hide);c.addEventListener('blur',hide);c.addEventListener('keydown',function(e){var d={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]}[e.key];if(d){e.preventDefault();var na=a+d[0],nb=b+d[1];if(cells[na]&&cells[na][nb]){cells[a][b].tabIndex=-1;cells[na][nb].tabIndex=0;cells[na][nb].focus()}}})})(a,b,c)}
mp.appendChild(col)}
function idx(v){return Math.min(6,Math.floor(v*7))}
function paint(wave){for(var a=0;a<A;a++)for(var b=0;b<B;b++){var c=cells[a][b],v=val(a,b),set=function(c,v,a,b){c.style.setProperty('--c',COL[idx(v)]);c.setAttribute('aria-label','Aisle A'+(a+1)+', bay '+(b+1)+', '+unit(v))};if(wave&&!reduce)setTimeout(set,a*14,c,v,a,b);else set(c,v,a,b)}
var tot=0,best=-1,bv=0,hot=0;for(var a=0;a<A;a++){var s=0;for(var b=0;b<B;b++){var v=val(a,b);s+=v;if(v>.82)hot++}tot+=s;if(s>bv){bv=s;best=a}}
document.getElementById('kp').innerHTML=[['Total picks',Math.round(tot*210).toLocaleString('en-GB'),['06:00 to 14:00','14:00 to 22:00','22:00 to 06:00'][sh]],['Avg pick rate',Math.round(tot/(A*B)*72)+' / h','target 54 / h'],['Busiest aisle','A'+(best+1),Math.round(bv/B*60)+' picks/h'],['Congestion hot spots',hot,'cells above 82%']].map(function(k){return'<div class="k"><small>'+k[0]+'</small><b>'+k[1]+'</b><span>'+k[2]+'</span></div>'}).join('');
document.getElementById('ml').textContent=SH[sh]+' · '+MT[mt][0];document.getElementById('lmin').textContent=unit(0);document.getElementById('lmax').textContent=unit(1);detail();tipsDraw()}
function show(a,b,c){var r=c.getBoundingClientRect(),v=val(a,b),sk=SKU[(a*3+b)%10];tip.innerHTML='<b>Aisle A'+(a+1)+', bay '+(b+1)+'</b>'+unit(v)+' · SKU-'+(4000+a*20+b)+' '+sk;tip.style.left=Math.min(innerWidth-230,Math.max(6,r.left-90))+'px';tip.style.top=Math.max(6,r.top-52)+'px';tip.classList.add('on')}
function hide(){tip.classList.remove('on')}
function pick(a){sel=a;[].forEach.call(hd.children,function(x,k){x.setAttribute('aria-pressed',k===a)});[].forEach.call(mp.children,function(x,k){x.classList.toggle('sel',k===a)});detail()}
function detail(){var a=sel,hrs=[],r=rng(a*17+sh*5+1);for(var h=0;h<8;h++){var s=0;for(var b=0;b<B;b++)s+=val(a,b);hrs.push(Math.round(s/B*60*(.7+r()*.6)))}var mx=Math.max.apply(null,hrs),start=[6,14,22][sh];
var tops=[0,1,2].map(function(k){return[SKU[(a*3+k*4)%10],Math.round(120*(1-k*.25)*(.8+base[a][k*3][0]||1))]});
dt.innerHTML='<h2 style="margin-bottom:2px">Aisle drill-down</h2><h3>A'+(a+1)+'</h3><div style="color:#9aa3b2">'+SH[sh]+' · picks per hour</div><div class="bars">'+hrs.map(function(h){return'<i style="height:'+Math.round(h/mx*100)+'%" title="'+h+' picks"></i>'}).join('')+'</div><div class="bl">'+hrs.map(function(_,i){return'<span>'+('0'+((start+i)%24)).slice(-2)+'</span>'}).join('')+'</div><ul class="sk">'+tops.map(function(t){return'<li><span>'+t[0]+'</span><b>'+t[1]+' picks</b></li>'}).join('')+'</ul>';
[].forEach.call(mp.children,function(x,k){x.classList.toggle('sel',k===a)})}
var TP=[['Move SKU-4781 from A7 bay 12 to A2 bay 3 to cut travel by 14%','A7','A2'],['Split SKU-4023 across A4 and A5 to relieve congestion at 15:00','A4','A5'],['Swap fast movers in A1 with slow movers in A12 on the night shift','A1','A12']];
function tipsDraw(){var ul=document.getElementById('tips');ul.innerHTML='';TP.forEach(function(t,i){var li=document.createElement('li');li.innerHTML='<span>'+t[0]+'</span><button type="button" aria-pressed="'+!!applied[i]+'">'+(applied[i]?'Applied ✓':'Apply')+'</button>';li.lastChild.addEventListener('click',function(){applied[i]=!applied[i];paint(true)});ul.appendChild(li)})}
SH.forEach(function(s,i){var b=document.createElement('button');b.type='button';b.textContent=s.split(' ')[0];b.setAttribute('aria-pressed',i===sh);b.addEventListener('click',function(){sh=i;[].forEach.call(document.getElementById('sh').children,function(x,k){x.setAttribute('aria-pressed',k===i)});paint(true)});document.getElementById('sh').appendChild(b)});
MT.forEach(function(m,i){var b=document.createElement('button');b.type='button';b.textContent=m[0];b.setAttribute('aria-pressed',i===mt);b.addEventListener('click',function(){mt=i;[].forEach.call(document.getElementById('mt').children,function(x,k){x.setAttribute('aria-pressed',k===i)});paint(true)});document.getElementById('mt').appendChild(b)});
paint(false);pick(6);
})();
</script></body></html>
