<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ With Helpful Votes — FAQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#f6faf6;color:#14281c;font:400 16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #1f9d57;outline-offset:3px;border-radius:12px}
.hd{background:#0f3d24;color:#eaf6ee;padding:22px clamp(18px,4vw,56px) 56px}.nav{display:flex;align-items:center;gap:12px;max-width:860px;margin:0 auto 34px}.logo{font:600 24px Fraunces,serif}.logo i{display:inline-block;width:18px;height:18px;border:3px solid #ffe66d;border-radius:50%;margin-right:8px;vertical-align:-2px}
.hd h1{max-width:860px;margin:0 auto 10px;font:600 clamp(34px,5.4vw,60px)/1.05 Fraunces,serif;letter-spacing:-.02em}.hd p{max-width:860px;margin:0 auto;color:#bcd9c6}
.w{max-width:860px;margin:-28px auto 0;padding:0 clamp(18px,4vw,24px) 60px}
.tb{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid #dbe7dc;border-radius:16px;padding:12px 16px;margin-bottom:14px;box-shadow:0 14px 30px -24px rgba(15,61,36,.6)}.tb>span{color:#50685a;font-size:14px}.tb .cnt{margin-left:auto}
.sg{display:flex;background:#eaf3ea;border-radius:12px;padding:3px}.sg button{font:600 14px Inter,sans-serif;border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;color:#14281c}.sg button[aria-pressed=true]{background:#0f3d24;color:#fff}
.list{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.it{background:#fff;border:1px solid #dbe7dc;border-radius:16px;overflow:hidden;transition:box-shadow .2s,border-color .2s}.it.open{border-color:#1f9d57;box-shadow:0 18px 34px -26px rgba(31,157,87,.7)}
.q{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;font:600 19px/1.3 Fraunces,serif}.q:focus-visible{outline:3px solid #1f9d57;outline-offset:-3px}.q:hover{background:#f2f9f3}
.q span{flex:1}.q i{width:26px;height:26px;border-radius:50%;background:#e6f3e8;position:relative;flex:none;transition:transform .25s,background .25s}.q i:before,.q i:after{content:"";position:absolute;left:7px;right:7px;top:12px;height:2px;background:#0f3d24;border-radius:2px}.q i:after{transform:rotate(90deg);transition:transform .25s}.open .q i{background:#ffe66d;transform:rotate(180deg)}.open .q i:after{transform:rotate(0)}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s}.open .bd{grid-template-rows:1fr}.bd>div{overflow:hidden}.in{padding:0 20px 18px}.in p{margin:0 0 14px;color:#2f4a39}
.vt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed #dbe7dc;padding-top:14px;font-size:14px}.vt b{font-weight:600;margin-right:4px}
.vb{display:inline-flex;align-items:center;gap:6px;font:600 14px Inter,sans-serif;border:1.5px solid #bcd5c1;background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;color:#14281c;transition:background .2s,transform .15s}.vb:hover{background:#eef7ef}.vb:active{transform:scale(.95)}.vb[aria-pressed=true]{background:#1f9d57;border-color:#1f9d57;color:#fff}.vb.n[aria-pressed=true]{background:#7a2e2e;border-color:#7a2e2e}
.vb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.res{width:100%;color:#50685a;margin-top:2px}.pb{height:6px;background:#e6efe7;border-radius:99px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:#1f9d57;border-radius:99px;transition:width .3s}
.th{color:#0f6f3a;font-weight:600}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header class="hd"><div class="nav"><div class="logo"><i></i>Pedalo</div></div><h1>Questions riders actually ask.</h1><p>Everything about unlocking, riding, parking and paying. Tell us if an answer helped, so we can fix the ones that don't.</p></header>
<main class="w"><div class="tb"><span>Sort by</span><div class="sg" role="group" aria-label="Sort questions"><button type="button" aria-pressed="true" data-s="d">Default order</button><button type="button" aria-pressed="false" data-s="h">Most helpful</button></div><span class="cnt" id="cnt"></span></div>
<ul class="list" id="list"></ul><div class="vh" aria-live="polite" id="live"></div></main>
<script>
(function(){
var Q=[['How much does a ride cost?','Unlocking a bike costs £1, then it is 12p a minute. Day passes are £6 for unlimited 30-minute rides, and monthly members pay £14 for unlimited 45-minute rides.',142,20],['A bike is broken. What should I do?','Tap "Report a problem" in the app, choose the fault and lock the bike. You will not be charged for rides under two minutes, and we will credit any ride cut short by a fault.',98,31],['Where can I park?','Park inside any blue-lined bay or a marked zone in the app. Parking outside costs £5 and may be removed. If a bay is full, the app shows the nearest free one.',210,12],['Do I need to wear a helmet?','Helmets are not required by law in the UK, but we recommend one. Members can borrow a free helmet from any hub, and we give a discount code for your first helmet.',64,40],['Is there a student discount?','Yes, 40% off monthly membership with a valid university email. Verify once in the app under Account, then Discounts. It renews each September.',77,9],['How do I pause a ride?','Press the lock button on the bike and tap "Pause" in the app. Pausing costs 3p a minute and holds the bike for up to 30 minutes.',55,22],['I lost something on a bike.','Contact us within 48 hours through Help, then Lost property. We keep found items for 30 days at the central hub on Weavers Lane.',120,8],['Can I ride with a child?','Under 16s cannot ride alone. An adult can ride with a child seat attached to our family bikes, available at the three biggest hubs.',33,17]];
var KEY='pedalo-faq-votes',votes={},order=Q.map(function(_,i){return i}),open=-1,sort='d',list=document.getElementById('list'),live=document.getElementById('live'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
try{votes=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){votes={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(votes))}catch(e){}}
function cnt(i){var y=Q[i][2]+(votes[i]==='y'?1:0),n=Q[i][3]+(votes[i]==='n'?1:0);return{y:y,n:n,p:Math.round(y/(y+n)*100)}}
var els=[];
Q.forEach(function(q,i){var li=document.createElement('li');li.className='it';li.dataset.i=i;li.innerHTML='<h2 style="margin:0;font-size:inherit"><button class="q" type="button" aria-expanded="false" aria-controls="a'+i+'" id="q'+i+'"><span>'+q[0]+'</span><i></i></button></h2><div class="bd" id="a'+i+'" role="region" aria-labelledby="q'+i+'"><div><div class="in"><p>'+q[1]+'</p><div class="vt"><b>Was this helpful?</b><button class="vb y" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 11v9H4v-9zM7 11l4-8c1.5 0 2.5 1 2.5 2.5V9H19a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7"/></svg>Yes <span class="cy"></span></button><button class="vb n" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M17 13V4h3v9zM17 13l-4 8c-1.5 0-2.5-1-2.5-2.5V15H5a2 2 0 0 1-2-2.3l1.2-7A2 2 0 0 1 6.2 4H17"/></svg>No <span class="cn"></span></button><span class="th" id="th'+i+'"></span><div class="res"><span class="rs"></span><div class="pb"><i></i></div></div></div></div></div></div>';
li.querySelector('.q').addEventListener('click',function(){toggle(i)});
li.querySelector('.q').addEventListener('keydown',function(e){var vis=order.map(function(k){return els[k].querySelector('.q')}),p=vis.indexOf(this),d=e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0;if(e.key==='Home'){e.preventDefault();vis[0].focus()}else if(e.key==='End'){e.preventDefault();vis[vis.length-1].focus()}else if(d){e.preventDefault();vis[(p+d+vis.length)%vis.length].focus()}});
['y','n'].forEach(function(t){li.querySelector('.vb.'+t).addEventListener('click',function(){votes[i]=votes[i]===t?undefined:t;if(!votes[i])delete votes[i];save();paint(i);live.textContent=votes[i]?'Thanks for your feedback.':'Vote removed.'})});
els.push(li);list.appendChild(li)});
function paint(i){var li=els[i],c=cnt(i);li.querySelector('.cy').textContent=c.y;li.querySelector('.cn').textContent=c.n;li.querySelector('.vb.y').setAttribute('aria-pressed',votes[i]==='y');li.querySelector('.vb.n').setAttribute('aria-pressed',votes[i]==='n');li.querySelector('.rs').textContent=c.p+'% of '+(c.y+c.n)+' riders found this helpful';li.querySelector('.pb i').style.width=c.p+'%';document.getElementById('th'+i).textContent=votes[i]?'Thanks for the feedback':''}
function toggle(i){var was=open===i;els.forEach(function(li,k){var on=k===i&&!was;li.classList.toggle('open',on);li.querySelector('.q').setAttribute('aria-expanded',on)});open=was?-1:i}
function render(flip){var first={};if(flip&&!reduce)els.forEach(function(li,k){first[k]=li.getBoundingClientRect().top});
order=Q.map(function(_,i){return i});if(sort==='h')order.sort(function(a,b){return cnt(b).p-cnt(a).p||a-b});order.forEach(function(k){list.appendChild(els[k])});
if(flip&&!reduce)els.forEach(function(li,k){var dy=first[k]-li.getBoundingClientRect().top;if(dy){li.style.transition='none';li.style.transform='translateY('+dy+'px)';void li.offsetHeight;li.style.transition='transform .3s';li.style.transform=''}});
document.getElementById('cnt').textContent=Q.length+' questions'}
Q.forEach(function(_,i){paint(i)});render(false);
document.querySelectorAll('.sg button').forEach(function(b){b.addEventListener('click',function(){sort=b.dataset.s;document.querySelectorAll('.sg button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});render(true);live.textContent=sort==='h'?'Sorted by most helpful.':'Default order.'})});
toggle(0);
})();
</script></body></html>
