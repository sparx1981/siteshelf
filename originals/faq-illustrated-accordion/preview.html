<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illustrated FAQ — FAQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Gloock&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#f6efe4;color:#2b241b;font:400 17px/1.6 Nunito,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #2f4a35;outline-offset:3px;border-radius:14px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(18px,4vw,56px)}.logo{font:400 26px Gloock,serif;display:flex;align-items:center;gap:8px}.logo i{width:18px;height:22px;background:#7d9a6a;border-radius:0 100% 0 100%}header a{color:#6a5e4f;text-decoration:none;font-weight:700;font-size:15px}
.w{max-width:860px;margin:0 auto;padding:clamp(20px,5vh,50px) clamp(18px,4vw,30px) 70px}
.lb{font:700 12px Nunito,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#cb6a45}h1{font:400 clamp(38px,6.4vw,72px)/1 Gloock,serif;margin:10px 0 12px}.sub{color:#6a5e4f;max-width:48ch;margin:0 0 30px}
.it{background:#fffaf1;border:1.5px solid #e7dac3;border-radius:22px;margin-bottom:12px;overflow:hidden;transition:box-shadow .25s,border-color .25s}.it.open{border-color:#7d9a6a;box-shadow:0 22px 40px -28px rgba(47,74,53,.6)}
.q{all:unset;box-sizing:border-box;display:flex;width:100%;gap:16px;align-items:center;padding:20px 24px;cursor:pointer;font:400 22px/1.25 Gloock,serif}.q:focus-visible{outline:3px solid #2f4a35;outline-offset:-3px}.q span{flex:1}
.q i{width:34px;height:34px;border-radius:50%;background:#efe4d0;position:relative;flex:none;transition:transform .3s,background .3s}.q:hover i{transform:rotate(90deg)}.q i:before,.q i:after{content:"";position:absolute;left:9px;right:9px;top:16px;height:2px;background:#2f4a35;border-radius:2px;transition:transform .3s}.q i:after{transform:rotate(90deg)}.open .q i{background:#cb6a45}.open .q i:before,.open .q i:after{background:#fff}.open .q i:after{transform:rotate(0)}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}.open .bd{grid-template-rows:1fr}.bd>div{overflow:hidden}
.pn{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:22px;padding:0 24px 24px;align-items:center}.pn p{margin:0 0 12px}.pn a{color:#2f4a35;font-weight:700}
.il{width:180px;height:180px;border-radius:20px;background:#e9efdc;overflow:hidden;opacity:0;transform:scale(.9);transition:opacity .4s .1s,transform .4s .1s}.open .il{opacity:1;transform:none}.il svg{width:100%;height:100%;display:block}
.il .wob{transform-box:fill-box;transform-origin:50% 100%;animation:wob 2.4s ease-in-out infinite alternate}@keyframes wob{to{transform:rotate(-8deg)}}
.il .rot{transform-box:fill-box;transform-origin:center;animation:rot 12s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.il .rot2{transform-box:fill-box;transform-origin:center;animation:rot 3s linear infinite}
.il .tilt{transform-box:fill-box;transform-origin:80% 80%;animation:tl 3s ease-in-out infinite}@keyframes tl{0%,100%{transform:rotate(0)}40%,70%{transform:rotate(-24deg)}}
.il .drop{animation:dp 1.5s ease-in infinite}.il .drop:nth-of-type(2){animation-delay:.5s}@keyframes dp{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(34px);opacity:0}}
.il .pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.18)}}
.il .lean{transform-box:fill-box;transform-origin:50% 100%;animation:ln 4s ease-in-out infinite alternate}@keyframes ln{to{transform:rotate(7deg)}}
@media(max-width:640px){.pn{grid-template-columns:minmax(0,1fr)}.il{order:-1;width:140px;height:140px}.q{font-size:19px;padding:16px 18px}.pn{padding:0 18px 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.il{opacity:1;transform:none}}
</style></head><body>
<header><div class="logo"><i></i>loamly</div><a href="#">Care guides</a></header>
<main class="w"><div class="lb">FAQ</div><h1>Plant questions, answered.</h1><p class="sub">Everything about getting a happy plant from our greenhouse to your windowsill.</p><div id="list"></div></main>
<template id="t"><svg viewBox="0 0 180 180" aria-hidden="true"></svg></template>
<script>
(function(){
var A=[
['How are plants packed?','Every plant travels upright in a recycled cardboard box, wedged with paper cushioning and wrapped in a breathable sleeve. We ship Monday to Wednesday so plants never sit in a depot over a weekend.','<rect width="180" height="180" fill="#e9efdc"/><g class="wob"><path d="M90 96c-18-10-30-34-18-56 14 8 22 26 18 56z" fill="#7d9a6a"/><path d="M92 96c16-8 34-26 28-50-14 4-30 22-28 50z" fill="#2f4a35"/></g><path d="M40 100h100l8 56H32z" fill="#cb9a63"/><path d="M40 100l-14-16 38 8zM140 100l14-16-38 8z" fill="#b9854f" class="wob"/><rect x="60" y="120" width="60" height="8" rx="3" fill="#fffaf1" opacity=".7"/>'],
['How much light does my plant need?','Each plant card tells you exactly where to put it: bright direct, bright indirect or low light. As a rule, bright indirect means a spot within two metres of a window, out of the midday sun.','<rect width="180" height="180" fill="#fbeccd"/><rect x="104" y="30" width="56" height="84" rx="4" fill="#cfe6f1" stroke="#8a6c3a" stroke-width="5"/><path d="M132 30v84M104 72h56" stroke="#8a6c3a" stroke-width="4"/><g class="rot"><g transform="translate(40 50)" stroke="#f0a824" stroke-width="5" stroke-linecap="round"><path d="M0-28v-10M0 28v10M-28 0h-10M28 0h10M-20-20l-7-7M20 20l7 7M-20 20l-7 7M20-20l7-7"/></g></g><circle cx="40" cy="50" r="18" fill="#f7c948"/><g class="lean"><path d="M96 158c-4-22 0-40 14-56" stroke="#2f4a35" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M110 104c-14-8-20-22-14-34 12 6 18 18 14 34zM112 110c12-4 22-14 22-28-12 0-22 10-22 28z" fill="#7d9a6a"/></g><path d="M70 160h56l-6 -22H76z" fill="#cb6a45"/>'],
['How often should I water?','Most houseplants like a drink when the top 3cm of soil feels dry, usually every 7 to 10 days. Your plant card shows a watering rhythm, and the Loamly app will nudge you at the right time.','<rect width="180" height="180" fill="#dff0f6"/><g class="tilt"><path d="M34 66h56l-6 38H40z" fill="#4c8fb3"/><path d="M90 74l40-26" stroke="#4c8fb3" stroke-width="8" stroke-linecap="round"/><path d="M34 70q-18 4-16 24" stroke="#4c8fb3" stroke-width="7" fill="none" stroke-linecap="round"/></g><g fill="#4aa9d8"><path class="drop" d="M134 62c-4 6-4 10 0 10s4-4 0-10z"/><path class="drop" d="M126 66c-4 6-4 10 0 10s4-4 0-10z"/><path class="drop" d="M140 68c-4 6-4 10 0 10s4-4 0-10z"/></g><path d="M100 160h60l-8-34h-44z" fill="#cb6a45"/><path d="M130 126c-10-20-4-34 6-42 8 12 8 28-6 42z" fill="#7d9a6a"/>'],
['Are your plants pet-safe?','Look for the paw badge on any plant page: those are safe for cats and dogs. Some popular plants such as lilies and monstera are not, so we flag them clearly and suggest pet-friendly alternatives.','<rect width="180" height="180" fill="#f1e7f6"/><path d="M30 150c0-24 14-44 36-44s36 20 36 44z" fill="#4a3d5c"/><circle cx="66" cy="96" r="20" fill="#4a3d5c"/><path d="M50 84l-4-20 18 10zM82 84l4-20-18 10z" fill="#4a3d5c"/><circle cx="59" cy="96" r="3" fill="#f7c948"/><circle cx="73" cy="96" r="3" fill="#f7c948"/><path d="M110 156h50l-6-28h-38z" fill="#cb6a45"/><path d="M135 130c-14-16-10-34 0-44 12 14 10 30 0 44z" fill="#7d9a6a"/><g class="pulse"><circle cx="150" cy="56" r="20" fill="#2f4a35"/><path d="M141 56l7 7 12-14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>'],
['What if my plant arrives damaged?','Tell us within 7 days with a photo and we will send a replacement or refund you, whichever you prefer. You do not need to send the damaged plant back.','<rect width="180" height="180" fill="#fde8e0"/><path d="M40 70h100l8 70H32z" fill="#cb9a63"/><path d="M40 70l-12-16 34 8zM140 70l12-16-34 8z" fill="#b9854f"/><path d="M90 128c-16-12-22-24-14-34 6-6 14-4 14 4 0-8 8-10 14-4 8 10 2 22-14 34z" fill="#e0553d" class="pulse"/><g class="rot2"><path d="M138 34a20 20 0 1 0 8 22" stroke="#2f4a35" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M148 30v14h-14z" fill="#2f4a35"/></g>']];
var list=document.getElementById('list'),items=[],open=-1;
A.forEach(function(a,i){var d=document.createElement('div');d.className='it';d.innerHTML='<h2 style="margin:0;font:inherit"><button class="q" type="button" id="q'+i+'" aria-expanded="false" aria-controls="a'+i+'"><span>'+a[0]+'</span><i></i></button></h2><div class="bd" id="a'+i+'" role="region" aria-labelledby="q'+i+'"><div><div class="pn"><div><p>'+a[1]+'</p><a href="#">Read the guide →</a></div><div class="il" aria-hidden="true"><svg viewBox="0 0 180 180">'+a[2]+'</svg></div></div></div></div>';
var b=d.querySelector('.q');b.addEventListener('click',function(){toggle(i)});
b.addEventListener('keydown',function(e){var k=e.key,n=-1;if(k==='ArrowDown')n=(i+1)%A.length;else if(k==='ArrowUp')n=(i-1+A.length)%A.length;else if(k==='Home')n=0;else if(k==='End')n=A.length-1;if(n>-1){e.preventDefault();items[n].querySelector('.q').focus()}});
items.push(d);list.appendChild(d)});
function toggle(i){var was=open===i;items.forEach(function(d,k){var on=k===i&&!was;d.classList.toggle('open',on);d.querySelector('.q').setAttribute('aria-expanded',on)});open=was?-1:i}
toggle(1);
})();
</script></body></html>
