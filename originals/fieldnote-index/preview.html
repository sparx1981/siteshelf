<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldnote Index — Blog</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:wght@400;500;600&display=swap" rel="stylesheet"><style>[hidden]{display:none!important}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed}input,select,textarea{max-width:100%;min-width:0}button{min-height:44px}svg{max-width:100%}h1,h2,h3,p{overflow-wrap:break-word}h1,h2{text-wrap:balance}fieldset{min-width:0}label{display:block}a{color:inherit;text-underline-offset:4px}:focus-visible{outline:3px solid var(--focus);outline-offset:4px}::selection{background:var(--accent);color:var(--on)}input,textarea{caret-color:var(--accent)}.skip{position:fixed;top:12px;left:12px;z-index:99;padding:12px;background:var(--ink);color:var(--paper);transform:translateY(-200%)}.skip:focus{transform:none}.wrap{max-width:1260px;margin:auto;padding:28px 36px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:24px}.brand{font-weight:700}.top small{font-size:12px}.status{min-height:24px}.muted{color:var(--muted)}.btn{border:0;background:var(--accent);color:var(--on);padding:12px 22px;font-weight:700;border-radius:6px}.btn:hover{filter:brightness(.9)}.btn:active{transform:translateY(1px)}.secondary{border:1px solid var(--line);background:transparent;color:var(--ink)}.secondary:hover{background:var(--soft)}.foot{margin-top:36px;border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted)}dialog{color:var(--ink);background:var(--paper);border:0;border-radius:12px;padding:28px;max-width:min(560px,calc(100% - 32px));max-height:90dvh}dialog::backdrop{background:#101a28aa}dialog h2{margin-top:0}dialog .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.error{color:var(--error,#a42626)}@media(max-width:760px){.wrap{padding:20px 20px 32px}.top{align-items:flex-start}.top small{max-width:110px;text-align:right}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}body{--paper:#f5f2e9;--ink:#292f29;--muted:#62685a;--accent:#3c5840;--on:#fff;--line:#d5d3c4;--soft:#e1e7d3;--focus:#a24f23;background:var(--paper);color:var(--ink);font:400 14px/1.5 'DM Sans',sans-serif}.brand{font:500 30px 'Newsreader',serif}.top{border-bottom:1px solid var(--line)}h1{font:500 60px/1.05 'Newsreader',serif;margin:30px 0 26px;letter-spacing:-.03em}.filters{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:22px}.regions{display:flex;flex-wrap:wrap;gap:6px}.regions button{padding:8px 14px;border:1px solid var(--line);background:transparent;border-radius:2px}.regions button[aria-pressed=true]{background:#292f29;color:#f5f2e9}.search{max-width:300px;flex:1 1 230px}.search label{font-size:11px;color:var(--muted);margin-bottom:4px}.search input{width:100%;background:transparent;border:0;border-bottom:1px solid #858b7d;padding:9px 0}.journal{display:grid;grid-template-columns:290px minmax(0,1fr);gap:65px;margin-top:30px}.report{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:22px 0;background:transparent}.report strong{font:500 23px 'Newsreader',serif;display:block;margin:7px 0}.report small{color:var(--muted);font-size:11px}.report .index{font-size:11px;font-weight:600}.report[aria-pressed=true] strong{color:#3c5840;text-decoration:underline;text-underline-offset:5px}.report:hover{background:#e9ebdf}.reader{max-width:750px}.reader h2{font:500 38px/1.15 'Newsreader',serif;margin:10px 0 12px;letter-spacing:-.02em}.byline{color:var(--muted);font-size:12px}.transect{background:#e7e9dc;padding:18px;margin:24px 0}.transect svg{width:100%;height:90px;display:block}.transect figcaption{font-size:11px;color:#505a48;padding-top:8px}.passage{margin:22px 0 28px}.passage p{font:400 19px/1.7 'Newsreader',serif;max-width:66ch;margin:0 0 9px}.save-passage{background:transparent;border:0;border-bottom:1px solid #849473;padding:4px 0;color:#3c5840;font-size:12px;min-height:32px}.save-passage[aria-pressed=true]{font-weight:600}.notebook-header{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:22px}.notebook-header h2{font:500 25px 'Newsreader',serif;margin:0}.notebook-header button{font-size:12px;padding:7px 12px}.notebook{background:#e1e7d3;padding:22px;margin-top:14px}.note{padding:14px 0;border-bottom:1px solid #bec8ad}.note:first-child{padding-top:0}.note:last-child{border:0;padding-bottom:0}.note p{font:400 17px/1.6 'Newsreader',serif;margin:8px 0}.note strong{font-size:12px}.note button{border:0;background:transparent;color:#3c5840;padding:5px 0;font-size:12px;text-decoration:underline;min-height:34px}.empty{padding:26px 0}.empty h3{font:500 25px 'Newsreader',serif}.status{font-size:12px}@media(max-width:900px){.journal{gap:32px;grid-template-columns:230px minmax(0,1fr)}}@media(max-width:700px){h1{font-size:43px}.journal{grid-template-columns:minmax(0,1fr);gap:28px}.archive{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}.report{padding:16px 0}.report strong{font-size:21px}.reader h2{font-size:32px}.transect{margin:20px 0}.search{max-width:none}.notebook-header{align-items:flex-start}.notebook-header h2{font-size:23px}}</style></head><body><a class="skip" href="#main">Skip to content</a><div class="wrap"><header class="top"><span class="brand">Stillbank</span><small class="muted">A fictional field journal</small></header><main id="main"><h1>Notes from the edges.</h1><div class="filters"><div class="regions" aria-label="Report region"><button data-region="all" aria-pressed="true">All regions</button><button data-region="Fen" aria-pressed="false">Fen</button><button data-region="Ridge" aria-pressed="false">Ridge</button><button data-region="Estuary" aria-pressed="false">Estuary</button></div><div class="search"><label for="report-search">Search reports</label><input id="report-search" type="search" placeholder="Title or topic"></div></div><div class="journal"><aside><div class="archive" id="archive" aria-label="Report archive"></div><div class="empty" id="archive-empty" hidden><h3>No reports found</h3><p>Try another region or search.</p><button class="btn secondary" id="clear-reports">Clear filters</button></div></aside><article class="reader"><p class="byline" id="report-meta"></p><h2 id="report-title"></h2><figure class="transect"><svg id="transect" viewBox="0 0 620 90" role="img" aria-label="Fictional transect readings"></svg><figcaption id="transect-caption"></figcaption></figure><div id="passages"></div><div class="notebook-header"><h2>Your reading notebook</h2><button class="btn secondary" id="toggle-notebook" aria-expanded="true" aria-controls="notebook">Hide notebook</button></div><section class="notebook" id="notebook" aria-label="Saved passages"><div id="notes"></div></section></article></div><p class="status" id="journal-status" role="status"></p></main><footer class="foot">Stillbank is invented. Locations, measurements and observations are authored demonstration content.</footer></div><script>const $=s=>document.querySelector(s),reports=[{title:'When the reeds turn',region:'Fen',topic:'ecology',date:'12 May',time:'3 min',values:[24,31,28,42,36,48],unit:'Reed height, cm',text:['The reed bed changes first at its edges. A narrow strip of new green follows the shallow water, while last season’s stems remain upright farther in. From the path, the two generations look like a single field.','We measured six points along the bank and left the ground between them untouched. The shortest stems grew where the soil was driest; the tallest marked a small channel that still held water after midday.','The useful observation was a boundary, not a total. Returning to the same six points next week may tell us more than adding another hundred measurements today.']},{title:'Stones that hold heat',region:'Ridge',topic:'climate',date:'10 May',time:'4 min',values:[26,29,34,38,32,28],unit:'Surface temperature, °C',text:['By late afternoon, the ridge path feels warmer underfoot than the grass beside it. The pale stones catch the sun throughout the day and release it slowly when the shadow reaches the slope.','A shaded hollow and an exposed shelf sit only a few paces apart. Their surface readings differ enough to change where a walker might stop, and where a seedling might survive a dry week.','We marked the locations in the notebook rather than painting the stones. Small, repeatable observations should leave small traces.']},{title:'The quiet tide line',region:'Estuary',topic:'ecology',date:'8 May',time:'3 min',values:[12,22,27,19,31,24],unit:'Wrack depth, mm',text:['The newest tide line lies below the old one. It carries fine fragments of reed and a few empty shells, set down in a narrow seam that turns with the bank.','At six intervals we measured the depth of the loose material. A bend sheltered the thickest patch; a straight exposed reach held almost none. The shape of the shore did more work than the size of the tide.','By the next morning, footprints had broken the seam. The notebook preserves a moment without pretending that the edge will stay still.']},{title:'A path after rain',region:'Ridge',topic:'access',date:'6 May',time:'5 min',values:[8,14,11,24,19,12],unit:'Standing water, mm',text:['The path looked passable from the gate, but the lowest section held a long shallow pool. A person stepping around it would be pushed onto the soft verge.','We logged the water depth at each change in surface. The steepest slope drained quickly; the flat turn trapped enough water to make the route unreliable for a wheeled visitor.','An access note should describe the obstacle plainly. Calling the route scenic would not tell a visitor what they need to decide before setting out.']}];let region='all',selected=0,notes=[];try{const data=JSON.parse(localStorage.getItem('stillbank-notes-v1')||'[]');if(Array.isArray(data))notes=data.filter(n=>Number.isInteger(n.report)&&n.report>=0&&n.report<reports.length&&Number.isInteger(n.passage)&&n.passage>=0&&n.passage<3);}catch{}function archive(){const q=$('#report-search').value.trim().toLowerCase(),visible=reports.map((r,i)=>({...r,i})).filter(r=>(region==='all'||r.region===region)&&(r.title+' '+r.topic).toLowerCase().includes(q));$('#archive').innerHTML=visible.map(r=>'<button class="report" data-report="'+r.i+'" aria-pressed="'+(r.i===selected)+'"><span class="index">FIELD NOTE '+String(r.i+1).padStart(2,'0')+'</span><strong>'+r.title+'</strong><small>'+r.region+' · '+r.topic+' · '+r.time+'</small></button>').join('');$('#archive-empty').hidden=!!visible.length;}function saved(i){return notes.some(n=>n.report===selected&&n.passage===i);}function reader(){const r=reports[selected];$('#report-title').textContent=r.title;$('#report-meta').textContent=r.region+' / '+r.date+' 2026 / '+r.time+' read';$('#transect').innerHTML='<line x1="20" x2="600" y1="72" y2="72" stroke="#7b896b"/>'+r.values.map((v,i)=>'<rect x="'+(30+i*96)+'" y="'+(72-v)+'" width="45" height="'+v+'" fill="#70815b"/><text x="'+(52+i*96)+'" y="'+(64-v)+'" text-anchor="middle" fill="#292f29" font-size="11">'+v+'</text>').join('');$('#transect').setAttribute('aria-label',r.unit+': '+r.values.join(', ')+'. Fictional readings.');$('#transect-caption').textContent=r.unit+' · six survey points · illustrative measurements';$('#passages').innerHTML=r.text.map((t,i)=>'<section class="passage"><p>'+t+'</p><button class="save-passage" data-passage="'+i+'" aria-pressed="'+saved(i)+'">'+(saved(i)?'Saved':'Save this passage')+'</button></section>').join('');}function notebook(){const target=$('#notes');target.replaceChildren();if(!notes.length){const p=document.createElement('p');p.textContent='No saved passages yet. Save a passage from the report above.';target.append(p);return;}notes.forEach((n,i)=>{const div=document.createElement('div');div.className='note';const title=document.createElement('strong'),text=document.createElement('p'),remove=document.createElement('button');title.textContent=reports[n.report].title;text.textContent=reports[n.report].text[n.passage];remove.textContent='Remove passage';remove.dataset.remove=i;remove.setAttribute('aria-label','Remove passage from '+reports[n.report].title);div.append(title,text,remove);target.append(div);});}function persist(){try{localStorage.setItem('stillbank-notes-v1',JSON.stringify(notes));}catch{$('#journal-status').textContent+=' Browser storage unavailable; notes remain for this visit.';}}$('#archive').onclick=e=>{const b=e.target.closest('[data-report]');if(b){selected=Number(b.dataset.report);document.querySelectorAll('[data-report]').forEach(x=>x.setAttribute('aria-pressed',x===b));reader();$('#journal-status').textContent=reports[selected].title+' opened.';}};document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{region=b.dataset.region;document.querySelectorAll('[data-region]').forEach(x=>x.setAttribute('aria-pressed',x===b));archive();$('#journal-status').textContent='Region filter updated.';});$('#report-search').oninput=archive;$('#clear-reports').onclick=()=>{region='all';$('#report-search').value='';document.querySelectorAll('[data-region]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.region==='all'));archive();$('#report-search').focus();};$('#passages').onclick=e=>{const b=e.target.closest('[data-passage]');if(!b)return;const i=Number(b.dataset.passage);if(saved(i)){$('#journal-status').textContent='That passage is already saved.';return;}notes.push({report:selected,passage:i});b.textContent='Saved';b.setAttribute('aria-pressed','true');notebook();$('#journal-status').textContent='Passage saved to your notebook.';persist();};$('#notes').onclick=e=>{const b=e.target.closest('[data-remove]');if(b){notes.splice(Number(b.dataset.remove),1);notebook();reader();$('#journal-status').textContent='Passage removed.';persist();$('#toggle-notebook').focus();}};$('#toggle-notebook').onclick=()=>{$('#notebook').hidden=!$('#notebook').hidden;$('#toggle-notebook').setAttribute('aria-expanded',!$('#notebook').hidden);$('#toggle-notebook').textContent=$('#notebook').hidden?'Show notebook':'Hide notebook';};archive();reader();notebook();</script></body></html>
