<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orchard Footer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#f2b84b;--mut:rgba(238,240,228,.6);--ln:rgba(238,240,228,.16)}
*{box-sizing:border-box}
html,body{margin:0;font:400 16px/1.5 'DM Sans',system-ui,sans-serif}
.sp{min-height:60svh;background:#f4f1ea;color:#8d897c;display:grid;place-items:center;font:400 28px Gloock,serif}
footer{background:#1f2a1d;color:#eef0e4;overflow:hidden;padding-top:80px}
.in{max-width:1280px;margin:0 auto;padding:0 40px}
.tp{display:grid;grid-template-columns:1fr 1.1fr;gap:64px;padding-bottom:64px}
h2{font:400 clamp(32px,4vw,56px)/1.05 Gloock,serif;margin:0 0 16px}
.nl p{color:var(--mut);margin:0 0 24px;max-width:420px}
.fm{position:relative;max-width:460px}
.fm input{width:100%;height:56px;border-radius:28px;border:1px solid rgba(238,240,228,.3);background:rgba(255,255,255,.04);color:#eef0e4;padding:0 150px 0 24px;font:400 16px 'DM Sans'}
.fm input:focus{outline:2px solid var(--gold);outline-offset:2px;border-color:transparent}
.fm input::placeholder{color:var(--mut)}
.fm button{position:absolute;right:6px;top:6px;height:44px;border:0;border-radius:22px;background:var(--gold);color:#1f2a1d;font:600 15px 'DM Sans';padding:0 22px;cursor:pointer}
.er{color:var(--gold);font-size:14px;height:22px;margin-top:8px}
.ok{font:400 24px Gloock,serif;color:var(--gold)}
.lk{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.lk h3{font:600 12px 'DM Sans';letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 16px}
.lk a{display:table;position:relative;color:#eef0e4;text-decoration:none;padding:5px 0}
.lk a::after{content:'';position:absolute;left:0;bottom:3px;height:1px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.lk a:hover::after,.lk a:focus-visible::after{transform:scaleX(1)}
.lk a:focus-visible{outline:none}
.md{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-top:1px solid var(--ln);padding:24px 0;font-size:14px;color:var(--mut)}
.md .r{text-align:right;font-variant-numeric:tabular-nums}
.so{display:flex;gap:10px}
.so a{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;color:#eef0e4}
.so a:hover,.so a:focus-visible{border-color:var(--gold);color:var(--gold);outline:none}
.wm{font:400 clamp(80px,22vw,360px)/.8 Gloock,serif;letter-spacing:-.02em;color:#2c3b29;text-align:center;white-space:nowrap;height:calc(clamp(80px,22vw,360px)*.66);overflow:hidden;padding-top:8px;user-select:none}
.wm span{display:inline-block;transform:translateY(30%);opacity:0;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .6s}
.wm.on span{transform:none;opacity:1}
@media(max-width:900px){.tp{grid-template-columns:1fr;gap:40px}.lk{grid-template-columns:1fr 1fr}.md{grid-template-columns:1fr;gap:16px;text-align:center}.md .r{text-align:center}.so{justify-content:center}.in{padding:0 20px}footer{padding-top:56px}}
@media(prefers-reduced-motion:reduce){.wm span{transition:none;transform:none;opacity:1}.lk a::after{transition:none}}
</style></head><body>
<div class="sp">Scroll to the footer</div>
<footer><div class="in">
<div class="tp"><div class="nl"><h2>Good things, once a month.</h2><p>Seasonal recipes, new arrivals and the occasional apple fact. No spam, ever.</p>
<div id="fw"><form class="fm" id="fm" novalidate><input id="em" type="email" placeholder="you@example.com" aria-label="Email address"><button type="submit">Subscribe</button></form><div class="er" id="er" role="alert"></div></div></div>
<nav class="lk" aria-label="Footer">
<div><h3>Shop</h3><a href="#">Boxes</a><a href="#">Gifts</a><a href="#">Cider</a><a href="#">Gift cards</a></div>
<div><h3>Visit</h3><a href="#">Farm shop</a><a href="#">Cafe</a><a href="#">Pick your own</a><a href="#">Directions</a></div>
<div><h3>Company</h3><a href="#">About</a><a href="#">Journal</a><a href="#">Careers</a><a href="#">Press</a></div>
<div><h3>Help</h3><a href="#">Delivery</a><a href="#">Returns</a><a href="#">FAQ</a><a href="#">Contact</a></div></nav></div>
<div class="md"><div>© 2026 Orchard Farm Ltd</div>
<div class="so"><a href="#" aria-label="Instagram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r=".8" fill="currentColor"/></svg></a>
<a href="#" aria-label="TikTok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v11.500a3.500 3.500 0 1 1-3.500-3.500M14 3c.5 3 2.500 4.500 5 4.500"/></svg></a>
<a href="#" aria-label="YouTube"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.500" y="5.500" width="19" height="13" rx="4"/><path d="M10 9.500l5 2.500-5 2.500z" fill="currentColor"/></svg></a></div>
<div class="r" id="tm"></div></div></div>
<div class="wm" id="wm" aria-hidden="true"></div></footer>
<script>
const $=id=>document.getElementById(id);
$('wm').innerHTML='ORCHARD'.split('').map((c,i)=>'<span style="transition-delay:'+i*40+'ms">'+c+'</span>').join('');
if('IntersectionObserver' in window)new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){$('wm').classList.add('on');o.disconnect()}}),{threshold:.2}).observe(document.querySelector('footer'));else $('wm').classList.add('on');
function clock(){$('tm').textContent='Kent, UK · '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'})}
clock();setInterval(clock,30000);
$('fm').addEventListener('submit',e=>{e.preventDefault();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test($('em').value.trim())){$('er').textContent='Check that email';$('em').focus();return}
 $('fw').innerHTML='<div class="ok" role="status">Thank you, see you in the post.</div>'});
</script></body></html>
