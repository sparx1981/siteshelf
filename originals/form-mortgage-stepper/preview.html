<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mortgage Enquiry Steps — Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#faf7f1;color:#1d2a24;font:400 16px/1.55 'DM Sans',system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #1f6b4c;outline-offset:3px;border-radius:10px}
header{padding:18px clamp(18px,4vw,48px);font:600 22px Fraunces,serif;display:flex;align-items:center;gap:10px}header i{width:22px;height:20px;background:#1f6b4c;clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%)}
.w{max-width:720px;margin:0 auto;padding:6px 18px 70px}h1{font:600 clamp(34px,5vw,56px)/1.05 Fraunces,serif;letter-spacing:-.01em;margin:10px 0 8px}.sub{color:#5b6b62;margin:0 0 26px}
.rail{display:flex;margin-bottom:18px;padding:0;list-style:none}.rail li{flex:1;text-align:center;position:relative;font-size:13px;color:#5b6b62}
.rail li:not(:last-child):after{content:"";position:absolute;left:calc(50% + 20px);right:calc(-50% + 20px);top:17px;height:3px;background:#e6dfcf;border-radius:3px}.rail li.done:not(:last-child):after{background:#1f6b4c}
.rail b{display:grid;place-items:center;width:36px;height:36px;margin:0 auto 6px;border-radius:50%;background:#fff;border:2px solid #e6dfcf;font-weight:700;color:#5b6b62;transition:background .3s,border-color .3s,color .3s}
.rail li.cur b{border-color:#1f6b4c;color:#1f6b4c;box-shadow:0 0 0 4px rgba(31,107,76,.15)}.rail li.done b{background:#1f6b4c;border-color:#1f6b4c;color:#fff}.rail li.cur{color:#1d2a24;font-weight:700}
.card{background:#fff;border:1px solid #e6dfcf;border-radius:24px;padding:clamp(20px,4vw,36px);box-shadow:0 30px 60px -44px rgba(40,50,30,.6);overflow:hidden}
.step{animation:in .25s}@keyframes in{from{opacity:0;transform:translateX(20px)}}
.step h2{font:600 28px Fraunces,serif;margin:0 0 4px}.step>p{margin:0 0 20px;color:#5b6b62}
.f{margin-bottom:18px}.f label,.f legend{display:block;font-weight:700;font-size:14px;margin-bottom:6px;padding:0}.f fieldset{border:0;padding:0;margin:0}
.f input[type=text],.f input[type=email],.f input[type=tel],.f select{width:100%;font:16px 'DM Sans',sans-serif;padding:13px 14px;border:1.5px solid #d9d0bb;border-radius:12px;background:#fff;color:#1d2a24;transition:border-color .2s}
.f input:focus,.f select:focus{border-color:#1f6b4c}.f [aria-invalid=true]{border-color:#c0392b}.pre{position:relative}.pre span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:#5b6b62}.pre input{padding-left:30px!important}
.h{font-size:13px;color:#5b6b62;margin-top:5px}.er{font-size:13px;color:#c0392b;font-weight:500;margin-top:5px;min-height:0}
input[type=range]{width:100%;accent-color:#1f6b4c;height:30px;margin:0}
.ltv{display:flex;justify-content:space-between;background:#f3f8f4;border-radius:12px;padding:10px 14px;font-size:14px;margin-top:6px}.ltv b{color:#1f6b4c}
.opt{display:flex;gap:10px;flex-wrap:wrap}.opt label{flex:1 1 140px;display:flex;gap:10px;align-items:center;border:1.5px solid #d9d0bb;border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:500;margin:0;transition:border-color .2s,background .2s}.opt input{accent-color:#1f6b4c;width:18px;height:18px}.opt label:has(input:checked){border-color:#1f6b4c;background:#f1f8f3}.opt label:has(input:focus-visible){outline:3px solid #1f6b4c;outline-offset:2px}
.rv dl{margin:0;border:1px solid #efe8d6;border-radius:16px;overflow:hidden}.rv .g{padding:14px 16px;border-bottom:1px solid #efe8d6;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.rv .g:last-child{border:0}.rv dt{font:600 12px 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#5b6b62}.rv dd{margin:2px 0 0;font-weight:500}.rv a{align-self:start;color:#1f6b4c;font-weight:700;font-size:14px;cursor:pointer;background:none;border:0;text-decoration:underline;font-family:inherit}
.est{background:#1f6b4c;color:#fff;border-radius:16px;padding:16px 18px;margin:16px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.est b{font:600 30px Fraunces,serif}
.cs{display:flex;gap:10px;align-items:flex-start}.cs input{width:20px;height:20px;accent-color:#1f6b4c;margin-top:2px;flex:none}.cs label{font-weight:400;margin:0}
.btns{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.btn{font:700 16px 'DM Sans',sans-serif;padding:14px 28px;border-radius:99px;border:0;background:#1f6b4c;color:#fff;cursor:pointer;transition:transform .2s,background .2s}.btn:hover{transform:translateY(-2px);background:#26805c}.btn.g{background:transparent;color:#1d2a24;border:1.5px solid #d9d0bb}
.ok{text-align:center;padding:20px 0}.tick{width:84px;height:84px;margin:0 auto 16px}.tick circle{fill:none;stroke:#1f8a4c;stroke-width:5;stroke-dasharray:252;stroke-dashoffset:252;animation:dr .6s .1s forwards}.tick path{fill:none;stroke:#1f8a4c;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .4s .6s forwards}@keyframes dr{to{stroke-dashoffset:0}}
@media(max-width:560px){.rail li span{display:none}.rail li.cur span{display:block}.rail li{font-size:12px}.btns .btn{padding:13px 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tick circle,.tick path{stroke-dashoffset:0}}
</style></head><body>
<header><i></i>Hearth &amp; Key</header>
<main class="w"><h1>Find out what you could borrow.</h1><p class="sub">Four short steps. No credit check, and nothing is sent until you press the last button.</p>
<ol class="rail" id="rail" aria-label="Progress"></ol><form class="card" id="card" novalidate></form></main>
<script>
(function(){
var D={name:'',email:'',phone:'',value:'320000',dep:15,type:'House',ftb:'Yes',emp:'Employed',inc:'62000',term:25,consent:false},S=['About you','The property','Your income','Review'],cur=0,back=-1,card=document.getElementById('card'),rail=document.getElementById('rail'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var fmt=function(n){return Number(String(n).replace(/\D/g,'')||0).toLocaleString('en-GB')},num=function(s){return Number(String(s).replace(/\D/g,'')||0)};
function pay(){var L=num(D.value)*(1-D.dep/100),r=.046/12,n=D.term*12;return L*r/(1-Math.pow(1+r,-n))}
function drawRail(){rail.innerHTML=S.map(function(s,i){return'<li class="'+(i<cur?'done':'')+(i===cur?' cur':'')+'"'+(i===cur?' aria-current="step"':'')+'><b>'+(i<cur?'✓':i+1)+'</b><span>'+s+'</span></li>'}).join('')}
function F(id,l,inner,h){return'<div class="f"><label for="'+id+'">'+l+'</label>'+inner+(h?'<div class="h" id="'+id+'h">'+h+'</div>':'')+'<div class="er" id="'+id+'e" role="alert"></div></div>'}
function view(){drawRail();var h='';
if(cur===0)h='<h2>About you</h2><p>So we know who to call.</p>'+F('name','Full name','<input id="name" type="text" autocomplete="name" value="'+D.name+'">')+F('email','Email address','<input id="email" type="email" autocomplete="email" value="'+D.email+'">')+F('phone','Phone number','<input id="phone" type="tel" autocomplete="tel" value="'+D.phone+'">','UK mobile or landline, for example 07700 900123');
if(cur===1)h='<h2>The property</h2><p>Roughly is fine, you can change it later.</p>'+F('value','Property value','<div class="pre"><span>£</span><input id="value" type="text" inputmode="numeric" value="'+fmt(D.value)+'"></div>')+'<div class="f"><label for="dep">Deposit: <span id="dv"></span></label><input id="dep" type="range" min="5" max="60" value="'+D.dep+'"><div class="ltv" aria-live="polite" id="ltv"></div></div>'+F('type','Property type','<select id="type"><option>House</option><option>Flat</option><option>Bungalow</option></select>')+'<div class="f"><fieldset><legend>Are you a first-time buyer?</legend><div class="opt"><label><input type="radio" name="ftb" value="Yes"'+(D.ftb==='Yes'?' checked':'')+'> Yes</label><label><input type="radio" name="ftb" value="No"'+(D.ftb==='No'?' checked':'')+'> No</label></div></fieldset></div>';
if(cur===2)h='<h2>Your income</h2><p>Before tax, from all your jobs.</p><div class="f"><fieldset><legend>Employment status</legend><div class="opt">'+['Employed','Self-employed','Retired'].map(function(e){return'<label><input type="radio" name="emp" value="'+e+'"'+(D.emp===e?' checked':'')+'> '+e+'</label>'}).join('')+'</div></fieldset></div>'+F('inc','Gross annual income','<div class="pre"><span>£</span><input id="inc" type="text" inputmode="numeric" value="'+fmt(D.inc)+'"></div>')+'<div class="f"><label for="term">Mortgage term: <span id="tv"></span></label><input id="term" type="range" min="5" max="35" value="'+D.term+'"></div>';
if(cur===3)h='<h2>Review</h2><p>Check everything looks right.</p><div class="rv"><dl>'+[['About you',D.name+' · '+D.email+' · '+D.phone,0],['The property','£'+fmt(D.value)+' '+D.type.toLowerCase()+', '+D.dep+'% deposit, first-time buyer: '+D.ftb,1],['Your income',D.emp+', £'+fmt(D.inc)+' a year, '+D.term+' year term',2]].map(function(g){return'<div class="g"><div><dt>'+g[0]+'</dt><dd>'+g[1]+'</dd></div><button class="ed" type="button" data-s="'+g[2]+'">Edit</button></div>'}).join('')+'</dl></div><div class="est"><span>Estimated monthly payment<br><small style="opacity:.8">Repayment at 4.6%, illustrative only</small></span><b>£'+Math.round(pay()).toLocaleString('en-GB')+'</b></div><div class="f"><div class="cs"><input type="checkbox" id="consent"'+(D.consent?' checked':'')+'><label for="consent">I agree to Hearth &amp; Key contacting me about this enquiry.</label></div><div class="er" id="conse" role="alert"></div></div>';
h+='<div class="btns"><button type="button" class="btn g" id="bk"'+(cur===0?' style="visibility:hidden"':'')+'>Back</button><button type="submit" class="btn">'+(cur===3?'Send my enquiry':'Continue')+'</button></div>';
card.innerHTML='<div class="step">'+h+'</div>';if(reduce)card.firstChild.style.animation='none';
var v=document.getElementById('value'),inc=document.getElementById('inc');[v,inc].forEach(function(e){if(e)e.addEventListener('input',function(){var d=e.value.replace(/\D/g,'').slice(0,9);e.value=d?Number(d).toLocaleString('en-GB'):'';if(e===v)ltv()})});
var dep=document.getElementById('dep');if(dep){dep.addEventListener('input',function(){D.dep=+dep.value;ltv()});ltv()}
var term=document.getElementById('term');if(term){term.addEventListener('input',function(){D.term=+term.value;document.getElementById('tv').textContent=D.term+' years'});document.getElementById('tv').textContent=D.term+' years'}
var ty=document.getElementById('type');if(ty)ty.value=D.type;
document.getElementById('bk').addEventListener('click',function(){save();cur--;view()});
card.querySelectorAll('.ed').forEach(function(b){b.addEventListener('click',function(){back=3;cur=+b.dataset.s;view()})})}
function ltv(){var v=num(document.getElementById('value').value),dp=+document.getElementById('dep').value;document.getElementById('dv').textContent=dp+'% (£'+Math.round(v*dp/100).toLocaleString('en-GB')+')';document.getElementById('ltv').innerHTML='<span>Loan £'+Math.round(v*(1-dp/100)).toLocaleString('en-GB')+'</span><span>LTV <b>'+(100-dp)+'%</b></span>'}
function save(){var g=function(id){var e=document.getElementById(id);return e?e.value:null};if(cur===0){D.name=g('name').trim();D.email=g('email').trim();D.phone=g('phone').trim()}if(cur===1){D.value=String(num(g('value')));D.type=g('type');var r=card.querySelector('[name=ftb]:checked');D.ftb=r?r.value:'Yes'}if(cur===2){D.inc=String(num(g('inc')));var r2=card.querySelector('[name=emp]:checked');D.emp=r2?r2.value:'Employed'}if(cur===3){D.consent=document.getElementById('consent').checked}}
function bad(id,msg){var e=document.getElementById(id),er=document.getElementById(id+'e');if(e){e.setAttribute('aria-invalid','true');e.setAttribute('aria-describedby',id+'e')}er.textContent=msg;return e}
function validate(){var errs=[],g=function(id){return document.getElementById(id).value.trim()};card.querySelectorAll('[aria-invalid]').forEach(function(e){e.removeAttribute('aria-invalid')});card.querySelectorAll('.er').forEach(function(e){e.textContent=''});
if(cur===0){if(g('name').split(/\s+/).length<2||g('name').length<4)errs.push(bad('name','Please enter your first and last name.'));if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(g('email')))errs.push(bad('email','Enter a valid email, like name@example.com.'));if(!/^(\+44|0)[\d\s]{9,12}$/.test(g('phone')))errs.push(bad('phone','Enter a UK phone number, like 07700 900123.'))}
if(cur===1){var v=num(g('value'));if(v<50000||v>5000000)errs.push(bad('value','Enter a value between £50,000 and £5,000,000.'))}
if(cur===2){var i=num(g('inc'));if(i<10000)errs.push(bad('inc','Enter your gross annual income, at least £10,000.'))}
if(cur===3&&!document.getElementById('consent').checked){document.getElementById('conse').textContent='Please tick to let us contact you.';errs.push(document.getElementById('consent'))}
if(errs.length){errs[0].focus();return false}return true}
card.addEventListener('submit',function(e){e.preventDefault();if(!validate())return;save();if(cur<3){cur=back===3?3:cur+1;back=-1;view();return}
card.innerHTML='<div class="ok"><svg class="tick" viewBox="0 0 90 90" aria-hidden="true"><circle cx="45" cy="45" r="40"/><path d="M28 47l12 12 23-26"/></svg><h2 style="font:600 30px Fraunces,serif;margin:0 0 6px" tabindex="-1" id="th">Thanks, '+D.name.split(' ')[0]+'.</h2><p>A broker will call you within one working day.</p><p style="color:#5b6b62">Your estimated payment: <b>£'+Math.round(pay()).toLocaleString('en-GB')+' a month</b></p></div>';document.getElementById('th').focus();rail.innerHTML=S.map(function(s,i){return'<li class="done"><b>✓</b><span>'+s+'</span></li>'}).join('')});
view();
})();
</script></body></html>
