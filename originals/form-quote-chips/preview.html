<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quote Request Chips — Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(#d9d0f5 1px,transparent 1.5px) 0 0/22px 22px,#f4f0ff;color:#1a1530;font:400 16px/1.55 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #6c3cff;outline-offset:3px;box-shadow:0 0 0 6px #fff;border-radius:14px}
header{display:flex;align-items:center;padding:18px clamp(18px,4vw,48px);font:800 22px Epilogue,sans-serif;gap:10px}header i{width:22px;height:22px;background:#6c3cff;border:2.5px solid #1a1530;border-radius:50% 50% 50% 0;box-shadow:2px 2px 0 #1a1530}
.w{max-width:1160px;margin:0 auto;padding:0 clamp(18px,4vw,40px) 80px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
h1{grid-column:1/-1;font:800 clamp(36px,6vw,64px)/1 Epilogue,sans-serif;letter-spacing:-.03em;margin:6px 0 4px}h1 span{background:linear-gradient(transparent 62%,#f5e642 62%)}
.sec{background:#fff;border:2px solid #1a1530;border-radius:20px;box-shadow:5px 5px 0 #1a1530;padding:22px;margin-bottom:18px}
.sec h2{font:800 19px Epilogue,sans-serif;margin:0 0 14px;display:flex;align-items:center;gap:10px}.sec h2 i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#6c3cff;color:#fff;font:800 14px Epilogue,sans-serif;font-style:normal;border:2px solid #1a1530}
.ch{display:flex;gap:8px;flex-wrap:wrap}.ch button{position:relative;font:700 15px Epilogue,sans-serif;border:2px solid #1a1530;background:#fff;border-radius:99px;padding:9px 18px;cursor:pointer;color:#1a1530;transition:background .15s,transform .15s}
.ch button:hover{background:#f4f0ff}.ch button[aria-pressed=true]{background:#f5e642;animation:pp .3s}@keyframes pp{50%{transform:scale(1.08)}}
.ch.big button{padding:13px 22px;font-size:16px}.ch button em{font:600 11px Inter,sans-serif;font-style:normal;color:#5a5278;margin-left:6px}
.rs{display:inline-block;background:#ff7a66;color:#2a0b05;font:700 10px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
.bw{position:relative;padding-top:34px}.bub{position:absolute;top:0;transform:translateX(-50%);background:#1a1530;color:#fff;font:700 14px Epilogue,sans-serif;padding:4px 12px;border-radius:99px;white-space:nowrap}
input[type=range]{width:100%;accent-color:#6c3cff;height:30px;margin:0}.rl{display:flex;justify-content:space-between;font-size:12px;color:#5a5278}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.f label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}.f input{width:100%;font:16px Inter,sans-serif;padding:12px 14px;border:2px solid #1a1530;border-radius:14px;background:#fff;color:#1a1530}.f [aria-invalid=true]{border-color:#d03a3a}.er{color:#c22;font-size:13px;margin-top:4px}
.brief{position:sticky;top:16px;background:#1a1530;color:#f4f0ff;border-radius:22px;padding:24px;box-shadow:5px 5px 0 #6c3cff}.brief h2{font:800 16px Epilogue,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#bda9ff;margin:0 0 12px}
.br{font:600 20px/1.6 Epilogue,sans-serif;margin:0 0 18px}.br mark{background:#f5e642;color:#1a1530;border-radius:6px;padding:0 6px}.br .ph{color:#8f87b8;font-weight:600}
.est{background:rgba(255,255,255,.08);border-radius:16px;padding:14px 16px;margin-bottom:16px}.est small{font:600 11px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#bda9ff}.est b{display:block;font:800 30px Epilogue,sans-serif;font-variant-numeric:tabular-nums}.est span{font-size:14px;font-weight:600}.est .ok{color:#7ff0c0}.est .no{color:#ff9d8f}
.bt{display:flex;gap:10px;flex-wrap:wrap}.btn{font:800 16px Epilogue,sans-serif;border:2px solid #1a1530;background:#f5e642;color:#1a1530;border-radius:99px;padding:12px 24px;cursor:pointer;box-shadow:3px 3px 0 #f4f0ff;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #f4f0ff}.btn.o{background:transparent;color:#f4f0ff;border-color:#f4f0ff;box-shadow:none}
.ty{grid-column:1/-1;background:#fff;border:2px solid #1a1530;border-radius:22px;box-shadow:6px 6px 0 #1a1530;padding:36px;text-align:center;max-width:720px;margin:0 auto}.ty h2{font:800 36px Epilogue,sans-serif;margin:0 0 10px}.ty .br{color:#1a1530;font-size:18px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:960px){.w{grid-template-columns:minmax(0,1fr)}.brief{position:static}}@media(max-width:520px){.g2{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><i></i>Fieldwork Creative</header>
<main class="w" id="main"><h1>Tell us what <span>you're making.</span></h1>
<form id="f" novalidate><section class="sec"><h2><i>1</i>What are we making?</h2><div class="ch big" id="ty" role="group" aria-label="Project type"></div><div class="er" id="tye"></div></section>
<section class="sec"><h2><i>2</i>What do you need?</h2><div class="ch" id="dl" role="group" aria-label="Deliverables"></div><div class="h" id="dh" style="font-size:13px;color:#5a5278;margin-top:8px">Choose a project type first.</div></section>
<section class="sec"><h2><i>3</i>When do you need it?</h2><div class="ch" id="tm" role="group" aria-label="Timeline"></div></section>
<section class="sec"><h2><i>4</i>Budget</h2><div class="bw"><div class="bub" id="bb">£25k</div><label class="vh" for="bg">Budget in thousands of pounds</label><input id="bg" type="range" min="5" max="100" step="1" value="25"><div class="rl"><span>£5k</span><span>£100k</span></div></div></section>
<section class="sec"><h2><i>5</i>Who are you?</h2><div class="g2"><div class="f"><label for="nm">Your name</label><input id="nm" autocomplete="name"><div class="er" id="nme"></div></div><div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="email"><div class="er" id="eme"></div></div></div></section></form>
<aside class="brief" aria-label="Your brief"><h2>Your brief</h2><p class="br" id="br" aria-live="polite"></p><div class="est"><small>Estimate</small><b id="es">£0</b><span id="ft"></span></div><div class="bt"><button class="btn o" type="button" id="cp">Copy brief</button><button class="btn" type="submit" form="f" id="sd">Send request</button></div><div class="vh" id="lv" aria-live="polite"></div></aside></main>
<script>
(function(){
var TY={'Brand identity':[8,['Logo','Guidelines','Naming','Illustration','Stationery','Motion']],'Website':[12,['Design','Development','CMS setup','Copywriting','Photography','SEO']],'Mobile app':[28,['UX research','UI design','iOS build','Android build','Backend','Testing']],'Campaign':[15,['Strategy','Film','Social assets','Print','Media buying','Reporting']],'Packaging':[9,['Structural design','Artwork','Print management','Mock-ups','Photography','Sustainability audit']]};
var PR={0:1.5,1:2,2:2.5,3:3,4:3.5,5:4},TM=[['Rush: 2 weeks',2,1.25,1],['Standard: 6 weeks',6,1,0],['Relaxed: 12 weeks',12,.9,0]],ty='',dl={},tm=1,bg=25,nm=document.getElementById('nm'),em=document.getElementById('em'),lv=document.getElementById('lv');
var tyE=document.getElementById('ty'),dlE=document.getElementById('dl'),tmE=document.getElementById('tm');
Object.keys(TY).forEach(function(k){var b=document.createElement('button');b.type='button';b.textContent=k;b.setAttribute('aria-pressed','false');b.addEventListener('click',function(){if(ty!==k){var had=Object.keys(dl).some(function(x){return dl[x]});ty=k;dl={};if(had)lv.textContent='Deliverables reset for '+k+'.'}else{}render()});tyE.appendChild(b)});
TM.forEach(function(t,i){var b=document.createElement('button');b.type='button';b.innerHTML=t[0]+(t[3]?'<span class="rs">Rush</span>':'')+'<em>'+(t[2]>1?'+25%':t[2]<1?'-10%':'')+'</em>';b.setAttribute('aria-pressed',i===tm);b.addEventListener('click',function(){tm=i;render()});tmE.appendChild(b)});
document.getElementById('bg').addEventListener('input',function(e){bg=+e.target.value;render()});[nm,em].forEach(function(e){e.addEventListener('input',render)});
function render(){[].forEach.call(tyE.children,function(b){b.setAttribute('aria-pressed',b.textContent===ty)});dlE.innerHTML='';
if(ty){TY[ty][1].forEach(function(d,i){var b=document.createElement('button');b.type='button';b.innerHTML=d+'<em>+£'+PR[i]+'k</em>';b.setAttribute('aria-pressed',!!dl[d]);b.addEventListener('click',function(){dl[d]=!dl[d];render()});dlE.appendChild(b)});document.getElementById('dh').textContent='Pick as many as you need.'}else document.getElementById('dh').textContent='Choose a project type first.';
[].forEach.call(tmE.children,function(b,i){b.setAttribute('aria-pressed',i===tm)});
var pct=(bg-5)/95;document.getElementById('bb').style.left='calc('+(pct*100)+'% + '+(8-pct*16)+'px)';document.getElementById('bb').textContent='£'+bg+'k';
var chosen=ty?TY[ty][1].filter(function(d){return dl[d]}):[],name=nm.value.trim();
var parts=[name?'<mark>'+name.replace(/</g,'&lt;')+'</mark>':'<span class="ph">…</span>',ty?'<mark>'+ty.toLowerCase().replace(/^(?=[aeiou])/,'')+'</mark>':'<span class="ph">…</span>',chosen.length?'<mark>'+chosen.join(', ').toLowerCase()+'</mark>':'<span class="ph">…</span>','<mark>'+TM[tm][1]+'</mark>','<mark>£'+bg+'k</mark>'];
var art=ty==='Brand identity'?'a ':ty==='Mobile app'?'a ':'a ';
document.getElementById('br').innerHTML='Hi, I\'m '+parts[0]+'. I need '+art+parts[1]+' with '+parts[2]+' in about '+parts[3]+' weeks, with a budget around '+parts[4]+'.';
var base=ty?TY[ty][0]:0,add=0;if(ty)TY[ty][1].forEach(function(d,i){if(dl[d])add+=PR[i]});var tot=(base+add)*TM[tm][2],lo=Math.round(tot*.85),hi=Math.round(tot*1.15);
document.getElementById('es').textContent=ty?'£'+lo+'k to £'+hi+'k':'£0';var ft=document.getElementById('ft');if(!ty){ft.textContent='Pick a project type to see an estimate.';ft.className=''}else if(hi<=bg){ft.textContent='✓ Within your budget';ft.className='ok'}else if(lo>bg){ft.textContent='Above your budget by about £'+(Math.round((lo+hi)/2)-bg)+'k';ft.className='no'}else{ft.textContent='Close to your budget, we can scope it to fit';ft.className='ok'}}
render();
function brief(){return document.getElementById('br').textContent+' Estimate: '+document.getElementById('es').textContent+'.'}
document.getElementById('cp').addEventListener('click',function(){var b=this;try{navigator.clipboard.writeText(brief()).then(d,d)}catch(e){d()}function d(){b.textContent='Copied ✓';setTimeout(function(){b.textContent='Copy brief'},1500)}});
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var errs=[];['nm','em'].forEach(function(i){document.getElementById(i).removeAttribute('aria-invalid');document.getElementById(i+'e').textContent=''});document.getElementById('tye').textContent='';
if(!ty){document.getElementById('tye').textContent='Please choose what we are making.';errs.push(tyE.firstChild)}
if(nm.value.trim().length<2){nm.setAttribute('aria-invalid','true');document.getElementById('nme').textContent='Please tell us your name.';errs.push(nm)}
if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(em.value.trim())){em.setAttribute('aria-invalid','true');document.getElementById('eme').textContent='Enter a valid email.';errs.push(em)}
if(errs.length){errs[0].focus();return}var m=document.getElementById('main'),b=document.getElementById('br').innerHTML,est=document.getElementById('es').textContent;m.innerHTML='<section class="ty"><h2 tabindex="-1" id="th">Got it, thank you.</h2><p class="br">'+b+'</p><p><b>Estimate '+est+'.</b> We will reply to '+em.value.trim().replace(/</g,'')+' within one working day with questions and a proper quote.</p><button class="btn" type="button" onclick="location.reload()" style="box-shadow:3px 3px 0 #6c3cff;color:#1a1530">Start another brief</button></section>';document.getElementById('th').focus()});
})();
</script></body></html>
