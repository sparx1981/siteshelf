<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Film Contact Sheet — Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,rgba(255,90,40,.14),transparent 55%),#17110d;color:#efe6da;font:400 15px/1.55 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:4px}
.tb{padding:22px clamp(16px,4vw,48px) 8px}h1{font:400 clamp(40px,7vw,88px)/.95 'Instrument Serif',serif;margin:0 0 6px}.sub{color:#a89a8a;margin:0 0 16px;font:500 12px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
.tl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tl button{font:500 12px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;border:1px solid #4a3c31;background:#201813;color:#efe6da;border-radius:6px;padding:8px 14px;cursor:pointer}.tl button:hover{background:#2a2019}.tl button[aria-pressed=true]{background:#efe6da;color:#17110d;border-color:#efe6da}
.pens{display:flex;gap:6px;align-items:center;font:500 12px 'DM Mono',monospace;color:#a89a8a;letter-spacing:.08em;text-transform:uppercase}.pens button{width:26px;height:26px;border-radius:50%;padding:0;background:var(--c);border:2px solid #4a3c31}.pens button[aria-pressed=true]{border-color:#fff;background:var(--c);color:inherit;box-shadow:0 0 0 2px #17110d,0 0 0 4px #fff}
.ct{font:500 12px 'DM Mono',monospace;color:#e0884a;letter-spacing:.08em;margin-left:auto}
.sheet{margin:16px clamp(12px,3vw,40px) 60px;background:#0b0908;border:1px solid #2a201a;border-radius:6px;padding:clamp(12px,2.5vw,28px);box-shadow:0 40px 80px -30px #000}
.strip{position:relative;background:#1c1612;border-radius:4px;padding:30px 12px 34px;margin-bottom:18px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.strip:last-child{margin-bottom:0}
.strip:before,.strip:after{content:"";position:absolute;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,transparent 0 6px,#0b0908 6px 18px,transparent 18px 26px);background-size:26px 10px;-webkit-mask:linear-gradient(#000,#000);border-radius:2px}.strip:before{top:10px}.strip:after{bottom:10px}
.ep{position:absolute;left:14px;right:14px;top:1px;font:400 9px 'DM Mono',monospace;color:#e0884a;letter-spacing:.2em;white-space:nowrap;overflow:hidden;opacity:.85}
.fr{position:relative;display:block}.fb{all:unset;box-sizing:border-box;display:block;width:100%;aspect-ratio:3/2;position:relative;cursor:pointer;background:#222;overflow:visible}.fb:focus-visible{outline:3px solid #fff;outline-offset:3px}
.fb .im{position:absolute;inset:0;overflow:hidden;border-radius:1px;filter:grayscale(1) contrast(1.15) brightness(.95);transition:filter .6s}.dev .fb .im{filter:none}.fb svg{width:100%;height:100%;display:block}
.fb .mk{position:absolute;inset:-10% -8%;pointer-events:none;overflow:visible}.fb .mk path{fill:none;stroke:var(--pen);stroke-width:3;stroke-linecap:round;stroke-dasharray:var(--l);stroke-dashoffset:0;opacity:.95;filter:drop-shadow(0 0 1px rgba(0,0,0,.4))}.fb .mk.dr path{animation:dr .45s ease-out}@keyframes dr{from{stroke-dashoffset:var(--l)}}
.fn{display:flex;justify-content:space-between;font:400 10px 'DM Mono',monospace;color:#e0884a;margin-top:6px;letter-spacing:.08em}
.lp{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid #fff;color:#fff;font-size:14px;cursor:pointer;opacity:0;transition:opacity .2s;display:grid;place-items:center;z-index:2}.fr:hover .lp,.fr:focus-within .lp{opacity:1}.lp:focus-visible{outline:3px solid #fff}
.fr.gone{display:none}
dialog{border:0;border-radius:10px;padding:0;background:#0b0908;color:#efe6da;max-width:960px;width:calc(100% - 24px);overflow:hidden}dialog::backdrop{background:rgba(5,3,2,.88)}
.lb .im{aspect-ratio:3/2;background:#111}.lb .im svg{width:100%;height:100%;display:block;filter:grayscale(1) contrast(1.15)}.dev .lb .im svg{filter:none}.lb .bd{padding:16px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:end}.lb h3{font:400 30px 'Instrument Serif',serif;margin:0}.lb .ex{font:500 12px 'DM Mono',monospace;color:#e0884a;letter-spacing:.08em}.lb input{width:100%;font:15px Inter,sans-serif;padding:9px 12px;border:1px solid #4a3c31;border-radius:8px;background:#17110d;color:#efe6da;grid-column:1/-1}.lb .ac{display:flex;gap:8px;flex-wrap:wrap}.lb .ac button{font:500 12px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;border:1px solid #4a3c31;background:#201813;color:#efe6da;border-radius:6px;padding:8px 12px;cursor:pointer}.lb .ac button[aria-pressed=true]{background:#ff3b30;border-color:#ff3b30;color:#fff}.lb .x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:20px;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:800px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.fb .mk.dr path{animation:none}*{transition:none!important}}
</style></head><body>
<div class="tb"><h1>Contact sheet, roll 14</h1><p class="sub">Ilmar 400 · 18 frames · Marlowe harbour, October</p><div class="tl"><button type="button" id="dv" aria-pressed="false">Develop colour</button><button type="button" id="mm" aria-pressed="true">Mark mode</button><button type="button" id="fa" aria-pressed="false">Marked only</button><span class="pens" role="group" aria-label="Pen colour">Pen <button type="button" style="--c:#ff3b30" aria-label="Red pen" aria-pressed="true" data-c="#ff3b30"></button><button type="button" style="--c:#ffd60a" aria-label="Yellow pen" aria-pressed="false" data-c="#ffd60a"></button><button type="button" style="--c:#fff" aria-label="White pen" aria-pressed="false" data-c="#ffffff"></button></span><button type="button" id="cl">Clear marks</button><span class="ct" id="ct" aria-live="polite"></span></div></div>
<main class="sheet" id="sh"></main>
<dialog id="dlg" aria-labelledby="lt"><div class="lb"><button class="x" id="dx" type="button" aria-label="Close">×</button><div class="im" id="li"></div><div class="bd"><div><h3 id="lt"></h3><div class="ex" id="le"></div></div><div class="ac"><button type="button" id="lpv">← Prev</button><button type="button" id="lm" aria-pressed="false">★ Mark</button><button type="button" id="lnx">Next →</button></div><label class="vh" for="cp">Caption</label><input id="cp" placeholder="Add a caption for this frame"></div></div></dialog>
<script>
(function(){
var PAL=[['#ff7a59','#ffd166','#1b1b3a'],['#2ec4b6','#cbf3f0','#ff9f1c'],['#6a4c93','#c8b6ff','#ffd6a5'],['#0b132b','#5bc0be','#f4f1de'],['#d62828','#f77f00','#eae2b7'],['#264653','#e9c46a','#f4a261']];
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
function art(i){var p=PAL[i%6],r=rng(i*71+5),k=i%5,s='<svg viewBox="0 0 150 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="150" height="100" fill="'+p[0]+'"/>';
if(k===0){s+='<circle cx="'+(40+r()*70)+'" cy="'+(28+r()*14)+'" r="'+(14+r()*10)+'" fill="'+p[1]+'"/><path d="M0 75Q40 '+(52+r()*14)+' 80 72T150 '+(62+r()*12)+'V100H0z" fill="'+p[2]+'"/>'}
else if(k===1){for(var a=0;a<5;a++)s+='<circle cx="'+(60+r()*40)+'" cy="55" r="'+(8+a*11)+'" fill="none" stroke="'+p[a%2?2:1]+'" stroke-width="'+(3+a)+'" opacity="'+(1-a*.12)+'"/>'}
else if(k===2){for(var b=0;b<7;b++)s+='<rect x="'+(r()*100)+'" y="'+(r()*70)+'" width="'+(20+r()*50)+'" height="'+(15+r()*40)+'" fill="'+p[1+b%2]+'" opacity="'+(.6+r()*.35)+'"/>'}
else if(k===3){for(var c=0;c<6;c++)s+='<path d="M-10 '+(14+c*16)+'Q40 '+(2+c*16+r()*16)+' 75 '+(14+c*16)+'T160 '+(14+c*16)+'V110H-10z" fill="'+p[1+c%2]+'" opacity="'+(.9-c*.1)+'"/>'}
else{s+='<rect x="0" y="62" width="150" height="38" fill="'+p[2]+'"/><rect x="'+(20+r()*60)+'" y="22" width="'+(30+r()*30)+'" height="40" fill="'+p[1]+'"/><path d="M0 62L'+(40+r()*30)+' 34 150 62z" fill="'+p[1]+'" opacity=".5"/>'}return s+'</svg>'}
var CAP=['Quay at dawn','Gulls, again','Net lofts','Harbour wall','Rope and rust','Fishmonger','Low tide','Lighthouse steps','Salt on glass','Ferry queue','Boat names','Slipway','Chandlery window','Stacked pots','Tea hut','Red door','Last light','Rain on the quay'];
var N=18,marks={},caps={},pen='#ff3b30',markMode=true,dev=false,only=false,sh=document.getElementById('sh'),frames=[],cur=-1,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,dlg=document.getElementById('dlg');
var num=function(i){return(Math.floor(i/2)+1)+(i%2?'A':'')};
function mkPath(i){var r=rng(i*37+11),pts=[],cx=50,cy=50,rx=52+r()*6,ry=50+r()*6,a0=r()*6.28;for(var k=0;k<=15;k++){var a=a0+k/14*6.28*1.12,rr=1+(r()-.5)*.1;pts.push([cx+Math.cos(a)*rx*rr,cy+Math.sin(a)*ry*rr])}return'M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('L')}
for(var s=0;s<3;s++){var st=document.createElement('div');st.className='strip';st.innerHTML='<div class="ep" aria-hidden="true">ILMAR 400 · '+(s*6+1)+'  '+(s*6+1)+'A  '+(s*6+2)+'  '+(s*6+2)+'A  '+(s*6+3)+'  '+(s*6+3)+'A · ILMAR 400</div>';
for(var j=0;j<6;j++)(function(i){var fr=document.createElement('div');fr.className='fr';fr.innerHTML='<button type="button" class="fb" aria-pressed="false"><span class="im">'+art(i)+'</span><svg class="mk" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" hidden><path d="'+mkPath(i)+'"/></svg></button><div class="fn"><span>'+num(i)+'</span><span>▸ '+('0'+(i+1)).slice(-2)+'</span></div><button type="button" class="lp" aria-label="Enlarge frame '+num(i)+'">⌕</button>';
var fb=fr.querySelector('.fb');fb.setAttribute('aria-label','Frame '+num(i)+', '+CAP[i]);fb.addEventListener('click',function(){if(markMode)toggle(i);else openL(i)});fb.addEventListener('keydown',function(e){var d={ArrowRight:1,ArrowLeft:-1,ArrowDown:6,ArrowUp:-6}[e.key];if(d){e.preventDefault();var v=vis(),k=v.indexOf(i),n=v[k+d];if(n!==undefined)frames[n].querySelector('.fb').focus()}else if(e.key==='m'||e.key==='M'){e.preventDefault();toggle(i)}else if(e.key==='Enter'){e.preventDefault();openL(i)}});fr.querySelector('.lp').addEventListener('click',function(){openL(i)});st.appendChild(fr);frames.push(fr)})(s*6+j);sh.appendChild(st)}
var strips=[].slice.call(sh.children);
function vis(){return frames.map(function(_,i){return i}).filter(function(i){return!frames[i].classList.contains('gone')})}
function paint(i,anim){var fr=frames[i],fb=fr.querySelector('.fb'),mk=fr.querySelector('.mk'),p=mk.firstChild,on=!!marks[i];fb.setAttribute('aria-pressed',on);fb.setAttribute('aria-label','Frame '+num(i)+', '+CAP[i]+(on?', marked':''));mk.hidden=!on;if(on){p.setAttribute('style','--pen:'+marks[i]);var L=p.getTotalLength?p.getTotalLength():400;mk.style.setProperty('--l',Math.ceil(L)+2);p.style.setProperty('--l',Math.ceil(L)+2);p.style.stroke=marks[i];mk.classList.remove('dr');if(anim&&!reduce){void mk.offsetWidth;mk.classList.add('dr')}}}
function toggle(i){if(!frames[i])return;if(marks[i])delete marks[i];else marks[i]=pen;paint(i,true);count();if(only)filt();document.getElementById('lm')&&cur===i&&lupe()}
function count(){document.getElementById('ct').textContent='Marked: '+Object.keys(marks).length+' of '+N}
function filt(){var first=frames.map(function(f){return f.classList.contains('gone')?null:f.getBoundingClientRect()});frames.forEach(function(f,i){f.classList.toggle('gone',only&&!marks[i])});if(!reduce)frames.forEach(function(f,i){if(f.classList.contains('gone'))return;var a=first[i],b=f.getBoundingClientRect();if(a&&(a.left!==b.left||a.top!==b.top))f.animate([{transform:'translate('+(a.left-b.left)+'px,'+(a.top-b.top)+'px)'},{transform:'none'}],{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'})});
/* compact strips: refill from visible frames */var v=vis();strips.forEach(function(s){while(s.querySelector('.fr'))s.removeChild(s.querySelector('.fr'))});strips.forEach(function(s,k){v.slice(k*6,k*6+6).forEach(function(i){s.appendChild(frames[i])})});frames.forEach(function(f,i){if(f.classList.contains('gone'))strips[0].appendChild(f)})}
function lupe(){var i=cur;if(!frames[i])return;document.getElementById('li').innerHTML=art(i);document.getElementById('lt').textContent='Frame '+num(i)+' · '+CAP[i];document.getElementById('le').textContent='f/5.6 · 1/'+[250,500,125,250,1000,60][i%6]+' · ISO 400';var m=document.getElementById('lm');m.setAttribute('aria-pressed',!!marks[i]);m.textContent=marks[i]?'★ Marked':'☆ Mark';document.getElementById('cp').value=caps[i]||''}
function openL(i){cur=i;lupe();dlg.showModal()}
function lstep(d){var v=vis();if(!v.length)return;var k=v.indexOf(cur);cur=v[(k+d+v.length)%v.length];lupe()}
document.getElementById('lpv').addEventListener('click',function(){lstep(-1)});document.getElementById('lnx').addEventListener('click',function(){lstep(1)});document.getElementById('lm').addEventListener('click',function(){if(!frames[cur])return;toggle(cur);lupe()});document.getElementById('cp').addEventListener('input',function(e){caps[cur]=e.target.value});document.getElementById('dx').addEventListener('click',function(){dlg.close()});dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});dlg.addEventListener('keydown',function(e){if(e.key==='ArrowRight')lstep(1);if(e.key==='ArrowLeft'&&e.target.tagName!=='INPUT')lstep(-1)});
dlg.addEventListener('close',function(){if(cur>=0)frames[cur].querySelector('.fb').focus()});
document.getElementById('dv').addEventListener('click',function(){dev=!dev;this.setAttribute('aria-pressed',dev);document.body.classList.toggle('dev',dev)});
document.getElementById('mm').addEventListener('click',function(){markMode=!markMode;this.setAttribute('aria-pressed',markMode)});
document.getElementById('fa').addEventListener('click',function(){only=!only;this.setAttribute('aria-pressed',only);filt()});
document.getElementById('cl').addEventListener('click',function(){Object.keys(marks).forEach(function(k){delete marks[k];paint(+k)});count();if(only)filt()});
document.querySelectorAll('.pens button').forEach(function(b){b.addEventListener('click',function(){pen=b.dataset.c;document.querySelectorAll('.pens button').forEach(function(x){x.setAttribute('aria-pressed',x===b)})})});
[2,5,8,11,14].forEach(function(i){marks[i]=['#ff3b30','#ff3b30','#ffd60a','#ff3b30','#fff'][[2,5,8,11,14].indexOf(i)]});frames.forEach(function(_,i){paint(i,false)});count();
})();
</script></body></html>
