<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grid To Detail Morph — Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#0e0e10;color:#f2f0eb;font:400 15px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}
:focus-visible{outline:3px solid #ffb45a;outline-offset:3px;border-radius:10px}
.tb{display:flex;align-items:center;gap:16px;padding:18px clamp(18px,4vw,48px);flex-wrap:wrap}.logo{font:400 26px 'Instrument Serif',serif;margin-right:auto}.chs{display:flex;gap:6px}.chs button{font:500 13px Inter,sans-serif;border:1px solid #34343b;background:transparent;color:#f2f0eb;border-radius:99px;padding:6px 14px;cursor:pointer}.chs button[aria-pressed=true]{background:#f2f0eb;color:#0e0e10;border-color:#f2f0eb}
.hd{padding:20px clamp(18px,4vw,48px) 20px;max-width:1300px;margin:0 auto}h1{font:400 clamp(44px,8vw,110px)/.95 'Instrument Serif',serif;letter-spacing:-.02em;margin:0 0 12px;max-width:12ch}h1 em{color:#ffb45a}.sub{color:#a3a09a;max-width:46ch;margin:0}
.gr{max-width:1300px;margin:0 auto;padding:10px clamp(18px,4vw,48px) 70px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.t{all:unset;box-sizing:border-box;position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;border:1px solid #26262b;cursor:pointer;display:block;transition:transform .25s,border-color .25s}.t:hover{transform:translateY(-4px);border-color:#4a4a52}.t:focus-visible{outline:3px solid #ffb45a;outline-offset:3px}
.t svg{width:100%;height:100%;display:block;transition:transform .5s}.t:hover svg{transform:scale(1.05)}.t .n{position:absolute;left:12px;top:10px;font:600 12px Inter,sans-serif;letter-spacing:.14em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}.t .ti{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72));font:400 21px 'Instrument Serif',serif}.t.h{visibility:hidden}.t.gone{display:none}
.sc{position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}.sc.on{opacity:1;pointer-events:auto}
.dt{position:fixed;inset:0;z-index:51;display:none;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;padding:5vh 5vw;align-items:center}.dt.on{display:grid}
.ph{height:min(78vh,720px);aspect-ratio:4/5;justify-self:center;position:relative}.art{position:absolute;inset:0;border-radius:14px;overflow:hidden;box-shadow:0 40px 80px -30px #000;will-change:transform}.art svg{width:100%;height:100%;display:block}
.mt{opacity:0;transform:translateY(14px);transition:opacity .3s .12s,transform .3s .12s;overflow:auto;max-height:84vh}.dt.in .mt{opacity:1;transform:none}
.mt .k{font:600 12px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#ffb45a}.mt h2{font:400 clamp(40px,5vw,64px)/1 'Instrument Serif',serif;margin:8px 0 6px}.mt .m{color:#a3a09a}.mt p{max-width:44ch}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;margin:14px 0;font-size:14px}.dl dt{color:#a3a09a}.dl dd{margin:0}
.ac{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}.bt{font:600 14px Inter,sans-serif;border:1px solid #4a4a52;background:transparent;color:#f2f0eb;border-radius:99px;padding:10px 18px;cursor:pointer;transition:background .2s}.bt:hover{background:rgba(255,255,255,.1)}.bt[aria-pressed=true]{background:#ffb45a;color:#1a1000;border-color:#ffb45a}.cn{margin-left:auto;font:600 14px Inter,sans-serif;color:#a3a09a;font-variant-numeric:tabular-nums}
.cl{position:absolute;top:18px;right:22px;width:46px;height:46px;border-radius:50%;border:1px solid #4a4a52;background:rgba(0,0,0,.4);color:#fff;font-size:22px;cursor:pointer;z-index:2}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1000px){.gr{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){.gr{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dt{grid-template-columns:minmax(0,1fr);overflow:auto;align-items:start;padding:70px 5vw 30px;gap:20px}.ph{height:auto;width:min(100%,380px);justify-self:center}.mt{max-height:none;overflow:visible}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="tb"><div class="logo">Frame by Frame</div><div class="chs" role="group" aria-label="Filter by palette" id="chs"></div></div>
<header class="hd"><h1>Twelve frames, <em>closely</em> looked at.</h1><p class="sub">Choose a frame and it opens into the room. Use the arrow keys to move between works.</p></header>
<main class="gr" id="gr"></main><div class="sc" id="sc"></div>
<section class="dt" id="dt" role="dialog" aria-modal="true" aria-labelledby="dtt"><button class="cl" id="cl" type="button" aria-label="Close detail">×</button><div class="ph" id="ph"></div><div class="mt" id="mt"><div class="k" id="k"></div><h2 id="dtt"></h2><div class="m" id="m"></div><dl class="dl" id="dl"></dl><p id="ds"></p><div class="ac"><button class="bt" id="wl" type="button" aria-pressed="false">♡ Add to wishlist</button><button class="bt" id="pv" type="button">← Prev</button><button class="bt" id="nx" type="button">Next →</button><span class="cn" id="cnt"></span></div></div></section><div class="vh" id="lv" aria-live="polite"></div>
<script>
(function(){
var PAL=[['#ff7a59','#ffd166','#1b1b3a','Warm'],['#2ec4b6','#cbf3f0','#ff9f1c','Cool'],['#6a4c93','#c8b6ff','#ffd6a5','Cool'],['#0b132b','#5bc0be','#f4f1de','Cool'],['#d62828','#f77f00','#eae2b7','Warm'],['#264653','#e9c46a','#f4a261','Warm'],['#111111','#8a8a8a','#f2f2f2','Mono'],['#2b2b2b','#d0d0d0','#6a6a6a','Mono']];
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
function art(i){var p=PAL[i%8],r=rng(i*113+9),k=i%4,s='<svg viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="250" fill="'+p[0]+'"/>';
if(k===0){s+='<circle cx="'+(60+r()*80)+'" cy="'+(70+r()*40)+'" r="'+(30+r()*20)+'" fill="'+p[1]+'"/><path d="M0 190Q60 '+(130+r()*30)+' 120 180T200 '+(160+r()*30)+'V250H0z" fill="'+p[2]+'"/><path d="M0 225Q70 185 140 220T200 205V250H0z" fill="'+p[1]+'" opacity=".5"/>'}
else if(k===1){for(var a=0;a<6;a++)s+='<circle cx="100" cy="140" r="'+(10+a*19)+'" fill="none" stroke="'+p[a%2?2:1]+'" stroke-width="'+(5+a*1.4)+'" opacity="'+(1-a*.1)+'"/>';s+='<rect width="200" height="80" fill="'+p[2]+'" opacity=".3"/>'}
else if(k===2){for(var b=0;b<9;b++)s+='<rect x="'+(r()*140)+'" y="'+(r()*190)+'" width="'+(30+r()*70)+'" height="'+(30+r()*70)+'" fill="'+p[1+b%2]+'" opacity="'+(.55+r()*.4)+'"/>';s+='<circle cx="'+(40+r()*120)+'" cy="'+(40+r()*60)+'" r="22" fill="'+p[2]+'"/>'}
else{for(var c=0;c<7;c++)s+='<path d="M-10 '+(36+c*32)+'Q50 '+(8+c*32+r()*30)+' 100 '+(36+c*32)+'T210 '+(36+c*32)+'V260H-10z" fill="'+p[1+c%2]+'" opacity="'+(.9-c*.1)+'"/>';s+='<circle cx="150" cy="46" r="20" fill="'+p[2]+'"/>'}return s+'</svg>'}
var TT=['Slow Morning','Tidewater Study','Hill and Moon','Quiet Arithmetic','Ember Field','Paper Harbour','Salt and Silver','Folded Light','Orchard at Noon','Low Sun','Blue Interval','Last Lantern'],AR=['Mara Quill','Idris Calloway','Noor Hashemi','Joss Ferreira','Iris Tanaka','Callum Rees'],MD=['Gouache on panel','Screenprint','Oil on linen','Cut paper collage','Risograph print','Acrylic on board'],DS=['A quiet composition built from three colours and a lot of patience.','Made over one winter in a small coastal studio, this piece rewards a slow look.','The artist layers thin washes until the colours begin to hum.'];
var gr=document.getElementById('gr'),tiles=[],cur=-1,fl='All',wl={},reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,open=false,lastTile=null;
var N=12;for(var i=0;i<N;i++)(function(i){var t=document.createElement('button');t.type='button';t.className='t';t.dataset.f=PAL[i%8][3];t.setAttribute('aria-label',TT[i]+' by '+AR[i%6]+', frame '+(i+1));t.innerHTML=art(i)+'<span class="n">'+('0'+(i+1)).slice(-2)+'</span><span class="ti">'+TT[i]+'</span>';t.addEventListener('click',function(){openD(i)});gr.appendChild(t);tiles.push(t)})(i);
var chs=document.getElementById('chs');['All','Warm','Cool','Mono'].forEach(function(f){var b=document.createElement('button');b.type='button';b.textContent=f;b.setAttribute('aria-pressed',f==='All');b.addEventListener('click',function(){fl=f;[].forEach.call(chs.children,function(x){x.setAttribute('aria-pressed',x===b)});filt()});chs.appendChild(b)});
function filt(){var first=tiles.map(function(t){return t.classList.contains('gone')?null:t.getBoundingClientRect()});tiles.forEach(function(t){t.classList.toggle('gone',fl!=='All'&&t.dataset.f!==fl)});if(!reduce)tiles.forEach(function(t,i){if(t.classList.contains('gone'))return;var a=first[i],b=t.getBoundingClientRect();if(!a){t.animate([{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],{duration:300});return}var dx=a.left-b.left,dy=a.top-b.top;if(dx||dy)t.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:300,easing:'cubic-bezier(.2,.8,.2,1)'})});document.getElementById('lv').textContent=tiles.filter(function(t){return!t.classList.contains('gone')}).length+' frames shown'}
var dt=document.getElementById('dt'),sc=document.getElementById('sc'),ph=document.getElementById('ph');
function vis(){return tiles.map(function(t,i){return i}).filter(function(i){return!tiles[i].classList.contains('gone')})}
function meta(i){document.getElementById('k').textContent='Frame '+('0'+(i+1)).slice(-2);document.getElementById('dtt').textContent=TT[i];document.getElementById('m').textContent=AR[i%6]+' · '+(2017+i%8);document.getElementById('dl').innerHTML='<dt>Medium</dt><dd>'+MD[i%6]+'</dd><dt>Size</dt><dd>'+(40+i*3)+' × '+(50+i*3)+' cm</dd><dt>Palette</dt><dd>'+PAL[i%8][3]+'</dd>';document.getElementById('ds').textContent=DS[i%3]+' Edition of '+(10+i)+', signed on the reverse.';var v=vis();document.getElementById('cnt').textContent=('0'+(v.indexOf(i)+1)).slice(-2)+' / '+('0'+v.length).slice(-2);var w=document.getElementById('wl');w.setAttribute('aria-pressed',!!wl[i]);w.textContent=(wl[i]?'♥ In your wishlist':'♡ Add to wishlist')}
function openD(i){cur=i;open=true;lastTile=tiles[i];var tr=tiles[i].getBoundingClientRect();document.body.classList.add('lock');sc.classList.add('on');dt.classList.add('on');ph.innerHTML='<div class="art">'+art(i)+'</div>';meta(i);var art_=ph.firstChild,fr=art_.getBoundingClientRect();
tiles[i].classList.add('h');if(!reduce){var sx=tr.width/fr.width,sy=tr.height/fr.height,dx=tr.left-fr.left,dy=tr.top-fr.top;art_.animate([{transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')',transformOrigin:'0 0'},{transform:'none',transformOrigin:'0 0'}],{duration:520,easing:'cubic-bezier(.2,.8,.2,1)'})}
requestAnimationFrame(function(){dt.classList.add('in')});document.getElementById('cl').focus();document.getElementById('lv').textContent='Opened '+TT[i]}
function closeD(){if(!open)return;open=false;var a=ph.firstChild,t=tiles[cur],tr=t.getBoundingClientRect(),fr=a.getBoundingClientRect();dt.classList.remove('in');sc.classList.remove('on');var done=function(){dt.classList.remove('on');ph.innerHTML='';t.classList.remove('h');document.body.classList.remove('lock');t.focus()};
if(!reduce&&!t.classList.contains('gone')){var sx=tr.width/fr.width,sy=tr.height/fr.height,dx=tr.left-fr.left,dy=tr.top-fr.top;var an=a.animate([{transform:'none',transformOrigin:'0 0'},{transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')',transformOrigin:'0 0'}],{duration:420,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'});an.onfinish=done}else done()}
function step(d){var v=vis(),k=v.indexOf(cur),n=v[(k+d+v.length)%v.length];if(n===cur)return;var old=ph.firstChild,na=document.createElement('div');na.className='art';na.innerHTML=art(n);tiles[cur].classList.remove('h');tiles[n].classList.add('h');cur=n;ph.appendChild(na);if(!reduce){old.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateX('+(-d*40)+'px)'}],{duration:240,fill:'forwards'}).onfinish=function(){old.remove()};na.animate([{opacity:0,transform:'translateX('+(d*40)+'px)'},{opacity:1,transform:'none'}],{duration:240})}else old.remove();meta(n);document.getElementById('lv').textContent=TT[n]}
document.getElementById('cl').addEventListener('click',closeD);sc.addEventListener('click',closeD);document.getElementById('pv').addEventListener('click',function(){step(-1)});document.getElementById('nx').addEventListener('click',function(){step(1)});
document.getElementById('wl').addEventListener('click',function(){wl[cur]=!wl[cur];meta(cur)});
document.addEventListener('keydown',function(e){if(!open)return;if(e.key==='Escape'){closeD()}else if(e.key==='ArrowRight'){step(1)}else if(e.key==='ArrowLeft'){step(-1)}else if(e.key==='Tab'){var f=[].slice.call(dt.querySelectorAll('button')).filter(function(x){return x.offsetParent!==null}),a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
})();
</script></body></html>
