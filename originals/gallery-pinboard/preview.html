<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draggable Pinboard — Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#1b2421;color:#e8f0ec;font:400 14px/1.5 'DM Sans',system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #2d6cdf;outline-offset:2px;box-shadow:0 0 0 6px #fff}
.tb{display:flex;align-items:center;gap:10px;padding:14px clamp(14px,3vw,36px);flex-wrap:wrap}.tt{all:unset;font:600 32px Caveat,cursive;margin-right:auto;cursor:text;border-bottom:2px dashed transparent}.tt:hover{border-bottom-color:#5c7168}.tt:focus-visible{outline:3px solid #2d6cdf;border-radius:6px}.ti{font:600 30px Caveat,cursive;background:#12191a;color:#e8f0ec;border:2px solid #2d6cdf;border-radius:8px;padding:0 10px}
.b{font:500 13px 'DM Sans',sans-serif;border:1.5px solid #3a4a44;background:#222e2a;color:#e8f0ec;border-radius:99px;padding:8px 14px;cursor:pointer;transition:background .2s}.b:hover{background:#2c3a35}.b[aria-pressed=true]{background:#e8f0ec;color:#1b2421;border-color:#e8f0ec}.cn{font-size:13px;color:#9fb2a9}
.fw{margin:0 clamp(10px,3vw,36px) 40px;border-radius:18px;background:#2d3a35;padding:10px;box-shadow:0 30px 60px -30px #000}
.bd{position:relative;overflow:hidden;border-radius:10px;background:radial-gradient(#c5d0ca 1px,transparent 1.5px) 0 0/24px 24px,#e7ece9;box-shadow:inset 0 4px 14px rgba(0,0,0,.25);max-width:1200px;margin:0 auto;touch-action:none}
.sc{position:absolute;left:0;top:0;width:1200px;height:760px;transform-origin:0 0}
.cd{position:absolute;color:#1d2622;cursor:grab;touch-action:none;user-select:none;transition:box-shadow .15s,transform .15s}.cd.dg{cursor:grabbing;transition:none;box-shadow:0 22px 34px -12px rgba(0,0,0,.5)!important;z-index:999!important}.cd.pk{outline:3px dashed #2d6cdf;outline-offset:4px}
.cd:focus-visible{outline:3px solid #2d6cdf;outline-offset:3px}
.pn{position:absolute;left:50%;top:-6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,transparent 40%),var(--p);box-shadow:0 3px 4px rgba(0,0,0,.35);z-index:2}
.pc{width:190px;background:#fff;padding:10px 10px 12px;box-shadow:0 8px 16px -8px rgba(0,0,0,.45)}.pc .im{aspect-ratio:1;overflow:hidden}.pc .im svg{width:100%;height:100%;display:block;pointer-events:none}.pc b{display:block;font:700 13px 'DM Sans',sans-serif;margin-top:8px}
.nt{width:170px;min-height:130px;padding:20px 16px 14px;font:600 24px/1.15 Caveat,cursive;box-shadow:0 8px 14px -8px rgba(0,0,0,.4);background:var(--bg)}.nt textarea{width:100%;height:96px;font:600 22px/1.15 Caveat,cursive;background:transparent;border:1px dashed #2d6cdf;border-radius:4px;resize:none;color:inherit}
.sw{width:130px;background:#fff;padding:8px;box-shadow:0 8px 14px -8px rgba(0,0,0,.4)}.sw i{display:block;height:70px;border-radius:2px}.sw b{display:block;font:500 12px 'DM Sans',sans-serif;margin-top:6px}
.ph{width:120px;background:#fff;padding:6px 6px 22px;box-shadow:0 8px 14px -8px rgba(0,0,0,.45)}.ph .im{aspect-ratio:1;overflow:hidden}.ph svg{width:100%;height:100%;display:block;pointer-events:none}
.rm{position:absolute;right:-8px;top:-8px;width:24px;height:24px;border-radius:50%;border:0;background:#1d2622;color:#fff;font-size:14px;cursor:pointer;opacity:0;z-index:3}.cd:hover .rm,.cd:focus-within .rm,.cd:focus-visible .rm{opacity:1}.rm:focus-visible{opacity:1}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);background:#e8f0ec;color:#1b2421;padding:10px 14px 10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:2000;display:flex;gap:12px;align-items:center}.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast button{background:none;border:0;font:700 14px 'DM Sans',sans-serif;color:#2d6cdf;cursor:pointer;text-decoration:underline}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="tb"><button class="tt" id="tt" type="button" aria-label="Edit board title">Seaside Cafe moodboard</button><button class="b" type="button" id="an">+ Note</button><button class="b" type="button" id="as">+ Swatch</button><button class="b" type="button" id="sn" aria-pressed="false">Snap to grid</button><button class="b" type="button" id="tu">Tidy up</button><button class="b" type="button" id="rs">Reset</button><span class="cn" id="cn"></span></div>
<div class="fw"><div class="bd" id="bd"><div class="sc" id="sc" role="application" aria-label="Pinboard. Move between cards with Tab, nudge with arrow keys."></div></div></div>
<div class="toast" id="toast" role="status"><span id="tm"></span><button type="button" id="un">Undo</button></div><div class="vh" id="lv" aria-live="polite"></div>
<script>
(function(){
var PAL=[['#ff7a59','#ffd166','#1b1b3a'],['#2ec4b6','#cbf3f0','#ff9f1c'],['#6a4c93','#c8b6ff','#ffd6a5'],['#0b132b','#5bc0be','#f4f1de'],['#d62828','#f77f00','#eae2b7'],['#264653','#e9c46a','#f4a261']];
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
function art(i){var p=PAL[i%6],r=rng(i*61+9),k=i%4,s='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="'+p[0]+'"/>';
if(k===0)s+='<circle cx="'+(30+r()*40)+'" cy="'+(30+r()*14)+'" r="'+(14+r()*8)+'" fill="'+p[1]+'"/><path d="M0 70Q30 '+(50+r()*10)+' 60 66T100 58V100H0z" fill="'+p[2]+'"/>';else if(k===1)for(var a=0;a<5;a++)s+='<circle cx="50" cy="55" r="'+(6+a*9)+'" fill="none" stroke="'+(a%2?p[2]:p[1])+'" stroke-width="'+(3+a)+'"/>';else if(k===2){for(var b=0;b<5;b++)s+='<rect x="'+(r()*60)+'" y="'+(r()*60)+'" width="'+(20+r()*34)+'" height="'+(20+r()*34)+'" fill="'+(b%2?p[1]:p[2])+'" opacity=".8"/>'}else{for(var c=0;c<5;c++)s+='<path d="M-5 '+(18+c*18)+'Q25 '+(8+c*18+r()*10)+' 50 '+(18+c*18)+'T105 '+(18+c*18)+'V110H-5z" fill="'+(c%2?p[1]:p[2])+'" opacity="'+(.9-c*.12)+'"/>'}return s+'</svg>'}
var START=[['art',0,'Tiled counter',60,60,-2],['note','Terrazzo floor?','#fff3b0',290,40,3],['art',1,'Pendant lights',470,70,2],['photo',2,'',700,50,-4],['note','Oat flat white, always','#ffd9d2',860,90,2],['swatch','#1f6b8f','Harbour blue',1030,40,-1],['art',3,'Blue door!',70,330,3],['note','Light from the east','#d4f0e2',300,350,-3],['art',4,'Menu board',480,330,-2],['swatch','#e8b86a','Crema',720,340,2],['photo',5,'',880,320,3],['note','Plants on every sill','#dbe5ff',1040,360,-2],['art',2,'Outdoor chairs',120,560,2],['art',5,'Cup shapes',420,560,-3]];
var sc=document.getElementById('sc'),bd=document.getElementById('bd'),KEY='pinboard-v1',cards=[],z=10,scale=1,snap=false,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,live=document.getElementById('lv'),del=null,tt0;
var PINS=['#e4482b','#2d6cdf','#1f9d63'];
function mk(d,i){var el=document.createElement('div');el.className='cd';el.tabIndex=0;el.setAttribute('role','group');el.dataset.k=d[0];var h='';
if(d[0]==='art')h='<div class="pc"><div class="im">'+art(d[1])+'</div><b>'+d[2]+'</b></div>';else if(d[0]==='note'){el.style.setProperty('--bg',d[2]);h='<div class="nt"><span class="tx">'+d[1].replace(/</g,'&lt;')+'</span></div>'}else if(d[0]==='swatch')h='<div class="sw"><i style="background:'+d[1]+'"></i><b>'+d[2]+'<br>'+d[1]+'</b></div>';else h='<div class="ph"><div class="im">'+art(d[1])+'</div></div>';
el.innerHTML='<span class="pn" style="--p:'+PINS[i%3]+'"></span>'+h+'<button class="rm" type="button" aria-label="Remove card" tabindex="-1">×</button>';
var lbl=d[0]==='note'?'Note: '+d[1]:d[0]==='swatch'?'Swatch: '+d[2]:d[0]==='art'?'Art: '+d[2]:'Photo';el.setAttribute('aria-label',lbl+'. Use arrow keys to move.');el.dataset.l=lbl.replace(/^[A-Za-z]+: /,'');
el.style.left=d[3]+'px';el.style.top=d[4]+'px';el.style.transform='rotate('+d[5]+'deg)';el.dataset.rot=d[5];el.style.zIndex=i+1;return el}
var cs=[];function build(list){sc.innerHTML='';cards=[];list.forEach(function(d,i){var el=mk(d,i);sc.appendChild(el);cards.push(el);wire(el)});count()}
function wire(el){var sx,sy,ox,oy,drag=false,picked=false;
el.addEventListener('pointerdown',function(e){if(e.target.closest('.rm')||e.target.tagName==='TEXTAREA')return;drag=true;el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=parseFloat(el.style.left);oy=parseFloat(el.style.top);el.style.zIndex=++z;el.classList.add('dg');el.focus({preventScroll:true})});
el.addEventListener('pointermove',function(e){if(!drag)return;var x=ox+(e.clientX-sx)/scale,y=oy+(e.clientY-sy)/scale;place(el,x,y,false);el.style.transform='rotate('+el.dataset.rot+'deg) scale(1.04)'});
['pointerup','pointercancel'].forEach(function(n){el.addEventListener(n,function(){if(!drag)return;drag=false;el.classList.remove('dg');el.style.transform='rotate('+el.dataset.rot+'deg)';if(snap)place(el,parseFloat(el.style.left),parseFloat(el.style.top),true);save();live.textContent='Dropped '+el.dataset.l})});
el.addEventListener('keydown',function(e){if(e.target.tagName==='TEXTAREA')return;var st=e.shiftKey?32:8,dx=0,dy=0;if(e.key==='ArrowLeft')dx=-st;else if(e.key==='ArrowRight')dx=st;else if(e.key==='ArrowUp')dy=-st;else if(e.key==='ArrowDown')dy=st;
if(dx||dy){e.preventDefault();place(el,parseFloat(el.style.left)+dx,parseFloat(el.style.top)+dy,snap);save();live.textContent='Moved '+el.dataset.l+' '+Math.abs(dx||dy)+' pixels '+(dx<0?'left':dx>0?'right':dy<0?'up':'down')}
else if(e.key==='Enter'){e.preventDefault();picked=!picked;el.classList.toggle('pk',picked);live.textContent=picked?'Picked up '+el.dataset.l+'. Use arrow keys to move, Enter to drop.':'Dropped '+el.dataset.l}
else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();remove(el)}else if(e.key===']'){el.style.zIndex=++z;save();live.textContent=el.dataset.l+' brought to front'}else if(e.key==='['){el.style.zIndex=1;save();live.textContent=el.dataset.l+' sent to back'}});
el.querySelector('.rm').addEventListener('click',function(){remove(el)});
if(el.dataset.k==='note')el.addEventListener('dblclick',function(){editNote(el)})}
function place(el,x,y,sn){var w=el.offsetWidth,h=el.offsetHeight;if(sn){x=Math.round(x/24)*24;y=Math.round(y/24)*24}x=Math.max(0,Math.min(1200-w,x));y=Math.max(0,Math.min(760-h,y));el.style.left=x+'px';el.style.top=y+'px'}
function editNote(el){var span=el.querySelector('.tx');if(!span)return;var ta=document.createElement('textarea');ta.value=span.textContent;ta.setAttribute('aria-label','Note text');span.replaceWith(ta);ta.focus();function done(){var s=document.createElement('span');s.className='tx';s.textContent=ta.value||'…';ta.replaceWith(s);el.dataset.l=s.textContent;el.setAttribute('aria-label','Note: '+s.textContent+'. Use arrow keys to move.');save();el.focus()}ta.addEventListener('blur',done);ta.addEventListener('keydown',function(e){if(e.key==='Escape'||(e.key==='Enter'&&!e.shiftKey)){e.preventDefault();ta.blur()}e.stopPropagation()})}
function remove(el){var d=ser(el),i=cards.indexOf(el);cards.splice(i,1);el.remove();del={d:d,i:i};count();save();say(el.dataset.l+' removed');var n=cards[Math.min(i,cards.length-1)];n&&n.focus()}
function ser(el){var k=el.dataset.k,o=[k];if(k==='art')o.push(+(el.querySelector('svg rect')&&0)||0,el.querySelector('b').textContent);else if(k==='note')o.push(el.querySelector('.tx')?el.querySelector('.tx').textContent:'',el.style.getPropertyValue('--bg'));else if(k==='swatch'){o.push(el.querySelector('i').style.background,el.querySelector('b').firstChild.textContent)}else o.push(0,'');o.push(parseFloat(el.style.left),parseFloat(el.style.top),+el.dataset.rot,+el.style.zIndex);o.svg=k==='art'||k==='photo'?el.querySelector('.im').innerHTML:null;return o}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cards.map(function(el){var d=ser(el);return{k:d[0],a:d[1],b:d[2],x:d[3],y:d[4],r:d[5],z:d[6],svg:d.svg,hex:el.querySelector('i')?el.querySelector('i').style.backgroundColor:null,pin:cards.indexOf(el)}}))) }catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s||!s.length)return false;sc.innerHTML='';cards=[];s.forEach(function(c,i){var d=c.k==='swatch'?['swatch',c.hex?rgb(c.hex):c.a,c.b,c.x,c.y,c.r]:c.k==='note'?['note',c.a,c.b,c.x,c.y,c.r]:[c.k,i%6,c.b,c.x,c.y,c.r],el=mk(d,i);if(c.svg&&el.querySelector('.im'))el.querySelector('.im').innerHTML=c.svg;el.style.zIndex=c.z||i+1;z=Math.max(z,c.z||0);sc.appendChild(el);cards.push(el);wire(el)});count();return true}catch(e){return false}}
function rgb(c){var m=c.match(/\d+/g);return m?'#'+m.slice(0,3).map(function(x){return('0'+(+x).toString(16)).slice(-2)}).join(''):c}
function count(){document.getElementById('cn').textContent=cards.length+' cards'}
var toast=document.getElementById('toast'),tt;function say(m){document.getElementById('tm').textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show')},5000)}
document.getElementById('un').addEventListener('click',function(){if(!del)return;var el=mk(del.d,del.i);if(del.d.svg&&el.querySelector('.im'))el.querySelector('.im').innerHTML=del.d.svg;sc.appendChild(el);cards.push(el);wire(el);del=null;toast.classList.remove('show');count();save();el.focus()});
function free(){var x=60+Math.random()*700,y=60+Math.random()*420;return[Math.round(x),Math.round(y)]}
document.getElementById('an').addEventListener('click',function(){var p=free(),el=mk(['note','Double-click to edit',['#fff3b0','#ffd9d2','#d4f0e2','#dbe5ff'][cards.length%4],p[0],p[1],Math.round(Math.random()*6-3)],cards.length);el.style.zIndex=++z;sc.appendChild(el);cards.push(el);wire(el);count();save();el.focus();live.textContent='Note added'});
document.getElementById('as').addEventListener('click',function(){var p=free(),cs=['#c4532f','#2f7a6b','#e0b030','#7a5c9e'],c=cs[cards.length%4],el=mk(['swatch',c,'New colour',p[0],p[1],Math.round(Math.random()*4-2)],cards.length);el.style.zIndex=++z;sc.appendChild(el);cards.push(el);wire(el);count();save();el.focus();live.textContent='Swatch added'});
var snB=document.getElementById('sn');snB.addEventListener('click',function(){snap=!snap;snB.setAttribute('aria-pressed',snap);if(snap){cards.forEach(function(c){place(c,parseFloat(c.style.left),parseFloat(c.style.top),true)});save()}});
document.getElementById('tu').addEventListener('click',function(){var x=24,y=24,rowH=0;cards.forEach(function(c){var w=c.offsetWidth,h=c.offsetHeight;if(x+w>1180){x=24;y+=rowH+24;rowH=0}if(!reduce){c.style.transition='left .5s,top .5s,transform .5s'}c.style.left=x+'px';c.style.top=y+'px';c.style.transform='rotate(0deg)';c.dataset.rot=0;x+=w+24;rowH=Math.max(rowH,h)});setTimeout(function(){cards.forEach(function(c){c.style.transition=''});save()},560);live.textContent='Cards tidied'});
document.getElementById('rs').addEventListener('click',function(){try{localStorage.removeItem(KEY)}catch(e){}build(START);live.textContent='Layout reset'});
var ttb=document.getElementById('tt');ttb.addEventListener('click',function(){var i=document.createElement('input');i.className='ti';i.value=ttb.textContent;i.setAttribute('aria-label','Board title');ttb.replaceWith(i);i.focus();i.select();function done(){ttb.textContent=i.value.trim()||'Seaside Cafe moodboard';i.replaceWith(ttb);ttb.focus()}i.addEventListener('blur',done);i.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();i.blur()}})});
function fit(){var w=bd.clientWidth;scale=Math.min(1,w/1200);sc.style.transform='scale('+scale+')';bd.style.height=(760*scale)+'px';sc.style.width='1200px'}
addEventListener('resize',fit);if(!load())build(START);fit();
})();
</script></body></html>
