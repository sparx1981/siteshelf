<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vertical Reel Gallery — Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0c0c0f;color:#fff;font:400 17px/1.55 Inter,system-ui,sans-serif;overflow:hidden}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #000;border-radius:10px}
.rl{height:100vh;height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none;outline:none}.rl::-webkit-scrollbar{display:none}
.p{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.bg{position:absolute;inset:0;transform:scale(1.08);transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}.p.active .bg{transform:none}.bg svg{width:100%;height:100%;display:block}
.p:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0,transparent 25%,transparent 45%,rgba(0,0,0,.82) 100%);pointer-events:none}
.nm{position:absolute;right:6vw;top:50%;transform:translateY(-50%);font:800 28vw/1 Syne,sans-serif;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.14);pointer-events:none;z-index:1}
.tx{position:absolute;left:max(6vw,env(safe-area-inset-left));right:6vw;bottom:max(9vh,env(safe-area-inset-bottom));z-index:2;max-width:900px}
.tx h2{margin:0 0 10px;font:800 clamp(44px,9vw,120px)/.95 Syne,sans-serif;letter-spacing:-.03em;text-transform:uppercase;display:flex;flex-wrap:wrap;gap:0 .25em}.tx h2 span{display:inline-block;opacity:0;transform:translateY(40px);transition:opacity .7s,transform .7s;transition-delay:calc(var(--i)*90ms)}.p.active h2 span{opacity:1;transform:none}
.tx .n{max-width:46ch;color:#d9d6e6;opacity:0;transition:opacity .5s .5s}.p.active .n{opacity:1}.tx .n b{display:block;font:500 12px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#fff;margin-bottom:4px}
.dt{margin-top:14px;font:500 13px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;border-bottom:1.5px solid #fff;color:#fff;padding:2px 0;cursor:pointer;opacity:0;transition:opacity .5s .7s}.p.active .dt{opacity:1}
.dr{position:absolute;left:0;right:0;bottom:0;background:rgba(12,12,15,.94);backdrop-filter:blur(10px);padding:26px max(6vw,16px) max(28px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .45s cubic-bezier(.3,1,.5,1);z-index:3}.dr.on{transform:none}.dr h3{font:800 24px Syne,sans-serif;margin:0 0 6px;text-transform:uppercase}.dr p{margin:0;color:#d9d6e6;max-width:56ch}.dr button{margin-top:12px;font:500 13px Inter,sans-serif;border:1px solid #fff;background:transparent;color:#fff;border-radius:99px;padding:7px 18px;cursor:pointer}
.ui{position:fixed;z-index:10;pointer-events:none}.ui *{pointer-events:auto}
.wm{left:max(6vw,16px);top:max(22px,env(safe-area-inset-top));font:800 15px Syne,sans-serif;letter-spacing:.24em}.ct{right:max(6vw,16px);top:max(20px,env(safe-area-inset-top));font:700 20px Syne,sans-serif;font-variant-numeric:tabular-nums}.ct span{opacity:.6}
.pr{right:max(2.5vw,10px);top:20%;bottom:20%;width:2px;background:rgba(255,255,255,.25)}.pr i{position:absolute;left:-1px;width:4px;height:24px;border-radius:3px;background:#fff;transition:top .3s}
.hn{left:max(6vw,16px);bottom:max(22px,env(safe-area-inset-bottom));font:500 12px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#d9d6e6;transition:opacity .4s}
.bt{right:max(6vw,16px);bottom:max(22px,env(safe-area-inset-bottom));display:flex;gap:8px}.bt button{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(0,0,0,.4);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}.bt button:hover{background:rgba(255,255,255,.2)}.bt button[aria-disabled=true]{opacity:.35}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:600px){.nm{font-size:44vw;right:-4vw}.tx{bottom:max(14vh,env(safe-area-inset-bottom))}.hn{display:none}.pr{display:none}}
@media(prefers-reduced-motion:reduce){.rl{scroll-behavior:auto}.bg{transform:none}.tx h2 span,.tx .n,.dt{opacity:1;transform:none}*{transition:none!important}}
</style></head><body>
<div class="ui wm" aria-hidden="true">NIGHT REEL</div><div class="ui ct"><b id="ci">01</b> <span>/ <span id="ctot">10</span></span></div><div class="ui pr" aria-hidden="true"><i id="th" style="top:0"></i></div><div class="ui hn" id="hn">Scroll, swipe or press ↓</div><div class="ui bt"><button type="button" id="up" aria-label="Previous panel" aria-disabled="true">↑</button><button type="button" id="dn" aria-label="Next panel">↓</button></div>
<main class="rl" id="rl" tabindex="0" aria-label="Photo reel. Use the arrow keys to move between panels."></main><div class="vh" id="lv" aria-live="polite"></div>
<script>
(function(){
var PAL=[['#ff6b6b','#ffd93d','#1b1b3a'],['#2ec4b6','#cbf3f0','#ff9f1c'],['#6a4c93','#c8b6ff','#ffd6a5'],['#0b132b','#5bc0be','#f4f1de'],['#d62828','#f77f00','#eae2b7'],['#264653','#e9c46a','#f4a261'],['#3d405b','#e07a5f','#f2cc8f'],['#06d6a0','#118ab2','#ffd166'],['#7b2cbf','#c77dff','#ffd6ff'],['#023047','#219ebc','#ffb703']];
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
function art(i){var p=PAL[i%10],r=rng(i*59+17),k=i%5,s='<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g'+i+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+p[0]+'"/><stop offset="1" stop-color="'+p[2]+'" stop-opacity=".55"/></linearGradient></defs><rect width="160" height="100" fill="url(#g'+i+')"/>';
if(k===0){s+='<circle cx="'+(40+r()*80)+'" cy="'+(26+r()*14)+'" r="'+(14+r()*10)+'" fill="'+p[1]+'"/><path d="M0 72Q40 '+(48+r()*14)+' 80 68T160 '+(58+r()*12)+'V100H0z" fill="'+p[2]+'"/><path d="M0 88Q50 70 100 86T160 78V100H0z" fill="'+p[1]+'" opacity=".4"/>'}
else if(k===1){for(var a=0;a<7;a++)s+='<circle cx="'+(60+r()*40)+'" cy="55" r="'+(7+a*10)+'" fill="none" stroke="'+p[a%2?2:1]+'" stroke-width="'+(2.5+a*.8)+'" opacity="'+(1-a*.1)+'"/>'}
else if(k===2){for(var b=0;b<8;b++)s+='<rect x="'+(r()*120)+'" y="'+(r()*70)+'" width="'+(20+r()*50)+'" height="'+(15+r()*40)+'" fill="'+p[1+b%2]+'" opacity="'+(.55+r()*.4)+'"/>'}
else if(k===3){for(var c=0;c<7;c++)s+='<path d="M-10 '+(10+c*14)+'Q40 '+(0+c*14+r()*14)+' 80 '+(10+c*14)+'T170 '+(10+c*14)+'V110H-10z" fill="'+p[1+c%2]+'" opacity="'+(.9-c*.1)+'"/>';s+='<circle cx="120" cy="22" r="10" fill="'+p[2]+'"/>'}
else{s+='<rect x="0" y="62" width="160" height="38" fill="'+p[2]+'"/>';for(var d=0;d<5;d++)s+='<rect x="'+(10+d*30)+'" y="'+(30+r()*20)+'" width="'+(18+r()*8)+'" height="'+(40-r()*10)+'" fill="'+p[1]+'" opacity="'+(.6+r()*.4)+'"/>'}return s+'</svg>'}
var D=[['Harbour Lights','Marlowe docks, 2024','Shot at dusk from the east pier, 35mm, handheld.'],['Salt Rings','Tidewater flats, 2023','A long exposure of the incoming tide, 4 minutes.'],['Brick and Sky','Kiln Street, 2024','Printed on cotton rag, edition of 12.'],['Slow Wave','Northgate bay, 2022','Made over three mornings with a borrowed tripod.'],['Red Hour','Ferry terminal, 2024','The last sunset before the winter timetable.'],['Pale Window','Old Mill, 2023','Natural light only, a very patient subject.'],['Night Ferry','Canal Basin, 2024','Taken from a moving boat, which was the point.'],['Green Room','Orchard Park, 2022','Shot on expired film, lightly pushed.'],['Violet Hour','Station Square, 2023','Neon and rain, eleven frames, one keeper.'],['Last Lantern','Lighthouse Road, 2024','The closing image from the series.']];
var rl=document.getElementById('rl'),P=[],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,cur=0,N=D.length;document.getElementById('ctot').textContent=N;
D.forEach(function(d,i){var s=document.createElement('section');s.className='p';s.setAttribute('aria-label',d[0]+', panel '+(i+1)+' of '+N);s.innerHTML='<div class="bg">'+art(i)+'</div><div class="nm" aria-hidden="true">'+('0'+(i+1)).slice(-2)+'</div><div class="tx"><h2 aria-label="'+d[0]+'">'+d[0].split(' ').map(function(w,k){return'<span style="--i:'+k+'" aria-hidden="true">'+w+'</span>'}).join('')+'</h2><div class="n"><b>'+d[1]+'</b>'+d[2].split('.')[0]+'.</div><button class="dt" type="button" aria-expanded="false">View details</button></div><div class="dr" role="region" aria-label="Details for '+d[0]+'"><h3>'+d[0]+'</h3><p>'+d[2]+' Part of the Night Reel collective archive.</p><button type="button">Close</button></div>';
var dt=s.querySelector('.dt'),dr=s.querySelector('.dr');dt.addEventListener('click',function(){dr.classList.add('on');dt.setAttribute('aria-expanded','true');dr.querySelector('button').focus()});dr.querySelector('button').addEventListener('click',function(){dr.classList.remove('on');dt.setAttribute('aria-expanded','false');dt.focus()});
rl.appendChild(s);P.push(s)});
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&e.intersectionRatio>=.6){var i=P.indexOf(e.target);P.forEach(function(p,k){p.classList.toggle('active',k===i);var dr=p.querySelector('.dr');if(k!==i){dr.classList.remove('on');p.querySelector('.dt').setAttribute('aria-expanded','false')}});cur=i;ui()}})},{root:rl,threshold:[.6]});P.forEach(function(p){io.observe(p)});P[0].classList.add('active');
var lt;function ui(){document.getElementById('ci').textContent=('0'+(cur+1)).slice(-2);document.getElementById('th').style.top='calc('+(cur/(N-1))+' * (100% - 24px))';document.getElementById('up').setAttribute('aria-disabled',cur===0);document.getElementById('dn').setAttribute('aria-disabled',cur===N-1);document.getElementById('hn').style.opacity=cur===0?1:0;clearTimeout(lt);lt=setTimeout(function(){document.getElementById('lv').textContent='Panel '+(cur+1)+' of '+N+': '+D[cur][0]},500)}
function go(i){i=Math.max(0,Math.min(N-1,i));P[i].scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})}
document.getElementById('up').addEventListener('click',function(){go(cur-1)});document.getElementById('dn').addEventListener('click',function(){go(cur+1)});
rl.addEventListener('keydown',function(e){if(e.target!==rl)return;var k=e.key;if(k==='ArrowDown'||k==='PageDown'||k===' '){e.preventDefault();go(cur+1)}else if(k==='ArrowUp'||k==='PageUp'){e.preventDefault();go(cur-1)}else if(k==='Home'){e.preventDefault();go(0)}else if(k==='End'){e.preventDefault();go(N-1)}});
rl.focus({preventScroll:true});ui();
})();
</script></body></html>
