<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hangman Words — Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#1f2a5a;color:#f6f0ff;font:400 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:hidden;position:relative}
.bgp{position:fixed;inset:0;z-index:0;pointer-events:none}.bgp svg{width:100%;height:100%;display:block}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #1b1640}
.w{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:20px 14px 36px}
.eb{font:700 12px Nunito;letter-spacing:.18em;text-transform:uppercase;color:#ffc247;margin:0 0 2px}
h1{font:600 clamp(32px,5vw,52px)/1 Fredoka,sans-serif;margin:0 0 14px}
.card{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;background:rgba(24,20,48,.82);border:1px solid #4a4488;border-radius:24px;padding:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card>*{min-width:0}
.sc{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:1px solid #3a3470}.sc svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.lv{display:flex;gap:6px;align-items:center;margin-top:8px;font-weight:700;color:#bdb2dc}
.lv svg{width:22px;height:26px}
.cat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cat button{font:600 14px Nunito;color:#f6f0ff;background:#2c2660;border:1.5px solid #5a54a0;border-radius:99px;min-height:44px;padding:0 14px;cursor:pointer}
.cat button[aria-pressed=true]{background:#ffc247;color:#2a1c00;border-color:#ffc247}
.wd{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.wd span{width:clamp(34px,6vw,50px);height:clamp(44px,8vw,60px);display:grid;place-items:center;border-bottom:4px solid #7a74c0;font:600 clamp(28px,5vw,44px) Fredoka,sans-serif;text-transform:uppercase}
.wd span.r{border-color:#7de0b0;animation:pp .25s}.wd span.h{width:20px;border:0}
@keyframes pp{50%{transform:scale(1.18)}}
.hint{text-align:center;color:#bdb2dc;margin:0 0 10px}
.kb{display:grid;gap:6px;margin-bottom:10px}.kr{display:flex;gap:5px;justify-content:center}
.k{flex:1;max-width:48px;min-width:0;height:48px;font:600 clamp(16px,3.4vw,22px) Fredoka,sans-serif;text-transform:uppercase;color:#f3ecff;background:#2c2660;border:1.5px solid #5a54a0;border-radius:10px;cursor:pointer;position:relative}
.k:hover:not([aria-disabled=true]){background:#3c3480}
.k.ok{background:#7de0b0;color:#06281a;border-color:#7de0b0}.k.ok:after{content:"\2713";position:absolute;right:3px;top:0;font:700 11px Nunito}
.k.no{background:#ff8a7a55;color:#ffd8d2;border-color:#ff8a7a;text-decoration:line-through}.k[aria-disabled=true]{cursor:default}
.kb.sh{animation:sh .25s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.act{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.act button{font:600 14px Nunito;color:#f6f0ff;background:transparent;border:1.5px solid #7a74c0;border-radius:12px;min-height:46px;padding:0 16px;cursor:pointer}.act button:hover:not(:disabled){background:#2c2660}.act button:disabled{opacity:.4;cursor:not-allowed}
.sb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.sb div{background:#2c2660;border-radius:12px;text-align:center;padding:6px}.sb small{display:block;font:700 11px Nunito;letter-spacing:.1em;text-transform:uppercase;color:#bdb2dc}.sb b{font:600 22px Fredoka;font-variant-numeric:tabular-nums}
.msg{min-height:30px;text-align:center;font:600 20px Fredoka,sans-serif;margin:8px 0}.msg.w{color:#7de0b0}.msg.l{color:#ffc247}
.ff{position:absolute;width:6px;height:6px;border-radius:50%;background:#e8ff9a;box-shadow:0 0 10px 3px rgba(232,255,154,.6);animation:fd 9s ease-in-out infinite}
@keyframes fd{0%,100%{transform:translate(0,0)}33%{transform:translate(30px,-20px)}66%{transform:translate(-24px,-34px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fl{animation:fl 3.5s ease-in forwards}@keyframes fl{to{transform:translateY(-120px)}}
@media(max-width:900px){.card{grid-template-columns:1fr;padding:12px}.sc{aspect-ratio:16/10}.k{height:44px}}
@media(prefers-reduced-motion:reduce){.kb.sh,.wd span.r,.ff,.fl{animation:none}}
</style></head><body>
<div class="bgp" id="bgp" aria-hidden="true"></div>
<main class="w"><p class="eb">Wordlantern</p><h1>Hangman Words</h1>
<div class="card"><section aria-label="Scene"><div class="sc" id="sc" role="img" aria-label="Gallows with a paper lantern character"></div><div class="lv" id="lv"></div></section>

<div class="sb"><div><small>Streak</small><b id="st">0</b></div><div><small>Best</small><b id="bs">0</b></div><div><small>Wins</small><b id="wn">0</b></div><div><small>Losses</small><b id="ls">0</b></div></div></section></div>
<div class="sr" id="live" aria-live="polite"></div><p class="sr" id="stat" aria-live="polite"></p></main>
<script>/*SCENES-START*/
var SC=(function(){

 function landscape(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),g2=id('sn');var sunY=o.sunY!=null?o.sunY:h*.52,sunX=o.sunX!=null?o.sunX:w*(.3+r()*.4);

 function portrait(seed,o){o=o||{};var w=o.w||400,h=o.h||500,r=R(seed),skin=o.skin||['#f1c9a5','#d9a37a','#b57a52','#8a5a3a','#e8b896'][Math.floor(r()*5)],hair=o.hair||['#2a1c14','#5a3a22','#c9a24a','#1a1a1a','#8a4a2a','#d8d4cc'][Math.floor(r()*6)],cl=o.cloth||['#2f6b4f','#c2523a','#3a4f9a','#7a4a9a','#222','#d9a23a'][Math.floor(r()*6)],bg=o.bg||['#e8d8c4','#cfdde8','#e4d0d8','#d4e4d0'][Math.floor(r()*4)],g=id('pb'),gs=id('ps'),long=o.long!=null?o.long:r()>.5;
  var out='<defs><radialGradient id="'+g+'" cx=".5" cy=".3" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="'+bg+'"/></radialGradient><linearGradient id="'+gs+'" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient></defs><rect width="'+w+'" height="'+h+'" fill="'+bg+'"/><rect width="'+w+'" height="'+h+'" fill="url(#'+g+')"/>';
  var cx=w/2,cy=h*.42,fr=w*.19;if(long)out+='<path d="M'+(cx-fr*1.35)+' '+(cy+fr*2.2)+' Q'+(cx-fr*1.6)+' '+(cy-fr*.6)+' '+cx+' '+(cy-fr*1.5)+' Q'+(cx+fr*1.6)+' '+(cy-fr*.6)+' '+(cx+fr*1.35)+' '+(cy+fr*2.2)+'Z" fill="'+hair+'"/>';

var st=S.over?(S.lost?'lose':'win'):'';var c=$('#sc svg #ch');if(c)c.innerHTML=chSvg(S.wrong,st);lantern();$('#hi').disabled=S.over||S.wrong>=6;
$('#st').textContent=S.streak;$('#bs').textContent=S.best;$('#wn').textContent=S.wins;$('#ls').textContent=S.loss;try{localStorage.setItem('wl-hm',JSON.stringify({best:S.best,wins:S.wins,loss:S.loss,streak:S.streak}))}catch(e){}}
function start(){S.guess={};S.used={};S.wrong=0;S.over=false;S.lost=false;pick();$('#msg').textContent='';$('#msg').className='msg';render();say('New word. '+S.cat0+', '+S.word.length+' letters.')}
function check(){var done=S.word.split('').every(function(c){return S.guess[c]});if(done){S.over=true;S.lost=false;S.streak++;S.wins++;S.best=Math.max(S.best,S.streak);$('#msg').textContent='Well done! The word was '+S.word.toUpperCase()+'.';$('#msg').className='msg w';say($('#msg').textContent)}else if(S.wrong>=7){S.over=true;S.lost=true;S.streak=0;S.loss++;$('#msg').textContent='The lantern is resting. The word was '+S.word.toUpperCase()+'. Try again!';$('#msg').className='msg l';say($('#msg').textContent)}}
function guess(l){if(S.over||S.used[l]||!/^[a-z]$/.test(l))return;if(S.word.indexOf(l)>-1){S.guess[l]=l;S.used[l]='ok';var n=S.word.split(l).length-1;say(l.toUpperCase()+' is correct. '+n+' match'+(n===1?'':'es')+'.')}else{S.used[l]='no';S.wrong++;if(!reduce){var kb=$('#kb');kb.classList.remove('sh');void kb.offsetWidth;kb.classList.add('sh')}say(l.toUpperCase()+' is wrong. '+S.wrong+' of 7.')}check();render()}
$('#kb').addEventListener('click',function(e){var b=e.target.closest('.k');if(b)guess(b.dataset.l)});
document.addEventListener('keydown',function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.target.closest&&e.target.closest('input,textarea,select'))return;if(/^[a-zA-Z]$/.test(e.key)){guess(e.key.toLowerCase())}});
$('#kb').addEventListener('keydown',function(e){var ks=[].slice.call(document.querySelectorAll('.k')),i=ks.indexOf(document.activeElement);if(i<0)return;var n=null;if(e.key==='ArrowRight')n=ks[i+1];else if(e.key==='ArrowLeft')n=ks[i-1];else if(e.key==='ArrowDown')n=ks[Math.min(ks.length-1,i+10)];else if(e.key==='ArrowUp')n=ks[Math.max(0,i-10)];if(n){e.preventDefault();n.focus()}});
$('#cat').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.cat=b.dataset.c;document.querySelectorAll('#cat button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});start()});
$('#nw').onclick=start;$('#rs').onclick=function(){S.streak=0;render();say('Streak reset.')};

start();
