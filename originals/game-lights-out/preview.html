<style>

if(lit===0){win()}else say('Lamp pressed. '+lit+' lamp'+(lit===1?'':'s')+' lit.')}
function win(){st.solved=true;var m=st.moves.length;if(!st.best[st.lvl]||m<st.best[st.lvl])st.best[st.lvl]=m;if(st.lvl<10)st.max=Math.max(st.max,st.lvl+1);save();render(false);$('#wp').textContent='All dark. Well done in '+m+' moves. Best: '+st.best[st.lvl]+'.'+(st.hints?' Hints used: '+st.hints+'.':'');$('#win').classList.add('on');say('All dark. Well done in '+m+' moves.','ok');$('#wn').textContent=st.lvl>=10?'Play again':'Next level';$('#wn').focus();if(!reduce)stars()}
function stars(){var f=$('#win');for(var i=0;i<20;i++){var s=document.createElement('span');s.className='star';s.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 7 7 .6-5.300 4.700 1.700 7.200L12 17.800 5.600 21.500l1.700-7.200L2 9.600 9 9z"/></svg>';s.style.left='50%';s.style.top='50%';f.appendChild(s);(function(s){var a=Math.random()*Math.PI*2,d=80+Math.random()*140;s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px) scale(.4)',opacity:0}],{duration:1400,easing:'ease-out',fill:'forwards'}).onfinish=function(){s.remove()}})(s)}}
function save(){try{localStorage.setItem('lo-save',JSON.stringify({best:st.best,max:st.max,lvl:st.lvl}))}catch(e){}}
function load(newSeed){if(newSeed)st.seed++;$('#win').classList.remove('on');gen();foc=0;build();say('Level '+st.lvl+', '+st.n+' by '+st.n+'. '+cells.length+' lamps.')}
$('#un').onclick=function(){if(!st.moves.length||st.solved)return;var i=st.moves.pop();press(st.grid,st.n,i);render(false);say('Undo. '+$('#lt').textContent+' lamps lit.')};
$('#rs').onclick=function(){st.grid=st.start.slice();st.moves=[];st.solved=false;$('#win').classList.remove('on');render(false);say('Level restarted.')};
$('#hi').onclick=function(){if(st.solved)return;var sol=solve(st.grid,st.n);if(!sol){say('No hint available.');return}var idx=sol.indexOf(1);if(idx<0)return;st.hints++;var c=cells[idx];c.classList.add('hn');setTimeout(function(){c.classList.remove('hn')},2000);var r=Math.floor(idx/st.n)+1,cc=idx%st.n+1;say('Try the highlighted lamp: row '+r+', column '+cc+'. Perfect solution needs '+sol.reduce(function(a,b){return a+b},0)+' presses.','hu')};
$('#nl').onclick=function(){load(true)};$('#pl').onclick=function(){if(st.lvl>1){st.lvl--;save();load(false)}};$('#nx').onclick=function(){if(st.lvl<st.max&&st.lvl<10){st.lvl++;save();load(false)}};
$('#wn').onclick=function(){if(st.lvl<10)st.lvl++;else st.lvl=1;save();load(false)};
document.addEventListener('keydown',function(e){if(e.target.closest('input,select,textarea'))return;var k=e.key.toLowerCase();if(k==='u'){$('#un').click()}else if(k==='r'){$('#rs').click()}else if(k==='h'){$('#hi').click()}});
load(false);
})();
</script></body></html>
