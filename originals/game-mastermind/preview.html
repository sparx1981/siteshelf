<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Breaker — Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Figtree:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#1f5a3a;color:#fdf6e3;font:500 15px/1.5 Figtree,system-ui,sans-serif;overflow-x:hidden;position:relative}
.bgp{position:fixed;inset:0;z-index:0;pointer-events:none}.bgp svg{width:100%;height:100%;display:block}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #14141a}
.w{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:16px 12px 30px;text-align:center}
.eb{font:700 12px Figtree;letter-spacing:.2em;text-transform:uppercase;color:#e0b04a;margin:0}
h1{font:700 clamp(32px,5vw,52px)/1 "Playfair Display",serif;margin:2px 0 10px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start;text-align:left}
.bd{position:relative;background:linear-gradient(#6a4528,#4a2e18);border:6px solid #8a6a3c;outline:2px solid #3a2410;border-radius:18px;padding:12px 14px 14px;box-shadow:0 24px 50px rgba(0,0,0,.5),inset 0 0 0 2px #3a2410}
.bd:before,.bd:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f2dcaa,#7a5a24);top:6px;left:6px}.bd:after{left:auto;right:6px}
.sh{position:relative;height:64px;border-radius:10px;overflow:hidden;background:#1a1208;margin-bottom:10px;box-shadow:inset 0 3px 8px rgba(0,0,0,.6)}
.sh .code{position:absolute;inset:0;display:flex;gap:12px;justify-content:center;align-items:center}
.sh .plate{position:absolute;inset:0;background:linear-gradient(#e0b04a,#a8802a);border-radius:10px;display:grid;place-items:center;transition:transform .8s cubic-bezier(.4,0,.2,1);box-shadow:inset 0 2px 0 #f6e3a8,inset 0 -3px 0 #7a5a18}
.sh.open .plate{transform:translateY(-100%)}
.plate svg{width:34px;height:34px}.hn{position:absolute;right:10px;top:6px;display:flex;gap:4px}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:28px 1fr 56px;gap:10px;align-items:center;padding:5px 10px;border-radius:12px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.row.cur{background:rgba(255,235,170,.14);box-shadow:inset 0 0 0 2px #e0b04a,0 0 20px rgba(224,176,74,.25);transform:translateY(-1px)}
.row .n{font:500 13px "DM Mono",monospace;color:#d9c9a0}.row.cur .n:before{content:"\25B6 ";color:#e0b04a}
.sl{display:flex;gap:10px;justify-content:center}
.sk{width:clamp(38px,8vw,50px);aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;background:radial-gradient(circle at 50% 40%,#150e06,#3a2410);box-shadow:inset 0 3px 6px rgba(0,0,0,.7),0 0 0 3px #8a6a3c}
.sk.sel{box-shadow:inset 0 3px 6px rgba(0,0,0,.7),0 0 0 3px #fff6d0,0 0 14px #e0b04a}
.mb{display:block;width:100%;height:100%;border-radius:50%;position:relative}
.mb svg{position:absolute;inset:0;width:100%;height:100%}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:44px;margin:0 auto}.fb i{width:17px;height:17px;border-radius:50%;background:#1a1208;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.fb i.b{background:radial-gradient(circle at 35% 30%,#555,#14141a);box-shadow:0 1px 3px rgba(0,0,0,.6)}.fb i.w{background:radial-gradient(circle at 35% 30%,#fff,#c8c8c8);box-shadow:0 1px 3px rgba(0,0,0,.6)}
.tr{background:linear-gradient(#5a1a28,#3a0f1a);border:5px solid #8a6a3c;border-radius:18px;padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.tr h2{font:700 14px Figtree;letter-spacing:.14em;text-transform:uppercase;color:#e0b04a;margin:0 0 8px}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pal button{background:rgba(0,0,0,.25);border:1.5px solid #6a3a48;border-radius:12px;padding:6px;cursor:pointer;color:#fdf6e3;font:700 12px Figtree;display:grid;gap:2px;justify-items:center}
.pal button:hover{background:rgba(255,255,255,.12)}.pal .mb{width:44px;height:44px}.pal kbd{font:500 11px "DM Mono";color:#d9c9a0}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ct button{font:700 14px Figtree;border-radius:10px;min-height:46px;cursor:pointer;color:#fdf6e3;background:#2a1a10;border:1.5px solid #8a6a3c}.ct button:hover:not(:disabled){background:#4a2e18}.ct button:disabled{opacity:.4;cursor:not-allowed}
.ct .pr{grid-column:1/-1;background:#e0b04a;color:#2a1a08;border-color:#e0b04a}.ct .pr:hover:not(:disabled){background:#f0c35e}
.tg{display:flex;flex-direction:column;gap:2px;margin:8px 0}.tg label{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700;cursor:pointer}.tg input{width:20px;height:20px;accent-color:#e0b04a}
.lg{font-size:13px;color:#e6dcc0;margin:6px 0 0}.st{font:500 15px "DM Mono",monospace;margin:8px 0 0}
.msg{min-height:44px;font-weight:700;margin-top:8px;color:#fff6d0}
.ov{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(20,14,6,.7);border-radius:12px}.ov div{background:#2a1a10;border:2px solid #e0b04a;border-radius:16px;padding:16px 22px;max-width:86%;text-align:center}.ov b{display:block;font:700 24px "Playfair Display";margin-bottom:6px}.ov button{margin-top:10px;font:700 15px Figtree;color:#2a1a08;background:#e0b04a;border:0;border-radius:10px;min-height:46px;padding:0 20px;cursor:pointer}
.spk{position:absolute;width:10px;height:10px;color:#fff6d0;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){.main{grid-template-columns:1fr}.row{grid-template-columns:22px 1fr 48px;padding:4px 6px}.pal{grid-template-columns:repeat(6,1fr)}.pal .mb{width:36px;height:36px}.pal button{padding:4px 2px;font-size:10px}.sk{width:clamp(36px,10vw,44px)}}
@media(prefers-reduced-motion:reduce){.sh .plate{transition:none}.row.cur{transform:none}}
</style></head><body>
<div class="bgp" id="bgp" aria-hidden="true"></div>
<main class="w"><p class="eb">Brass &amp; Marble</p><h1>Code Breaker</h1>
<div class="main"><section class="bd" id="bd" aria-label="Board"><div class="sh" id="sh"><div class="code" id="code"></div><div class="plate" aria-hidden="true"><svg viewBox="0 0 34 34"><circle cx="17" cy="14" r="7" fill="#7a5a18"/><path d="M14 18 L11 30 H23 L20 18Z" fill="#7a5a18"/></svg></div></div><div class="rows" id="rows"></div><div class="ov" id="ov" hidden><div><b id="oh"></b><p id="op" style="margin:0"></p><button id="ob">Play again</button></div></div></section>
<aside class="tr" aria-label="Controls"><h2>Marbles</h2><div class="pal" id="pal"></div><div class="ct"><button class="pr" id="sb" type="button" disabled>Submit guess</button><button id="cr" type="button">Clear row</button><button id="hi" type="button">Hint</button><button id="ng" type="button" style="grid-column:1/-1">New game</button></div>
<div class="tg"><label><input type="checkbox" id="dp" checked>Allow duplicates</label><label><input type="checkbox" id="sh2" checked>Show shapes</label></div>
<p class="lg">Black pin: right colour, right place. White pin: right colour, wrong place.</p><div class="st" id="st"></div><div class="msg" id="msg" role="status"></div></aside></div>
<div class="sr" id="live" aria-live="polite"></div></main>
<script>/*SCENES-START*/
var SC=(function(){
 var uid=0,s=1;function id(p){return p+(++uid)}

 function grad(i,stops,vert){var n=stops.length;return '<linearGradient id="'+i+'" x1="0" y1="0" x2="'+(vert===false?1:0)+'" y2="'+(vert===false?0:1)+'">'+stops.map(function(c,k){return '<stop offset="'+(k/(n-1)).toFixed(2)+'" stop-color="'+c+'"/>'}).join('')+'</linearGradient>'}

 function ridge(r,w,base,amp,col,rough,id2){var d='M0 '+(base+amp)+' ',x=0,y;var pts=[];var n=Math.round(w/16);var ph=r()*6;for(var i=0;i<=n;i++){var xx=i/n*w,v=Math.sin(i*.35+ph)*.5+Math.sin(i*.9+ph*2)*.25+(r()-.5)*rough;pts.push([xx,base-v*amp])}d='M0 '+(base+amp*3)+' L'+pts.map(function(p){return p[0].toFixed(0)+' '+p[1].toFixed(1)}).join(' L')+' L'+w+' '+(base+amp*3)+'Z';return '<path d="'+d+'" fill="'+col+'"/>'}
 function landscape(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),g2=id('sn');var sunY=o.sunY!=null?o.sunY:h*.52,sunX=o.sunX!=null?o.sunX:w*(.3+r()*.4);

 function sea(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),gs=id('sa'),hz=h*.5;var sx=w*(.35+r()*.3);

  out+='<rect x="'+(w*.46)+'" y="'+(h*.6)+'" width="'+(w*.07)+'" height="'+(h*.15)+'" rx="6" fill="#4a3320"/><path d="M'+(w*.495)+' '+(h*.6)+' q-30 -60 -10 -110 M'+(w*.495)+' '+(h*.6)+' q30 -70 24 -120 M'+(w*.495)+' '+(h*.6)+' q-6 -80 4 -140" stroke="#2f7a4a" stroke-width="10" fill="none" stroke-linecap="round"/>';

$('#rows').addEventListener('click',function(e){var b=e.target.closest('.sk');if(!b||b.disabled)return;var i=+b.dataset.s;if(S.cur[i]>=0&&S.sel===i){S.cur[i]=-1;say('Slot '+(i+1)+' cleared.')}S.sel=i;build();var nb=document.querySelector('.row.cur .sk[data-s="'+i+'"]');if(nb)nb.focus()});
$('#rows').addEventListener('keydown',function(e){var b=e.target.closest('.sk');if(!b||b.disabled)return;var i=+b.dataset.s,n=null;if(e.key==='ArrowRight')n=Math.min(3,i+1);else if(e.key==='ArrowLeft')n=Math.max(0,i-1);if(n!==null){e.preventDefault();S.sel=n;build();document.querySelector('.row.cur .sk[data-s="'+n+'"]').focus()}});
function submit(){if(S.over||S.cur.indexOf(-1)>-1)return;if(!S.dup&&new Set(S.cur).size<4){say('Duplicates are off. Use four different colours.');return}var f=feedback(S.cur,S.code);S.rows.push({g:S.cur.slice(),f:f});S.cur=[-1,-1,-1,-1];S.sel=0;var n=S.rows.length;
if(f.b===4){S.over=true;S.wins++;if(!S.best||n<S.best)S.best=n;try{localStorage.setItem('bm-cb',JSON.stringify({best:S.best,wins:S.wins}))}catch(e){}$('#sh').classList.add('open');build();say('Cracked it in '+n+' guess'+(n===1?'':'es')+'!'+(S.hints.length?' Hints used: '+S.hints.length+'.':''));endOv('Cracked it!','You found the code in '+n+' guesses.');spark()}
else if(n>=10){S.over=true;$('#sh').classList.add('open');build();var m='Out of guesses. The code was '+S.code.map(function(c){return COL[c][0]}).join(', ')+'.';say(m);endOv('Out of guesses',m)}
else{build();say('Guess '+n+': '+f.b+' right place, '+f.w+' right colour.')}}
function endOv(h,p){setTimeout(function(){$('#oh').textContent=h;$('#op').textContent=p;$('#ov').hidden=false;$('#ob').focus()},reduce?0:900)}
function spark(){if(reduce)return;var sh=$('#sh');for(var i=0;i<10;i++){var s=document.createElement('span');s.className='spk';s.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 7 7 .6-5.300 4.700 1.700 7.200L12 17.800 5.600 21.500l1.700-7.200L2 9.600 9 9z"/></svg>';s.style.left=(40+Math.random()*20)+'%';s.style.top='40%';sh.appendChild(s);(function(s){s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+((Math.random()-.5)*200)+'px,'+((Math.random()-.5)*60)+'px) scale(2)',opacity:0}],{duration:900,delay:700,fill:'forwards'}).onfinish=function(){s.remove()}})(s)}}
$('#sb').onclick=submit;$('#cr').onclick=function(){S.cur=[-1,-1,-1,-1];S.sel=0;build();say('Row cleared.')};
$('#hi').onclick=function(){if(S.over||S.hints.length>=3)return;var free=[0,1,2,3].filter(function(i){return S.hints.indexOf(i)<0});var i=free[Math.floor(Math.random()*free.length)];S.hints.push(i);build();say('Hint: position '+(i+1)+' is '+COL[S.code[i]][0]+'.')};
$('#ng').onclick=newGame;$('#ob').onclick=newGame;
$('#dp').onchange=function(){S.dup=this.checked;newGame()};$('#sh2').onchange=function(){S.shapes=this.checked;build()};
document.addEventListener('keydown',function(e){if(e.target.closest&&e.target.closest('input,select,textarea'))return;if(/^[1-6]$/.test(e.key)){place(+e.key-1)}else if(e.key==='Backspace'){e.preventDefault();var i=S.cur[S.sel]>=0?S.sel:(function(){for(var k=3;k>=0;k--)if(S.cur[k]>=0)return k;return -1})();if(i>=0){S.cur[i]=-1;S.sel=i;build();say('Slot '+(i+1)+' cleared.')}}else if(e.key==='Enter'&&!(e.target.closest&&e.target.closest('button'))){submit()}else if(e.key==='n'||e.key==='N')newGame()});
newGame();
})();
</script></body></html>
