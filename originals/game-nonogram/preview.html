<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nonogram Puzzle — Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Figtree:wght@500;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#e9dcc4;color:#2b2218;font:500 15px/1.5 Figtree,system-ui,sans-serif;overflow-x:hidden;position:relative}
.bgp{position:fixed;inset:0;z-index:0;pointer-events:none}.bgp svg{width:100%;height:100%;display:block}
:focus-visible{outline:3px solid #2b2218;outline-offset:3px;box-shadow:0 0 0 6px #fff}
.w{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:16px 12px 30px;text-align:center}
.eb{font:700 12px Figtree;letter-spacing:.16em;text-transform:uppercase;color:#8a4b1f;margin:0}
h1{font:400 clamp(30px,5vw,50px)/1 "Young Serif",serif;margin:2px 0 10px}
.tb{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;background:rgba(251,245,230,.94);border:1px solid #d8c9a8;border-radius:16px;padding:8px 12px;margin-bottom:12px;box-shadow:0 8px 20px rgba(60,40,10,.2)}
select{font:700 14px Figtree;border:1.5px solid #2b2218;border-radius:10px;min-height:44px;padding:0 10px;background:#fff;color:#2b2218}
.seg{display:inline-flex;border:1.5px solid #2b2218;border-radius:10px;overflow:hidden}.seg label{position:relative}.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}.seg span{display:block;min-height:44px;line-height:44px;padding:0 14px;font-weight:700;background:#fff}
.seg input:checked+span{background:#2b2218;color:#fff}.seg input:focus-visible+span{outline:3px solid #8a4b1f;outline-offset:-3px}
.bt{font:700 14px Figtree;color:#2b2218;background:#fff;border:1.5px solid #2b2218;border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}.bt:hover:not(:disabled){background:#f3ead2}.bt:disabled{opacity:.4;cursor:not-allowed}
.tm{font:500 20px "DM Mono",monospace;font-variant-numeric:tabular-nums}

.hp:after{content:"";position:absolute;left:50%;top:-8px;width:34px;height:26px;margin-left:-17px;border-radius:6px;background:linear-gradient(#e6e0d4,#9a9488);box-shadow:0 3px 6px rgba(0,0,0,.4)}
.cl{position:relative;background:#f6ecd6;border-radius:8px;padding:6px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12),inset 0 0 30px rgba(120,80,30,.22)}
.cl:before{content:"";position:absolute;inset:0;border-radius:8px;background-image:linear-gradient(rgba(120,90,50,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(120,90,50,.1) 1px,transparent 1px);background-size:4px 4px;pointer-events:none}
.pz{display:grid;grid-template-columns:auto auto;gap:0;position:relative;--cs:clamp(28px,5.4vw,40px)}
.cc{display:grid;grid-template-columns:repeat(10,var(--cs));align-items:end;padding-bottom:4px}
.cc div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;font:500 clamp(12px,2.2vw,15px) "DM Mono",monospace;line-height:1.1;min-height:calc(var(--cs)*2.2);padding:0 1px}
.rc{display:grid;grid-template-rows:repeat(10,var(--cs));padding-right:6px}
.rc div{display:flex;gap:6px;align-items:center;justify-content:flex-end;font:500 clamp(12px,2.2vw,15px) "DM Mono",monospace}
.cc div.ok,.rc div.ok{color:#8a8070;text-decoration:line-through}.cc div.fc,.rc div.fc{background:rgba(224,176,74,.4);border-radius:6px}
.gd{display:grid;grid-template-columns:repeat(10,var(--cs));grid-template-rows:repeat(10,var(--cs));border:2px solid #2b2218;touch-action:none;user-select:none;background:rgba(255,255,255,.2)}
.c{position:relative;border:0;border-right:1px solid rgba(43,34,24,.3);border-bottom:1px solid rgba(43,34,24,.3);background:transparent;padding:0;cursor:pointer}
.c:nth-child(10n){border-right:0}.c:nth-child(n+91){border-bottom:0}
.c.g5{border-right:2px solid rgba(43,34,24,.75)}.c.h5{border-bottom:2px solid rgba(43,34,24,.75)}
.c svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.c.f:focus-visible,.c:focus-visible{outline:3px solid #2b2218;outline-offset:-3px;box-shadow:none}
.c.fc2{background:rgba(224,176,74,.18)}
.sm{margin-top:10px;font-weight:700;min-height:24px}
.pv{position:absolute;right:-8px;top:-8px;width:56px;height:56px;background:#fffdf5;border:2px solid #2b2218;border-radius:6px;overflow:hidden}.pv svg{width:100%;height:100%;display:block}
.lb{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);background:#2f7a4a;color:#fff;font:700 15px Figtree;border-radius:99px;padding:4px 16px;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.nd{position:absolute;pointer-events:none;z-index:6}
@media(max-width:700px){.hp{padding:14px}.pv{display:none}}
</style></head><body>
<div class="bgp" id="bgp" aria-hidden="true"></div>

<div class="hp" id="hp"><div class="cl"><div class="pz" id="pz"><div></div><div class="cc" id="cc"></div><div class="rc" id="rc"></div><div class="gd" id="gd" role="grid" aria-label="Nonogram grid, 10 by 10"></div></div><div class="pv" id="pv" aria-hidden="true"></div></div></div>
<div class="sm" id="sm"></div><div class="sr" id="live" aria-live="polite"></div></main>
<script>/*SCENES-START*/

 function landscape(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),g2=id('sn');var sunY=o.sunY!=null?o.sunY:h*.52,sunX=o.sunX!=null?o.sunX:w*(.3+r()*.4);

 function portrait(seed,o){o=o||{};var w=o.w||400,h=o.h||500,r=R(seed),skin=o.skin||['#f1c9a5','#d9a37a','#b57a52','#8a5a3a','#e8b896'][Math.floor(r()*5)],hair=o.hair||['#2a1c14','#5a3a22','#c9a24a','#1a1a1a','#8a4a2a','#d8d4cc'][Math.floor(r()*6)],cl=o.cloth||['#2f6b4f','#c2523a','#3a4f9a','#7a4a9a','#222','#d9a23a'][Math.floor(r()*6)],bg=o.bg||['#e8d8c4','#cfdde8','#e4d0d8','#d4e4d0'][Math.floor(r()*4)],g=id('pb'),gs=id('ps'),long=o.long!=null?o.long:r()>.5;

function finish(){S.done=true;S.run=false;clearInterval(S.iv);for(var i=0;i<100;i++)if(S.st[i]===2)S.st[i]=0;render();$('#pv').style.display='';var b=S.best[S.name];if(!b||S.t<b)S.best[S.name]=S.t;try{localStorage.setItem('ss-ng',JSON.stringify(S.best))}catch(e){}var m='Stitched! '+S.name+' finished in '+fmt(S.t)+'.';$('#sm').textContent=m;say(m);var l=document.createElement('span');l.className='lb';l.textContent='Stitched! '+S.name;$('#hp').appendChild(l);if(!reduce){var s=document.createElement('div');s.className='nd';s.style.cssText='left:0;top:50%;width:140px;height:6px;background:linear-gradient(90deg,transparent,#d9453a);border-radius:3px';$('#hp').appendChild(s);s.animate([{transform:'translateX(-20px)'},{transform:'translateX('+$('#hp').offsetWidth+'px)'}],{duration:1400,easing:'ease-in-out'}).onfinish=function(){s.remove()}}}
// pointer paint
var drag=null;
gd.addEventListener('pointerdown',function(e){var c=e.target.closest('.c');if(!c||S.done)return;e.preventDefault();start();var i=+c.dataset.i,m=(e.button===2)?'mark':S.mode;var cur=S.st[i],target=m==='fill'?(cur===1?0:1):(cur===2?0:2);drag={i:i,m:m,t:target,r:Math.floor(i/10),c:i%10,axis:null};setv(i,target);S.sel=i;gd.setPointerCapture(e.pointerId);render();focusCell(i);drag.lp=setTimeout(function(){},0)});
gd.addEventListener('pointermove',function(e){if(!drag)return;var el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest&&el.closest('.c');if(!c)return;var i=+c.dataset.i,r=Math.floor(i/10),cc=i%10;if(drag.axis===null){if(r!==drag.r&&cc===drag.c)drag.axis='c';else if(cc!==drag.c&&r===drag.r)drag.axis='r';else return}if(drag.axis==='r'&&r!==drag.r)return;if(drag.axis==='c'&&cc!==drag.c)return;if(S.st[i]!==drag.t&&!(S.st[i]===1&&drag.t===2))setv(i,drag.t);S.sel=i;render()});
function up(){if(!drag)return;drag=null;render();if(won())finish();else checkLine()}
gd.addEventListener('pointerup',up);gd.addEventListener('pointercancel',function(){drag=null});gd.addEventListener('contextmenu',function(e){e.preventDefault()});
function checkLine(){var i=S.sel,r=Math.floor(i/10),c=i%10,row=S.st.slice(r*10,r*10+10),col=[];for(var k=0;k<10;k++)col.push(S.st[k*10+c]);if(JSON.stringify(lineOf(row))===JSON.stringify(S.rowC[r])&&row.indexOf(1)>-1)say('Row '+(r+1)+' complete.');else if(JSON.stringify(lineOf(col))===JSON.stringify(S.colC[c])&&col.indexOf(1)>-1)say('Column '+(c+1)+' complete.')}
function focusCell(i){S.sel=i;cells.forEach(function(c,k){c.tabIndex=k===i?0:-1});cells[i].focus()}
gd.addEventListener('keydown',function(e){var b=e.target.closest('.c');if(!b||S.done)return;var i=+b.dataset.i,r=Math.floor(i/10),c=i%10,t=null;if(e.key==='ArrowRight')t=c<9?i+1:null;else if(e.key==='ArrowLeft')t=c>0?i-1:null;else if(e.key==='ArrowDown')t=r<9?i+10:null;else if(e.key==='ArrowUp')t=r>0?i-10:null;
else if(e.key===' '||e.key==='Enter'){e.preventDefault();start();setv(i,S.st[i]===1?0:1);render();focusCell(i);if(won())finish();else checkLine();return}else if(e.key==='x'||e.key==='X'){e.preventDefault();start();setv(i,S.st[i]===2?0:2);render();focusCell(i);return}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();setv(i,0);render();focusCell(i);return}
if(t!==null||e.key.indexOf('Arrow')===0){e.preventDefault();if(t!==null){S.sel=t;render();focusCell(t)}}});
document.addEventListener('keydown',function(e){if(e.target.closest&&e.target.closest('input,select,textarea'))return;if(e.key==='u'||e.key==='U')$('#un').click()});
$('#un').onclick=function(){if(S.done||!S.hist.length)return;var h=S.hist.pop();S.st[h.i]=h.v;delete S.err[h.i];render();say('Undone.')};
$('#hi').onclick=function(){if(S.done)return;var w=[];for(var i=0;i<100;i++)if(S.sol[i]===1&&S.st[i]!==1)w.push(i);if(!w.length)return;var i=w[Math.floor(Math.random()*w.length)];start();setv(i,1);S.sel=i;render();say('Hint: row '+(Math.floor(i/10)+1)+', column '+(i%10+1)+' is a stitch.');if(won())finish()};
$('#ck').onclick=function(){if(S.done)return;S.err={};var n=0;for(var i=0;i<100;i++)if(S.st[i]===1&&S.sol[i]!==1){S.err[i]=1;n++}render();var m=n?n+' stitch'+(n===1?' is':'es are')+' wrong.':'Looks good so far. No wrong stitches.';$('#sm').textContent=m;say(m)};
$('#rs').onclick=function(){load(S.name)};$('#ps').onchange=function(){load(this.value)};
document.querySelectorAll('input[name=md]').forEach(function(r){r.onchange=function(){S.mode=r.value;say('Mode: '+r.value)}});
load('Heart');
})();
</script></body></html>
