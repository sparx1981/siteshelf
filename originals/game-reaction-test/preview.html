<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reaction Time Test — Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#1b2c5a;color:#f4f6ff;font:400 15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden;position:relative}

.w{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:18px 14px 34px;text-align:center}
.eb{font:700 12px Inter;letter-spacing:.2em;text-transform:uppercase;color:#ffb020;margin:0}

.go{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font:700 clamp(15px,2.4vw,20px) Inter;color:#14182e;background:#ffb020;border:0;border-radius:14px;min-height:52px;padding:0 28px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.4)}

.ms{font-weight:600;color:#b3bbe0;min-height:24px}

.ch svg{width:100%;display:block}
.rt{font-weight:600;font-size:17px;margin:10px 0 0;min-height:26px;color:#5dffa6}

<div class="bgp" id="bgp" aria-hidden="true"></div>

<p class="rt" id="rt"></p>
<div class="ct"><button id="rs" type="button">Reset</button><button id="ta" type="button" hidden>Try again</button><label class="sw"><input type="checkbox" role="switch" id="sn">Use sound cue</label></div></div>
<div class="sr" id="live" aria-live="polite"></div></main>
<script>/*SCENES-START*/
var SC=(function(){

 function landscape(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),g2=id('sn');var sunY=o.sunY!=null?o.sunY:h*.52,sunX=o.sunX!=null?o.sunX:w*(.3+r()*.4);

 function portrait(seed,o){o=o||{};var w=o.w||400,h=o.h||500,r=R(seed),skin=o.skin||['#f1c9a5','#d9a37a','#b57a52','#8a5a3a','#e8b896'][Math.floor(r()*5)],hair=o.hair||['#2a1c14','#5a3a22','#c9a24a','#1a1a1a','#8a4a2a','#d8d4cc'][Math.floor(r()*6)],cl=o.cloth||['#2f6b4f','#c2523a','#3a4f9a','#7a4a9a','#222','#d9a23a'][Math.floor(r()*6)],bg=o.bg||['#e8d8c4','#cfdde8','#e4d0d8','#d4e4d0'][Math.floor(r()*4)],g=id('pb'),gs=id('ps'),long=o.long!=null?o.long:r()>.5;

function finish(){var av=Math.round(S.times.reduce(function(a,b){return a+b},0)/5),bs=Math.min.apply(0,S.times);if(!S.best||bs<S.best){S.best=bs;try{localStorage.setItem('pp-rt',bs)}catch(e){}}
var rt=av<200?'Lightning. Elite territory.':av<250?'Faster than most. Typical is about 250 ms.':av<300?'Right around typical.':av<400?'A little slow, try again.':'Warm up first, then try again.';$('#rt').textContent='Average '+av+' ms. '+rt;say('Five attempts done. Average '+av+' milliseconds. '+rt);$('#go').disabled=true;$('#go').textContent='Done';$('#ta').hidden=false;$('#res').hidden=false;
$('#tb').innerHTML=S.times.map(function(t,i){return'<tr><td>'+(i+1)+'</td><td>'+t+' ms</td><td>'+(t<200?'Fast':t<300?'Good':'Slow')+'</td></tr>'}).join('');
var W=420,H=200,mx=500,mn=100,x0=34,bw=(W-x0-10)/5-10,p='<g font-family="JetBrains Mono,monospace" font-size="10" fill="#b3bbe0">';[100,200,300,400,500].forEach(function(v){var y=H-24-(v-mn)/(mx-mn)*(H-40);p+='<line x1="'+x0+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'" stroke="#3a4270"/><text x="2" y="'+(y+3)+'">'+v+'</text>'});p+='</g>';
S.times.forEach(function(t,i){var h=(Math.min(mx,Math.max(mn,t))-mn)/(mx-mn)*(H-40),x=x0+6+i*(bw+10);p+='<rect x="'+x+'" y="'+(H-24-h)+'" width="'+bw+'" height="'+h+'" rx="5" fill="'+(t<250?'#5dffa6':'#ffb020')+'"/><text x="'+(x+bw/2)+'" y="'+(H-24-h-4)+'" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" fill="#f4f6ff">'+t+'</text><text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#b3bbe0" font-family="Inter,sans-serif">#'+(i+1)+'</text>'});
var ay=H-24-(av-mn)/(mx-mn)*(H-40);p+='<line x1="'+x0+'" x2="'+(W-6)+'" y1="'+ay+'" y2="'+ay+'" stroke="#f4f6ff" stroke-dasharray="5 4"/><text x="'+(W-6)+'" y="'+(ay-4)+'" text-anchor="end" font-size="10" fill="#f4f6ff" font-family="Inter,sans-serif">avg '+av+'</text>';
$('#ch').innerHTML='<svg viewBox="0 0 '+W+' '+H+'">'+p+'</svg>';S.state='result';ui()}
function reset(){clr();S.times=[];S.notes=[];S.state='idle';for(var i=0;i<5;i++)lamp(i,false);$('#rd').textContent='--';$('#rd').className='rd';$('#ms').textContent='Press Start';sign('READY','#ffb020');$('#go').disabled=false;$('#go').textContent='Start';$('#res').hidden=true;$('#rt').textContent='';$('#ta').hidden=true;$('#fs').classList.remove('on');ui()}
$('#go').addEventListener('click',function(e){e.stopPropagation();begin()});
$('#rs').onclick=function(){reset();say('Reset.')};$('#ta').onclick=function(){reset();begin()};
// reaction input: anywhere on the scene or via keys
function onInput(e){if(e.target.closest&&e.target.closest('#go,#rs,#ta,.sw'))return;if(S.state==='lights'||S.state==='hold'||S.state==='go'){e.preventDefault&&e.preventDefault();react()}}
$('#sc').addEventListener('pointerdown',onInput);
document.addEventListener('keydown',function(e){if(e.repeat)return;if(e.key===' '||e.key==='Enter'){if(e.target.closest&&e.target.closest('button,input,select'))return;e.preventDefault();if(S.state==='idle'||S.state==='result')begin();else react()}});
// button focused + space: treat reaction when active
$('#go').addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&(S.state==='lights'||S.state==='hold'||S.state==='go')){e.preventDefault();react()}});
document.addEventListener('visibilitychange',function(){if(document.hidden&&(S.state==='lights'||S.state==='hold')){clr();S.state='idle';for(var i=0;i<5;i++)lamp(i,false);$('#go').disabled=false;$('#go').textContent='Start';$('#ms').textContent='Paused. Press Start';sign('READY','#ffb020')}});
ui();
})();
</script></body></html>
