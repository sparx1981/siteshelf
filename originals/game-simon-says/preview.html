<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colour Memory Pads</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#15171c;color:#e8eaf0;font:500 15px/1.4 "Chakra Petch",system-ui,sans-serif;display:grid;place-items:center;padding:20px 16px}
.w{text-align:center;width:100%;max-width:420px}h1{font:700 28px "Chakra Petch";letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.sc{display:flex;justify-content:center;gap:28px;margin:10px 0 20px;color:#9aa0b4;text-transform:uppercase;font-size:13px;letter-spacing:.1em}.sc b{display:block;color:#fff;font-size:22px}
.bd{position:relative;width:min(320px,82vw);aspect-ratio:1;margin:0 auto 22px;border-radius:50%;overflow:hidden;background:#0c0d10;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;box-shadow:0 0 0 6px #23262e,0 20px 50px rgba(0,0,0,.5)}
.bd.sh{animation:sh .4s}@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pd{all:unset;cursor:pointer;background:var(--c);filter:brightness(.45);transition:filter .1s}.pd:focus-visible{outline:4px solid #fff;outline-offset:-8px}
.pd.on{filter:brightness(1.35) saturate(1.2);box-shadow:inset 0 0 40px rgba(255,255,255,.5)}
.pd:nth-child(1){border-radius:100% 0 0 0}.pd:nth-child(2){border-radius:0 100% 0 0}.pd:nth-child(3){border-radius:0 0 0 100%}.pd:nth-child(4){border-radius:0 0 100% 0}
.bd.off .pd{cursor:default}
.hub{position:absolute;left:50%;top:50%;width:40%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#15171c;border:5px solid #23262e;display:grid;place-items:center;text-align:center}
.hub b{font:700 44px/1 "Chakra Petch";display:block}.hub button{all:unset;cursor:pointer;background:#fff;color:#15171c;padding:8px 16px;border-radius:99px;font-weight:700;text-transform:uppercase;font-size:14px}.hub button:focus-visible{outline:3px solid #6ee7b7;outline-offset:2px}
.ct{display:flex;gap:18px;justify-content:center;align-items:center;margin-bottom:14px;font-size:14px;color:#c4c8d8}.ct label{display:flex;gap:6px;align-items:center;cursor:pointer}
select{background:#23262e;color:#fff;border:1px solid #3a3f4d;border-radius:8px;padding:5px 8px;font:inherit}
#st{min-height:24px;color:#9aa0b4}
@media(prefers-reduced-motion:reduce){.bd.sh{animation:none;box-shadow:0 0 0 6px #dc2626}.pd{transition:none}}
</style></head><body><div class="w"><h1>Colour Memory</h1>
<div class="sc"><div>Round<b id="rd">0</b></div><div>Best<b id="bs">0</b></div></div>
<div class="bd off" id="bd" role="group" aria-label="Game pads"><button class="pd" style="--c:#22c55e" data-i="0" aria-label="Green pad (key 1 or Q)"></button><button class="pd" style="--c:#ef4444" data-i="1" aria-label="Red pad (key 2 or W)"></button><button class="pd" style="--c:#eab308" data-i="2" aria-label="Yellow pad (key 3 or A)"></button><button class="pd" style="--c:#3b82f6" data-i="3" aria-label="Blue pad (key 4 or S)"></button>
<div class="hub"><div><b id="hb">–</b><button id="go">Start</button></div></div></div>
<div class="ct"><label><input type="checkbox" id="stc"> Strict</label><label>Speed <select id="sp"><option value="1">Normal</option><option value="1.4">Fast</option></select></label><label><input type="checkbox" id="mu"> Mute</label></div>
<div id="st" role="status" aria-live="polite">Press Start, watch, then repeat.</div></div>
<script>
const $=i=>document.getElementById(i),pads=[...document.querySelectorAll(".pd")],F=[330,415,262,494];let seq=[],pos=0,play=false,best=0,ctx=null,tOut=[];
try{best=+localStorage.getItem("cmp")||0}catch(e){}$("bs").textContent=best;
function tone(i,d){if($("mu").checked)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o.frequency.value=F[i];g.gain.value=.0001;o.connect(g);g.connect(ctx.destination);const t=ctx.currentTime;g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d/1000);o.start(t);o.stop(t+d/1000+.05)}catch(e){}}
function light(i,d){pads[i].classList.add("on");tone(i,d);setTimeout(()=>pads[i].classList.remove("on"),d)}
const speed=()=>seq.length>12?.55:seq.length>8?.7:seq.length>4?.85:1;
function st(m){$("st").textContent=m}
function wait(ms,fn){tOut.push(setTimeout(fn,ms))}
function show(){play=false;$("bd").classList.add("off");pos=0;const k=+$("sp").value,step=700*speed()/k;st("Watch…");seq.forEach((p,j)=>wait(500+j*step,()=>light(p,step*.6)));wait(500+seq.length*step,()=>{play=true;$("bd").classList.remove("off");st("Your turn — repeat "+seq.length+(seq.length==1?" step":" steps"))})}
function round(){seq.push(Math.floor(Math.random()*4));$("rd").textContent=seq.length;$("hb").textContent=seq.length;show()}
$("go").onclick=()=>{tOut.forEach(clearTimeout);seq=[];$("go").hidden=true;$("hb").hidden=false;round()};
function press(i){if(!play)return;light(i,220);if(i!==seq[pos]){fail();return}pos++;if(pos==seq.length){play=false;if(seq.length>best){best=seq.length;$("bs").textContent=best;try{localStorage.setItem("cmp",best)}catch(e){}}st("Nice!");wait(800,round)}}
function fail(){play=false;$("bd").classList.add("sh","off");setTimeout(()=>$("bd").classList.remove("sh"),450);
if($("stc").checked){st("Wrong pad — game over at round "+seq.length+".");$("go").hidden=false;$("go").textContent="Play again";$("hb").hidden=true}else{st("Wrong pad — watch again.");wait(1000,show)}}
pads.forEach(p=>p.onclick=()=>press(+p.dataset.i));
document.addEventListener("keydown",e=>{const m={1:0,2:1,3:2,4:3,q:0,w:1,a:2,s:3}[e.key.toLowerCase()];if(m!==undefined&&!e.repeat)press(m)});
$("hb").hidden=true;
</script></body></html>
