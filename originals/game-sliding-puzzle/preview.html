<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slidewell — Sliding Puzzle</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f6f1ff;--mut:#b3a6d6;--mi:#5eead4;--s:min(92vw,460px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(700px 400px at 50% 0,#3a2468,transparent),#1e1530;color:var(--ink);font:500 16px/1.4 Fredoka,system-ui,sans-serif;display:grid;place-items:center;padding:20px 12px}
.m{display:grid;gap:16px;justify-items:center;width:100%}
.hd{width:var(--s);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:28px;font-weight:600}
.sz{display:flex;gap:4px;background:#2a1f42;border-radius:12px;padding:4px}
.sz button{border:0;background:none;color:var(--mut);min-height:44px;min-width:56px;border-radius:9px;font:600 15px Fredoka;cursor:pointer}
.sz button[aria-pressed=true]{background:#4a3880;color:#fff}
.st{width:var(--s);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st div{background:#2a1f42;border-radius:12px;padding:8px 12px;text-align:center}.st small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.st b{font:600 22px Fredoka;font-variant-numeric:tabular-nums}
.bd{position:relative;width:var(--s);height:var(--s);background:#2a1f42;border-radius:16px;padding:8px;touch-action:none;box-shadow:0 20px 50px #0006}
.in{position:relative;width:100%;height:100%}
.sl{position:absolute;border-radius:12px;background:#1a1228;opacity:.9}
.t{position:absolute;border:0;border-radius:12px;color:#fff;font:600 var(--f) Fredoka;cursor:pointer;display:grid;place-items:center;transition:transform .18s cubic-bezier(.3,.9,.4,1);box-shadow:inset 0 -4px 0 #0003,0 3px 8px #0004;text-shadow:0 2px 0 #0003;padding:0}
.t:active{filter:brightness(1.1)}
.t:focus-visible{outline:3px solid var(--mi);outline-offset:2px;z-index:2}
.t.ok{box-shadow:inset 0 -4px 0 #0003,0 0 0 2px #5eead4aa}
.ov{position:absolute;inset:0;border-radius:16px;background:#1e1530ee;display:grid;place-items:center;text-align:center;gap:10px;align-content:center;animation:f .35s;z-index:5}
@keyframes f{from{opacity:0}}
.ov h2{margin:0;font-size:32px;color:var(--mi)}.ov p{margin:0;color:var(--mut)}
.b{border:0;background:var(--mi);color:#0d2b27;border-radius:12px;min-height:48px;padding:0 24px;font:600 16px Fredoka;cursor:pointer}
.nw{background:#4a3880;color:#fff;min-height:44px;padding:0 18px;border-radius:12px;border:0;font:600 15px Fredoka;cursor:pointer}
.hn{color:var(--mut);font-size:14px}
button:focus-visible{outline:3px solid var(--mi);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.t{transition:none}.ov{animation:none}}
</style></head><body><div class="m"><div class="hd"><h1>Slidewell</h1><div class="sz" role="group" aria-label="Grid size" id="sz"></div></div>
<div class="st"><div><small>Moves</small><b id="mv">0</b></div><div><small>Time</small><b id="tm">0:00</b></div><div><small>Best</small><b id="bs">—</b></div></div>
<div class="bd" id="bd" role="group" aria-label="Puzzle board"><div class="in" id="in"></div><div class="ov" id="ov" hidden><h2>Solved!</h2><p id="ow"></p><button class="b" id="pa">Play again</button></div></div>
<button class="nw" id="nw">New game</button><div class="hn">Click a tile, swipe, or use the arrow keys.</div></div>
<div id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden"></div>
<script>
const $=s=>document.querySelector(s);let N=4,g=[],moves=0,secs=0,iv=null,started=false,won=false,best={},foc=null;
const say=m=>{const l=$("#live");l.textContent="";setTimeout(()=>l.textContent=m,60)};
["3","4","5"].forEach(n=>{const b=document.createElement("button");b.textContent=n+"×"+n;b.setAttribute("aria-pressed",+n==N);b.onclick=()=>{N=+n;document.querySelectorAll("#sz button").forEach(x=>x.setAttribute("aria-pressed",x==b));newGame()};$("#sz").append(b)});
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function solved(){const a=[];for(let i=1;i<N*N;i++)a.push(i);a.push(0);return a}
function shuffle(){g=solved();let e=N*N-1,prev=-1;for(let k=0;k<N*N*40;k++){const r=Math.floor(e/N),c=e%N,opts=[];if(r>0)opts.push(e-N);if(r<N-1)opts.push(e+N);if(c>0)opts.push(e-1);if(c<N-1)opts.push(e+1);const o=opts.filter(x=>x!=prev),pick=o[Math.floor(Math.random()*o.length)];g[e]=g[pick];g[pick]=0;prev=e;e=pick}if(g.every((v,i)=>v==solved()[i]))shuffle()}
function size(){const w=$("#in").clientWidth,cell=w/N;document.documentElement.style.setProperty("--f",Math.round(cell*.42)+"px");return cell}
function build(){const inn=$("#in");inn.innerHTML="";const cell=size(),gap=4;inn.dataset.cell=cell;const sl=document.createElement("div");sl.className="sl";inn.append(sl);g.forEach((v,i)=>{if(!v)return;const b=document.createElement("button");b.className="t";b.dataset.v=v;const h=Math.round(8+(v/(N*N-1))*0)+ (v/(N*N-1))*0;b.style.background=`linear-gradient(135deg,hsl(${8+v/(N*N-1)*258} 80% 62%),hsl(${8+v/(N*N-1)*258+24} 70% 52%))`;b.textContent=v;inn.append(b)});layout()}
function layout(){const inn=$("#in"),cell=size(),gap=4;const e=g.indexOf(0);const sl=inn.querySelector(".sl");sl.style.cssText=`width:${cell-gap*2}px;height:${cell-gap*2}px;transform:translate(${e%N*cell+gap}px,${Math.floor(e/N)*cell+gap}px)`;inn.querySelectorAll(".t").forEach(b=>{const v=+b.dataset.v,i=g.indexOf(v),r=Math.floor(i/N),c=i%N;b.style.width=b.style.height=cell-gap*2+"px";b.style.transform=`translate(${c*cell+gap}px,${r*cell+gap}px)`;b.style.left=b.style.top="0";b.setAttribute("aria-label",`Tile ${v}, row ${r+1}, column ${c+1}`);b.classList.toggle("ok",v==i+1);b.tabIndex=foc==v||(foc==null&&i==0)?0:-1});}
$("#in").addEventListener("click",e=>{const b=e.target.closest(".t");if(!b)return;tryMove(+b.dataset.v)});
function tryMove(v){if(won)return;const i=g.indexOf(v),e=g.indexOf(0),r=Math.floor(i/N),c=i%N,er=Math.floor(e/N),ec=e%N;if(r!=er&&c!=ec){say("That tile can't move");return}const dr=Math.sign(er-r),dc=Math.sign(ec-c);let cur=e;while(cur!=i){const prev=cur-(dr*N+dc);g[cur]=g[prev];g[prev]=0;cur=prev}go();foc=v;layout();const b=document.querySelector(`.t[data-v="${v}"]`);b&&b.focus({preventScroll:true})}
function go(){moves++;$("#mv").textContent=moves;if(!started){started=true;iv=setInterval(()=>{secs++;$("#tm").textContent=fmt(secs)},1000)}layout();if(g.every((v,i)=>v==solved()[i]))win()}
function win(){won=true;clearInterval(iv);const b=best[N];let nb="";if(!b||moves<b.m){best[N]={m:moves,t:secs};nb=" New best!"}$("#bs").textContent=best[N].m+" moves";$("#ow").textContent=`${moves} moves in ${fmt(secs)}.${nb}`;setTimeout(()=>{$("#ov").hidden=false;$("#pa").focus()},rm?0:350);say(`Solved in ${moves} moves.${nb}`)}
const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
function arrow(dir){if(won)return;const e=g.indexOf(0),r=Math.floor(e/N),c=e%N;let t=null;if(dir=="ArrowUp"&&r<N-1)t=e+N;else if(dir=="ArrowDown"&&r>0)t=e-N;else if(dir=="ArrowLeft"&&c<N-1)t=e+1;else if(dir=="ArrowRight"&&c>0)t=e-1;if(t!=null)tryMove(g[t])}
document.addEventListener("keydown",e=>{if(e.key.startsWith("Arrow")){e.preventDefault();arrow(e.key)}});
let sx,sy;$("#bd").addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY});$("#bd").addEventListener("pointerup",e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.max(Math.abs(dx),Math.abs(dy))<40)return;const k=Math.abs(dx)>Math.abs(dy)?(dx>0?"ArrowRight":"ArrowLeft"):(dy>0?"ArrowDown":"ArrowUp");arrow(k)});
function newGame(){clearInterval(iv);moves=0;secs=0;started=false;won=false;foc=null;$("#mv").textContent=0;$("#tm").textContent="0:00";$("#bs").textContent=best[N]?best[N].m+" moves":"—";$("#ov").hidden=true;shuffle();build();say(`New ${N} by ${N} game`)}
$("#nw").onclick=newGame;$("#pa").onclick=newGame;addEventListener("resize",layout);newGame();
</script></body></html>
