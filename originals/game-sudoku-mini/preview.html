<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=DM+Mono:wght@500&family=Figtree:wght@500;700&family=Newsreader:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#4a2e18;color:#1f1b16;font:500 15px/1.5 Figtree,system-ui,sans-serif;overflow-x:hidden;position:relative}
.bgp{position:fixed;inset:0;z-index:0;pointer-events:none}.bgp svg{width:100%;height:100%;display:block}
:focus-visible{outline:3px solid #1f1b16;outline-offset:3px;box-shadow:0 0 0 6px #fff}
.w{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:18px 12px 34px}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:#fbf5e6;border:1px solid #d8cdb2;border-radius:16px;padding:8px 12px;margin-bottom:12px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.df{display:inline-flex;border:1.5px solid #1f1b16;border-radius:10px;overflow:hidden}.df label{position:relative}.df input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}.df span{display:block;min-height:44px;line-height:44px;padding:0 14px;font-weight:700;background:#fff}
.df input:checked+span{background:#1f1b16;color:#fff}.df input:focus-visible+span{outline:3px solid #8a4b1f;outline-offset:-3px}
.tm{font:500 22px "DM Mono",monospace;margin-left:auto;font-variant-numeric:tabular-nums}
.bt{font:700 14px Figtree;color:#1f1b16;background:#fff;border:1.5px solid #1f1b16;border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}.bt:hover:not(:disabled){background:#f3ead2}.bt[aria-pressed=true]{background:#1f1b16;color:#fff}.bt:disabled{opacity:.4;cursor:not-allowed}
.sh{position:relative;background:#fbf5e6;border-radius:4px;padding:18px 18px 16px;transform:rotate(-1deg);box-shadow:0 2px 3px rgba(0,0,0,.3),0 24px 48px rgba(0,0,0,.5),inset 0 0 60px rgba(150,110,50,.12)}
.sh:before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .4 0 0 0 0 .3 0 0 0 .35 0'/></filter><rect width='200' height='200' filter='url(%23f)'/></svg>");opacity:.3;mix-blend-mode:multiply;pointer-events:none;border-radius:4px}

.c{position:relative;border:0;border-right:1px solid rgba(31,27,22,.55);border-bottom:1px solid rgba(31,27,22,.55);background:transparent;padding:0;cursor:pointer;font:600 clamp(24px,7vw,34px) Newsreader,serif;color:#1f1b16;display:grid;place-items:center;aspect-ratio:1}

.ac{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,460px);margin:0 auto}

function place(v){if(S.done||S.given[S.sel])return;snap();if(S.nm){var n=S.notes[S.sel],k=n.indexOf(v);if(S.g[S.sel]){S.g[S.sel]=0}if(k>-1)n.splice(k,1);else n.push(v);n.sort()}else{S.g[S.sel]=(S.g[S.sel]===v?0:v);S.notes[S.sel]=[];if(S.g[S.sel]){var r=Math.floor(S.sel/6),c=S.sel%6;for(var i=0;i<36;i++){var rr=Math.floor(i/6),cc=i%6;if(rr===r||cc===c||(Math.floor(rr/2)===Math.floor(r/2)&&Math.floor(cc/3)===Math.floor(c/3))){var x=S.notes[i].indexOf(v);if(x>-1)S.notes[i].splice(x,1)}}}}if(!S.run&&!S.done)startTimer();render();var cf=conflicts();if(!S.nm&&S.g[S.sel]&&cf[S.sel])say('Conflict with another '+S.g[S.sel]+' in this row, column or box.');checkWin()}
function erase(){if(S.done||S.given[S.sel])return;snap();S.g[S.sel]=0;S.notes[S.sel]=[];render()}
function undo(){if(!S.hist.length)return;var h=S.hist.pop();S.g=h.g;S.notes=h.n;render();say('Undone.')}
function hint(){if(S.done)return;var emp=[];for(var i=0;i<36;i++)if(S.g[i]!==S.sol[i])emp.push(i);if(!emp.length)return;var i=(S.g[S.sel]!==S.sol[S.sel]&&!S.given[S.sel])?S.sel:emp[Math.floor(Math.random()*emp.length)];snap();S.g[i]=S.sol[i];S.notes[i]=[];S.given[i]=false;S.hints++;S.sel=i;if(!S.run)startTimer();say('Hint: the cell in row '+(Math.floor(i/6)+1)+', column '+(i%6+1)+' must be '+S.sol[i]+'.');render();checkWin()}
function check(){var cf=Object.keys(conflicts()).length;var wrong=0;S.g.forEach(function(v,i){if(v&&v!==S.sol[i])wrong++});var m=cf?cf+' cell'+(cf===1?'':'s')+' conflict.':wrong?'Some entries are not correct yet.':'Looks good so far.';$('#stt').textContent=m;say(m)}
function checkWin(){for(var i=0;i<36;i++)if(S.g[i]!==S.sol[i])return;S.done=true;S.run=false;clearInterval(S.iv);var t=S.t,key=S.clues;if(!S.best[key]||t<S.best[key])S.best[key]=t;try{localStorage.setItem('pp-su',JSON.stringify(S.best))}catch(e){}$('#sp').classList.add('on');var m='Solved in '+fmt(t)+'. Nicely done.'+(S.hints?' Hints used: '+S.hints+'.':'');$('#stt').textContent=m;say(m)}
function fmt(t){return('0'+Math.floor(t/60)).slice(-2)+':'+('0'+t%60).slice(-2)}
function startTimer(){S.run=true;clearInterval(S.iv);S.iv=setInterval(function(){if(document.hidden||S.done)return;S.t++;$('#tm').textContent=fmt(S.t)},1000)}
$('#pd').addEventListener('click',function(e){var b=e.target.closest('button');if(b)place(+b.dataset.n)});
$('#er').onclick=erase;$('#un').onclick=undo;$('#hi').onclick=hint;$('#ck').onclick=check;$('#ng').onclick=function(){clearInterval(S.iv);$('#tm').textContent='00:00';newGame()};
$('#nt').onclick=function(){S.nm=!S.nm;this.setAttribute('aria-pressed',S.nm);this.textContent='Notes: '+(S.nm?'on':'off')};
document.querySelectorAll('input[name=df]').forEach(function(r){r.onchange=function(){S.clues=+r.value;$('#ng').click()}});
document.addEventListener('keydown',function(e){if(e.target.closest&&e.target.closest('input,select,textarea'))return;if(/^[1-6]$/.test(e.key)){if(e.shiftKey){var was=S.nm;S.nm=true;place(+e.key);S.nm=was}else place(+e.key)}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();erase()}else if(e.key==='n'||e.key==='N')$('#nt').click();else if(e.key==='z'||e.key==='Z')undo()});
// shift+digit gives symbols on some keyboards; map via code
document.addEventListener('keydown',function(e){if(e.shiftKey&&/^Digit[1-6]$/.test(e.code)&&!/^[1-6]$/.test(e.key)){var was=S.nm;S.nm=true;place(+e.code.slice(5));S.nm=was}});
newGame();
})();
