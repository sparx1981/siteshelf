<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whack A Mole — Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#8fd0f0;color:#1c2a16;font:400 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:hidden;position:relative}
.bgp{position:fixed;inset:0;z-index:0;pointer-events:none}.bgp svg{width:100%;height:100%;display:block}
:focus-visible{outline:3px solid #1c2a16;outline-offset:3px;box-shadow:0 0 0 6px #fff}
.w{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:16px 12px 30px;text-align:center}
.eb{font:700 12px Nunito;letter-spacing:.16em;text-transform:uppercase;color:#1f5a2c;margin:0}
h1{font:700 clamp(32px,6vw,56px)/1 "Baloo 2",sans-serif;margin:0 0 8px;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.st{background:rgba(28,42,22,.88);color:#fff;border-radius:14px;padding:4px 14px;min-width:84px}.st small{display:block;font:700 11px Nunito;letter-spacing:.1em;text-transform:uppercase;color:#cfe8c0}.st b{font:700 26px "Baloo 2";font-variant-numeric:tabular-nums;line-height:1.1}
.st.t b{font-size:34px}.st.cb b{color:#ffcf3d}
.df{display:inline-flex;border:2px solid #1c2a16;border-radius:14px;overflow:hidden;background:#fff;margin-bottom:10px}
.df label{position:relative}.df input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}.df span{display:block;min-height:46px;line-height:46px;padding:0 16px;font-weight:700}
.df input:checked+span{background:#1c2a16;color:#fff}.df input:focus-visible+span{outline:3px solid #2f6b3a;outline-offset:-3px}
.pn{position:relative;margin:0 auto;width:min(100%,560px);aspect-ratio:1;border-radius:22px;border:3px solid #2f6b3a;overflow:hidden;box-shadow:0 20px 40px rgba(20,60,20,.3);background:#6fbf4a;touch-action:manipulation}
.pn>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.gr{position:absolute;inset:4%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2%}
.h{position:relative;border:0;background:none;padding:0;cursor:pointer;overflow:visible;min-height:80px}
.h svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.h .bd{position:absolute;left:6%;top:6%;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.85);font:700 14px Nunito;color:#1c2a16;display:grid;place-items:center;z-index:3}

.ham{position:fixed;left:0;top:0;width:64px;height:64px;pointer-events:none;z-index:50;transform:translate(-20px,-40px) rotate(-30deg);transition:transform .06s;display:none}
.ham.sw{transform:translate(-20px,-30px) rotate(25deg)}
@media(pointer:fine){.pn{cursor:none}.ham.on{display:block}}
.ov{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:rgba(28,42,22,.55);backdrop-filter:blur(2px)}
.ov div{background:#fff;border-radius:18px;padding:16px 22px;max-width:80%}.ov h2{font:700 30px "Baloo 2";margin:0}.ov p{margin:4px 0 10px}
.go{font:700 18px Nunito;color:#1c2a16;background:#ffcf3d;border:0;border-radius:12px;min-height:50px;padding:0 24px;cursor:pointer}.go:hover{background:#ffdc6a}
.ct{display:flex;gap:8px;justify-content:center;margin-top:10px}.ct button{font:700 14px Nunito;color:#1c2a16;background:#fff;border:2px solid #1c2a16;border-radius:12px;min-height:46px;padding:0 16px;cursor:pointer}
.lg{margin:8px 0 0;font-size:14px;color:#1c2a16;background:rgba(255,255,255,.7);display:inline-block;border-radius:10px;padding:2px 12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:520px){.gr{inset:3%;gap:1.5%}}
@media(prefers-reduced-motion:reduce){.h .mo{transition:none}.fx{animation:none;opacity:1}.ham,.ham.sw{transition:none}}
</style></head><body>
<div class="bgp" id="bgp" aria-hidden="true"></div>

<div class="ov" id="ov"><div><h2 id="oh">Ready?</h2><p id="op">Press Start or Space</p><button class="go" id="go" type="button">Start</button></div></div></div>
<div class="ct"><button id="pz" type="button">Pause</button></div><p class="lg">Hit moles. Golden moles are worth 3x. Do not hit gnomes. Keys 1 to 9 match the number pad.</p>
<svg class="ham" id="ham" viewBox="0 0 64 64" aria-hidden="true"><rect x="28" y="22" width="8" height="40" rx="3" fill="#a8743a"/><rect x="8" y="4" width="48" height="24" rx="7" fill="#d9a05a" stroke="#6a4420" stroke-width="3"/><rect x="12" y="8" width="40" height="5" rx="2" fill="#fff" opacity=".35"/></svg>
<div class="sr" id="live" aria-live="polite"></div><p class="sr" id="stat"></p></main>
