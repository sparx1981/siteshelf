<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Search — Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--ac:#1f7a8c;--ac2:#ff7a59}
body{margin:0;min-height:100vh;background:#e4f2f4;color:#1d2433;font:400 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:hidden;position:relative}

.w{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:18px 14px 36px}
.eb{font:700 12px Nunito;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin:0}

.th input:checked+span{background:var(--ac);color:#fff}.th input:focus-visible+span{outline:3px solid #1d2433;outline-offset:-3px}
.bt{font:700 14px Nunito;color:#1d2433;background:#fff;border:1.5px solid #1d2433;border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}.bt:hover{background:#f3ead2}
.tm{font:500 20px "DM Mono",monospace;margin-left:auto}.fd{font-weight:700}
.main{display:grid;grid-template-columns:minmax(0,560px) 1fr;gap:18px;align-items:start}
.sh{background:#fffaf0;border:1px solid #e6d9c0;border-radius:22px;padding:14px;box-shadow:0 18px 40px rgba(20,60,80,.18)}
.gw{position:relative;width:100%;aspect-ratio:1;touch-action:none;user-select:none}
.gd{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(12,1fr);background:repeating-linear-gradient(transparent 0 calc(100%/12 - 1px),rgba(120,140,170,.15) calc(100%/12 - 1px) calc(100%/12))}

.c:hover{background:#eef5f7}.c.hn:after{content:"";position:absolute;inset:2px;border-radius:50%;border:3px solid var(--ac2);animation:hn 1s ease-in-out infinite}@keyframes hn{50%{transform:scale(1.15);opacity:.5}}
.c.st:before{content:"\25B6";position:absolute;left:-1px;top:-3px;font-size:10px;color:var(--ac2)}
.ov{position:absolute;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}
.li{background:rgba(255,250,240,.94);border:1px solid #e6d9c0;border-radius:22px;padding:14px 16px}
.li h2{font:600 22px Fredoka;margin:0 0 8px}

.sm{margin-top:10px;font-weight:700;min-height:24px}
.star{position:absolute;width:18px;height:18px;color:#f2c14e;pointer-events:none;z-index:4}

@media(prefers-reduced-motion:reduce){.c.hn:after{animation:none}}

<div class="sr" id="live" aria-live="polite"></div></main>

var er=s.r+d[0]*len,ec=s.c+d[1]*len;while((er<0||er>11||ec<0||ec>11)&&len>0){len--;er=s.r+d[0]*len;ec=s.c+d[1]*len}return{r:er,c:ec}}
function capsule(a,b,col,fixed,id){var cw=100/12,x1=(a.c+.5)*cw,y1=(a.r+.5)*cw,x2=(b.c+.5)*cw,y2=(b.r+.5)*cw,len=Math.hypot(x2-x1,y2-y1),ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI,h=cw*.78;return'<g'+(id?' id="'+id+'"':'')+' transform="translate('+x1+' '+y1+') rotate('+ang+')"><rect x="'+(-h/2)+'" y="'+(-h/2)+'" width="'+(len+h)+'" height="'+h+'" rx="'+(h/2)+'" fill="'+col+'" fill-opacity="'+(fixed?.55:.5)+'" stroke="'+col+'" stroke-width=".5"/></g>'}
function redraw(prev){var s='';Object.keys(S.found).forEach(function(w){var f=S.found[w];s+=capsule(f.a,f.b,f.c,true)});if(prev)s+=capsule(prev.a,prev.b,'#e6b800',false);$('#ov').setAttribute('viewBox','0 0 100 100');$('#ov').innerHTML=s}
function cellsOn(a,b){var dr=Math.sign(b.r-a.r),dc=Math.sign(b.c-a.c),n=Math.max(Math.abs(b.r-a.r),Math.abs(b.c-a.c)),out=[];for(var i=0;i<=n;i++)out.push({r:a.r+dr*i,c:a.c+dc*i});return out}
function check(a,b){var cs=cellsOn(a,b),w=cs.map(function(p){return S.g[p.r*12+p.c]}).join(''),rw=w.split('').reverse().join(''),hit=null;S.words.forEach(function(x){if(!S.found[x]&&(x===w||x===rw))hit=x});
if(hit){var col=CAPS[Object.keys(S.found).length%6];S.found[hit]={a:a,b:b,c:col};list();upd();var n=Object.keys(S.found).length;say('Found '+hit.toUpperCase()+'. '+n+' of 10.');star(b);if(n===10)win();return true}return false}
function star(p){if(reduce)return;var s=document.createElement('span');s.className='star';s.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 7 7 .6-5.300 4.700 1.700 7.200L12 17.800 5.600 21.500l1.700-7.200L2 9.600 9 9z"/></svg>';s.style.left=((p.c+.5)/12*100-2)+'%';s.style.top=((p.r+.5)/12*100-2)+'%';$('#gw').appendChild(s);s.animate([{transform:'scale(.4)',opacity:1},{transform:'scale(2.4) translateY(-14px)',opacity:0}],{duration:700,fill:'forwards'}).onfinish=function(){s.remove()}}
function win(){clearInterval(S.iv);S.run=false;var k=S.th;if(!S.best[k]||S.t<S.best[k])S.best[k]=S.t;try{localStorage.setItem('sp-ws',JSON.stringify(S.best))}catch(e){}var m='You found all 10 words in '+fmt(S.t)+'. Best '+fmt(S.best[k])+'.'+(S.hints?' Hints used: '+S.hints+'.':'');$('#sm').textContent=m;say(m)}
// pointer
var gw=$('#gw');
gw.addEventListener('pointerdown',function(e){if(!e.target.closest('.c'))return;startT();e.preventDefault();gw.setPointerCapture(e.pointerId);var p=cellAt(e);S.drag={s:p,e:p};redraw({a:p,b:p})});
gw.addEventListener('pointermove',function(e){if(!S.drag)return;var p=snapEnd(S.drag.s,cellAt(e));S.drag.e=p;redraw({a:S.drag.s,b:p})});
function up(){if(!S.drag)return;var d=S.drag;S.drag=null;var hit=(d.s.r!==d.e.r||d.s.c!==d.e.c)&&check(d.s,d.e);redraw(null)}
gw.addEventListener('pointerup',up);gw.addEventListener('pointercancel',function(){S.drag=null;redraw(null)});
// keyboard
function kb(i){startT();var p={r:Math.floor(i/12),c:i%12};if(S.ks==null){S.ks=i;cells[i].classList.add('st');say('Start set at row '+(p.r+1)+', column '+(p.c+1)+'. Move along a line and press Space again.');redraw({a:p,b:p})}else{var s={r:Math.floor(S.ks/12),c:S.ks%12},e=snapEnd(s,p);var ok=(s.r!==e.r||s.c!==e.c)&&check(s,e);cells[S.ks].classList.remove('st');S.ks=null;redraw(null);if(!ok)say('No word there.')}}
function preview(si,ti){var s={r:Math.floor(si/12),c:si%12},t={r:Math.floor(ti/12),c:ti%12};redraw({a:s,b:snapEnd(s,t)})}
function cancel(){if(S.ks!=null){cells[S.ks].classList.remove('st');S.ks=null;redraw(null);say('Selection cancelled.')}}
$('#hi').onclick=function(){var un=S.words.filter(function(w){return!S.found[w]});if(!un.length)return;var w=un[Math.floor(Math.random()*un.length)],p=S.pos[w],i=p.r*12+p.c;S.hints++;cells[i].classList.add('hn');setTimeout(function(){cells[i].classList.remove('hn')},3000);say('Hint: a word starts at row '+(p.r+1)+', column '+(p.c+1)+'.')};
$('#ng').onclick=newGame;
document.querySelectorAll('input[name=th]').forEach(function(r){r.onchange=function(){S.th=r.value;newGame()}});
newGame();
})();
</script></body></html>
