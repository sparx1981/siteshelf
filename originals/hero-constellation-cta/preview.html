<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constellation CTA Hero — Hero Section</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:linear-gradient(#070b1a,#0d1633);color:#eef3ff;font:400 17px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden;display:flex;flex-direction:column}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 80% 15%,rgba(190,210,255,.18),transparent 40%);pointer-events:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
:focus-visible{outline:3px solid #ffd37a;outline-offset:4px;border-radius:99px}
header,main,.facts{position:relative;z-index:2}
header{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(18px,4vw,56px)}
.logo{font:600 22px Fraunces,serif;display:flex;align-items:center;gap:10px}.logo i{width:12px;height:12px;border-radius:50%;background:#ffd37a;box-shadow:0 0 14px #ffd37a}
header a{color:#a9b8e0;text-decoration:none;font-size:15px}header a:hover{color:#fff}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.lab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#ffd37a;margin-bottom:20px}
h1{font:600 clamp(44px,8.5vw,112px)/1 Fraunces,serif;letter-spacing:-.02em;margin:0 0 22px;max-width:12ch}h1 em{color:#ffd37a}
.sub{max-width:50ch;color:#a9b8e0;margin:0 0 32px}
.row{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}
.cta{font:600 16px Inter,sans-serif;background:#ffd37a;color:#070b1a;border:0;padding:16px 32px;border-radius:99px;cursor:pointer;position:relative;transition:transform .25s,box-shadow .25s;min-width:180px}
.cta:hover,.cta:focus-visible{transform:scale(1.05);box-shadow:0 0 0 8px rgba(255,211,122,.15),0 12px 40px rgba(255,211,122,.35)}
.row a{color:#eef3ff;font-weight:500}
.facts{display:flex;gap:clamp(16px,4vw,48px);justify-content:center;flex-wrap:wrap;padding:24px 20px 30px;font-size:14px;color:#a9b8e0;border-top:1px solid rgba(255,255,255,.08);margin:0 clamp(18px,4vw,56px)}
.facts b{color:#eef3ff;font-weight:600}
@media(max-width:700px){h1{font-size:12vw}}
</style></head><body>
<canvas id="cv" aria-hidden="true"></canvas>
<header><div class="logo"><i></i>Nightjar</div><a href="#">Sky tonight</a></header>
<main><div class="lab">Stargazing, simplified</div>
<h1>Every star has <em>stories.</em></h1>
<p class="sub">Point your phone at the sky and Nightjar names the stars, planets and satellites above you, with the myths behind them.</p>
<div class="row"><button class="cta" id="cta" type="button">Join the beta</button><a href="#">How it works</a></div></main>
<div class="facts"><span><b>88</b> constellations</span><span><b>Works</b> offline</span><span><b>Free</b> for the first year</span></div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),cta=document.getElementById('cta'),W,H,S=[],px=-999,py=-999,hot=false,ripple=0,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,seed=7;
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
function size(){var d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);var n=W<700?50:90;S=[];for(var i=0;i<n;i++)S.push({x:rnd()*W,y:rnd()*H,vx:(rnd()-.5)*.22,vy:(rnd()-.5)*.22,r:.6+rnd()*1.2,f:.5+rnd()*1.5,p:rnd()*6})}
function btn(){var r=cta.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
function draw(t){
ctx.clearRect(0,0,W,H);var b=btn(),i,j,s,o,d;
for(i=0;i<S.length;i++){s=S[i];
if(!reduce){if(hot){var dx=b[0]-s.x,dy=b[1]-s.y,dd=Math.sqrt(dx*dx+dy*dy)+1;if(dd<420){s.vx+=dx/dd*.012;s.vy+=dy/dd*.012;var sp=Math.hypot(s.vx,s.vy);if(sp>1.2){s.vx*=1.2/sp;s.vy*=1.2/sp}}}else{s.vx*=.995;s.vy*=.995;if(Math.hypot(s.vx,s.vy)<.08){s.vx+=(rnd()-.5)*.01;s.vy+=(rnd()-.5)*.01}}
s.x+=s.vx;s.y+=s.vy;if(s.x<0)s.x=W;if(s.x>W)s.x=0;if(s.y<0)s.y=H;if(s.y>H)s.y=0}
var a=.55+.45*Math.sin(t*.001*s.f+s.p);ctx.fillStyle='rgba(219,230,255,'+a.toFixed(2)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fill();
for(j=i+1;j<S.length;j++){o=S[j];d=Math.hypot(s.x-o.x,s.y-o.y);if(d<130){ctx.strokeStyle='rgba(143,176,255,'+((1-d/130)*.3).toFixed(3)+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(o.x,o.y);ctx.stroke()}}
d=Math.hypot(s.x-px,s.y-py);if(d<180){ctx.strokeStyle='rgba(255,211,122,'+((1-d/180)*.5).toFixed(3)+')';ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(px,py);ctx.stroke()}}
if(hot||ripple>0){var near=S.map(function(q){return{q:q,d:Math.hypot(q.x-b[0],q.y-b[1])}}).sort(function(a,c){return a.d-c.d}).slice(0,12);
ctx.strokeStyle='rgba(255,211,122,'+(hot?.45:ripple*.6)+')';near.forEach(function(n){ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(n.q.x,n.q.y);ctx.stroke()});ripple=Math.max(0,ripple-.02)}
}
function loop(t){draw(t);if(!reduce)requestAnimationFrame(loop)}
addEventListener('resize',function(){size();draw(0)});
addEventListener('pointermove',function(e){px=e.clientX;py=e.clientY});addEventListener('pointerleave',function(){px=py=-999});
['pointerenter','focus'].forEach(function(e){cta.addEventListener(e,function(){hot=true})});['pointerleave','blur'].forEach(function(e){cta.addEventListener(e,function(){hot=false})});
cta.addEventListener('click',function(){ripple=1;cta.textContent="You're on the list";setTimeout(function(){cta.textContent='Join the beta'},3000)});
size();if(reduce)draw(2000);else requestAnimationFrame(loop);
})();
</script></body></html>
