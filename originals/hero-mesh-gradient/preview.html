<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prismly — Mesh Gradient Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:#0b0b18;color:#fff;font:17px/1.55 Inter,system-ui,sans-serif}
.hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2;display:block}
.sc{position:absolute;inset:0;background:rgba(8,8,16,.35);z-index:-1}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 28px}
.lg{font:800 22px "Bricolage Grotesque";display:flex;gap:8px;align-items:center}.lg i{width:20px;height:20px;border-radius:6px;background:conic-gradient(#fff,#ffffff66,#fff)}
.ls{display:flex;gap:4px;align-items:center}.ls a{color:#fff;text-decoration:none;font-weight:500;padding:0 14px;min-height:44px;display:inline-flex;align-items:center;border-radius:99px}.ls a:hover{background:#ffffff1f}
.ls .si{border:1px solid #ffffff55}
main{flex:1;display:grid;place-items:center;text-align:center;padding:24px 20px 110px}
.in{max-width:920px;display:grid;gap:26px;justify-items:center}
.bd{display:inline-flex;gap:8px;align-items:center;background:#ffffff20;border:1px solid #ffffff40;backdrop-filter:blur(8px);border-radius:99px;padding:6px 16px;font-weight:600;font-size:14px}
.bd b{background:#fff;color:#111;border-radius:99px;padding:0 8px;font-size:11px;text-transform:uppercase}
h1{margin:0;font:800 clamp(44px,8vw,104px)/.98 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.rw{display:inline-block;transition:width .4s;position:relative;vertical-align:bottom;overflow:hidden;height:1.05em;min-width:3ch}
.rw span{display:block;width:max-content;transition:transform .5s,opacity .5s;font-style:italic;font-weight:700}
.rw span.out{position:absolute;left:0;top:0;transform:translateY(-100%);opacity:0}
.rw span.in{animation:ri .5s}
@keyframes ri{from{transform:translateY(100%);opacity:0}}
p.l{margin:0;max-width:600px;font-size:19px;color:#ffffffd0}
.bt{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.b{display:inline-flex;gap:10px;align-items:center;justify-content:center;border-radius:99px;min-height:54px;padding:0 28px;font:700 16px Inter;text-decoration:none;cursor:pointer;border:0;transition:transform .15s}
.b:hover{transform:translateY(-2px)}
.b.p{background:#fff;color:#111}.b.s{background:#ffffff1f;color:#fff;border:1px solid #ffffff55;backdrop-filter:blur(8px)}
.pf{display:flex;gap:14px;align-items:center;color:#ffffffd0;font-size:15px}
.av{display:flex}.av i{width:34px;height:34px;border-radius:50%;border:2px solid #fff;margin-left:-10px;display:grid;place-items:center;font:700 13px Inter;font-style:normal;color:#111}.av i:first-child{margin:0}
.pk{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:6px;background:#0008;backdrop-filter:blur(10px);border:1px solid #ffffff30;padding:6px;border-radius:99px}
.pk button{display:flex;gap:8px;align-items:center;border:0;background:none;color:#fff;border-radius:99px;padding:0 14px;min-height:44px;font:600 13px Inter;cursor:pointer}
.pk button[aria-pressed=true]{background:#ffffff2e}
.pk i{width:16px;height:16px;border-radius:50%;display:block}
a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:640px){.ls a:not(.si){display:none}nav{padding:12px 16px}.b{width:100%}.bt{width:100%;max-width:340px}.pk button span{display:none}.pf{flex-direction:column;gap:8px}}
@media(prefers-reduced-motion:reduce){.rw span{transition:none}.rw span.in{animation:none}}
</style></head><body><div class="hero"><canvas id="cv" aria-hidden="true"></canvas><div class="sc"></div>
<nav aria-label="Main"><div class="lg"><i></i>Prismly</div><div class="ls"><a href="#">Product</a><a href="#">Pricing</a><a href="#">Docs</a><a class="si" href="#">Sign in</a></div></nav>
<main><div class="in"><div class="bd"><b>New</b> Prism 2.0 is here</div>
<h1><span class="sr">Design systems that feel alive, effortless, yours.</span><span aria-hidden="true">Design systems that feel <span class="rw" id="rw"><span id="w1" class="in">alive</span></span></span></h1>
<p class="l">Prismly turns tokens, components and docs into one living system your whole team actually uses.</p>
<div class="bt"><a class="b p" href="#">Get started free</a><a class="b s" href="#"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1l10 6-10 6z" fill="currentColor"/></svg>Watch demo</a></div>
<div class="pf"><div class="av" aria-hidden="true"><i style="background:#ffd6e0">M</i><i style="background:#d6f0ff">T</i><i style="background:#e0ffd6">I</i><i style="background:#fff3c4">P</i></div><span>Loved by 8,000 designers</span></div></div></main>
<div class="pk" role="group" aria-label="Background palette" id="pk"></div></div>
<script>
const $=s=>document.querySelector(s);
const PAL={Aurora:["#7c4dff","#00d4c0","#ff4fa3","#3d5afe","#00b3ff"],Sunset:["#ff8a3d","#ff3d81","#5b3df5","#ffc23d","#c92a8f"],Ocean:["#0a6cff","#00d2ff","#00c389","#1a3fd4","#6ee7ff"],Mono:["#e5e7eb","#6b7280","#374151","#9ca3af","#111827"]};
const cv=$("#cv"),c=cv.getContext("2d");let W,H,dpr,cur=PAL.Aurora.map(hex),from=cur,to=cur,tt=1,mx=.5,my=.5,run=true,t=0;
function hex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
const B=[...Array(5)].map((_,i)=>({x:.2+.15*i,y:.3+.1*((i*3)%5),vx:0,r:.45+.1*(i%3),ph:i*1.7,s:.00025+.00008*i}));
function size(){dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0);draw()}
function draw(){c.fillStyle="#0b0b18";c.fillRect(0,0,W,H);c.globalCompositeOperation="lighter";const k=Math.min(1,tt),col=cur.map((a,i)=>a.map((v,j)=>0));B.forEach((b,i)=>{const f=from[i],g=to[i],rgb=f.map((v,j)=>Math.round(v+(g[j]-v)*k));const px=(b.x+Math.sin(t*b.s*3+b.ph)*.18+(mx-.5)*.12*(i%2?1:-1))*W,py=(b.y+Math.cos(t*b.s*2.3+b.ph)*.18+(my-.5)*.12*(i%2?-1:1))*H,r=b.r*Math.max(W,H)*.7;const gr=c.createRadialGradient(px,py,0,px,py,r);gr.addColorStop(0,`rgba(${rgb},.75)`);gr.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=gr;c.fillRect(0,0,W,H)});c.globalCompositeOperation="source-over"}
function frame(ts){if(!run)return;t=ts;if(tt<1)tt=Math.min(1,tt+16/600);draw();requestAnimationFrame(frame)}
new ResizeObserver(size).observe(cv);size();if(!rm)requestAnimationFrame(frame);
addEventListener("pointermove",e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});
document.addEventListener("visibilitychange",()=>{if(document.hidden)run=false;else if(!rm){run=true;requestAnimationFrame(frame)}});
Object.keys(PAL).forEach((k,i)=>{const b=document.createElement("button");b.setAttribute("aria-pressed",i==0);b.innerHTML=`<i style="background:linear-gradient(135deg,${PAL[k][0]},${PAL[k][1]})"></i><span>${k}</span>`;b.setAttribute("aria-label",k+" palette");b.onclick=()=>{document.querySelectorAll("#pk button").forEach(x=>x.setAttribute("aria-pressed",x==b));from=B.map((_,j)=>from[j].map((v,q)=>Math.round(v+(to[j][q]-v)*Math.min(1,tt))));to=PAL[k].map(hex);tt=0;if(rm){from=to;tt=1;draw()}};$("#pk").append(b)});
const W2=["alive","effortless","yours"];let wi=0;
if(!rm)setInterval(()=>{if(document.hidden)return;const rw=$("#rw"),old=rw.lastElementChild;old.classList.remove("in");old.classList.add("out");wi=(wi+1)%3;const n=document.createElement("span");n.textContent=W2[wi];n.className="in";rw.append(n);rw.style.width=n.offsetWidth+"px";setTimeout(()=>old.remove(),520)},2400);
</script></body></html>
