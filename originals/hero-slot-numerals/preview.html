<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slot Machine Numerals — Hero Section</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.2px) 0 0/24px 24px,#0f0f0f;color:#f5f5f0;font:400 17px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #ffe14d;outline-offset:3px;border-radius:8px}
header{display:flex;align-items:center;gap:26px;padding:22px clamp(18px,4vw,56px)}
.logo{font:700 22px 'Space Grotesk',sans-serif;margin-right:auto;display:flex;align-items:center;gap:8px}.logo i{width:10px;height:10px;background:#ffe14d;border-radius:50%}
header a{color:#a8a89c;text-decoration:none;font-size:15px}header a:hover{color:#fff}
.go{background:#ffe14d;color:#0f0f0f!important;padding:9px 18px;border-radius:99px;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:clamp(20px,5vh,70px) clamp(18px,4vw,56px) 60px;text-align:center}
.chip{display:inline-block;font:500 13px 'DM Mono',monospace;color:#ffe14d;border:1px solid #3a3a30;padding:6px 14px;border-radius:99px}
h1{font:700 clamp(30px,4.4vw,56px)/1.08 'Space Grotesk',sans-serif;letter-spacing:-.025em;margin:20px 0 34px}
.row{display:flex;gap:clamp(18px,4vw,60px);justify-content:center;align-items:flex-end;flex-wrap:wrap;margin-bottom:38px}
.fig{display:flex;flex-direction:column;align-items:center;gap:12px}
.num{display:flex;align-items:center;gap:6px}
.reel{position:relative;--h:clamp(64px,9vw,150px);height:var(--h);width:calc(var(--h)*.64);background:#1a1a18;border:2px solid #2e2e2a;border-radius:18px;overflow:hidden;-webkit-mask-image:none}
.reel:after{content:"";position:absolute;inset:0;background:linear-gradient(#1a1a18 0,transparent 22%,transparent 78%,#1a1a18 100%);pointer-events:none}
.reel div{position:absolute;left:0;right:0;top:0;will-change:transform}
.reel span{display:block;height:var(--h);line-height:var(--h);font:700 calc(var(--h)*.82)/var(--h) 'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;color:#ffe14d;text-align:center}
.sep{font:700 clamp(40px,8vw,120px)/1 'Space Grotesk',sans-serif;color:#ffe14d;padding-top:.1em}
.sm .reel{--h:clamp(44px,6vw,84px);border-radius:12px}.sm .sep{font-size:clamp(30px,4vw,56px)}
.cap{font:400 13px 'DM Mono',monospace;color:#a8a89c;letter-spacing:.04em}
.spin{background:transparent;border:1px solid #3a3a30;color:#f5f5f0;font:500 14px 'DM Mono',monospace;padding:10px 18px;border-radius:99px;cursor:pointer;margin-bottom:36px;transition:background .2s}.spin:hover{background:#1f1f1b}
form{display:flex;gap:10px;max-width:520px;margin:0 auto;flex-wrap:wrap;justify-content:center}
input{flex:1 1 240px;min-width:0;background:#1a1a18;border:1.5px solid #3a3a30;border-radius:99px;padding:15px 20px;color:#fff;font:400 16px Inter,sans-serif}
input[aria-invalid=true]{border-color:#ff6b6b}
form button{background:#ffe14d;color:#0f0f0f;border:0;border-radius:99px;padding:15px 24px;font:600 16px Inter,sans-serif;cursor:pointer;transition:transform .2s}form button:hover{transform:translateY(-2px)}
.help{font-size:14px;color:#a8a89c;margin-top:12px;min-height:22px}.help.err{color:#ff8f8f}.help.ok{color:#8df0b0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:560px){header a:not(.go){display:none}.reel{--h:clamp(56px,17vw,90px)}.sm .reel{--h:56px}}
@media(prefers-reduced-motion:reduce){.reel div{transition:none!important}}
</style></head><body>
<header><div class="logo"><i></i>Tallyho</div><a href="#">Product</a><a href="#">Pricing</a><a href="#">Docs</a><a class="go" href="#">Start free</a></header>
<main><span class="chip">Analytics without the spreadsheet</span>
<h1>Numbers that move your team.</h1>
<div class="row"><div class="fig"><div class="num" data-v="12,480" role="img" aria-label="12,480"></div><span class="cap">teams already tracking</span></div>
<div class="fig sm"><div class="num" data-v="98.6%" role="img" aria-label="98.6 percent"></div><span class="cap">uptime this year</span></div>
<div class="fig sm"><div class="num" data-v="4.9" role="img" aria-label="4.9 out of 5"></div><span class="cap">average rating</span></div></div>
<button class="spin" id="spin" type="button">↻ Spin again</button>
<form id="f" novalidate><label class="vh" for="em">Email address</label><input id="em" type="email" placeholder="you@company.com" autocomplete="email"><button type="submit">Get early access</button></form>
<p class="help" id="help" role="status">No card needed. Cancel any time.</p></main>
<script>
(function(){
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,reels=[];
document.querySelectorAll('.num').forEach(function(n){
[].forEach.call(n.dataset.v,function(ch){
if(/\d/.test(ch)){var r=document.createElement('div');r.className='reel';r.setAttribute('aria-hidden','true');var s=document.createElement('div'),h='';for(var k=0;k<40;k++)h+='<span>'+(k%10)+'</span>';s.innerHTML=h;r.appendChild(s);n.appendChild(r);reels.push({el:s,d:+ch,idx:reels.length})}
else{var p=document.createElement('span');p.className='sep';p.setAttribute('aria-hidden','true');p.textContent=ch;n.appendChild(p)}})});
function hgt(r){return r.el.parentNode.getBoundingClientRect().height}
function roll(extra){reels.forEach(function(r,i){
var h=hgt(r),loops=1+Math.floor(Math.random()*(extra?2:1))+(i%3===0?1:0),target=(10*(loops+1)+r.d)*h;
if(reduce){r.el.style.transition='none';r.el.style.transform='translateY(-'+(10+r.d)*h+'px)';return}
r.el.style.transition='none';r.el.style.transform='translateY(0)';void r.el.offsetHeight;
r.el.style.transition='transform '+(1200+i*160)+'ms cubic-bezier(.2,.9,.2,1)';r.el.style.transform='translateY(-'+target+'px)'})}
var seen=false;new IntersectionObserver(function(e){if(e[0].isIntersecting&&!seen){seen=true;roll(false)}},{threshold:.3}).observe(document.querySelector('.row'));
addEventListener('resize',function(){reels.forEach(function(r){var h=hgt(r);r.el.style.transition='none';r.el.style.transform='translateY(-'+(10*2+r.d)*h+'px)'})});
document.getElementById('spin').addEventListener('click',function(){roll(true)});
var f=document.getElementById('f'),em=document.getElementById('em'),help=document.getElementById('help');
f.addEventListener('submit',function(e){e.preventDefault();var ok=/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(em.value.trim());
em.setAttribute('aria-invalid',!ok);help.className='help '+(ok?'ok':'err');help.textContent=ok?"You're on the list, check your inbox.":'That email looks incomplete.';if(!ok)em.focus()});
})();
</script></body></html>
