<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jam Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--kw:64px;--ink:#1a1a1a;--cream:#fff8e1;--pink:#ff5c8a}
*{box-sizing:border-box}
html,body{margin:0;background:#ffd23f;color:var(--ink);font:400 20px/1.5 Karla,system-ui,sans-serif}
.hero{min-height:100svh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:28px;padding:22px 40px}
.top b{font:800 24px Rubik;margin-right:auto}
.top a{color:var(--ink);text-decoration:none;font-weight:700;font-size:16px}
.top a.p{background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:8px 20px}
.col{margin:auto;max-width:960px;width:100%;padding:16px 24px 40px;text-align:center}
h1{font:800 clamp(44px,7vw,112px)/.95 Rubik;letter-spacing:-.02em;margin:0 0 20px;text-wrap:balance}
.col p{margin:0 auto 32px;max-width:560px}
.card{display:inline-block;background:var(--cream);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:24px;max-width:100%}
.kb{position:relative;height:200px;width:calc(var(--kw)*10);touch-action:none;user-select:none;-webkit-user-select:none}
.w,.b{position:absolute;top:0;border:3px solid var(--ink);display:flex;align-items:flex-end;justify-content:center;font:700 14px Karla;padding-bottom:8px;cursor:pointer;transition:transform .05s}
.w{width:var(--kw);height:100%;background:#fff;margin-left:-3px}
.b{width:calc(var(--kw)*.62);height:60%;background:var(--ink);color:var(--cream);z-index:2;margin-left:calc(var(--kw)*-.31)}
.on{background:var(--pink)!important;transform:translateY(3px)}
.cap{font-size:15px;margin-top:16px;color:#4a4a4a}
@media(max-width:700px){:root{--kw:calc((94vw - 56px)/10)}.kb{height:150px}.top{padding:16px 20px}.top a:not(.p){display:none}.card{padding:12px}.w,.b{font-size:11px}}
@media(prefers-reduced-motion:reduce){.on{transform:none}}
</style></head><body>
<main class="hero">
<div class="top"><b>♪ Jam Session</b><a href="#">Lessons</a><a href="#">Teachers</a><a href="#">Pricing</a><a class="p" href="#">Free first lesson</a></div>
<div class="col"><h1>Play your first song today.</h1><p>One-to-one piano lessons for adults who always meant to start. No scales on day one, we promise.</p>
<div class="card"><div class="kb" id="kb"></div></div><div class="cap">Tap the keys or use A S D F G H J K L on your keyboard</div></div>
</main>
<script>
const W=[['C','a'],['D','s'],['E','d'],['F','f'],['G','g'],['A','h'],['B','j'],['C','k'],['D','l'],['E',';']];
const semi=[0,2,4,5,7,9,11,12,14,16];
const BL=[[0,'C#','w'],[1,'D#','e'],[3,'F#','t'],[4,'G#','y'],[5,'A#','u'],[7,'C#','o'],[8,'D#','p']];
const kb=document.getElementById('kb'),keys={};let ctx;
const hz=n=>261.63*Math.pow(2,n/12);
function play(n){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state=='suspended')ctx.resume();
 const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='triangle';o.frequency.value=hz(n);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.9);
 o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.95)}
function mk(cls,label,k,n,left,order){const d=document.createElement('div');d.className=cls;d.dataset.n=n;d.dataset.k=k;d.textContent=k.toUpperCase();d.setAttribute('role','button');d.setAttribute('aria-label',label);
 d.style.left=left;kb.appendChild(d);keys[k]=d}
W.forEach((w,i)=>mk('w',w[0]+' note',w[1],semi[i],'calc(var(--kw)*'+i+')'));
BL.forEach(b=>{const s=[1,3,6,8,10,13,15][BL.indexOf(b)];mk('b',b[1]+' note',b[2],s,'calc(var(--kw)*'+(b[0]+1)+')')});
const down=new Set();
function press(el){if(!el||down.has(el))return;down.add(el);el.classList.add('on');play(+el.dataset.n)}
function rel(el){down.delete(el);el.classList.remove('on')}
let ptr=false;
kb.addEventListener('pointerdown',e=>{ptr=true;press(e.target.closest('[data-n]'))});
kb.addEventListener('pointermove',e=>{if(!ptr)return;const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-n]');
 [...down].forEach(d=>{if(d!==el&&!d.dataset.kb)rel(d)});press(el)});
addEventListener('pointerup',()=>{ptr=false;[...down].forEach(d=>{if(!d.dataset.kb)rel(d)})});
addEventListener('keydown',e=>{if(e.repeat||e.metaKey||e.ctrlKey)return;const el=keys[e.key.toLowerCase()];if(el){el.dataset.kb=1;press(el)}});
addEventListener('keyup',e=>{const el=keys[e.key.toLowerCase()];if(el){delete el.dataset.kb;rel(el)}});
</script></body></html>
