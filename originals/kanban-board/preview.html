<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#4f46e5;--mut:#6d7287;--ln:#e1e3ec}
*{box-sizing:border-box}
html,body{margin:0;background:#f1f2f6;color:#1b1d29;font:400 15px/1.45 Onest,system-ui,sans-serif}
.app{min-height:100svh;display:flex;flex-direction:column}
.tb{height:64px;background:#fff;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:16px;padding:0 24px}
.lg{width:32px;height:32px;border-radius:9px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700}
.tb h1{font:700 22px Onest;letter-spacing:-.02em;margin:0 auto 0 0}
.sr{position:relative}
.sr input{height:40px;width:260px;border:1px solid var(--ln);border-radius:10px;padding:0 34px 0 14px;font:400 14px Onest;background:#f7f8fb;color:inherit}
.sr input:focus{outline:2px solid var(--ac);outline-offset:1px}
.sr button{position:absolute;right:6px;top:6px;width:28px;height:28px;border:0;background:none;color:var(--mut);cursor:pointer;display:none;font-size:14px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 11px Onest;color:#fff;border:2px solid #fff;flex:none}
.stk{display:flex}.stk .av+.av{margin-left:-8px}
.bd{flex:1;display:flex;gap:16px;padding:24px;overflow-x:auto;align-items:flex-start}
.col{flex:1 0 260px;min-width:260px;background:#e6e8f0;border-radius:16px;padding:12px;display:flex;flex-direction:column;max-height:calc(100svh - 112px);border:2px dashed transparent}
.col.ov{border-color:var(--ac)}
.ch{display:flex;align-items:center;gap:8px;padding:4px 6px 12px;font:700 13px Onest;text-transform:uppercase;letter-spacing:.06em}
.ch span{background:#fff;border-radius:999px;font-size:12px;padding:1px 8px;color:var(--mut);letter-spacing:0}
.ls{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:40px;padding:2px}
.cd{position:relative;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(20,22,40,.06);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.cd:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.cd.lifted{outline:2px solid var(--ac);outline-offset:2px}
.cd.ph{opacity:.35}
.cd.dim{opacity:.25}.cd.hide{display:none}
.cd h3{font:600 15px Onest;margin:8px 0 10px}
.tg{display:inline-block;font:600 11px Onest;color:#fff;padding:2px 9px;border-radius:999px}
.mt{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mut)}
.mt .av{width:24px;height:24px;font-size:10px;border:0}
.fl{position:fixed;pointer-events:none;z-index:50;transform:scale(1.03) rotate(2deg);box-shadow:0 14px 28px rgba(20,22,40,.25);margin:0}
.gap{height:3px;background:var(--ac);border-radius:2px;flex:none}
.add{margin-top:8px;background:none;border:0;text-align:left;padding:10px 8px;border-radius:10px;color:var(--mut);font:600 14px Onest;cursor:pointer}
.add:hover{background:rgba(255,255,255,.6)}
.add:focus-visible,.cm button:focus-visible,.cm select:focus-visible,.cm textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.cm{margin-top:8px;background:#fff;border-radius:12px;padding:10px;border:1px solid var(--ln)}
.cm textarea{width:100%;border:0;resize:none;font:500 14px Onest;height:56px;outline:none;color:inherit}
.cm .r{display:flex;gap:8px;align-items:center}
.cm select{flex:1;height:34px;border:1px solid var(--ln);border-radius:8px;font:500 13px Onest;background:#fff}
.cm button{height:34px;padding:0 14px;border-radius:8px;border:0;background:var(--ac);color:#fff;font:600 13px Onest;cursor:pointer}
.cm .x{background:none;color:var(--mut)}
.sro{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:800px){.col{flex:0 0 82vw;scroll-snap-align:start}.bd{scroll-snap-type:x mandatory;padding:16px}.tb{padding:0 16px}.sr input{width:140px}.stk{display:none}.col{max-height:none}}
@media(prefers-reduced-motion:reduce){.fl{transform:none}}
</style></head><body>
<div class="app"><header class="tb"><div class="lg">S</div><h1>Sprint 14</h1>
<div class="sr"><input id="q" type="search" placeholder="Filter cards" aria-label="Filter cards"></div>
<div class="stk"><span class="av" style="background:#4f46e5">AO</span><span class="av" style="background:#0ea5e9">JL</span><span class="av" style="background:#ec4899">KS</span></div></header>
<main class="bd" id="bd"></main></div>
<div class="sro" id="live" aria-live="assertive"></div>
<script>
const TAG={design:'#ec4899',build:'#3b82f6',bug:'#ef4444',docs:'#10b981',research:'#f59e0b'},AV={AO:'#4f46e5',JL:'#0ea5e9',KS:'#ec4899',Me:'#0f172a'};
const COLS=['Backlog','In progress','Review','Done'];
let N=1;const mk=(t,tag,who,due,c)=>({id:N++,t,tag,who,due,c});
const S=[mk('Design onboarding flow','design','KS','Oct 14',0),mk('Spike: offline sync','research','JL','Oct 16',0),mk('Write API docs','docs','AO','Oct 18',0),
mk('Fix login redirect','bug','JL','Oct 12',1),mk('Build settings page','build','AO','Oct 15',1),mk('Empty-state illustrations','design','KS','Oct 13',1),
mk('Refactor billing hooks','build','JL','Oct 11',2),mk('Accessibility audit','research','KS','Oct 12',2),
mk('Set up error tracking','build','AO','Oct 8',3),mk('Update brand colours','design','KS','Oct 7',3)];
const bd=document.getElementById('bd'),live=document.getElementById('live'),$=id=>document.getElementById(id);
function say(m){live.textContent='';setTimeout(()=>live.textContent=m,30)}
function cardEl(c){const d=document.createElement('div');d.className='cd';d.tabIndex=0;d.dataset.id=c.id;d.setAttribute('role','listitem');
 d.innerHTML='<span class="tg" style="background:'+TAG[c.tag]+'">'+c.tag+'</span><h3></h3><div class="mt"><span>Due '+c.due+'</span><span class="av" style="background:'+AV[c.who]+'">'+c.who+'</span></div>';d.querySelector('h3').textContent=c.t;return d}
function render(){bd.innerHTML='';COLS.forEach((n,ci)=>{const col=document.createElement('section');col.className='col';col.dataset.c=ci;
 col.innerHTML='<div class="ch"><b>'+n+'</b><span id="n'+ci+'">0</span></div><div class="ls" role="list" aria-label="'+n+'"></div><button class="add">+ Add card</button>';
 const ls=col.querySelector('.ls');S.filter(c=>c.c==ci).forEach(c=>ls.appendChild(cardEl(c)));
 col.querySelector('.add').onclick=e=>compose(col,e.currentTarget);bd.appendChild(col)});counts();filt()}
function counts(){COLS.forEach((_,i)=>{const q=$('q').value.trim().toLowerCase();const n=S.filter(c=>c.c==i&&(!q||c.t.toLowerCase().includes(q)||c.tag.includes(q))).length;$('n'+i).textContent=n})}
function filt(){const q=$('q').value.trim().toLowerCase();document.querySelectorAll('.cd').forEach(el=>{const c=S.find(x=>x.id==el.dataset.id);el.classList.toggle('hide',!!q&&!(c.t.toLowerCase().includes(q)||c.tag.includes(q)))});counts()}
$('q').addEventListener('input',filt);
function compose(col,btn){btn.style.display='none';const f=document.createElement('div');f.className='cm';
 f.innerHTML='<textarea placeholder="Card title" aria-label="Card title"></textarea><div class="r"><select aria-label="Tag">'+Object.keys(TAG).map(t=>'<option>'+t+'</option>').join('')+'</select><button class="ad">Add</button><button class="x" aria-label="Cancel">✕</button></div>';
 col.appendChild(f);const ta=f.querySelector('textarea');ta.focus();
 const done=()=>{f.remove();btn.style.display=''};
 const add=()=>{const t=ta.value.trim();if(!t){ta.focus();return}S.push(mk(t,f.querySelector('select').value,'Me','Oct 20',+col.dataset.c));render()};
 f.querySelector('.ad').onclick=add;f.querySelector('.x').onclick=done;
 ta.addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();add()}if(e.key=='Escape')done()})}
// pointer dnd
let drag=null;
bd.addEventListener('pointerdown',e=>{const el=e.target.closest('.cd');if(!el||e.button>0)return;drag={el,id:+el.dataset.id,x:e.clientX,y:e.clientY,on:false,pid:e.pointerId}});
addEventListener('pointermove',e=>{if(!drag)return;
 if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<4)return;drag.on=true;const r=drag.el.getBoundingClientRect();drag.ox=e.clientX-r.left;drag.oy=e.clientY-r.top;
  const fl=drag.el.cloneNode(true);fl.classList.add('fl');fl.style.width=r.width+'px';document.body.appendChild(fl);drag.fl=fl;drag.el.classList.add('ph');document.body.style.userSelect='none'}
 drag.fl.style.left=(e.clientX-drag.ox)+'px';drag.fl.style.top=(e.clientY-drag.oy)+'px';
 const t=document.elementFromPoint(e.clientX,e.clientY);const col=t&&t.closest('.col');
 document.querySelectorAll('.col').forEach(c=>c.classList.toggle('ov',c===col));document.querySelectorAll('.gap').forEach(g=>g.remove());
 drag.col=col;drag.idx=null;if(col){const ls=col.querySelector('.ls'),cards=[...ls.querySelectorAll('.cd:not(.ph):not(.hide)')];let idx=cards.length;
  for(let i=0;i<cards.length;i++){const r=cards[i].getBoundingClientRect();if(e.clientY<r.top+r.height/2){idx=i;break}}
  const g=document.createElement('div');g.className='gap';ls.insertBefore(g,cards[idx]||null);drag.idx=idx;drag.cards=cards}
 const bdr=bd.getBoundingClientRect();if(e.clientX>bdr.right-60)bd.scrollLeft+=14;if(e.clientX<bdr.left+60)bd.scrollLeft-=14});
function finish(cancel){if(!drag)return;const d=drag;drag=null;
 if(d.on){d.fl&&d.fl.remove();document.body.style.userSelect='';document.querySelectorAll('.gap').forEach(g=>g.remove());document.querySelectorAll('.col').forEach(c=>c.classList.remove('ov'));
  if(!cancel&&d.col){const ci=+d.col.dataset.c,card=S.find(c=>c.id==d.id);S.splice(S.indexOf(card),1);card.c=ci;
   const colCards=S.filter(c=>c.c==ci);const ref=d.cards[d.idx];const refCard=ref?S.find(c=>c.id==ref.dataset.id):null;
   if(refCard)S.splice(S.indexOf(refCard),0,card);else{const last=colCards[colCards.length-1];S.splice(last?S.indexOf(last)+1:S.length,0,card)}
   render();const el=document.querySelector('.cd[data-id="'+d.id+'"]');if(el&&!matchMedia('(prefers-reduced-motion:reduce)').matches)el.animate([{transform:'scale(1.04)'},{transform:'none'}],{duration:150});
   say(card.t+' moved to '+COLS[ci])}else d.el.classList.remove('ph')}}
addEventListener('pointerup',()=>finish(false));addEventListener('pointercancel',()=>finish(true));
// keyboard
let kb=null;
function pos(id){const c=S.find(x=>x.id==id);return{c,ci:c.c,i:S.filter(x=>x.c==c.c).indexOf(c)}}
bd.addEventListener('keydown',e=>{const el=e.target.closest('.cd');if(!el)return;const id=+el.dataset.id;
 if(e.key==' '||e.key=='Enter'){e.preventDefault();if(!kb){kb={id,from:S.map(x=>({...x})),order:[...S]};el.classList.add('lifted');const p=pos(id);say('Picked up '+p.c.t+', column '+COLS[p.ci]+', position '+(p.i+1)+'. Use arrow keys to move, space to drop, escape to cancel.')}
  else{const p=pos(kb.id);el.classList.remove('lifted');say('Dropped '+p.c.t+' in '+COLS[p.ci]+', position '+(p.i+1));kb=null}return}
 if(kb&&kb.id==id){if(e.key=='Escape'){e.preventDefault();const o=kb.order;S.length=0;S.push(...o);kb.from.forEach(f=>{S.find(x=>x.id==f.id).c=f.c});kb=null;render();document.querySelector('.cd[data-id="'+id+'"]').focus();say('Move cancelled');return}
  const p=pos(id);let moved=false;
  if(e.key=='ArrowLeft'&&p.ci>0){p.c.c--;moved=true}if(e.key=='ArrowRight'&&p.ci<3){p.c.c++;moved=true}
  if(e.key=='ArrowUp'||e.key=='ArrowDown'){const same=S.filter(x=>x.c==p.ci),j=same.indexOf(p.c)+(e.key=='ArrowUp'?-1:1);if(j>=0&&j<same.length){const o=same[j],a=S.indexOf(p.c),b=S.indexOf(o);S[a]=o;S[b]=p.c;moved=true}}
  if(moved){e.preventDefault();render();const n=document.querySelector('.cd[data-id="'+id+'"]');n.classList.add('lifted');n.focus();const q=pos(id);say(q.c.t+', column '+COLS[q.ci]+', position '+(q.i+1))}}});
render();
</script></body></html>
