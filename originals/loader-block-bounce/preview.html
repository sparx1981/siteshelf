<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Block Bounce Loader — Loaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--b:56px;--sp:1}
body{margin:0;min-height:100vh;background:radial-gradient(#f0d9a0 2px,transparent 2.5px) 0 0/28px 28px,#fff3d6;color:#2a2118;font:400 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #2a2118;outline-offset:3px;box-shadow:0 0 0 6px #fff}
.w{max-width:820px;margin:0 auto;padding:44px 20px 56px;text-align:center}
.eb{font:700 13px Nunito;letter-spacing:.18em;text-transform:uppercase;color:#d1432f;margin:0 0 8px}
h1{font:800 clamp(38px,7vw,68px)/1 "Baloo 2";margin:0 0 6px;letter-spacing:-.01em}.lead{color:#6e5a3f;margin:0 auto 22px;max-width:46ch;font-size:18px}
.sg{position:relative;max-width:760px;height:310px;margin:0 auto;background:#fffaf0;border:1px solid #f0dcaa;border-radius:24px;overflow:hidden;box-shadow:0 24px 50px -30px rgba(90,60,10,.5)}
.pl{position:absolute;left:5%;right:5%;bottom:34px;height:10px;border-radius:5px;background:#d9a65c;box-shadow:0 3px 0 #b8853f}
.row{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;gap:calc(var(--b)*.45)}
.bl{all:unset;box-sizing:border-box;position:relative;width:var(--b);height:var(--b);cursor:pointer;flex:none;border-radius:calc(var(--b)*.22);-webkit-tap-highlight-color:transparent}
.bl:focus-visible{outline:3px solid #2a2118;outline-offset:6px;box-shadow:0 0 0 9px #fff}
.hop{position:absolute;inset:0;animation:hp calc(1.1s/var(--sp)) infinite;animation-delay:calc(var(--i)*120ms/var(--sp))}
.sq{position:absolute;inset:0;border-radius:calc(var(--b)*.22);background:var(--c);box-shadow:inset 0 calc(var(--b)*.08) 0 rgba(255,255,255,.4),inset 0 calc(var(--b)*-.08) 0 rgba(0,0,0,.14);transform-origin:50% 100%;animation:sqs calc(1.1s/var(--sp)) infinite;animation-delay:calc(var(--i)*120ms/var(--sp))}
.sq svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes hp{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}45%{transform:translateY(calc(var(--b)*-2));animation-timing-function:cubic-bezier(.6,0,.9,.4)}90%,100%{transform:translateY(0)}}
@keyframes sqs{0%{transform:scale(1.2,.7)}8%{transform:scale(.9,1.16)}20%{transform:scale(.95,1.08)}45%{transform:scale(1,1)}75%{transform:scale(.96,1.1)}88%{transform:scale(1.02,.98)}92%{transform:scale(1.22,.72)}100%{transform:scale(1.2,.7)}}
.sh{position:absolute;left:8%;right:8%;bottom:calc(var(--b)*-.22);height:calc(var(--b)*.2);border-radius:50%;background:rgba(90,60,10,.28);filter:blur(2px);animation:shd calc(1.1s/var(--sp)) infinite;animation-delay:calc(var(--i)*120ms/var(--sp))}
@keyframes shd{0%{transform:scale(1.15);opacity:.9}45%{transform:scale(.55);opacity:.3}92%,100%{transform:scale(1.15);opacity:.9}}
.row.big .hop{animation:none}
.bl.jump .hop{animation:jp .8s cubic-bezier(.2,.7,.4,1) 1}@keyframes jp{0%{transform:translateY(0)}45%{transform:translateY(calc(var(--b)*-3.2))}100%{transform:translateY(0)}}
.paused *{animation-play-state:paused!important}
.eyes{animation:bk 4s infinite;transform-origin:50% 40%}@keyframes bk{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.spk{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;pointer-events:none;animation:spk .6s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(180deg);opacity:0}}
.ms{font:800 28px "Baloo 2";margin:18px 0 0;min-height:44px}.ms span{display:inline-block;min-width:1.2em;text-align:left}
.cnt{color:#6e5a3f;font-weight:700;margin:0 0 20px}
.cn{display:flex;gap:14px 22px;flex-wrap:wrap;justify-content:center;align-items:center}
.ch{display:flex;gap:8px;flex-wrap:wrap;border:0;margin:0;padding:0;justify-content:center}.ch label{position:relative}.ch input{position:absolute;opacity:0;width:1px;height:1px}.ch span{display:block;padding:8px 14px;border-radius:999px;border:2px solid #2a2118;font-weight:700;cursor:pointer;min-height:40px;background:#fff}.ch input:checked+span{background:#2a2118;color:#fff}.ch input:focus-visible+span{outline:3px solid #d1432f;outline-offset:3px}
.rg{display:flex;gap:10px;align-items:center;font-weight:700}.rg output{min-width:42px;font-size:14px}input[type=range]{accent-color:#d1432f;width:120px;height:28px}
select{font:700 15px Nunito;padding:8px 12px;border-radius:10px;border:2px solid #2a2118;background:#fff;min-height:40px}
.pz{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 20px;border-radius:999px;border:2px solid #2a2118;font-weight:800;min-height:40px;background:#ffc531}.pz[aria-pressed=true]{background:#2a2118;color:#fff}.pz:focus-visible{outline:3px solid #d1432f;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:560px){:root{--b:min(var(--bs,56px),11vw)}.sg{height:250px}.w{padding:30px 14px 44px}.row{bottom:40px}.pl{bottom:30px}}
@media (prefers-reduced-motion:reduce){.hop{animation:hr 3.3s ease-in-out infinite!important;animation-delay:calc(var(--i)*200ms)!important}.sq,.sh,.eyes{animation:none!important}@keyframes hr{50%{transform:translateY(-8px)}}.rg.sp{display:none}}
</style></head><body>
<div class="w"><p class="eb">Tumble &amp; Toss</p><h1>Please bounce responsibly.</h1><p class="lead">Five blocks, one very long wait. Click a block if it looks bored.</p>
<div class="sg" role="progressbar" aria-label="Loading toys" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="sg"><div class="pl" aria-hidden="true"></div><div class="row" id="rw"></div></div>
<p class="ms" id="ms" aria-hidden="true"><b id="mt">Stacking the shelves</b><span id="dt">...</span></p><p class="cnt" id="cn" aria-hidden="true">Loaded 0 of 5 toys</p>
<div class="cn"><fieldset class="ch" aria-label="Colour set"><label><input type="radio" name="cs" value="0" checked><span>Primary</span></label><label><input type="radio" name="cs" value="1"><span>Pastel</span></label><label><input type="radio" name="cs" value="2"><span>Mono</span></label><label><input type="radio" name="cs" value="3"><span>Neon</span></label></fieldset>
<div class="rg"><label for="sz">Size</label><input id="sz" type="range" min="36" max="84" step="4" value="56"><output id="szo" for="sz">56</output></div><label class="rg" for="ct">Blocks <select id="ct"><option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option></select></label>
<div class="rg sp"><label for="sp">Speed</label><input id="sp" type="range" min=".6" max="1.8" step=".2" value="1"><output id="spo" for="sp">1×</output></div><button class="pz" id="pz" type="button" aria-pressed="false">Pause</button></div></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)},root=document.documentElement,rw=$('#rw'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var SETS=[['#ff5a4d','#ffc531','#2f9bff','#3fcf8e','#8a5cff','#ff8a3d','#e84a9a'],['#ffb3c7','#ffe0a3','#b6e3ff','#c6f0d1','#d8c6ff','#ffd2b0','#bff0ee'],['#2b2b2b','#4a4a4a','#707070','#939393','#b3b3b3','#cacaca','#dedede'],['#ff2d95','#ffe600','#00e5ff','#7dff3a','#b455ff','#ff7a00','#00ffa6']];
var MSG=['Stacking the shelves','Counting the marbles','Polishing the blocks','Nearly there'],cs=0,n=5,done=0;
function build(){rw.innerHTML='';for(var i=0;i<n;i++){var b=document.createElement('button');b.type='button';b.className='bl';b.style.setProperty('--i',i);b.style.setProperty('--c',SETS[cs][i]);b.setAttribute('aria-label','Bounce block '+(i+1));
 var dark=cs===2&&i<3||cs===3;var ink=(cs===2&&i<4)?'#fff':'#2a2118';
 b.innerHTML='<span class="hop"><span class="sq"><svg viewBox="0 0 100 100" aria-hidden="true"><g class="eyes" style="animation-delay:'+(-i*.9).toFixed(1)+'s"><circle cx="34" cy="42" r="6" fill="'+ink+'"/><circle cx="66" cy="42" r="6" fill="'+ink+'"/></g><path d="M34 62 Q50 74 66 62" fill="none" stroke="'+ink+'" stroke-width="5" stroke-linecap="round"/></svg></span><span class="sh"></span></span>';
 b.addEventListener('click',function(){var el=this;el.classList.remove('jump');void el.offsetWidth;el.classList.add('jump');if(!reduce)sparkle(el);setTimeout(function(){el.classList.remove('jump')},850)});rw.appendChild(b)}}
function sparkle(el){var h=el.querySelector('.hop');for(var k=0;k<6;k++){var s=document.createElement('i');s.className='spk';var a=k/6*6.283,d=40+Math.random()*20;s.style.cssText='--dx:'+Math.cos(a)*d+'px;--dy:'+Math.sin(a)*d+'px;background:'+SETS[cs][(k+1)%n]+';clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)';h.appendChild(s);setTimeout(function(x){x.remove()},650,s)}}
build();
document.querySelectorAll('[name=cs]').forEach(function(r){r.addEventListener('change',function(){cs=+r.value;build()})});
$('#sz').addEventListener('input',function(){root.style.setProperty('--b',this.value+'px');root.style.setProperty('--bs',this.value+'px');$('#szo').textContent=this.value});
$('#ct').addEventListener('change',function(){n=+this.value;build();done=0});
$('#sp').addEventListener('input',function(){root.style.setProperty('--sp',this.value);$('#spo').textContent=this.value+'×'});
$('#pz').addEventListener('click',function(){var on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',on);this.textContent=on?'Play':'Pause';document.body.classList.toggle('paused',on)});
var mi=0,dots=0,cyc=0,t=0;
setInterval(function(){if(document.body.classList.contains('paused'))return;dots=(dots+1)%4;$('#dt').textContent='...'.slice(0,dots)+' '.repeat(3-dots)},350);
setInterval(function(){if(document.body.classList.contains('paused'))return;mi=(mi+1)%4;$('#mt').textContent=MSG[mi];done=Math.min(n,Math.round((mi+1)/4*n));$('#cn').textContent='Loaded '+done+' of '+n+' toys';var p=(mi+1)*25;$('#sg').setAttribute('aria-valuenow',p);if(mi===3)setTimeout(function(){$('#live').textContent='Toys loaded'},1400)},1400);
$('#mt').textContent=MSG[1];mi=1;done=Math.round(2/4*n);$('#cn').textContent='Loaded '+done+' of '+n+' toys';$('#sg').setAttribute('aria-valuenow',50);
})();
</script></body></html>
