<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loader Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
@property --pc{syntax:'<integer>';inherits:false;initial-value:0}
:root{--speed:1;--t:#5eead4;--i:#818cf8;--st:running}
*{box-sizing:border-box}
html,body{margin:0;background:#0f1115;color:#e8eaf0;font:500 16px/1.5 'Inter Tight',system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:56px 40px;min-height:100svh}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:32px}
h1{font:700 clamp(36px,4vw,56px)/1.05 'Inter Tight';letter-spacing:-.03em;margin:0}
.sub{color:#7d8394;margin:4px 0 0}
.ct{display:flex;gap:20px;align-items:center}
.ct label{display:flex;gap:12px;align-items:center;font-size:14px;color:#7d8394}
.ct output{width:34px;color:#e8eaf0;font-variant-numeric:tabular-nums}
.ct input{accent-color:var(--t);width:140px}
.ct button{height:40px;padding:0 18px;border-radius:10px;border:1px solid #2a2f3c;background:#171a21;color:#e8eaf0;font:600 14px 'Inter Tight';cursor:pointer}
.ct button:focus-visible,.ct input:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.nt{color:var(--t);font-size:14px;margin:-16px 0 20px;display:none}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.c{position:relative;height:180px;background:#171a21;border:1px solid #232733;border-radius:18px;display:grid;place-items:center;transition:border-color .2s}
.c:hover{border-color:var(--t)}
.c small{position:absolute;left:18px;bottom:14px;font:400 12px 'Geist Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:#7d8394}
.c *,.c *::before,.c *::after{animation-play-state:var(--st)}
.d{--d:1s}
.l1{width:40px;height:40px;border:4px solid #262b38;border-top-color:var(--t);border-radius:50%;animation:rot calc(.9s/var(--speed)) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.l2{display:flex;gap:8px}.l2 i{width:12px;height:12px;border-radius:50%;background:var(--t);animation:bn calc(.9s/var(--speed)) ease-in-out infinite}
.l2 i:nth-child(2){animation-delay:calc(.15s/var(--speed))}.l2 i:nth-child(3){animation-delay:calc(.3s/var(--speed))}
@keyframes bn{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-14px);opacity:1}}
.l3{display:flex;gap:6px;align-items:center;height:40px}.l3 i{width:6px;height:36px;background:var(--t);border-radius:3px;animation:sc calc(1s/var(--speed)) ease-in-out infinite}
.l3 i:nth-child(2){animation-delay:calc(.1s/var(--speed))}.l3 i:nth-child(3){animation-delay:calc(.2s/var(--speed))}.l3 i:nth-child(4){animation-delay:calc(.3s/var(--speed))}.l3 i:nth-child(5){animation-delay:calc(.4s/var(--speed))}
@keyframes sc{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.l4{position:relative;width:56px;height:56px;border:1px solid #2a2f3c;border-radius:50%;animation:rot calc(1.6s/var(--speed)) linear infinite}
.l4 i{position:absolute;border-radius:50%}.l4 i:first-child{width:10px;height:10px;background:var(--t);left:23px;top:-5px}.l4 i:last-child{width:6px;height:6px;background:var(--i);left:25px;bottom:-3px}
.l5{position:relative;width:40px;height:40px}.l5 i{position:absolute;inset:0;border-radius:50%;background:var(--t);animation:pl calc(1.4s/var(--speed)) ease-out infinite}.l5 i:nth-child(2){animation-delay:calc(.35s/var(--speed))}.l5 i:nth-child(3){animation:pc calc(1.4s/var(--speed)) ease-in-out infinite;inset:12px;background:#fff}
@keyframes pl{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.4);opacity:0}}
@keyframes pc{50%{transform:scale(1.3)}}
.l6{display:flex;gap:12px;align-items:center;width:150px}.l6 .a,.l6 .b,.l6 .e{background:linear-gradient(90deg,#262b38 25%,#343a4b 50%,#262b38 75%) 0 0/300% 100%;animation:sh calc(1.5s/var(--speed)) linear infinite;border-radius:6px}
.l6 .a{width:40px;height:40px;border-radius:50%;flex:none}.l6 .b{height:10px;margin-bottom:8px}.l6 .e{height:10px;width:70%}.l6>div{flex:1}
@keyframes sh{to{background-position:-300% 0}}
.l7{width:160px}.l7 .tr{height:8px;background:#262b38;border-radius:4px;overflow:hidden}.l7 .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--t),var(--i));border-radius:4px;animation:pg calc(2.4s/var(--speed)) ease-in-out infinite}
@keyframes pg{0%{width:0}80%,100%{width:100%}}
.l7 .pc{font:400 12px 'Geist Mono',monospace;margin-top:8px;color:#7d8394;counter-reset:n var(--pc);animation:cn calc(2.4s/var(--speed)) ease-in-out infinite}
.l7 .pc::after{content:counter(n) '%'}
@keyframes cn{0%{--pc:0}80%,100%{--pc:100}}
.l8{width:36px;height:36px;background:var(--t);animation:mo calc(2.4s/var(--speed)) ease-in-out infinite}
@keyframes mo{0%{border-radius:4px;transform:rotate(0);background:var(--t)}33%{border-radius:50%;transform:rotate(120deg);background:var(--i)}66%{border-radius:4px;transform:rotate(225deg) scale(.8);background:var(--t)}100%{border-radius:4px;transform:rotate(360deg);background:var(--t)}}
.l9{display:flex;flex-direction:column;align-items:center;gap:12px}.l9 .bb{background:#262b38;border-radius:18px 18px 18px 4px;padding:12px 16px;display:flex;gap:5px}.l9 .bb i{width:8px;height:8px;border-radius:50%;background:#9aa1b5;animation:ty calc(1.2s/var(--speed)) infinite}
.l9 .bb i:nth-child(2){animation-delay:calc(.2s/var(--speed))}.l9 .bb i:nth-child(3){animation-delay:calc(.4s/var(--speed))}
@keyframes ty{0%,60%,100%{opacity:.25}30%{opacity:1}}
.l9 .th{font-size:14px;color:#9aa1b5}.l9 .th::after{content:'';display:inline-block;width:2px;height:1em;background:var(--t);margin-left:3px;vertical-align:-2px;animation:cr calc(1.2s/var(--speed)) steps(1) infinite}
@keyframes cr{50%{opacity:0}}
.l10{position:relative;width:60px;height:60px;display:grid;place-items:center}.l10 b{width:10px;height:10px;border-radius:50%;background:var(--t)}.l10 i{position:absolute;inset:0;border:2px solid var(--t);border-radius:50%;animation:rp calc(1.8s/var(--speed)) ease-out infinite}.l10 i:nth-child(2){animation-delay:calc(.9s/var(--speed))}
@keyframes rp{0%{transform:scale(.2);opacity:1}100%{transform:scale(1);opacity:0}}
.l11{animation:fl calc(2.4s/var(--speed)) ease-in-out infinite}
@keyframes fl{0%,80%{transform:rotate(0)}100%{transform:rotate(180deg)}}
.l11 .up{animation:up calc(2.4s/var(--speed)) linear infinite;transform-box:fill-box;transform-origin:bottom}.l11 .dn{animation:dn calc(2.4s/var(--speed)) linear infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes up{0%{transform:scaleY(1)}80%,100%{transform:scaleY(0)}}
@keyframes dn{0%{transform:scaleY(0)}80%,100%{transform:scaleY(1)}}
.l12{width:40px;height:40px;perspective:200px}.l12 .cu{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cb calc(3s/var(--speed)) linear infinite}
.l12 .cu i{position:absolute;inset:0;border:2px solid var(--t);background:rgba(94,234,212,.12)}
.l12 .cu i:nth-child(1){transform:translateZ(20px)}.l12 .cu i:nth-child(2){transform:rotateY(180deg) translateZ(20px)}.l12 .cu i:nth-child(3){transform:rotateY(90deg) translateZ(20px)}.l12 .cu i:nth-child(4){transform:rotateY(-90deg) translateZ(20px)}.l12 .cu i:nth-child(5){transform:rotateX(90deg) translateZ(20px)}.l12 .cu i:nth-child(6){transform:rotateX(-90deg) translateZ(20px)}
@keyframes cb{to{transform:rotateX(360deg) rotateY(360deg)}}
@media(max-width:1000px){.g{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.g{grid-template-columns:1fr 1fr}.wrap{padding:40px 20px}.ct{flex-wrap:wrap}}
</style></head><body>
<main class="wrap"><div class="hd"><div><h1>Loaders</h1><p class="sub">Twelve pure-CSS animations. Tweak the speed, freeze them all.</p></div>
<div class="ct"><label for="sp">Speed <input id="sp" type="range" min="0.5" max="2" step="0.1" value="1"><output id="so">1.0x</output></label><button id="pa" aria-pressed="false">Pause all</button></div></div>
<div class="nt" id="nt">Animations paused to respect your motion settings.</div>
<div class="g">
<div class="c"><div class="l1"></div><small>Spinner</small></div>
<div class="c"><div class="l2"><i></i><i></i><i></i></div><small>Dots</small></div>
<div class="c"><div class="l3"><i></i><i></i><i></i><i></i><i></i></div><small>Bars</small></div>
<div class="c"><div class="l4"><i></i><i></i></div><small>Orbit</small></div>
<div class="c"><div class="l5"><i></i><i></i><i></i></div><small>Pulse</small></div>
<div class="c"><div class="l6"><div class="a"></div><div><div class="b"></div><div class="e"></div></div></div><small>Skeleton</small></div>
<div class="c"><div class="l7"><div class="tr"><i></i></div><div class="pc"></div></div><small>Progress</small></div>
<div class="c"><div class="l8"></div><small>Morph</small></div>
<div class="c"><div class="l9"><div class="bb"><i></i><i></i><i></i></div><div class="th">Thinking</div></div><small>Typing</small></div>
<div class="c"><div class="l10"><i></i><i></i><b></b></div><small>Ripple</small></div>
<div class="c"><svg class="l11" width="40" height="56" viewBox="0 0 40 56" aria-hidden="true"><path d="M4 2h32M4 54h32M8 2c0 14 12 16 12 26S8 40 8 54M32 2c0 14-12 16-12 26s12 12 12 26" fill="none" stroke="#e8eaf0" stroke-width="2" stroke-linecap="round"/><path class="up" d="M12 6h16c0 8-8 12-8 20-0-8-8-12-8-20z" fill="#5eead4"/><path class="dn" d="M20 32c4 4 10 6 12 20H8c2-14 8-16 12-20z" fill="#5eead4"/></svg><small>Hourglass</small></div>
<div class="c"><div class="l12"><div class="cu"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><small>Cube</small></div>
</div></main>
<script>
const $=id=>document.getElementById(id),r=document.documentElement.style;
$('sp').addEventListener('input',e=>{r.setProperty('--speed',e.target.value);$('so').textContent=(+e.target.value).toFixed(1)+'x'});
function pause(p){r.setProperty('--st',p?'paused':'running');$('pa').textContent=p?'Play all':'Pause all';$('pa').setAttribute('aria-pressed',p)}
let p=false;$('pa').onclick=()=>{p=!p;pause(p)};
if(matchMedia('(prefers-reduced-motion:reduce)').matches){p=true;pause(true);$('nt').style.display='block'}
</script></body></html>
