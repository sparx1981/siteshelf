<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pencil Draw Loader — Loaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:linear-gradient(90deg,transparent 70px,rgba(217,72,43,.45) 70px 72px,transparent 72px),repeating-linear-gradient(#f7f1e3 0 31px,rgba(200,185,150,.45) 31px 32px);color:#2a2620;font:400 16px/1.55 "Work Sans",system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #d9482b;outline-offset:3px;box-shadow:0 0 0 6px #fffdf6}
.w{max-width:760px;margin:0 auto;padding:48px 24px 56px}
.eb{font:600 13px "Work Sans";letter-spacing:.16em;text-transform:uppercase;color:#d9482b;margin:0 0 10px}
h1{font:700 clamp(40px,7vw,72px)/1 Caveat,cursive;margin:0 0 8px}.lead{color:#6b6354;margin:0 0 26px;max-width:46ch;font-size:17px}
.cd{background:#fffdf6;border:1px solid #e3d9bf;border-radius:18px;box-shadow:0 24px 50px -28px rgba(60,40,10,.5);padding:20px 24px 22px;max-width:460px}
.cv{display:block;width:100%;height:auto;background:repeating-linear-gradient(#fffdf6 0 23px,#f0e8d3 23px 24px);border-radius:10px}
.ct{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;gap:12px}
.pc{font:700 64px/1 Caveat,cursive;min-width:3.2ch;font-variant-numeric:tabular-nums}.cp{font:600 26px Caveat,cursive;color:#6b6354;text-align:right}
.pr{height:6px;border-radius:3px;margin-top:8px;background:#efe5cc;overflow:hidden;position:relative}.pr i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#3b3b3b 0 6px,#6b6b6b 6px 8px)}
.cn{display:flex;gap:14px 22px;flex-wrap:wrap;align-items:center;margin-top:22px}
.ch{display:flex;gap:8px;flex-wrap:wrap;border:0;margin:0;padding:0}.ch label{position:relative}.ch input{position:absolute;opacity:0;width:1px;height:1px}.ch span{display:block;padding:8px 14px;border-radius:999px;border:1.5px solid #b8ab8a;font-weight:600;cursor:pointer;min-height:40px;background:#fffdf6}.ch input:checked+span{background:#2a2620;color:#fff;border-color:#2a2620}.ch input:focus-visible+span{outline:3px solid #d9482b;outline-offset:3px}
.rg{display:flex;gap:10px;align-items:center;font-weight:600}.rg output{min-width:42px;font-size:14px}input[type=range]{accent-color:#d9482b;width:130px;height:28px}
.bt{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 18px;border-radius:999px;border:1.5px solid #2a2620;font-weight:600;min-height:40px;background:#fffdf6}.bt:hover{background:#f1e8cf}.bt[aria-pressed=true]{background:#2a2620;color:#fff}.bt:focus-visible{outline:3px solid #d9482b;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){.w{padding:30px 16px 44px}.cd{padding:14px 14px 18px}.pc{font-size:52px}.cp{font-size:22px}.rg input{width:100px}}
@media (prefers-reduced-motion:reduce){.rg.sp{display:none}}
</style></head><body>
<div class="w"><p class="eb">Graphite &amp; Gum</p><h1>Drawn while you wait.</h1><p class="lead">A pencil sketches, rubs out and starts again. The counter keeps honest time.</p>
<div class="cd"><svg class="cv" id="cv" viewBox="0 0 360 240" role="progressbar" aria-label="Sketch loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><g id="st" fill="none" stroke="#3b3b3b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></g><g id="cr"></g>
<g id="pn" style="will-change:transform"><g transform="rotate(-40) translate(0 -8)"><path d="M0 0 L-5 -14 L5 -14Z" fill="#e8c9a0"/><path d="M0 0 L-1.6 -4.6 L1.6 -4.6Z" fill="#2b2b2b"/><rect x="-5" y="-62" width="10" height="48" fill="#f2b632"/><rect x="-5" y="-62" width="3" height="48" fill="#d99a1e"/><rect x="-5" y="-70" width="10" height="8" fill="#b7b7b7"/><rect x="-5" y="-80" width="10" height="10" rx="3" fill="#e98ca0"/></g></g></svg>
<div class="ct"><div class="pc" id="pc" aria-hidden="true">0%</div><div class="cp" id="cp" aria-hidden="true">Sharpening pencils...</div></div><div class="pr" aria-hidden="true"><i id="pb"></i></div></div>
<div class="cn"><fieldset class="ch" aria-label="Shape" id="ch"><label><input type="radio" name="sh" value="0" checked><span>House</span></label><label><input type="radio" name="sh" value="1"><span>Star</span></label><label><input type="radio" name="sh" value="2"><span>Cat</span></label><label><input type="radio" name="sh" value="3"><span>Lighthouse</span></label></fieldset>
<div class="rg sp"><label for="sp">Speed</label><input id="sp" type="range" min="2" max="10" step=".5" value="5" style="direction:rtl"><output id="spo" for="sp">5s</output></div>
<button class="bt" id="pa" type="button" aria-pressed="false">Pause</button><button class="bt" id="rp" type="button">Replay</button></div></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var NS='http://www.w3.org/2000/svg',reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var SH=[
['M60 200 L60 110 L180 40 L300 110 L300 200 Z','M60 200 L300 200','M150 200 L150 140 L210 140 L210 200','M228 112 L270 112 L270 150 L228 150 Z','M249 112 L249 150 M228 131 L270 131','M240 70 L240 48 L262 48 L262 86'],
['M180 24 L214 96 L292 106 L234 160 L250 236 L180 198 L110 236 L126 160 L68 106 L146 96 Z','M180 70 L196 106 L180 140 L164 106 Z'],
['M80 190 Q70 90 100 70 L124 100 Q180 84 236 100 L260 70 Q290 90 280 190 Q180 240 80 190 Z','M138 140 a10 12 0 1 0 .1 0','M222 140 a10 12 0 1 0 .1 0','M170 168 L180 178 L190 168 Z','M180 178 Q172 192 160 190 M180 178 Q188 192 200 190','M88 160 L40 150 M88 172 L42 176 M272 160 L320 150 M272 172 L318 176'],
['M140 220 L156 70 L204 70 L220 220 Z','M150 150 L210 150 M146 186 L214 186','M156 70 L156 44 L204 44 L204 70','M150 44 L180 20 L210 44 Z','M168 120 L192 120 L192 100 L168 100 Z','M100 220 L260 220','M156 56 L90 40 M204 56 L270 40']];
var CAP=['Sharpening pencils...','Sketching outlines...','Adding shadows...','Nearly done...'];
var cur=0,dur=5,paused=false,t=0,last=0,strokes=[],lens=[],crumbs=[],done=false,svg=$('#cv'),stG=$('#st'),pn=$('#pn'),pcE=$('#pc'),cpE=$('#cp'),pb=$('#pb'),lastAria=-1;
function build(){stG.innerHTML='';$('#cr').innerHTML='';strokes=SH[cur].map(function(d){var p=document.createElementNS(NS,'path');p.setAttribute('d',d);stG.appendChild(p);return p});lens=strokes.map(function(p){return p.getTotalLength()});var tot=lens.reduce(function(a,b){return a+b},0);strokes.forEach(function(p,i){p.style.strokeDasharray=lens[i];p.style.strokeDashoffset=lens[i]});t=0;done=false;lastAria=-1}
function frame(prog,ph){ // ph: 0 draw, 1 hold, 2 erase ; prog within phase 0..1
 var tot=lens.reduce(function(a,b){return a+b},0),tipX=40,tipY=215,rot=0,eraser=false;
 if(ph===0){var pos=prog*tot,acc=0;strokes.forEach(function(p,i){var L=lens[i],k=Math.max(0,Math.min(1,(pos-acc)/L));p.style.strokeDashoffset=L*(1-k);p.style.opacity=1;if(pos>acc&&pos<acc+L){var pt=p.getPointAtLength(L*k);tipX=pt.x;tipY=pt.y}acc+=L;if(pos>=acc&&i===strokes.length-1&&k>=1){var pt2=p.getPointAtLength(L);tipX=pt2.x;tipY=pt2.y}})}
 else if(ph===1){strokes.forEach(function(p,i){p.style.strokeDashoffset=0;p.style.opacity=1});var l=strokes[strokes.length-1],pt=l.getPointAtLength(lens[strokes.length-1]);tipX=pt.x+Math.sin(prog*40)*2;tipY=pt.y}
 else{eraser=true;var sx=340-prog*320;strokes.forEach(function(p){var b=p.getBBox();var cover=Math.max(0,Math.min(1,(b.x+b.width-sx)/(b.width+20)));p.style.opacity=1-Math.min(1,cover*1.4)});tipX=sx;tipY=120+Math.sin(prog*26)*70;if(Math.random()<.5&&prog<.98)crumb(tipX,tipY)}
 pn.setAttribute('transform','translate('+tipX.toFixed(1)+' '+tipY.toFixed(1)+')'+(eraser?' rotate(180) translate(0 -14)':''));
 return}
function crumb(x,y){var c=document.createElementNS(NS,'circle');c.setAttribute('r',(1+Math.random()*1.8).toFixed(1));c.setAttribute('cx',x.toFixed(1));c.setAttribute('cy',y.toFixed(1));c.setAttribute('fill','#e98ca0');$('#cr').appendChild(c);crumbs.push({e:c,y:y,vy:.6+Math.random()*1.2,a:1})}
function tick(now){var dt=Math.min(.05,(now-last)/1000);last=now;if(!paused&&!reduce){t+=dt/dur;if(t>=1){t=0;if(!done){}build()}}
 var p=t<.65?t/.65:(t<.75?(t-.65)/.1:(t-.75)/.25),ph=t<.65?0:(t<.75?1:2);
 if(!reduce)frame(p,ph);
 var pct=ph===0?Math.round(p*100):(ph===1?100:Math.max(0,Math.round((1-p)*100)));var disp=ph===2?0:pct;
 pcE.textContent=disp+'%';pb.style.width=disp+'%';cpE.textContent=ph===2?'Rubbing out...':CAP[Math.min(3,Math.floor(disp/26))];
 var ar=Math.floor(disp/5)*5;if(ar!==lastAria){lastAria=ar;svg.setAttribute('aria-valuenow',ar);if(ar===100&&ph===1)$('#live').textContent='Sketch complete'}
 crumbs=crumbs.filter(function(c){c.y+=c.vy;c.a-=.03;c.e.setAttribute('cy',c.y.toFixed(1));c.e.setAttribute('opacity',Math.max(0,c.a).toFixed(2));if(c.a<=0){c.e.remove();return false}return true});
 requestAnimationFrame(tick)}
function stepMode(){var n=0;function s(){if(paused){setTimeout(s,300);return}n=(n+1)%5;strokes.forEach(function(p,i){var show=i<Math.ceil(strokes.length*n/4);p.style.strokeDashoffset=show?0:lens[i];p.style.opacity=1});var pct=Math.min(100,n*25);pcE.textContent=pct+'%';pb.style.width=pct+'%';cpE.textContent=pct===0?'Sharpening pencils...':CAP[Math.min(3,Math.floor(pct/26))];svg.setAttribute('aria-valuenow',pct);pn.setAttribute('transform','translate(-60 -60)');if(pct===100)$('#live').textContent='Sketch complete';setTimeout(s,1000)}s()}
build();
document.querySelectorAll('[name=sh]').forEach(function(r){r.addEventListener('change',function(){cur=+r.value;build();if(reduce){strokes.forEach(function(p){p.style.strokeDashoffset=lens[strokes.indexOf(p)]})}})});
$('#sp').addEventListener('input',function(){dur=+this.value;$('#spo').textContent=this.value+'s'});
$('#pa').addEventListener('click',function(){paused=!paused;this.setAttribute('aria-pressed',paused);this.textContent=paused?'Play':'Pause'});
$('#rp').addEventListener('click',function(){build()});
if(reduce){stepMode()}else{last=performance.now();t=.28;requestAnimationFrame(tick)}
document.getElementById('sp').style.direction='ltr';$('#sp').addEventListener('input',function(){dur=+this.value});
})();
</script></body></html>
