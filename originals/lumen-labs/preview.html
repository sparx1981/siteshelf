<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b0a14;color:#f2f0ff;font:400 19px/1.5 Onest,system-ui,sans-serif}
.hero{position:relative;min-height:100svh;overflow:hidden;display:flex;flex-direction:column}
.bl{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none}
.b1{background:#7c5cff;left:-6%;top:-10%;animation:d1 22s ease-in-out infinite alternate}
.b2{background:#35d0ff;right:-8%;top:10%;animation:d1 30s ease-in-out infinite alternate-reverse}
.b3{background:#ff5ca8;left:30%;bottom:-25%;animation:d1 26s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(90px,60px) scale(1.15)}}
.top{position:relative;z-index:2;display:flex;align-items:center;gap:28px;padding:22px 48px}
.top b{font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px;margin-right:auto}
.top b i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#a99bff 50%,#35d0ff);box-shadow:0 0 18px #7c5cff}
.top a{color:rgba(242,240,255,.62);text-decoration:none;font-size:15px}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.top a.p{color:#f2f0ff;padding:8px 18px;border-radius:999px}
.col{position:relative;z-index:2;margin:auto;width:100%;max-width:760px;padding:8px 24px 40px;text-align:center;display:flex;flex-direction:column;align-items:center}
.badge{font-size:14px;padding:6px 14px;border-radius:999px;margin-bottom:22px}
h1{font:600 clamp(44px,6vw,92px)/1.02 Onest;letter-spacing:-.035em;margin:0 0 18px}
h1 span{background:linear-gradient(90deg,#a99bff,#6fe0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.col>p{color:rgba(242,240,255,.62);margin:0 0 28px;max-width:560px}
.bt{display:flex;gap:12px;margin-bottom:36px;flex-wrap:wrap;justify-content:center}
.btn{height:50px;padding:0 26px;border-radius:25px;display:inline-flex;align-items:center;font:600 16px Onest;text-decoration:none;color:#f2f0ff}
.w{background:#fff;color:#0b0a14}
.chat{width:100%;border-radius:22px;padding:20px;text-align:left}
.hd{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(242,240,255,.62);margin-bottom:16px}
.hd i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22)}
.hd span{margin-left:10px}
.u{margin-left:auto;max-width:78%;background:#7c5cff;padding:10px 16px;border-radius:18px 18px 4px 18px;width:fit-content;font-size:17px}
.a{margin-top:12px;max-width:88%;background:rgba(255,255,255,.07);padding:12px 16px;border-radius:18px 18px 18px 4px;font-size:17px;min-height:96px}
.a::after{content:'';display:inline-block;width:2px;height:1em;background:#a99bff;margin-left:2px;vertical-align:-2px;animation:cr 1s steps(1) infinite}
.a.done::after{display:none}
@keyframes cr{50%{opacity:0}}
.ts{font:400 12px 'Geist Mono',monospace;color:rgba(242,240,255,.4);margin-top:8px}
.chips{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.chips button{border-radius:999px;padding:8px 16px;color:#f2f0ff;font:500 14px Onest;cursor:pointer}
.chips button[aria-pressed=true]{border-color:#a99bff;background:rgba(124,92,255,.25)}
@media(max-width:700px){.top{padding:16px 20px}.top a:not(.p){display:none}.col{padding:8px 16px 32px}.chat{padding:14px}.u,.a{font-size:15px}.a{min-height:130px;max-width:96%}}
@media(prefers-reduced-motion:reduce){.bl{animation:none}.a::after{animation:none}}
</style></head><body>
<main class="hero"><i class="bl b1"></i><i class="bl b2"></i><i class="bl b3"></i>
<div class="top"><b><i></i>Lumen</b><a href="#">Product</a><a href="#">Developers</a><a href="#">Pricing</a><a class="p glass" href="#">Sign in</a></div>
<div class="col"><div class="badge glass">New: Lumen 3 is here</div>
<h1>An assistant<br><span>that thinks with you.</span></h1>
<p>Ask in plain words. Lumen reads your docs, writes the first draft and shows its working.</p>
<div class="bt"><a class="btn w" href="#">Try Lumen free</a><a class="btn glass" href="#">Talk to sales</a></div>
<div class="chat glass"><div class="hd"><i></i><i></i><i></i><span>New chat</span></div><div class="u" id="q"></div><div class="a" id="an" aria-live="off"></div><div class="ts" id="ts">Lumen 3 · just now</div></div>
<div class="chips" id="cp"></div></div>
</main>
<script>
const Q=[['Summarise my meeting notes','Three decisions, two owners, one risk. Ship the beta on the 14th, Priya owns the migration, Sam owns the docs. The risk is the vendor API limit, so I have drafted a fallback.'],
['Draft a launch email','Subject: We are live. Hi all, today we are opening Lumen to everyone. Here is what is new, what is next, and how to get started in under two minutes.'],
['Explain this error','That error means the token expired before the request finished. Refresh it before the call, or raise the timeout to 30 seconds.']];
const q=document.getElementById('q'),an=document.getElementById('an'),cp=document.getElementById('cp');
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let cur=0,timer,cyc,clicked=false;
const btn=Q.map((x,i)=>{const b=document.createElement('button');b.className='glass';b.textContent=x[0];b.addEventListener('click',()=>{clicked=true;clearInterval(cyc);run(i)});cp.appendChild(b);return b});
function run(i){cur=i;clearInterval(timer);btn.forEach((b,j)=>b.setAttribute('aria-pressed',j==i));q.textContent=Q[i][0];
 const t=Q[i][1];an.classList.remove('done');
 if(calm){an.textContent=t;an.classList.add('done');return}
 let n=0;an.textContent='';timer=setInterval(()=>{n++;an.textContent=t.slice(0,n);if(n>=t.length){clearInterval(timer);an.classList.add('done')}},28)}
run(0);
if(!calm)cyc=setInterval(()=>{if(!clicked)run((cur+1)%3)},12000);
</script></body></html>
