<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnetic &amp; Ripple Buttons — Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--ink:#f5f5f7;--mut:#9a9aa6;--v:#8b5cf6;--p:#ec4899;--a:#fbbf24;--m:#34d399}
*{box-sizing:border-box}
body{margin:0;background:#0d0d12 radial-gradient(#ffffff14 1px,transparent 1.4px) 0 0/28px 28px;color:var(--ink);font:500 15px/1.5 'Space Grotesk',system-ui,sans-serif;padding:40px 16px 70px;min-height:100svh}
:focus-visible{outline:3px solid #fff;outline-offset:4px}
.wrap{max-width:1000px;margin:0 auto}
h1{font:700 clamp(30px,5vw,52px)/1.05 'Space Grotesk';margin:0 0 8px;letter-spacing:-.02em}
.lead{color:var(--mut);margin:0 0 26px}
.panel{display:flex;flex-wrap:wrap;gap:22px;align-items:center;padding:16px 20px;border:1px solid #2a2a36;border-radius:16px;background:#14141c;margin-bottom:22px}
.panel label{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--mut)}
.panel input[type=range]{accent-color:var(--v);width:150px;min-width:0}
.panel output{color:var(--ink);min-width:2.5ch}
.sw{display:flex;align-items:center;gap:10px}
.sw button{width:46px;height:28px;border-radius:99px;border:0;background:#3a3a48;position:relative;cursor:pointer;transition:background .2s}
.sw button::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw button[aria-checked=true]{background:var(--v)}
.sw button[aria-checked=true]::after{transform:translateX(18px)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cell{border:1px solid #2a2a36;border-radius:18px;background:#101017;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:190px}
.cap{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.stage{flex:1;display:grid;place-items:center;padding:14px}
.b{font:700 16px 'Space Grotesk';min-height:48px;padding:0 28px;border-radius:99px;border:0;color:#fff;cursor:pointer;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;will-change:transform}
.b span.in{display:inline-block;will-change:transform}
.mag{background:linear-gradient(135deg,var(--v),var(--p))}
.rip{background:#1f6feb;border-radius:10px;box-shadow:0 3px 0 #164fa8;padding:0 32px}
.rip .r{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.shine{background:#1c1c26;border:1px solid #3a3a48}
.shine::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:skewX(-20deg)}
.shine:hover::after,.shine:focus-visible::after{animation:sh .8s}
@keyframes sh{to{left:130%}}
.hold{background:#2b1620;border:1px solid #6b2a43;color:#ffd7e4;min-width:200px;justify-content:center}
.hold .fill{position:absolute;inset:0;background:linear-gradient(90deg,var(--p),#f43f5e);transform-origin:left;transform:scaleX(0)}
.hold .t{position:relative;z-index:1}
.hold.done{background:#0c3a2b;border-color:var(--m)}
.hold.done .fill{background:var(--m)}
.arrow{background:var(--a);color:#1d1503;padding-right:16px}
.arrow .ar{width:30px;height:30px;border-radius:50%;background:#1d1503;color:var(--a);display:grid;place-items:center;overflow:hidden;position:relative}
.arrow .ar svg{position:absolute;transition:transform .35s}
.arrow .ar svg+svg{transform:translateX(-30px)}
.arrow:hover .ar svg:first-child,.arrow:focus-visible .ar svg:first-child{transform:translateX(30px)}
.arrow:hover .ar svg+svg,.arrow:focus-visible .ar svg+svg{transform:none}
.out{background:transparent;color:var(--m);border:2px solid var(--m);padding:0 26px 0 26px;transition:color .3s}
.out::before{content:"";position:absolute;inset:0;background:var(--m);transform:translateY(101%);transition:transform .35s;z-index:0}
.out:hover,.out:focus-visible{color:#04231a}
.out:hover::before,.out:focus-visible::before{transform:none}
.out>*{position:relative;z-index:1}
.log{margin-top:18px;color:var(--mut);font-size:14px;min-height:22px}
.log b{color:var(--ink)}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}.panel input[type=range]{width:100%}.panel label{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}
</style></head><body><div class="wrap">
<h1>Buttons with a pull.</h1><p class="lead">Move your cursor near the pill, or tab through them — every effect has a keyboard twin.</p>
<div class="panel" role="group" aria-label="Magnet settings">
 <label>Strength <input id="st" type="range" min="0" max="100" value="45"><output id="stv">45</output></label>
 <label>Radius <input id="ra" type="range" min="40" max="220" value="120"><output id="rav">120</output></label>
 <div class="sw"><span id="swl">Magnetic</span><button id="sw" role="switch" aria-checked="true" aria-labelledby="swl"></button></div>
</div>
<div class="grid">
 <div class="cell"><div class="cap">Magnetic pill</div><div class="stage"><button class="b mag" data-mag><span class="in">Book a demo</span></button></div></div>
 <div class="cell"><div class="cap">Ripple</div><div class="stage"><button class="b rip" data-rip>Save changes</button></div></div>
 <div class="cell"><div class="cap">Shine sweep</div><div class="stage"><button class="b shine">Upgrade plan</button></div></div>
 <div class="cell"><div class="cap">Hold to confirm</div><div class="stage"><button class="b hold" id="hd" aria-describedby="hh"><span class="fill"></span><span class="t">Hold to delete</span></button></div><div class="cap" id="hh" style="text-transform:none;letter-spacing:0">Press and hold, or hold Space.</div></div>
 <div class="cell"><div class="cap">Arrow slide</div><div class="stage"><button class="b arrow" data-log="Arrow CTA">Start free <span class="ar" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></button></div></div>
 <div class="cell"><div class="cap">Fill + magnetic icon</div><div class="stage"><button class="b out" data-mag data-log="Outline fill"><span class="in">Explore work</span></button></div></div>
</div>
<p class="log" id="log" role="status" aria-live="polite">Last action: <b>none yet</b></p>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches,coarse=matchMedia('(pointer:coarse)').matches;
let on=true,S=.45,R=120;
const st=$('#st'),ra=$('#ra');
st.oninput=()=>{S=st.value/100;$('#stv').textContent=st.value};ra.oninput=()=>{R=+ra.value;$('#rav').textContent=ra.value};
$('#sw').onclick=e=>{on=!on;e.currentTarget.setAttribute('aria-checked',on)};
const log=t=>{$('#log').innerHTML='Last action: <b></b>';$('#log b').textContent=t};
const mags=$$('[data-mag]').map(b=>({b,in:b.querySelector('.in'),x:0,y:0,tx:0,ty:0}));
function loop(){mags.forEach(m=>{m.x+=(m.tx-m.x)*.18;m.y+=(m.ty-m.y)*.18;
  m.b.style.transform=`translate(${m.x.toFixed(2)}px,${m.y.toFixed(2)}px)`;if(m.in)m.in.style.transform=`translate(${(m.x*.35).toFixed(2)}px,${(m.y*.35).toFixed(2)}px)`});requestAnimationFrame(loop)}
if(!rm&&!coarse){loop();
 addEventListener('pointermove',e=>{mags.forEach(m=>{if(!on){m.tx=m.ty=0;return}
  const r=m.b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy);
  if(d<R+r.width/2){m.tx=dx*S;m.ty=dy*S}else{m.tx=m.ty=0}})});
 document.addEventListener('pointerleave',()=>mags.forEach(m=>m.tx=m.ty=0));}
mags.forEach(m=>m.b.addEventListener('click',()=>log(m.b.textContent.trim()+' clicked')));
$$('[data-log]').forEach(b=>b.addEventListener('click',()=>log(b.dataset.log+' clicked')));
$('[data-rip]').addEventListener('click',function(e){const r=this.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');s.className='r';
  const x=e.clientX?e.clientX-r.left:r.width/2,y=e.clientY?e.clientY-r.top:r.height/2;
  s.style.cssText=`width:${d}px;height:${d}px;left:${x-d/2}px;top:${y-d/2}px`;s.addEventListener('animationend',()=>s.remove());this.append(s);log('Save changes clicked')});
/* hold */
const hd=$('#hd'),fill=hd.querySelector('.fill'),tx=hd.querySelector('.t');let t0=0,raf=0,holding=false,prog=0;
function frame(now){const dt=now-t0;t0=now;prog=holding?Math.min(1,prog+dt/1200):Math.max(0,prog-dt/500);fill.style.transform=`scaleX(${prog})`;
 if(prog>=1&&holding){holding=false;hd.classList.add('done');tx.textContent='Confirmed ✓';log('Delete confirmed');setTimeout(()=>{hd.classList.remove('done');tx.textContent='Hold to delete';prog=0;fill.style.transform='scaleX(0)'},2000);return}
 if(holding||prog>0)raf=requestAnimationFrame(frame)}
function start(){if(hd.classList.contains('done')||holding)return;holding=true;t0=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
function stop(){holding=false;cancelAnimationFrame(raf);t0=performance.now();raf=requestAnimationFrame(frame)}
hd.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel','blur'].forEach(ev=>hd.addEventListener(ev,stop));
hd.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)start()}});
hd.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')stop()});
</script></body></html>
