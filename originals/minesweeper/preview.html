<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minesweeper — Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--bg:#e8ecef;--pn:#f7f9fa;--bd:#c9d1d6;--hid:#c7d0d6;--rev:#eef2f4;--cs:34px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#16222b;font:500 16px/1.4 'Chakra Petch',system-ui,sans-serif;padding:24px 16px;min-height:100svh}
:focus-visible{outline:3px solid #2f6bff;outline-offset:1px;z-index:2;position:relative}
.app{max-width:min(100%,1100px);margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
h1{font:700 28px 'Chakra Petch',sans-serif;margin:0;letter-spacing:.02em}
select,.md{border:1.5px solid var(--bd);background:#fff;border-radius:10px;min-height:44px;padding:0 14px;font:600 15px 'Chakra Petch',sans-serif;color:#16222b;cursor:pointer}
.md[aria-pressed=true]{background:#16222b;color:#fff}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(20,40,50,.12);max-width:100%}
.st{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.dg{background:#16222b;color:#ff5a4d;font:700 28px 'Roboto Mono',monospace;border-radius:8px;padding:2px 10px;min-width:74px;text-align:center;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.fc{width:52px;height:52px;border-radius:14px;border:2px solid var(--bd);background:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.fc:hover{border-color:#2f6bff}
.fc svg{width:34px;height:34px}
.sc{overflow:auto;max-width:100%;padding:2px}
.bd{display:grid;gap:2px;background:#aab5bc;border:2px solid #aab5bc;border-radius:6px;width:max-content;margin:0 auto;touch-action:manipulation}
.c{width:var(--cs);height:var(--cs);border:0;padding:0;font:700 calc(var(--cs)*.55) 'Roboto Mono',monospace;cursor:pointer;background:var(--hid);box-shadow:inset 2px 2px 0 #f2f6f8,inset -2px -2px 0 #94a1a9;display:grid;place-items:center;color:#222;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.c:hover:not(.r):not(.f){background:#d3dbe0}
.c.r{background:var(--rev);box-shadow:none;cursor:default}
.c.n1{color:#2f6bff}.c.n2{color:#1f9d6b}.c.n3{color:#e5484d}.c.n4{color:#6a3bd6}.c.n5{color:#b3541e}.c.n6{color:#0f8a9d}.c.n7{color:#222}.c.n8{color:#666}
.c.m{background:var(--rev);box-shadow:none}.c.hit{background:#ffd2d2}
.c.w{background:#ffe3b8}
.c svg{width:62%;height:62%}
.fl{color:#e5484d}
.bt{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:14px;color:#46565f;font-variant-numeric:tabular-nums}
.bt b{color:#16222b}
.help{font-size:13px;color:#5d6d76;text-align:center;max-width:60ch}
kbd{background:#fff;border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:600 12px 'Roboto Mono',monospace}
.live{position:absolute;left:-9999px}
@media(max-width:700px){:root{--cs:36px}h1{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app"><div class="hd"><h1>Sweep Lane</h1><label><span class="live">Difficulty</span><select id="df"><option value="b">Beginner · 9×9</option><option value="i">Intermediate · 16×16</option><option value="e">Expert · 30×16</option></select></label><button class="md" id="md" type="button" aria-pressed="false">Mode: Dig</button></div>
<div class="pn"><div class="st"><div class="dg" id="mc" aria-label="Mines remaining">010</div><button class="fc" id="fc" type="button" aria-label="New game"></button><div class="dg" id="tm" aria-label="Time in seconds">000</div></div><div class="sc"><div class="bd" id="bd" role="grid" aria-label="Minefield"></div></div></div>
<div class="bt"><span>Beginner best: <b id="b0">—</b></span><span>Intermediate best: <b id="b1">—</b></span><span>Expert best: <b id="b2">—</b></span></div>
<p class="help"><kbd>←↑→↓</kbd> move · <kbd>Space</kbd> reveal · <kbd>F</kbd> flag · <kbd>C</kbd> chord · <kbd>N</kbd> new game. On touch, long-press to flag or switch to Flag mode.</p><div class="live" id="lv" aria-live="polite"></div></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var LV={b:[9,9,10,0],i:[16,16,40,1],e:[30,16,99,2]};
var W,H,M,lvl='b',g,over,won,started,flags,rev,tmr,sec,fx=0,fy=0,flagMode=false,best={};
try{best=JSON.parse(localStorage.getItem('sl-best')||'{}')}catch(e){}
var FACES={ok:'<circle cx="20" cy="20" r="16" fill="#ffd54a" stroke="#16222b" stroke-width="2.5"/><circle cx="14" cy="16" r="2.2" fill="#16222b"/><circle cx="26" cy="16" r="2.2" fill="#16222b"/><path d="M12 25 Q20 32 28 25" fill="none" stroke="#16222b" stroke-width="2.5" stroke-linecap="round"/>',
 wow:'<circle cx="20" cy="20" r="16" fill="#ffd54a" stroke="#16222b" stroke-width="2.5"/><circle cx="14" cy="16" r="2.2" fill="#16222b"/><circle cx="26" cy="16" r="2.2" fill="#16222b"/><ellipse cx="20" cy="27" rx="4" ry="4.5" fill="#16222b"/>',
 win:'<circle cx="20" cy="20" r="16" fill="#ffd54a" stroke="#16222b" stroke-width="2.5"/><rect x="8" y="13" width="24" height="7" rx="3" fill="#16222b"/><path d="M12 26 Q20 33 28 26" fill="none" stroke="#16222b" stroke-width="2.5" stroke-linecap="round"/>',
 dead:'<circle cx="20" cy="20" r="16" fill="#ffd54a" stroke="#16222b" stroke-width="2.5"/><path d="M11 13l6 6m0-6l-6 6M23 13l6 6m0-6l-6 6" stroke="#16222b" stroke-width="2.5" stroke-linecap="round"/><path d="M12 29 Q20 22 28 29" fill="none" stroke="#16222b" stroke-width="2.5" stroke-linecap="round"/>'};
var FLAG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18" stroke="#16222b" stroke-width="2.5" stroke-linecap="round"/><path d="M7 4l12 5-12 5z" fill="#e5484d"/></svg>';
var MINE='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" fill="#16222b"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3" stroke="#16222b" stroke-width="2.2" stroke-linecap="round"/><circle cx="10" cy="10" r="1.6" fill="#fff"/></svg>';
function face(k){$('#fc').innerHTML='<svg viewBox="0 0 40 40" aria-hidden="true">'+FACES[k]+'</svg>'}
function p3(n){n=Math.max(-99,Math.min(999,n));return n<0?'-'+String(-n).padStart(2,'0'):String(n).padStart(3,'0')}
function fmt(s){return s+'s'}
function bests(){['b','i','e'].forEach(function(k,i){$('#b'+i).textContent=best[k]?fmt(best[k]):'—'})}
function nb(x,y,f){for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;var a=x+dx,b=y+dy;if(a>=0&&a<W&&b>=0&&b<H)f(a,b)}}
function init(){clearInterval(tmr);var c=LV[lvl];W=c[0];H=c[1];M=c[2];over=won=started=false;sec=0;flags=0;rev=0;g=[];for(var y=0;y<H;y++){g.push([]);for(var x=0;x<W;x++)g[y].push({m:0,n:0,r:0,f:0})}
 fx=Math.floor(W/2);fy=Math.floor(H/2);$('#tm').textContent='000';$('#mc').textContent=p3(M);face('ok');build();bests()}
function cs(){var avail=Math.min(innerWidth-70,1080);var s=Math.floor(avail/W);return Math.max(28,Math.min(40,s))}
function build(){document.documentElement.style.setProperty('--cs',cs()+'px');var d=$('#bd');d.style.gridTemplateColumns='repeat('+W+',var(--cs))';var h='';for(var y=0;y<H;y++)for(var x=0;x<W;x++)h+='<button class="c" type="button" role="gridcell" data-x="'+x+'" data-y="'+y+'" tabindex="'+(x===fx&&y===fy?0:-1)+'" aria-label="Row '+(y+1)+', column '+(x+1)+', hidden"></button>';d.innerHTML=h}
function el(x,y){return $('#bd').children[y*W+x]}
function paint(x,y,lose){var c=g[y][x],e=el(x,y),lab='Row '+(y+1)+', column '+(x+1)+', ';e.className='c';e.innerHTML='';
 if(c.r){e.classList.add('r');if(c.m){e.classList.add('m','hit');e.innerHTML=MINE;lab+='mine'}else if(c.n){e.classList.add('n'+c.n);e.textContent=c.n;lab+=c.n+' adjacent mines'}else lab+='empty'}
 else if(lose&&c.m&&!c.f){e.classList.add('r','m');e.innerHTML=MINE;lab+='mine'}
 else if(lose&&c.f&&!c.m){e.classList.add('r','w');e.innerHTML=FLAG+'';lab+='wrong flag';e.insertAdjacentHTML('beforeend','');e.style.position='relative';e.innerHTML='<span class="fl">✕</span>'}
 else if(c.f){e.innerHTML=FLAG;lab+='flagged'}else lab+='hidden';e.setAttribute('aria-label',lab)}
function place(sx,sy){var n=0;while(n<M){var x=Math.floor(Math.random()*W),y=Math.floor(Math.random()*H);if(g[y][x].m||Math.abs(x-sx)<=1&&Math.abs(y-sy)<=1)continue;g[y][x].m=1;n++}
 for(var y=0;y<H;y++)for(var x=0;x<W;x++)if(!g[y][x].m){var k=0;nb(x,y,function(a,b){if(g[b][a].m)k++});g[y][x].n=k}}
function startT(){started=true;tmr=setInterval(function(){sec++;$('#tm').textContent=p3(sec)},1000)}
function reveal(x,y){if(over||won)return;var c=g[y][x];if(c.r||c.f)return;if(!started){place(x,y);startT()}
 if(c.m){c.r=1;lose(x,y);return}
 var q=[[x,y]];while(q.length){var p=q.pop(),cc=g[p[1]][p[0]];if(cc.r||cc.f)continue;cc.r=1;rev++;paint(p[0],p[1]);if(!cc.n)nb(p[0],p[1],function(a,b){if(!g[b][a].r&&!g[b][a].f)q.push([a,b])})}
 if(rev===W*H-M)win()}
function lose(x,y){over=true;clearInterval(tmr);face('dead');for(var j=0;j<H;j++)for(var i=0;i<W;i++)paint(i,j,true);paint(x,y);$('#lv').textContent='Boom. You hit a mine. Press N for a new game.'}
function win(){won=true;clearInterval(tmr);face('win');for(var j=0;j<H;j++)for(var i=0;i<W;i++){var c=g[j][i];if(c.m&&!c.f){c.f=1;paint(i,j)}}$('#mc').textContent='000';var nw=!best[lvl]||sec<best[lvl];if(nw){best[lvl]=sec;try{localStorage.setItem('sl-best',JSON.stringify(best))}catch(e){}}bests();$('#lv').textContent='You cleared the field in '+sec+' seconds'+(nw?', a new best.':'.')}
function flag(x,y){if(over||won)return;var c=g[y][x];if(c.r)return;c.f=c.f?0:1;flags+=c.f?1:-1;$('#mc').textContent=p3(M-flags);paint(x,y)}
function chord(x,y){if(over||won)return;var c=g[y][x];if(!c.r||!c.n)return;var f=0;nb(x,y,function(a,b){if(g[b][a].f)f++});if(f!==c.n)return;nb(x,y,function(a,b){reveal(a,b)})}
function foc(x,y){fx=x;fy=y;[].forEach.call($('#bd').children,function(e){e.tabIndex=-1});var e=el(x,y);e.tabIndex=0;e.focus()}
var lp=null,lpFired=false;
$('#bd').addEventListener('pointerdown',function(e){var c=e.target.closest('.c');if(!c)return;face('wow');lpFired=false;if(e.pointerType==='touch'||e.pointerType==='pen'){lp=setTimeout(function(){lpFired=true;flag(+c.dataset.x,+c.dataset.y);if(navigator.vibrate)try{navigator.vibrate(20)}catch(x){}},450)}});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){$('#bd').addEventListener(ev,function(){clearTimeout(lp);if(!over&&!won)face('ok')})});
$('#bd').addEventListener('click',function(e){var c=e.target.closest('.c');if(!c)return;if(lpFired){lpFired=false;return}var x=+c.dataset.x,y=+c.dataset.y;fx=x;fy=y;if(g[y][x].r){chord(x,y);return}if(flagMode)flag(x,y);else reveal(x,y)});
$('#bd').addEventListener('contextmenu',function(e){e.preventDefault();var c=e.target.closest('.c');if(c)flag(+c.dataset.x,+c.dataset.y)});
$('#bd').addEventListener('keydown',function(e){var t=e.target.closest('.c');if(!t)return;var x=+t.dataset.x,y=+t.dataset.y,k=e.key;
 if(k==='ArrowRight'&&x<W-1){e.preventDefault();foc(x+1,y)}else if(k==='ArrowLeft'&&x>0){e.preventDefault();foc(x-1,y)}else if(k==='ArrowDown'&&y<H-1){e.preventDefault();foc(x,y+1)}else if(k==='ArrowUp'&&y>0){e.preventDefault();foc(x,y-1)}
 else if(k==='Home'){e.preventDefault();foc(0,y)}else if(k==='End'){e.preventDefault();foc(W-1,y)}
 else if(k===' '||k==='Enter'){e.preventDefault();if(g[y][x].r)chord(x,y);else reveal(x,y)}
 else if(k==='f'||k==='F'){e.preventDefault();flag(x,y)}else if(k==='c'||k==='C'){e.preventDefault();chord(x,y)}});
document.addEventListener('keydown',function(e){if((e.key==='n'||e.key==='N')&&!/SELECT|INPUT/.test(document.activeElement.tagName)){init()}});
$('#fc').addEventListener('click',init);
$('#df').addEventListener('change',function(){lvl=this.value;init()});
$('#md').addEventListener('click',function(){flagMode=!flagMode;this.setAttribute('aria-pressed',flagMode);this.textContent='Mode: '+(flagMode?'Flag':'Dig')});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){document.documentElement.style.setProperty('--cs',cs()+'px')},100)});
init();
})();
</script></body></html>
