<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bottom Sheet Tab Bar — Navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#e9f1f2;color:#0e2a33;font:400 15px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;overflow-x:hidden}
:focus-visible{outline:3px solid #0f8b8d;outline-offset:2px;box-shadow:0 0 0 5px #fff}
button{font:inherit;color:inherit;cursor:pointer}
.ph{position:relative;width:min(100vw,410px);height:min(800px,calc(100vh - 28px));background:#0e2a33;border-radius:44px;padding:10px;box-shadow:0 40px 80px -30px rgba(14,42,51,.55)}
.fr{position:relative;height:100%;background:#f7fbfb;border-radius:34px;overflow:hidden;isolation:isolate}
.st{display:flex;justify-content:space-between;padding:12px 22px 6px;font:600 12px Sora,sans-serif;position:relative;z-index:3}
.sc{position:absolute;inset:0 0 72px;overflow:auto;padding:36px 0 24px;transition:opacity .2s}
.sc[hidden]{display:none}.sc.fade{opacity:0}
.hd{margin:0 16px;border-radius:24px;overflow:hidden;background:#cfe7e8;height:150px}.hd svg{display:block;width:100%;height:100%}
h1{font:700 24px/1.15 Sora,sans-serif;margin:16px 18px 4px}.sub{margin:0 18px 12px;color:#4c6b72}
.ls{list-style:none;margin:0 16px;padding:0;display:grid;gap:10px}
.cd{background:#fff;border:1px solid #d6e6e8;border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.cd i{flex:none;width:44px;height:44px;border-radius:12px;background:#d9efef;display:grid;place-items:center;font:700 14px Sora,sans-serif;color:#0f8b8d;font-style:normal}
.cd b{display:block;font:600 15px Sora,sans-serif}.cd span{color:#4c6b72;font-size:13px}
.tb{position:absolute;left:0;right:0;bottom:0;height:72px;background:#fff;border-top:1px solid #d6e6e8;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.tl{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.tl [role=tab]{all:unset;box-sizing:border-box;position:relative;height:100%;display:grid;place-items:center;align-content:center;gap:2px;font:600 11px Sora,sans-serif;color:#4c6b72;cursor:pointer;z-index:1;min-width:0}
.tl [role=tab] svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tl [role=tab][aria-selected=true]{color:#0f8b8d}.tl [role=tab]:focus-visible{outline:3px solid #0f8b8d;outline-offset:-4px;border-radius:14px}
.pill{position:absolute;top:8px;height:56px;width:20%;border-radius:18px;background:rgba(15,139,141,.12);transition:transform .35s cubic-bezier(.3,1.3,.5,1);z-index:0}
.gap{pointer-events:none}
.ct{all:unset;box-sizing:border-box;position:absolute;left:50%;top:-22px;margin-left:-30px;width:60px;height:60px;border-radius:50%;background:#f0b86b;color:#2b1a00;display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 24px -8px rgba(240,184,107,.9),0 0 0 6px #fff;z-index:6}
.ct svg{width:28px;height:28px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}.ct[aria-expanded=true] svg{transform:rotate(45deg)}
.ct:focus-visible{outline:3px solid #0f8b8d;outline-offset:6px}
.sh-s{position:absolute;inset:0;background:#0e2a33;opacity:0;pointer-events:none;transition:opacity .3s;z-index:7}.sh-s.on{pointer-events:auto}
.sh{position:absolute;left:0;right:0;bottom:0;height:88%;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -18px 40px -12px rgba(14,42,51,.3);z-index:8;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1);visibility:hidden;padding-bottom:72px}
.sh.vis{visibility:visible}.sh.drag{transition:none}
.hdl{all:unset;box-sizing:border-box;display:block;width:100%;padding:14px 0 6px;cursor:grab;touch-action:none;text-align:center;flex:none}
.hdl:before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#b8d0d3;margin:0 auto}
.hdl:focus-visible{outline:3px solid #0f8b8d;outline-offset:-3px;border-radius:24px 24px 0 0}
.sb{flex:1;overflow:hidden;padding:0 18px 20px;min-height:0}.sh.full .sb{overflow:auto}
.sh h2{font:700 22px Sora,sans-serif;margin:4px 0 12px;touch-action:none}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.qa button{all:unset;box-sizing:border-box;cursor:pointer;background:#f1f8f8;border:1px solid #d6e6e8;border-radius:16px;padding:12px 8px;text-align:center;font:600 12px/1.25 Sora,sans-serif;display:grid;gap:6px;justify-items:center;min-height:76px;align-content:center;transition:transform .15s,background .2s}
.qa button:hover{background:#e1f2f2}.qa button:active{transform:scale(.96)}.qa button:focus-visible{outline:3px solid #0f8b8d;outline-offset:2px}
.qa svg{width:22px;height:22px;stroke:#0f8b8d;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sh h3{font:600 14px Sora,sans-serif;color:#4c6b72;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);background:#0e2a33;color:#fff;padding:10px 16px;border-radius:999px;font:500 13px Inter,sans-serif;opacity:0;pointer-events:none;transition:.25s;z-index:20;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:560px){body{display:block}.ph{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none}.fr{border-radius:0}.qa{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="ph"><div class="fr" id="fr">

<nav class="tb" aria-label="Main"><div class="pill" id="pill"></div>
<div class="tl" role="tablist" aria-label="Sections" id="tl">
<button role="tab" id="t0" aria-selected="true" aria-controls="s0" data-i="0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 12 4l9 8M5 10v10h14V10"/></svg>Today</button>

<button role="tab" id="t2" aria-selected="false" aria-controls="s2" tabindex="-1" data-i="2"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Saved</button>
<button role="tab" id="t3" aria-selected="false" aria-controls="s3" tabindex="-1" data-i="3"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>You</button>
</div>
<button class="ct" id="ct" aria-label="Plan a walk" aria-haspopup="dialog" aria-expanded="false" aria-controls="sh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</nav>
<div class="sh-s" id="scrim"></div>
<section class="sh" id="sh" role="dialog" aria-label="Plan a walk" inert>
<button class="hdl" id="hdl" role="slider" aria-label="Sheet height" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0" aria-valuetext="Closed"></button>
<div class="sb"><h2>Plan a walk</h2>
<div class="qa" id="qa"></div>
<h3>Suggested routes</h3>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div></div>
<script>

pos(0);

var st=0,names=['Closed','Half open','Fully open'],dragging=false,sy=0,base=0,H=0,lastY=0,lastT=0,vel=0;
