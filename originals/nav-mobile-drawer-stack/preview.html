<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drill-Down Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#dfe3e8;font:16px/1.4 Outfit,system-ui,sans-serif;color:#0f1d22;display:flex;justify-content:center}
.ph{position:relative;width:100%;max-width:420px;height:100vh;min-height:640px;background:#f6f8f9;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.15)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid #e3e8ec}
.bar b{font-size:20px}.bar button{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:10px}
.bar button:focus-visible,.row:focus-visible,.bk:focus-visible{outline:3px solid #0e7490}
.hero{padding:40px 24px}.hero h1{font-size:30px;margin:0 0 6px}.hero p{color:#5f6e75;margin:0}
.menu{position:absolute;inset:0;background:#fff;transform:translateX(-100%);transition:transform .3s;z-index:5;display:flex;flex-direction:column}
.menu.open{transform:none}
.hd{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid #e3e8ec;min-height:62px}
.hd .t{flex:1;font:700 13px Outfit;letter-spacing:.1em;text-transform:uppercase;color:#0e7490;text-align:center}
.bk,.cl{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;font-weight:500;color:#0e7490}
.bk[hidden]{display:none}
.stack{position:relative;flex:1;overflow:hidden}
.pn{position:absolute;inset:0;overflow:auto;background:#fff;transition:transform .3s,opacity .3s;padding:8px 0}
.pn.right{transform:translateX(100%)}.pn.left{transform:translateX(-30%);opacity:0}
.row{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 24px;font-size:20px;font-weight:500;cursor:pointer;border-bottom:1px solid #f0f3f5}
.pn.sub .row{font-size:17px}.row:hover{background:#f1f8fa}.row svg{opacity:.5}
.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#0f1d22;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:9}
@media(prefers-reduced-motion:reduce){*{transition:opacity .01s!important}}
</style></head><body><div class="ph" id="ph">
<div class="bar" id="bar"><b>Hollis &amp; Co.</b><button id="hb" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
<div class="hero"><h1>Autumn arrivals</h1><p>Wool, waxed cotton and good boots.</p></div>
<nav class="menu" id="menu" aria-label="Main" role="dialog" aria-modal="true" aria-label="Menu"><div class="hd"><button class="bk" id="bk" hidden>← Back</button><span class="t" id="tt">Menu</span><button class="cl" id="cl">Close</button></div><div class="stack" id="st"></div></nav>
<div class="toast" id="to" hidden role="status"></div></div>
<script>
const T={root:{t:"Menu",i:[["Shop","shop"],["Learn","learn"],["Support","support"],["Account"]]},shop:{t:"Shop",i:[["Women","women"],["Men"],["Kids"],["Sale"]]},women:{t:"Women",i:[["Jackets"],["Knitwear"],["Boots"],["Accessories"]]},learn:{t:"Learn",i:[["Care guides"],["Sizing help"],["Our materials"]]},support:{t:"Support",i:[["Shipping"],["Returns"],["Contact us"]]}};
const st=document.getElementById("st"),$=i=>document.getElementById(i);let path=["root"];
const chev='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';
for(const k in T){const p=document.createElement("div");p.className="pn"+(k=="root"?"":" sub right");p.id="p-"+k;p.inert=k!="root";p.innerHTML=T[k].i.map(([n,c])=>`<button class="row" data-go="${c||""}" data-n="${n}">${n}${c?chev:""}</button>`).join("");st.appendChild(p)}
function view(){const cur=path[path.length-1];for(const k in T){const p=$("p-"+k),idx=path.indexOf(k);p.classList.remove("right","left");if(idx==-1)p.classList.add("right");else if(k!=cur)p.classList.add("left");p.inert=k!=cur}
$("tt").textContent=T[cur].t;$("bk").hidden=path.length==1}
function go(k){path.push(k);view();setTimeout(()=>$("p-"+k).querySelector(".row").focus(),50)}
function back(){if(path.length>1){path.pop();view();setTimeout(()=>$("p-"+path[path.length-1]).querySelector(".row").focus(),50)}}
function open(){$("menu").classList.add("open");$("hb").setAttribute("aria-expanded","true");path=["root"];view();setTimeout(()=>$("p-root").querySelector(".row").focus(),60);$("bar").inert=true}
function close(){$("menu").classList.remove("open");$("hb").setAttribute("aria-expanded","false");$("bar").inert=false;$("hb").focus()}
$("hb").onclick=open;$("cl").onclick=close;$("bk").onclick=back;
st.addEventListener("click",e=>{const r=e.target.closest(".row");if(!r)return;if(r.dataset.go)go(r.dataset.go);else{const t=$("to");t.textContent="Navigated to "+r.dataset.n;t.hidden=false;close();clearTimeout(open.t);open.t=setTimeout(()=>t.hidden=true,2000)}});
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&$("menu").classList.contains("open")){path.length>1?back():close()}});
view();
</script></body></html>
