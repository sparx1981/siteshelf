<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newsletter Archive — Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Playfair+Display:ital,wght@0,700;1,900&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--bg:#f7f2e9;--ink:#1d1a16;--mut:#6d655a;--rule:#d9d0bf;--ac:#c8402a;--card:#fffaf0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 'Source Serif 4',Georgia,serif}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 60px}
.lab{font:700 12px 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
header{text-align:center;padding:36px 0 22px;border-bottom:3px double var(--ink)}
h1{font:900 italic clamp(44px,9vw,104px)/.95 'Playfair Display',serif;margin:8px 0 10px;letter-spacing:-.02em}
.top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;margin:28px 0}
.feat,.sub{border:1px solid var(--rule);background:var(--card);padding:26px}
.feat h2{font:700 clamp(28px,4vw,42px)/1.1 'Playfair Display',serif;margin:10px 0}
.feat p{margin:0 0 16px;color:#3c352c}
.meta{display:flex;gap:14px;flex-wrap:wrap;font:500 13px 'DM Sans',sans-serif;color:var(--mut);margin-bottom:16px}
.tag{color:var(--ac);font:700 12px 'DM Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.btn{display:inline-block;background:var(--ink);color:#fff;font:700 14px 'DM Sans',sans-serif;padding:12px 20px;border:0;border-radius:2px;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{background:var(--ac)}
.sub{position:sticky;top:16px;align-self:start}
.sub h3{font:700 24px 'Playfair Display',serif;margin:6px 0 8px}
.sub p{font-size:15px;margin:0 0 14px;color:var(--mut)}
input[type=email],input[type=search]{width:100%;font:400 16px 'Source Serif 4',serif;padding:11px 12px;border:1px solid var(--ink);background:#fff;border-radius:2px;min-height:44px;color:var(--ink)}
input.bad{border-color:var(--ac);box-shadow:0 0 0 2px rgba(200,64,42,.2)}
.err{color:var(--ac);font:500 13px 'DM Sans',sans-serif;min-height:20px;margin:4px 0 8px}
.ok{background:#e8efe0;border:1px solid #9bb48a;padding:12px;font-size:15px}
.tools{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:8px;border-top:1px solid var(--ink);padding-top:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--ink);background:transparent;border-radius:99px;padding:8px 16px;font:700 13px 'DM Sans',sans-serif;cursor:pointer;min-height:40px;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
#cnt{font:500 14px 'DM Sans',sans-serif;color:var(--mut);margin:6px 0 0}
h2.yr{font:900 italic 44px 'Playfair Display',serif;margin:30px 0 4px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px}
.iss{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:18px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit;cursor:pointer}
.iss .n{font:900 italic 38px/1 'Playfair Display',serif;color:var(--ac);text-align:right}
.iss h4{font:700 20px/1.25 'Playfair Display',serif;margin:0 0 4px}
.iss:hover h4{text-decoration:underline;text-decoration-color:var(--ac);text-underline-offset:4px}
.iss p{margin:0 0 6px;font-size:15px;color:#4a4237}
.iss.seen h4{color:var(--mut)}
.iss .meta{margin:0;font-size:12px}
mark{background:#ffd9a0;color:inherit;padding:0 1px}
.empty{padding:40px 0;text-align:center;color:var(--mut)}
@media(max-width:820px){.top{grid-template-columns:minmax(0,1fr)}.sub{position:static}.list{grid-template-columns:minmax(0,1fr)}.iss{grid-template-columns:48px minmax(0,1fr)}.iss .n{font-size:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="wrap">
<header><div class="lab">Est. 2019 · Every Thursday · <span id="tot">38</span> issues</div><h1>The Slow Dispatch</h1><div style="color:var(--mut);font-style:italic">A weekly letter on craft, cities and small tools</div></header>
<div class="top">
<article class="feat" id="feat"></article>
<aside class="sub"><div class="lab">Free, weekly</div><h3>Get the next letter</h3><p>One considered email a week. No tracking pixels, no upsell, unsubscribe in a click.</p>
<form id="sf" novalidate><label for="em" class="lab" style="display:block;margin-bottom:6px">Email address</label><input id="em" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="er"><div class="err" id="er" role="alert"></div><button class="btn" type="submit" style="width:100%">Subscribe</button></form>
<div class="ok" id="ok" hidden></div></aside>
</div>
<div class="tools"><div><label class="lab" for="q" style="display:block;margin-bottom:6px">Search the archive <span style="text-transform:none;letter-spacing:0">(press /)</span></label><input type="search" id="q" placeholder="Try “brass”, “tram” or “notebook”"></div>
<div class="chips" id="chips" role="group" aria-label="Filter by topic"></div></div>
<p id="cnt" aria-live="polite"></p>
<div id="out"></div>
</div>
<script>
(function(){
var topics=['Craft','Cities','Tools','Notes'];
var frag=[['The case for the brass pencil','Why a heavy, humble instrument changed how three makers sketch.','Craft'],['Trams that never quite arrive','On the poetry of timetables in a city built for another century.','Cities'],['A notebook with no lines','Notes on starting pages without a plan, and finishing them anyway.','Notes'],['Sharpening is a conversation','What a whetstone teaches about patience and feedback.','Tools'],['Streets named after trades','Reading the old guild quarter by its signage.','Cities'],['The small tool shelf','Seven things under twenty pounds that earn their place.','Tools'],['Repair cafés, revisited','A year of mended kettles and the people who mend them.','Craft'],['Letters from the night market','Stalls, steam and the economics of a good lantern.','Cities'],['Against the perfect setup','Fewer apps, better habits and a drawer of spare cables.','Notes'],['How a hinge is made','Following a single brass hinge from rod to doorframe.','Craft'],['The quiet map','Drawing your neighbourhood from memory, then checking.','Cities'],['Tape, glue, patience','A field guide to temporary fixes that last.','Tools'],['On finishing','Why the last ten percent feels like a different job.','Notes'],['Wood has opinions','Grain, season and the stubbornness of a good plank.','Craft'],['Bridges at dusk','Walking the river crossings in order, west to east.','Cities'],['The ruler problem','Metric, imperial and the tape measure in your pocket.','Tools'],['Small rituals','Morning tea, evening lists and the value of a fixed start.','Notes']];
var mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var items=[];var d=new Date(2025,9,9);
for(var i=0;i<38;i++){var f=frag[i%frag.length];var t=f[0]+(i>=frag.length?' — part '+(Math.floor(i/frag.length)+1):'');
 items.push({n:38-i,t:t,s:f[1],c:f[2],d:new Date(d.getTime()),m:4+((i*7)%9)});d.setDate(d.getDate()-7);}
var seen={};try{seen=JSON.parse(localStorage.getItem('sd-seen')||'{}')}catch(e){}
var cat='All',q='';
var $=function(s){return document.querySelector(s)};
function fd(x){return x.getDate()+' '+mon[x.getMonth()]+' '+x.getFullYear()}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hl(s){s=esc(s);if(!q)return s;var r=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return s.replace(r,'<mark>$1</mark>')}
var L=items[0];
$('#feat').innerHTML='<div class="tag">Latest · Issue '+L.n+' · '+L.c+'</div><h2>'+esc(L.t)+'</h2><p>'+esc(L.s)+' Plus the usual links, a reader question and one recommendation worth the walk.</p><div class="meta"><span>'+fd(L.d)+'</span><span>'+L.m+' min read</span></div><a class="btn" href="#issue-'+L.n+'" data-n="'+L.n+'">Read issue '+L.n+'</a>';
function chips(){var h='';['All'].concat(topics).forEach(function(t){h+='<button class="chip" type="button" aria-pressed="'+(t===cat)+'" data-c="'+t+'">'+t+'</button>'});$('#chips').innerHTML=h}
function render(){
 var low=q.toLowerCase();
 var list=items.filter(function(x){return (cat==='All'||x.c===cat)&&(!low||(x.t+' '+x.s).toLowerCase().indexOf(low)>-1)});
 $('#cnt').textContent='Showing '+list.length+' of '+items.length+' issues';
 if(!list.length){$('#out').innerHTML='<div class="empty"><p>No issues match that search.</p><button class="btn" id="clr" type="button">Clear filters</button></div>';return}
 var h='',yr=null,open=false;
 list.forEach(function(x){var y=x.d.getFullYear();if(y!==yr){if(open)h+='</div>';h+='<h2 class="yr">'+y+'</h2><div class="list">';yr=y;open=true}
  h+='<a class="iss'+(seen[x.n]?' seen':'')+'" href="#issue-'+x.n+'" data-n="'+x.n+'"><span class="n">'+x.n+'</span><span><h4>'+hl(x.t)+(seen[x.n]?' <span aria-label="read" style="color:var(--ac)">✓</span>':'')+'</h4><p>'+hl(x.s)+'</p><span class="meta"><span class="tag">'+x.c+'</span><span>'+fd(x.d)+'</span><span>'+x.m+' min</span></span></span></a>'});
 $('#out').innerHTML=h+'</div>';
}
document.addEventListener('click',function(e){
 var c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;chips();render();return}
 if(e.target.id==='clr'){cat='All';q='';$('#q').value='';chips();render();return}
 var a=e.target.closest('[data-n]');if(a){e.preventDefault();seen[a.dataset.n]=1;try{localStorage.setItem('sd-seen',JSON.stringify(seen))}catch(x){}render()}
});
$('#q').addEventListener('input',function(e){q=e.target.value.trim();render()});
document.addEventListener('keydown',function(e){if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
var em=$('#em');
function chk(){var v=em.value.trim();var ok=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);em.classList.toggle('bad',!ok);em.setAttribute('aria-invalid',!ok);$('#er').textContent=ok?'':(v?'That doesn’t look like a complete email address.':'Please enter your email address.');return ok}
em.addEventListener('blur',function(){if(em.value)chk()});
$('#sf').addEventListener('submit',function(e){e.preventDefault();if(!chk()){em.focus();return}
 $('#sf').hidden=true;var o=$('#ok');o.hidden=false;o.textContent='Thank you. A confirmation note is on its way to '+em.value.trim()+'. Your first letter lands Thursday.'});
chips();render();
})();
</script></body></html>
