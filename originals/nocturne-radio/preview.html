<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nocturne Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#17101f;--ink:#efe8f7;--mute:#a99bbd;--amber:#ffb347;--rule:rgba(239,232,247,.18)}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/1.5 'DM Mono',ui-monospace,monospace;letter-spacing:.06em}
.hero{position:relative;min-height:100svh;overflow:hidden;background:var(--bg)}
.disc{position:absolute;right:-6vw;top:50%;width:min(62vh,46vw);aspect-ratio:1;margin-top:calc(min(62vh,46vw)/-2);border-radius:50%!important;
 background:conic-gradient(transparent 0deg,rgba(255,255,255,.1) 30deg,transparent 70deg,transparent 180deg,rgba(255,255,255,.08) 210deg,transparent 250deg),repeating-radial-gradient(circle,#0c0812 0 2px,#1d1428 2px 3px);
 animation:spin 7s linear infinite}
.lab{position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%!important;background:var(--amber);color:var(--bg);display:grid;place-items:center;font:800 14px/1 Syne,sans-serif;letter-spacing:.02em}
.lab:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%!important;background:var(--bg)}
.lab span{transform:translateY(-22px)}
@keyframes spin{to{transform:rotate(360deg)}}
.over{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;padding:36px 56px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;text-transform:uppercase}
.name{font:800 18px/1 Syne,sans-serif;letter-spacing:-.01em}
.air{display:flex;align-items:center;gap:10px}
.lamp{width:10px;height:10px;border-radius:50%!important;background:var(--amber);animation:lamp 1.6s ease-in-out infinite}
@keyframes lamp{50%{opacity:.35}}
h1{font:800 clamp(52px,8.6vw,132px)/.92 Syne,sans-serif;letter-spacing:-.035em;text-transform:uppercase;margin:auto 0 0;max-width:9em;padding-top:56px}
.sched{margin-top:32px;max-width:460px;border-top:1px solid var(--rule)}
.sched div{display:flex;gap:18px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.sched b{color:var(--amber);font-weight:500}.sched i{font-style:normal;flex:1;letter-spacing:.02em}.sched em{font-style:normal;color:var(--mute);text-transform:uppercase}
.ctl{display:flex;align-items:center;gap:16px;margin:24px 0 96px}
.play{width:56px;height:56px;border-radius:50%!important;border:1.5px solid var(--amber);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.play:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
.ico{display:block;width:16px;height:16px;position:relative}
.hero[data-playing="true"] .ico:before,.hero[data-playing="true"] .ico:after{content:"";position:absolute;top:0;width:4px;height:16px;background:var(--amber)}
.hero[data-playing="true"] .ico:before{left:2px}.hero[data-playing="true"] .ico:after{right:2px}
.hero[data-playing="false"] .ico{border-style:solid;border-width:8px 0 8px 14px;border-color:transparent transparent transparent var(--amber);width:0;height:0;margin-left:4px}
.hero[data-playing="false"] .disc,.hero[data-playing="false"] .bars i,.hero[data-playing="false"] .lamp{animation-play-state:paused}
.bars{position:absolute;left:56px;right:56px;bottom:0;height:72px;display:flex;gap:4px;align-items:flex-end;z-index:2}
.bars i{width:6px;height:72px;background:var(--amber);transform-origin:bottom;transform:scaleY(.15);animation:lvl 1s ease-in-out infinite alternate}
@keyframes lvl{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
.tag{color:var(--mute)}
@media(max-width:800px){.over{padding:24px 20px 0}.tag{display:none}.disc{width:70vw;right:-22vw;top:8vh;margin-top:0;opacity:.55}h1{font-size:clamp(44px,12vw,80px)}.bars{left:20px;right:20px}.bars i:nth-child(n+19){display:none}}
@media(prefers-reduced-motion:reduce){.disc,.bars i,.lamp{animation-play-state:paused}}
</style></head><body>
<section class="hero" id="hero" data-playing="true">
  <div class="disc" aria-hidden="true"><div class="lab"><span>NOCTURNE 88.4</span></div></div>
  <div class="over">
    <div class="top"><span class="name">Nocturne Radio</span><span class="tag">Broadcasting from a flat above a launderette</span><span class="air"><i class="lamp"></i>On air</span></div>
    <h1>Music for the hours nobody asked for.</h1>
    <div class="sched"><div><b>00:00</b><i>Midnight Sun with Ines Okoro</i><em>Dub</em></div><div><b>03:00</b><i>The Long Fade</i><em>Ambient</em></div><div><b>05:30</b><i>Tea &amp; Static</i><em>Folk</em></div></div>
    <div class="ctl"><button class="play" id="play" type="button" aria-pressed="true" aria-label="Pause"><span class="ico"></span></button><span class="tag">Live now · 88.4 FM</span></div>
  </div>
  <div class="bars" id="bars" aria-hidden="true"></div>
</section>
<script>
(function(){
  var hero=document.getElementById('hero'),btn=document.getElementById('play'),bars=document.getElementById('bars');
  for(var i=0;i<28;i++){var b=document.createElement('i');b.style.animationDuration=(700+((i*137)%600))+'ms';b.style.animationDelay='-'+((i*211)%1300)+'ms';bars.appendChild(b)}
  function set(on){hero.setAttribute('data-playing',on);btn.setAttribute('aria-pressed',on);btn.setAttribute('aria-label',on?'Pause':'Play')}
  btn.addEventListener('click',function(){set(hero.getAttribute('data-playing')!=='true')});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)set(false);
})();
</script></body></html>
