<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#060d1f;--ink:#e8eefc;--mut:#8a97b8;--t:#40e0d0;--v:#8b7bff;--c:#ff8a7a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Sora,system-ui,sans-serif;overflow-x:hidden}
.hero{position:relative;min-height:100svh;padding:40px 64px;display:grid;grid-template-columns:1fr 1.1fr;grid-template-rows:auto 1fr;column-gap:40px;background:radial-gradient(circle at 68% 50%,rgba(64,224,208,.14),transparent 55%)}
nav{grid-column:1/3;display:flex;align-items:center;gap:32px}
.mark{font-weight:600;font-size:18px;display:flex;align-items:center;gap:10px;margin-right:auto}
.mark i{width:10px;height:10px;border-radius:50%;background:var(--t)}
nav a{color:var(--mut);text-decoration:none;font-size:14px}
.pill{height:40px;padding:0 20px;border:1px solid var(--t);border-radius:20px;background:none;color:var(--ink);font:500 14px Sora;display:inline-flex;align-items:center}
.l{align-self:center;max-width:560px}
.lab{font:500 12px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--t)}
h1{font-size:clamp(40px,5.2vw,80px);font-weight:600;line-height:1.05;letter-spacing:-.03em;margin:18px 0 20px}
.l p{font-size:18px;color:var(--mut);margin:0 0 32px}
.btn{display:inline-block;height:48px;line-height:48px;padding:0 26px;border-radius:24px;font:600 15px Sora;text-decoration:none;margin-right:12px;border:1px solid var(--t)}
.b1{background:var(--t);color:var(--bg)}.b2{color:var(--ink)}
.r{align-self:center;display:flex;flex-direction:column;align-items:center}
svg{width:min(100%,560px);height:auto;overflow:visible}
.ring{fill:none;stroke:rgba(232,238,252,.14);stroke-width:1}
.arc{fill:none;stroke-width:4;stroke-linecap:round;transition:opacity .25s;opacity:.55}
.orb{transform-origin:300px 300px;animation:spin linear infinite}
.o1{animation-duration:18s}.o2{animation-duration:28s}.o3{animation-duration:40s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.paused .orb{animation-play-state:paused}
.lg{font:500 12px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em;fill:var(--mut)}
.fig{font:700 52px Sora;fill:var(--ink);font-variant-numeric:tabular-nums;text-anchor:middle}
.legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.row{display:flex;gap:14px;align-items:center;padding:10px 16px;border:1px solid rgba(232,238,252,.14);background:none;color:var(--ink);font:500 13px 'IBM Plex Mono',monospace;border-radius:8px;cursor:pointer}
.row i{width:10px;height:10px;border-radius:50%}
.row:hover,.row:focus-visible{border-color:var(--c2);outline:none}
@media(max-width:960px){.hero{grid-template-columns:1fr;padding:24px 20px;grid-template-rows:auto auto auto}nav a{display:none}nav,.r,.l{grid-column:1}nav{order:-2}.r{order:-1;margin-top:12px}.l{margin-top:12px}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style></head><body>
<main class="hero">
<nav><span class="mark"><i></i>Orbit Ledger</span><a href="#">Product</a><a href="#">Pricing</a><a href="#">Security</a><a class="pill" href="#">Open account</a></nav>
<section class="l"><div class="lab">Business banking, in orbit</div><h1>Every pound, in its place.</h1><p>Pots for tax, payroll and profit that fill themselves the moment an invoice lands.</p><a class="btn b1" href="#">Start free</a><a class="btn b2" href="#">See how pots work</a></section>
<section class="r" id="r">
<svg viewBox="0 0 600 600" role="img" aria-label="Three pots orbiting a total balance">
<circle class="ring" cx="300" cy="300" r="120"/><circle class="ring" cx="300" cy="300" r="190"/><circle class="ring" cx="300" cy="300" r="260"/>
<circle class="arc" id="a0" cx="300" cy="300" r="120" stroke="#40e0d0" stroke-dasharray="226 528" transform="rotate(-90 300 300)"/>
<circle class="arc" id="a1" cx="300" cy="300" r="190" stroke="#8b7bff" stroke-dasharray="358 836" transform="rotate(-90 300 300)"/>
<circle class="arc" id="a2" cx="300" cy="300" r="260" stroke="#ff8a7a" stroke-dasharray="490 1144" transform="rotate(-90 300 300)"/>
<g class="orb o1"><circle cx="300" cy="180" r="7" fill="#40e0d0"/></g>
<g class="orb o2"><circle cx="300" cy="110" r="7" fill="#8b7bff"/></g>
<g class="orb o3"><circle cx="300" cy="40" r="7" fill="#ff8a7a"/></g>
<text class="lg" x="300" y="268" text-anchor="middle" id="cl">Total balance</text>
<text class="fig" x="300" y="326" id="fig">£0.00</text>
</svg>
<div class="legend" id="lg"></div>
</section>
</main>
<script>
const pots=[{n:'Tax',v:9640.10,c:'#40e0d0'},{n:'Payroll',v:21300.00,c:'#8b7bff'},{n:'Profit',v:17270.40,c:'#ff8a7a'}];
const total=pots.reduce((a,p)=>a+p.v,0);
const fig=document.getElementById('fig'),cl=document.getElementById('cl'),root=document.getElementById('r');
const fmt=n=>'£'+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
let cur=0,raf;
function tween(to,ms){cancelAnimationFrame(raf);const from=cur,t0=performance.now();
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){cur=to;fig.textContent=fmt(to);return}
 (function s(t){const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);cur=from+(to-from)*e;fig.textContent=fmt(cur);if(k<1)raf=requestAnimationFrame(s)})(t0)}
const lg=document.getElementById('lg');
pots.forEach((p,i)=>{const b=document.createElement('button');b.className='row';b.style.setProperty('--c2',p.c);
 b.innerHTML='<i style="background:'+p.c+'"></i>'+p.n+' '+fmt(p.v);
 const on=()=>{root.classList.add('paused');document.getElementById('a'+i).style.opacity=1;cl.textContent=p.n+' pot';tween(p.v,250)};
 const off=()=>{root.classList.remove('paused');document.getElementById('a'+i).style.opacity='';cl.textContent='Total balance';tween(total,250)};
 b.addEventListener('mouseenter',on);b.addEventListener('focus',on);b.addEventListener('mouseleave',off);b.addEventListener('blur',off);lg.appendChild(b)});
tween(total,1200);
</script></body></html>
