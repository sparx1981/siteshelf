<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hues — Palette Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--ink:#141414;--mut:#6c6c66;--line:#e6e6df}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fafaf7;color:var(--ink);font:500 14px/1.4 'Space Grotesk',sans-serif;display:flex;flex-direction:column;height:100dvh}
:focus-visible{outline:3px solid #3b5bff;outline-offset:2px}
.tb{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:#fff}
h1{font:700 22px 'Space Grotesk',sans-serif;margin:0 10px 0 0;letter-spacing:-.03em}
.f{display:flex;align-items:center;gap:8px}
.f input[type=color]{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff;cursor:pointer}
.f input[type=text],select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:500 14px 'JetBrains Mono',monospace;background:#fff;color:var(--ink);width:104px}
select{width:auto;font-family:'Space Grotesk',sans-serif}
.b{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:9px 16px;font:700 14px 'Space Grotesk',sans-serif;cursor:pointer}
.b:hover{background:#333}.b.o{background:#fff;color:var(--ink);border-color:var(--line)}.b.o:hover{background:#f3f3ee}.b:disabled{opacity:.35;cursor:default}
.hint{color:var(--mut);font-size:13px}
.sp{margin-left:auto;display:flex;gap:6px}
.sw{flex:1;display:flex;min-height:0}
.c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 16px 26px;gap:10px;position:relative;transition:background-color .35s,flex .2s}
.c:hover{flex:1.25}
.hx{all:unset;font:700 26px 'Space Grotesk',sans-serif;text-transform:uppercase;letter-spacing:.01em;cursor:pointer;border-radius:8px;padding:2px 4px;margin:0 -4px;position:relative}
.hx:hover{background:rgba(127,127,127,.18)}.hx:focus-visible{outline:3px solid currentColor}
.cp{position:absolute;left:4px;top:-22px;font-size:12px;background:rgba(0,0,0,.75);color:#fff;border-radius:6px;padding:1px 8px;opacity:0;transition:opacity .15s;pointer-events:none;font-weight:500}
.cp.on{opacity:1}
.hs{font:400 12.5px 'JetBrains Mono',monospace;opacity:.8}
.bg{display:flex;flex-wrap:wrap;gap:6px}
.bd{font:500 11.5px 'JetBrains Mono',monospace;border:1px solid currentColor;border-radius:999px;padding:1px 9px;opacity:.9;white-space:nowrap}
.bd.fail{opacity:.55;text-decoration:line-through;width:auto}
.ac{display:flex;gap:6px;align-items:center}
.ic{all:unset;box-sizing:border-box;width:38px;height:38px;border-radius:10px;border:1px solid currentColor;display:grid;place-items:center;cursor:pointer;opacity:.85}
.ic:hover{background:rgba(127,127,127,.2);opacity:1}.ic:focus-visible{outline:3px solid currentColor;outline-offset:2px}
.ic[aria-pressed=true]{background:currentColor}.ic[aria-pressed=true] svg{filter:invert(1)}
.ic svg{width:18px;height:18px}
.ft{width:100%;display:none;margin-top:6px}
.c:hover .ft,.c:focus-within .ft{display:block}
.ft input{width:100%;accent-color:currentColor}
.ex{border-top:1px solid var(--line);background:#fff}
.ex>button{all:unset;display:flex;width:100%;box-sizing:border-box;justify-content:space-between;padding:10px 18px;cursor:pointer;font-weight:700}
.ex>button:focus-visible{outline:3px solid #3b5bff;outline-offset:-3px}
.ex .bd2{padding:0 18px 16px}
.ex .tabs{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.ex .tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font:500 13px 'Space Grotesk',sans-serif;cursor:pointer}
.ex .tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ex pre{margin:0;background:#141414;color:#e7e7df;border-radius:10px;padding:12px 14px;font:400 12.5px/1.6 'JetBrains Mono',monospace;overflow:auto;max-height:150px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,10px);background:var(--ink);color:#fff;border-radius:10px;padding:8px 16px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.sw{flex-direction:column;overflow:auto}.c{flex:none;min-height:21vh;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 16px}.c:hover{flex:none}.hx{font-size:22px}.ft{display:none!important}.sp{margin-left:0}.hint{display:none}.tb{padding:10px 12px}.cp{top:-18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="tb"><h1>Hues</h1><div class="f"><input type="color" id="bc" aria-label="Base colour" value="#3b5bff"><input type="text" id="bx" value="#3B5BFF" aria-label="Base colour hex" maxlength="7"></div>
<select id="hm" aria-label="Harmony"><option value="analogous">Analogous</option><option value="complementary">Complementary</option><option value="triadic">Triadic</option><option value="split">Split complementary</option><option value="mono">Monochrome</option><option value="random">Random</option></select>
<button class="b" id="gn">Generate</button><span class="hint">or press Space</span><div class="sp"><button class="b o" id="ud" aria-label="Undo">↶ Undo</button><button class="b o" id="rd" aria-label="Redo">Redo ↷</button></div></div>
<div class="sw" id="sw" role="list" aria-label="Palette"></div>
<div class="ex"><button id="et" aria-expanded="false" aria-controls="eb"><span>Export palette</span><span id="ea">▲</span></button><div class="bd2" id="eb" hidden><div class="tabs" id="tabs" role="group" aria-label="Export format"><button data-f="css" aria-pressed="true">CSS variables</button><button data-f="json" aria-pressed="false">JSON</button><button data-f="tw" aria-pressed="false">Tailwind</button><button id="ecp" style="margin-left:auto" class="o">Copy</button></div><pre id="pre"></pre></div></div>
<div id="toast" role="status"></div>
<script>
const $=i=>document.getElementById(i);
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
function h2r(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0),f(8),f(4)].map(x=>Math.round(x*255))}
const hex=(h,s,l)=>'#'+h2r(h,s,l).map(x=>x.toString(16).padStart(2,'0')).join('');
function x2h(x){x=x.replace('#','');if(x.length===3)x=[...x].map(c=>c+c).join('');const r=parseInt(x.slice(0,2),16)/255,g=parseInt(x.slice(2,4),16)/255,b=parseInt(x.slice(4,6),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0,l=(mx+mn)/2,s=d?d/(1-Math.abs(2*l-1)):0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[Math.round(h),Math.round(s*100),Math.round(l*100)]}
const lum=hx=>{const[r,g,b]=[1,3,5].map(i=>parseInt(hx.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*r+.7152*g+.0722*b};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const lab=r=>r>=7?'AAA':r>=4.5?'AA':r>=3?'AA Large':'Fail';
let P=[],locked=[0,0,0,0,0],hist=[],hp=-1,fmt='css';
function build(){const base=x2h($('bx').value.length===7?$('bx').value:'#3b5bff'),[h,s,l]=base,m=$('hm').value,j=()=>Math.random();let list;
 if(m==='analogous'){const st=18+j()*14;list=[-2,-1,0,1,2].map(i=>[h+i*st,clamp(s+(j()-.5)*18,35,95),clamp(l+i*5+(j()-.5)*10,22,82)])}
 else if(m==='complementary')list=[[h,s,clamp(l-18,20,70)],[h+(j()-.5)*14,clamp(s-8,30,95),clamp(l+14,30,82)],[h,clamp(s-25,8,60),92],[h+180,s,clamp(l-4,25,70)],[h+180+(j()-.5)*14,clamp(s-8,30,95),clamp(l+18,30,85)]];
 else if(m==='triadic')list=[[h,s,l],[h+120,clamp(s-6,35,95),clamp(l+4,28,75)],[h+240,clamp(s-6,35,95),clamp(l+2,28,75)],[h,clamp(s-30,10,50),clamp(l+30,70,92)],[h+60,clamp(s-40,10,40),18]];
 else if(m==='split')list=[[h,s,l],[h+150,clamp(s-4,30,95),clamp(l+6,30,76)],[h+210,clamp(s-4,30,95),clamp(l-4,26,70)],[h,clamp(s-35,6,40),94],[h+30,clamp(s-20,10,60),16]];
 else if(m==='mono')list=[18,34,52,72,90].map(L=>[h,clamp(s-(L>80?20:0),20,95),L]);
 else list=Array.from({length:5},()=>[j()*360,40+j()*50,30+j()*45]);
 const out=list.map(a=>hex(a[0],a[1],a[2]));return out}
function gen(){const n=build();P=P.length?P.map((c,i)=>locked[i]?c:n[i]):n;push();draw()}
function push(){hist=hist.slice(0,hp+1);hist.push(P.slice());if(hist.length>20)hist.shift();hp=hist.length-1}
const LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>';
function draw(){$('sw').innerHTML=P.map((c,i)=>{const w=cr(c,'#ffffff'),k=cr(c,'#000000'),tx=w>=k?'#ffffff':'#111111',[h,s,l]=x2h(c);
 return `<div class="c" role="listitem" style="background:${c};color:${tx}" data-i="${i}"><span style="position:relative"><span class="cp" id="cp${i}">Copied</span><button class="hx" data-a="hx" aria-label="Copy ${c.toUpperCase()}">${c.slice(1)}</button></span><div class="hs">hsl(${h}, ${s}%, ${l}%)</div><div class="bg"><span class="bd ${w<3?'fail':''}">White ${w.toFixed(1)} ${lab(w)}</span><span class="bd ${k<3?'fail':''}">Black ${k.toFixed(1)} ${lab(k)}</span></div><div class="ac"><button class="ic" data-a="lk" aria-pressed="${!!locked[i]}" aria-label="${locked[i]?'Unlock':'Lock'} colour ${i+1}">${LOCK}</button><button class="ic" data-a="cp" aria-label="Copy colour ${i+1}">${COPY}</button></div><div class="ft"><input type="range" min="8" max="94" value="${l}" data-a="ft" aria-label="Lightness of colour ${i+1}"></div></div>`}).join('');
 $('ud').disabled=hp<=0;$('rd').disabled=hp>=hist.length-1;exp()}
function exp(){const n=P.map(c=>c.toUpperCase());$('pre').textContent=fmt==='css'?`:root {\n${n.map((c,i)=>`  --color-${i+1}: ${c};`).join('\n')}\n}`:fmt==='json'?JSON.stringify(Object.fromEntries(n.map((c,i)=>['color'+(i+1),c])),null,2):`colors: {\n${n.map((c,i)=>`  brand${(i+1)*100}: '${c}',`).join('\n')}\n}`}
function copy(t,i){const done=()=>{if(i!=null){const e=$('cp'+i);e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1100)}else toast('Copied')};(navigator.clipboard?navigator.clipboard.writeText(t).then(done,()=>fb(t,done)):fb(t,done))}
function fb(t,d){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(e){}x.remove();d()}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1400)}
$('sw').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=+b.closest('.c').dataset.i;if(b.dataset.a==='hx'||b.dataset.a==='cp')copy(P[i].toUpperCase(),i);else if(b.dataset.a==='lk'){locked[i]=locked[i]?0:1;draw();$('sw').children[i].querySelector('[data-a=lk]').focus()}});
$('sw').addEventListener('input',e=>{if(e.target.dataset.a!=='ft')return;const c=e.target.closest('.c'),i=+c.dataset.i,[h,s]=x2h(P[i]);P[i]=hex(h,s,+e.target.value);const w=cr(P[i],'#ffffff'),k=cr(P[i],'#000000');c.style.background=P[i];c.style.color=w>=k?'#fff':'#111';exp()});
$('sw').addEventListener('change',e=>{if(e.target.dataset.a==='ft'){push();const i=+e.target.closest('.c').dataset.i;draw();const r=$('sw').children[i].querySelector('[data-a=ft]');r&&r.focus()}});
$('gn').onclick=()=>gen();$('hm').onchange=()=>gen();
$('bc').oninput=()=>{$('bx').value=$('bc').value.toUpperCase();gen()};
$('bx').onchange=()=>{let v=$('bx').value.trim();if(!v.startsWith('#'))v='#'+v;if(/^#[0-9a-f]{6}$/i.test(v)){$('bc').value=v.toLowerCase();$('bx').value=v.toUpperCase();gen()}else{toast('Enter a 6 digit hex like #3B5BFF');$('bx').value=$('bc').value.toUpperCase()}};
$('ud').onclick=()=>{if(hp>0){hp--;P=hist[hp].slice();draw()}};$('rd').onclick=()=>{if(hp<hist.length-1){hp++;P=hist[hp].slice();draw()}};
addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea,button,summary'))return;if(e.code==='Space'){e.preventDefault();gen()}else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();$('ud').click()}});
$('et').onclick=()=>{const o=$('eb').hidden;$('eb').hidden=!o;$('et').setAttribute('aria-expanded',o);$('ea').textContent=o?'▼':'▲'};
$('tabs').onclick=e=>{const b=e.target.closest('button[data-f]');if(!b)return;fmt=b.dataset.f;[...$('tabs').querySelectorAll('[data-f]')].forEach(x=>x.setAttribute('aria-pressed',x===b));exp()};
$('ecp').onclick=()=>copy($('pre').textContent);
gen();
</script></body></html>
