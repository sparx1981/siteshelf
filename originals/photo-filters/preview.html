<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Filter Editor — App UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--bg:#111214;--pn:#1b1c1f;--bd:#2a2c31;--fg:#ececef;--mut:#9a9ca5;--acc:#ffb454}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 'Outfit',sans-serif;font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:14px max(16px,3vw);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.wm{font-weight:600;font-size:18px;letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:10px}
.wm i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd89a,var(--acc));display:block}
.btn{background:var(--pn);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:9px 16px;font:500 14px 'Outfit',sans-serif;cursor:pointer;min-height:40px}
.btn:hover:not([aria-disabled=true]){border-color:#4a4d55}
.btn.p{background:var(--acc);color:#1a1205;border-color:var(--acc);font-weight:600}
.btn[aria-disabled=true]{opacity:.4;cursor:default}
.app{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;padding:18px max(16px,3vw) 40px;max-width:1400px;margin:0 auto}
.left{min-width:0;display:grid;gap:14px;align-content:start}
.stage{background:#08090a;border:1px solid var(--bd);border-radius:14px;padding:clamp(10px,3vw,28px);display:grid;place-items:center;position:relative}
.ph{width:100%;max-width:820px;aspect-ratio:3/2;border-radius:6px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative}
.ph svg{width:100%;height:100%;display:block}
.ph .img{width:100%;height:100%;transition:filter .2s}
.tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:16px;min-width:0}
h2{margin:0 0 12px;font:600 12px 'Outfit',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:104px;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.pre{scroll-snap-align:start;background:transparent;border:2px solid transparent;border-radius:10px;padding:4px;color:var(--mut);font:500 13px 'Outfit',sans-serif;cursor:pointer;display:grid;gap:6px;text-align:center}
.pre .th{aspect-ratio:3/2;border-radius:6px;overflow:hidden;display:block}
.pre .th svg{width:100%;height:100%;display:block}
.pre[aria-checked=true]{border-color:var(--acc);color:var(--fg)}
.sl{margin-bottom:18px}
.sl .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;font-size:14px}
.sl .h label{font-weight:500}
.sl .h output{color:var(--mut);display:flex;align-items:center;gap:8px}
.dot{width:20px;height:20px;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--mut);font-size:13px;padding:0}
.dot:hover{color:var(--acc)}
input[type=range]{width:100%;height:36px;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#3a3d44 var(--a,50%),var(--acc) var(--a,50%),var(--acc) var(--b,50%),#3a3d44 var(--b,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#3a3d44}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0}
.cmp{width:100%;margin-top:6px}
.hint{color:var(--mut);font-size:12.5px;margin:10px 0 0}
dialog{background:var(--pn);color:var(--fg);border:1px solid var(--bd);border-radius:16px;padding:24px;width:min(480px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h3{margin:0 0 10px;font:600 20px 'Outfit',sans-serif}
code{display:block;background:#0b0c0d;border:1px solid var(--bd);border-radius:10px;padding:12px;font:13px/1.6 ui-monospace,Menlo,monospace;word-break:break-word;margin:12px 0}
.row{display:flex;gap:10px;justify-content:flex-end}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.ph .img{transition:none}}
</style></head><body>
<header class="top"><div class="wm"><i aria-hidden="true"></i>Lumen Room</div>
<button class="btn" id="undo" aria-disabled="true">Undo</button><button class="btn" id="reset">Reset</button><button class="btn p" id="exp">Export</button></header>
<div class="app">
<div class="left">
<div class="stage"><div class="ph"><div class="img" id="img"></div><span class="tag" id="tag" hidden>Original</span></div></div>
<section class="card" aria-labelledby="ph2"><h2 id="ph2">Presets</h2><div class="strip" id="strip" role="radiogroup" aria-label="Filter presets"></div></section>
</div>
<aside class="card" aria-labelledby="ah"><h2 id="ah">Adjustments</h2><div id="sls"></div>
<button class="btn cmp" id="cmp">Hold to compare</button><p class="hint">Press [ or ] to cycle presets. Hold Space on the button to compare.</p></aside>
</div>
<dialog id="dlg"><h3>Export filter</h3><p style="margin:0;color:var(--mut)">Paste this CSS onto any image to reproduce the look.</p><code id="out"></code><div class="row"><button class="btn" id="cp">Copy</button><button class="btn p" id="cl">Done</button></div></dialog>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
var uid=0;
function art(){
 var n='a'+(uid++),p='';
 var trees='';[[60,300,1],[110,310,.8],[150,296,1.1],[610,305,.9],[660,298,1.2],[720,310,.8],[770,300,1]].forEach(function(t){trees+='<path d="M'+t[0]+' '+(t[1]-60*t[2])+'l'+(-14*t[2])+' '+(26*t[2])+'h'+(8*t[2])+'l'+(-12*t[2])+' '+(22*t[2])+'h'+(8*t[2])+'l'+(-14*t[2])+' '+(24*t[2])+'h'+(36*t[2])+'l'+(-14*t[2])+' '+(-24*t[2])+'h'+(8*t[2])+'l'+(-12*t[2])+' '+(-22*t[2])+'h'+(8*t[2])+'z" fill="#0d1f1c"/>'});
 return '<svg viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>'+
 '<linearGradient id="'+n+'s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2a5c"/><stop offset=".45" stop-color="#8a4f9e"/><stop offset=".75" stop-color="#f08a5d"/><stop offset="1" stop-color="#ffd089"/></linearGradient>'+
 '<radialGradient id="'+n+'u"><stop offset="0" stop-color="#fff5d6"/><stop offset=".4" stop-color="#ffd089" stop-opacity=".9"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></radialGradient>'+
 '<linearGradient id="'+n+'l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6a56a"/><stop offset="1" stop-color="#2a2f55"/></linearGradient></defs>'+
 '<rect width="900" height="600" fill="url(#'+n+'s)"/>'+
 '<circle cx="450" cy="330" r="150" fill="url(#'+n+'u)"/><circle cx="450" cy="330" r="34" fill="#fff3d2"/>'+
 '<g fill="#fff" opacity=".5"><ellipse cx="170" cy="150" rx="90" ry="10"/><ellipse cx="260" cy="175" rx="60" ry="7"/><ellipse cx="700" cy="120" rx="110" ry="11"/><ellipse cx="620" cy="150" rx="55" ry="6"/></g>'+
 '<path d="M0 360 C120 300 220 330 330 345 C440 300 560 310 700 340 C790 320 850 330 900 345 V420 H0Z" fill="#4a3566"/>'+
 '<path d="M0 390 C140 340 260 380 380 370 C520 340 640 380 780 360 C840 355 880 368 900 375 V440 H0Z" fill="#2c2a55"/>'+
 '<path d="M0 420 C160 385 300 410 450 400 C600 392 760 415 900 405 V600 H0Z" fill="url(#'+n+'l)"/>'+
 '<g opacity=".5" fill="#fff3d2"><rect x="400" y="440" width="100" height="5" rx="2"/><rect x="415" y="460" width="70" height="4" rx="2"/><rect x="425" y="478" width="50" height="4" rx="2"/><rect x="435" y="498" width="30" height="3" rx="1"/></g>'+
 '<g transform="translate(0 130)">'+trees+'</g>'+
 '<path d="M0 520 C200 490 360 520 520 505 C700 490 800 520 900 510 V600 H0Z" fill="#0d1f1c"/></svg>';
}
var D={bri:100,con:100,sat:100,warm:0,blur:0};
var DEF=JSON.stringify(D);
var CTL=[{k:'bri',l:'Brightness',min:40,max:160,u:'%'},{k:'con',l:'Contrast',min:40,max:180,u:'%'},{k:'sat',l:'Saturation',min:0,max:200,u:'%'},{k:'warm',l:'Warmth',min:-50,max:50,u:''},{k:'blur',l:'Blur',min:0,max:8,u:'px',step:.5}];
var PRE=[['Original',{}],['Vivid',{bri:104,con:118,sat:150}],['Mono',{sat:0,con:112}],['Noir',{sat:0,con:150,bri:86}],['Warm',{warm:32,sat:112,bri:104}],['Cool',{warm:-34,sat:104,con:104}],['Fade',{con:84,bri:112,sat:80,warm:10}],['Dream',{blur:1.5,bri:112,sat:124,con:92,warm:14}]];
function filt(v){
 var f='brightness('+v.bri+'%) contrast('+v.con+'%) saturate('+v.sat+'%)';
 if(v.warm>0)f+=' sepia('+Math.round(v.warm*.9)+'%) saturate('+(100+v.warm)+'%)';
 else if(v.warm<0)f+=' hue-rotate('+Math.round(v.warm*1.2)+'deg)';
 if(v.blur>0)f+=' blur('+v.blur+'px)';
 return f;
}
var cur=0,hist=[],sls=$('sls'),img=$('img');
img.innerHTML=art();
CTL.forEach(function(c){
 var d=document.createElement('div');d.className='sl';
 d.innerHTML='<div class="h"><label for="s-'+c.k+'">'+c.l+'</label><output id="o-'+c.k+'" for="s-'+c.k+'"><span></span><button class="dot" type="button" data-r="'+c.k+'" aria-label="Reset '+c.l+'" title="Reset">↺</button></output></div><input type="range" id="s-'+c.k+'" min="'+c.min+'" max="'+c.max+'" step="'+(c.step||1)+'">';
 sls.appendChild(d);
});
var strip=$('strip');
PRE.forEach(function(p,i){
 var b=document.createElement('button');b.type='button';b.className='pre';b.setAttribute('role','radio');b.setAttribute('aria-checked',i===0);b.tabIndex=i===0?0:-1;b.dataset.i=i;
 var v=Object.assign({},JSON.parse(DEF),p[1]);
 b.innerHTML='<span class="th" style="filter:'+filt(v)+'">'+art()+'</span><span>'+p[0]+'</span>';
 strip.appendChild(b);
});
function paint(){
 img.style.filter=filt(D);
 CTL.forEach(function(c){
  var el=$('s-'+c.k);el.value=D[c.k];
  var mn=+el.min,mx=+el.max,def=c.k==='warm'?0:(c.k==='blur'?0:100),pv=(D[c.k]-mn)/(mx-mn)*100,pd=(def-mn)/(mx-mn)*100;
  el.style.setProperty('--a',Math.min(pv,pd)+'%');el.style.setProperty('--b',Math.max(pv,pd)+'%');
  var s=D[c.k]+c.u;if(c.k==='warm'&&D.warm>0)s='+'+s;
  $('o-'+c.k).firstChild.textContent=s;
 });
 $('undo').setAttribute('aria-disabled',hist.length?'false':'true');
 $('tag').textContent=PRE[cur][0];
}
function push(){hist.push(JSON.stringify(D));if(hist.length>20)hist.shift()}
function tween(to){
 if(RM){Object.assign(D,to);paint();return}
 var from=Object.assign({},D),t0=performance.now();
 (function f(now){var k=Math.min(1,(now-t0)/300),e=1-Math.pow(1-k,3);
  CTL.forEach(function(c){D[c.k]=from[c.k]+(to[c.k]-from[c.k])*e;if(k<1)D[c.k]=Math.round(D[c.k]*2)/2});
  if(k>=1)Object.assign(D,to);paint();if(k<1)requestAnimationFrame(f)})(t0);
}
function choose(i,focus){
 push();cur=i;
 [].forEach.call(strip.children,function(b,j){b.setAttribute('aria-checked',j===i);b.tabIndex=j===i?0:-1});
 if(focus)strip.children[i].focus();
 tween(Object.assign(JSON.parse(DEF),PRE[i][1]));
}
strip.addEventListener('click',function(e){var b=e.target.closest('.pre');if(b)choose(+b.dataset.i)});
strip.addEventListener('keydown',function(e){
 var i=cur,n=PRE.length;
 if(e.key==='ArrowRight'||e.key==='ArrowDown')i=(cur+1)%n;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')i=(cur+n-1)%n;else return;
 e.preventDefault();choose(i,true);
});
sls.addEventListener('input',function(e){
 var el=e.target;if(el.type!=='range')return;
 if(!el._pushed){push();el._pushed=true}
 D[el.id.slice(2)]=+el.value;paint();
});
sls.addEventListener('change',function(e){e.target._pushed=false});
sls.addEventListener('click',function(e){var b=e.target.closest('[data-r]');if(!b)return;push();var k=b.dataset.r;D[k]=JSON.parse(DEF)[k];paint()});
sls.addEventListener('dblclick',function(e){if(e.target.type==='range'){push();var k=e.target.id.slice(2);D[k]=JSON.parse(DEF)[k];paint()}});
$('undo').onclick=function(){if(!hist.length)return;Object.assign(D,JSON.parse(hist.pop()));paint()};
$('reset').onclick=function(){push();cur=0;[].forEach.call(strip.children,function(b,j){b.setAttribute('aria-checked',j===0);b.tabIndex=j===0?0:-1});tween(JSON.parse(DEF))};
var cmp=$('cmp'),saved=null;
function holdOn(){if(saved)return;saved=img.style.filter;img.style.filter='none';$('tag').hidden=false;$('tag').textContent='Original'}
function holdOff(){if(saved===null)return;img.style.filter=saved;saved=null;$('tag').hidden=true}
cmp.addEventListener('pointerdown',function(e){e.preventDefault();holdOn()});
['pointerup','pointerleave','pointercancel','blur'].forEach(function(ev){cmp.addEventListener(ev,holdOff)});
cmp.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();holdOn()}});
cmp.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter')holdOff()});
document.addEventListener('keydown',function(e){
 if(document.querySelector('dialog[open]')||e.target.type==='text')return;
 if(e.key==='['){choose((cur+PRE.length-1)%PRE.length)}else if(e.key===']'){choose((cur+1)%PRE.length)}
});
var dlg=$('dlg');
$('exp').onclick=function(){$('out').textContent='filter: '+filt(D)+';';dlg.showModal()};
$('cl').onclick=function(){dlg.close()};
dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});
$('cp').onclick=function(){var b=this;try{navigator.clipboard.writeText($('out').textContent).then(function(){b.textContent='Copied'},function(){b.textContent='Select and copy'})}catch(e){b.textContent='Select and copy'}setTimeout(function(){b.textContent='Copy'},1600)};
paint();
})();
</script></body></html>
