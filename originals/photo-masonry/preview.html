<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mara Ellison — Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--ink:#141414;--mut:#77746c;--line:#dcd8cf;--acc:#c2410c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,sans-serif}
header{max-width:1280px;margin:0 auto;padding:64px 24px 24px}
h1{font:400 72px/1 'Instrument Serif',serif;margin:0;letter-spacing:-.02em}
h1 em{font-style:italic}
.role{color:var(--mut);margin:10px 0 0;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.filters{max-width:1280px;margin:0 auto;padding:0 24px 24px;display:flex;gap:22px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.filters button{background:none;border:0;padding:8px 0;font:500 13px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
.filters button[aria-pressed=true]{color:var(--ink);border-color:var(--acc)}
.filters button:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
main{max-width:1280px;margin:0 auto;padding:24px}
.grid{columns:3;column-gap:12px}
.tile{display:block;width:100%;position:relative;margin:0 0 12px;padding:0;border:0;background:#ddd;break-inside:avoid;overflow:hidden;cursor:zoom-in;transition:opacity .3s,transform .3s}
.tile svg{display:block;width:100%;height:auto}
.tile.out{opacity:0;transform:scale(.97)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;text-align:left;transform:translateY(100%);transition:transform .3s}
.tile:hover .cap,.tile:focus-visible .cap{transform:none}
.cap b{display:block;font:italic 400 22px 'Instrument Serif',serif}
.cap span{font-size:12px;opacity:.85}
footer{max-width:1280px;margin:0 auto;padding:24px 24px 64px;color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100dvh;width:100vw;height:100dvh;color:#fff}
dialog::backdrop{background:rgba(10,10,10,.94)}
.lb{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;grid-template-rows:minmax(0,1fr) auto;height:100dvh;padding:24px;gap:12px;align-items:center}
.lb .img{grid-column:2;grid-row:1;min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
.lb .img svg{max-width:100%;max-height:100%;width:auto;height:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb .meta{grid-column:2;grid-row:2;display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap}
.lb .meta b{font:italic 400 28px 'Instrument Serif',serif;font-weight:400}
.lb .meta span{color:#bbb;font-size:13px}
.nb{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;padding:0 0 3px}
.nb:hover{background:rgba(255,255,255,.12)}
#prev{grid-column:1;grid-row:1}#next{grid-column:3;grid-row:1}
#close{position:absolute;top:16px;right:16px;font-size:26px}
@media(max-width:900px){.grid{columns:2}h1{font-size:56px}}
@media(max-width:560px){.grid{columns:1}h1{font-size:46px}header{padding-top:40px}
 .lb{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) auto auto;padding:16px}
 .lb .img{grid-column:1/3}.lb .meta{grid-column:1/3;grid-row:2}
 #prev{grid-column:1;grid-row:3;justify-self:start}#next{grid-column:2;grid-row:3;justify-self:end}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><h1>Mara <em>Ellison</em></h1><p class="role">Photographer · Lisbon and elsewhere</p></header>
<div class="filters" id="filters" role="group" aria-label="Filter photographs"></div>
<main><div class="grid" id="grid"></div></main>
<footer>© Mara Ellison. Available for editorial and commercial commissions.</footer>
<dialog id="lb" aria-label="Photograph viewer"><div class="lb">
<button class="nb" id="close" aria-label="Close viewer">×</button>
<button class="nb" id="prev" aria-label="Previous photograph">‹</button>
<div class="img" id="big"></div>
<button class="nb" id="next" aria-label="Next photograph">›</button>
<div class="meta"><div><b id="lt"></b><br><span id="lp"></span></div><span id="lc" aria-live="polite"></span></div>
</div></dialog>
<script>
const NS='http://www.w3.org/2000/svg';
const P=[
['Last light, Cascais','Coast','Portugal',2023,4,5,['#ffb36b','#e8627a','#3b2a5e'],'sea'],
['Salt flats','Coast','Namibia',2022,3,2,['#cfe8ee','#8fb8c9','#34566b'],'flat'],
['Dune ridge','Desert','Merzouga',2023,4,3,['#f6c98b','#e08e4d','#7a3b1f'],'dune'],
['Sand and sky','Desert','Wadi Rum',2021,2,3,['#f9dcae','#d9885a','#5a2d2d'],'dune'],
['Rooftops at dusk','City','Porto',2024,4,3,['#f2a65a','#b4506a','#26224a'],'city'],
['Glass canyon','City','Rotterdam',2022,3,4,['#a8c7e0','#5f86ad','#1c2f4a'],'city'],
['Crossing','City','Tokyo',2023,1,1,['#ffd9a8','#f08a5d','#2b2342'],'city'],
['Moon over the quay','Night','Lisbon',2024,3,4,['#2a3a6e','#141a3d','#05060f'],'moon'],
['Long exposure, A25','Night','Algarve',2022,4,3,['#3a2a66','#151038','#050510'],'moon'],
['Tide line','Coast','Zambujeira',2021,3,2,['#e6f1f4','#9bc4cf','#3f6f80'],'sea'],
['Cliff stairs','Coast','Madeira',2023,3,4,['#f7d6c0','#d98a7a','#4a3a5a'],'sea'],
['Neon rain','Night','Osaka',2024,2,3,['#ff5fa2','#5a1f7a','#0a0618'],'city'],
['Caravan','Desert','Sahara',2022,4,3,['#fbe3b5','#e59a52','#6b2e1a'],'dune'],
['Harbour blue hour','Night','Valletta',2023,3,2,['#4b7bc0','#223a72','#0a1030'],'moon']
];
let UID=0;function art(p,w,h){const c=p[6],k=p[7];let s=rng(p[0]);const gid="g"+(++UID);
 let d=`<svg xmlns="${NS}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${p[0]}, ${p[2]}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[2]}"/><stop offset=".6" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[0]}"/></linearGradient></defs>`;
 d+=`<rect width="${w}" height="${h}" fill="url(#${gid})"/>`;
 if(k==='moon'){for(let i=0;i<40;i++)d+=`<circle cx="${s()*w}" cy="${s()*h*.6}" r="${s()*1.4+.3}" fill="#fff" opacity="${.3+s()*.6}"/>`;d+=`<circle cx="${w*.7}" cy="${h*.22}" r="${w*.07}" fill="#f4f0e0"/><circle cx="${w*.7+w*.02}" cy="${h*.22-w*.01}" r="${w*.065}" fill="${c[1]}" opacity=".35"/>`}
 else d+=`<circle cx="${w*(.25+s()*.5)}" cy="${h*(.35+s()*.1)}" r="${w*.09}" fill="#fff4d8" opacity=".85"/>`;
 const layers=k==='city'?3:4;
 for(let l=0;l<layers;l++){const y=h*(.55+l*.1),a=.35+l*.2;let pts=`0,${h} `;
  if(k==='city'){let x=0;pts=`0,${h} `;while(x<w){const bw=w*(.03+s()*.06),bh=h*(.08+s()*.25)*(1+l*.1);pts+=`${x},${y-bh} ${x+bw},${y-bh} `;x+=bw}pts+=`${w},${h}`}
  else{const n=k==='flat'?3:12;for(let i=0;i<=n;i++){const amp=(k==='dune'?.12:k==='sea'?.04:.05)*h;pts+=`${w*i/n},${y-s()*amp*(l+1)} `}pts+=`${w},${h}`}
  d+=`<polygon points="${pts}" fill="${c[2]}" opacity="${Math.min(.95,a)}"/>`}
 if(k==='sea'||k==='moon'){for(let i=0;i<8;i++)d+=`<rect x="${w*(.55+s()*.2)}" y="${h*(.72+i*.03)}" width="${w*(.05+s()*.12)}" height="2" fill="#fff" opacity="${.15+s()*.2}"/>`}
 return d+'</svg>'}
function rng(str){let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
const cats=['All',...new Set(P.map(p=>p[1]))];let cat='All',list=P.slice(),open=-1,opener=null;
const grid=document.getElementById('grid'),lb=document.getElementById('lb');
cats.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.setAttribute('aria-pressed',c==='All');b.onclick=()=>{cat=c;[...document.getElementById('filters').children].forEach(x=>x.setAttribute('aria-pressed',x===b));filter()};document.getElementById('filters').appendChild(b)});
P.forEach((p,i)=>{const w=400,h=Math.round(400*p[5]/p[4]);const t=document.createElement('button');t.className='tile';t.dataset.i=i;t.setAttribute('aria-label',`Open ${p[0]}, ${p[2]}`);t.innerHTML=art(p,w,h)+`<span class="cap"><b>${p[0]}</b><span>${p[2]} · ${p[3]}</span></span>`;t.onclick=()=>show(i,t);grid.appendChild(t)});
function filter(){list=P.filter(p=>cat==='All'||p[1]===cat);[...grid.children].forEach(t=>{const keep=list.includes(P[t.dataset.i]);t.classList.add('out');setTimeout(()=>{t.style.display=keep?'':'none';if(keep)requestAnimationFrame(()=>t.classList.remove('out'))},180)})}
function show(i,t){if(t)opener=t;open=list.indexOf(P[i]);if(open<0)open=0;paint();if(!lb.open)lb.showModal()}
function paint(){const p=list[open];document.getElementById('big').innerHTML=art(p,1200,Math.round(1200*p[5]/p[4]));document.getElementById('lt').textContent=p[0];document.getElementById('lp').textContent=`${p[2]} · ${p[3]}`;document.getElementById('lc').textContent=`${open+1} / ${list.length}`}
function step(d){open=(open+d+list.length)%list.length;paint()}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);document.getElementById('close').onclick=()=>lb.close();
lb.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
lb.addEventListener('click',e=>{if(e.target===lb)lb.close()});
lb.addEventListener('close',()=>{if(opener)opener.focus()});
</script></body></html>
