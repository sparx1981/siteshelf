<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Static &amp; Stories — A Podcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14091f;--pan:#1e1230;--line:#35244d;--ink:#f5f0ff;--mut:#b3a4cc;--acc:#ff7a59;--vio:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Figtree,sans-serif;padding-bottom:110px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.hero{position:relative;overflow:hidden;background:radial-gradient(60% 70% at 20% 10%,rgba(124,58,237,.35),transparent 70%)}
.in{max-width:1080px;margin:0 auto;padding:0 20px}
.hero .in{padding-top:72px;padding-bottom:40px;position:relative}
.eyebrow{color:var(--vio);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
h1{font:800 clamp(48px,9vw,112px)/.95 Syne,sans-serif;margin:12px 0 18px;letter-spacing:-.03em}
h1 span{color:var(--acc)}
.pitch{max-width:540px;color:var(--mut);font-size:19px;margin:0 0 24px}
.subs{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--pan);color:var(--ink);border-radius:999px;padding:11px 20px;font:600 15px Figtree,sans-serif;cursor:pointer}
.btn:hover{border-color:var(--vio)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#1a0b14}
canvas#wave{display:block;width:100%;height:120px;margin-top:36px}
section{padding:44px 0}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
h2{font:800 34px/1.1 Syne,sans-serif;margin:0;letter-spacing:-.02em}
input[type=search]{background:var(--pan);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;width:min(100%,280px)}
.cnt{color:var(--mut);font-size:14px;margin:0 0 12px}
.ep{background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 16px;transition:border-color .2s}
.ep.on{border-color:var(--acc)}
.pl{grid-row:1/3;width:52px;height:52px;border-radius:50%;border:0;background:var(--acc);color:#1a0b14;display:grid;place-items:center;cursor:pointer;font-size:0}
.pl svg{width:20px;height:20px;fill:currentColor}
.ep h3{font:700 21px/1.25 Syne,sans-serif;margin:0}
.meta{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.ep p{margin:4px 0 0;color:var(--mut);grid-column:2}
details{grid-column:2;margin-top:6px}
summary{cursor:pointer;color:var(--vio);font-weight:600;font-size:14px}
details blockquote{margin:8px 0 0;padding-left:14px;border-left:2px solid var(--line);color:var(--mut);font-size:14px}
.none{color:var(--mut);text-align:center;padding:30px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(30,18,48,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 20px;transform:translateY(110%);transition:transform .35s;z-index:10}
.bar.show{transform:none}
.bar .row{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.4fr);gap:16px;align-items:center}
.now{min-width:0}.now b{display:block;font:700 15px Syne,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now span{color:var(--mut);font-size:13px}
.ctl{display:flex;gap:8px;align-items:center}
.ic{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;min-width:40px;height:40px;padding:0 12px;font:600 13px Figtree,sans-serif;cursor:pointer}
.ic.big{background:var(--acc);border-color:var(--acc);color:#1a0b14;width:46px;height:46px;padding:0;display:grid;place-items:center}
.ic.big svg{width:18px;height:18px;fill:currentColor}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;accent-color:var(--acc);height:22px}
@media(max-width:700px){.bar .row{grid-template-columns:minmax(0,1fr) auto}.prog{grid-column:1/3}.ep{grid-template-columns:44px minmax(0,1fr)}.pl{width:44px;height:44px}h2{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="hero"><div class="in">
<div class="eyebrow">A weekly podcast</div>
<h1>Static <span>&amp;</span> Stories</h1>
<p class="pitch">Forty minutes a week with the people who build the strange, small corners of the internet.</p>
<div class="subs"><button class="btn p">Listen on Apple</button><button class="btn">Spotify</button><button class="btn">RSS feed</button></div>
<canvas id="wave" aria-hidden="true"></canvas></div></div>
<main class="in"><section><div class="top"><h2>Episodes</h2><input type="search" id="q" placeholder="Search episodes" aria-label="Search episodes"></div>
<p class="cnt" id="cnt" aria-live="polite"></p><div id="list"></div><p class="none" id="none" hidden>No episodes match that search.</p></section></main>
<div class="bar" id="bar" role="region" aria-label="Player"><div class="row">
<div class="now"><b id="nt">—</b><span id="ns"></span></div>
<div class="ctl"><button class="ic" id="back" aria-label="Back 15 seconds">−15</button><button class="ic big" id="pp" aria-label="Play" aria-pressed="false"></button><button class="ic" id="fwd" aria-label="Forward 30 seconds">+30</button><button class="ic" id="spd" aria-label="Playback speed 1x">1x</button></div>
<div class="prog"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" value="0" step="1" aria-label="Seek"><span id="tot">0:00</span></div>
</div></div>
<script>
const E=[
['The man who kept the guestbook',2,'12 Oct',2460,'A webmaster on keeping a 1998 guestbook alive, one spam filter at a time.','"We never deleted an entry. Even the rude ones are history now."'],
['Pixels from a pager',3,'5 Oct',2280,'How one engineer shipped a games studio from a hospital on-call rota.','"I coded between alarms. The bugs were weirdly calm."'],
['Dial-up nostalgia is a lie',2,'28 Sep',2700,'Why we remember the modem screech fondly, and what we forgot.','"It was slow, expensive, and the phone line was always busy."'],
['A font for the whole village',1,'21 Sep',2040,'A type designer and a Welsh town sign problem.','"Every letter had to survive a seaside wind."'],
['Reading the README of the world',3,'14 Sep',2520,'Open-source maintainers on the work no one sees.','"Docs are the product. The code is a rumour."'],
['The last video rental shop',2,'7 Sep',1980,'A tiny shop that outlived the streaming wars.','"People come in just to talk about what to watch."'],
['Radio, but make it weird',1,'31 Aug',2640,'Pirate stations, numbers stations, and the joy of tuning in blind.','"You find it by accident, and that is the whole point."'],
['The tab hoarder confessions',2,'24 Aug',2160,'We open 400 tabs so you do not have to. Therapy optional.','"Each tab is a tiny promise to my future self."']
].map((e,i)=>({n:0,t:e[0],d:e[2],dur:e[3],s:e[4],tr:e[5]}));
E.forEach((e,i)=>e.n=8-i);
const list=document.getElementById('list'),bar=document.getElementById('bar'),pp=document.getElementById('pp'),seek=document.getElementById('seek');
const PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>',PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let cur=-1,pos=0,playing=false,spd=1,tm=null,filt=E;
pp.innerHTML=PLAY;
function draw(){list.innerHTML=filt.map(e=>{const i=E.indexOf(e),on=i===cur;return `<article class="ep${on?' on':''}" data-i="${i}"><button class="pl" aria-label="${on&&playing?'Pause':'Play'} episode ${e.n}: ${e.t}">${on&&playing?PAUSE:PLAY}</button><div><div class="meta">Episode ${e.n} · ${e.d} · ${fmt(e.dur)}</div><h3>${e.t}</h3></div><p>${e.s}</p><details><summary>Show transcript</summary><blockquote>${e.tr}</blockquote></details></article>`}).join('');
 document.getElementById('cnt').textContent=filt.length+(filt.length===1?' episode':' episodes');document.getElementById('none').hidden=filt.length>0}
list.addEventListener('click',e=>{const b=e.target.closest('.pl');if(!b)return;const i=+b.closest('.ep').dataset.i;if(i===cur)toggle();else{cur=i;pos=0;bar.classList.add('show');playing=true;sync();start()}});
function start(){clearInterval(tm);tm=setInterval(()=>{if(!playing)return;pos+=0.25*spd;if(pos>=E[cur].dur){pos=E[cur].dur;playing=false}sync()},250)}
function toggle(){if(cur<0)return;if(!playing&&pos>=E[cur].dur)pos=0;playing=!playing;sync();start()}
function sync(){const e=E[cur];if(!e)return;document.getElementById('nt').textContent=e.t;document.getElementById('ns').textContent='Episode '+e.n;
 seek.max=e.dur;seek.value=pos;document.getElementById('cur').textContent=fmt(pos);document.getElementById('tot').textContent=fmt(e.dur);
 pp.innerHTML=playing?PAUSE:PLAY;pp.setAttribute('aria-label',playing?'Pause':'Play');pp.setAttribute('aria-pressed',playing);seek.setAttribute('aria-valuetext',fmt(pos)+' of '+fmt(e.dur));
 document.querySelectorAll('.ep').forEach(a=>{const on=+a.dataset.i===cur;a.classList.toggle('on',on);const b=a.querySelector('.pl');b.innerHTML=on&&playing?PAUSE:PLAY;b.setAttribute('aria-label',(on&&playing?'Pause':'Play')+' episode '+E[a.dataset.i].n+': '+E[a.dataset.i].t)})}
pp.onclick=toggle;seek.oninput=()=>{pos=+seek.value;sync()};
document.getElementById('back').onclick=()=>{if(cur<0)return;pos=Math.max(0,pos-15);sync()};
document.getElementById('fwd').onclick=()=>{if(cur<0)return;pos=Math.min(E[cur].dur,pos+30);sync()};
const SP=[1,1.25,1.5,2];document.getElementById('spd').onclick=function(){spd=SP[(SP.indexOf(spd)+1)%4];this.textContent=spd+'x';this.setAttribute('aria-label','Playback speed '+spd+'x')};
document.getElementById('q').oninput=function(){const q=this.value.trim().toLowerCase();filt=E.filter(e=>!q||(e.t+' '+e.s).toLowerCase().includes(q));draw();sync()};
draw();
/* waveform */
const cv=document.getElementById('wave'),cx=cv.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const N=90,H=Array.from({length:N},(_,i)=>.2+.8*Math.abs(Math.sin(i*.37)*Math.cos(i*.11)));let amp=.25,t=0;
function frame(){const r=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==w*r){cv.width=w*r;cv.height=h*r}cx.setTransform(r,0,0,r,0,0);cx.clearRect(0,0,w,h);
 const target=playing?1:.22;amp+=(target-amp)*.06;t+=playing?.07*spd:.01;const bw=w/N;
 for(let i=0;i<N;i++){const v=H[i]*(.55+.45*Math.sin(t+i*.4))*amp+.04;const bh=Math.max(3,v*h);cx.fillStyle=i/N<(cur>=0?pos/E[cur].dur:0)?'#ff7a59':'#a78bfa';cx.globalAlpha=.85;cx.fillRect(i*bw+bw*.2,(h-bh)/2,bw*.6,bh)}
 cx.globalAlpha=1;if(!reduce)requestAnimationFrame(frame)}
if(reduce){amp=.5;t=2;frame()}else requestAnimationFrame(frame);
if(reduce)addEventListener('resize',frame);
</script></body></html>
