<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polaroid Scatter Gallery — Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@500;700&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--w:200px;--h:240px}
*{box-sizing:border-box}
body{margin:0;background:#2a1f15;color:#fdf4e3;font:500 14px/1.4 Karla,system-ui,sans-serif;height:100svh;display:flex;flex-direction:column;overflow:hidden}
:focus-visible{outline:3px solid #ffd479;outline-offset:3px}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#1d150d}
.tb h1{font:700 17px Karla;margin:0 auto 0 0}
.b{min-height:40px;border:0;border-radius:10px;background:#fdf4e3;color:#2a1f15;font:700 14px Karla;padding:0 16px;cursor:pointer}
.b:hover{background:#fff}
.cnt{color:#cdb99c}
.desk{position:relative;flex:1;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(0,0,0,.18) 118px 120px),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 3px,rgba(0,0,0,.03) 3px 6px),#8b6a4a;box-shadow:inset 0 0 120px rgba(20,10,0,.6)}
.pl{position:absolute;width:var(--w);height:var(--h);perspective:900px;cursor:grab;touch-action:none;user-select:none;transition:left .7s cubic-bezier(.3,1,.4,1),top .7s cubic-bezier(.3,1,.4,1),transform .5s;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.pl.drag{cursor:grabbing;transition:none;filter:drop-shadow(0 22px 22px rgba(0,0,0,.45))}
.pl.nm{transition:transform .35s}
.in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
.pl.fl .in{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fdfbf5;border-radius:3px;padding:12px 12px 0}
.ph{height:calc(var(--h) - 82px);border-radius:2px;overflow:hidden;position:relative;box-shadow:inset 0 0 14px rgba(0,0,0,.25)}
.ph svg{width:100%;height:100%;display:block}
.cap{font:400 24px/1 'Reenie Beanie',cursive;color:#3a2f25;text-align:center;margin-top:14px}
.cap small{display:block;font:400 17px 'Reenie Beanie';color:#8a7a68;margin-top:2px}
.bk{transform:rotateY(180deg);background:#f6efdf;display:flex;flex-direction:column;justify-content:space-between;padding:18px;background-image:repeating-linear-gradient(0deg,transparent 0 27px,#e5d9bf 27px 28px)}
.bk p{margin:0;font:400 24px/28px 'Reenie Beanie',cursive;color:#3a2f25}
.bk .st{align-self:flex-end;border:2px solid #b34a3a;color:#b34a3a;border-radius:4px;padding:2px 8px;font:700 11px Karla;letter-spacing:.1em;transform:rotate(6deg);opacity:.8}
.fb{position:absolute;right:6px;top:6px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:rgba(253,251,245,.92);cursor:pointer;opacity:0;transition:opacity .15s;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pl:hover .fb,.pl:focus-within .fb,.pl:focus .fb{opacity:1}
@media(hover:none){.fb{opacity:1}}
.sr{position:absolute;left:-9999px}
@media(max-width:560px){:root{--w:160px;--h:196px}.cap{font-size:20px}.bk p{font-size:20px;line-height:24px}}
@media(prefers-reduced-motion:reduce){.pl,.in{transition:none!important}.pl.fl .in{transform:none}.pl.fl .fc:not(.bk){visibility:hidden}.pl:not(.fl) .bk{visibility:hidden}.bk{transform:none}}
</style></head><body>
<div class="tb"><h1>📷 Summer at Gull Point</h1><button class="b" id="sh">Shuffle</button><button class="b" id="td">Tidy up</button><button class="b" id="fa">Flip all</button><span class="cnt" id="cn"></span></div>
<div class="desk" id="dk" role="group" aria-label="Photo desk. Drag photos, or focus one and use arrow keys."></div>
<div class="sr" id="lv" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),dk=$('#dk');
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const say=t=>{$('#lv').textContent='';setTimeout(()=>$('#lv').textContent=t,40)};
const SC=[['Lighthouse at dusk','12 Jul','The keeper waved. We waved back for a full ten minutes.','dusk'],['Long beach, empty','13 Jul','Walked until the tide came for our shoes.','sea'],['Cat, unimpressed','14 Jul','Name: Biscuit. Opinion of us: low.','cat'],['Market morning','15 Jul','Bought too many plums. No regrets.','city'],['Cliff path','16 Jul','Wind so strong the sandwiches left.','hill'],['Harbour lights','17 Jul','Fish and chips, eaten standing up.','city2'],['The red boat','18 Jul','Rowed out to the buoy and back.','boat'],['Lake at six','19 Jul','Swam before anyone was awake.','lake'],['Rainy day cards','20 Jul','Lost 14 games in a row to Dad.','dusk'],['Last sunset','21 Jul','Already planning next summer.','sea']];
function scene(k,i){const U=`s${i}`;const G={dusk:['#ffd29a','#e46a7a','#3b2a58'],sea:['#ffe6b8','#6fb7d6','#1d5a82'],cat:['#f3d9c0','#d9a066','#6b4125'],city:['#cde4f7','#8fb0d1','#34455c'],hill:['#d8ecd0','#79b36f','#2f5a38'],city2:['#2a2d55','#6a4a8c','#e8895a'],boat:['#bfe5f2','#3d8fb5','#14506e'],lake:['#f6e3ee','#a7c7e0','#3c6b88']}[k]||['#ddd','#aaa','#555'];
 let sh='';if(k==='dusk')sh=`<circle cx="60" cy="76" r="20" fill="#fff6c8"/><rect x="82" y="40" width="14" height="70" fill="#f4efe6"/><rect x="82" y="40" width="14" height="10" fill="#c2423a"/><rect x="80" y="30" width="18" height="10" fill="#222"/><path d="M0 108h140v32H0z" fill="${G[2]}"/>`;
 else if(k==='sea'||k==='lake')sh=`<circle cx="100" cy="55" r="16" fill="#fff6c8"/>`+[0,1,2,3].map(n=>`<path d="M0 ${80+n*14}q17 -8 35 0t35 0t35 0t35 0V140H0z" fill="${G[2]}" opacity="${.35+n*.17}"/>`).join('');
 else if(k==='cat')sh=`<path d="M0 108h140v32H0z" fill="${G[2]}"/><path d="M52 108c-4-30 6-48 22-48s26 18 22 48z" fill="#2b1c10"/><path d="M60 64l-6-18 14 8zM88 64l6-18-14 8z" fill="#2b1c10"/><circle cx="66" cy="78" r="3" fill="#ffd24a"/><circle cx="82" cy="78" r="3" fill="#ffd24a"/>`;
 else if(k==='city'||k==='city2')sh=[[10,50,22],[34,30,26],[62,58,20],[84,38,24],[110,64,22]].map(([x,y,w],n)=>`<rect x="${x}" y="${y+30}" width="${w}" height="${110-y-30}" fill="${G[2]}" opacity="${.7+n*.06}"/>`+(k==='city2'?`<rect x="${x+5}" y="${y+40}" width="4" height="4" fill="#ffd479"/><rect x="${x+13}" y="${y+54}" width="4" height="4" fill="#ffd479"/>`:'')).join('')+`<rect y="108" width="140" height="32" fill="#1b2336" opacity=".5"/>`;
 else if(k==='hill')sh=`<path d="M0 96Q40 40 80 80T140 60V140H0z" fill="${G[1]}"/><path d="M0 116Q50 80 100 108T140 100V140H0z" fill="${G[2]}"/><path d="M30 104l30-6" stroke="#f4e7c8" stroke-width="3"/>`;
 else if(k==='boat')sh=`<rect y="88" width="140" height="52" fill="${G[1]}"/><path d="M40 98h60l-10 16H50z" fill="#c2423a"/><path d="M70 98V54l24 38z" fill="#fdf4e3"/><circle cx="110" cy="44" r="12" fill="#fff6c8"/>`;
 return `<svg viewBox="0 0 140 140" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${U}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${G[0]}"/><stop offset="1" stop-color="${G[1]}"/></linearGradient></defs><rect width="140" height="140" fill="url(#${U})"/>${sh}</svg>`}
const cards=[];let z=10;
SC.forEach((s,i)=>{const p=document.createElement('div');p.className='pl';p.tabIndex=0;p.dataset.rot='0';p.setAttribute('role','group');p.setAttribute('aria-label',s[0]+', '+s[1]+'. Press Enter to flip.');
 p.innerHTML=`<div class="in"><div class="fc"><div class="ph">${scene(s[3],i)}</div><div class="cap"></div></div><div class="fc bk"><p></p><span class="st">GULL POINT</span></div></div><button class="fb" aria-label="Flip photo">↻</button>`;
 p.querySelector('.cap').textContent=s[0];const sm=document.createElement('small');sm.textContent=s[1];p.querySelector('.cap').append(sm);p.querySelector('.bk p').textContent=s[2];
 dk.append(p);cards.push(p);bind(p)});
function W(){return+getComputedStyle(document.documentElement).getPropertyValue('--w').replace('px','')||200}
function dims(){const s=getComputedStyle(cards[0]);return[parseFloat(s.width),parseFloat(s.height)]}
function place(p,x,y,r){const[w,h]=dims();x=Math.max(0,Math.min(dk.clientWidth-w,x));y=Math.max(0,Math.min(dk.clientHeight-h,y));p.style.left=x+'px';p.style.top=y+'px';p.dataset.rot=r;p.style.transform=`rotate(${r}deg)`}
function scatter(){const[w,h]=dims(),W=dk.clientWidth,H=dk.clientHeight;cards.forEach((p,i)=>{const x=20+Math.random()*(W-w-40),y=20+Math.random()*(H-h-40);place(p,x,y,Math.round((Math.random()*24-12)*10)/10)})}
function tidy(){const[w,h]=dims(),W=dk.clientWidth,gap=16,cols=Math.max(1,Math.floor((W-gap)/(w+gap))),mx=(W-(cols*(w+gap)-gap))/2;cards.forEach((p,i)=>{const r=Math.floor(i/cols),c=i%cols;p.style.zIndex=10+i;place(p,mx+c*(w+gap),16+r*(h+gap),(i%3-1)*1.5)})}
function flip(p,v){const f=v===undefined?!p.classList.contains('fl'):v;p.classList.toggle('fl',f)}
function bind(p){let d=null;p.addEventListener('pointerdown',e=>{if(e.target.closest('.fb'))return;d={x:e.clientX,y:e.clientY,l:p.offsetLeft,t:p.offsetTop,m:false};p.style.zIndex=++z;p.setPointerCapture(e.pointerId)});
 p.addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(!d.m&&Math.hypot(dx,dy)>4){d.m=true;p.classList.add('drag');p.style.transform=`rotate(${+p.dataset.rot*.4}deg) scale(1.04)`}if(d.m){const[w,h]=dims();p.style.left=Math.max(-w/3,Math.min(dk.clientWidth-w*.66,d.l+dx))+'px';p.style.top=Math.max(-h/4,Math.min(dk.clientHeight-h*.7,d.t+dy))+'px'}});
 const end=()=>{if(!d)return;p.classList.remove('drag');p.style.transform=`rotate(${p.dataset.rot}deg)`;d=null};p.addEventListener('pointerup',end);p.addEventListener('pointercancel',end);
 p.addEventListener('dblclick',()=>flip(p));p.querySelector('.fb').onclick=e=>{e.stopPropagation();flip(p);say(p.classList.contains('fl')?'Showing the back':'Showing the front')};
 p.addEventListener('keydown',e=>{if(e.target!==p)return;const s=e.shiftKey?60:15;let dx=0,dy=0;if(e.key==='ArrowLeft')dx=-s;else if(e.key==='ArrowRight')dx=s;else if(e.key==='ArrowUp')dy=-s;else if(e.key==='ArrowDown')dy=s;
  if(dx||dy){e.preventDefault();p.classList.add('nm');place(p,p.offsetLeft+dx,p.offsetTop+dy,+p.dataset.rot);setTimeout(()=>p.classList.remove('nm'),360)}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();flip(p);say(p.classList.contains('fl')?'Showing the back: '+p.querySelector('.bk p').textContent:'Showing the front')}else if(e.key==='+'||e.key==='='){p.style.zIndex=++z}})}
$('#sh').onclick=()=>{scatter();say('Shuffled')};$('#td').onclick=()=>{tidy();say('Tidied into a grid')};
$('#fa').onclick=()=>{const any=cards.some(c=>!c.classList.contains('fl'));cards.forEach(c=>flip(c,any));say(any?'All photos flipped to the back':'All photos flipped to the front')};
$('#cn').textContent=cards.length+' photos';
addEventListener('load',()=>scatter());scatter();let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>cards.forEach(p=>place(p,p.offsetLeft,p.offsetTop,+p.dataset.rot)),150)});
</script></body></html>
