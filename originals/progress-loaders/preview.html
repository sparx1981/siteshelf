<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progress Indicators — Loaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--bg:#f5f7fb;--ink:#172036;--mut:#667290;--bd:#e1e6f0;--bl:#2e6bff;--mn:#19c39a;--am:#ffb020;--rs:#ff5c7a;--vi:#8a5cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 'Outfit',system-ui,sans-serif;padding:32px 20px}
:focus-visible{outline:3px solid var(--bl);outline-offset:3px}
.w{max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font:700 clamp(28px,5vw,40px)/1.05 'Outfit',sans-serif;margin:0;letter-spacing:-.02em}
header p{margin:6px 0 0;color:var(--mut)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl button,.ctl select{background:#fff;border:1.5px solid var(--bd);border-radius:12px;min-height:44px;padding:0 16px;font:600 14px 'Outfit',sans-serif;cursor:pointer;color:var(--ink)}
.ctl button:hover{border-color:var(--bl)}
.ctl .pp{background:var(--ink);color:#fff;border-color:var(--ink);min-width:96px}
.gr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cd{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:260px}
.cp{font:600 12px 'Outfit',sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.cp button{background:none;border:0;color:var(--bl);cursor:pointer;font:600 12px 'Outfit',sans-serif;text-transform:none;letter-spacing:0;min-height:32px}
.st{flex:1;display:grid;place-items:center;min-width:0}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.ring{position:relative;width:min(100%,170px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;font:500 34px 'IBM Plex Mono',monospace}
.ring .c small{font-size:.5em;color:var(--mut)}
.steps{width:100%;display:grid;gap:12px}
.sp{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center}
.sp i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eaeef6;color:var(--mut);font:700 13px 'Outfit',sans-serif;font-style:normal;transition:background .2s,color .2s}
.sp.dn i{background:var(--mn);color:#fff}.sp.cu i{background:var(--bl);color:#fff}
.sp b{display:block;font-size:14px}
.bar{height:8px;border-radius:4px;background:#eaeef6;overflow:hidden;margin-top:4px}
.bar>span{display:block;height:100%;width:0;background:var(--bl);border-radius:4px}
.sp.dn .bar>span{background:var(--mn)}
.ind{width:100%;display:grid;gap:26px;justify-items:center}
.ib{width:100%;height:8px;border-radius:4px;background:#eaeef6;overflow:hidden;position:relative}
.ib:after{content:"";position:absolute;top:0;bottom:0;width:40%;border-radius:4px;background:linear-gradient(90deg,var(--bl),var(--vi));animation:sl 1.3s ease-in-out infinite}
@keyframes sl{0%{left:-40%}100%{left:100%}}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--bl);animation:bn 1s infinite}
.dots i:nth-child(2){animation-delay:.15s;background:var(--vi)}.dots i:nth-child(3){animation-delay:.3s;background:var(--rs)}
@keyframes bn{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
.up{width:100%}
.up .f{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.ub{height:16px;border-radius:8px;background:#eaeef6;overflow:hidden}
.ub>span{display:block;height:100%;width:0;border-radius:8px;background:repeating-linear-gradient(45deg,var(--bl) 0 12px,#5b8dff 12px 24px);background-size:34px 34px;animation:stp .8s linear infinite}
@keyframes stp{to{background-position:34px 0}}
.up.dn .ub>span{background:var(--mn);animation:none}
.up .m{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-top:8px}
.act{display:flex;gap:18px;align-items:center;width:100%;justify-content:center;flex-wrap:wrap}
.act .ring{width:130px}
.lg{display:grid;gap:8px;font-size:14px}.lg div{display:flex;gap:8px;align-items:center}.lg i{width:10px;height:10px;border-radius:50%}
.lg b{margin-left:auto;padding-left:12px}
.cdw .ring .c{font-size:40px}
.cdw.hot .ring circle.fg{animation:pu .5s infinite alternate}
@keyframes pu{to{stroke-width:11}}
.live{position:absolute;left:-9999px}
@media(max-width:900px){.gr{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.gr{grid-template-columns:minmax(0,1fr)}body{padding:24px 16px}}
@media(prefers-reduced-motion:reduce){.ib:after,.dots i,.ub>span,.cdw.hot .ring circle.fg{animation:none}.ib:after{left:30%}*{transition:none!important}}
</style></head><body>
<div class="w"><header><div><h1>Gauge Lab</h1><p id="sl">Press play to start the simulation.</p></div>
<div class="ctl" role="group" aria-label="Simulation controls"><button class="pp" id="pp" type="button">Play</button><button id="rs" type="button">Restart</button><label><span class="live">Speed</span><select id="sp"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div></header>
<div class="gr">
<section class="cd"><div class="cp">Ring<button type="button" data-end="ring">Skip to end</button></div><div class="st"><div class="ring" id="r1" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e6bff"/><stop offset="1" stop-color="#19c39a"/></linearGradient></defs><circle cx="50" cy="50" r="42" stroke="#eaeef6" stroke-width="9"/><circle id="a1" cx="50" cy="50" r="42" stroke="url(#g1)" stroke-width="9" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg><div class="c"><span id="v1">0</span><small>%</small></div></div></div></section>
<section class="cd"><div class="cp">Steps<button type="button" data-end="steps">Skip to end</button></div><div class="st"><div class="steps" id="s2" role="progressbar" aria-label="Publishing steps" aria-valuemin="0" aria-valuemax="5"></div></div></section>
<section class="cd"><div class="cp">Indeterminate</div><div class="st"><div class="ind"><div class="ib" role="progressbar" aria-label="Loading, please wait"></div><div class="dots" role="status" aria-label="Thinking"><i></i><i></i><i></i></div></div></div></section>
<section class="cd"><div class="cp">Upload<button type="button" data-end="up">Skip to end</button></div><div class="st"><div class="up" id="u4"><div class="f"><b>lookbook-autumn.pdf</b><span class="mono" id="u4p">0%</span></div><div class="ub" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" id="u4b"><span id="u4s"></span></div><div class="m mono"><span id="u4z">0.0 / 48.0 MB</span><span id="u4v">—</span></div></div></div></section>
<section class="cd"><div class="cp">Activity rings<button type="button" data-end="act">Skip to end</button></div><div class="st"><div class="act"><div class="ring" role="img" aria-label="Activity rings" id="r5"><svg viewBox="0 0 100 100" aria-hidden="true"></svg></div><div class="lg" id="l5"></div></div></div></section>
<section class="cd cdw" id="cw"><div class="cp">Countdown<button type="button" id="cpb">Pause</button></div><div class="st"><div class="ring" role="timer" aria-label="Time remaining"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" stroke="#eaeef6" stroke-width="8"/><circle class="fg" id="a6" cx="50" cy="50" r="42" stroke="#8a5cff" stroke-width="8" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg><div class="c"><span id="v6">60</span><small>s</small></div></div></div></section>
</div><div class="live" id="lv" aria-live="polite"></div></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
var T=0,speed=1,run=false,last=0,DUR=12,said={},cdT=0,cdRun=true;
var STEPS=['Upload','Scan','Process','Review','Publish'];
$('#s2').innerHTML=STEPS.map(function(n,i){return '<div class="sp" data-i="'+i+'"><i>'+(i+1)+'</i><div><b>'+n+'</b><div class="bar"><span></span></div></div></div>'}).join('');
var RG=[['Move','#ff5c7a',.82,'492 / 600 kcal'],['Focus','#19c39a',.64,'38 / 60 min'],['Rest','#2e6bff',.91,'7.3 / 8 hrs']];
var sv='';RG.forEach(function(r,i){var rad=42-i*12;sv+='<circle cx="50" cy="50" r="'+rad+'" fill="none" stroke="'+r[1]+'" stroke-opacity=".18" stroke-width="8"/><circle class="ar" data-i="'+i+'" cx="50" cy="50" r="'+rad+'" fill="none" stroke="'+r[1]+'" stroke-width="8" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" style="transform:rotate(-90deg);transform-origin:50% 50%"/>'});
$('#r5 svg').innerHTML=sv;$('#l5').innerHTML=RG.map(function(r){return '<div><i style="background:'+r[1]+'"></i>'+r[0]+'<b class="mono" data-v></b></div>'}).join('');
function ease(p){return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2}
function say(t){$('#lv').textContent=t}
function render(){var p=Math.min(1,T/DUR),e=rm?Math.round(p*10)/10:ease(p),pc=Math.round(e*100);
 $('#a1').setAttribute('stroke-dashoffset',100-e*100);$('#v1').textContent=pc;$('#r1').setAttribute('aria-valuenow',pc);
 var st=e*5,cu=Math.min(4,Math.floor(st)),done=0;
 document.querySelectorAll('#s2 .sp').forEach(function(el,i){var f=Math.max(0,Math.min(1,st-i));el.querySelector('.bar>span').style.width=f*100+'%';el.classList.toggle('dn',f>=1);el.classList.toggle('cu',f>0&&f<1);el.querySelector('i').textContent=f>=1?'✓':i+1;if(f>=1)done++});
 $('#s2').setAttribute('aria-valuenow',done);$('#s2').setAttribute('aria-valuetext',done+' of 5 steps complete');
 var u=Math.min(1,p*1.05);var us=rm?Math.round(u*10)/10:u;$('#u4s').style.width=us*100+'%';$('#u4p').textContent=Math.round(us*100)+'%';$('#u4b').setAttribute('aria-valuenow',Math.round(us*100));$('#u4z').textContent=(us*48).toFixed(1)+' / 48.0 MB';$('#u4v').textContent=us>=1?'Done':(4.2+Math.sin(T*2)*.9).toFixed(1)+' MB/s';$('#u4').classList.toggle('dn',us>=1);
 document.querySelectorAll('.ar').forEach(function(c,i){var v=RG[i][2]*e;c.setAttribute('stroke-dashoffset',100-v*100)});
 document.querySelectorAll('#l5 [data-v]').forEach(function(b,i){b.textContent=Math.round(RG[i][2]*e*100)+'%'});
 [25,50,75,100].forEach(function(m){if(pc>=m&&!said[m]){said[m]=1;say(m===100?'Complete: all indicators have finished':'Progress '+m+' percent')}})}
function cd(){var left=Math.max(0,60-cdT);$('#a6').setAttribute('stroke-dashoffset',100-left/60*100);$('#v6').textContent=Math.ceil(left);$('#cw').classList.toggle('hot',left<=10&&left>0&&!rm)}
function tick(t){if(!last)last=t;var dt=(t-last)/1000;last=t;if(run&&T<DUR){T=Math.min(DUR,T+dt*speed);render();if(T>=DUR){run=false;setBtn();$('#sl').textContent='Finished. Press restart to run it again.'}}
 if(cdRun&&run&&cdT<60){cdT=Math.min(60,cdT+dt*speed);cd()}requestAnimationFrame(tick)}
function setBtn(){$('#pp').textContent=run?'Pause':(T>=DUR?'Done':'Play');$('#pp').disabled=T>=DUR&&!run}
$('#pp').addEventListener('click',function(){if(T>=DUR)return;run=!run;setBtn();$('#sl').textContent=run?'Running at '+speed+'×':'Paused.';last=0});
$('#rs').addEventListener('click',function(){T=0;cdT=0;said={};run=true;cdRun=true;$('#cpb').textContent='Pause';setBtn();$('#sl').textContent='Running at '+speed+'×';last=0;render();cd()});
$('#sp').addEventListener('change',function(){speed=+this.value;if(run)$('#sl').textContent='Running at '+speed+'×'});
$('#cpb').addEventListener('click',function(){cdRun=!cdRun;this.textContent=cdRun?'Pause':'Resume';say(cdRun?'Countdown resumed':'Countdown paused')});
document.addEventListener('click',function(e){var b=e.target.closest('[data-end]');if(!b)return;T=DUR;run=false;setBtn();render();$('#sl').textContent='Skipped to the end.'});
render();cd();setBtn();requestAnimationFrame(tick);
})();
</script></body></html>
