<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ines Moreau — Terminal Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--fg:#39ff88;--bg:#050805;--ln:#1d2a1d;--er:#ff5f56}
body.amber{--fg:#ffb000;--bg:#080500;--ln:#2e2208}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(80% 60% at 50% 20%,#0c130c,#020402);color:var(--fg);font:400 15px/1.6 'IBM Plex Mono',monospace;display:grid;place-items:center;padding:20px}
body.amber{background:radial-gradient(80% 60% at 50% 20%,#140e02,#030200)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.win{position:relative;width:min(920px,100%);height:min(80vh,640px);min-height:420px;background:var(--bg);border:1px solid var(--ln);border-radius:14px;box-shadow:0 0 60px -10px color-mix(in srgb,var(--fg) 30%,transparent);display:flex;flex-direction:column;overflow:hidden}
.win:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px),radial-gradient(120% 100% at 50% 50%,transparent 60%,rgba(0,0,0,.45))}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--ln);background:color-mix(in srgb,var(--fg) 4%,var(--bg))}
.bar i{width:11px;height:11px;border-radius:50%;background:var(--ln);border:1px solid color-mix(in srgb,var(--fg) 35%,transparent)}
.bar b{font:400 24px/1 VT323,monospace;margin-left:8px;letter-spacing:.04em;font-weight:400;opacity:.9}
.th{margin-left:auto;background:none;border:1px solid color-mix(in srgb,var(--fg) 40%,transparent);color:var(--fg);border-radius:6px;padding:2px 10px;font:500 12px 'IBM Plex Mono',monospace;cursor:pointer}
.th:hover{background:color-mix(in srgb,var(--fg) 14%,transparent)}
#out{flex:1;overflow-y:auto;padding:16px 18px 6px;text-shadow:0 0 6px color-mix(in srgb,var(--fg) 45%,transparent);scrollbar-width:thin;scrollbar-color:var(--ln) transparent;overflow-wrap:anywhere}
.l{white-space:pre-wrap;min-height:1.6em}
.m{opacity:.62}.e{color:var(--er);text-shadow:none}.h{font-weight:700}
.l a{color:inherit;text-decoration:underline}
.pr{display:flex;gap:8px;align-items:center;padding:4px 18px 10px;text-shadow:0 0 6px color-mix(in srgb,var(--fg) 45%,transparent)}
.pr label{white-space:nowrap;font-weight:500}
.cw{position:relative;flex:1;min-width:0}
#in{width:100%;background:none;border:0;outline:0;color:var(--fg);font:inherit;caret-color:transparent;padding:0;text-shadow:inherit}
.cur{position:absolute;top:3px;width:.6em;height:1.2em;background:var(--fg);pointer-events:none;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 18px 14px;border-top:1px solid var(--ln)}
.chips button{background:none;border:1px solid color-mix(in srgb,var(--fg) 40%,transparent);color:var(--fg);border-radius:6px;padding:4px 12px;font:500 13px 'IBM Plex Mono',monospace;cursor:pointer}
.chips button:hover{background:color-mix(in srgb,var(--fg) 16%,transparent)}
@media(max-width:600px){body{padding:0;place-items:stretch}.win{height:100dvh;border-radius:0;border-width:0;font-size:13px}body{font-size:13px}#out{padding:12px 12px 4px}.pr,.chips{padding-left:12px;padding-right:12px}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
</style></head><body>
<div class="win" id="win"><div class="bar"><i></i><i></i><i></i><b>guest@ines-dev: ~</b><button class="th" id="th" aria-label="Switch theme">theme: green</button></div>
<div id="out" role="log" aria-live="polite" aria-label="Terminal output" tabindex="0"></div>
<form class="pr" id="fm" autocomplete="off"><label for="in">guest@ines:~$</label><div class="cw"><input id="in" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Terminal command"><span class="cur" id="cur" aria-hidden="true"></span></div></form>
<div class="chips" id="chips" role="group" aria-label="Quick commands"></div></div>
<script>
const $=i=>document.getElementById(i),out=$('out'),inp=$('in');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const PROJ={atlas:['Atlas','A tile-based map renderer in 9 KB of JavaScript.','https://atlas.example/'],kiln:['Kiln','Static site generator with instant rebuilds.','https://kiln.example/'],lantern:['Lantern','Accessibility linter for design tokens.','https://lantern.example/'],sprig:['Sprig','Tiny reactive store with a 1 KB footprint.','https://sprig.example/']};
const SK=[['TypeScript',92],['CSS & layout',95],['Accessibility',88],['Node.js',80],['Rust',46],['Design systems',85]];
const CMDS=['help','about','projects','project','skills','contact','theme','clear','whoami','date','sudo'];
let hist=[],hi=0,booting=true,skip=false,busy=false;
function line(h,cls=''){const d=document.createElement('div');d.className='l '+cls;d.innerHTML=h;out.appendChild(d);out.scrollTop=out.scrollHeight;return d}
const sleep=ms=>new Promise(r=>setTimeout(r,reduce||skip?0:ms));
async function type(t,cls=''){const d=line('',cls);if(reduce||skip){d.textContent=t;return}for(const ch of t){d.textContent+=ch;out.scrollTop=out.scrollHeight;await sleep(9);if(skip){d.textContent=t;break}}}
const RUN={
help(){return['Available commands:','  about            who I am','  projects         things I have built','  project <name>   details (atlas, kiln, lantern, sprig)','  skills           what I am good at','  contact          say hello','  theme <name>     green or amber','  clear            wipe the screen','  whoami · date    the usual','Tip: Tab completes, Up/Down browse history.']},
about(){return['Ines Moreau — front-end engineer, Lisbon.','I build fast, accessible interfaces and the design systems behind them.','Ten years across startups, agencies and one very patient bank.','Currently open to freelance work from January.']},
projects(){return['Selected work:','',...Object.entries(PROJ).map(([k,p])=>`  ${k.padEnd(9)}${p[1]}`),'','Run "project <name>" for details.']},
project(a){const k=(a[0]||'').toLowerCase();const p=PROJ[k];if(!p)return[{e:`project: no such project "${esc(a[0]||'')}". Try: ${Object.keys(PROJ).join(', ')}`}];return[{h:p[0]},p[1],`Link: <a href="${p[2]}" target="_blank" rel="noopener">${p[2]}</a>`,'Stack: TypeScript · Vite · Vitest','Status: maintained, MIT licensed.']},
skills(){return SK.map(([n,v])=>`${n.padEnd(15)}${'█'.repeat(Math.round(v/5))}${'░'.repeat(20-Math.round(v/5))} ${v}%`)},
contact(){return['Email    hello@ines.example','GitHub   github.com/ines-example','Writing  ines.example/notes','Replies usually within a day.']},
whoami(){return['guest']},date(){return[new Date().toString()]},
theme(a){const t=(a[0]||'').toLowerCase();if(t!=='green'&&t!=='amber')return[{e:'usage: theme green|amber'}];setTheme(t);return['Theme set to '+t+'.']},
clear(){out.innerHTML='';return[]},
sudo(a){if(a.join(' ')==='hire-me')return[{h:'Permission granted.'},'Sending offer letter to ines@example ...','████████████████████ 100%','Joking. But do get in touch: hello@ines.example'];return[{e:'guest is not in the sudoers file. This incident will be reported.'}]}};
function setTheme(t){document.body.classList.toggle('amber',t==='amber');$('th').textContent='theme: '+t}
function exec(raw){const c=raw.trim();line(`<span class="m">guest@ines:~$</span> ${esc(c)}`);if(!c)return;hist.push(c);hi=hist.length;const [cmd,...a]=c.split(/\s+/);const f=RUN[cmd.toLowerCase()];
 if(!f){const near=CMDS.find(x=>x.startsWith(cmd[0]))||'help';line(`${esc(cmd)}: command not found. Did you mean "${near}"? Try "help".`,'e');return}
 f(a).forEach(r=>typeof r==='string'?line(r.includes('<a ')?r:esc(r)):r.e?line(r.e,'e'):line(esc(r.h),'h'))}
$('fm').onsubmit=e=>{e.preventDefault();if(booting)return;exec(inp.value);inp.value='';moveCur()};
function moveCur(){const s=document.createElement('span');s.style.cssText='position:absolute;visibility:hidden;white-space:pre;font:inherit';s.textContent=inp.value.slice(0,inp.selectionStart||0);$('cur').parentElement.appendChild(s);$('cur').style.left=s.offsetWidth+'px';s.remove()}
inp.addEventListener('input',moveCur);inp.addEventListener('keyup',moveCur);inp.addEventListener('click',moveCur);
inp.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)inp.value=hist[--hi];setTimeout(()=>{inp.setSelectionRange(inp.value.length,inp.value.length);moveCur()})}
 else if(e.key==='ArrowDown'){e.preventDefault();hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||'';moveCur()}
 else if(e.key==='Tab'){e.preventDefault();const v=inp.value.trim().toLowerCase();if(v&&!v.includes(' ')){const m=CMDS.filter(c=>c.startsWith(v));if(m.length===1){inp.value=m[0]+' ';moveCur()}else if(m.length>1)line(m.join('   '),'m')}}
 else if(e.key==='l'&&e.ctrlKey){e.preventDefault();out.innerHTML=''}});
$('th').onclick=()=>setTheme(document.body.classList.contains('amber')?'green':'amber');
['help','about','projects','skills','contact'].forEach(c=>{const b=document.createElement('button');b.type='button';b.textContent=c;b.onclick=()=>{if(booting)return;exec(c);inp.focus()};$('chips').appendChild(b)});
document.addEventListener('keydown',()=>{if(booting)skip=true});document.addEventListener('click',()=>{if(booting)skip=true});
$('win').addEventListener('click',e=>{if(!e.target.closest('button,a')&&!getSelection().toString())inp.focus()});
(async()=>{const B=['BIOS v4.2  ·  memory check ........ OK','Mounting /portfolio ............. OK','Loading skills.dat .............. OK','','Welcome to ines-dev. Type "help" to begin.'];
 for(const b of B){await type(b,b?'m':'');await sleep(120)}booting=false;moveCur();inp.focus({preventScroll:true})})();
</script></body></html>
