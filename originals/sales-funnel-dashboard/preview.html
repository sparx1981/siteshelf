<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Funnel Dashboard — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--ink:#0f172a;--mut:#64748b;--ac:#2563eb;--bd:#e2e7ef;--ok:#16a34a;--er:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;color:var(--ink);font:400 14px/1.5 Inter,system-ui,sans-serif;padding:24px clamp(14px,3vw,36px) 50px}
:focus-visible{outline:3px solid #93b4ff;outline-offset:2px;border-radius:6px}
.w{max-width:1240px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hd h1{font:700 24px Inter;margin:0}.hd p{margin:0;color:var(--mut)}
.ct{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:3px}
.seg button{min-height:34px;border:0;background:none;border-radius:7px;padding:0 14px;font:600 13px Inter;color:var(--mut);cursor:pointer}
.seg button[aria-checked=true]{background:var(--ac);color:#fff}
select,.bt{min-height:42px;border:1px solid var(--bd);background:#fff;border-radius:10px;padding:0 14px;font:600 13px Inter;color:var(--ink);cursor:pointer}
.bt.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.pn{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:18px}
.k small{color:var(--mut);font-weight:500}
.k b{display:block;font:700 28px/1.2 Inter;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.dl{display:inline-block;border-radius:99px;padding:2px 9px;font:700 12px Inter}.dl.up{background:#dcfce7;color:#166534}.dl.dn{background:#fee2e2;color:#991b1b}
.k svg{width:100%;height:36px;margin-top:8px;display:block}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:14px;margin-bottom:14px}
h2{font:700 15px Inter;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 14px;font-size:13px}
.fn{display:flex;flex-direction:column;gap:6px}
.st{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:12px;align-items:center;border-radius:10px;padding:2px;cursor:pointer;border:0;background:none;text-align:left;font:inherit;color:inherit}
.st:hover,.st:focus-visible,.st.on{background:#f1f5ff}
.st .nm{font-weight:600}.st .nm small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.st .tr{height:44px;display:flex;justify-content:center;align-items:center}
.st .bar{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;color:#fff;font:700 14px Inter;transition:width .6s cubic-bezier(.3,.9,.3,1);min-width:44px;font-variant-numeric:tabular-nums}
.st .cv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.st .cv small{display:block;color:var(--mut);font-weight:400;font-size:11.5px}
.cap{margin-top:12px;background:#f8fafc;border-radius:10px;padding:10px 14px;color:#334155;min-height:44px}
.lc{position:relative}.lc svg{width:100%;height:220px;display:block}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font:600 12px Inter;padding:5px 10px;border-radius:8px;transform:translate(-50%,-120%);white-space:nowrap;opacity:0}
.lb{display:grid;gap:10px}
.lr{display:grid;grid-template-columns:24px 110px minmax(0,1fr) 80px;gap:10px;align-items:center}
.lr .rk{font-weight:700;color:var(--mut)}
.lr .tk{height:10px;background:#eef2f7;border-radius:9px;overflow:hidden}.lr .tk span{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,var(--ac));border-radius:9px;transition:width .6s}
.lr b{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font:600 12px Inter;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
th button{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:32px}
th button::after{content:"↕";color:#b3bccb}
th[aria-sort=ascending] button::after{content:"↑";color:var(--ac)}th[aria-sort=descending] button::after{content:"↓";color:var(--ac)}
td.n{font-variant-numeric:tabular-nums;font-weight:600}
.chip{border-radius:99px;padding:3px 11px;font:700 12px Inter}
.pb{display:inline-block;width:80px;height:8px;background:#eef2f7;border-radius:9px;vertical-align:middle;margin-right:8px;overflow:hidden}.pb span{display:block;height:100%;background:var(--ac)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;opacity:0;transition:.25s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;left:-9999px}
@media(max-width:980px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){.st{grid-template-columns:78px minmax(0,1fr) 54px;gap:8px}.lr{grid-template-columns:20px 84px minmax(0,1fr) 62px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="w">
<div class="hd"><div><h1>Pipelane</h1><p>Revenue funnel · <span id="pd">Last 30 days</span> · <span id="sg">All segments</span></p></div>
<div class="ct"><div class="seg" role="radiogroup" aria-label="Period" id="pr"><button role="radio" aria-checked="false" data-d="7">7d</button><button role="radio" aria-checked="true" data-d="30">30d</button><button role="radio" aria-checked="false" data-d="90">90d</button></div>
<label class="sr" for="se">Segment</label><select id="se"><option>All</option><option>SMB</option><option>Mid-market</option><option>Enterprise</option></select><button class="bt p" id="ex">Export CSV</button></div></div>
<div class="kp" id="kp"></div>
<div class="two"><section class="pn"><h2>Conversion funnel</h2><p class="sub">Hover or use ↑ ↓ to inspect each stage.</p><div class="fn" id="fn" role="list"></div><div class="cap" id="cp" aria-live="polite">Select a stage to see drop-off details.</div></section>
<section class="pn"><h2>Win rate</h2><p class="sub" id="wl">Weekly win rate, %</p><div class="lc" id="lc"><svg id="ls" viewBox="0 0 400 220" preserveAspectRatio="none" role="img" aria-label="Win rate line chart"></svg><div class="tt" id="tt"></div></div>
<h2 style="margin-top:18px">Regional leaderboard</h2><div class="lb" id="lb"></div></section></div>
<section class="pn"><h2>Open deals</h2><p class="sub">Click a header to sort.</p><div class="tw"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div></section>
<div class="toast" id="ts" role="status"></div><div class="sr" id="lv" aria-live="polite"></div></div>
<script>
const $=s=>document.querySelector(s),mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let days=30,seg='All';
const SEGF={All:1,SMB:.55,'Mid-market':.8,Enterprise:.35},SEGC={All:[.62,.55,.7,.74,.6],SMB:[.7,.5,.62,.8,.7],'Mid-market':[.6,.58,.7,.72,.58],Enterprise:[.5,.6,.78,.7,.48]};
const ST=['Leads','Qualified','Demo','Proposal','Negotiation','Won'];
const fmt=n=>Math.round(n).toLocaleString('en-GB');const gbp=n=>'£'+(n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(0)+'k':Math.round(n));
function data(){const base=Math.round(2400*days/30*SEGF[seg]);const r=SEGC[seg].map((c,i)=>c*(1+Math.sin(days+i)*.04));const s=[base];r.forEach(x=>s.push(s[s.length-1]*x));const won=s[5],avg=(seg==='Enterprise'?48000:seg==='Mid-market'?19500:seg==='SMB'?6200:14800)*(1+(days===7?.06:days===90?-.04:0));
 return{s,won,avg,pipe:s[3]*avg*.6,win:s[5]/s[1]*100,cycle:(seg==='Enterprise'?74:seg==='Mid-market'?48:seg==='SMB'?21:38)+(days===90?-3:days===7?4:0)}}
const tiles=[['Pipeline value',d=>gbp(d.pipe),'+8.2%',1,[3,4,3,5,6,6,8]],['Win rate',d=>d.win.toFixed(1)+'%','+1.4 pts',1,[4,5,5,4,6,7,7]],['Avg deal size',d=>gbp(d.avg),'-2.1%',0,[7,6,6,7,5,5,5]],['Sales cycle',d=>Math.round(d.cycle)+' days','-3 days',1,[8,7,7,6,6,5,5]]];
const kp=$('#kp');tiles.forEach((t,i)=>{const p=mk('div','pn k');p.innerHTML='<small></small><b></b><span class="dl"></span><svg viewBox="0 0 100 36" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="#2563eb" stroke-width="2" points=""/></svg>';p.querySelector('small').textContent=t[0];const dl=p.querySelector('.dl');dl.textContent=t[2];dl.classList.add(t[3]?'up':'dn');p.querySelector('polyline').setAttribute('points',t[4].map((v,k)=>(k*100/6)+','+(34-v*3.6)).join(' '));kp.append(p)});
const cur={};
function tween(el,key,to,fm){if(rm){el.textContent=fm(to);cur[key]=to;return}const from=cur[key]??0;cur[key]=to;let t0;const f=t=>{t0=t0||t;const p=Math.min(1,(t-t0)/500);el.textContent=fm(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
const fn=$('#fn');ST.forEach((n,i)=>{const b=mk('button','st');b.setAttribute('role','listitem');const c1=`hsl(${224+i*8} 80% ${52-i*2}%)`,c2=`hsl(${252+i*8} 70% ${55-i*2}%)`;b.style.setProperty('--c1',c1);b.style.setProperty('--c2',c2);
 b.innerHTML='<span class="nm"><span></span><small></small></span><span class="tr"><span class="bar"></span></span><span class="cv"></span>';b.querySelector('.nm span').textContent=n;b.dataset.i=i;
 b.onmouseenter=()=>sel(i);b.onfocus=()=>sel(i);b.onclick=()=>sel(i);
 b.onkeydown=e=>{let k=-1;if(e.key==='ArrowDown')k=Math.min(5,i+1);else if(e.key==='ArrowUp')k=Math.max(0,i-1);if(k>=0){e.preventDefault();fn.children[k].focus()}};fn.append(b)});
let D=data();
function sel(i){[...fn.children].forEach((b,k)=>b.classList.toggle('on',k===i));const s=D.s;const prev=i?s[i-1]:null;$('#cp').textContent=i?ST[i]+': '+fmt(s[i])+' of '+fmt(s[i-1])+' from '+ST[i-1]+' ('+(s[i]/s[i-1]*100).toFixed(1)+'% convert, '+fmt(s[i-1]-s[i])+' dropped).':ST[0]+': '+fmt(s[0])+' leads entered the funnel in this period.'}
function drawFunnel(){D.s.forEach((v,i)=>{const b=fn.children[i],bar=b.querySelector('.bar');bar.style.width=Math.max(8,v/D.s[0]*100)+'%';bar.textContent=fmt(v);b.querySelector('small').textContent=i?'':'Top of funnel';b.querySelector('.cv').innerHTML='';const c=i?(v/D.s[i-1]*100).toFixed(0)+'%':'100%';b.querySelector('.cv').append(c);b.querySelector('.cv').append(mk('small',null,i?'of prev':'entered'));b.setAttribute('aria-label',ST[i]+', '+fmt(v)+', '+c+' of previous stage')})}
function wr(){const n=days===7?7:days===30?12:13;return Array.from({length:n},(_,i)=>+(D.win+Math.sin(i*1.3+days)*2.1+(i-n/2)*.15).toFixed(1))}
let W=[];
function drawLine(){W=wr();const svg=$('#ls');svg.textContent='';const NS='http://www.w3.org/2000/svg',mn=Math.min(...W)-1.5,mx=Math.max(...W)+1.5,w=400,h=220,px=i=>20+i*(w-40)/(W.length-1),py=v=>h-26-(v-mn)/(mx-mn)*(h-50);
 for(let k=0;k<=3;k++){const y=24+k*(h-50)/3;const l=document.createElementNS(NS,'line');l.setAttribute('x1',20);l.setAttribute('x2',w-20);l.setAttribute('y1',y);l.setAttribute('y2',y);l.setAttribute('stroke','#e8edf4');svg.append(l)}
 const pts=W.map((v,i)=>px(i)+','+py(v)).join(' ');const ar=document.createElementNS(NS,'polygon');ar.setAttribute('points',px(0)+','+(h-26)+' '+pts+' '+px(W.length-1)+','+(h-26));ar.setAttribute('fill','#2563eb');ar.setAttribute('opacity','.1');svg.append(ar);
 const pl=document.createElementNS(NS,'polyline');pl.setAttribute('points',pts);pl.setAttribute('fill','none');pl.setAttribute('stroke','#2563eb');pl.setAttribute('stroke-width','2.5');pl.setAttribute('vector-effect','non-scaling-stroke');svg.append(pl);
 const dot=document.createElementNS(NS,'circle');dot.setAttribute('r',5);dot.setAttribute('fill','#2563eb');dot.setAttribute('stroke','#fff');dot.setAttribute('stroke-width','2');dot.style.display='none';svg.append(dot);svg._f={px,py,dot};$('#wl').textContent=(days===7?'Daily':'Weekly')+' win rate, %'}
$('#lc').addEventListener('pointermove',e=>{const svg=$('#ls'),r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*400;const f=svg._f;let i=Math.round((x-20)/((400-40)/(W.length-1)));i=Math.max(0,Math.min(W.length-1,i));const tt=$('#tt');f.dot.setAttribute('cx',f.px(i));f.dot.setAttribute('cy',f.py(W[i]));f.dot.style.display='';tt.style.opacity=1;tt.style.left=(f.px(i)/400*r.width)+'px';tt.style.top=(f.py(W[i])/220*r.height)+'px';tt.textContent=W[i]+'%'});
$('#lc').addEventListener('pointerleave',()=>{$('#tt').style.opacity=0;$('#ls')._f.dot.style.display='none'});
const REG=[['North America',.34],['EMEA',.29],['APAC',.19],['LATAM',.11],['Nordics',.07]];
function drawLb(){const lb=$('#lb');lb.textContent='';const tot=D.won*D.avg;REG.forEach(([n,s],i)=>{const r=mk('div','lr');r.innerHTML='<span class="rk"></span><span></span><div class="tk"><span></span></div><b></b>';r.children[0].textContent=i+1;r.children[1].textContent=n;r.querySelector('.tk span').style.width='0';r.querySelector('b').textContent=gbp(tot*s);lb.append(r);requestAnimationFrame(()=>requestAnimationFrame(()=>r.querySelector('.tk span').style.width=(s/.34*100)+'%'))})}
const DEALS=[['Brightwell Dental','SMB','Proposal',64,'£12k',1],['Orrin Freight','Mid-market','Negotiation',82,'£46k',2],['Halden Health','Enterprise','Demo',38,'£190k',3],['Loomis & Pike','SMB','Qualified',24,'£8k',4],['Quarry Bank','Enterprise','Negotiation',74,'£240k',5],['Fenwick Labs','Mid-market','Proposal',58,'£31k',6],['Tidewater Co-op','SMB','Demo',41,'£9k',7],['Marlowe Studios','Mid-market','Qualified',29,'£22k',8]];
const COLS=[['Account','a'],['Segment','b'],['Stage','c'],['Win prob.','d'],['Value','e']];let sk=3,sd=-1;
const th=$('#th');COLS.forEach((c,i)=>{const t=mk('th');t.setAttribute('aria-sort','none');const b=mk('button',null,c[0]);b.onclick=()=>{if(sk===i)sd*=-1;else{sk=i;sd=i===3||i===4?-1:1}drawT()};t.append(b);th.append(t)});
const SC={Qualified:['#e0e7ff','#3730a3'],Demo:['#cffafe','#155e75'],Proposal:['#fef3c7','#92400e'],Negotiation:['#fce7f3','#9d174d']};
const val=s=>+s.replace(/[£k]/g,'');
function drawT(){const rows=DEALS.filter(d=>seg==='All'||d[1]===seg).slice().sort((a,b)=>{const k=[0,1,2,3,4][sk];let x=a[k],y=b[k];if(k===4){x=val(x);y=val(y)}return (x>y?1:x<y?-1:0)*sd});[...th.children].forEach((t,i)=>t.setAttribute('aria-sort',i===sk?(sd>0?'ascending':'descending'):'none'));
 const tb=$('#tb');tb.textContent='';rows.forEach(d=>{const tr=mk('tr');tr.append(mk('td',null,d[0]),mk('td',null,d[1]));const c=mk('td'),ch=mk('span','chip',d[2]);ch.style.background=SC[d[2]][0];ch.style.color=SC[d[2]][1];c.append(ch);const p=mk('td');p.innerHTML='<span class="pb"><span style="width:'+d[3]+'%"></span></span>';p.append(d[3]+'%');tr.append(c,p,mk('td','n',d[4]));tb.append(tr)});if(!rows.length){const tr=mk('tr'),td=mk('td','',"No open deals in this segment.");td.colSpan=5;tr.append(td);tb.append(tr)}}
function update(first){D=data();drawFunnel();tiles.forEach((t,i)=>tween(kp.children[i].querySelector('b'),'k'+i,[D.pipe,D.win,D.avg,D.cycle][i],[x=>gbp(x),x=>x.toFixed(1)+'%',x=>gbp(x),x=>Math.round(x)+' days'][i]));drawLine();drawLb();drawT();sel(0);
 $('#pd').textContent='Last '+days+' days';$('#sg').textContent=seg==='All'?'All segments':seg;if(!first)$('#lv').textContent=seg+', last '+days+' days: win rate '+D.win.toFixed(1)+'%, '+fmt(D.s[0])+' leads.'}
const pr=[...$('#pr').children];pr.forEach((b,i)=>{b.onclick=()=>{days=+b.dataset.d;pr.forEach(x=>x.setAttribute('aria-checked',x===b));update()};b.onkeydown=e=>{let n=-1;if(e.key==='ArrowRight')n=(i+1)%3;else if(e.key==='ArrowLeft')n=(i+2)%3;if(n>=0){e.preventDefault();pr[n].click();pr[n].focus()}}});
$('#se').onchange=e=>{seg=e.target.value;update()};
$('#ex').onclick=()=>{const rows=[['Stage','Count','Conversion from previous %']].concat(D.s.map((v,i)=>[ST[i],Math.round(v),i?(v/D.s[i-1]*100).toFixed(1):'100']));const csv=rows.map(r=>r.join(',')).join('\n');try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='pipelane-funnel.csv';document.body.append(a);a.click();a.remove()}catch(e){}const t=$('#ts');t.textContent='Exported pipelane-funnel.csv';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)};
update(true);
</script></body></html>
