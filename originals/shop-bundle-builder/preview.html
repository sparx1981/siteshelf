<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bundle Builder — E-commerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#f7f1e5;color:#201b15;font:400 15px/1.5 Figtree,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #201b15;outline-offset:3px;box-shadow:0 0 0 6px #fff}
.hd{max-width:1260px;margin:0 auto;padding:12px 20px;display:flex;align-items:center}.wm{font:400 22px "Young Serif",serif}
.bag{margin-left:auto;font:700 14px Figtree;background:#fffdf8;color:#201b15;border:1.5px solid #201b15;border-radius:99px;min-height:44px;padding:0 16px}
.w{max-width:1260px;margin:0 auto;padding:0 20px 90px}
.eb{font:700 12px Figtree;letter-spacing:.16em;text-transform:uppercase;color:#1f5e45;margin:4px 0}

.main{display:grid;grid-template-columns:1fr 400px;gap:22px;align-items:start}.main>*{min-width:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pc{position:relative;background:#fffdf8;border:1.5px solid #e6dcc6;border-radius:16px;overflow:hidden;transition:border-color .15s}
.pc.sel{border-color:#1f5e45;box-shadow:0 0 0 2px #1f5e45}

.pc.sel .tk{display:grid}
.pb{padding:10px 12px 12px}.pb b{display:block}.pb small{color:#675c4c}
.pr{font-weight:700;font-variant-numeric:tabular-nums}
.sl{width:100%;margin-top:8px;font:700 14px Figtree;color:#201b15;background:#fff;border:1.5px solid #201b15;border-radius:10px;min-height:44px;cursor:pointer}
.pc.sel .sl{background:#1f5e45;color:#fff;border-color:#1f5e45}

.bp h2{font:400 24px "Young Serif",serif;margin:0 0 4px}

<div class="tz" id="tz" role="status"></div>

<button class="add" id="add" disabled>Add bundle to bag</button><div class="ac"><button type="button" id="fav">Fill with favourites</button><button type="button" id="clr">Clear</button></div></aside></div>
<div class="sr" id="live" aria-live="polite"></div>
</main>
<div class="mb"><span><b id="mbr">0 of 3</b><br><small id="mbs">Save GBP 0.00</small></span><button id="add2" disabled>Add bundle</button></div>

$('#grid').addEventListener('click',function(e){var b=e.target.closest('.sl');if(b){toggle(b.dataset.id);return}var r=e.target.closest('[data-rep]');if(r){var old=sel.shift();var p=by(old);sel.push(r.dataset.rep);fly(r.dataset.rep);render();say(p[1]+' ('+p[2]+') replaced. 3 of 3 chosen.')}});
$('#slots').addEventListener('click',function(e){var b=e.target.closest('[data-rm]');if(b)toggle(b.dataset.rm)});
$('#fav').onclick=function(){sel=['b1','m1','t2'];render();say('Favourites selected: Trail Bottle, Camp Mug and Canvas Tote. 3 of 3 chosen. You save '+money(calc().sv)+'.')};
$('#clr').onclick=function(){sel=[];render();say('Bundle cleared.')};
function addB(){if(sel.length<3)return;bag+=3;$('#bc').textContent=bag;say('Bundle added to bag. Bag has '+bag+' items.');$('#tz').textContent='Bundle added to bag.';setTimeout(function(){sel=[];render()},800)}
$('#add').onclick=addB;$('#add2').onclick=addB;
render();
})();
</script></body></html>
