ROWS.forEach(function(r){var vals=ps.map(r[1]),same=vals.every(function(v){return v===vals[0]});if(diff&&same){hid++;return}var best=null;if(r[3]&&!same&&r[0]!=='Battery life'||(r[3]&&r[0]==='Battery life'&&!same)){var nz=vals.filter(function(v){return r[0]==='Battery life'||r[0]==='Wireless range'?v>0:true});best=r[3]==='min'?Math.min.apply(0,nz):Math.max.apply(0,nz)}
h+='<tr><th scope="row">'+r[0]+'</th>'+vals.map(function(v){var isB=best!=null&&v===best;return'<td'+(isB?' class="best"':'')+'>'+(r[2]?r[2](v):v)+(isB?'<span class="bs">★ Best</span>':'')+'</td>'}).join('')+'</tr>'});
$('#tb').innerHTML=h+'</tbody>';$('#dr').textContent=diff?(ROWS.length-hid)+' rows shown, '+hid+' identical rows hidden.':''}
$('#go').onclick=function(){if(sel.length<2)return;$('#cs').hidden=false;table();$('#cs').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});$('#ch').focus({preventScroll:true})};
$('#df').onchange=table;
$('#tb').addEventListener('click',function(e){var a=e.target.closest('[data-add]');if(a){var l=document.querySelector('[data-ad="'+a.dataset.add+'"]');l.textContent='✓ Added';say(by(a.dataset.add).n+' added to bag.');return}var r=e.target.closest('[data-rm2]');if(r){toggle(r.dataset.rm2)}});
build();tray();
})();
</script></body></html>
