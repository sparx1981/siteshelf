else{h+='<div class="ans" role="'+(q.multi?'group':'radiogroup')+'" aria-label="'+q.t+'">'+q.o.map(function(o,i){var v=o.toLowerCase(),on=q.multi?A.int.indexOf(v)>-1:A[q.k===q.k?q.k:'']===v;return'<label><input type="'+(q.multi?'checkbox':'radio')+'" name="'+q.k+'" value="'+v+'"'+(on?' checked':'')+'><span class="c">'+(q.ic?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+q.ic[i]+'</svg>':'')+o+'</span></label>'}).join('')+'</div>'+(q.multi?'<p style="margin:8px 0 0;font-size:13px;color:#6b5a62">Choose up to 3.</p>':'')}
$('#q').innerHTML=h;$('#pt').textContent='Question '+(step+1)+' of 5';$('#dots').innerHTML=QS.map(function(_,i){return'<i class="'+(i===step?'on':i<step?'dn':'')+'"></i>'}).join('');$('#bk').style.visibility=step?'':'hidden';$('#nx').textContent=step===4?'See my gifts':'Next';
if(!reduce)$('#q').animate([{opacity:0,transform:'translateX(14px)'},{opacity:1,transform:'none'}],{duration:250,easing:'ease-out'});
$('#q').querySelectorAll('input[type=radio]').forEach(function(i){i.onchange=function(){A[QS[step].k]=i.value;chips();score(true)}});
$('#q').querySelectorAll('input[type=checkbox]').forEach(function(i){i.onchange=function(){var x=A.int.indexOf(i.value);if(i.checked){if(A.int.length>=3){i.checked=false;say('You can choose up to 3 interests.');return}A.int.push(i.value)}else if(x>-1)A.int.splice(x,1);chips();score(true)}});
var br=$('#br');if(br){br.oninput=function(){A.bud=+br.value;A.budSet=true;$('#bo').textContent=A.bud>=200?'Any budget':'Up to GBP '+A.bud;chips();score(false)};br.onchange=function(){score(true)};$('#q').querySelectorAll('[data-b]').forEach(function(b){b.onclick=function(){A.bud=+b.dataset.b;A.budSet=true;br.value=A.bud;$('#bo').textContent=A.bud>=200?'Any budget':'Up to GBP '+A.bud;chips();score(true)}})}
}
function chips(){var c=[];if(A.who)c.push(['who',A.who[0].toUpperCase()+A.who.slice(1),0]);if(A.occ)c.push(['occ',A.occ[0].toUpperCase()+A.occ.slice(1),1]);if(A.budSet&&A.bud<200)c.push(['bud','Up to GBP '+A.bud,2]);A.int.forEach(function(i){c.push(['int:'+i,i[0].toUpperCase()+i.slice(1),3])});if(A.sty)c.push(['sty',A.sty[0].toUpperCase()+A.sty.slice(1),4]);
$('#ch').innerHTML=c.map(function(x){return'<span class="chip">'+x[1]+'<button type="button" data-c="'+x[0]+'" data-s="'+x[2]+'" aria-label="Remove '+x[1]+'">×</button></span>'}).join('')||'<span style="color:#6b5a62;font-size:14px">Your answers will appear here.</span>'}
$('#ch').addEventListener('click',function(e){var b=e.target.closest('[data-c]');if(!b)return;var k=b.dataset.c;if(k.indexOf('int:')===0)A.int.splice(A.int.indexOf(k.slice(4)),1);else if(k==='bud'){A.bud=200;A.budSet=false}else A[k]='';step=+b.dataset.s;qhtml();chips();score(true);var h=$('#qh');if(h)h.focus()});
// scoring
var cur=[];
function scoreOf(g){var s=0,mt=[];
if(A.int.length){var ov=A.int.filter(function(i){return g[5].indexOf(i)>-1}).length;s+=40*ov/A.int.length;ov&&A.int.forEach(function(i){if(g[5].indexOf(i)>-1)mt.push(i)})}else s+=20;
if(A.who){if(g[7].indexOf(A.who)>-1){s+=20;mt.push(A.who)}}else s+=10;
if(A.occ){if(g[8].indexOf(A.occ)>-1){s+=15;mt.push(A.occ)}}else s+=7;
if(A.sty){if(g[6]===A.sty){s+=15;mt.push(g[6])}}else s+=7;
s+=A.budSet&&A.bud<200?10*(1-Math.min(1,Math.abs(g[2]-A.bud*.7)/(A.bud+1))):5;
return{s:Math.round(Math.min(99,s)),mt:mt}}
var grid=$('#grid');
grid.innerHTML=G.map(function(g){return'<article class="gc" data-id="'+g[0]+'"><div class="im" role="img" aria-label="'+g[1]+'">'+img(g)+BOW+'<button class="ht" type="button" data-h="'+g[0]+'" aria-pressed="false" aria-label="Add '+g[1]+' to shortlist"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5-8-11a4.500 4.500 0 018-2.500A4.500 4.500 0 0120 10c0 6-8 11-8 11z"/></svg></button></div><div class="gb"><h3>'+g[1]+'</h3><span class="pr">GBP '+g[2]+'</span><div class="tg">'+g[5].map(function(t){return'<i data-t="'+t+'">'+t+'</i>'}).join('')+'<i data-t="'+g[6]+'">'+g[6]+'</i></div><div class="mt"><span class="b"><i></i></span><span class="mw"></span></div><p class="wy"></p></div></article>'}).join('');
function score(announce){var rects={};if(!reduce)[].forEach.call(grid.children,function(c){rects[c.dataset.id]=c.getBoundingClientRect()});
var sc=G.map(function(g){var r=scoreOf(g);return{g:g,s:r.s,mt:r.mt,ok:!(A.budSet&&g[2]>A.bud)}});
var so=$('#so').value;var vis=sc.filter(function(x){return x.ok});vis.sort(function(a,b){return so==='a'?a.g[2]-b.g[2]:so==='d'?b.g[2]-a.g[2]:b.s-a.s});
var ids={};vis.forEach(function(x,i){ids[x.g[0]]=i});
sc.forEach(function(x){var el=grid.querySelector('[data-id="'+x.g[0]+'"]');el.classList.toggle('hid',!x.ok);el.querySelector('.mt .b i').style.width=x.s+'%';el.querySelector('.mw').textContent=x.s+'% · '+(x.s>=80?'Great match':x.s>=55?'Good match':'Worth a look');
var why=x.mt.length?'Matches: '+x.mt.join(', ')+(A.budSet&&A.bud<200?', under GBP '+A.bud:''):(A.budSet&&A.bud<200?'Within your budget':'Answer more questions to refine');el.querySelector('.wy').textContent=why;
el.querySelectorAll('.tg i').forEach(function(t){t.classList.toggle('m',x.mt.indexOf(t.dataset.t)>-1)});el.style.order=x.ok?ids[x.g[0]]:99;el.querySelectorAll('button').forEach(function(b){b.tabIndex=x.ok?0:-1})});
if(!reduce)[].forEach.call(grid.children,function(c){var o=rects[c.dataset.id];if(!o||c.classList.contains('hid'))return;var n=c.getBoundingClientRect(),dx=o.left-n.left,dy=o.top-n.top;if(dx||dy)c.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:200,easing:'ease-out'})});
$('#rc').textContent='Showing '+vis.length+' gifts'+(so==='m'?', best matches first':'');cur=vis;
if(announce&&vis.length)say(vis.length+' gifts. Best match: '+vis[0].g[1]+', '+vis[0].s+' percent.');else if(announce)say('No gifts match this budget. Try raising it.');
try{localStorage.setItem('gw-quiz',JSON.stringify({a:A,s:step}))}catch(e){}}
$('#so').onchange=function(){score(false);say('Sorted by '+this.options[this.selectedIndex].text+'.')};
$('#nx').onclick=function(){if(step<4){step++;qhtml();var h=$('#qh');if(h)h.focus({preventScroll:true})}else{say('Showing your best matches.');$('#grid').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})}};
$('#bk').onclick=function(){if(step>0){step--;qhtml();$('#qh').focus({preventScroll:true})}};
$('#skp').onclick=function(){if(step<4){step++;qhtml();$('#qh').focus({preventScroll:true})}};
$('#rf').onclick=function(){var p=$('#qp'),o=p.classList.toggle('cl2');this.setAttribute('aria-expanded',!o)};
if(innerWidth<=960){}
// shortlist
function favUi(){$('#sc').textContent=fav.length;document.querySelectorAll('.ht').forEach(function(b){b.setAttribute('aria-pressed',fav.indexOf(b.dataset.h)>-1)});try{localStorage.setItem('gw-fav',JSON.stringify(fav))}catch(e){}}
grid.addEventListener('click',function(e){var b=e.target.closest('.ht');if(!b)return;var id=b.dataset.h,i=fav.indexOf(id),g=G.filter(function(x){return x[0]===id})[0];if(i>-1){fav.splice(i,1);say(g[1]+' removed from shortlist.')}else{fav.push(id);say(g[1]+' added to shortlist.')}favUi()});
var d=$('#dlg');$('#sl').onclick=function(){var t=0;$('#sl2').innerHTML=fav.length?fav.map(function(id){var g=G.filter(function(x){return x[0]===id})[0];t+=g[2];return'<div class="li"><span>'+g[1]+' · GBP '+g[2]+'</span><button data-r="'+id+'" aria-label="Remove '+g[1]+'">Remove</button></div>'}).join(''):'<p>Nothing shortlisted yet. Tap the heart on a gift.</p>';$('#st').textContent='GBP '+t;if(d.showModal)d.showModal();else d.setAttribute('open','')};
$('#sl2').addEventListener('click',function(e){var b=e.target.closest('[data-r]');if(b){fav.splice(fav.indexOf(b.dataset.r),1);favUi();$('#sl').click()}});$('#dc').onclick=function(){d.close()};d.addEventListener('close',function(){$('#sl').focus()});d.addEventListener('click',function(e){if(e.target===d)d.close()});
qhtml();chips();score(false);favUi();
})();
</script></body></html>
