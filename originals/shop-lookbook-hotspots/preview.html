<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#f7f2ea;color:#231d17;font:400 15px/1.5 Figtree,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #231d17;outline-offset:3px;box-shadow:0 0 0 6px #fff}

.wm{font:400 24px "DM Serif Display",serif}
.hd nav{display:flex;gap:18px}.hd nav a{color:#6c6153;text-decoration:none;font-weight:500}.hd nav a:hover{color:#231d17}
.bk{margin-left:auto;font:700 14px Figtree;color:#231d17;background:#fffdf8;border:1.5px solid #231d17;border-radius:99px;min-height:44px;padding:0 16px;cursor:pointer}
.w{max-width:1240px;margin:0 auto;padding:0 20px 44px}
.intro{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 0 16px}
.eb{font:700 12px Figtree;letter-spacing:.16em;text-transform:uppercase;color:#a0451f;margin:0 0 4px}
h1{font:400 clamp(36px,5.4vw,64px)/1 "DM Serif Display",serif;margin:0}
.lead{color:#6c6153;margin:6px 0 0;max-width:42ch}
.tg{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-weight:700;cursor:pointer}
.tg input{width:22px;height:22px;accent-color:#b8532d}
.main{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.main>*{min-width:0}
.sc{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/10;box-shadow:0 26px 60px rgba(60,40,20,.25)}
.sc>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hs{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;background:transparent;padding:0;cursor:pointer;border-radius:50%;z-index:3}
.hs i{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4),0 0 0 3px rgba(184,83,45,.9)}
.hs i:after{content:"+";position:absolute;inset:0;display:grid;place-items:center;font:700 14px Figtree;color:#b8532d;line-height:1}
.hs b{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px;border-radius:50%;border:2px solid #fff;animation:rg 2.4s ease-out infinite}
@keyframes rg{from{transform:scale(.6);opacity:.9}to{transform:scale(1.7);opacity:0}}
.hs:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px #231d17}
.hs.on i{background:#b8532d;box-shadow:0 2px 10px rgba(0,0,0,.4),0 0 0 3px #fff}.hs.on i:after{content:"\00d7";color:#fff}
.sc.nh .hs{display:none}
.pop{position:absolute;z-index:6;width:270px;background:#fffdf8;border:1px solid #e6dccb;border-radius:16px;box-shadow:0 18px 40px rgba(60,40,20,.28);padding:12px;animation:pp .18s ease-out}

.pop .th{border-radius:10px;overflow:hidden;aspect-ratio:16/10;margin-bottom:8px}.pop .th svg{width:100%;height:100%;display:block}
.pop h2{font:400 22px/1.1 "DM Serif Display",serif;margin:0}
.pop p{margin:2px 0 6px;color:#6c6153;font-size:13.5px}
.pr{font:700 18px Figtree;font-variant-numeric:tabular-nums}

.add{font:700 14px Figtree;color:#fff;background:#a0451f;border:0;border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}.add:hover{background:#85381a}
.x{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font:700 18px Figtree;cursor:pointer}
.side{background:#fffdf8;border:1px solid #e6dccb;border-radius:20px;padding:16px}

.li{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px;border:1px solid transparent}

dialog{border:0;border-radius:20px;padding:0;width:min(420px,calc(100% - 28px));box-shadow:0 30px 80px rgba(30,20,10,.4);background:#fffdf8;color:#231d17}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

var P=[{id:'sofa',n:'Mossgreen Sofa',p:1240,t:'Three-seater, stain-resistant weave, ships in 2 weeks.',x:38,y:68,k:'sofa'},{id:'lamp',n:'Brass Arc Lamp',p:289,t:'Dimmable, with a linen shade and a weighted base.',x:73,y:38,k:'lamp'},{id:'rug',n:'Terracotta Weave Rug',p:215,t:'Flat-woven wool, 160 by 230 cm, rolled for delivery.',x:50,y:88,k:'rug'},{id:'print',n:'Colour Field Print No. 3',p:64,t:'Giclee print on cotton paper, framed in oak.',x:17,y:25,k:'print'},{id:'vase',n:'Dried Grass Vase',p:42,t:'Hand-glazed stoneware with a bunch of dried grasses.',x:84,y:44,k:'vase'},{id:'plant',n:'Trailing Pothos in Clay Pot',p:38,t:'Easy-care trailing plant, about 40 cm tall.',x:93,y:77,k:'plant'}];
var money=function(v){return'GBP '+v.toLocaleString('en-GB')};
P.forEach(function(p){p.th=thumb(p.k)});
var cart={};try{cart=JSON.parse(localStorage.getItem('hh-cart')||'{}')||{}}catch(e){}
function save(){try{localStorage.setItem('hh-cart',JSON.stringify(cart))}catch(e){}}
function sub(){var s=0,n=0,ids=0;P.forEach(function(p){var q=cart[p.id]||0;s+=q*p.p;n+=q;if(q)ids++});var all=ids===P.length;var sv=all?Math.round(s*.1):0;return{s:s,n:n,sv:sv,all:all}}
function ui(){var c=sub();$('#bc').textContent=c.n;$('#bt').textContent=money(c.s-c.sv)}
var sc=$('#sc'),btns={},openId=null;
P.forEach(function(p){var b=document.createElement('button');b.className='hs';b.type='button';b.style.left=p.x+'%';b.style.top=p.y+'%';b.innerHTML='<b></b><i></i>';b.setAttribute('aria-label',p.n+', GBP '+p.p+'. Show details');b.setAttribute('aria-expanded','false');b.dataset.id=p.id;b.onclick=function(e){e.stopPropagation();toggle(p.id)};b.onkeydown=function(e){var i=P.indexOf(p),n=null;if(e.key==='ArrowRight'||e.key==='ArrowDown')n=P[(i+1)%P.length];else if(e.key==='ArrowLeft'||e.key==='ArrowUp')n=P[(i+P.length-1)%P.length];if(n){e.preventDefault();btns[n.id].focus()}};b.onmouseenter=function(){hl(p.id)};b.onmouseleave=function(){hl(null)};b.onfocus=function(){hl(p.id)};b.onblur=function(){hl(null)};sc.appendChild(b);btns[p.id]=b});
$('#list').innerHTML=P.map(function(p){return'<div class="li" data-id="'+p.id+'"><span class="t">'+p.th+'</span><span><b>'+p.n+'</b><small>'+money(p.p)+'</small></span><button data-a="'+p.id+'" aria-label="Add '+p.n+' to basket">Add</button></div>'}).join('');
function hl(id){document.querySelectorAll('.li').forEach(function(l){l.classList.toggle('hl',l.dataset.id===id)})}
$('#list').addEventListener('mouseover',function(e){var l=e.target.closest('.li');hl(l?l.dataset.id:null)});$('#list').addEventListener('mouseleave',function(){hl(null)});
$('#list').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(b)add(b.dataset.a,1)});
$('#all').onclick=function(){P.forEach(function(p){cart[p.id]=Math.max(1,cart[p.id]||0)});save();ui();upd();$('#live').textContent='Whole look added. 10 percent bundle saving applied. Basket total '+$('#bt').textContent}
function upd(){var s=0;P.forEach(function(p){s+=p.p});$('#lt').textContent=money(Math.round(s*.9));$('#sv').textContent='Includes a 10% bundle saving of '+money(Math.round(s*.1))}
function add(id,q){var p=P.filter(function(x){return x.id===id})[0];cart[id]=Math.min(9,(cart[id]||0)+q);save();ui();$('#live').textContent=p.n+' added, basket total '+$('#bt').textContent}
var pop=null;
function toggle(id){if(openId===id){close(true);return}close(false);openId=id;var p=P.filter(function(x){return x.id===id})[0],b=btns[id],q=1;b.classList.add('on');b.setAttribute('aria-expanded','true');
pop=document.createElement('div');pop.className='pop';pop.setAttribute('role','dialog');pop.setAttribute('aria-labelledby','pt');
pop.innerHTML='<button class="x" aria-label="Close">×</button><div class="th">'+p.th+'</div><h2 id="pt">'+p.n+'</h2><p>'+p.t+'</p><div class="pr">'+money(p.p)+'</div><div class="row"><div class="qs"><button aria-label="Fewer">&minus;</button><span aria-live="polite">1</span><button aria-label="More">+</button></div><button class="add">Add to basket</button></div>';
sc.appendChild(pop);
var qs=pop.querySelectorAll('.qs button'),qn=pop.querySelector('.qs span');qs[0].onclick=function(){q=Math.max(1,q-1);qn.textContent=q};qs[1].onclick=function(){q=Math.min(5,q+1);qn.textContent=q};
pop.querySelector('.add').onclick=function(){add(id,q)};pop.querySelector('.x').onclick=function(){close(true)};
var r=sc.getBoundingClientRect(),w=270,left=p.x/100*r.width+28,top=p.y/100*r.height-60;if(left+w>r.width-8)left=p.x/100*r.width-w-28;if(left<8)left=8;top=Math.max(8,Math.min(top,r.height-pop.offsetHeight-8));pop.style.left=left+'px';pop.style.top=top+'px';
pop.querySelector('.add').focus({preventScroll:true})}
function close(ret){if(!openId)return;var id=openId;openId=null;if(pop){pop.remove();pop=null}btns[id].classList.remove('on');btns[id].setAttribute('aria-expanded','false');if(ret)btns[id].focus()}
document.addEventListener('keydown',function(e){if(e.key==='Escape')close(true);if((e.key==='h'||e.key==='H')&&!e.target.closest('input,textarea'))setH(!$('#sh').checked)});

function setH(v){$('#sh').checked=v;sc.classList.toggle('nh',!v);if(!v)close(false);$('#live').textContent=v?'Hotspots shown.':'Hotspots hidden.'}
$('#sh').onchange=function(){setH(this.checked)};
// basket dialog
function drawBasket(){var c=sub(),h='';P.forEach(function(p){var q=cart[p.id]||0;if(q)h+='<div class="bi"><span>'+p.n+' &times; '+q+'</span><span>'+money(p.p*q)+' <button data-r="'+p.id+'" aria-label="Remove '+p.n+'">Remove</button></span></div>'});$('#bl').innerHTML=h||'<p>Your basket is empty.</p>';$('#bs').textContent=money(c.s-c.sv);$('#bsv').textContent=c.sv?'Includes a bundle saving of '+money(c.sv):''}
var d=$('#dlg');$('#bk').onclick=function(){drawBasket();if(d.showModal)d.showModal();else d.setAttribute('open','')};$('#cl').onclick=function(){d.close()};d.addEventListener('close',function(){$('#bk').focus()});
$('#bl').addEventListener('click',function(e){var b=e.target.closest('[data-r]');if(b){delete cart[b.dataset.r];save();ui();drawBasket()}});

})();
