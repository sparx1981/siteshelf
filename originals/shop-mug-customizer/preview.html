<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mug Customizer — E-commerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=DM+Serif+Display&family=Figtree:wght@400;500;700&family=Permanent+Marker&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>

body{margin:0;background:#f3e6d3;color:#261e17;font:400 15px/1.5 Figtree,system-ui,sans-serif;overflow-x:hidden}

.wm{font:400 24px "DM Serif Display",serif}

.eb{font:700 12px Figtree;letter-spacing:.16em;text-transform:uppercase;color:#a0451f;margin:0 0 4px}

.stage{position:sticky;top:12px;border-radius:24px;overflow:hidden;aspect-ratio:4/3;box-shadow:0 26px 60px rgba(70,40,10,.3);touch-action:pan-y;cursor:grab;background:#e8d3b6}
.stage:active{cursor:grabbing}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rot{display:flex;align-items:center;gap:12px;margin-top:12px}.rot label{font-weight:700}
.rot input{flex:1;accent-color:#2b5a8a;height:30px}
.rot button{font:700 13px Figtree;background:#fffbf3;border:1.5px solid #261e17;border-radius:10px;min-height:44px;padding:0 12px;cursor:pointer;color:#261e17}
.opt{background:#fffbf3;border:1px solid #e5d8c1;border-radius:20px;padding:6px 18px 16px}
fieldset{border:0;border-top:1px solid #eadfca;margin:0;padding:12px 0 6px}fieldset:first-of-type{border-top:0}
legend{font:700 12px Figtree;letter-spacing:.12em;text-transform:uppercase;color:#6a5d4f;padding:0;float:left;width:100%;margin-bottom:8px}

.tx{display:flex;gap:10px;align-items:center;clear:both}

.cnt{font-size:13px;color:#6a5d4f;white-space:nowrap}
.qs{display:inline-flex;align-items:center;border:1.5px solid #261e17;border-radius:12px;clear:both}.qs button{width:46px;height:46px;border:0;background:transparent;font:700 20px Figtree;cursor:pointer;color:#261e17}.qs span{min-width:34px;text-align:center;font-weight:700}

.ln{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:3px 0;color:#4a3f33}.ln.d{color:#2f6b3f}

.sh{color:#6a5d4f;font-size:13px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btns .p{grid-column:1/-1;font:700 16px Figtree;color:#fff;background:#2b5a8a;border:0;border-radius:12px;min-height:50px;cursor:pointer}.btns .p:hover{background:#214b75}

.stm path{stroke-dasharray:60;animation:st 6s ease-in-out infinite}.stm path:nth-child(2){animation-delay:1.6s}.stm path:nth-child(3){animation-delay:3.2s}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mb{display:none}
@media(max-width:900px){.w{grid-template-columns:1fr}.stage{position:relative;top:0}.mb{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fffbf3;border-top:1px solid #e5d8c1;padding:8px 14px;align-items:center;justify-content:space-between;font-weight:700}.mb b{font:400 26px "DM Serif Display",serif}body{padding-bottom:64px}}
@media(prefers-reduced-motion:reduce){.stm{display:none}}
</style></head><body>
<header class="hd"><span class="wm">Wheel &amp; Kettle Co.</span><button class="bk" id="bk" type="button">Basket (<span id="bc">0</span>)</button></header>

<fieldset><legend>Quantity</legend><div class="qs"><button type="button" id="qm" aria-label="Fewer mugs">&minus;</button><span id="qn" aria-live="polite">1</span><button type="button" id="qp" aria-label="More mugs">+</button></div></fieldset>
</div>
<div class="pc"><div id="lines"></div><div class="tt"><div><span class="sh">Total</span><br><b id="tot">GBP 15.50</b></div><span class="sh">Ships in 4 to 6 days</span></div>

<div class="sr" id="live" aria-live="polite"></div>
</main>
<div class="mb"><span>Total</span><b id="mt">GBP 15.50</b></div>
<script>/*SCENES-START*/

s+='<g transform="translate('+cx+' '+(CY+H/2)+') scale('+sc+') translate('+(-cx)+' '+(-(CY+H/2))+')">';
s+='<ellipse cx="'+cx+'" cy="'+(bot+8)+'" rx="'+(RX+30)+'" ry="18" fill="#000" opacity=".3" filter="url(#bl)"/><ellipse cx="'+cx+'" cy="'+(bot+16)+'" rx="'+(RX-20)+'" ry="8" fill="'+body+'" opacity=".18" filter="url(#bl)"/>';
s+='<path d="M'+(cx+RX-6)+' '+(top+34)+' C'+(cx+RX+96)+' '+(top+20)+' '+(cx+RX+104)+' '+(bot-48)+' '+(cx+RX-10)+' '+(bot-52)+'" fill="none" stroke="'+shade(hd,-.3)+'" stroke-width="34" stroke-linecap="round"/><path d="M'+(cx+RX-6)+' '+(top+34)+' C'+(cx+RX+96)+' '+(top+20)+' '+(cx+RX+104)+' '+(bot-48)+' '+(cx+RX-10)+' '+(bot-52)+'" fill="none" stroke="'+hd+'" stroke-width="26" stroke-linecap="round"/>'+(gl?'<path d="M'+(cx+RX+6)+' '+(top+30)+' C'+(cx+RX+88)+' '+(top+20)+' '+(cx+RX+96)+' '+(bot-52)+' '+(cx+RX)+' '+(bot-58)+'" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>':'');
s+='<g clip-path="url(#bc)"><rect x="'+(cx-RX)+'" y="'+(top-RY)+'" width="'+(2*RX)+'" height="'+(H+2*RY)+'" fill="'+body+'"/>';
if(D.pat!=='None')s+='<rect x="'+(cx-RX)+'" y="'+(top-RY)+'" width="'+(2*RX)+'" height="'+(H+2*RY)+'" fill="url(#pt)" transform="translate('+(-D.rot*2.2).toFixed(1)+' 0)" opacity=".95"/>';
if(D.fin==='Matte')s+='<rect x="'+(cx-RX)+'" y="'+(top-RY)+'" width="'+(2*RX)+'" height="'+(H+2*RY)+'" filter="url(#sp)" opacity=".5" style="mix-blend-mode:multiply"/>';
var t=D.tx.trim();if(t&&cs>.2){var fs=t.length>14?30:t.length>9?38:46;s+='<g mask="url(#tm)" opacity="'+Math.min(1,(cs-.2)/.5)+'"><g transform="translate('+tcx.toFixed(1)+' '+CY+') scale('+cs.toFixed(3)+' 1)"><path id="tp" d="M-110 8 Q0 '+(14)+' 110 8" fill="none"/><text text-anchor="middle" font-family="'+D.font+',cursive" font-weight="'+(D.font==='Unbounded'?600:D.font==='Caveat'?700:400)+'" font-size="'+fs+'" fill="'+tc+'"><textPath href="#tp" startOffset="50%">'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textPath></text></g></g>'}
s+='<rect x="'+(cx-RX)+'" y="'+(top-RY)+'" width="'+(2*RX)+'" height="'+(H+2*RY)+'" fill="url(#bs)"/>';if(gl)s+='<rect x="'+(cx+RX*.42)+'" y="'+top+'" width="8" height="'+H+'" fill="#fff" opacity=".35" rx="4"/>';
s+='</g>';
s+='<ellipse cx="'+cx+'" cy="'+top+'" rx="'+RX+'" ry="'+RY+'" fill="url(#rm)"/><ellipse cx="'+cx+'" cy="'+(top+1)+'" rx="'+(RX-9)+'" ry="'+(RY-5)+'" fill="url(#cf)"/><ellipse cx="'+(cx-30)+'" cy="'+(top-3)+'" rx="36" ry="5" fill="#fff" opacity="'+(gl?.22:.1)+'"/>';
s+='</g>';

$('#mug').innerHTML=s;
$('#stage').setAttribute('aria-label',sz[0].replace(' oz',' ounce')+' '+BODY[D.body][0].toLowerCase()+' mug'+(D.pat!=='None'?' with '+PC[D.pc][0].toLowerCase()+' '+D.pat.toLowerCase():'')+(t?', printed '+t+' in '+D.font:'')+', '+D.fin.toLowerCase()+' finish')}
function price(){var sz=SIZE[D.size],l=[],base=sz[1],pat=D.pat!=='None'?1.5:0,pr=D.tx.trim()?2.5:0,mt=D.fin==='Matte'?1:0,each=base+pat+pr+mt,sub=each*D.qty,dp=D.qty>=6?.15:D.qty>=3?.1:0,dis=sub*dp,tot=sub-dis;
var f=function(v){return'GBP '+v.toFixed(2)};var h='<div class="ln"><span>'+sz[0]+' mug</span><span>'+f(base)+'</span></div>';if(pat)h+='<div class="ln"><span>Pattern ('+D.pat+')</span><span>+'+f(pat)+'</span></div>';if(pr)h+='<div class="ln"><span>Printed text</span><span>+'+f(pr)+'</span></div>';if(mt)h+='<div class="ln"><span>Matte finish</span><span>+'+f(mt)+'</span></div>';if(D.qty>1)h+='<div class="ln"><span>Quantity &times; '+D.qty+'</span><span>'+f(sub)+'</span></div>';if(dis)h+='<div class="ln d"><span>Quantity discount ('+(dp*100)+'%)</span><span>-'+f(dis)+'</span></div>';$('#lines').innerHTML=h;
var el=$('#tot'),from=parseFloat(el.dataset.v||tot);el.dataset.v=tot;if(reduce||from===tot)el.textContent=f(tot);else{var t0=performance.now();(function s(t){var p=Math.min(1,(t-t0)/300);el.textContent=f(from+(tot-from)*p);$('#mt').textContent=el.textContent;if(p<1)requestAnimationFrame(s)})(t0)}
$('#mt').textContent=f(tot);clearTimeout(price.t);price.t=setTimeout(function(){$('#live').textContent='Total '+f(tot)},700);return tot}
function names(){$('#n-body').textContent=BODY[D.body][0];$('#n-pc').textContent=PC[D.pc][0];$('#n-tc').textContent=PC[D.tc][0];$('#fp').style.opacity=D.pat==='None'?.45:1;$('#cn').textContent=D.tx.length+'/20';$('#qn').textContent=D.qty;$('#ro').value=D.rot}
function all(){names();draw();price()}
['size','body','pc','tc'].forEach(function(n){document.querySelectorAll('input[name='+n+']').forEach(function(i){i.onchange=function(){D[n]=+i.value;all()}})});
['handle','pat','fin'].forEach(function(n){document.querySelectorAll('input[name='+n+']').forEach(function(i){i.onchange=function(){D[n]=i.value;all()}})});
$('#tx').addEventListener('input',function(){D.tx=this.value.slice(0,20);all()});$('#fo').onchange=function(){D.font=this.value;all()};
$('#qm').onclick=function(){D.qty=Math.max(1,D.qty-1);all()};$('#qp').onclick=function(){D.qty=Math.min(12,D.qty+1);all()};
$('#ro').addEventListener('input',function(){D.rot=+this.value;draw()});$('#rr').onclick=function(){D.rot=0;$('#ro').value=0;draw()};
var st=$('#stage'),dr=null;st.addEventListener('pointerdown',function(e){dr={x:e.clientX,r:D.rot};st.setPointerCapture(e.pointerId)});st.addEventListener('pointermove',function(e){if(!dr)return;D.rot=Math.max(-120,Math.min(120,dr.r+(e.clientX-dr.x)/2));$('#ro').value=D.rot;draw()});st.addEventListener('pointerup',function(){dr=null});st.addEventListener('pointercancel',function(){dr=null});
var cart=0;$('#add').onclick=function(){cart+=D.qty;$('#bc').textContent=cart;var m=D.qty+' x '+SIZE[D.size][0].split(' ')[0]+', '+BODY[D.body][0]+(D.pat!=='None'?', '+D.pat:'')+' added.';$('#msg').textContent=m;$('#live').textContent=m};
$('#sv2').onclick=function(){try{localStorage.setItem('wk-design',JSON.stringify(D));$('#msg').textContent='Design saved on this device.'}catch(e){$('#msg').textContent='Could not save here.'}};
function code(){var s=JSON.stringify([D.size,D.body,D.handle,D.pat,D.pc,D.fin,D.tx,D.font,D.tc]),h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return'WK-'+h.toString(16).toUpperCase().slice(-4)+'-'+(D.qty<10?'0':'')+D.qty+'C'}
$('#cc').onclick=function(){var c=code();try{navigator.clipboard.writeText(c).then(function(){$('#msg').textContent='Design code '+c+' copied.'},function(){$('#msg').textContent='Design code: '+c})}catch(e){$('#msg').textContent='Design code: '+c}};
document.fonts&&document.fonts.ready&&document.fonts.ready.then(draw);

})();
