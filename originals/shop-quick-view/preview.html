.pb{padding:10px 14px 14px}.pb b{display:block;font-weight:700}

function build(){$('#sw').innerHTML=cur.cols.map(function(c,i){return'<label><input type="radio" name="col" value="'+c[0]+'"'+(c[0]===col?' checked':'')+' aria-label="'+c[0]+'"><span style="background:'+c[1]+'"></span></label>'}).join('');
$('#sz').innerHTML=cur.sizes.map(function(s){var n=cur.st[col][s];return'<label><input type="radio" name="sz" value="'+s+'"'+(n===0?' disabled aria-describedby="nsd"':'')+(s===sz?' checked':'')+'><span>'+s+'</span></label>'}).join('')+'<span class="sr" id="nsd">Out of stock in '+col+'</span>';
$('#cn').textContent=col;gal();stock();
document.querySelectorAll('input[name=col]').forEach(function(i){i.onchange=function(){col=i.value;if(sz&&cur.st[col][sz]===0)sz=null;qty=1;build();say('Colour '+col)}});
document.querySelectorAll('input[name=sz]').forEach(function(i){i.onchange=function(){sz=i.value;qty=1;stock();say('Size '+sz)}})}
function gal(){$('#zz').innerHTML=img(cur,col,VIEWS[view]);$('#zz').style.transform='';$('#th').innerHTML=VIEWS.map(function(v,i){return'<button type="button" data-v="'+i+'" aria-label="'+v+' view"'+(i===view?' aria-current="true"':'')+'>'+img(cur,col,v)+'</button>'}).join('');$('#mn').setAttribute('aria-label','Product images, '+VIEWS[view]+' view. Use left and right arrow keys to change view.')}
function stock(){var s=$('#sk'),n=sz?cur.st[col][sz]:null,ad=$('#add'),ht=$('#ht');if(!sz){s.textContent='';s.className='stk';ad.setAttribute('aria-disabled','true');ht.textContent='Choose a size'}else{ad.setAttribute('aria-disabled','false');ht.textContent='';if(n<=3){s.textContent='Only '+n+' left in '+col+' / '+sz;s.className='stk'}else{s.textContent='In stock in '+col+' / '+sz;s.className='stk ok'}}$('#qn').textContent=qty}
$('#th').addEventListener('click',function(e){var b=e.target.closest('button');if(b){view=+b.dataset.v;gal();b.focus&&document.querySelector('#th [aria-current]').focus()}});
$('#mn').addEventListener('keydown',function(e){if(e.key==='ArrowRight'){e.preventDefault();view=(view+1)%4;gal()}else if(e.key==='ArrowLeft'){e.preventDefault();view=(view+3)%4;gal()}});
$('#mn').addEventListener('pointermove',function(e){if(reduce)return;var r=this.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100,z=$('#zz');z.style.transformOrigin=x+'% '+y+'%';z.style.transform='scale(1.6)'});
$('#mn').addEventListener('pointerleave',function(){$('#zz').style.transform=''});
$('#qm').onclick=function(){qty=Math.max(1,qty-1);$('#qn').textContent=qty};$('#qp').onclick=function(){var mx=sz?Math.min(9,cur.st[col][sz]):9;qty=Math.min(mx,qty+1);$('#qn').textContent=qty};
$('#add').onclick=function(){if(this.getAttribute('aria-disabled')==='true'){$('#ht').textContent='Please choose a size first.';say('Please choose a size first.');var f=document.querySelector('input[name=sz]:not(:disabled)');if(f)f.focus();return}
bag+=qty;try{localStorage.setItem('pp-bag',bag)}catch(e){}$('#bc').textContent=bag;$('#ht').textContent='Added to bag';say(cur.n+', '+col+', '+sz+' added. Bag has '+bag+' items.');setTimeout(function(){close()},600)};
function close(){if(d.close)d.close();else d.removeAttribute('open');after()}
function after(){if(opener&&document.body.contains(opener))opener.focus()}
$('#cx').onclick=close;d.addEventListener('click',function(e){if(e.target===d)close()});d.addEventListener('cancel',function(){setTimeout(after,0)});
grid.addEventListener('click',function(e){var b=e.target.closest('.qv');if(b)open(b.dataset.q,b)});
// radio arrows
function radioKeys(root){root.addEventListener('keydown',function(e){var ks=['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'];if(ks.indexOf(e.key)<0)return;var ins=[].slice.call(root.querySelectorAll('input:not(:disabled)')),i=ins.indexOf(document.activeElement);if(i<0)return;e.preventDefault();var n=ins[(i+(e.key==='ArrowRight'||e.key==='ArrowDown'?1:ins.length-1))%ins.length];n.checked=true;n.focus();n.dispatchEvent(new Event('change'))})}
radioKeys($('#sw'));radioKeys($('#sz'));
})();
</script></body></html>
