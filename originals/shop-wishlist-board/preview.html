<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist Board — E-commerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#f6f1e8;color:#1f1b16;font:400 15px/1.5 Figtree,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #1f1b16;outline-offset:3px;box-shadow:0 0 0 6px #fff}
.hd{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.wm{font:600 22px Fraunces,serif}
.bd{margin-left:auto;display:inline-flex;gap:8px;align-items:center;font:700 14px Figtree;background:#fffdf8;border:1.5px solid #1f1b16;border-radius:99px;min-height:44px;padding:0 16px}
.bd b{background:#1f6b52;color:#fff;border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums}
.ban{position:relative;max-width:1320px;margin:0 auto;border-radius:22px;overflow:hidden;min-height:170px;display:flex;align-items:flex-end}
.ban .art{position:absolute;inset:0}.ban .art svg{width:100%;height:100%;display:block}
.ban:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(246,241,232,.92),rgba(246,241,232,.35) 60%,transparent)}
.bi{position:relative;z-index:2;padding:18px 26px}
.eb{font:700 12px Figtree;letter-spacing:.16em;text-transform:uppercase;color:#1f6b52;margin:0 0 4px}
h1{font:600 clamp(30px,5vw,52px)/1 Fraunces,serif;margin:0}
.sm{margin:6px 0 0;color:#4a4136;font-weight:500}
.w{max-width:1320px;margin:0 auto;padding:16px 20px 46px}
.board{display:flex;gap:14px;overflow-x:auto;padding:14px;background:#efe7d8;background-image:radial-gradient(#d8ccb4 1px,transparent 1px);background-size:18px 18px;border-radius:20px;align-items:flex-start;min-height:420px}
.col{flex:none;width:300px;background:#fffdf8;border:1.5px solid #e5dccb;border-radius:18px;padding:12px;transition:border-color .15s,background .15s}
.col.over{border-color:#1f6b52;background:#f2faf5}
.ch{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ch input.nm{flex:1;min-width:0;font:600 20px Fraunces,serif;border:1.5px solid transparent;background:transparent;border-radius:8px;padding:2px 6px;color:#1f1b16}
.ch input.nm:hover{border-color:#e5dccb}.ch input.nm:focus{border-color:#1f1b16;background:#fff}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:#1f1b16}.ib:hover{background:#f1e9d8}.ib svg{width:20px;height:20px}
.cs{font-size:13px;color:#675d50;margin:0 6px 10px;font-variant-numeric:tabular-nums}
.cards{display:grid;gap:8px;min-height:60px}
.it{position:relative;display:grid;grid-template-columns:72px 1fr;gap:10px;background:#fff;border:1px solid #e5dccb;border-radius:14px;padding:8px;touch-action:pan-y;cursor:grab}
.it.dg{opacity:.3}
.it .th{width:72px;height:72px;border-radius:10px;overflow:hidden}.it .th svg{width:100%;height:100%;display:block}
.it b{display:block;font-weight:700;font-size:14px;line-height:1.2}
.pr{font-variant-numeric:tabular-nums;font-weight:700}.pr s{color:#675d50;font-weight:500;margin-left:6px}
.drop{display:inline-flex;gap:4px;align-items:center;margin-top:2px;font:700 12px Figtree;color:#a8281c;background:#fdeceb;border-radius:6px;padding:1px 6px}
.ac{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ac select{flex:1 1 100%;min-width:0;font:500 13px Figtree;border:1.5px solid #cdbf9f;border-radius:8px;min-height:44px;padding:0 6px;background:#fff;color:#1f1b16}
.ac button{font:700 13px Figtree;border-radius:8px;min-height:44px;padding:0 10px;cursor:pointer}
.bg{color:#fff;background:#1f6b52;border:0}.bg:hover{background:#17533f}
.rm{color:#1f1b16;background:#fff;border:1.5px solid #cdbf9f}.rm:hover{border-color:#1f1b16}
.emp{color:#675d50;font-size:14px;padding:14px 8px;text-align:center;border:2px dashed #d8ccb4;border-radius:12px}
.nc{flex:none;width:300px;align-self:stretch;min-height:120px;border:2px dashed #b9a98a;border-radius:18px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;padding:14px;background:rgba(255,253,248,.5)}
.nc input{width:100%;font:500 15px Figtree;border:1.5px solid #1f1b16;border-radius:10px;min-height:46px;padding:0 10px;background:#fff}
.nc button,.pp .nl button{font:700 14px Figtree;color:#fff;background:#1f1b16;border:0;border-radius:10px;min-height:46px;padding:0 16px;cursor:pointer;width:100%}
.ghost{position:fixed;z-index:60;pointer-events:none;width:280px;box-shadow:0 18px 40px rgba(40,25,10,.35);transform:rotate(2deg);opacity:.95}
h2{font:600 26px Fraunces,serif;margin:28px 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pc{background:#fffdf8;border:1px solid #e5dccb;border-radius:16px;overflow:hidden;position:relative}
.pc .im{aspect-ratio:4/5}.pc .im svg{width:100%;height:100%;display:block}
.pc .bo{padding:10px 12px 12px}.pc b{display:block;font-weight:700}
.hr{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,253,248,.95);cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}.hr svg{width:22px;height:22px}
.hr[aria-pressed=true] svg{fill:#c63d2f;stroke:#c63d2f}
.pp{position:fixed;z-index:70;width:260px;background:#fffdf8;border:1.5px solid #1f1b16;border-radius:14px;box-shadow:0 18px 40px rgba(40,25,10,.3);padding:10px}
.pp h3{font:700 13px Figtree;margin:0 0 6px;letter-spacing:.06em;text-transform:uppercase;color:#675d50}
.pp label{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;cursor:pointer}.pp input[type=checkbox]{width:22px;height:22px;accent-color:#1f6b52}
.pp .nl{display:flex;gap:6px;margin-top:6px}.pp .nl input{flex:1;min-width:0;border:1.5px solid #1f1b16;border-radius:10px;min-height:46px;padding:0 10px;font:500 14px Figtree}.pp .nl button{width:auto}
.pp .lk{display:flex;gap:6px}.pp .lk input{flex:1;min-width:0;border:1.5px solid #cdbf9f;border-radius:10px;min-height:46px;padding:0 8px;font:500 13px Figtree;background:#f6f1e8}
.mn{position:fixed;z-index:70;background:#fffdf8;border:1.5px solid #1f1b16;border-radius:12px;padding:6px;box-shadow:0 14px 30px rgba(40,25,10,.3);min-width:170px}
.mn button{display:block;width:100%;text-align:left;font:600 14px Figtree;background:none;border:0;border-radius:8px;min-height:44px;padding:0 10px;cursor:pointer}.mn button:hover{background:#f1e9d8}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){.board{flex-direction:column;overflow:visible;padding:10px}.col,.nc{width:100%}.grid{grid-template-columns:1fr 1fr}.ban{min-height:150px}.bi{padding:14px}}
@media(prefers-reduced-motion:reduce){.col{transition:none}}
</style></head><body>
<header class="hd"><span class="wm">Fieldnote Goods</span><span class="bd">Wishlists <b id="tb">0</b></span></header>
<main class="w">
<section class="ban"><div class="art" id="art" aria-hidden="true"></div><div class="bi"><p class="eb">Your wishlists</p><h1>Things worth waiting for</h1><p class="sm" id="sm"></p></div></section>
<div class="board" id="board" role="group" aria-label="Wishlist board"></div>
<h2>Save more from the shop</h2><div class="grid" id="grid"></div>
<div class="sr" id="live" aria-live="polite"></div>
</main>
<script>/*SCENES-START*/

function move(id,from,to,quiet){if(from===to)return;var a=listOf(from),b=listOf(to),k=a.items.filter(function(i){return i.id===id})[0];a.items=a.items.filter(function(i){return i!==k});b.items.push(k);render();if(!quiet)say(cat(id)[2]+' moved to '+b.n+'.')}
var board=$('#board');
board.addEventListener('change',function(e){var t=e.target;if(t.dataset.mv){move(t.dataset.mv,t.dataset.from,t.value);var s=board.querySelector('select[data-mv="'+t.dataset.mv+'"]');if(s)s.focus()}else if(t.dataset.nm){var l=listOf(t.dataset.nm);l.n=(t.value.trim()||l.n).slice(0,24);render();say('List renamed to '+l.n+'.')}});
board.addEventListener('keydown',function(e){if(e.target.dataset&&e.target.dataset.nm){if(e.key==='Enter'){e.target.blur()}else if(e.key==='Escape'){e.target.value=listOf(e.target.dataset.nm).n;e.target.blur()}}if(e.target.id==='nlin'&&e.key==='Enter')newList()});
function newList(){var v=$('#nlin').value.trim();if(!v)return;var id='l'+Date.now().toString(36);S.lists.push({id:id,n:v.slice(0,24),items:[]});render();say('List '+v+' created.');var i=board.querySelector('input[data-nm="'+id+'"]');if(i)i.focus()}
board.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
if(t.id==='nlb')newList();
else if(t.dataset.rm){var l=listOf(t.dataset.from);l.items=l.items.filter(function(i){return i.id!==t.dataset.rm});render();say(cat(t.dataset.rm)[2]+' removed from '+l.n+'.')}
else if(t.dataset.bag){say(cat(t.dataset.bag)[2]+' added to bag.')}
else if(t.dataset.share)share(t.dataset.share,t);
else if(t.dataset.menu)menu(t.dataset.menu,t)});
// popovers
var pop=null,popOwner=null;
function closePop(ret){if(pop){pop.remove();pop=null}if(ret&&popOwner&&document.body.contains(popOwner))popOwner.focus();popOwner=null}
function place(el,anchor){var r=anchor.getBoundingClientRect();el.style.left=Math.max(8,Math.min(innerWidth-el.offsetWidth-8,r.left))+'px';var t=r.bottom+6;if(t+el.offsetHeight>innerHeight-8)t=Math.max(8,r.top-el.offsetHeight-6);el.style.top=t+'px'}
function share(id,anchor){closePop();var l=listOf(id),code=(l.id+l.items.map(function(i){return i.id}).join('')).split('').reduce(function(a,c){return(a*31+c.charCodeAt(0))>>>0},7).toString(36).slice(0,5),url='https://example.com/wishlist/'+code;pop=document.createElement('div');pop.className='pp';pop.setAttribute('role','dialog');pop.setAttribute('aria-label','Share '+l.n);pop.innerHTML='<h3>Share "'+l.n+'"</h3><p style="margin:0 0 8px;font-size:13.5px">Anyone with this link can view this list.</p><div class="lk"><input readonly value="'+url+'" aria-label="Share link"><button class="bg" style="border:0;border-radius:10px;min-height:46px;padding:0 12px;font:700 13px Figtree;cursor:pointer;color:#fff;background:#1f6b52">Copy</button></div>';document.body.appendChild(pop);popOwner=anchor;place(pop,anchor);pop.querySelector('button').onclick=function(){try{navigator.clipboard.writeText(url).then(function(){say('Link copied.')},function(){say('Copy not available.')})}catch(e){say('Copy not available.')}};pop.querySelector('input').focus();pop.querySelector('input').select()}
function menu(id,anchor){closePop();var l=listOf(id);pop=document.createElement('div');pop.className='mn';pop.setAttribute('role','menu');pop.innerHTML='<button role="menuitem" data-a="rename">Rename</button><button role="menuitem" data-a="delete">Delete list</button>';document.body.appendChild(pop);popOwner=anchor;place(pop,anchor);var bs=pop.querySelectorAll('button');bs[0].focus();
pop.addEventListener('keydown',function(e){var i=[].indexOf.call(bs,document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();bs[(i+1)%bs.length].focus()}else if(e.key==='ArrowUp'){e.preventDefault();bs[(i+bs.length-1)%bs.length].focus()}});
pop.onclick=function(e){var a=e.target.dataset.a;if(a==='rename'){closePop();var i=board.querySelector('input[data-nm="'+id+'"]');i.focus();i.select()}else if(a==='delete'){if(S.lists.length<2){say('You need at least one list.');closePop(true);return}pop.innerHTML='<p style="margin:4px 8px 6px;font-size:13.5px;max-width:200px">Delete "'+l.n+'"? Its items move to another list.</p><button data-a="yes" style="color:#a8281c">Yes, delete</button><button data-a="no">Cancel</button>';pop.querySelector('button').focus();pop.onclick=function(e2){if(e2.target.dataset.a==='yes'){var rest=S.lists.filter(function(x){return x.id!==id}),dest=rest[0];dest.items=dest.items.concat(l.items);S.lists=rest;closePop();render();say(l.n+' deleted. Items moved to '+dest.n+'.')}else if(e2.target.dataset.a==='no')closePop(true)}}}}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePop(true)});
document.addEventListener('pointerdown',function(e){if(pop&&!e.composedPath().some(function(n){return n===pop||n===popOwner}))closePop(false)});
// grid
function grid(){$('#grid').innerHTML=CAT.map(function(c){var inN=0;S.lists.forEach(function(l){if(l.items.some(function(i){return i.id===c[0]}))inN++});return'<div class="pc"><div class="im" role="img" aria-label="'+c[2]+'">'+thumb(c[0])+'</div><button class="hr" data-h="'+c[0]+'" aria-pressed="'+(inN>0)+'" aria-haspopup="dialog" aria-label="Save '+c[2]+' to a list'+(inN?' (saved in '+inN+')':'')+'">'+ICON.heart+'</button><div class="bo"><b>'+c[2]+'</b><span class="pr">'+money(NOW[c[0]])+'</span></div></div>'}).join('')}
$('#grid').addEventListener('click',function(e){var b=e.target.closest('[data-h]');if(!b)return;closePop();var id=b.dataset.h,c=cat(id);pop=document.createElement('div');pop.className='pp';pop.setAttribute('role','dialog');pop.setAttribute('aria-label','Save '+c[2]);
function draw(){pop.innerHTML='<h3>Save to...</h3>'+S.lists.map(function(l,i){var on=l.items.some(function(x){return x.id===id});return'<label><input type="checkbox" data-sl="'+l.id+'"'+(on?' checked':'')+'>'+l.n+'</label>'}).join('')+'<div class="nl"><label class="sr" for="pnl">New list</label><input id="pnl" placeholder="New list" maxlength="24"><button>Add</button></div>'}
draw();document.body.appendChild(pop);popOwner=b;place(pop,b);pop.querySelector('input').focus();
pop.addEventListener('change',function(e){var l=listOf(e.target.dataset.sl);if(!l)return;if(e.target.checked){l.items.push({id:id,sp:NOW[id]});say(c[2]+' saved to '+l.n+'.')}else{l.items=l.items.filter(function(x){return x.id!==id});say(c[2]+' removed from '+l.n+'.')}var f=e.target.dataset.sl;render();draw();var n=pop.querySelector('[data-sl="'+f+'"]');if(n)n.focus()});
pop.addEventListener('click',function(e){if(e.target.tagName==='BUTTON'){var v=pop.querySelector('#pnl').value.trim();if(v){S.lists.push({id:'l'+Date.now().toString(36),n:v.slice(0,24),items:[{id:id,sp:NOW[id]}]});render();draw();say('List '+v+' created and item saved.')}}})});
// drag
var drag=null;
board.addEventListener('pointerdown',function(e){var it=e.target.closest('.it');if(!it||e.target.closest('button,select,input'))return;drag={it:it,x:e.clientX,y:e.clientY,on:false,id:it.dataset.id,from:it.dataset.l,pid:e.pointerId,t:e.pointerType};if(e.pointerType==='touch'){drag.lp=setTimeout(function(){if(drag&&!drag.on)start(e)},250)}});
function start(e){drag.on=true;var it=drag.it,r=it.getBoundingClientRect();var g=it.cloneNode(true);g.classList.add('ghost');g.style.left=r.left+'px';g.style.top=r.top+'px';g.style.width=r.width+'px';document.body.appendChild(g);drag.g=g;drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;it.classList.add('dg');try{board.setPointerCapture(drag.pid)}catch(x){}}
board.addEventListener('pointermove',function(e){if(!drag)return;if(!drag.on){if(drag.t!=='touch'&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6)start(e);else return}
e.preventDefault&&drag.t!=='touch'&&0;drag.g.style.left=(e.clientX-drag.dx)+'px';drag.g.style.top=(e.clientY-drag.dy)+'px';var el=document.elementFromPoint(e.clientX,e.clientY),col=el&&el.closest('.col');board.querySelectorAll('.col').forEach(function(c){c.classList.toggle('over',c===col)});drag.over=col?col.dataset.l:null;
var br=board.getBoundingClientRect();if(e.clientX>br.right-50)board.scrollLeft+=14;else if(e.clientX<br.left+50)board.scrollLeft-=14});
function end(){if(!drag)return;clearTimeout(drag.lp);if(drag.on){drag.g.remove();var to=drag.over,from=drag.from,id=drag.id;board.querySelectorAll('.col').forEach(function(c){c.classList.remove('over')});drag=null;if(to&&to!==from)move(id,from,to);else render()}else drag=null}
board.addEventListener('pointerup',end);board.addEventListener('pointercancel',end);
render();
})();
</script></body></html>
