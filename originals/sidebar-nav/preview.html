<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collapsible Sidebar Navigation — Navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--bg:#f4f5f9;--ink:#1a1f36;--mut:#6b7390;--bd:#e4e6ee;--ac:#0e9f8e;--tint:#e2f5f2;--w:264px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.4 'Figtree',system-ui,sans-serif;height:100svh;overflow:hidden}
:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
button{font-family:inherit;color:inherit}
.app{display:flex;height:100%}
aside{width:var(--w);background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:width .22s;flex:none;position:relative;z-index:30}
.rail aside{width:72px}
.top{padding:12px;display:flex;flex-direction:column;gap:6px;position:relative}
.ws{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--bd);border-radius:12px;padding:6px 10px;cursor:pointer;min-height:48px;width:100%;text-align:left}
.ws:hover{background:#f7f8fb}
.av{width:30px;height:30px;border-radius:9px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.rail .tx,.rail .ch,.rail .sec,.rail .kb,.rail .star{display:none}
.rail .ws{padding:6px;justify-content:center}
.wm{position:absolute;left:12px;right:12px;top:64px;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 14px 34px rgba(26,31,54,.16);padding:6px;z-index:40;min-width:200px}
.wm button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-radius:8px;padding:0 10px;min-height:44px;cursor:pointer;text-align:left}
.wm button:hover,.wm button[aria-checked=true]{background:var(--tint)}
nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 12px}
ul{list-style:none;margin:0;padding:0}
.sec{font:700 11px 'Figtree',sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:14px 10px 6px}
.it{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:10px;padding:0 10px;min-height:42px;cursor:pointer;text-align:left;font-weight:600;color:#3a4160;position:relative}
.it:hover{background:#f2f4f8}
.it.act{background:var(--tint);color:#087467}
.it svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ch{transition:transform .2s;font-size:11px;color:var(--mut)}
.it[aria-expanded=true] .ch{transform:rotate(90deg)}
.kids{margin:2px 0 4px 20px;padding-left:12px;border-left:1px solid var(--bd)}
.kids .it{min-height:36px;font-weight:500;font-size:13.5px}
.rail .kids{display:none}
.row{display:flex;align-items:center;position:relative}
.star{position:absolute;right:6px;background:none;border:0;cursor:pointer;color:#c0c5d6;font-size:16px;min-width:32px;min-height:32px;opacity:0}
.row:hover .star,.row:focus-within .star{opacity:1}.star[aria-pressed=true]{color:#f2b01e;opacity:1}
.kb{font-size:11px;border:1px solid var(--bd);border-radius:5px;padding:0 5px;color:var(--mut)}
.tip{position:fixed;z-index:80;background:#1a1f36;color:#fff;padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:600;pointer-events:none;white-space:nowrap}
.fly{position:fixed;z-index:80;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 14px 34px rgba(26,31,54,.18);padding:6px;min-width:170px}
.fly button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:0 12px;min-height:40px;cursor:pointer;font-weight:600}
.fly button:hover{background:var(--tint)}
.foot{border-top:1px solid var(--bd);padding:12px;display:flex;align-items:center;gap:10px}
.foot .av{background:#6a4cff;border-radius:50%}
.cl{background:none;border:1px solid var(--bd);border-radius:8px;width:36px;height:36px;cursor:pointer;margin-left:auto;font-size:16px;flex:none}
.rail .foot{flex-direction:column}.rail .cl{margin:0}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:12px;padding:0 24px;height:64px;border-bottom:1px solid var(--bd);background:#fff}
.mn{display:none;background:none;border:1px solid var(--bd);border-radius:8px;min-width:44px;min-height:44px;cursor:pointer;font-size:18px}
.bc{color:var(--mut)}.bc b{color:var(--ink)}
.pgb{padding:28px 24px;overflow:auto}
.pgb h1{font:700 28px 'Figtree',sans-serif;margin:0 0 6px}
.pgb p{color:var(--mut);margin:0 0 20px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.gc{background:#fff;border:1px solid var(--bd);border-radius:14px;height:110px;padding:14px;color:var(--mut)}
.scrim{position:fixed;inset:0;background:rgba(20,24,45,.45);z-index:25}
@media(max-width:820px){aside,.rail aside{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-100%);transition:transform .22s;box-shadow:10px 0 30px rgba(0,0,0,.15)}.open aside{transform:none}.rail .tx,.rail .ch,.rail .sec,.rail .kb{display:revert}.rail .kids{display:block}.mn{display:block}.cl{display:none}.hd{padding:0 14px}.pgb{padding:20px 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app" id="ap">
<aside id="sd" aria-label="Sidebar"><div class="top"><button class="ws" id="wb" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Switch workspace"><span class="av" id="wa">B</span><span class="tx"><b id="wn">Basecamp Nine</b></span><span class="ch">▾</span></button>
<div class="wm" id="wm" role="menu" hidden><button role="menuitemradio" aria-checked="true" data-n="Basecamp Nine" data-a="B">Basecamp Nine</button><button role="menuitemradio" aria-checked="false" data-n="Quarry Lane" data-a="Q">Quarry Lane</button><button role="menuitemradio" aria-checked="false" data-n="Hearth Studio" data-a="H">Hearth Studio</button></div>
<button class="it" id="sk" type="button" data-tip="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span class="tx">Search</span><span class="kb">⌘K</span></button></div>
<nav id="nv" aria-label="Primary"></nav>
<div class="foot"><span class="av">JH</span><span class="tx"><b>Jules Harrow</b><br><span style="color:var(--mut);font-size:12px">Owner</span></span><button class="cl" id="cb" type="button" aria-label="Collapse sidebar" aria-expanded="true">«</button></div></aside>
<main><div class="hd"><button class="mn" id="mb" type="button" aria-label="Open menu">☰</button><div class="bc" id="bc"></div></div><div class="pgb"><h1 id="pt"></h1><p id="pp">This is a placeholder page for the selected route.</p><div class="gr"><div class="gc">Card</div><div class="gc">Card</div><div class="gc">Card</div></div></div></main>
</div><div class="scrim" id="sm" hidden></div><div id="fx"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var IC={d:'<path d="M3 12l9-8 9 8M5 10v10h14V10"/>',p:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',r:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',t:'<circle cx="9" cy="8" r="4"/><path d="M2 20c1-4 4-6 7-6s6 2 7 6M17 5a4 4 0 0 1 0 6M22 20c-.5-3-2-5-4-6"/>',s:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',f:'<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>'};
var TREE=[{id:'dash',n:'Dashboard',i:'d'},{id:'proj',n:'Projects',i:'p',k:[['Roadmap','roadmap'],['Sprint board','sprint'],['Archive','parchive']]},{id:'rep',n:'Reports',i:'r',k:[['Weekly summary','weekly'],['Revenue','revenue']]},{id:'team',n:'Team',i:'t'},{id:'set',n:'Settings',i:'s'}];
var fav={roadmap:1,weekly:1,team:1};
var NAMES={dash:'Dashboard',proj:'Projects',rep:'Reports',team:'Team',set:'Settings',roadmap:'Roadmap',sprint:'Sprint board',parchive:'Archive',weekly:'Weekly summary',revenue:'Revenue'};
var PAR={roadmap:'Projects',sprint:'Projects',parchive:'Projects',weekly:'Reports',revenue:'Reports'};
var cur='dash',open={proj:true},rail=false;
try{rail=localStorage.getItem('bn-rail')==='1'}catch(e){}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function svg(i){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[i]+'</svg>'}
function row(id,n,i,lv){var f=lv?'<button class="star" type="button" data-s="'+id+'" aria-pressed="'+!!fav[id]+'" aria-label="Pin '+n+' to favourites">★</button>':'';return '<li role="none"><div class="row"><button class="it'+(cur===id?' act':'')+'" role="treeitem" data-id="'+id+'" data-tip="'+n+'" tabindex="-1" aria-current="'+(cur===id?'page':'false')+'">'+(i?svg(i):'')+'<span class="tx">'+n+'</span></button>'+f+'</div></li>'}
function build(){var h='<ul role="tree" aria-label="Pages">';
 TREE.forEach(function(t){if(t.k){var o=!!open[t.id];h+='<li role="none"><button class="it" role="treeitem" aria-expanded="'+o+'" data-g="'+t.id+'" data-tip="'+t.n+'" tabindex="-1">'+svg(t.i)+'<span class="tx">'+t.n+'</span><span class="ch" aria-hidden="true">▶</span></button>'+(o?'<ul class="kids" role="group">'+t.k.map(function(k){return row(k[1],k[0],'',1)}).join('')+'</ul>':'')+'</li>'}else h+=row(t.id,t.n,t.i,0)});
 h+='</ul><div class="sec">Favourites</div><ul role="group" aria-label="Favourites">'+Object.keys(fav).filter(function(k){return fav[k]}).map(function(k){return '<li role="none"><div class="row"><button class="it'+(cur===k?' act':'')+'" role="treeitem" data-id="'+k+'" data-tip="'+NAMES[k]+'" tabindex="-1">'+svg('f')+'<span class="tx">'+NAMES[k]+'</span></button></div></li>'}).join('')+'</ul>';
 $('#nv').innerHTML=h;var f=$('#nv .it');if(f)f.tabIndex=0;var a=$('#nv .act');if(a){document.querySelectorAll('#nv .it').forEach(function(x){x.tabIndex=-1});a.tabIndex=0}
 $('#bc').innerHTML=(PAR[cur]?esc(PAR[cur])+' / ':'')+'<b>'+esc(NAMES[cur])+'</b>';$('#pt').textContent=NAMES[cur]}
function applyRail(){$('#ap').classList.toggle('rail',rail);var b=$('#cb');b.textContent=rail?'»':'«';b.setAttribute('aria-expanded',!rail);b.setAttribute('aria-label',rail?'Expand sidebar':'Collapse sidebar');try{localStorage.setItem('bn-rail',rail?'1':'0')}catch(e){}hideTip()}
function hideTip(){$('#fx').innerHTML=''}
function items(){return[].slice.call(document.querySelectorAll('#nv .it'))}
$('#nv').addEventListener('click',function(e){var s=e.target.closest('[data-s]');if(s){fav[s.dataset.s]=!fav[s.dataset.s];build();return}
 var g=e.target.closest('[data-g]');if(g){if(rail){flyout(g)}else{open[g.dataset.g]=!open[g.dataset.g];build();var n=$('#nv [data-g="'+g.dataset.g+'"]');if(n){document.querySelectorAll('#nv .it').forEach(function(x){x.tabIndex=-1});n.tabIndex=0;n.focus()}}return}
 var i=e.target.closest('[data-id]');if(i){cur=i.dataset.id;build();var n2=$('#nv .act');if(n2)n2.focus();closeDrawer();hideTip()}});
function flyout(g){var t=TREE.filter(function(x){return x.id===g.dataset.g})[0],r=g.getBoundingClientRect();$('#fx').innerHTML='<div class="fly" style="left:'+(r.right+8)+'px;top:'+r.top+'px" role="menu">'+t.k.map(function(k){return '<button role="menuitem" data-fid="'+k[1]+'">'+k[0]+'</button>'}).join('')+'</div>'}
$('#fx').addEventListener('click',function(e){var b=e.target.closest('[data-fid]');if(b){cur=b.dataset.fid;build();hideTip()}});
document.addEventListener('click',function(e){if(!e.target.closest('.fly')&&!e.target.closest('[data-g]'))hideTip();if(!e.target.closest('#wm')&&!e.target.closest('#wb')){$('#wm').hidden=true;$('#wb').setAttribute('aria-expanded',false)}});
function tip(el){if(!rail||innerWidth<=820)return;var t=el.dataset.tip;if(!t||el.dataset.g&&$('#fx .fly'))return;var r=el.getBoundingClientRect();$('#fx').innerHTML='<div class="tip" style="left:'+(r.right+10)+'px;top:'+(r.top+r.height/2-14)+'px" role="tooltip">'+esc(t)+'</div>'}
$('#sd').addEventListener('mouseover',function(e){var i=e.target.closest('.it');if(i)tip(i)});
$('#sd').addEventListener('mouseout',function(e){if(e.target.closest('.it')&&!$('#fx .fly'))hideTip()});
$('#sd').addEventListener('focusin',function(e){var i=e.target.closest('.it');if(i)tip(i)});
$('#sd').addEventListener('focusout',function(){if(!$('#fx .fly'))hideTip()});
$('#nv').addEventListener('keydown',function(e){var its=items(),i=its.indexOf(document.activeElement);if(i<0)return;var el=its[i];
 function mv(n){if(!its[n])return;its.forEach(function(x){x.tabIndex=-1});its[n].tabIndex=0;its[n].focus()}
 if(e.key==='ArrowDown'){e.preventDefault();mv(Math.min(its.length-1,i+1))}
 else if(e.key==='ArrowUp'){e.preventDefault();mv(Math.max(0,i-1))}
 else if(e.key==='Home'){e.preventDefault();mv(0)}else if(e.key==='End'){e.preventDefault();mv(its.length-1)}
 else if(e.key==='ArrowRight'&&el.dataset.g&&!open[el.dataset.g]){e.preventDefault();open[el.dataset.g]=true;build();var n=$('#nv [data-g="'+el.dataset.g+'"]');n.tabIndex=0;n.focus()}
 else if(e.key==='ArrowLeft'){e.preventDefault();if(el.dataset.g&&open[el.dataset.g]){open[el.dataset.g]=false;build();var m=$('#nv [data-g="'+el.dataset.g+'"]');m.tabIndex=0;m.focus()}else{var up=el.closest('.kids');if(up){var p=up.parentNode.querySelector('[data-g]');its.forEach(function(x){x.tabIndex=-1});p.tabIndex=0;p.focus()}}}});
$('#cb').addEventListener('click',function(){rail=!rail;applyRail()});
document.addEventListener('keydown',function(e){if(e.key==='['&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){rail=!rail;applyRail()}if(e.key==='Escape'){closeDrawer();$('#wm').hidden=true;$('#wb').setAttribute('aria-expanded',false);hideTip()}});
var wb=$('#wb'),wm=$('#wm');
wb.addEventListener('click',function(){var o=wm.hidden;wm.hidden=!o;wb.setAttribute('aria-expanded',o);if(o)wm.querySelector('[aria-checked=true]').focus()});
wm.addEventListener('click',function(e){var b=e.target.closest('[data-n]');if(!b)return;wm.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-checked',x===b)});$('#wn').textContent=b.dataset.n;$('#wa').textContent=b.dataset.a;wm.hidden=true;wb.setAttribute('aria-expanded',false);wb.focus()});
wm.addEventListener('keydown',function(e){var bs=[].slice.call(wm.querySelectorAll('button')),i=bs.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();bs[(i+1)%3].focus()}if(e.key==='ArrowUp'){e.preventDefault();bs[(i+2)%3].focus()}});
function closeDrawer(){$('#ap').classList.remove('open');$('#sm').hidden=true}
$('#mb').addEventListener('click',function(){$('#ap').classList.add('open');$('#sm').hidden=false});
$('#sm').addEventListener('click',closeDrawer);
applyRail();build();
})();
</script></body></html>
