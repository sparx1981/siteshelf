<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse — Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f5f6f8;color:#111827;font:400 16px/1.55 Figtree,system-ui,sans-serif}
.hd{position:sticky;top:0;z-index:20;height:56px;background:rgba(245,246,248,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #e5e7eb}
.hd div{max-width:600px;height:100%;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px}
.hd b{font:700 22px Figtree,sans-serif;letter-spacing:-.02em;margin-right:auto}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid #e5e7eb;background:#fff;color:#111827;cursor:pointer;display:grid;place-items:center}
.ib:hover{background:#f3f4f6}.ib.sp svg{animation:rot .7s linear}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;color:#6b7280;cursor:pointer}
.sw input{accent-color:#2563eb}
:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
main{max-width:600px;margin:0 auto;padding:16px;display:grid;gap:14px}
.post{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px}
.post.in{animation:rise .4s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.row{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.nm{font-weight:600;line-height:1.25}.hn{color:#6b7280;font-size:14px}
.tx{margin:12px 0 0}
.im{margin-top:12px;aspect-ratio:16/9;border-radius:12px}
.act{display:flex;gap:6px;margin-top:12px;margin-left:-8px}
.ab{display:flex;gap:6px;align-items:center;border:0;background:none;color:#6b7280;border-radius:999px;padding:6px 10px;font:500 14px Figtree,sans-serif;cursor:pointer}
.ab:hover{background:#f3f4f6;color:#111827}
.ab.lk[aria-pressed=true]{color:#e11d48}.ab.lk[aria-pressed=true] svg{fill:#e11d48;animation:pop .3s}
@keyframes pop{50%{transform:scale(1.3)}}
@keyframes rot{to{transform:rotate(360deg)}}
.sk i{display:block;border-radius:8px;background:#e5e7eb linear-gradient(90deg,#e5e7eb 0,#f3f4f6 50%,#e5e7eb 100%) 0 0/200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.sk .c{width:44px;height:44px;border-radius:50%;flex:none}
.l{height:14px;margin-top:10px}
.ld{display:flex;justify-content:center;align-items:center;gap:10px;color:#6b7280;padding:14px;font-size:14px}
.spn{width:18px;height:18px;border:2px solid #d1d5db;border-top-color:#2563eb;border-radius:50%;animation:rot .7s linear infinite}
.err{background:#fff;border:1px solid #fecaca;border-radius:16px;padding:22px;text-align:center}
.err b{display:block;font-size:17px;margin-bottom:4px}.err p{margin:0 0 14px;color:#6b7280}
.btn{border:0;background:#111827;color:#fff;border-radius:999px;padding:10px 22px;font:600 15px Figtree,sans-serif;cursor:pointer}
.end{text-align:center;color:#6b7280;padding:18px;font-size:14px}
#sent{height:1px}
@media(max-width:640px){main{padding:12px}.sw span{display:none}}
@media(prefers-reduced-motion:reduce){.sk i{animation:none;background:#e5e7eb}.post.in,.ib.sp svg,.spn{animation:none}.ab.lk[aria-pressed=true] svg{animation:none}}
</style></head><body>
<header class="hd"><div><b>Pulse</b><label class="sw"><input type="checkbox" id="off"><span>Simulate offline</span></label><button class="ib" id="rf" type="button" aria-label="Refresh feed"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.3-5.7M20 4v5h-5"/></svg></button></div></header>
<main id="feed" aria-live="polite"></main>
<div id="sent"></div>
<script>
(function(){
var names=['Maya Chen','Tom Okafor','Lena Fischer','Ravi Patel','Sofia Rossi','Jonas Berg','Aiko Tanaka','Ben Walker','Nadia Haddad','Leo Martins'];
var texts=['Just shipped a tiny feature that took three weeks to get right. Worth it.','Anyone else think the best part of the week is Friday afternoon, when nobody schedules meetings?','Coffee number three. Design review in ten minutes. Wish me luck.','Reading about how old lighthouses were automated. Weirdly moving.','Hot take: dark mode should be the default and light mode the toggle.','Our team offsite was mostly about food. Zero regrets.','Finally cleaned up my desk. It lasted about eleven minutes.','Is it too early to start thinking about holiday plans? Asking for a me.','New blog post is up. It is about the boring things that make products feel great.','The sunrise on my morning run was unreal today.'];
var grads=['linear-gradient(135deg,#f97316,#ec4899)','linear-gradient(135deg,#06b6d4,#3b82f6)','linear-gradient(135deg,#8b5cf6,#ec4899)','linear-gradient(135deg,#10b981,#06b6d4)','linear-gradient(135deg,#f59e0b,#ef4444)'];
var posts=[];for(var i=0;i<30;i++){var n=names[(i*7+3)%10];posts.push({n:n,h:'@'+n.split(' ')[0].toLowerCase()+(i+10),t:(i*5%55)+2,tx:texts[(i*3+1)%10],img:i%3===1,g:grads[i%5],ig:grads[(i+2)%5],l:(i*37)%140+3,c:(i*11)%40,on:false})}
var feed=document.getElementById('feed'),off=document.getElementById('off'),shown=0,loading=false,done=false,tmr=[];
function ago(m){return m<60?m+'m':Math.floor(m/60)+'h'}
function skel(){var d=document.createElement('div');d.className='post sk';d.setAttribute('aria-busy','true');d.innerHTML='<div class="row"><i class="c"></i><div style="flex:1"><i class="l" style="width:40%;margin:0"></i><i class="l" style="width:25%;height:12px"></i></div></div><i class="l" style="width:100%;margin-top:16px"></i><i class="l" style="width:92%"></i><i class="l" style="width:60%"></i><i style="aspect-ratio:16/9;margin-top:14px;border-radius:12px"></i><div style="display:flex;gap:18px;margin-top:14px"><i class="l" style="width:50px;margin:0"></i><i class="l" style="width:50px;margin:0"></i><i class="l" style="width:50px;margin:0"></i></div>';return d}
var heart='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.800-8 11-8 11z"/></svg>';
var chat='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.500 7.200L4 20l1-4.500A8 8 0 1121 12z"/></svg>';
var share='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7h16v-7M12 3v12M7 8l5-5 5 5"/></svg>';
function real(p){var d=document.createElement('article');d.className='post in';
 d.innerHTML='<div class="row"><span class="av" style="background:'+p.g+'">'+p.n.split(' ').map(function(x){return x[0]}).join('')+'</span><div><div class="nm">'+p.n+'</div><div class="hn">'+p.h+' · '+ago(p.t)+'</div></div></div><p class="tx">'+p.tx+'</p>'+(p.img?'<div class="im" role="img" aria-label="Post image" style="background:'+p.ig+'"></div>':'')+'<div class="act"><button class="ab lk" type="button" aria-pressed="'+p.on+'" aria-label="Like">'+heart+'<span>'+p.l+'</span></button><button class="ab" type="button" aria-label="Comments">'+chat+'<span>'+p.c+'</span></button><button class="ab" type="button" aria-label="Share">'+share+'</button></div>';
 var b=d.querySelector('.lk');b.onclick=function(){p.on=!p.on;p.l+=p.on?1:-1;b.setAttribute('aria-pressed',p.on);b.querySelector('span').textContent=p.l};return d}
function clearT(){tmr.forEach(clearTimeout);tmr=[]}
function load(n,delay,first){if(loading||done)return;loading=true;var sks=[];for(var i=0;i<n;i++){var s=skel();sks.push(s);feed.appendChild(s)}
 var sp=null;if(!first){sp=document.createElement('div');sp.className='ld';sp.innerHTML='<span class="spn"></span>Loading more…';feed.appendChild(sp)}
 tmr.push(setTimeout(function(){
  if(sp)sp.remove();
  if(off.checked){off.checked=false;sks.forEach(function(s){s.remove()});var e=document.createElement('div');e.className='err';e.setAttribute('role','alert');e.innerHTML='<b>Could not load posts</b><p>Check your connection and try again.</p><button class="btn" type="button">Retry</button>';feed.appendChild(e);e.querySelector('button').onclick=function(){e.remove();loading=false;load(n,900,first)};return}
  sks.forEach(function(s,i){var p=posts[shown+i];if(!p){s.remove();return}var r=real(p);r.style.animationDelay=(i*60)+'ms';s.replaceWith(r)});
  shown=Math.min(shown+n,posts.length);loading=false;
  if(shown>=posts.length){done=true;var d=document.createElement('div');d.className='end';d.textContent='You are all caught up';feed.appendChild(d)}
  io.observe(document.getElementById('sent'))
 },delay))}
var io=new IntersectionObserver(function(es){if(es[0].isIntersecting&&!loading&&!done&&shown>0){io.unobserve(es[0].target);load(5,900,false)}},{rootMargin:'200px'});
function start(){clearT();loading=false;done=false;shown=0;feed.innerHTML='';posts.forEach(function(p){p.on=false});load(4,1400,true)}
document.getElementById('rf').onclick=function(){var b=this;b.classList.remove('sp');void b.offsetWidth;b.classList.add('sp');start();scrollTo(0,0)};
start();
})();
</script>
</body></html>
