<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Testimonial Carousel — Testimonials</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#0a1226;color:#f1f4ff;font:400 16px/1.55 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #f2c14e;outline-offset:3px;box-shadow:0 0 0 6px #0a1226}
.sec{position:relative;padding:72px 0 64px;overflow:hidden;background:radial-gradient(900px 420px at 50% 52%,rgba(30,58,138,.5),transparent 70%)}
.hd{text-align:center;padding:0 20px;margin-bottom:28px}
.eb{font:600 13px Inter;text-transform:uppercase;letter-spacing:.16em;color:#f2c14e;margin:0 0 12px}
h1{font:700 clamp(34px,5vw,56px)/1.05 "Playfair Display",serif;margin:0 0 10px}.hd p{color:#a9b6dd;margin:0;font-size:18px}
.stage{position:relative;height:430px;perspective:1400px;touch-action:pan-y;cursor:grab;outline-offset:-4px;user-select:none;-webkit-user-select:none;overflow:clip}
.stage.dr{cursor:grabbing}
.stage:before{content:"";position:absolute;left:10%;right:10%;bottom:34px;height:1px;background:linear-gradient(90deg,transparent,rgba(169,182,221,.35),transparent)}
.cd{position:absolute;left:50%;top:18px;width:var(--cw,380px);height:350px;margin-left:calc(var(--cw,380px)/-2);background:linear-gradient(180deg,#16224a,#101a38);border:1px solid #2a3a6e;border-radius:22px;padding:28px;display:flex;flex-direction:column;box-shadow:0 30px 60px -28px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.07);will-change:transform,opacity;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .55s,filter .55s}
.stage.dr .cd{transition:none}
.cd.side{cursor:pointer}
.qm{font:700 64px/.6 "Playfair Display",serif;color:#f2c14e;height:26px}
.stars{color:#f2c14e;letter-spacing:3px;font-size:15px;margin:10px 0 12px}
.cd blockquote{margin:0;font-size:18px;line-height:1.55;flex:1}
.cd.side blockquote{font-size:16px}
.pr{display:flex;gap:12px;align-items:center;border-top:1px solid #2a3a6e;padding-top:16px;margin-top:16px}
.pr svg{width:44px;height:44px;flex:none}
.pr b{font:700 17px "Playfair Display",serif;display:block}.pr span{font-size:13px;color:#a9b6dd}
.ct{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:6px}
.ar{all:unset;box-sizing:border-box;width:48px;height:48px;border-radius:50%;border:1.5px solid #3a4c88;display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s}
.ar:hover{background:#18265a;border-color:#f2c14e}.ar:focus-visible{outline:3px solid #f2c14e;outline-offset:3px}
.ar[aria-disabled=true]{opacity:.35;cursor:default}
.ar svg{width:20px;height:20px;stroke:#f1f4ff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dots{display:flex;gap:4px}.dots button{all:unset;box-sizing:border-box;width:26px;height:44px;display:grid;place-items:center;cursor:pointer}.dots button:focus-visible{outline:3px solid #f2c14e;outline-offset:-3px;border-radius:8px}
.dots i{display:block;width:8px;height:8px;border-radius:50%;background:#3a4c88;transition:width .3s,background .3s}.dots button[aria-current=true] i{width:22px;border-radius:4px;background:#f2c14e}
.cn{font:500 14px Inter;color:#a9b6dd;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.ap{display:flex;justify-content:center;margin-top:14px}
.ap button{all:unset;box-sizing:border-box;cursor:pointer;font-size:14px;color:#a9b6dd;padding:10px 16px;border-radius:999px;border:1px solid #2a3a6e;min-height:44px}.ap button[aria-pressed=true]{color:#0a1226;background:#f2c14e;border-color:#f2c14e}.ap button:focus-visible{outline:3px solid #f2c14e;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:700px){.sec{padding:44px 0 44px}.stage{height:430px;--cw:min(78vw,320px)}.cd{height:360px;padding:22px}.cd blockquote{font-size:16px}.cd.side blockquote{font-size:15px}.ct{gap:8px}.dots button{width:18px}}
@media (prefers-reduced-motion:reduce){.cd{transition:none!important;filter:none!important}.ap{display:none}}
</style></head><body>
<section class="sec" aria-labelledby="h"><div class="hd"><p class="eb">Oakhaven Studios</p><h1 id="h">Clients say it best</h1><p>Seven teams on what it is like to ship with us.</p></div>
<div class="stage" id="stage" role="group" aria-roledescription="carousel" aria-label="Client testimonials" tabindex="0"></div>
<div class="ct"><button class="ar" id="pv" type="button" aria-label="Previous testimonial"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><div class="dots" id="dots"></div><span class="cn" id="cn" aria-hidden="true">1 / 7</span><button class="ar" id="nx" type="button" aria-label="Next testimonial"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>
<div class="ap"><button id="ap" type="button" aria-pressed="false">Autoplay: off</button></div>
</section>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var D=[
['Marguerite Quennell','Head of Product, Tallis Rail','They asked what the ticket machine felt like at 6am, in the rain. Nobody else had.',['#f2c14e','#c4623a']],
['Rohan Dasgupta','Founder, Fernwick Tea','Our checkout conversion rose eleven percent and, more importantly, our customers started replying to the emails.',['#6ee7b7','#0f766e']],
['Ingrid Solheim','CEO, Brightwater Clinics','The booking flow is so calm that patients have started thanking the receptionists for it.',['#93c5fd','#1d4ed8']],
['Luca Ferrandi','Design Lead, Mosaic Bank','Oakhaven delivered a design system in six weeks that our own team had been circling for two years.',['#f9a8d4','#9d174d']],
['Temitope Adeyinka','COO, Larkfield Freight','Dull dashboards, finally made beautiful. Our drivers read them. Drivers do not read things.',['#fcd34d','#b45309']],
['Hanne Vogel','Director, Pinecone Museum','Visitors now plan the whole day on their phones before they arrive. Footfall is up and queues are down.',['#c4b5fd','#6d28d9']],
['Callum Brightside','Owner, Salt & Ember','Honest, quick and slightly obsessed with kerning. We loved every minute.',['#fda4af','#be123c']]];
var N=D.length,cur=0,stage=$('#stage'),cards=[],dots=$('#dots'),live=$('#live'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function ini(n){return n.split(' ').map(function(w){return w[0]}).join('')}
D.forEach(function(d,i){var c=document.createElement('article');c.className='cd';c.setAttribute('role','group');c.setAttribute('aria-roledescription','slide');c.setAttribute('aria-label',(i+1)+' of '+N);
 c.innerHTML='<div class="qm" aria-hidden="true">“</div><div class="stars" role="img" aria-label="5 out of 5 stars">★★★★★</div><blockquote>'+d[2]+'</blockquote><div class="pr"><svg viewBox="0 0 44 44" aria-hidden="true"><defs><linearGradient id="a'+i+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+d[3][0]+'"/><stop offset="1" stop-color="'+d[3][1]+'"/></linearGradient></defs><circle cx="22" cy="22" r="22" fill="url(#a'+i+')"/><text x="22" y="27" text-anchor="middle" font-family="Playfair Display,serif" font-weight="700" font-size="15" fill="#0a1226">'+ini(d[0])+'</text></svg><div><b>'+d[0]+'</b><span>'+d[1]+'</span></div></div>';
 c.addEventListener('click',function(){if(!moved&&i!==cur)go(i,true)});stage.appendChild(c);cards.push(c);
 var b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Show testimonial '+(i+1));b.innerHTML='<i></i>';b.addEventListener('click',function(){go(i,true)});dots.appendChild(b)});
var pos=0,dragX=0,moved=false;
function sp(){return parseFloat(getComputedStyle(stage).getPropertyValue('--cw'))||cards[0].offsetWidth}
function step(){var w=cards[0].offsetWidth;return innerWidth<=700?w*.72:w*.79}
function render(p){var st=step(),narrow=innerWidth<=700,rot=narrow?30:38;
 cards.forEach(function(c,i){var d=i-p,a=Math.abs(d),s=Math.max(-2.2,Math.min(2.2,d)),sign=d<0?-1:1,ad=Math.min(a,2.2);
  var x=d*st*(a>1?1:1);if(a>2.2)x=sign*2.2*st+ (d-sign*2.2)*st*.15;
  var ry=-sign*Math.min(a,1)*rot,z=-Math.min(a,1)*130-Math.max(0,Math.min(a,3)-1)*60,sc=1-Math.min(a,1)*.14-Math.max(0,Math.min(a,3)-1)*.05;
  var op=a<=1?1-.32*a:Math.max(0,.68-(a-1)*.34);
  c.style.transform='translate3d('+x.toFixed(1)+'px,0,'+z.toFixed(1)+'px) rotateY('+ry.toFixed(1)+'deg) scale('+sc.toFixed(3)+')';
  c.style.opacity=op.toFixed(2);c.style.zIndex=100-Math.round(a*10);
  c.style.filter=(!reduce&&a>.05)?'blur('+Math.min(1.5,a*1.5).toFixed(1)+'px)':'none';
  var on=Math.round(p)===i;c.classList.toggle('side',!on);c.setAttribute('aria-hidden',on?'false':'true');
  c.querySelectorAll('a,button').forEach(function(x){x.tabIndex=on?0:-1});c.style.pointerEvents=a>2.4?'none':'auto'})}
function ui(){$('#cn').textContent=(cur+1)+' / '+N;[].forEach.call(dots.children,function(b,i){if(i===cur)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});
 $('#pv').setAttribute('aria-disabled',cur===0);$('#nx').setAttribute('aria-disabled',cur===N-1);live.textContent='Slide '+(cur+1)+' of '+N+': '+D[cur][0]+', '+D[cur][1]}
function go(i,user){i=Math.max(0,Math.min(N-1,i));var ch=i!==cur;cur=i;pos=i;render(pos);ui();if(user)stopAuto()}
$('#pv').addEventListener('click',function(){go(cur-1,true)});$('#nx').addEventListener('click',function(){go(cur+1,true)});
stage.addEventListener('keydown',function(e){var k=e.key;if(k==='ArrowRight'){e.preventDefault();go(cur+1,true)}else if(k==='ArrowLeft'){e.preventDefault();go(cur-1,true)}else if(k==='Home'){e.preventDefault();go(0,true)}else if(k==='End'){e.preventDefault();go(N-1,true)}});
var down=false,sx=0,base=0,lx=0,lt=0,vel=0;
stage.addEventListener('pointerdown',function(e){if(e.button>0)return;down=true;moved=false;sx=e.clientX;lx=sx;lt=performance.now();vel=0;base=pos;try{stage.setPointerCapture(e.pointerId)}catch(_){}});
stage.addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-sx;if(!moved&&Math.abs(dx)>6){moved=true;stage.classList.add('dr');stopAuto()}if(!moved)return;var t=performance.now();if(t>lt)vel=(e.clientX-lx)/(t-lt);lx=e.clientX;lt=t;pos=Math.max(-.3,Math.min(N-.7,base-dx/step()));render(pos)});
function up(){if(!down)return;down=false;stage.classList.remove('dr');if(moved){var tgt=Math.round(pos-(reduce?0:Math.max(-2,Math.min(2,vel*-1.2))));go(tgt,true);setTimeout(function(){moved=false},0)}}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
var wt=0;stage.addEventListener('wheel',function(e){if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>12){e.preventDefault();var n=performance.now();if(n-wt>350){wt=n;go(cur+(e.deltaX>0?1:-1),true)}}},{passive:false});
var auto=null,apb=$('#ap');
function setAuto(v){if(v&&!auto){auto=setInterval(function(){go(cur>=N-1?0:cur+1)},5000)}else if(!v&&auto){clearInterval(auto);auto=null}apb.setAttribute('aria-pressed',!!auto);apb.textContent='Autoplay: '+(auto?'on':'off')}
function stopAuto(){if(auto)setAuto(false)}
apb.addEventListener('click',function(){setAuto(!auto)});
stage.addEventListener('mouseenter',function(){if(auto){clearInterval(auto);auto=setInterval(function(){go(cur>=N-1?0:cur+1)},5000)}});
addEventListener('resize',function(){render(pos)});
cur=2;pos=2;render(pos);ui();live.textContent='';
})();
</script></body></html>
