<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testimonial Carousel — Testimonials</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--ink:#1e1b4b;--mut:#6366a0;--ac:#4f46e5}
*{box-sizing:border-box}
body{margin:0;background:#eef2ff;color:var(--ink);font:500 16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;padding:70px 16px;min-height:100svh;overflow-x:hidden}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px;border-radius:10px}
.w{max-width:860px;margin:0 auto;text-align:center;position:relative}
.w::before{content:"“";position:absolute;left:50%;top:-84px;transform:translateX(-50%);font:400 220px/1 Newsreader;color:#c7d2fe;z-index:0;pointer-events:none}
h1{font:700 clamp(28px,4vw,40px)/1.15 'Plus Jakarta Sans';margin:0 0 30px;position:relative;letter-spacing:-.02em}
.car{position:relative;z-index:1}
.vp{overflow:hidden;border-radius:24px;background:#fff;box-shadow:0 20px 50px rgba(67,56,202,.12)}
.tr{display:flex;transition:transform .6s cubic-bezier(.6,0,.2,1)}
.sl{flex:0 0 100%;min-width:0;padding:clamp(28px,5vw,56px) clamp(20px,5vw,60px);opacity:.25;transition:opacity .6s}
.sl.on{opacity:1}
.stars{color:#f5a623;letter-spacing:4px;font-size:20px;margin-bottom:16px}
blockquote{margin:0 0 24px;font:italic 400 clamp(22px,3.2vw,34px)/1.35 Newsreader,serif}
blockquote b{font-style:normal;font-weight:500;color:var(--ac)}
.who{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.who div{text-align:left}.who b{display:block}.who span{color:var(--mut);font-size:14px}
.res{margin-top:20px;display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:99px;padding:6px 16px;font-weight:700;font-size:14px}
.ctl{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.ib{width:46px;height:46px;border-radius:50%;border:1.5px solid #c7d2fe;background:#fff;cursor:pointer;font-size:18px;color:var(--ac);display:grid;place-items:center}
.ib:hover{background:#e0e7ff}
.tabs{display:flex;gap:10px;align-items:center}
.tab{position:relative;width:48px;height:48px;border-radius:50%;border:0;background:none;padding:0;cursor:pointer;transition:transform .3s}
.tab .av{width:36px;height:36px;margin:6px;font-size:13px;opacity:.55;transition:.3s}
.tab[aria-selected=true]{transform:scale(1.18)}
.tab[aria-selected=true] .av{opacity:1}
.tab svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tab circle{fill:none;stroke-width:3}
.tab .bg{stroke:transparent}.tab[aria-selected=true] .bg{stroke:#c7d2fe}
.tab .pg{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:138.2;stroke-dashoffset:138.2}
.cnt{font-weight:700;color:var(--mut);min-width:48px;font-variant-numeric:tabular-nums}
.logos{display:flex;flex-wrap:wrap;gap:14px 38px;justify-content:center;margin-top:46px;color:#8e91c9;font:700 19px 'Plus Jakarta Sans';letter-spacing:-.02em;position:relative;z-index:1}
.sr{position:absolute;left:-9999px}
@media(max-width:520px){.tabs{gap:2px}.tab{width:42px;height:42px}.tab .av{width:30px;height:30px;margin:6px}.w::before{font-size:150px;top:-20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="w">
<h1>Teams that grew with Beacon</h1>
<section class="car" id="car" aria-roledescription="carousel" aria-label="Customer stories">
<div class="vp"><div class="tr" id="tr"></div></div>
<div class="ctl"><button class="ib" id="pv" aria-label="Previous story">‹</button><div class="tabs" role="tablist" aria-label="Choose story" id="tb"></div><button class="ib" id="nx" aria-label="Next story">›</button><button class="ib" id="pp" aria-label="Pause auto-play">❚❚</button><span class="cnt" id="cn">1 / 5</span></div>
<div class="sr" id="lv" aria-live="off"></div></section>
<div class="logos" aria-label="Used by"><span>Northpoint</span><span>Hazelbrook</span><span>Quillfeather</span><span>Mosswell</span><span>Kestrel&amp;Co</span><span>Ladbrook</span></div>
</div>
<script>
const $=s=>document.querySelector(s),mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const T=[['Beacon replaced three spreadsheets and a shared inbox. Our reps now <b>know exactly who to call next</b>, and nothing slips through.','Rosalind Achterberg','Head of Sales','Northpoint Logistics','+38% pipeline','#4f46e5'],['We were sceptical about another CRM. Two weeks in, <b>onboarding a new hire takes an afternoon</b>, not a month.','Dev Kapoor','Founder','Hazelbrook Studio','−60% ramp time','#0ea5e9'],['The reporting finally matches how we actually sell. <b>Forecasts are within 4%</b> for the first time ever.','Marguerite Sol','VP Revenue','Quillfeather','4% forecast error','#db2777'],['Support and sales share one timeline now. <b>Customers stop repeating themselves</b>, and it shows in our renewals.','Tobias Lindgren','COO','Mosswell Energy','+22% renewals','#059669'],['Setup was friendly, pricing was honest and the team answered every question. <b>It feels built for people like us</b>.','Ife Adeyemi','Operations Lead','Kestrel & Co','5-day rollout','#d97706']];
const tr=$('#tr'),tb=$('#tb');let cur=0,play=!rm,hold=false,prog=0,raf=0,t0=0;const DUR=6000;
T.forEach((t,i)=>{const s=mk('div','sl');s.setAttribute('role','group');s.setAttribute('aria-roledescription','slide');s.setAttribute('aria-label',(i+1)+' of '+T.length);s.id='s'+i;
 s.innerHTML='<div class="stars" aria-label="5 out of 5 stars">★★★★★</div><blockquote></blockquote><div class="who"><span class="av" aria-hidden="true"></span><div><b></b><span></span></div></div><span class="res"></span>';
 s.querySelector('blockquote').innerHTML=t[0];const av=s.querySelector('.av');av.textContent=t[1].split(' ').map(w=>w[0]).join('');av.style.background=t[5];s.querySelector('b:not(blockquote b)')||0;
 const nm=s.querySelector('.who b');nm.textContent=t[1];s.querySelector('.who span:not(.av)').textContent=t[2]+', '+t[3];s.querySelector('.res').textContent=t[4];tr.append(s);
 const b=mk('button','tab');b.setAttribute('role','tab');b.setAttribute('aria-selected',i===0);b.setAttribute('aria-controls','s'+i);b.setAttribute('aria-label',t[1]+', '+t[3]);b.tabIndex=i?-1:0;
 b.innerHTML='<svg viewBox="0 0 48 48" aria-hidden="true"><circle class="bg" cx="24" cy="24" r="22"/><circle class="pg" cx="24" cy="24" r="22"/></svg><span class="av"></span>';const a2=b.querySelector('.av');a2.textContent=t[1].split(' ').map(w=>w[0]).join('');a2.style.background=t[5];
 b.onclick=()=>{stopAuto();go(i,true)};b.onkeydown=e=>{let n=-1;if(e.key==='ArrowRight')n=(i+1)%T.length;else if(e.key==='ArrowLeft')n=(i+T.length-1)%T.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=T.length-1;if(n>=0){e.preventDefault();stopAuto();go(n,true);tb.children[n].focus()}};tb.append(b)});
function go(i,announce){cur=(i+T.length)%T.length;tr.style.transform=`translateX(-${cur*100}%)`;[...tr.children].forEach((s,k)=>{s.classList.toggle('on',k===cur);s.setAttribute('aria-hidden',k!==cur)});
 [...tb.children].forEach((b,k)=>{b.setAttribute('aria-selected',k===cur);b.tabIndex=k===cur?0:-1;b.querySelector('.pg').style.strokeDashoffset=138.2});$('#cn').textContent=(cur+1)+' / '+T.length;
 prog=0;t0=performance.now();if(announce||!play){const l=$('#lv');l.setAttribute('aria-live','polite');l.textContent='';setTimeout(()=>l.textContent='Story '+(cur+1)+' of '+T.length+': '+T[cur][1]+', '+T[cur][3],60)}else $('#lv').setAttribute('aria-live','off')}
function frame(n){const pg=tb.children[cur].querySelector('.pg');if(play&&!hold&&!document.hidden){prog+=n-t0;if(prog>=DUR){go(cur+1);}else pg.style.strokeDashoffset=138.2*(1-prog/DUR)}t0=n;raf=requestAnimationFrame(frame)}
function setPlay(v){play=v;$('#pp').textContent=v?'❚❚':'▶';$('#pp').setAttribute('aria-label',v?'Pause auto-play':'Start auto-play');if(!v)tb.children[cur].querySelector('.pg').style.strokeDashoffset=138.2}
function stopAuto(){setPlay(false)}
$('#pp').onclick=()=>{if(rm&&!play){setPlay(true)}else setPlay(!play);prog=0;t0=performance.now()};
$('#pv').onclick=()=>{stopAuto();go(cur-1,true)};$('#nx').onclick=()=>{stopAuto();go(cur+1,true)};
const car=$('#car');car.addEventListener('mouseenter',()=>hold=true);car.addEventListener('mouseleave',()=>hold=false);car.addEventListener('focusin',()=>hold=true);car.addEventListener('focusout',()=>hold=false);
let sx=null;car.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});car.addEventListener('touchend',e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50){stopAuto();go(cur+(d<0?1:-1),true)}sx=null});
setPlay(play);go(0);t0=performance.now();raf=requestAnimationFrame(frame);
</script></body></html>
