<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--c:#2457ff}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:860px){.w{padding:44px 16px}.g{grid-template-columns:minmax(0,1fr)}.tl{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px;gap:8px;scrollbar-width:none}.tl::-webkit-scrollbar{display:none}.tb{grid-template-columns:34px auto;flex:none;scroll-snap-align:start;padding:10px 16px 10px 12px;background:rgba(255,255,255,.5);gap:10px}.tb svg.lg{width:34px;height:34px}.tb span.i,.tb svg.ar{display:none}.tb:before{display:none}.tb[aria-selected=true]{box-shadow:inset 0 0 0 2px var(--k);background:#fff}.pr{left:12px;right:12px;bottom:3px}.nx{display:none}.pn{padding:30px 22px 28px}}
@media (max-width:520px){.mt{grid-template-columns:minmax(0,1fr)}.mt div{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}.mt b{grid-row:span 2}}

</style></head><body>
<div class="w"><p class="eb">Ledgerline customers</p><h1>Results our customers can point at</h1><p class="lead">Four finance teams, four very different businesses, one shared habit: they stopped chasing numbers and started reading them.</p>
<div class="g"><div class="tl" id="tl" role="tablist" aria-label="Customer stories" aria-orientation="vertical"></div><div class="pn" id="pn"><div id="pc"></div></div></div></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var C=[
{n:'Arcwell',i:'Logistics',k:'#2457ff',q:'We closed the books on <i>day two</i> instead of day nine. Our CFO now has weekends.',p:'Marguerite Quennell',t:'Finance Director, Arcwell',m:[[38,'%','faster month-end close','−6 days'],[4.2,' days','average invoice delay','−3.1 days'],[1.2,'m','recovered in late fees','£, first year']],logo:'<path d="M8 38 L24 8 L40 38 M15 28 H33" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>'},
{n:'Nimbus Grain',i:'Food manufacturing',k:'#e0702b',q:'Forecasting used to be a guess in a spreadsheet. Now it is a <i>conversation</i> with the whole plant.',p:'Rohan Dasgupta',t:'Head of Operations, Nimbus Grain',m:[[22,'%','less stock written off','−£410k'],[96,'%','forecast accuracy','+14 pts'],[7,' hrs','saved per planner, weekly','per person']],logo:'<circle cx="24" cy="24" r="12" fill="none" stroke="#fff" stroke-width="4.5"/><path d="M10 38 Q24 28 38 38" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>'},
{n:'Fathom Labs',i:'Marine research',k:'#0f9d7a',q:'Grants come with strict reporting. Ledgerline turned dread into a <i>dashboard</i> we actually enjoy opening.',p:'Ingrid Solheim',t:'Research Manager, Fathom Labs',m:[[100,'%','grant reports on time','from 71%'],[3,'×','faster audit prep','−12 days'],[18,'','funders on one view','new']],logo:'<path d="M6 28 Q15 16 24 28 T42 28 M6 38 Q15 26 24 38 T42 38" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>'},
{n:'Tallow & Rye',i:'Hospitality group',k:'#b0344f',q:'Six restaurants, one set of numbers. Nobody argues about whose spreadsheet is right any more.',p:'Callum Brightside',t:'Group Finance Lead, Tallow & Rye',m:[[5.5,'%','food-cost reduction','−1.9 pts'],[6,'','venues on one ledger','was 6 files'],[45,' min','daily cash-up to close','−2.5 hrs']],logo:'<path d="M12 10 V38 M12 10 Q32 10 32 20 T12 30 M22 30 L36 38" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>'}];
var cur=0,tl=$('#tl'),pc=$('#pc'),tabs=[],auto=true,reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,rot=null,cnt=null;
function ini(n){return n.split(' ').map(function(w){return w[0]}).join('')}
C.forEach(function(c,i){var b=document.createElement('button');b.type='button';b.className='tb';b.setAttribute('role','tab');b.id='t'+i;b.setAttribute('aria-selected',i===0);b.setAttribute('aria-controls','pn');b.tabIndex=i===0?0:-1;b.style.setProperty('--k',c.k);
 b.innerHTML='<svg class="lg" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="'+c.k+'"/>'+c.logo+'</svg><span><b>'+c.n+'</b><span class="i">'+c.i+'</span></span><svg class="ar" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="pr" aria-hidden="true"><i></i></span>';
 b.addEventListener('click',function(){auto=false;stopRot();sel(i)});
 b.addEventListener('keydown',function(e){var k=e.key,n=null,N=C.length;if(k==='ArrowDown'||k==='ArrowRight')n=(i+1)%N;else if(k==='ArrowUp'||k==='ArrowLeft')n=(i+N-1)%N;else if(k==='Home')n=0;else if(k==='End')n=N-1;if(n!==null){e.preventDefault();auto=false;stopRot();sel(n,true)}});
 tl.appendChild(b);tabs.push(b)});
var nx=document.createElement('button');nx.type='button';nx.className='nx';nx.innerHTML='Next story <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';nx.addEventListener('click',function(){auto=false;stopRot();sel((cur+1)%C.length)});tl.appendChild(nx);
function fmt(v,dec){return dec?v.toFixed(1):Math.round(v)}
function panel(i){var c=C[i];return '<blockquote>“'+c.q+'”</blockquote><div class="pp"><svg viewBox="0 0 56 56" aria-hidden="true"><defs><linearGradient id="pg'+i+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c.k+'"/><stop offset="1" stop-color="#14171a"/></linearGradient></defs><circle cx="28" cy="28" r="28" fill="url(#pg'+i+')"/><text x="28" y="35" text-anchor="middle" font-family="Newsreader,serif" font-weight="600" font-size="20" fill="#fff">'+ini(c.p)+'</text></svg><div><b>'+c.p+'</b><span>'+c.t+'</span></div></div><div class="mt">'+c.m.map(function(m,k){return '<div><b data-k="'+k+'">'+(reduce?fmt(m[0],m[0]%1):'0')+m[1]+'</b><span>'+m[2]+'</span><small><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l4-4 3 3 4-5"/></svg>'+m[3]+'</small></div>'}).join('')+'</div><a class="cs" href="#">Read the '+c.n+' case study<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>'}
function countUp(){if(reduce)return;var c=C[cur],els=pc.querySelectorAll('.mt b'),t0=performance.now();cancelAnimationFrame(cnt);
 (function f(t){var p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);els.forEach(function(el,k){var m=c.m[k];el.textContent=fmt(m[0]*e,m[0]%1)+m[1]});if(p<1)cnt=requestAnimationFrame(f)})(t0)}
function sel(i,focus){var first=pc.innerHTML==='';cur=i;tabs.forEach(function(t,k){t.setAttribute('aria-selected',k===i);t.tabIndex=k===i?0:-1});if(focus)tabs[i].focus();
 var c=C[i];document.documentElement.style.setProperty('--c',c.k);$('#pn').setAttribute('role','tabpanel');$('#pn').setAttribute('aria-labelledby','t'+i);
 var swap=function(){pc.innerHTML=panel(i);pc.classList.remove('out');countUp();if(tabs[i].scrollIntoView&&innerWidth<=860)tabs[i].scrollIntoView({block:'nearest',inline:'nearest'})};
 if(first||reduce){swap()}else{pc.classList.add('out');setTimeout(swap,230)}
 startRot()}
function startRot(){stopRot();tabs.forEach(function(t){var p=t.querySelector('.pr');p.classList.remove('on');p.firstChild.style.transition='none';p.firstChild.style.transform='scaleX(0)'});if(!auto||reduce)return;var p=tabs[cur].querySelector('.pr');p.classList.add('on');void p.offsetWidth;p.firstChild.style.transition='transform 8s linear';p.firstChild.style.transform='scaleX(1)';rot=setTimeout(function(){if(auto)sel((cur+1)%C.length)},8000)}
function stopRot(){clearTimeout(rot);rot=null;tabs.forEach(function(t){var p=t.querySelector('.pr');p.classList.remove('on')})}
$('#pn').addEventListener('mouseenter',function(){if(auto)stopRot()});$('#pn').addEventListener('mouseleave',function(){if(auto)startRot()});
sel(0);
})();
</script></body></html>
