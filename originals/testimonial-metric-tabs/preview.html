<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Results Tabs</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14201a;--mut:#607167;--ln:#dde4da;--ac:#1f8a5b}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#f5f7f4;color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;padding:56px 16px}
.w{max-width:1040px;margin:0 auto}
h1{font:700 clamp(30px,5vw,44px)/1.1 "Bricolage Grotesque";margin:0 0 24px;letter-spacing:-.02em}
.tb{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;align-items:center}
.tb button.t{display:flex;gap:10px;align-items:center;border:1.5px solid var(--ln);background:#fff;border-radius:14px;min-height:52px;padding:0 16px 0 10px;font:600 15px Inter;cursor:pointer;color:var(--ink);white-space:nowrap}
.tb .m{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font:700 15px "Bricolage Grotesque"}
.tb button.t[aria-selected=true]{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.pz{margin-left:auto;border:0;background:none;min-height:44px;padding:0 12px;font:600 13px Inter;color:var(--mut);cursor:pointer;text-decoration:underline;white-space:nowrap}
button:focus-visible,a:focus-visible{outline:3px solid #14201a88;outline-offset:2px}
.cd{margin-top:16px;background:#fff;border:1px solid var(--ln);border-radius:24px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);overflow:hidden;animation:fi .4s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.q{padding:36px;display:grid;gap:22px;align-content:space-between}
.q blockquote{margin:0;font:500 clamp(22px,3vw,28px)/1.3 "Bricolage Grotesque";letter-spacing:-.01em}
.q blockquote::before{content:"“";display:block;font-size:72px;line-height:.6;color:var(--c);margin-bottom:6px}
.at{display:flex;gap:12px;align-items:center}.at i{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 18px "Bricolage Grotesque";font-style:normal}
.at b{display:block}.at span{color:var(--mut);font-size:14px}
.q a{color:var(--c);font-weight:700;text-decoration:none}.q a:hover{text-decoration:underline}
.r{background:color-mix(in srgb,var(--c) 7%,#fff);padding:32px;display:grid;gap:22px;align-content:center}
.mt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mt div{background:#fff;border-radius:16px;padding:14px;border:1px solid var(--ln)}
.mt b{display:block;font:700 clamp(30px,4vw,44px)/1 "Bricolage Grotesque";color:var(--c);font-variant-numeric:tabular-nums}
.mt span{font-size:13px;color:var(--mut);display:block;margin-top:6px}
.cp b{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.br{display:grid;grid-template-columns:64px minmax(0,1fr) 54px;gap:10px;align-items:center;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
.br i{display:block;height:14px;border-radius:9px;background:#d5dcd3;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.br.a i{background:var(--c)}
@media(max-width:820px){.cd{grid-template-columns:minmax(0,1fr)}.q,.r{padding:22px}.mt b{font-size:30px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="w"><h1>Results our customers can point to</h1>
<div class="tb" role="tablist" aria-label="Customers" id="tb"></div><div id="pn" role="tabpanel" tabindex="0"></div></div>
<div id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden"></div>
<script>
const $=s=>document.querySelector(s),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
const C=[{n:"Kelp & Co.",c:"#1f8a5b",q:"We cut month-end close from nine days to three, and nobody has asked for a spreadsheet since.",p:"Odile Marsh",r:"Finance Director",m:[[67,"%","faster close"],[24,"h","saved per week"],[0,"","errors in Q3"]],b:["Close time","9 days","3 days",100,33]},
{n:"Halden Rail",c:"#2f64d6",q:"Dispatchers see the whole network on one screen now. Delays that took an hour to diagnose take five minutes.",p:"Jonas Pell",r:"Head of Operations",m:[[92,"%","on-time rate"],[12,"min","to diagnose delays"],[41,"%","fewer escalations"]],b:["Diagnosis","60 min","12 min",100,20]},
{n:"Tin Lantern",c:"#e0652b",q:"Our returns dropped by a third after we rewrote product pages with the new templates. The ROI was obvious within a month.",p:"Priya Holt",r:"E-commerce Lead",m:[[34,"%","fewer returns"],[18,"%","higher conversion"],[3,"x","faster launches"]],b:["Return rate","14%","9%",100,64]},
{n:"Oatly Moon",c:"#7a4fd3",q:"Support tickets per customer fell by half. The help centre now does the answering, and the team does the caring.",p:"Isla Ferndale",r:"VP Customer Care",m:[[52,"%","fewer tickets"],[96,"%","CSAT score"],[7,"hrs","avg. first reply"]],b:["Tickets / 100 users","21","10",100,48]}];
let cur=0,timer=null,paused=false,interacted=false;
const say=m=>{const l=$("#live");l.textContent="";setTimeout(()=>l.textContent=m,60)};
function tabs(){const t=$("#tb");t.innerHTML="";C.forEach((x,i)=>{const b=document.createElement("button");b.className="t";b.id="tab"+i;b.setAttribute("role","tab");b.setAttribute("aria-selected",i==cur);b.setAttribute("aria-controls","pn");b.tabIndex=i==cur?0:-1;b.style.setProperty("--c",x.c);b.innerHTML=`<span class="m" style="background:${x.c}">${x.n[0]}</span>${x.n}`;b.onclick=()=>{interacted=true;stop();go(i)};b.onkeydown=e=>{let j=i;if(e.key=="ArrowRight")j=(i+1)%C.length;else if(e.key=="ArrowLeft")j=(i+C.length-1)%C.length;else if(e.key=="Home")j=0;else if(e.key=="End")j=C.length-1;else return;e.preventDefault();interacted=true;stop();go(j);$("#tab"+j).focus()};t.append(b)});if(!rm){const p=document.createElement("button");p.className="pz";p.setAttribute("aria-pressed",paused||interacted);p.textContent=paused||interacted?"Auto-rotate off":"Pause auto-rotate";p.onclick=()=>{paused=!paused;if(paused){stop()}else{interacted=false;start()}tabs();$("#tab"+cur).blur()};t.append(p)}}
function show(){const x=C[cur];$("#pn").setAttribute("aria-labelledby","tab"+cur);$("#pn").style.setProperty("--c",x.c);document.querySelectorAll(".tb .t").forEach((b,i)=>{b.setAttribute("aria-selected",i==cur);b.tabIndex=i==cur?0:-1});
$("#pn").innerHTML=`<div class="cd"><div class="q"><blockquote></blockquote><div><div class="at"><i>${x.p[0]}</i><div><b>${x.p}</b><span>${x.r}, ${x.n}</span></div></div><p style="margin:16px 0 0"><a href="#">Read the ${x.n} story →</a></p></div></div><div class="r"><div class="mt">${x.m.map(m=>`<div><b data-n="${m[0]}" data-u="${m[1]}">0${m[1]}</b><span>${m[2]}</span></div>`).join("")}</div><div class="cp"><b>${x.b[0]}</b><div class="br"><span>Before</span><i data-w="${x.b[3]}"></i><span>${x.b[1]}</span></div><div class="br a"><span>After</span><i data-w="${x.b[4]}"></i><span>${x.b[2]}</span></div></div></div></div>`;$("#pn").querySelector("blockquote").textContent=x.q;
document.querySelectorAll("#pn [data-n]").forEach(e=>{const n=+e.dataset.n,u=e.dataset.u;if(rm){e.textContent=n+u;return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);e.textContent=Math.round(n*(1-Math.pow(1-k,3)))+u;if(k<1)requestAnimationFrame(f)})(t0)});
requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll("#pn [data-w]").forEach(e=>e.style.width=e.dataset.w+"%")))}
function go(i){cur=i;show();tabs();say(C[i].n)}
function start(){stop();if(rm||paused||interacted)return;timer=setInterval(()=>{cur=(cur+1)%C.length;show();tabs()},8000)}
function stop(){clearInterval(timer);timer=null}
$("#pn").addEventListener("pointerenter",stop);$("#pn").addEventListener("pointerleave",start);$("#pn").addEventListener("focusin",stop);
tabs();show();start();
</script></body></html>
