<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#fff;color:#0f172a;font:15px/1.6 "Public Sans",system-ui,sans-serif;padding:40px 20px}
.w{max-width:960px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:36px;align-items:start}
h1{grid-column:1/-1;font-size:28px;margin:0}
.sm{background:#f6f7fb;border-radius:18px;padding:24px;position:sticky;top:20px}
.av{font-size:56px;font-weight:800;line-height:1}.stars{color:#f5a524;letter-spacing:2px;font-size:18px}.stars i{color:#d5d9e6;font-style:normal}
.sm p{margin:4px 0 18px;color:#5b6478;font-size:14px}
.br{all:unset;box-sizing:border-box;display:grid;grid-template-columns:30px minmax(0,1fr) 26px;gap:8px;align-items:center;width:100%;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:13px}
.br:hover{background:#e9ecf6}.br[aria-pressed=true]{background:#fff;box-shadow:0 0 0 2px #0f172a}.br:focus-visible,.ch:focus-visible,select:focus-visible,.hl:focus-visible,.rm:focus-visible{outline:3px solid #2563eb}
.tr{height:8px;background:#dde1ee;border-radius:9px;overflow:hidden}.tr i{display:block;height:100%;background:#f5a524}
.ct{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.ch{all:unset;cursor:pointer;padding:5px 13px;border:1.5px solid #dde1ee;border-radius:99px;font-size:14px}.ch[aria-pressed=true]{background:#0f172a;color:#fff;border-color:#0f172a}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px;color:#5b6478}select{padding:6px 10px;border:1.5px solid #dde1ee;border-radius:8px;font:inherit;background:#fff;color:#0f172a}
.rv{padding:20px 0;border-bottom:1px solid #eceef6;animation:f .3s}@keyframes f{from{opacity:0}}
.rh{display:flex;gap:12px;align-items:center;margin-bottom:6px}.ia{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--c)}
.rh b{display:block;line-height:1.2}.rh small{color:#6b7488}.rv h3{margin:6px 0 4px;font-size:16px}.rv p{margin:0;color:#334155}
.rm{all:unset;cursor:pointer;color:#2563eb;font-weight:600;font-size:14px}.hl{margin-top:10px;padding:6px 14px;border:1.5px solid #dde1ee;background:#fff;border-radius:99px;font:600 13px "Public Sans";cursor:pointer}.hl[aria-pressed=true]{background:#e8f0ff;border-color:#2563eb;color:#1d4ed8}
.em{text-align:center;padding:40px 0;color:#5b6478}.em button{margin-top:8px;padding:8px 18px;border:0;background:#0f172a;color:#fff;border-radius:99px;font:600 14px "Public Sans";cursor:pointer}
@media(max-width:800px){.w{grid-template-columns:minmax(0,1fr)}.sm{position:static}}
@media(prefers-reduced-motion:reduce){.rv{animation:none}}
</style></head><body><div class="w"><h1>Ridgeline Trail Boots — customer reviews</h1>
<aside class="sm"><div class="av" id="av"></div><div class="stars" id="sr" aria-hidden="true"></div><p id="cn"></p><div id="bs"></div></aside>
<section><div class="ct" id="ct" role="group" aria-label="Filter by topic"></div><div class="bar"><span id="rc" aria-live="polite"></span><label>Sort <select id="so"><option value="new">Newest</option><option value="hi">Highest rated</option><option value="lo">Lowest rated</option><option value="hp">Most helpful</option></select></label></div><div id="ls"></div></section></div>
<script>
const R=[["Mara K.",5,"Worn in within a week","Wore these on a four-day traverse and never got a single blister. The sole grips wet granite better than anything I've owned, and after three rain days my feet were still dry. Sizing runs true.",["comfort","grip","waterproof"],"2026-09-28",24,"#2563eb"],["Dev O.",4,"Great, but heavy","Solid build and very supportive on steep descents. They're noticeably heavier than my old pair, which you feel on long flat sections.",["comfort","weight"],"2026-09-12",11,"#059669"],["Juno L.",5,"Best boots I've owned","Grip is outstanding, the lacing hardware is smart, and the leather is already softening nicely.",["grip","durability"],"2026-08-30",17,"#c026d3"],["Ansel W.",3,"Took a while to break in","Beautiful boots, but the heel rubbed for the first two weeks. Fine once softened; I'd size up half a size if you wear thick socks.",["comfort","sizing"],"2026-08-14",9,"#ea580c"],["Priya S.",5,"Waterproof as promised","Stood in a stream for a full minute to test it. Dry socks. I'm impressed and a bit surprised.",["waterproof"],"2026-07-29",31,"#0891b2"],["Tom H.",2,"Laces failed","The boots are lovely, but a lace eyelet pulled out after a month. Support was friendly and sent a replacement quickly, though.",["durability"],"2026-07-11",6,"#64748b"],["Sana R.",4,"Warm and sturdy","Used through a cold November weekend. Warm, stable, and the toe cap saved me from a rock. Slightly narrow at the toe.",["comfort","sizing"],"2026-06-23",8,"#7c3aed"],["Leo P.",5,"Worth every penny","Third pair I've bought, this one finally fixes the heel slip. Resoles are available too which seals it for me.",["durability","comfort"],"2026-06-02",19,"#dc2626"],["Iris N.",4,"Good grip on scree","Confident footing on loose scree. Dropped one star as the tongue is stiff.",["grip"],"2026-05-17",5,"#0d9488"],["Omar T.",1,"Wrong size shipped","Received the wrong size and the exchange took ten days. The boots themselves seem fine, but the process was slow.",["sizing"],"2026-05-04",3,"#475569"],["Beth C.",5,"Light for what they are","Surprisingly light for a full-grain boot. All-day comfort on a 22 km day.",["weight","comfort"],"2026-04-19",14,"#be185d"],["Yuki M.",4,"Reliable","Solid daily boot for local hikes. Cleaning is easy and the colour hides mud well.",["durability"],"2026-04-02",4,"#4d7c0f"]];
let rate=null,topic=new Set(),sort="new",voted=new Set(),exp=new Set();const $=i=>document.getElementById(i);
const star=n=>"★".repeat(n)+"<i>"+"★".repeat(5-n)+"</i>";
const avg=R.reduce((s,r)=>s+r[1],0)/R.length;$("av").textContent=avg.toFixed(1);$("sr").innerHTML=star(Math.round(avg));$("cn").textContent="from "+R.length+" reviews";
$("bs").innerHTML=[5,4,3,2,1].map(n=>{const c=R.filter(r=>r[1]==n).length;return`<button class="br" data-n="${n}" aria-pressed="false" aria-label="${n} stars, ${c} reviews"><span>${n} ★</span><span class="tr"><i style="width:${c/R.length*100}%"></i></span><span>${c}</span></button>`}).join("");
const tags=[...new Set(R.flatMap(r=>r[4]))].sort();$("ct").innerHTML=tags.map(t=>`<button class="ch" data-t="${t}" aria-pressed="false">${t}</button>`).join("");
function draw(){let l=R.map((r,i)=>({r,i})).filter(x=>(rate==null||x.r[1]==rate)&&[...topic].every(t=>x.r[4].includes(t)));
l.sort((a,b)=>sort=="new"?b.r[5].localeCompare(a.r[5]):sort=="hi"?b.r[1]-a.r[1]||b.r[5].localeCompare(a.r[5]):sort=="lo"?a.r[1]-b.r[1]:(b.r[6]+(voted.has(b.i)?1:0))-(a.r[6]+(voted.has(a.i)?1:0)));
$("rc").textContent=l.length+(l.length==1?" review":" reviews");
$("ls").innerHTML=l.length?l.map(({r,i})=>{const long=r[3].length>140,e=exp.has(i),body=long&&!e?r[3].slice(0,130).trim()+"…":r[3];return`<article class="rv"><div class="rh"><span class="ia" style="--c:${r[7]}">${r[0][0]}</span><div><b>${r[0]}</b><small>${new Date(r[5]).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})} · Verified</small></div></div><div class="stars" role="img" aria-label="${r[1]} out of 5 stars">${star(r[1])}</div><h3>${r[2]}</h3><p>${body} ${long?`<button class="rm" data-e="${i}" aria-expanded="${e}">${e?"Show less":"Read more"}</button>`:""}</p><button class="hl" data-h="${i}" aria-pressed="${voted.has(i)}">Helpful (${r[6]+(voted.has(i)?1:0)})</button></article>`}).join(""):'<div class="em">No reviews match these filters.<br><button id="clr">Clear filters</button></div>';
document.querySelectorAll(".br").forEach(b=>b.setAttribute("aria-pressed",rate==+b.dataset.n));document.querySelectorAll(".ch").forEach(b=>b.setAttribute("aria-pressed",topic.has(b.dataset.t)))}
$("bs").addEventListener("click",e=>{const b=e.target.closest(".br");if(!b)return;rate=rate==+b.dataset.n?null:+b.dataset.n;draw()});
$("ct").addEventListener("click",e=>{const b=e.target.closest(".ch");if(!b)return;topic.has(b.dataset.t)?topic.delete(b.dataset.t):topic.add(b.dataset.t);draw()});
$("so").onchange=()=>{sort=$("so").value;draw()};
$("ls").addEventListener("click",e=>{const x=e.target.closest("[data-e]"),h=e.target.closest("[data-h]");if(x){const i=+x.dataset.e;exp.has(i)?exp.delete(i):exp.add(i);draw();$("ls").querySelector(`[data-e="${i}"]`)?.focus()}if(h){const i=+h.dataset.h;voted.has(i)?voted.delete(i):voted.add(i);draw();$("ls").querySelector(`[data-h="${i}"]`)?.focus()}if(e.target.id=="clr"){rate=null;topic.clear();draw()}});
draw();
</script></body></html>
