<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#f6f0e6;color:#211c16;font:400 15px/1.5 Figtree,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #211c16;outline-offset:3px;box-shadow:0 0 0 6px #fff}
.hd{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center}
.wm{font:600 22px Fraunces,serif}.hd a{margin-left:auto;color:#211c16;font-weight:700}
.w{max-width:1180px;margin:0 auto;padding:0 20px 44px}
.eb{font:700 12px Figtree;letter-spacing:.16em;text-transform:uppercase;color:#1f6b4a;margin:6px 0 4px}
h1{font:600 clamp(30px,5vw,52px)/1.02 Fraunces,serif;margin:0 0 12px}

.rt svg{width:100%;height:100%;display:block;position:absolute;inset:0}
.pl{margin:10px 2px 18px;font-weight:700}
.main{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
.main>*{min-width:0}
.card{background:#fffdf8;border:1px solid #e6dac5;border-radius:18px;padding:16px 18px;margin-bottom:14px}
.st{list-style:none;margin:0;padding:0;position:relative}
.st:before{content:"";position:absolute;left:19px;top:22px;bottom:22px;width:4px;background:#e6dac5;border-radius:2px}
.st .fill{position:absolute;left:19px;top:22px;width:4px;background:#1f6b4a;border-radius:2px;transition:height .5s;height:0}
.st li{position:relative;margin-bottom:8px}
.sb{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#fffdf8;border:1.5px solid #e6dac5;border-radius:14px;padding:8px 12px 8px 8px;min-height:48px;cursor:pointer;font:inherit;color:#211c16}
.sb:hover{border-color:#cdbfa6}
.dot{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 15px Figtree;border:2.5px solid #cdbfa6;background:#fffdf8;color:#675d4e;position:relative;z-index:1}
.done .dot{background:#1f6b4a;border-color:#1f6b4a;color:#fff}
.cur .dot{background:#e29a2b;border-color:#e29a2b;color:#211c16}
.cur .dot:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #e29a2b;animation:pu 1.8s ease-out infinite}
@keyframes pu{from{transform:scale(.8);opacity:.9}to{transform:scale(1.35);opacity:0}}
.sb b{display:block;font-weight:700}.sb small{color:#675d4e}
.sb .tg{margin-left:auto;font:700 12px Figtree;letter-spacing:.06em;text-transform:uppercase;color:#675d4e}
.cur .tg{color:#8a5a0a}.done .tg{color:#1f6b4a}
.ch{width:16px;height:16px;transition:transform .2s;flex:none}.sb[aria-expanded=true] .ch{transform:rotate(180deg)}
.ev{margin:6px 0 4px 50px;padding:2px 0 6px;border-left:2px solid #e6dac5;padding-left:14px}
.ev div{margin:0 0 8px}.ev time{display:block;font:500 12px "DM Mono",monospace;color:#675d4e}
.demo{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.demo button{font:700 14px Figtree;border-radius:12px;min-height:46px;padding:0 16px;cursor:pointer}
.p{color:#fff;background:#1f6b4a;border:0}.p:hover{background:#17533a}.p[disabled]{background:#8aa396;cursor:not-allowed}
.s{color:#211c16;background:#fff;border:1.5px solid #211c16}
.eta h2{font:600 28px/1.15 Fraunces,serif;margin:0 0 8px}
.win{position:relative;height:48px;margin:12px 0 6px}

.win .nw{position:absolute;top:8px;width:3px;height:32px;background:#c4452f;border-radius:2px;transition:left .6s}.win .nw span{position:absolute;top:-4px;left:6px;font:700 11px Figtree;color:#c4452f;white-space:nowrap}

.cd{font:500 18px "DM Mono",monospace;color:#1f6b4a}

.cr b{display:block}.cr small{color:#675d4e}
.cr button{margin-left:auto;font:700 13px Figtree;border:1.5px solid #211c16;border-radius:10px;background:#fff;min-height:44px;padding:0 12px;cursor:pointer}
.ad{margin:0;color:#4a4136;font-style:normal;line-height:1.5}
.card h3{font:700 12px Figtree;letter-spacing:.12em;text-transform:uppercase;color:#675d4e;margin:0 0 8px}
.li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.li .t{width:52px;height:52px;border-radius:10px;overflow:hidden}.li .t svg{width:100%;height:100%;display:block}
.li span.pr{font-variant-numeric:tabular-nums;font-weight:700}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

function stepper(){var h='';STEPS.forEach(function(s,i){var st=i<P?'done':i===P?'cur':'up',op=open===i;h+='<li class="'+st+'"><button class="sb" id="sb'+i+'" aria-expanded="'+op+'" aria-controls="ev'+i+'"'+(i===P?' aria-current="step"':'')+'><span class="dot" aria-hidden="true">'+(i<P?'✓':i+1)+'</span><span><b>'+s[0]+'</b><small>'+(i<=P?s[1]:'Expected '+(i===4?'Thursday':s[1]))+'</small></span><span class="tg">'+(i<P?'Done':i===P?'Current':'Upcoming')+'</span>'+CHEV+'</button><div class="ev" id="ev'+i+'" role="region" aria-labelledby="sb'+i+'"'+(op?'':' hidden')+'>'+(i<=P?s[2].map(function(e){return'<div><time>'+e[0]+'</time><b>'+e[1]+'</b><br><span>'+e[2]+'</span></div>'}).join(''):'<div><span>Not started yet. We will update this step when it begins.</span></div>')+'</div></li>'});
var old=$('#fill');$('#st').innerHTML='<div class="fill" id="fill" style="height:'+(old?old.style.height:'0')+'"></div>'+h;
requestAnimationFrame(function(){var li=$('#st').children,f=$('#fill'),b=$('#sb'+P);var y=b.offsetTop+b.offsetHeight/2;var top=22;f.style.height=Math.max(0,P<=0?0:(document.getElementById('sb'+P).parentNode.offsetTop+22-top))+'px'});
document.querySelectorAll('.sb').forEach(function(b,i){b.onclick=function(e){open=open===i?-1:i;if(!e.shiftKey&&open===i){}stepper();$('#sb'+i).focus()};b.onkeydown=function(e){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();var n=i+(e.key==='ArrowDown'?1:-1);if(n>=0&&n<5)$('#sb'+n).focus()}}})}
var road=$('#rp'),van=$('#van'),pos=0,anim=0;
var POS=[0,.22,.5,.8,1];
function setVan(t){var L=road.getTotalLength(),p=road.getPointAtLength(t*L),q=road.getPointAtLength(Math.min(L,t*L+3)),a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI*.4;van.setAttribute('transform','translate('+p.x+' '+(p.y-14)+') rotate('+a+')')}
function moveVan(to,quick){cancelAnimationFrame(anim);if(reduce||quick){pos=to;setVan(to);return}var from=pos,t0=performance.now(),dur=1400;(function f(t){var k=Math.min(1,(t-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;pos=from+(to-from)*e;setVan(pos);if(k<1)anim=requestAnimationFrame(f)})(t0)}
function eta(){var e=$('#eta'),slotA=12,slotB=15,ax=function(h){return(h-8)/12*100},now=P>=3?(P===3?10.1:13.7):8;
var h='<h3>Estimated arrival</h3>';
if(P<3){h+='<h2>Arrives Thursday</h2><p style="margin:0;color:#675d4e">Your delivery window will be confirmed on the morning of delivery.</p>'}
else if(P===3){h+='<h2>Arrives Thursday, 12:00 to 15:00</h2><div class="win"><div class="ax"></div><div class="slot" style="left:'+ax(slotA)+'%;width:'+(ax(slotB)-ax(slotA))+'%"></div><div class="nw" style="left:'+ax(now)+'%"><span>Now 10:06</span></div>'+[8,12,16,20].map(function(t){return'<span class="tk" style="left:'+ax(t)+'%">'+('0'+t).slice(-2)+':00</span>'}).join('')+'</div><p style="margin:14px 0 0">Arriving in about <span class="cd" id="cd" role="timer">1:54:00</span></p>'}
else{h+='<h2>Delivered at 13:42</h2><p style="margin:0;color:#675d4e">Left in a safe place at the front door. A photo is in your email.</p>'}
e.innerHTML=h}
var cd=null,secs=1*3600+54*60;
function tickCd(){clearInterval(cd);if(P!==3)return;secs=1*3600+54*60;cd=setInterval(function(){secs=Math.max(0,secs-1);var el=$('#cd');if(!el)return;el.textContent=Math.floor(secs/3600)+':'+('0'+Math.floor(secs/60)%60).slice(-2)+':'+('0'+secs%60).slice(-2);if(secs%300===0)$('#live').textContent='About '+Math.round(secs/60)+' minutes until delivery.'},1000)}
function labels(){$('#pl').textContent='Step '+(P+1)+' of 5: '+STEPS[P][0]+(P===4?'. Your parcel has arrived.':'');$('#nx').disabled=P>=4}
function all(quick){stepper();eta();labels();moveVan(POS[P],quick);tickCd();try{localStorage.setItem('ko-p',P)}catch(e){}}
$('#nx').onclick=function(){if(P<4){P++;open=P;all(false);$('#live').textContent='Step '+(P+1)+': '+STEPS[P][0]+'. '+STEPS[P][2][0][1]+'.'}};
$('#rs').onclick=function(){P=2;open=2;all(false);$('#live').textContent='Reset to Shipped.'};
$('#msg').onclick=function(){$('#live').textContent='Message window opened (demo).'};
open=P;all(true);
})();
</script></body></html>
