if(k==='ArrowRight'&&ord[i+1])go(ord[i+1]);else if(k==='ArrowLeft'&&ord[i-1])go(ord[i-1]);else if(k==='ArrowUp'||k==='ArrowDown'){if(s.ln.length>1){var j=s.ln.indexOf(ctx);ctx=s.ln[(j+(k==='ArrowDown'?1:s.ln.length-1))%s.ln.length];$('#live').textContent='Now travelling on the '+L[ctx].n+' line.'}}}
function go(id){rove(id);sbtn[id].focus();sel(id,false)}
function sel(id,focus){cur=id;var s=byId[id];if(s.ln.indexOf(ctx)<0)ctx=s.ln[0];Object.keys(sbtn).forEach(function(k){sbtn[k].classList.toggle('sel',k===id)});rove(id);panel(s);try{localStorage.setItem('sm-sel',id)}catch(e){}}
function glyph(s){var t=st2(s);return t==='Done'?'✓ Done':t==='In progress'?'◐ In progress':'○ Upcoming'}
function scene(v,seed){if(v==='site')return SC.landscape(seed,{pal:'desert',w:480,h:260,trees:3,sunR:16});if(v==='crowd')return SC.city(seed,{pal:'dusk',w:480,h:260});if(v==='table')return SC.interior(seed,{w:480,h:260,wall:'#dfe7f2',acc:'#2f56d4'});if(v==='wall')return SC.abstract(seed,{w:480,h:260,cols:['#e9a93c','#2f56d4','#c4532f','#f3e7cf','#1c1812'],n:6});if(v==='floor')return SC.interior(seed,{w:480,h:260,wall:'#efe3cd',acc:'#1f7a58'});return SC.interior(seed,{w:480,h:260,wall:'#f0dfc4',acc:'#c4532f'})}
function panel(s){var seed=s.x*5+s.y;var oth=s.ln.length>1;$('#pn').innerHTML='<div class="im" role="img" aria-label="Illustration for '+s.n+'">'+scene(s.v,seed)+'<span class="av" role="img" aria-label="Owner portrait">'+SC.portrait(seed*3+2,{w:120,h:150})+'</span></div>'+s.ln.map(function(k){return'<span class="bd" style="background:'+L[k].c+';color:'+L[k].tc+'">'+L[k].n+'</span>'}).join('')+'<h2>'+s.n+'</h2><div class="meta">'+ds(s.d)+' · Owner: '+s.o+'</div><div class="stt">'+glyph(s)+'</div><p>'+s.t+'</p>'+(oth?'<div class="also" role="group" aria-label="Other lines at this station">'+s.ln.map(function(k){return'<button data-k="'+k+'">Travel on '+L[k].n+'</button>'}).join('')+'</div>':'')}
$('#pn').addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(!b)return;ctx=b.dataset.k;var o=ORDER[ctx],s=byId[cur],i=o.indexOf(cur),n=o[i+1]||o[i-1];$('#live').textContent='Travelling on the '+L[ctx].n+' line to '+byId[n].n+'.';go(n)});
// filters
var fl=$('#fl');fl.innerHTML='<button data-f="all" aria-pressed="true">All lines</button>'+Object.keys(L).map(function(k){return'<button data-f="'+k+'" aria-pressed="false"><i style="background:'+L[k].c+'"></i>'+L[k].n+'</button>'}).join('');
fl.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;filter=b.dataset.f;fl.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});applyF();$('#live').textContent=filter==='all'?'Showing all lines.':'Showing the '+L[filter].n+' line.'});
function applyF(){document.querySelectorAll('.lnp').forEach(function(g){g.classList.toggle('dim',filter!=='all'&&g.dataset.l!==filter)});S.forEach(function(s){sbtn[s.id].classList.toggle('inact',filter!=='all'&&s.ln.indexOf(filter)<0)});buildList()}
// list
function buildList(){var h='';Object.keys(L).forEach(function(k){if(filter!=='all'&&filter!==k)return;h+='<h3><span class="bd" style="background:'+L[k].c+';color:'+L[k].tc+'">'+L[k].n+'</span><span class="meta">'+L[k].r+'</span></h3><ol style="--c:'+L[k].c+'">'+ORDER[k].map(function(i){var s=byId[i];return'<li><button data-id="'+i+'"><span>'+s.n+(s.ln.length>1?' <span class="chip">Interchange</span>':'')+'</span><small>'+ds(s.d)+'</small><span class="chip">'+glyph(s)+'</span></button></li>'}).join('')+'</ol>'});$('#ls').innerHTML=h}
$('#ls').addEventListener('click',function(e){var b=e.target.closest('[data-id]');if(b){sel(b.dataset.id,true)}});
// legend, status
$('#lg').innerHTML=Object.keys(L).map(function(k){return'<span><i style="background:'+L[k].c+'"></i>'+L[k].n+' ('+L[k].r+')</span>'}).join('')+'<span>● done · ○ upcoming · large ring = interchange</span>';
var done=S.filter(function(s){return s.done}).length;$('#sub').textContent='Now: Prototype, '+Math.round(done/S.length*100)+'% of stations reached.';
// views
var narrow=innerWidth<760,view=narrow?'list':'map';try{view=localStorage.getItem('sm-view')||view}catch(e){}
function setView(v,focus){view=v;try{localStorage.setItem('sm-view',v)}catch(e){}$('#mw').hidden=v!=='map';$('#ls').hidden=v!=='list';[$('#tm'),$('#tl')].forEach(function(b){var on=b.dataset.v===v;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;if(on&&focus)b.focus()})}
[$('#tm'),$('#tl')].forEach(function(b){b.onclick=function(){setView(b.dataset.v)};b.onkeydown=function(e){if(['ArrowLeft','ArrowRight','Home','End'].indexOf(e.key)>-1){e.preventDefault();setView(view==='map'?'list':'map',true)}}});
buildList();var start='pro';try{var sv=localStorage.getItem('sm-sel');if(sv&&byId[sv])start=sv}catch(e){}
sel(start,false);rove(start);setView(view);
})();
</script></body></html>
