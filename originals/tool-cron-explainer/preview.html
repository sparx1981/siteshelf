<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cron Explainer — Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--br:#e3b04b;--pn:#221d15;--bd:#3d3424;--mut:#c8bb9f;--ok:#7fd49a;--bad:#ff8a7a;--ink:#f6efe0}
body{margin:0;background:#17140f;background-image:radial-gradient(900px 400px at 50% -80px,rgba(227,176,75,.16),transparent 70%);color:var(--ink);font:400 14.5px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px #17140f}
.w{max-width:1200px;margin:0 auto;padding:16px 16px 44px}
.ban{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px clamp(18px,4vw,44px);min-height:240px}
.ban>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tx{position:relative;max-width:620px}
.eb{font:600 12px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--br);margin:0 0 4px;display:flex;align-items:center;gap:8px}
h1{font:700 clamp(30px,5vw,54px)/1.02 "Playfair Display",serif;margin:0 0 10px;text-shadow:0 2px 18px rgba(0,0,0,.7)}
.lede{margin:0;color:var(--ink);background:rgba(23,20,15,.7);border-radius:10px;padding:8px 12px;max-width:50ch}
.clk{position:relative;flex:none;width:200px;text-align:center}
.clk svg{width:200px;height:200px;display:block;filter:drop-shadow(0 14px 14px rgba(0,0,0,.5))}
.plate{display:inline-block;white-space:nowrap;margin-top:6px;background:#f1e8d0;color:#2a2008;border-radius:6px;padding:3px 10px;font:500 12.5px "IBM Plex Mono",monospace;box-shadow:inset 0 0 0 2px #b99a4b}
.tick{position:relative;margin-top:14px;background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:18px clamp(18px,3vw,30px);
 background-image:radial-gradient(circle at 0 50%,#17140f 9px,transparent 10px),radial-gradient(circle at 100% 50%,#17140f 9px,transparent 10px);background-repeat:no-repeat}
.tick label.l{font:600 12px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.inp{display:block;width:100%;margin:6px 0 10px;min-height:60px;background:#120f0a;color:var(--ink);border:2px dashed #6b5a34;border-radius:10px;padding:0 16px;font:500 clamp(20px,4.6vw,30px) "IBM Plex Mono",monospace;letter-spacing:.06em}
.inp[aria-invalid=true]{border-color:var(--bad)}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:10px}
.strip div{background:#120f0a;border:1.5px solid #3d3424;border-radius:10px;padding:6px 8px;text-align:center;min-width:0}
.strip div.bad{border-color:var(--bad);background:#33150f}
.strip b{display:block;font:500 17px "IBM Plex Mono",monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:26px}
.strip small{font:600 10.5px Inter;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.err{min-height:22px;margin:0 0 8px;color:var(--bad);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{min-height:44px;padding:0 14px;border-radius:99px;border:1.5px solid #6b5a34;background:transparent;color:var(--ink);font:600 13px Inter;cursor:pointer}
.chip:hover{background:#2c251a}
.seg{display:inline-flex;border:1.5px solid #6b5a34;border-radius:99px;overflow:hidden;margin-left:auto}
.seg label{position:relative}.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:block;min-height:42px;line-height:42px;padding:0 16px;font-weight:600}
.seg input:checked+span{background:var(--br);color:#2a2008}.seg input:focus-visible+span{outline:3px solid var(--ink);outline-offset:-4px}
.cp{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--br);color:#2a2008;font:600 14px Inter;cursor:pointer}
.sent{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:18px clamp(18px,3vw,30px);margin-top:14px}
.sent p{font:700 clamp(22px,3.6vw,32px)/1.25 "Playfair Display",serif;margin:0}
.sent em{color:var(--br);font-style:italic}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
.main>div{min-width:0}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.pn h2{font:600 13px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:8px;border-bottom:1px solid #342c1d;vertical-align:top}
th{font:600 11.5px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
td.t{font:500 14px "IBM Plex Mono",monospace;color:var(--br);white-space:nowrap}
.runs{list-style:none;margin:0;padding:0}
.runs li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #342c1d}
.runs li:last-child{border:0}
.runs .dn{font:600 12px Inter;color:#2a2008;background:var(--br);border-radius:8px;text-align:center;padding:4px 0}
.runs .tm{font:500 14.5px "IBM Plex Mono",monospace}
.runs .rl{color:var(--mut);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font:600 11px Inter;letter-spacing:.1em;color:var(--mut);text-align:center}
.cal .d{min-height:58px;border-radius:10px;background:#120f0a;border:1.5px solid #342c1d;padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.cal .d .n{font:600 11.5px Inter;color:var(--mut)}
.cal .d .c{font:500 12px "IBM Plex Mono",monospace;text-align:right;color:var(--ink)}
.cal .d .dots{display:flex;gap:3px;min-height:7px}.cal .d .dots i{width:7px;height:7px;border-radius:50%;background:var(--br)}
.cal .d.on{background:#2d2514;border-color:#7a6430}.cal .d.hv{background:#44351a;border-color:var(--br)}
.cal .d.td{box-shadow:0 0 0 2px var(--ink)}
.none{color:var(--mut);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#hh,#mh{transform-origin:100px 100px;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
@media(max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){.ban{flex-direction:row;align-items:flex-end;padding-bottom:16px}.clk{width:96px;align-self:flex-end}.clk svg{width:96px;height:96px}.plate{font-size:9.5px;padding:2px 5px;white-space:nowrap;margin-left:-6px}.strip{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.strip div{padding:5px 2px}.strip b{font-size:14px}.strip small{font-size:8.5px;letter-spacing:.04em}.seg{margin-left:0}.cal{gap:3px}.cal .d{min-height:50px;padding:3px}}
@media(prefers-reduced-motion:reduce){#hh,#mh{transition:none}}
</style></head><body>
<div class="w">
<header class="ban">
 <svg class="bg" id="bn" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
 <div class="tx">
  <p class="eb"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="#e3b04b" stroke-width="2"/><path d="M10 5v5l3 2" stroke="#e3b04b" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Tickwell</p>
  <h1>Cron Explainer</h1>
  <p class="lede">Type five fields, read one sentence. See exactly when the next runs land.</p>
 </div>
 <div class="clk"><svg viewBox="0 0 200 200" role="img" aria-label="Station clock showing the next run time" id="clock">
  <defs><linearGradient id="brz" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7dc8e"/><stop offset=".5" stop-color="#b8892f"/><stop offset="1" stop-color="#6e4d14"/></linearGradient><radialGradient id="dial" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e6dab9"/></radialGradient></defs>
  <circle cx="100" cy="100" r="96" fill="url(#brz)"/><circle cx="100" cy="100" r="88" fill="#4b350d"/><circle cx="100" cy="100" r="84" fill="url(#dial)"/>
  <g id="tk"></g>
  <g id="hh"><path d="M97 100V52L100 44L103 52V100Z" fill="#241a08"/></g>
  <g id="mh"><path d="M98.2 104V26L100 16L101.8 26V104Z" fill="#241a08"/></g>
  <circle cx="100" cy="100" r="6" fill="#b8892f"/><circle cx="100" cy="100" r="2.4" fill="#241a08"/>
  <path d="M40 60C52 36 84 24 118 30" stroke="#fff" stroke-opacity=".5" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
  <span class="plate" id="plate">Next: –</span></div>
</header>

<section class="tick" aria-labelledby="lx">
 <label class="l" id="lx" for="x">Cron expression</label>
 <input class="inp" id="x" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="err" value="0 9 * * 1-5">
 <div class="strip" id="strip" aria-hidden="true"></div>
 <p class="err" id="err" role="alert"></p>
 <div class="row" role="group" aria-label="Presets">
  <button class="chip" data-x="*/15 * * * *">Every 15 minutes</button><button class="chip" data-x="0 9 * * 1-5">Weekdays at 9</button><button class="chip" data-x="30 2 * * *">Nightly 02:30</button><button class="chip" data-x="0 0 1 * *">First of month</button><button class="chip" data-x="0 8 1 1,4,7,10 *">Quarterly</button><button class="chip" data-x="0 6,18 * * *">Twice a day</button>
  <div class="seg" role="radiogroup" aria-label="Time zone"><label><input type="radio" name="tz" value="local" checked><span>Local</span></label><label><input type="radio" name="tz" value="utc"><span>UTC</span></label></div>
  <button class="cp" id="cp">Copy</button>
 </div>
</section>
<section class="sent" aria-label="Plain English"><p id="sent">–</p><p class="sr" id="live" role="status" aria-live="polite"></p></section>
<div class="main">
 <div>
  <section class="pn" aria-labelledby="hb"><h2 id="hb">Breakdown</h2>
   <div class="tw" tabindex="0" role="region" aria-label="Breakdown table, scrolls sideways"><table><thead><tr><th>Field</th><th>Token</th><th>Meaning</th><th>Allowed</th></tr></thead><tbody id="bk"></tbody></table></div></section>
  <section class="pn" aria-labelledby="hn"><h2 id="hn">Next five runs</h2><ul class="runs" id="runs"></ul><p class="none" id="nr" hidden>No run in the next 4 years.</p></section>
 </div>
 <div>
  <section class="pn" aria-labelledby="hc"><h2 id="hc">Next five weeks</h2><div class="cal" id="cal" role="list" aria-label="Calendar of run counts per day"></div></section>
 </div>
</div>
</div>
<script>
/*SCENES-START*/
var SC=(function(){
 var uid=0,s=1;function id(p){return p+(++uid)}
 function R(seed){var x=seed||1;return function(){x=(x*9301+49297)%233280;return x/233280}}
 var PAL={
  dusk:{sky:['#1b1740','#4b2a78','#c2477a','#ff9a62','#ffd9a0'],sun:'#fff0c4',ridge:['#7a3a7e','#522c68','#2f1c4d','#1a1033'],mist:'#ffb48a',star:1},
  dawn:{sky:['#2a3a78','#7a7fc4','#f2a6a0','#ffd9a8','#fff3d6'],sun:'#fffbe8',ridge:['#8a8fc0','#6a6aa8','#4a4a88','#2a2a5a'],mist:'#ffe1c4'},
  alpine:{sky:['#4a86c8','#8bbbe6','#cfe6f6','#f4f9ff'],sun:'#fff',ridge:['#b7c8d8','#8aa1b8','#5d7690','#35495f'],mist:'#fff',snow:1},
  desert:{sky:['#e08a4c','#f2b26a','#f8d79a','#fff0cc'],sun:'#fffbe4',ridge:['#d9824a','#b8603a','#8a4230','#5a2a22'],mist:'#ffd9a0'},
  coast:{sky:['#5aa3d8','#9ccdee','#d6ecf8','#fff6e6'],sun:'#fff',ridge:['#7fa3a8','#4f7f86','#2d5a62','#173a42'],mist:'#fff'},
  night:{sky:['#05081a','#0d1840','#1d3170','#3a4f9a'],sun:'#e8eeff',ridge:['#1b2a5a','#111c42','#0a122e','#050818'],mist:'#5a6fc0',star:2},
  forest:{sky:['#9bc7b0','#cfe3c8','#f2f0d0','#fff8dc'],sun:'#fff8d8',ridge:['#7fa889','#4f7d63','#2f5a46','#183a2c'],mist:'#e8f2d8'},
  gold:{sky:['#3a2410','#a85a1c','#f0a03a','#ffe0a0'],sun:'#fff4c8',ridge:['#8a4a1a','#5e3010','#3a1c08','#1e0e04'],mist:'#ffc060',star:0}};
 function grad(i,stops,vert){var n=stops.length;return '<linearGradient id="'+i+'" x1="0" y1="0" x2="'+(vert===false?1:0)+'" y2="'+(vert===false?0:1)+'">'+stops.map(function(c,k){return '<stop offset="'+(k/(n-1)).toFixed(2)+'" stop-color="'+c+'"/>'}).join('')+'</linearGradient>'}
 function grain(op){var i=id('gn');return '<filter id="'+i+'" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .6 0"/></filter><rect width="100%" height="100%" filter="url(#'+i+')" opacity="'+(op==null?.22:op)+'" style="mix-blend-mode:overlay"/>'}
 function vig(w,h,str){var i=id('vg');return '<radialGradient id="'+i+'" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="'+(str==null?.45:str)+'"/></radialGradient><rect width="'+w+'" height="'+h+'" fill="url(#'+i+')"/>'}
 function wrap(w,h,inner,cls){return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"'+(cls?' class="'+cls+'"':'')+'>'+inner+'</svg>'}
 function ridge(r,w,base,amp,col,rough,id2){var d='M0 '+(base+amp)+' ',x=0,y;var pts=[];var n=Math.round(w/16);var ph=r()*6;for(var i=0;i<=n;i++){var xx=i/n*w,v=Math.sin(i*.35+ph)*.5+Math.sin(i*.9+ph*2)*.25+(r()-.5)*rough;pts.push([xx,base-v*amp])}d='M0 '+(base+amp*3)+' L'+pts.map(function(p){return p[0].toFixed(0)+' '+p[1].toFixed(1)}).join(' L')+' L'+w+' '+(base+amp*3)+'Z';return '<path d="'+d+'" fill="'+col+'"/>'}
 function landscape(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),g2=id('sn');var sunY=o.sunY!=null?o.sunY:h*.52,sunX=o.sunX!=null?o.sunX:w*(.3+r()*.4);
  var out='<defs>'+grad(g,P.sky)+'<radialGradient id="'+g2+'"><stop offset="0" stop-color="'+P.sun+'"/><stop offset=".25" stop-color="'+P.sun+'" stop-opacity=".9"/><stop offset="1" stop-color="'+P.sun+'" stop-opacity="0"/></radialGradient></defs><rect width="'+w+'" height="'+h+'" fill="url(#'+g+')"/>';
  if(P.star){for(var i=0;i<(P.star===2?160:70);i++)out+='<circle cx="'+(r()*w).toFixed(0)+'" cy="'+(r()*h*.5).toFixed(0)+'" r="'+(.5+r()*1.4).toFixed(1)+'" fill="#fff" opacity="'+(.3+r()*.7).toFixed(2)+'"/>'}
  if(P.snow||o.clouds){for(var c=0;c<(o.clouds||5);c++){var cx=r()*w,cy=h*(.12+r()*.28);out+='<g opacity=".75" fill="#fff"><ellipse cx="'+cx.toFixed(0)+'" cy="'+cy.toFixed(0)+'" rx="'+(90+r()*120).toFixed(0)+'" ry="'+(14+r()*14).toFixed(0)+'" opacity=".6"/><ellipse cx="'+(cx+40).toFixed(0)+'" cy="'+(cy-10).toFixed(0)+'" rx="'+(60+r()*70).toFixed(0)+'" ry="'+(12+r()*10).toFixed(0)+'" opacity=".5"/></g>'}}
  out+='<circle cx="'+sunX.toFixed(0)+'" cy="'+sunY.toFixed(0)+'" r="'+(h*.5)+'" fill="url(#'+g2+')" opacity=".55"/><circle cx="'+sunX.toFixed(0)+'" cy="'+sunY.toFixed(0)+'" r="'+(o.sunR||h*.06)+'" fill="'+P.sun+'"/>';
  var bases=[h*.56,h*.64,h*.74,h*.86];P.ridge.forEach(function(col,i){out+=ridge(r,w,bases[i],h*(.07+i*.01),col,.5-i*.08);if(i<P.ridge.length-1){var mi=id('ms');out+='<defs><linearGradient id="'+mi+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P.mist+'" stop-opacity="0"/><stop offset="1" stop-color="'+P.mist+'" stop-opacity=".45"/></linearGradient></defs><rect y="'+(bases[i]-10)+'" width="'+w+'" height="'+(h*.2)+'" fill="url(#'+mi+')"/>'}});
  if(o.trees!==false){var tc=P.ridge[3];for(var t=0;t<(o.trees||26);t++){var tx=r()*w,ty=h*(.86+r()*.1),th=h*(.06+r()*.1);out+='<path d="M'+tx.toFixed(0)+' '+(ty-th).toFixed(0)+' L'+(tx-th*.28).toFixed(0)+' '+ty.toFixed(0)+' L'+(tx+th*.28).toFixed(0)+' '+ty.toFixed(0)+'Z" fill="'+tc+'"/>'}}
  out+='<rect y="'+(h*.92)+'" width="'+w+'" height="'+(h*.08)+'" fill="'+P.ridge[3]+'"/>'+grain(o.grain)+vig(w,h,o.vig);return wrap(w,h,out,o.cls)}
 function sea(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),gs=id('sa'),hz=h*.5;var sx=w*(.35+r()*.3);
  var out='<defs>'+grad(g,P.sky)+grad(gs,[P.sky[2],P.ridge[1],P.ridge[3]])+'</defs><rect width="'+w+'" height="'+hz+'" fill="url(#'+g+')"/><rect y="'+hz+'" width="'+w+'" height="'+(h-hz)+'" fill="url(#'+gs+')"/>';
  out+='<circle cx="'+sx+'" cy="'+(hz-h*.04)+'" r="'+(h*.05)+'" fill="'+P.sun+'"/><circle cx="'+sx+'" cy="'+(hz-h*.04)+'" r="'+(h*.2)+'" fill="'+P.sun+'" opacity=".25"/>';
  for(var i=0;i<46;i++){var y=hz+4+Math.pow(r(),1.6)*(h-hz-6),ww=20+(y-hz)*(1.2+r()*3),x=sx+(r()-.5)*(60+(y-hz)*1.4);out+='<rect x="'+(x-ww/2).toFixed(0)+'" y="'+y.toFixed(0)+'" width="'+ww.toFixed(0)+'" height="'+(1+(y-hz)/90).toFixed(1)+'" rx="2" fill="'+P.sun+'" opacity="'+(.15+r()*.5).toFixed(2)+'"/>'}
  for(i=0;i<40;i++){var y2=hz+10+r()*(h-hz-10);out+='<path d="M'+(r()*w).toFixed(0)+' '+y2.toFixed(0)+' q'+(20+r()*40).toFixed(0)+' -6 '+(60+r()*80).toFixed(0)+' 0" stroke="#fff" stroke-opacity=".12" fill="none"/>'}
  out+=ridge(r,w,hz+4,h*.015,P.ridge[2],.2)+grain(o.grain)+vig(w,h);return wrap(w,h,out,o.cls)}
 function city(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'night'],r=R(seed),g=id('sk');var out='<defs>'+grad(g,P.sky)+'</defs><rect width="'+w+'" height="'+h+'" fill="url(#'+g+')"/>';
  if(P.star)for(var i=0;i<60;i++)out+='<circle cx="'+(r()*w).toFixed(0)+'" cy="'+(r()*h*.4).toFixed(0)+'" r="'+(.5+r()*1.2).toFixed(1)+'" fill="#fff" opacity="'+(.3+r()*.6).toFixed(2)+'"/>';
  for(var L=0;L<3;L++){var x=-20,col=P.ridge[L],base=h*(.7+L*.1),wl=L===2;while(x<w){var bw=30+r()*70,bh=h*(.12+r()*(.3-L*.07));out+='<rect x="'+x.toFixed(0)+'" y="'+(base-bh).toFixed(0)+'" width="'+bw.toFixed(0)+'" height="'+(bh+h*.3).toFixed(0)+'" fill="'+col+'"/>';
   var step=wl?11:16;for(var yy=base-bh+10;yy<base-4;yy+=step){for(var xx=x+6;xx<x+bw-8;xx+=step){if(r()>(wl?.55:.7))out+='<rect x="'+xx.toFixed(0)+'" y="'+yy.toFixed(0)+'" width="4" height="6" fill="'+(r()>.6?'#ffe2a0':'#ffc66e')+'" opacity="'+(.5+r()*.5).toFixed(2)+'"/>'}}x+=bw+2+r()*6}
   var mi=id('ms');out+='<defs><linearGradient id="'+mi+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P.mist+'" stop-opacity="0"/><stop offset="1" stop-color="'+P.mist+'" stop-opacity=".35"/></linearGradient></defs><rect y="'+(base-h*.1)+'" width="'+w+'" height="'+(h*.2)+'" fill="url(#'+mi+')"/>'}

 else{var mp=m.star&&!mStep?'every minute':mStep?'every '+mStep[1]+' minutes':(runsOf(m.set).length===1&&m.set.length>2?'every minute from '+m.set[0]+' through '+m.set[m.set.length-1]:rng(m.set,'minute','minutes'));

 if(!dm.star){var ds=/^\*\/(\d+)$/.exec(dm.tok);day.push(ds?'every '+ord(+ds[1])+' day of the month':'on '+rng(dm.set,'day','days')+(mo.star?' of the month':''))}

function bk(F,toks){return F.map(function(f,i){var d=DEF[i],tk=toks[i],txt;
 if(f.tok==='*')txt='every '+d.n.toLowerCase();else if(/^\*\/\d+$/.test(f.tok))txt='every '+f.tok.split('/')[1]+' '+d.n.toLowerCase()+'s';else if(i===4)txt=nameList(f,DN,true);else if(i===3)txt=nameList(f,[''].concat(MN),false);else txt=f.set.length>6?f.set.slice(0,5).join(', ')+' … ('+f.set.length+' values)':(i===2?'day ':d.n.toLowerCase()+' ')+f.set.join(', ');

var utc=false;
function mk(y,mo,d,h,mi){return utc?new Date(Date.UTC(y,mo,d,h,mi)):new Date(y,mo,d,h,mi)}
function parts(dt){return utc?{y:dt.getUTCFullYear(),m:dt.getUTCMonth(),d:dt.getUTCDate(),w:dt.getUTCDay(),h:dt.getUTCHours(),mi:dt.getUTCMinutes()}:{y:dt.getFullYear(),m:dt.getMonth(),d:dt.getDate(),w:dt.getDay(),h:dt.getHours(),mi:dt.getMinutes()}}

function next(F,n){var now=new Date(),start=now.getTime()+60000,out=[],p0=parts(new Date(start));
 for(var k=0;k<366*4&&out.length<n;k++){var dd=mk(p0.y,p0.m,p0.d+k,12,0),p=parts(dd);if(!dayOk(F,p))continue;

function rel(ms){var s=Math.max(0,Math.round(ms/60000)),d=Math.floor(s/1440),h=Math.floor(s%1440/60),m=s%60;return d?d+'d '+h+'h':h?h+'h '+m+'m':m+'m'}

 runs.forEach(function(t,i){var li=document.createElement('li');li.innerHTML='<span class="dn">#'+(i+1)+'</span><span class="tm">'+fm.format(t)+' · '+tf.format(t)+(utc?' UTC':'')+'</span><span class="rl">in '+rel(t-now)+'</span>';ul.appendChild(li)});
 $('#plate').textContent=runs[0]?'Next: '+fm.format(runs[0]).split(',')[0].replace(/\s.*$/,'')+' '+tf.format(runs[0]):'Next: never';
 hands(runs[0]);

 for(var k=0;k<35;k++){var dd=mk(p0.y,p0.m,p0.d-wd+k,12,0),p=parts(dd),ok=dayOk(F,p),c=ok?per:0,el=document.createElement('div');

 return sent}
