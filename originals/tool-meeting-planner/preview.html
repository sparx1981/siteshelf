<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Time Planner — Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--ink:#10213a;--mut:#4b5d78;--bl:#1f5fd1;--bd:#d3deec;--wk:#bfe8d4;--sh:#fde8b8;--nt:#1e2b4a}
body{margin:0;background:#eaf1f8;color:var(--ink);font:400 14.5px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px #fff}
.w{max-width:1240px;margin:0 auto;padding:16px 16px 44px}
.ban{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--bd);background:#fff}
.ban .tx{padding:24px clamp(18px,4vw,40px) 6px}
.eb{font:600 12px "DM Sans";letter-spacing:.16em;text-transform:uppercase;color:var(--bl);margin:0 0 4px;display:flex;align-items:center;gap:8px}
h1{font:800 clamp(30px,5vw,52px)/1.03 Manrope,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.lede{margin:0 0 10px;color:var(--mut);max-width:60ch}
.band{display:block;width:100%;height:auto;aspect-ratio:1200/150}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-top:14px}
.ctl label{display:block;font-weight:600;font-size:13px}
.ctl input,.ctl select{display:block;margin-top:4px;min-height:44px;border:1.5px solid #b4c4dc;border-radius:10px;padding:0 10px;font:500 14px "DM Sans";background:#fff;color:var(--ink)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--bl);color:#fff;font:600 14px "DM Sans";cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.cities{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.cities li{display:flex;align-items:center;background:#fff;border:1.5px solid #b4c4dc;border-radius:99px;padding:0 4px 0 14px;gap:2px}
.cities b{font:700 14px Manrope;margin-right:4px}
.ib{min-width:44px;min-height:44px;border:0;background:transparent;border-radius:50%;cursor:pointer;color:var(--ink);font:600 15px "DM Sans"}
.ib:hover{background:#e6eefb}
.pn{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-top:14px}
.pn h2{font:700 13px "DM Sans";letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.gw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
.g{display:grid;grid-template-columns:150px repeat(24,minmax(32px,1fr));min-width:920px}
.g>*{min-width:0}
.g .c0{position:sticky;left:0;z-index:2;background:#fff;border-right:1px solid var(--bd);padding:6px 8px;display:flex;align-items:center;gap:8px}
.g .c0 svg{width:64px;height:32px;border-radius:6px;flex:none;display:block}
.g .c0 b{display:block;font:700 13.5px/1.2 Manrope}.g .c0 small{color:var(--mut);font:500 11px "DM Mono",monospace}
.hh{border:0;border-bottom:1px solid var(--bd);background:#f4f8fd;font:500 12px "DM Mono",monospace;color:var(--ink);min-height:44px;cursor:pointer;position:relative;padding:0}
.hh[aria-pressed=true]{background:var(--ink);color:#fff}
.hh.bst::after{content:"";position:absolute;left:3px;right:3px;bottom:2px;height:4px;border-radius:2px;background:var(--bl)}
.hh:focus-visible{outline-offset:-3px}
.cell{display:flex;align-items:center;justify-content:center;min-height:46px;font:500 12px "DM Mono",monospace;border-top:1px solid #fff;border-left:1px solid #fff}
.cell.w{background:var(--wk)}.cell.s{background:var(--sh)}.cell.n{background:var(--nt);color:#fff}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.bs{outline:3px solid var(--bl);outline-offset:-3px;z-index:1}
.lg{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0 0;font-size:13px;color:var(--mut)}
.lg span{display:inline-flex;align-items:center;gap:6px}.lg i{width:16px;height:16px;border-radius:4px;display:inline-block;border:1px solid #9fb0c9}
.best{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:#eef4ff;border:1.5px solid var(--bl);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.best p{margin:0;font-weight:600}.best .fl{display:inline-block;background:var(--bl);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;margin-right:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:#fff}
.card svg.sk{display:block;width:100%;height:auto;aspect-ratio:240/100}
.card .in{padding:10px 12px 12px}
.card h3{font:800 17px Manrope;margin:0}.card .t{font:500 30px "DM Mono",monospace;margin:2px 0}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;background:#e6eefb;color:var(--ink)}
.tag.w{background:var(--wk)}.tag.s{background:var(--sh)}.tag.n{background:var(--nt);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:600px){.band{aspect-ratio:auto;height:140px}}
@media(max-width:760px){.g .c0 b{font-size:12px}.g .c0 small{font-size:10px}.g .c0 span:last-child{min-width:0;overflow:hidden}.g{grid-template-columns:118px repeat(24,32px)}.g .c0 svg{width:36px;height:18px}.g .c0{gap:6px;padding:6px}.ctl>*{flex:1 1 140px}.ctl .btn{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="w">
<header class="ban"><div class="tx">
 <p class="eb"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="#1f5fd1" stroke-width="2"/><path d="M10 2v16M2 10h16" stroke="#1f5fd1" stroke-width="1.4"/></svg>Meridian Desk</p>
 <h1>Meeting Time Planner</h1>
 <p class="lede">Pick your cities, see whose day is whose, and land on the hour that costs the fewest people their evening.</p></div>
 <svg class="band" id="band" viewBox="0 0 1200 150" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Day and night across the world at the selected time, with a pin for each city"></svg>
</header>

 <label>Date<input type="date" id="dt"></label>
 <label>Day starts<select id="st"></select></label>
 <label>Day ends<select id="en"></select></label>

</section>
<ul class="cities" id="cl" aria-label="Selected cities"></ul>
<section class="pn" aria-labelledby="hg"><h2 id="hg">Overlap grid <span style="text-transform:none;letter-spacing:0;font-weight:500">(hours in <span id="hc"></span> time)</span></h2>
 <div class="gw" tabindex="0" role="region" aria-label="Overlap grid, scrolls sideways"><div class="g" id="g"></div></div>
 <div class="lg" aria-label="Legend"><span><i style="background:var(--wk)"></i>Working hours</span><span><i style="background:var(--sh)"></i>Early or late (07:00 to 21:00)</span><span><i style="background:var(--nt)"></i>Night</span><span><i style="background:#fff;box-shadow:0 0 0 3px #1f5fd1 inset"></i>Best slot</span></div>
</section>
<section class="pn" aria-labelledby="hs"><h2 id="hs">Selected slot</h2>
 <div class="best"><p id="bsum"></p><button class="btn" id="cpy">Copy invite line</button></div>
 <div class="cards" id="cards"></div>
 <p class="sr" id="live" role="status" aria-live="polite"></p>
</section>
</div>
<script>
/*SCENES-START*/
var SC=(function(){
 var uid=0,s=1;function id(p){return p+(++uid)}
 function R(seed){var x=seed||1;return function(){x=(x*9301+49297)%233280;return x/233280}}

 D.slots.forEach(function(s,i){var inb=b.full&&i>=b.a&&i<=b.b,p=s.row[0].p;h+='<button type="button" class="hh'+(inb?' bst':'')+'" data-i="'+i+'" aria-pressed="'+(i===sel)+'" tabindex="'+(i===sel?0:-1)+'" aria-label="'+hm(p)+' '+name(S.cities[0])+(inb?', best slot':'')+'">'+pad(p.h)+'</button>'});
 S.cities.forEach(function(id,r){var c=by[id],p=D.slots[sel].row[r].p;
  h+='<div class="c0"><span class="th" data-r="'+r+'"></span><span><b>'+c[1]+'</b><small>'+offStr(D.slots[0].ms,c[2])+'</small></span></div>';
  D.slots.forEach(function(s,i){var x=s.row[r],inb=b.full&&i>=b.a&&i<=b.b;h+='<div class="cell '+x.k+(i===sel?' sel':'')+(inb?' bs':'')+'" title="'+c[1]+' '+hm(x.p)+'">'+lab(x.p)+(x.day?'<sup style="font-size:8px;margin-left:1px">'+(x.day>0?'+1':'−1')+'</sup>':'')+'</div>'});
 });
 g.innerHTML=h;
 g.querySelectorAll('.th').forEach(function(e){var r=+e.dataset.r,k=D.slots[sel].row[r].p.h;e.innerHTML=SC.city(r*7+3,{pal:pal(k),w:120,h:56}).replace('<svg ','<svg style="width:64px;height:32px;border-radius:6px;display:block" ')});
 /* cities chips */
 $('#cl').innerHTML=S.cities.map(function(id,i){return '<li><b>'+name(id)+(i===0?' (home)':'')+'</b><button class="ib" data-up="'+i+'" aria-label="Move '+name(id)+' earlier"'+(i===0?' disabled style="opacity:.3"':'')+'>↑</button><button class="ib" data-dn="'+i+'" aria-label="Move '+name(id)+' later"'+(i===S.cities.length-1?' disabled style="opacity:.3"':'')+'>↓</button><button class="ib" data-rm="'+i+'" aria-label="Remove '+name(id)+'"'+(S.cities.length<2?' disabled style="opacity:.3"':'')+'>✕</button></li>'}).join('');
 var left=C.filter(function(c){return S.cities.indexOf(c[0])<0});$('#ad').innerHTML=left.map(function(c){return '<option value="'+c[0]+'">'+c[1]+'</option>'}).join('');$('#addb').disabled=!left.length||S.cities.length>=5;
 /* summary + cards */
 $('#bsum').innerHTML='<span class="fl">'+(b.full?'Best':'Closest')+'</span>'+summary().replace(/^(Best slot|Best window): /,'');
 $('#cards').innerHTML=S.cities.map(function(id,r){var x=D.slots[sel].row[r],c=by[id];return '<article class="card"><div class="skc" data-r="'+r+'"></div><div class="in"><h3>'+c[1]+'</h3><p class="t">'+hm(x.p)+'</p><span class="tag '+x.k+'">'+({w:'Working hours',s:(x.m<720?'Early':'Late'),n:'Night'})[x.k]+'</span>'+(x.day?' <span class="tag">'+(x.day>0?'Next day':'Previous day')+'</span>':'')+' <span class="tag">'+x.p.wd+' '+x.p.d+'</span></div></article>'}).join('');
 $('#cards').querySelectorAll('.skc').forEach(function(e){var r=+e.dataset.r,k=D.slots[sel].row[r].p.h;e.innerHTML=SC.city(r*7+3,{pal:pal(k),w:240,h:100}).replace('<svg ','<svg class="sk" ')});
 band();
 try{localStorage.setItem('meridian',JSON.stringify({cities:S.cities,st:S.st,en:S.en}))}catch(e){}
}
function offStr(ms,tz){var o=off(ms,tz),s=o<0?'−':'+',a=Math.abs(o);return 'UTC'+s+Math.floor(a/60)+(a%60?':'+pad(a%60):'')}
function say(m){var l=$('#live');l.textContent='';setTimeout(function(){l.textContent=m},30)}
function announce(){say('Selected '+S.cities.map(function(id,i){return hm(D.slots[S.sel].row[i].p)+' '+name(id)}).join(', '))}
$('#g').addEventListener('click',function(e){var b=e.target.closest('.hh');if(!b)return;S.sel=+b.dataset.i;render();announce();var n=$('#g').querySelector('.hh[data-i="'+S.sel+'"]');if(n)n.focus()});
$('#g').addEventListener('keydown',function(e){var b=e.target.closest('.hh');if(!b)return;var i=+b.dataset.i,n=null;if(e.key==='ArrowRight')n=Math.min(23,i+1);else if(e.key==='ArrowLeft')n=Math.max(0,i-1);else if(e.key==='Home')n=0;else if(e.key==='End')n=23;if(n!==null){e.preventDefault();S.sel=n;render();announce();$('#g').querySelector('.hh[data-i="'+n+'"]').focus()}});
$('#cl').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;var u=b.dataset;if(u.rm!==undefined){var n=name(S.cities[+u.rm]);S.cities.splice(+u.rm,1);render();say('Removed '+n+'.')}else if(u.up!==undefined){var i=+u.up;S.cities.splice(i-1,0,S.cities.splice(i,1)[0]);S.sel=null;render()}else if(u.dn!==undefined){var j=+u.dn;S.cities.splice(j+1,0,S.cities.splice(j,1)[0]);S.sel=null;render()}});
$('#addb').addEventListener('click',function(){var v=$('#ad').value;if(v&&S.cities.length<5){S.cities.push(v);render();say('Added '+name(v)+'.')}});
$('#bestb').addEventListener('click',function(){S.sel=D.best.a;render();announce()});
$('#dt').addEventListener('change',function(){if(this.value){S.date=this.value;S.sel=null;render()}});
$('#st').addEventListener('change',function(){S.st=+this.value;if(S.en<=S.st){S.en=S.st+1;$('#en').value=S.en}S.sel=null;render()});
$('#en').addEventListener('change',function(){S.en=+this.value;if(S.en<=S.st){S.st=S.en-1;$('#st').value=S.st}S.sel=null;render()});
$('#cpy').addEventListener('click',function(){var t=invite();try{navigator.clipboard.writeText(t).then(function(){say('Invite line copied.')},function(){say('Select the text and copy it manually.')})}catch(e){say('Select the text and copy it manually.')}});
var hrs='';for(var i=0;i<=24;i++)hrs+='<option value="'+i+'">'+pad(i)+':00</option>';$('#st').innerHTML=hrs;$('#en').innerHTML=hrs;$('#st').value=S.st;$('#en').value=S.en;$('#dt').value=S.date;
render();
})();
</script></body></html>
