<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morse Translator — Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--ink:#e8f1fa;--mut:#a9bdd2;--am:#ffd166;--pn:#0f2236;--bd:#26415e;--tl:#5fd0c4}
body{margin:0;background:#07121f;color:var(--ink);font:400 14.5px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px #07121f}
.w{max-width:1240px;margin:0 auto;padding:16px 16px 44px}
.ban{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--bd);min-height:290px;display:flex;align-items:flex-start;padding:26px clamp(18px,4vw,44px)}
.ban>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tx{position:relative;max-width:520px}
.eb{font:600 12px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--am);margin:0 0 4px;display:flex;align-items:center;gap:8px}
h1{font:600 clamp(30px,5vw,54px)/1.03 "Space Grotesk",sans-serif;margin:0 0 10px;text-shadow:0 2px 16px rgba(0,0,0,.8)}
.lede{margin:0;background:rgba(7,18,31,.72);border-radius:10px;padding:8px 12px;max-width:40ch}
.main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.main>*{min-width:0}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.pn h2{font:600 13px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
.seg{display:flex;border:1.5px solid #3a5878;border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg label{position:relative;flex:1}.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;min-height:46px;line-height:46px;font-weight:600;padding:0 8px}
.seg input:checked+span{background:var(--am);color:#1a1204}.seg input:focus-visible+span{outline:3px solid var(--ink);outline-offset:-4px}
label.l{display:block;font-weight:600;margin-bottom:6px}
textarea{width:100%;min-height:96px;resize:vertical;border:1.5px solid #3a5878;border-radius:10px;background:#091a2b;color:var(--ink);padding:12px;font:500 16px/1.5 "JetBrains Mono",monospace}
.cnt{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:4px 0 10px}
.out{background:#091a2b;border:1px solid var(--bd);border-radius:10px;padding:12px;font:500 16px/1.6 "JetBrains Mono",monospace;overflow-wrap:anywhere;min-height:54px;color:var(--tl)}
.out.m{color:var(--ink);letter-spacing:.08em}
.gly{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;min-height:30px}
.wd{display:flex;gap:10px;flex-wrap:wrap}
.g{display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px;border:1px solid transparent}
.g.act{background:#1d3550;border-color:var(--am)}
.g i{display:block;background:var(--am);height:9px}.g i.d{width:9px;border-radius:50%}.g i.h{width:26px;border-radius:5px}
.g.q{color:#ff9a8a;font:600 14px Inter}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.b{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid #5a7a9c;background:transparent;color:var(--ink);font:600 14px Inter;cursor:pointer}
.b.pri{background:var(--am);border-color:var(--am);color:#1a1204}
.hint,.note{color:var(--mut);font-size:13px;margin:8px 0 0}
.err{color:#ff9a8a;font-weight:600;min-height:20px;margin:6px 0 0}
.lampw{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lamp{width:150px;height:150px;flex:none}
.chip{display:inline-block;min-width:92px;text-align:center;border-radius:99px;padding:4px 14px;font:600 14px Inter;background:#16314b;border:1.5px solid #3a5878}
.chip.on{background:var(--am);color:#1a1204;border-color:var(--am)}
.tl{position:relative;height:46px;overflow-x:auto;overflow-y:hidden;background:#091a2b;border:1px solid var(--bd);border-radius:10px;margin-top:12px}
.tlin{position:relative;height:100%}
.tlin b{position:absolute;top:12px;height:20px;border-radius:5px;background:var(--am)}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 6px #fff;left:0}
.ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ctl label{display:flex;align-items:center;gap:8px;font-weight:500}
.ctl input[type=checkbox]{width:22px;height:22px;accent-color:var(--am)}
.ctl input[type=range]{width:160px;height:44px;accent-color:var(--am)}
.ref{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ref button{all:unset;box-sizing:border-box;cursor:pointer;background:#091a2b;border:1px solid var(--bd);border-radius:10px;padding:6px 8px;min-height:58px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.ref button:hover{border-color:var(--am)}.ref button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ref b{font:700 16px "Space Grotesk"}.ref code{font:500 11.5px "JetBrains Mono",monospace;color:var(--mut)}
.ref .g{padding:0}
.tap{display:grid;place-items:center;margin:8px 0}
.key{width:150px;height:150px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#f7dc8e,#b8892f 55%,#6e4d14);color:#1a1204;font:700 16px "Space Grotesk";cursor:pointer;box-shadow:0 8px 0 #4a350c,0 14px 20px rgba(0,0,0,.5);touch-action:none;user-select:none}
.key.down{transform:translateY(6px);box-shadow:0 2px 0 #4a350c,0 6px 10px rgba(0,0,0,.5)}
.tapl{font:500 18px "JetBrains Mono",monospace;min-height:28px;overflow-wrap:anywhere;letter-spacing:.1em}
.tapd{font:600 20px "Space Grotesk";color:var(--tl);min-height:30px;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1000px){.main{grid-template-columns:minmax(0,1fr)}.ref{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:560px){.ban{min-height:260px}.ref{grid-template-columns:repeat(3,minmax(0,1fr))}.lamp{width:110px;height:110px}.ctl input[type=range]{width:120px}}
@media(prefers-reduced-motion:reduce){#beam,#glow,#sp{transition:none!important}}
</style></head><body>
<div class="w">
<header class="ban">
 <svg class="bg" id="bn" viewBox="0 0 1200 300" preserveAspectRatio="xMaxYMax slice" aria-hidden="true"></svg>
 <div class="tx"><p class="eb"><svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><rect x="3" y="0" width="8" height="3" fill="#ffd166"/><rect x="2" y="3" width="10" height="12" rx="2" fill="none" stroke="#ffd166" stroke-width="1.6"/><circle cx="7" cy="9" r="2.4" fill="#ffd166"/><rect x="3" y="15" width="8" height="3" fill="#ffd166"/></svg>Lampwick</p>
 <h1>Morse Translator</h1><p class="lede">Silent signals: light only, no sound.</p></div>
</header>
<div class="main">
 <div>
  <section class="pn" aria-labelledby="ht">
   <h2 id="ht">Translate</h2>
   <div class="seg" role="radiogroup" aria-label="Direction"><label><input type="radio" name="md" value="t2m" checked><span>Text to Morse</span></label><label><input type="radio" name="md" value="m2t"><span>Morse to text</span></label></div>
   <label class="l" for="in" id="inl">Text</label>
   <textarea id="in" maxlength="140" spellcheck="false" aria-describedby="hn cn"></textarea>
   <div class="cnt"><span id="hn" class="hint" style="margin:0"></span><span id="cn"></span></div>
   <p class="l" style="font-weight:600;margin:0 0 6px" id="outl">Morse</p>
   <div class="out m" id="out" aria-labelledby="outl"></div>
   <div class="gly" id="gly" aria-hidden="true"></div>
   <p class="err" id="err"></p>
   <div class="row"><button class="b pri" id="cp">Copy</button><button class="b" id="sw">Swap</button><button class="b" id="smp">Sample</button></div>
  </section>
  <section class="pn" aria-labelledby="hp">
   <h2 id="hp">Playback</h2>
   <div class="lampw">
    <svg class="lamp" id="lamp" viewBox="0 0 200 200" role="img" aria-label="Signal lamp, off"></svg>
    <div><span class="chip" id="chip">Idle</span><p class="note" id="pos" style="margin:8px 0 0"></p></div>
   </div>
   <div class="tl" id="tl" tabindex="0" role="region" aria-label="Timeline of the signal, scrolls sideways"><div class="tlin" id="tlin"><div class="ph" id="ph"></div></div></div>
   <div class="row"><button class="b pri" id="play">▶ Play</button><button class="b" id="stop">■ Stop</button></div>
   <div class="ctl">
    <label for="wpm">Speed <input type="range" id="wpm" min="3" max="6" step="1" value="5"> <output id="wv" for="wpm" style="font:500 16px 'JetBrains Mono',monospace">5 WPM</output></label>
    <label><input type="checkbox" id="fast"> Allow faster speeds (up to 20 WPM)</label>
    <label><input type="checkbox" id="loop"> Loop</label>
   </div>
   <p class="note" id="fn" hidden>Fast speeds flash quickly; stop if uncomfortable.</p>
   <p class="sr" id="live" role="status" aria-live="polite"></p>
  </section>
 </div>
 <div>
  <section class="pn" aria-labelledby="hr"><h2 id="hr">Reference chart</h2><div class="ref" id="ref"></div></section>
  <section class="pn" aria-labelledby="hk"><h2 id="hk">Tap pad</h2>
   <p class="hint" style="margin:0 0 6px">Press and release the key, or hold Space. Short is a dot, long is a dash. Pause to finish a letter.</p>
   <div class="tap"><button class="key" id="key" aria-label="Morse key. Press and release, or hold Space or Enter">TAP</button></div>
   <p class="tapl" id="tapl" aria-label="Tapped Morse"></p><p class="tapd" id="tapd" aria-label="Decoded text"></p>
   <div class="row"><button class="b" id="tclr">Clear taps</button></div>
  </section>
 </div>
</div>
</div>
<script>
/*SCENES-START*/
var SC=(function(){
 var uid=0,s=1;function id(p){return p+(++uid)}
 function R(seed){var x=seed||1;return function(){x=(x*9301+49297)%233280;return x/233280}}
 var PAL={
  dusk:{sky:['#1b1740','#4b2a78','#c2477a','#ff9a62','#ffd9a0'],sun:'#fff0c4',ridge:['#7a3a7e','#522c68','#2f1c4d','#1a1033'],mist:'#ffb48a',star:1},
  dawn:{sky:['#2a3a78','#7a7fc4','#f2a6a0','#ffd9a8','#fff3d6'],sun:'#fffbe8',ridge:['#8a8fc0','#6a6aa8','#4a4a88','#2a2a5a'],mist:'#ffe1c4'},
  alpine:{sky:['#4a86c8','#8bbbe6','#cfe6f6','#f4f9ff'],sun:'#fff',ridge:['#b7c8d8','#8aa1b8','#5d7690','#35495f'],mist:'#fff',snow:1},
  desert:{sky:['#e08a4c','#f2b26a','#f8d79a','#fff0cc'],sun:'#fffbe4',ridge:['#d9824a','#b8603a','#8a4230','#5a2a22'],mist:'#ffd9a0'},
  coast:{sky:['#5aa3d8','#9ccdee','#d6ecf8','#fff6e6'],sun:'#fff',ridge:['#7fa3a8','#4f7f86','#2d5a62','#173a42'],mist:'#fff'},
  night:{sky:['#05081a','#0d1840','#1d3170','#3a4f9a'],sun:'#e8eeff',ridge:['#1b2a5a','#111c42','#0a122e','#050818'],mist:'#5a6fc0',star:2},
  forest:{sky:['#9bc7b0','#cfe3c8','#f2f0d0','#fff8dc'],sun:'#fff8d8',ridge:['#7fa889','#4f7d63','#2f5a46','#183a2c'],mist:'#e8f2d8'},
  gold:{sky:['#3a2410','#a85a1c','#f0a03a','#ffe0a0'],sun:'#fff4c8',ridge:['#8a4a1a','#5e3010','#3a1c08','#1e0e04'],mist:'#ffc060',star:0}};
 function grad(i,stops,vert){var n=stops.length;return '<linearGradient id="'+i+'" x1="0" y1="0" x2="'+(vert===false?1:0)+'" y2="'+(vert===false?0:1)+'">'+stops.map(function(c,k){return '<stop offset="'+(k/(n-1)).toFixed(2)+'" stop-color="'+c+'"/>'}).join('')+'</linearGradient>'}
 function grain(op){var i=id('gn');return '<filter id="'+i+'" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .6 0"/></filter><rect width="100%" height="100%" filter="url(#'+i+')" opacity="'+(op==null?.22:op)+'" style="mix-blend-mode:overlay"/>'}
 function vig(w,h,str){var i=id('vg');return '<radialGradient id="'+i+'" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="'+(str==null?.45:str)+'"/></radialGradient><rect width="'+w+'" height="'+h+'" fill="url(#'+i+')"/>'}
 function wrap(w,h,inner,cls){return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"'+(cls?' class="'+cls+'"':'')+'>'+inner+'</svg>'}
 function ridge(r,w,base,amp,col,rough,id2){var d='M0 '+(base+amp)+' ',x=0,y;var pts=[];var n=Math.round(w/16);var ph=r()*6;for(var i=0;i<=n;i++){var xx=i/n*w,v=Math.sin(i*.35+ph)*.5+Math.sin(i*.9+ph*2)*.25+(r()-.5)*rough;pts.push([xx,base-v*amp])}d='M0 '+(base+amp*3)+' L'+pts.map(function(p){return p[0].toFixed(0)+' '+p[1].toFixed(1)}).join(' L')+' L'+w+' '+(base+amp*3)+'Z';return '<path d="'+d+'" fill="'+col+'"/>'}
 function landscape(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),g2=id('sn');var sunY=o.sunY!=null?o.sunY:h*.52,sunX=o.sunX!=null?o.sunX:w*(.3+r()*.4);
  var out='<defs>'+grad(g,P.sky)+'<radialGradient id="'+g2+'"><stop offset="0" stop-color="'+P.sun+'"/><stop offset=".25" stop-color="'+P.sun+'" stop-opacity=".9"/><stop offset="1" stop-color="'+P.sun+'" stop-opacity="0"/></radialGradient></defs><rect width="'+w+'" height="'+h+'" fill="url(#'+g+')"/>';
  if(P.star){for(var i=0;i<(P.star===2?160:70);i++)out+='<circle cx="'+(r()*w).toFixed(0)+'" cy="'+(r()*h*.5).toFixed(0)+'" r="'+(.5+r()*1.4).toFixed(1)+'" fill="#fff" opacity="'+(.3+r()*.7).toFixed(2)+'"/>'}
  if(P.snow||o.clouds){for(var c=0;c<(o.clouds||5);c++){var cx=r()*w,cy=h*(.12+r()*.28);out+='<g opacity=".75" fill="#fff"><ellipse cx="'+cx.toFixed(0)+'" cy="'+cy.toFixed(0)+'" rx="'+(90+r()*120).toFixed(0)+'" ry="'+(14+r()*14).toFixed(0)+'" opacity=".6"/><ellipse cx="'+(cx+40).toFixed(0)+'" cy="'+(cy-10).toFixed(0)+'" rx="'+(60+r()*70).toFixed(0)+'" ry="'+(12+r()*10).toFixed(0)+'" opacity=".5"/></g>'}}
  out+='<circle cx="'+sunX.toFixed(0)+'" cy="'+sunY.toFixed(0)+'" r="'+(h*.5)+'" fill="url(#'+g2+')" opacity=".55"/><circle cx="'+sunX.toFixed(0)+'" cy="'+sunY.toFixed(0)+'" r="'+(o.sunR||h*.06)+'" fill="'+P.sun+'"/>';
  var bases=[h*.56,h*.64,h*.74,h*.86];P.ridge.forEach(function(col,i){out+=ridge(r,w,bases[i],h*(.07+i*.01),col,.5-i*.08);if(i<P.ridge.length-1){var mi=id('ms');out+='<defs><linearGradient id="'+mi+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P.mist+'" stop-opacity="0"/><stop offset="1" stop-color="'+P.mist+'" stop-opacity=".45"/></linearGradient></defs><rect y="'+(bases[i]-10)+'" width="'+w+'" height="'+(h*.2)+'" fill="url(#'+mi+')"/>'}});
  if(o.trees!==false){var tc=P.ridge[3];for(var t=0;t<(o.trees||26);t++){var tx=r()*w,ty=h*(.86+r()*.1),th=h*(.06+r()*.1);out+='<path d="M'+tx.toFixed(0)+' '+(ty-th).toFixed(0)+' L'+(tx-th*.28).toFixed(0)+' '+ty.toFixed(0)+' L'+(tx+th*.28).toFixed(0)+' '+ty.toFixed(0)+'Z" fill="'+tc+'"/>'}}
  out+='<rect y="'+(h*.92)+'" width="'+w+'" height="'+(h*.08)+'" fill="'+P.ridge[3]+'"/>'+grain(o.grain)+vig(w,h,o.vig);return wrap(w,h,out,o.cls)}
 function sea(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),gs=id('sa'),hz=h*.5;var sx=w*(.35+r()*.3);
  var out='<defs>'+grad(g,P.sky)+grad(gs,[P.sky[2],P.ridge[1],P.ridge[3]])+'</defs><rect width="'+w+'" height="'+hz+'" fill="url(#'+g+')"/><rect y="'+hz+'" width="'+w+'" height="'+(h-hz)+'" fill="url(#'+gs+')"/>';
  out+='<circle cx="'+sx+'" cy="'+(hz-h*.04)+'" r="'+(h*.05)+'" fill="'+P.sun+'"/><circle cx="'+sx+'" cy="'+(hz-h*.04)+'" r="'+(h*.2)+'" fill="'+P.sun+'" opacity=".25"/>';
  for(var i=0;i<46;i++){var y=hz+4+Math.pow(r(),1.6)*(h-hz-6),ww=20+(y-hz)*(1.2+r()*3),x=sx+(r()-.5)*(60+(y-hz)*1.4);out+='<rect x="'+(x-ww/2).toFixed(0)+'" y="'+y.toFixed(0)+'" width="'+ww.toFixed(0)+'" height="'+(1+(y-hz)/90).toFixed(1)+'" rx="2" fill="'+P.sun+'" opacity="'+(.15+r()*.5).toFixed(2)+'"/>'}
  for(i=0;i<40;i++){var y2=hz+10+r()*(h-hz-10);out+='<path d="M'+(r()*w).toFixed(0)+' '+y2.toFixed(0)+' q'+(20+r()*40).toFixed(0)+' -6 '+(60+r()*80).toFixed(0)+' 0" stroke="#fff" stroke-opacity=".12" fill="none"/>'}
  out+=ridge(r,w,hz+4,h*.015,P.ridge[2],.2)+grain(o.grain)+vig(w,h);return wrap(w,h,out,o.cls)}
 function city(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'night'],r=R(seed),g=id('sk');var out='<defs>'+grad(g,P.sky)+'</defs><rect width="'+w+'" height="'+h+'" fill="url(#'+g+')"/>';
  if(P.star)for(var i=0;i<60;i++)out+='<circle cx="'+(r()*w).toFixed(0)+'" cy="'+(r()*h*.4).toFixed(0)+'" r="'+(.5+r()*1.2).toFixed(1)+'" fill="#fff" opacity="'+(.3+r()*.6).toFixed(2)+'"/>';
  for(var L=0;L<3;L++){var x=-20,col=P.ridge[L],base=h*(.7+L*.1),wl=L===2;while(x<w){var bw=30+r()*70,bh=h*(.12+r()*(.3-L*.07));out+='<rect x="'+x.toFixed(0)+'" y="'+(base-bh).toFixed(0)+'" width="'+bw.toFixed(0)+'" height="'+(bh+h*.3).toFixed(0)+'" fill="'+col+'"/>';
   var step=wl?11:16;for(var yy=base-bh+10;yy<base-4;yy+=step){for(var xx=x+6;xx<x+bw-8;xx+=step){if(r()>(wl?.55:.7))out+='<rect x="'+xx.toFixed(0)+'" y="'+yy.toFixed(0)+'" width="4" height="6" fill="'+(r()>.6?'#ffe2a0':'#ffc66e')+'" opacity="'+(.5+r()*.5).toFixed(2)+'"/>'}}x+=bw+2+r()*6}
   var mi=id('ms');out+='<defs><linearGradient id="'+mi+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P.mist+'" stop-opacity="0"/><stop offset="1" stop-color="'+P.mist+'" stop-opacity=".35"/></linearGradient></defs><rect y="'+(base-h*.1)+'" width="'+w+'" height="'+(h*.2)+'" fill="url(#'+mi+')"/>'}
  out+=grain(o.grain)+vig(w,h);return wrap(w,h,out,o.cls)}

function enc(t){var skipped={},w=t.toUpperCase().split(/\s+/).filter(Boolean).map(function(wd){return wd.split('').map(function(c){if(T[c])return T[c];skipped[c]=1;return null}).filter(Boolean).join(' ')}).filter(Boolean);return {m:w.join(' / '),skipped:Object.keys(skipped)}}
function norm(s){return s.replace(/[·•]/g,'.').replace(/[–—−]/g,'-').replace(/[_]/g,'-').replace(/[^.\-\/\s]/g,function(c){return ''}).replace(/\s*\/\s*/g,' / ').replace(/\s+/g,' ').trim()}
function dec(m){var bad=0,txt=m.split(' / ').map(function(w){return w.split(' ').filter(Boolean).map(function(c){if(Rv[c])return Rv[c];bad++;return '?'}).join('')}).join(' ');return {t:txt,bad:bad}}
var MORSE='',cur=null;
function glyphs(m){var h='',n=0;m.split(' / ').forEach(function(w){h+='<span class="wd">';w.split(' ').filter(Boolean).forEach(function(c){h+='<span class="g" data-n="'+(n++)+'">'+c.split('').map(function(s){return s==='.'?'<i class="d"></i>':'<i class="h"></i>'}).join('')+'</span>'});h+='</span>'});return h}
function update(){
 var m,out,err='';
 if(S.mode==='t2m'){var e=enc(S.tx);m=e.m;out=m||'';if(e.skipped.length)err='Unknown symbol skipped: '+e.skipped.join(' ');$('#out').className='out m';$('#out').textContent=out||'…'}
 else{m=norm(S.tx);var d=dec(m);out=d.t;if(d.bad)err=d.bad+(d.bad===1?' code was':' codes were')+' not recognised (shown as ?).';$('#out').className='out';$('#out').textContent=out||'…'}
 MORSE=m;$('#err').textContent=err;$('#cn').textContent=S.tx.length+' / 140';
 $('#gly').innerHTML=glyphs(m);buildTL();
 $('#inl').textContent=S.mode==='t2m'?'Text':'Morse';$('#outl').textContent=S.mode==='t2m'?'Morse':'Text';
 $('#hn').textContent=S.mode==='t2m'?'Letters, numbers and common punctuation.':'Separate letters with a space and words with a slash.';
 try{localStorage.setItem('lampwick',JSON.stringify({mode:S.mode,tx:S.tx,wpm:S.wpm,fast:S.fast}))}catch(e){}
}
/* reference */
(function(){var o='';Object.keys(T).forEach(function(k){o+='<button type="button" data-c="'+k+'" aria-label="'+(k==='.'?'full stop':k==='/'?'slash':k==='"'?'quote':k==="'"?'apostrophe':k)+': '+T[k].replace(/\./g,'dot ').replace(/-/g,'dash ')+'. Add to input"><b>'+k.replace('&','&amp;').replace('"','&quot;')+'</b><span class="g" aria-hidden="true">'+T[k].split('').map(function(s){return s==='.'?'<i class="d"></i>':'<i class="h"></i>'}).join('')+'</span><code>'+T[k]+'</code></button>'});$('#ref').innerHTML=o})();
$('#ref').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var c=b.dataset.c;if(S.mode==='t2m')S.tx+=c;else S.tx=(S.tx?S.tx+' ':'')+T[c];S.tx=S.tx.slice(0,140);$('#in').value=S.tx;update();$('#in').focus()});
/* timeline + playback */
var EV=[],TOTAL=0,UNIT=240,elapsed=0,playing=false,t0=0,raf=0,idx=0,lastLit=null,lastN=-1;
function unit(){return 1200/S.wpm}
function build(){EV=[];var u=unit(),words=MORSE?MORSE.split(' / '):[],n=0;
 words.forEach(function(w,wi){var ls=w.split(' ').filter(Boolean);ls.forEach(function(l,li){l.split('').forEach(function(s,si){EV.push({lit:true,d:(s==='.'?1:3)*u,n:n,k:s==='.'?'Dot':'Dash'});if(si<l.length-1)EV.push({lit:false,d:u,n:n,k:'Gap'})});n++;if(li<ls.length-1)EV.push({lit:false,d:3*u,n:n-1,k:'Gap'})});if(wi<words.length-1)EV.push({lit:false,d:7*u,n:n-1,k:'Gap'})});
 var t=0;EV.forEach(function(e){e.s=t;t+=e.d;e.e=t});TOTAL=t}
function buildTL(){build();var inn=$('#tlin');inn.querySelectorAll('b').forEach(function(b){b.remove()});var px=10/unit();inn.style.width=Math.max(10,TOTAL*px)+'px';var f=document.createDocumentFragment();EV.forEach(function(e){if(e.lit){var b=document.createElement('b');b.style.left=(e.s*px)+'px';b.style.width=(e.d*px)+'px';f.appendChild(b)}});inn.appendChild(f);setPos(elapsed)}
function setPos(ms){var px=10/unit(),x=ms*px;$('#ph').style.transform='translateX('+x+'px)';var tl=$('#tl');if(playing){tl.scrollLeft=Math.max(0,x-tl.clientWidth*.4)}}
function lamp(on,kind,n){var b=$('#beam'),g=$('#glow'),sp=$('#sp');b.style.opacity=on?1:0;sp.style.opacity=on?1:0;g.style.opacity=on?1:0;$('#gls').setAttribute('fill',on?'url(#lon)':'url(#lof)');$('#lamp').setAttribute('aria-label','Signal lamp, '+(on?'on':'off'));
 var c=$('#chip');c.textContent=playing||elapsed>0?(on?kind:'Gap'):'Idle';c.className='chip'+(on?' on':'');
 if(n!==lastN){lastN=n;document.querySelectorAll('#gly .g.act').forEach(function(x){x.classList.remove('act')});var gg=document.querySelector('#gly .g[data-n="'+n+'"]');if(gg)gg.classList.add('act')}}
function frame(now){if(!playing)return;elapsed=now-t0;if(elapsed>=TOTAL){if(S.loop){t0=now;elapsed=0;idx=0}else{finish();return}}
 while(idx<EV.length-1&&elapsed>=EV[idx].e)idx++;var e=EV[idx];lamp(e.lit,e.k,e.n);setPos(elapsed);$('#pos').textContent=Math.round(elapsed/100)/10+' s of '+Math.round(TOTAL/100)/10+' s';raf=requestAnimationFrame(frame)}
function finish(){playing=false;elapsed=0;idx=0;lamp(false,'',-1);lastN=-1;document.querySelectorAll('#gly .g.act').forEach(function(x){x.classList.remove('act')});$('#chip').textContent='Idle';$('#play').textContent='▶ Play';setPos(0);$('#pos').textContent='Finished.';$('#tl').scrollLeft=0}
$('#play').addEventListener('click',function(){if(playing){playing=false;cancelAnimationFrame(raf);$('#play').textContent='▶ Resume';say('Paused.');return}
 if(!EV.length){say('Nothing to play yet.');return}playing=true;t0=performance.now()-elapsed;$('#play').textContent='❚❚ Pause';say('Playing at '+S.wpm+' WPM.');raf=requestAnimationFrame(frame)});
$('#stop').addEventListener('click',function(){cancelAnimationFrame(raf);finish();say('Stopped.')});
/* inputs */
$('#in').addEventListener('input',function(){S.tx=this.value;stopPlay();update()});
function stopPlay(){if(playing||elapsed){cancelAnimationFrame(raf);finish()}}
document.querySelectorAll('input[name=md]').forEach(function(r){r.addEventListener('change',function(){if(r.checked){stopPlay();S.mode=r.value;update()}})});
$('#sw').addEventListener('click',function(){stopPlay();var o=$('#out').textContent;if(o==='…')o='';S.mode=S.mode==='t2m'?'m2t':'t2m';S.tx=o.slice(0,140);document.querySelector('input[name=md][value='+S.mode+']').checked=true;$('#in').value=S.tx;update()});
$('#smp').addEventListener('click',function(){stopPlay();S.tx=S.mode==='t2m'?'SOS meet at the harbour':'... --- ... / -- . . - / .- - / - .... . / .... .- .-. -... --- ..- .-.';$('#in').value=S.tx;update()});
$('#cp').addEventListener('click',function(){var t=S.mode==='t2m'?MORSE:$('#out').textContent;try{navigator.clipboard.writeText(t).then(function(){say(S.mode==='t2m'?'Copied Morse.':'Copied text.')},function(){say('Select the text and copy it manually.')})}catch(e){say('Select the text and copy it manually.')}});
function wpmUI(){var f=$('#fast').checked&&!RM;S.fast=f;var w=$('#wpm');w.max=f?20:6;if(+w.value>+w.max)w.value=w.max;S.wpm=+w.value;$('#wv').textContent=S.wpm+' WPM';$('#fn').hidden=!f}
$('#wpm').addEventListener('input',function(){wpmUI();stopPlay();buildTL()});
$('#fast').addEventListener('change',function(){wpmUI();if(!this.checked){S.wpm=Math.min(S.wpm,6);$('#wpm').value=S.wpm;wpmUI()}stopPlay();buildTL()});
$('#loop').addEventListener('change',function(){S.loop=this.checked});
/* tap pad */
var tapM='',tapT='',down=0,tmL,tmW;
function tapRender(){$('#tapl').textContent=tapM;$('#tapd').textContent=tapT+(tapCur?'':'')}
var tapCur='';
function press(){if(down)return;down=performance.now();clearTimeout(tmL);clearTimeout(tmW);$('#key').classList.add('down')}
function release(){if(!down)return;var d=performance.now()-down;down=0;$('#key').classList.remove('down');var u=unit(),s=d<2*u?'.':'-';tapCur+=s;tapM+=s;tapRender();
 tmL=setTimeout(function(){var c=Rv[tapCur]||'?';tapT+=c;tapM+=' ';tapCur='';tapRender();tmW=setTimeout(function(){tapT+=' ';tapM+='/ ';tapRender()},4*u)},3*u)}
var K=$('#key');K.addEventListener('pointerdown',function(e){e.preventDefault();K.setPointerCapture(e.pointerId);press()});K.addEventListener('pointerup',release);K.addEventListener('pointercancel',release);
K.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)press()}});K.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();release()}});
$('#tclr').addEventListener('click',function(){clearTimeout(tmL);clearTimeout(tmW);tapM='';tapT='';tapCur='';tapRender();say('Taps cleared.')});
/* init */
document.querySelector('input[name=md][value='+S.mode+']').checked=true;$('#in').value=S.tx;$('#fast').checked=S.fast&&!RM;$('#fast').disabled=RM;$('#wpm').max=$('#fast').checked?20:6;$('#wpm').value=Math.min(S.wpm,+$('#wpm').max);wpmUI();update();
})();
</script></body></html>
