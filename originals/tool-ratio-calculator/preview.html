.fr.t .th{display:block}

$('#r').addEventListener('blur',function(){if(parse(this.value))render()});
$('#chips').addEventListener('change',function(e){var i=e.target;if(i.name!=='pr')return;var p=PR[+i.value];S.a=p[1];S.b=p[2];S.h=Math.max(1,Math.round(S.w*S.b/S.a));err('');$('#nt').textContent='';render()});
$('#lock').addEventListener('click',function(){S.lock=!S.lock;if(!S.lock)$('#nt').textContent='Ratio unlocked: changing a side updates the ratio.';else{$('#nt').textContent='';S.h=Math.max(1,Math.round(S.w*S.b/S.a))}render()});
$('#swap').addEventListener('click',function(){var t=S.w;S.w=S.h;S.h=t;t=S.a;S.a=S.b;S.b=t;err('');render()});
$('#tb').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.w=+b.dataset.w;S.h=Math.max(1,Math.round(S.w*S.b/S.a));render()});
$('#thirds').addEventListener('change',layout);$('#unc').addEventListener('change',layout);
$('#cp').addEventListener('click',function(){var t=$('#css').textContent;try{navigator.clipboard.writeText(t).then(function(){say('CSS copied.')},function(){say('Select the text and copy it manually.')})}catch(e){say('Select the text and copy it manually.')}});
function say(m){var l=$('#live');l.textContent='';setTimeout(function(){l.textContent=m},30)}
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,60)});
render();
})();
</script></body></html>
