<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Readability Counter — Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--ink:#1c1a17;--mut:#5b564b;--tl:#0f6b66;--pn:#fffdf8;--bd:#ded5c0;--am:#8a4f00;--amt:#fbe9c7;--rd:#a3201a;--rdt:#fadbd6;--gn:#1f6b3a}
body{margin:0;background:#f6f1e6;color:var(--ink);font:400 14.5px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.w{max-width:1240px;margin:0 auto;padding:16px 16px 44px}
.ban{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--bd);min-height:300px;display:flex;align-items:center;padding:26px clamp(18px,4vw,44px)}
.ban>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ban .tx{position:relative;max-width:560px}
.eb{font:600 12px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--tl);margin:0 0 4px}
h1{font:600 clamp(30px,5vw,52px)/1.04 Lora,serif;margin:0 0 8px}
.pr{margin:0;font-size:16px;color:var(--ink)}
.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.main>*{min-width:0}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.pn h2{font:600 13px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
label.l{display:block;font-weight:600;margin-bottom:6px}
textarea{width:100%;min-height:340px;resize:vertical;border:1.5px solid #c9bea4;border-radius:12px;padding:16px;background:#fff;color:var(--ink);font:400 17px/1.7 Lora,serif}
.lim{height:4px;background:#ece4d0;border-radius:4px;margin:8px 0 12px;overflow:hidden}.lim i{display:block;height:100%;background:var(--tl);width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.b{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font:600 14px Inter;cursor:pointer}
.b.pri{background:var(--tl);border-color:var(--tl);color:#fff}
.map{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;font:400 15.5px/1.55 Lora,serif}
.map button{all:unset;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;border-left:6px solid var(--gn);background:#f3f8f2;padding:8px 10px;border-radius:0 10px 10px 0;cursor:pointer;box-sizing:border-box}
.map button.a{border-color:#d49a1a;background:var(--amt)}.map button.r{border-color:var(--rd);background:var(--rdt)}
.map button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.map button.cur{box-shadow:0 0 0 2px var(--ink) inset}
.map .t{overflow-wrap:anywhere}
.map .n{font:500 12px "IBM Plex Mono",monospace;background:#fff;border:1px solid #c9bea4;border-radius:99px;padding:1px 8px;white-space:nowrap;color:var(--ink)}
.stk{position:sticky;top:12px}
.dial{display:block;width:100%;max-width:340px;margin:0 auto;height:auto}
.gr{text-align:center;margin:0 0 4px;font:600 22px Lora,serif}
.sub{text-align:center;margin:0 0 12px;color:var(--mut)}
.tg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tg select{min-height:44px;border:1.5px solid #c9bea4;border-radius:10px;background:#fff;font:500 14px Inter;padding:0 10px}
.tgm{font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--bd);border-radius:12px;padding:10px;background:#fbf7ec;min-width:0}
.tile svg{display:block;margin-bottom:4px}
.tile b{display:block;font:500 19px "IBM Plex Mono",monospace;overflow-wrap:anywhere}
.tile small{color:var(--mut);font-size:12px}
.flags{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.flags li{padding:8px 10px;border-radius:10px;background:#f3f8f2;border-left:5px solid var(--gn)}
.flags li.a{background:var(--amt);border-color:#d49a1a;color:#3d2400}.flags li.r{background:var(--rdt);border-color:var(--rd);color:#4a0d0a}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.empty{color:var(--mut);margin:0}
@media(max-width:980px){.main{grid-template-columns:minmax(0,1fr)}.stk{position:static;order:-1}}
@media(max-width:700px){.ban .tx{background:rgba(246,241,230,.9);border-radius:12px;padding:12px 14px}}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}textarea{min-height:260px}}
</style></head><body>
<div class="w">
<header class="ban">
 <svg class="bg" id="bn" viewBox="0 0 1200 300" preserveAspectRatio="xMaxYMid slice" aria-hidden="true"></svg>
 <div class="tx"><p class="eb">Plainpage</p><h1>Readability Counter</h1><p class="pr">Write plainly. See where readers will stumble.</p></div>
</header>
<div class="main">
 <div>
  <section class="pn" aria-labelledby="he">
   <h2 id="he">Editor</h2>
   <label class="l" for="tx">Your text</label>
   <textarea id="tx" placeholder="Start typing, or press Sample to see how it works." maxlength="20000" aria-describedby="cnt"></textarea>
   <div class="lim" aria-hidden="true"><i id="lim"></i></div>
   <div class="row"><button class="b pri" id="s1">Sample (plain)</button><button class="b" id="s2">Sample (dense)</button><button class="b" id="clr">Clear</button><button class="b" id="cp">Copy stats</button><span id="cnt" class="sr"></span></div>
  </section>
  <section class="pn" aria-labelledby="hm"><h2 id="hm">Sentence map</h2><div class="map" id="map"></div><p class="empty" id="mapE">Sentences appear here as you write.</p></section>
 </div>
 <div class="stk">
  <section class="pn" aria-labelledby="hd"><h2 id="hd">Reading ease</h2>
   <svg class="dial" id="dial" viewBox="0 0 300 190" role="img" aria-label="Reading ease dial"></svg>
   <p class="gr" id="gr">–</p><p class="sub" id="sub">Add some text to see a score.</p>
   <div class="tg"><label for="tgs" class="tgm">Target grade</label><select id="tgs"><option value="6">Grade 6</option><option value="8" selected>Grade 8</option><option value="10">Grade 10</option><option value="12">Grade 12</option></select><span id="tgr" aria-live="off"></span></div>
   <div class="tiles" id="tiles"></div>
  </section>
  <section class="pn" aria-labelledby="hf"><h2 id="hf">Flags</h2><ul class="flags" id="flags"></ul><p class="sr" id="live" role="status" aria-live="polite"></p></section>
 </div>
</div>
</div>
<script>

 function portrait(seed,o){o=o||{};var w=o.w||400,h=o.h||500,r=R(seed),skin=o.skin||['#f1c9a5','#d9a37a','#b57a52','#8a5a3a','#e8b896'][Math.floor(r()*5)],hair=o.hair||['#2a1c14','#5a3a22','#c9a24a','#1a1a1a','#8a4a2a','#d8d4cc'][Math.floor(r()*6)],cl=o.cloth||['#2f6b4f','#c2523a','#3a4f9a','#7a4a9a','#222','#d9a23a'][Math.floor(r()*6)],bg=o.bg||['#e8d8c4','#cfdde8','#e4d0d8','#d4e4d0'][Math.floor(r()*4)],g=id('pb'),gs=id('ps'),long=o.long!=null?o.long:r()>.5;

 cancelAnimationFrame(needle.raf);needle.last=0;var k=170,c=26;
 (function step(ts){if(!needle.last)needle.last=ts;var dt=Math.min(.032,(ts-needle.last)/1000);needle.last=ts;var f=-k*(needle.a-needle.t)-c*needle.v;needle.v+=f*dt;needle.a+=needle.v*dt;$('#nd').style.transform='rotate('+needle.a+'deg)';
  if(Math.abs(needle.a-needle.t)>.05||Math.abs(needle.v)>.05)needle.raf=requestAnimationFrame(step);else{needle.a=needle.t;$('#nd').style.transform='rotate('+needle.a+'deg)'}})(performance.now())}
var S1="We started the community garden last spring. A few neighbours gave us seeds, and the school lent us two wheelbarrows. Now we have twelve beds and a small shed.\n\nAnyone can join us on Saturday mornings. You do not need to know anything about plants. We will show you how to water, how to weed and when to pick the beans. If you have a free hour, come along.\n\nEvery bed grows food for the neighbourhood table. Last year we gave away more than four hundred bags of vegetables. Come and see what is growing now.";
var S2="Notwithstanding any provision to the contrary contained elsewhere in this agreement, the party responsible for the administration of the programme shall, in circumstances where the aforementioned obligations cannot reasonably be fulfilled within the specified timeframe owing to unforeseen operational constraints, be entitled to request an extension of such duration as may be deemed appropriate by the reviewing authority, provided that written notification has been furnished to all affected stakeholders no fewer than fourteen working days before the original deadline, and that the justification submitted is, in the opinion of the authority, sufficiently comprehensive to demonstrate that the delay was neither foreseeable nor avoidable by reasonable means.";
var cur=null,tmr,ltm,lastGrade='';
function label(e){return e>=90?'Very easy':e>=80?'Easy':e>=70?'Fairly easy':e>=60?'Standard':e>=50?'Fairly hard':e>=30?'Hard':'Very hard'}
function analyse(){
 var t=$('#tx').value,ss=sentences(t),all=words(t),n=all.length,sy=0;all.forEach(function(w){sy+=syl(w)});
 var sc=ss.length,paras=t.split(/\n\s*\n/).filter(function(x){return x.trim()}).length,chars=t.length,nsp=t.replace(/\s/g,'').length;
 var apw=sc?n/sc:0,spw=n?sy/n:0,ease=n?206.835-1.015*apw-84.6*spw:0,grade=n?Math.max(0,Math.min(18,.39*apw+11.8*spw-15.59)):0;
 cur={n:n,chars:chars,nsp:nsp,sc:sc,paras:paras,ease:ease,grade:grade,apw:apw,ss:ss};
 $('#lim').style.width=Math.min(100,chars/200)+'%';$('#cnt').textContent=chars+' of 20,000 characters';
 var tiles=[['pencil',n,'Words'],['ruler',chars+' / '+nsp,'Characters (with / without spaces)'],['mega',sc,'Sentences'],['pencil',paras,'Paragraphs'],['clock',mins(n,225),'Reading time'],['clock',mins(n,150),'Speaking time']];
 $('#tiles').innerHTML=tiles.map(function(x){return '<div class="tile"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">'+ICO[x[0]]+'</svg><b>'+x[1]+'</b><small>'+x[2]+'</small></div>'}).join('');
 var g=Math.round(grade),tg=+$('#tgs').value;
 if(!n){$('#gr').textContent='–';$('#sub').textContent='Add some text to see a score.';$('#tgr').textContent='';setNeedle(0);$('#dial').setAttribute('aria-label','Reading ease dial, no text yet')}
 else{var lb=label(ease);$('#gr').textContent='Grade '+g+', '+lb.toLowerCase();$('#sub').textContent='Reading ease '+Math.round(Math.max(0,Math.min(100,ease)))+' of 100 · '+Math.round(apw)+' words per sentence';
  var d=g-tg;$('#tgr').textContent=d<=0?'On target':d+(d===1?' grade':' grades')+' above target';$('#tgr').style.color=d<=0?'#1f6b3a':'#8a4f00';$('#tgr').className='tgm';
  setNeedle(ease);$('#dial').setAttribute('aria-label','Reading ease '+Math.round(Math.max(0,Math.min(100,ease)))+' out of 100: '+lb)}
 var long=0,vlong=0,map=$('#map');map.innerHTML='';$('#mapE').hidden=sc>0;
 ss.forEach(function(s,i){var wc=words(s.text).length,cl=wc>=31?'r':wc>=21?'a':'g';if(cl==='r')vlong++;else if(cl==='a')long++;
  var b=document.createElement('button');b.type='button';b.className=cl==='g'?'':cl;b.dataset.i=i;b.setAttribute('aria-label','Sentence '+(i+1)+', '+wc+' words'+(cl==='r'?', very long':cl==='a'?', long':''));
  b.innerHTML='<span class="t"></span><span class="n">'+wc+' words</span>';b.firstChild.textContent=s.text;map.appendChild(b)});
 var fl=[];if(vlong)fl.push(['r',vlong+(vlong===1?' very long sentence':' very long sentences')+' (31+ words)']);if(long)fl.push(['a',long+(long===1?' long sentence':' long sentences')+' (21 to 30 words)']);
 if(n)fl.push([fl.length?'g':'g','Average sentence '+Math.round(apw)+' words']);if(n&&spw>1.6)fl.push(['a','Long words: average '+spw.toFixed(2)+' syllables per word']);
 if(!fl.length)fl.push(['g','Nothing to flag yet.']);
 $('#flags').innerHTML=fl.map(function(f){return '<li class="'+f[0]+'">'+f[1]+'</li>'}).join('');
 try{localStorage.setItem('plainpage',t)}catch(e){}
 clearTimeout(ltm);if(n)ltm=setTimeout(function(){var m='Grade '+g+', '+label(ease).toLowerCase()+'. '+(vlong+long)+' long '+((vlong+long)===1?'sentence':'sentences')+'.';if(m!==lastGrade){lastGrade=m;var l=$('#live');l.textContent='';setTimeout(function(){l.textContent=m},30)}},700)}
function run(){clearTimeout(tmr);tmr=setTimeout(analyse,120)}
$('#tx').addEventListener('input',run);$('#tgs').addEventListener('change',analyse);
$('#s1').addEventListener('click',function(){$('#tx').value=S1;analyse()});$('#s2').addEventListener('click',function(){$('#tx').value=S2;analyse()});
$('#clr').addEventListener('click',function(){$('#tx').value='';analyse();$('#tx').focus()});
$('#map').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||!cur)return;var s=cur.ss[+b.dataset.i],tx=$('#tx');tx.focus();tx.setSelectionRange(s.start,s.end);var wc=words(s.text).length;var l=$('#live');l.textContent='';setTimeout(function(){l.textContent='Sentence '+(+b.dataset.i+1)+' is '+wc+' words.'+(wc>=31?' Try splitting it in two.':'')},30)});
$('#cp').addEventListener('click',function(){if(!cur)return;var t='Words '+cur.n+', sentences '+cur.sc+', grade '+Math.round(cur.grade)+', reading ease '+Math.round(cur.ease);try{navigator.clipboard.writeText(t).then(function(){var l=$('#live');l.textContent='Stats copied.'},function(){$('#live').textContent='Select the figures and copy them manually.'})}catch(e){$('#live').textContent='Select the figures and copy them manually.'}});
try{var sv=localStorage.getItem('plainpage');if(sv)$('#tx').value=sv}catch(e){}
if(!$('#tx').value)$('#tx').value=S1;
analyse();
})();
</script></body></html>
