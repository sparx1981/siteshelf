<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Box Shadow Lab — Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#f1f3f8;color:#161a26;font:400 14.5px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #161a26;outline-offset:2px;box-shadow:0 0 0 5px #fff}
.w{max-width:1280px;margin:0 auto;padding:18px 16px 40px}
.eb{font:600 12px Inter;letter-spacing:.16em;text-transform:uppercase;color:#4153d6;margin:0}
h1{font:600 clamp(28px,4.6vw,44px)/1.05 Sora,sans-serif;margin:2px 0 14px}
.main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.pn{background:#fff;border:1px solid #dfe3ee;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.pn h2{font:600 14px Sora,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#586078;margin:0 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chips label{position:relative}.chips input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chips span{display:block;min-height:44px;line-height:44px;padding:0 14px;border:1.5px solid #c9cfe0;border-radius:99px;font-weight:600;background:#fff}
.chips input:checked+span{background:#161a26;color:#fff;border-color:#161a26}.chips input:focus-visible+span{outline:3px solid #4153d6;outline-offset:2px}
.sticky{position:sticky;top:12px}
.stage{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;display:grid;place-items:center;background:var(--sf)}
.stage .grain{position:absolute;inset:0;pointer-events:none}.stage svg.bg{position:absolute;inset:0;width:100%;height:100%}
.scn{position:relative;display:flex;gap:6%;align-items:center;justify-content:center;width:86%}
.sm{width:22%;aspect-ratio:3/4;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(20,25,50,.12);position:relative}.sm svg{width:70%}
.sub{width:42%;background:var(--sc,#fff);position:relative;z-index:2;overflow:hidden;color:#161a26;display:flex;flex-direction:column;transition:box-shadow .15s,border-radius .15s}
.sub.card{aspect-ratio:3/4;border-radius:var(--r,16px);padding:8% 8% 7%}
.sub.btn{aspect-ratio:3/1.6;border-radius:var(--r,16px);justify-content:center;align-items:center;font:700 22px Sora;padding:0}
.sub.circ{aspect-ratio:1;border-radius:50%;justify-content:center;align-items:center;padding:0}
.sub .pic{flex:1;border-radius:calc(var(--r,16px)*.6);overflow:hidden;margin-bottom:6%;min-height:0}.sub .pic svg{width:100%;height:100%;display:block}
.sub h3{font:600 clamp(14px,2.2vw,20px)/1.1 Sora;margin:0}.sub .pr{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font:600 15px Inter}
.sub .ad{background:#4153d6;color:#fff;border-radius:99px;padding:3px 14px;font-size:13px;font-weight:700}
.dk .sub{color:#161a26}
.li{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(120,130,160,.6);display:grid;place-items:center;background:rgba(255,255,255,.7)}.li svg{width:22px;height:22px;transition:transform .2s}
.ex{display:flex;gap:16px;align-items:center;margin-top:12px}.av{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center}.av svg{width:34px}.pill{background:#4153d6;color:#fff;font-weight:700;border-radius:99px;padding:10px 22px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.row label{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px}.row output{font:500 13px "IBM Plex Mono",monospace;color:#586078}
input[type=range]{width:100%;accent-color:#4153d6;height:28px}
input[type=color]{width:42px;height:42px;border:1.5px solid #c9cfe0;border-radius:10px;padding:0;background:none;cursor:pointer}
.num{font:500 13px "IBM Plex Mono",monospace;border:1px solid #c9cfe0;border-radius:8px;min-height:38px;padding:0 6px;width:100%;color:#161a26;background:#fff}
.bt{font:600 13px Inter;color:#161a26;background:#fff;border:1.5px solid #161a26;border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}.bt:hover{background:#eef0fa}.bt.p{background:#4153d6;border-color:#4153d6;color:#fff}.bt.p:hover{background:#3243b8}
.ly{border:1.5px solid #dfe3ee;border-radius:14px;padding:10px;margin-bottom:8px;background:#fafbff}.ly.off{opacity:.55}
.ly .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.ly .hd b{margin-right:auto}
.ly .hd button{min-width:44px;min-height:44px;border:1px solid #c9cfe0;border-radius:8px;background:#fff;cursor:pointer;font:700 14px Inter;color:#161a26}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.g4 label{font:600 11px Inter;color:#586078;display:block}
.g2{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}.g2 label{display:flex;gap:6px;align-items:center;font-weight:600;min-height:44px}
.ps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ps button{border:1px solid #dfe3ee;background:#f7f8fc;border-radius:12px;padding:8px 4px 4px;cursor:pointer;font:600 11px Inter;color:#161a26}.ps button i{display:block;width:34px;height:42px;border-radius:7px;background:#fff;margin:0 auto 4px}
pre{margin:0;background:#0f1220;color:#dbe1ff;border-radius:12px;padding:12px;font:500 13px/1.6 "IBM Plex Mono",monospace;white-space:pre-wrap;word-break:break-word}
.cp{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:980px){.main{grid-template-columns:1fr}.sticky{position:static}.stage{aspect-ratio:16/10}}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr}.ps{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){.sub,.li svg{transition:none}}
</style></head><body>
<main class="w"><p class="eb">Depth Bench</p><h1>Box Shadow Lab</h1>
<div class="main"><section aria-label="Preview" class="sticky"><div class="chips" role="radiogroup" aria-label="Surface" id="sf"></div><div class="chips" role="radiogroup" aria-label="Shape" id="sp"></div>
<div class="stage" id="stage"><svg class="bg" id="bg" aria-hidden="true"></svg><div class="scn"><div class="sm" aria-hidden="true" id="sm1"></div><div class="sub card" id="sub"></div><div class="sm" aria-hidden="true" id="sm2"></div></div><div class="li" aria-hidden="true" title="Light direction"><svg viewBox="0 0 24 24" fill="#e0a43a" id="lsv"><circle cx="12" cy="4" r="3"/></svg></div></div>
<div class="ex" aria-hidden="true"><span class="pill">Rounded button</span><span class="av" id="av"></span></div></section>
<section aria-label="Controls">
<div class="pn"><h2>Natural shadow generator</h2><div class="row"><label for="el">Elevation <output id="elo">6</output></label><span></span></div><input type="range" id="el" min="1" max="12" value="6"><div class="row"><label for="so">Softness <output id="soo">50</output></label><span></span></div><input type="range" id="so" min="0" max="100" value="50"><div class="row"><label for="la">Light angle <output id="lao">180</output></label><span></span></div><input type="range" id="la" min="0" max="360" value="180"><div class="row"><label for="ln">Layers <output id="lno">5</output></label><span></span></div><input type="range" id="ln" min="2" max="8" value="5">
<div class="g2"><label for="gc" style="font-weight:600">Colour</label><input type="color" id="gc" value="#141932"><label for="ga" style="flex:1">Opacity <input type="range" id="ga" min="2" max="60" value="22" style="width:120px;vertical-align:middle"> <output id="gao">22%</output></label></div><button class="bt p" id="gen" type="button" style="margin-top:8px">Generate</button></div>
<div class="pn"><h2>Layers</h2><div id="ly" role="group" aria-label="Shadow layers"></div><button class="bt" id="add" type="button">Add layer</button>
<div class="row" style="margin-top:12px"><label for="rd">Radius <output id="rdo">16px</output></label><span></span></div><input type="range" id="rd" min="0" max="60" value="16"><div class="g2"><label for="sc2" style="font-weight:600">Subject colour</label><input type="color" id="sc2" value="#ffffff"></div></div>
<div class="pn"><h2>Presets</h2><div class="ps" id="ps"></div></div>
<div class="pn"><h2>CSS</h2><pre id="css"></pre><div class="cp"><button class="bt p" id="cc" type="button">Copy CSS</button><button class="bt" id="ct" type="button">Copy Tailwind</button></div><pre id="tw" style="margin-top:8px"></pre></div></section></div>
<div class="sr" id="live" aria-live="polite"></div></main>
<script>/*SCENES-START*/
var SC=(function(){
 var uid=0,s=1;function id(p){return p+(++uid)}

 var PAL={

 function grad(i,stops,vert){var n=stops.length;return '<linearGradient id="'+i+'" x1="0" y1="0" x2="'+(vert===false?1:0)+'" y2="'+(vert===false?0:1)+'">'+stops.map(function(c,k){return '<stop offset="'+(k/(n-1)).toFixed(2)+'" stop-color="'+c+'"/>'}).join('')+'</linearGradient>'}

 function ridge(r,w,base,amp,col,rough,id2){var d='M0 '+(base+amp)+' ',x=0,y;var pts=[];var n=Math.round(w/16);var ph=r()*6;for(var i=0;i<=n;i++){var xx=i/n*w,v=Math.sin(i*.35+ph)*.5+Math.sin(i*.9+ph*2)*.25+(r()-.5)*rough;pts.push([xx,base-v*amp])}d='M0 '+(base+amp*3)+' L'+pts.map(function(p){return p[0].toFixed(0)+' '+p[1].toFixed(1)}).join(' L')+' L'+w+' '+(base+amp*3)+'Z';return '<path d="'+d+'" fill="'+col+'"/>'}
 function landscape(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),g2=id('sn');var sunY=o.sunY!=null?o.sunY:h*.52,sunX=o.sunX!=null?o.sunX:w*(.3+r()*.4);

  var bases=[h*.56,h*.64,h*.74,h*.86];P.ridge.forEach(function(col,i){out+=ridge(r,w,bases[i],h*(.07+i*.01),col,.5-i*.08);if(i<P.ridge.length-1){var mi=id('ms');out+='<defs><linearGradient id="'+mi+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P.mist+'" stop-opacity="0"/><stop offset="1" stop-color="'+P.mist+'" stop-opacity=".45"/></linearGradient></defs><rect y="'+(bases[i]-10)+'" width="'+w+'" height="'+(h*.2)+'" fill="url(#'+mi+')"/>'}});

+'<div class="g4" style="margin-top:6px">'+[['x','X',-100,100],['y','Y',-100,100],['blur','Blur',0,200],['spread','Spread',-50,100]].map(function(f){return'<input type="range" data-f="'+f[0]+'" min="'+f[2]+'" max="'+f[3]+'" value="'+l[f[0]]+'" aria-label="Layer '+(i+1)+' '+f[1]+'" style="height:24px">'}).join('')+'</div>'
+'<div class="g2"><input type="color" data-f="color" value="'+l.color+'" aria-label="Layer '+(i+1)+' colour"><label>Opacity <input type="range" data-f="alpha" min="0" max="100" value="'+Math.round(l.alpha*100)+'" style="width:110px" aria-label="Layer '+(i+1)+' opacity"> <output>'+Math.round(l.alpha*100)+'%</output></label><label><input type="checkbox" data-f="inset"'+(l.inset?' checked':'')+'> Inset</label></div></div>'});
if(!render.keep)$('#ly').innerHTML=h;
try{localStorage.setItem('db-shadow',JSON.stringify(M))}catch(e){}}
$('#ly').addEventListener('input',function(e){var t=e.target,row=t.closest('.ly');if(!row||!t.dataset.f)return;var i=+row.dataset.i,l=M.layers[i],f=t.dataset.f;if(f==='color')l.color=t.value;else if(f==='alpha')l.alpha=+t.value/100;else if(f==='inset')l.inset=t.checked;else l[f]=+t.value||0;
// sync siblings
row.querySelectorAll('[data-f="'+f+'"]').forEach(function(n){if(n!==t&&f!=='color'&&f!=='alpha'&&f!=='inset')n.value=l[f]});if(f==='alpha')row.querySelector('output').textContent=Math.round(l.alpha*100)+'%';
row.setAttribute('aria-label','Layer '+(i+1)+', offset '+l.x+' '+l.y+', blur '+l.blur);render.keep=true;render();render.keep=false});
$('#ly').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var i=+b.closest('.ly').dataset.i,a=b.dataset.a;if(a==='up'&&i>0){var t=M.layers[i];M.layers[i]=M.layers[i-1];M.layers[i-1]=t;render();focusLy(i-1);say('Layer moved up.')}else if(a==='dn'&&i<M.layers.length-1){var t2=M.layers[i];M.layers[i]=M.layers[i+1];M.layers[i+1]=t2;render();focusLy(i+1);say('Layer moved down.')}else if(a==='eye'){M.layers[i].vis=!M.layers[i].vis;render();focusLy(i);say('Layer '+(i+1)+(M.layers[i].vis?' shown.':' hidden.'))}else if(a==='dup'){M.layers.splice(i+1,0,Object.assign({},M.layers[i]));render();say('Layer duplicated.')}else if(a==='rm'&&M.layers.length>1){M.layers.splice(i,1);render();say('Layer removed.')}});
function focusLy(i){var r=document.querySelector('.ly[data-i="'+i+'"]');if(r)r.focus()}
$('#ly').addEventListener('keydown',function(e){var r=e.target.closest('.ly');if(!r||!e.altKey)return;var i=+r.dataset.i;if(e.key==='ArrowUp'&&i>0){e.preventDefault();var t=M.layers[i];M.layers[i]=M.layers[i-1];M.layers[i-1]=t;render();focusLy(i-1)}else if(e.key==='ArrowDown'&&i<M.layers.length-1){e.preventDefault();var t2=M.layers[i];M.layers[i]=M.layers[i+1];M.layers[i+1]=t2;render();focusLy(i+1)}});
$('#add').onclick=function(){M.layers.push(mk([0,6,12,0,'#141932',.15]));render();say('Layer added.')};
$('#rd').oninput=function(){M.radius=+this.value;render()};$('#sc2').oninput=function(){M.sc=this.value;render()};
document.querySelectorAll('input[name=sf]').forEach(function(r){r.onchange=function(){M.surf=r.value;render()}});document.querySelectorAll('input[name=sp]').forEach(function(r){r.onchange=function(){M.shape=r.value;render()}});
$('#ps').innerHTML=PRESET.map(function(p,i){var ls=p[1].map(function(a){return lstr(mk(a))}).join(',');return'<button type="button" data-i="'+i+'"><i style="box-shadow:'+ls+'"></i>'+p[0]+'</button>'}).join('');
$('#ps').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var p=PRESET[+b.dataset.i];M.layers=p[1].map(mk);render();say(p[0]+' preset applied.')});
// generator
['el','so','la','ln'].forEach(function(id){$('#'+id).addEventListener('input',function(){$('#'+id+'o').textContent=this.value})});$('#ga').addEventListener('input',function(){$('#gao').textContent=this.value+'%'});
$('#gen').onclick=function(){var E=+$('#el').value,S=+$('#so').value/100,A=+$('#la').value*Math.PI/180,N=+$('#ln').value,col=$('#gc').value,base=+$('#ga').value/100,L=[];for(var i=0;i<N;i++){var t=(i+1)/N,oy=E*Math.pow(t,1.8)*2,ox=-Math.sin(A)*oy*.6,y=Math.cos(A)*-oy;y=Math.abs(oy)*(-Math.cos(A));var bl=E*Math.pow(t,1.6)*4*(.4+S*1.2),sp=-E*.2*(1-t),al=base*(1-t*.55)*(1.6/N+.2);L.push({x:Math.round(ox*10)/10,y:Math.round(y*10)/10,blur:Math.round(bl),spread:Math.round(sp),color:col,alpha:Math.min(.6,Math.max(.02,al)),inset:false,vis:true})}M.layers=L;render();say('Generated '+N+' layers at elevation '+E+'.')};
function copy(t,m){try{navigator.clipboard.writeText(t).then(function(){say(m)},function(){say('Copy not available. Select the text instead.')})}catch(e){say('Copy not available. Select the text instead.')}}
$('#cc').onclick=function(){copy($('#css').textContent,'CSS copied.')};$('#ct').onclick=function(){copy($('#tw').textContent,'Tailwind value copied.')};
$('#rd').value=M.radius;$('#sc2').value=M.sc;render();
})();
</script></body></html>
