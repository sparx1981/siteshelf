<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scramble Text Hover — Typography</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#07090c;color:#d9ffe8;font:400 15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden;position:relative}
.atm{position:fixed;inset:0;z-index:0;pointer-events:none}.atm svg{width:100%;height:100%;display:block}
canvas#fld{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.scan{position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(255,255,255,.04) 2px 4px)}
:focus-visible{outline:3px solid #fff;outline-offset:4px;box-shadow:0 0 0 7px #07090c}
.w{position:relative;z-index:3;max-width:1160px;margin:0 auto;padding:28px 22px 36px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.wm{font:700 18px "JetBrains Mono",monospace;letter-spacing:.04em}.tg{color:#8fb3a3;font-size:14px}
.eb{font:700 12px "JetBrains Mono";letter-spacing:.2em;text-transform:uppercase;color:#4dffa0;margin:34px 0 8px}
h1{font:600 clamp(32px,6vw,76px)/1 Unbounded,sans-serif;text-transform:uppercase;margin:0 0 26px;min-height:1.1em}
.main{display:grid;grid-template-columns:1fr 330px;gap:34px;align-items:start}
.main>*{min-width:0}
ol{list-style:none;margin:0;padding:0;border-top:1px solid #1f3a33}
li{border-bottom:1px solid #1f3a33}
li a{position:relative;display:grid;grid-template-columns:auto 1fr auto;column-gap:18px;align-items:baseline;padding:16px 8px 14px 22px;color:#d9ffe8;text-decoration:none;min-height:44px}
li a:before{content:"";position:absolute;left:0;top:50%;width:8px;height:8px;margin-top:-4px;background:#ff4fa3;transform:scale(0);transition:transform .15s}
li a:hover:before,li a:focus-visible:before{transform:scale(1)}
.n{grid-row:1;font:500 13px "JetBrains Mono";color:#8fb3a3;min-width:2ch}
.lb{font:600 clamp(26px,3.9vw,52px)/1.05 Unbounded,sans-serif;text-transform:uppercase;grid-column:2}
.lb .u{color:#4dffa0}
.ds{grid-column:2;color:#8fb3a3;font-size:14px;margin-top:6px}
.ar{grid-column:3;grid-row:1;font:700 22px "JetBrains Mono";color:#4dffa0;opacity:0;transform:translateX(-10px);transition:.2s}
li a:hover .ar,li a:focus-visible .ar{opacity:1;transform:none}
.side{display:grid;gap:16px}
.por{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(77,255,160,.12),transparent 70%);position:relative}
.por canvas{width:100%;height:100%;display:block}
.pn{background:rgba(10,16,18,.78);border:1px solid #1f3a33;border-radius:14px;padding:14px 16px}
.pn h2{font:700 12px "JetBrains Mono";letter-spacing:.16em;text-transform:uppercase;color:#8fb3a3;margin:0 0 8px}
.rd{display:flex;flex-wrap:wrap;gap:6px}
.rd label{position:relative}.rd input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.rd span{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid #1f3a33;border-radius:10px;font:500 13px "JetBrains Mono";cursor:pointer}
.rd input:checked+span{background:#4dffa0;color:#04140c;border-color:#4dffa0}
.rd input:focus-visible+span{outline:3px solid #fff;outline-offset:2px}
select{font:500 14px "JetBrains Mono";color:#d9ffe8;background:#0c1416;border:1px solid #1f3a33;border-radius:10px;min-height:44px;padding:0 10px;width:100%;color-scheme:dark}
.b{font:700 14px "JetBrains Mono";color:#04140c;background:#4dffa0;border:0;border-radius:10px;min-height:46px;width:100%;cursor:pointer}.b:hover{background:#8bffc4}
.ft{margin-top:26px;color:#8fb3a3;font:500 13px "JetBrains Mono"}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:860px){.main{grid-template-columns:1fr}.lb{font-size:30px}.por{max-width:240px;margin:0 auto}.w{padding:20px 14px}}
@media(prefers-reduced-motion:reduce){li a:before,.ar{transition:none}}
</style></head><body>
<div class="atm" id="atm" aria-hidden="true"></div><canvas id="fld" aria-hidden="true"></canvas><div class="scan" aria-hidden="true"></div>
<main class="w">
<div class="top"><span class="wm">Glyphwork</span><span class="tg">Interfaces, identities and odd little tools</span></div>
<p class="eb">Index</p><h1 id="ttl" aria-label="Say it in glyphs"><span aria-hidden="true" id="tt">Say it in glyphs</span></h1>
<div class="main"><nav aria-label="Main"><ol id="ml"></ol></nav>
<div class="side"><div class="por" aria-hidden="true"><canvas id="por" width="660" height="660"></canvas></div>
<div class="pn"><h2>Charset</h2><div class="rd" role="radiogroup" aria-label="Charset" id="cs"></div></div>
<div class="pn"><h2>Speed</h2><label class="sr" for="sp">Speed</label><select id="sp"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select></div>
<button class="b" id="sa">Scramble all</button></div></div>
<p class="ft">Hover, focus or press S to scramble.</p><div class="sr" id="live" aria-live="polite"></div>
</main>
