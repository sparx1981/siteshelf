<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Variable Weight Wave — Typography</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Fraunces:opsz,wght@9..144,100..900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#10142e;color:#fff3df;font:400 15px/1.5 "Space Grotesk",system-ui,sans-serif;overflow-x:hidden;position:relative}
.bgp{position:fixed;inset:0;z-index:0;pointer-events:none}.bgp svg{width:100%;height:100%;display:block}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #10142e}
.w{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:30px 20px 44px}
.eb{font:700 12px "Space Grotesk";letter-spacing:.2em;text-transform:uppercase;color:#ffb347;margin:0 0 6px;text-align:center}
.lead{text-align:center;color:#c9c2e8;margin:0 0 8px}
h1{margin:0;text-align:center;font-family:Fraunces,serif;font-weight:400;font-size:clamp(40px,8.6vw,128px);line-height:1;letter-spacing:-.01em;padding:3vh 0 2vh;text-shadow:0 4px 40px rgba(16,20,46,.5);touch-action:pan-y;cursor:crosshair}
.wd{display:inline-block;white-space:nowrap;margin:0 .12em}
.ch{display:inline-block;text-align:center;font-variation-settings:"wght" 100,"opsz" 144}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.meter{position:relative;margin:8px 0 6px;height:90px}.meter svg{width:100%;height:100%;display:block;overflow:visible}
.cap{font:500 12px "DM Mono",monospace;color:#c9c2e8;text-align:center;margin:0 0 10px}
.lad{display:flex;gap:6px;justify-content:center;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.lad div{flex:none;text-align:center;padding:4px 14px 6px;border-bottom:3px solid transparent;font:400 38px/1.1 Fraunces,serif}
.lad div small{display:block;font:500 11px "DM Mono",monospace;color:#c9c2e8}
.lad div.on{border-color:#ffb347}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;background:rgba(16,20,46,.7);border:1px solid #3a4286;border-radius:18px;padding:16px 18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ctl label{display:flex;justify-content:space-between;font-weight:500;font-size:13px;color:#c9c2e8}
.ctl label span{font-family:"DM Mono",monospace;color:#fff3df}
.ctl input[type=range]{width:100%;accent-color:#ffb347;height:30px}
.sw{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.sw input{width:22px;height:22px;accent-color:#ffb347}
button{font:700 14px "Space Grotesk",sans-serif;color:#10142e;background:#ffb347;border:0;border-radius:12px;min-height:44px;padding:0 18px;cursor:pointer;align-self:end}
button:hover{background:#ffc873}
.reg{position:fixed;z-index:1;width:26px;height:26px;color:#fff3df;opacity:.6;pointer-events:none}
@media(max-width:700px){.ctl{grid-template-columns:1fr 1fr}.w{padding:20px 14px 36px}.lad div{font-size:30px;padding:4px 10px}}
@media(max-width:420px){.ctl{grid-template-columns:1fr}}
</style></head><body>
<div class="bgp" id="bgp" aria-hidden="true"></div>
<svg class="reg" style="left:14px;top:14px" viewBox="0 0 26 26" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="13" cy="13" r="8"/><path d="M13 0v26M0 13h26"/></svg><svg class="reg" style="right:14px;bottom:14px" viewBox="0 0 26 26" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="13" cy="13" r="8"/><path d="M13 0v26M0 13h26"/></svg>
<main class="w">

<input type="range" id="r4" aria-label="Speed" min=".3" max="2" step=".1" value="1"><input type="range" id="r5" aria-label="Optical size" min="9" max="144" step="1" value="144"><input type="range" id="r6" aria-label="Wave position" min="0" max="100" step="1" value="0">
<label class="sw"><input type="checkbox" id="au" role="switch" checked>Auto ripple</label><span></span><button id="rs">Reset</button>
</div>
<div class="sr" id="live" aria-live="polite"></div>
</main>
