<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voices</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--lime:#c9f27a;--mut:rgba(241,244,238,.62);--ln:rgba(241,244,238,.16)}
*{box-sizing:border-box}
html,body{margin:0;background:#14201c;color:#f1f4ee;font:400 16px/1.5 'Instrument Sans',system-ui,sans-serif}
.sec{min-height:100svh;display:flex;align-items:center}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:96px 40px}
.tp{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
.eb{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.eb i{width:8px;height:8px;border-radius:50%;background:var(--lime)}
.ct{display:flex;align-items:center;gap:20px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--mut)}
.ar{width:48px;height:48px;border-radius:50%;border:1px solid var(--ln);background:none;color:#f1f4ee;font-size:18px;cursor:pointer}
.ar:hover{border-color:var(--lime)}
.ar:focus-visible,.tb:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.qg{font:400 120px/.5 'Instrument Serif',serif;color:var(--lime);height:56px}
#qb{transition:opacity .35s,transform .35s;min-height:360px}
#qb.sw{opacity:0;transform:translateY(12px)}
blockquote{font:400 clamp(30px,4.2vw,60px)/1.15 'Instrument Serif',serif;letter-spacing:-.01em;margin:0 0 36px;max-width:960px}
.ps{display:flex;align-items:center;gap:16px}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:600;flex:none;color:#fff}
.nm{font-weight:600;font-size:18px;line-height:1.25}
.rl{color:var(--mut);font-size:14px}
.co{margin-left:auto;border:1px solid var(--ln);border-radius:999px;padding:6px 16px;font:italic 400 20px 'Instrument Serif',serif}
.tbs{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:40px}
.tb{position:relative;background:none;border:0;color:var(--mut);text-align:left;padding:18px 0 0;display:flex;align-items:center;gap:12px;cursor:pointer;font:500 15px 'Instrument Sans'}
.tb .av{width:36px;height:36px;font-size:13px}
.tb[aria-selected=true]{color:#f1f4ee}
.bar{position:absolute;left:0;right:0;top:0;height:3px;background:var(--ln);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lime)}
.tb.past .bar i{width:100%;opacity:.3}
@media(max-width:700px){.wrap{padding:56px 20px}blockquote{font-size:clamp(24px,6.4vw,32px)}#qb{min-height:300px}.co{display:none}.tbs{display:flex;overflow-x:auto;gap:20px}.tb{flex:none;width:56px}.tb span.n{display:none}.ps{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){#qb{transition:none}}
</style></head><body>
<main class="sec"><section class="wrap" id="sc" role="region" aria-label="Testimonials" tabindex="-1">
<div class="tp"><div class="eb"><i></i>Loved by teams</div><div class="ct"><span id="cn">01 / 05</span><button class="ar" id="pv" aria-label="Previous testimonial">←</button><button class="ar" id="nx" aria-label="Next testimonial">→</button></div></div>
<div id="qb" aria-live="polite"><div class="qg" aria-hidden="true">“</div><blockquote id="q"></blockquote>
<div class="ps"><span class="av" id="av"></span><div><div class="nm" id="nm"></div><div class="rl" id="rl"></div></div><span class="co" id="co"></span></div></div>
<div class="tbs" role="tablist" id="tbs"></div></section></main>
<script>
const D=[['We shipped our redesign in half the time and nobody had to learn a new tool.','Priya Raman','Head of Design','Foldaway','#3d6b5a'],
['It is the first dashboard my whole team actually opens before stand-up.','Tomas Weber','Engineering Lead','Brightline','#b5724a'],
['Support replied in four minutes on a Sunday. I did not know software could do that.','Aisha Bello','Founder','Tidewell','#5a62a8'],
['We cut our reporting from two days to ten minutes. The CFO bought us coffee.','Daniel Kim','Finance Director','Northgate','#a8566f'],
['Plain, fast, and kind to look at. Everything I wanted and nothing I did not.','Lucia Moretti','Product Manager','Olivetta','#7b8f3d']];
const $=id=>document.getElementById(id),calm=matchMedia('(prefers-reduced-motion:reduce)').matches,DUR=7000;
const ini=n=>n.split(' ').map(w=>w[0]).join('');
const tbs=$('tbs');const tabs=D.map((d,i)=>{const b=document.createElement('button');b.className='tb';b.role='tab';b.innerHTML='<span class="bar"><i></i></span><span class="av" style="background:'+d[4]+'">'+ini(d[1])+'</span><span class="n">'+d[1].split(' ')[0]+'</span>';b.setAttribute('aria-label',d[1]);b.onclick=()=>go(i);tbs.appendChild(b);return b});
let cur=0,elapsed=0,last=performance.now(),paused=false,raf;
function render(i,anim){const d=D[i];const fill=()=>{$('q').textContent=d[0];$('av').textContent=ini(d[1]);$('av').style.background=d[4];$('nm').textContent=d[1];$('rl').textContent=d[2];$('co').textContent=d[3];$('cn').textContent=String(i+1).padStart(2,'0')+' / 05';$('qb').classList.remove('sw')};
 tabs.forEach((t,j)=>{t.setAttribute('aria-selected',j==i);t.classList.toggle('past',j<i);t.querySelector('i').style.width=j<i?'100%':'0'});
 if(anim&&!calm){$('qb').classList.add('sw');setTimeout(fill,350)}else fill()}
function go(i){cur=(i+D.length)%D.length;elapsed=0;render(cur,true)}
$('pv').onclick=()=>go(cur-1);$('nx').onclick=()=>go(cur+1);
const sc=$('sc');['mouseenter','focusin'].forEach(e=>sc.addEventListener(e,()=>paused=true));['mouseleave','focusout'].forEach(e=>sc.addEventListener(e,()=>{if(!sc.matches(':hover')&&!sc.contains(document.activeElement))paused=false}));
sc.addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(cur+1);if(e.key=='ArrowLeft')go(cur-1)});
render(0,false);
if(!calm)(function f(t){const dt=t-last;last=t;if(!paused){elapsed+=dt;tabs[cur].querySelector('i').style.width=Math.min(100,elapsed/DUR*100)+'%';if(elapsed>=DUR)go(cur+1)}raf=requestAnimationFrame(f)})(last);
</script></body></html>
