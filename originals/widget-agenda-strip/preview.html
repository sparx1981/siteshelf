<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda Strip — Widgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#f4efe6;color:#1f1a14;font:400 15px/1.45 Figtree,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #1f1a14;outline-offset:2px;box-shadow:0 0 0 5px #fff}
.w{max-width:1120px;margin:0 auto;padding:24px 14px 40px}
.card{background:#fffdf8;border:1px solid #e2d9c8;border-radius:24px;box-shadow:0 24px 60px rgba(60,40,10,.16);overflow:hidden}
.hd{position:relative;min-height:190px;padding:20px 24px 14px}
.hd .art{position:absolute;inset:0}.hd .art svg{width:100%;height:100%;display:block}
.hd:after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,#fffdf8)}
.hi{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;min-height:150px}
.eb{font:700 12px Figtree;letter-spacing:.16em;text-transform:uppercase;color:#7a2d14;margin:0 0 4px;text-shadow:0 1px 8px rgba(255,255,255,.6)}
h1{font:400 clamp(30px,5vw,44px)/1.05 "Young Serif",serif;margin:0;text-shadow:0 1px 14px rgba(255,255,255,.6)}
.sub{margin:6px 0 0;font-weight:500;color:#3a3226}
.ac{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{font:700 14px Figtree,sans-serif;color:#1f1a14;background:#fffdf8;border:1px solid #cfc3ac;border-radius:12px;padding:0 14px;min-height:44px;cursor:pointer}
button:hover{background:#f6efe0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:99px;border:1px solid #cfc3ac;background:#fffdf8;font-weight:700;font-size:13px;cursor:pointer}
.chip input{width:18px;height:18px;margin:0}
.chip i{width:10px;height:10px;border-radius:50%}
.st{position:relative;display:flex;border-top:1px solid #eadfcb}
.lanes{flex:none;width:96px;background:#fffdf8;z-index:3;border-right:1px solid #eadfcb;padding-top:34px}
.ln{display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:13px;border-bottom:1px solid #eadfcb;overflow:hidden;transition:height .2s,opacity .2s}
.ln i{width:8px;height:8px;border-radius:50%;margin-right:8px;flex:none}
.sc{flex:1;overflow-x:auto;overflow-y:hidden;position:relative;cursor:grab;touch-action:pan-y;scrollbar-width:thin}
.sc.dr{cursor:grabbing}
.tr{position:relative}
.rl{position:sticky;top:0;height:34px;z-index:2}
.rl span{position:absolute;top:8px;font:500 12px Figtree;color:#6b6253;font-variant-numeric:tabular-nums;transform:translateX(-50%)}
.gl{position:absolute;top:0;bottom:0;width:1px;background:#eadfcb}.gl.h{background:#f3ecdc}
.lane{position:absolute;left:0;right:0;border-bottom:1px solid #eadfcb;transition:height .2s,top .2s}
.ev{position:absolute;display:flex;gap:8px;align-items:flex-start;text-align:left;padding:8px 10px 6px;border-radius:10px;border:0;border-top:3px solid rgba(0,0,0,.28);color:#fff;overflow:hidden;box-shadow:0 4px 12px rgba(30,20,10,.22);cursor:pointer;font:inherit}
.ev:hover{filter:brightness(1.07)}
.ev .th{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.5)}.ev .th svg{width:100%;height:100%;display:block}
.ev b{display:block;font-size:14.5px;line-height:1.2}.ev small{display:block;font:500 12px Figtree;opacity:.95;font-variant-numeric:tabular-nums;margin-top:2px}
.ev div{min-width:0}.ev div b,.ev div small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{position:absolute;top:0;bottom:0;width:2px;background:#e8453c;z-index:2;pointer-events:none;box-shadow:0 0 24px 4px rgba(232,69,60,.28)}
.now span{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:#e8453c;color:#fff;font:700 11.5px Figtree;padding:2px 8px;border-radius:99px;white-space:nowrap}
.lg{padding:10px 24px 16px;display:flex;flex-wrap:wrap;gap:6px 18px;color:#6b6253;font-size:13px;border-top:1px solid #eadfcb}
dialog{border:0;border-radius:20px;padding:0;max-width:440px;width:calc(100% - 28px);box-shadow:0 30px 80px rgba(30,20,10,.4);color:#1f1a14}
dialog::backdrop{background:rgba(31,26,20,.5)}
.dh{height:150px}.dh svg{width:100%;height:100%;display:block}
.db{padding:18px 22px 22px}.db h2{font:400 26px "Young Serif",serif;margin:0 0 4px}.db p{margin:6px 0}
.tag{display:inline-block;font:700 12px Figtree;color:#fff;border-radius:99px;padding:2px 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){.lanes{width:30px}.ln{padding:0;justify-content:center}.ln span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px}.ln i{display:none}.ac{align-items:flex-start;width:100%}.bt,.chips{justify-content:flex-start}.hd{padding:16px}.lg{padding:10px 16px 14px}dialog{margin:auto auto 0;border-radius:20px 20px 0 0;width:100%;max-width:none}}
@media(prefers-reduced-motion:reduce){.ln,.lane{transition:none}}
</style></head><body>

<div class="hi"><div><p class="eb">Lantern Calendar</p><h1 id="ttl">Thursday 15 October</h1><p class="sub" id="sub"></p></div>
<div class="ac"><div class="bt"><button id="pd" aria-label="Previous day">&larr;</button><button id="nd" aria-label="Next day">&rarr;</button><button id="td">Today</button><button id="zo" aria-label="Zoom out">&minus;</button><button id="zi" aria-label="Zoom in">+</button></div>
<div class="chips" role="group" aria-label="Calendars"></div></div></div></div>
<div class="st"><div class="lanes" id="lanes"></div><div class="sc" id="sc" role="group" aria-label="Day timeline, drag to scroll"><div class="tr" id="tr"></div></div></div>
<div class="lg"><span>Drag to scroll, arrow keys to move between events.</span><span id="lgz"></span></div>
</div>
<dialog id="dlg" aria-labelledby="dt"><div class="dh" id="dh"></div><div class="db"><span class="tag" id="dc"></span><h2 id="dt"></h2><p id="dtm"></p><p id="dpl"></p><p id="dn"></p><form method="dialog"><button>Close</button></form></div></dialog>
<div class="sr" id="live" aria-live="polite"></div>
</main>

function zoomTo(t){hwT=Math.max(70,Math.min(240,t));if(reduce){var c=(sc.scrollLeft+sc.clientWidth/2)/HW;HW=hwT;layout();sc.scrollLeft=c*HW-sc.clientWidth/2;$('#lgz').textContent=HW+' px per hour';return}cancelAnimationFrame(spRaf);var last=performance.now(),k=170,c2=26;sp.x=HW;(function f(t0){var dt=Math.min(.032,(t0-last)/1000);last=t0;var a=k*(hwT-sp.x)-c2*sp.v;sp.v+=a*dt;sp.x+=sp.v*dt;var ctr=(sc.scrollLeft+sc.clientWidth/2)/HW;HW=sp.x;layout();sc.scrollLeft=ctr*HW-sc.clientWidth/2;$('#lgz').textContent=Math.round(HW)+' px per hour';if(Math.abs(hwT-sp.x)>.4||Math.abs(sp.v)>.4)spRaf=requestAnimationFrame(f);else{HW=hwT;layout();$('#lgz').textContent=HW+' px per hour'}})(last)}
$('#zi').onclick=function(){zoomTo(HW+30)};$('#zo').onclick=function(){zoomTo(HW-30)};
function setDay(d){day=d;load();sc.scrollLeft=0;if(d.getTime()===TODAY.getTime())goNow()}
$('#pd').onclick=function(){setDay(new Date(day.getFullYear(),day.getMonth(),day.getDate()-1))};
$('#nd').onclick=function(){setDay(new Date(day.getFullYear(),day.getMonth(),day.getDate()+1))};
$('#td').onclick=function(){setDay(new Date(TODAY));goNow()};
document.querySelector('.chips').addEventListener('change',function(e){show[e.target.dataset.k]=e.target.checked?1:0;layout()});
document.addEventListener('keydown',function(e){if((e.key==='n'||e.key==='N')&&!e.target.closest('input,textarea,dialog'))goNow()});
setInterval(placeNow,30000);
load();goNow();
})();
</script></body></html>
