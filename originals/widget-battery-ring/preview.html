<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battery Health Ring — Widgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#071a1c;color:#eafff6;font:400 15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden;position:relative}
.bg{position:fixed;inset:-10%;z-index:0;filter:blur(50px);transform:scale(1.2)}.bg svg{width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;z-index:0;background:rgba(4,16,15,.55)}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #071a1c}
.w{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:28px 16px 44px}
.card{display:grid;grid-template-columns:420px 1fr;gap:28px;background:rgba(9,32,34,.78);border:1px solid #1f5a5c;border-radius:28px;padding:28px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.card>*{min-width:0}
.eb{font:600 12px Inter;letter-spacing:.18em;text-transform:uppercase;color:#4df0b0;margin:0 0 6px}
.stage{position:relative;width:min(340px,84vw);aspect-ratio:1;margin:8px auto 0}
.stage svg.rg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.phone{position:absolute;left:50%;top:41%;width:29%;transform:translate(-50%,-50%) rotate(-4deg);filter:drop-shadow(0 24px 22px rgba(0,0,0,.45))}
.phone svg{display:block;width:100%}
.big{position:absolute;left:0;right:0;bottom:15%;text-align:center;font:700 clamp(40px,7vw,60px)/1 Outfit,sans-serif;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.bolt{position:absolute;left:50%;top:-6px;width:26px;transform:translateX(-50%);color:#c8ff5a;opacity:0;transition:opacity .3s}.chg .bolt{opacity:1}
.mote{position:absolute;width:5px;height:5px;border-radius:50%;background:#c8ff5a;opacity:0;animation:mt 4s linear infinite}
.chg .mote{opacity:.8}
@keyframes mt{from{transform:translateY(20px);opacity:0}30%{opacity:.8}to{transform:translateY(-80px);opacity:0}}
.sweep{animation:sw 3s linear infinite;transform-origin:center}@keyframes sw{to{stroke-dashoffset:-40}}
.stat{text-align:center;margin:10px 0 14px;min-height:48px}
.stat b{display:block;font-size:17px}.stat span{color:#9cc9bd}
.sw{display:grid;gap:8px}
.swr{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0c2a2c;border:1px solid #1f5a5c;border-radius:14px;padding:8px 14px;min-height:46px}
.swr label{font-weight:500;cursor:pointer;flex:1}
.tg{position:relative;width:46px;height:28px;flex:none}
.tg input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.tg i{position:absolute;inset:0;border-radius:99px;background:#27474a;transition:background .2s;pointer-events:none}
.tg i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tg input:checked+i{background:#4df0b0}.tg input:checked+i:after{transform:translateX(18px)}
.tg input:focus-visible+i{outline:3px solid #fff;outline-offset:3px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.t{background:#0c2a2c;border:1px solid #1f5a5c;border-radius:16px;padding:12px}
.t small{display:block;color:#9cc9bd;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.t b{display:block;font:600 22px Outfit,sans-serif;margin-top:2px}
.hc{background:#0c2a2c;border:1px solid #1f5a5c;border-radius:18px;padding:16px;margin-bottom:16px}
.hh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h2{font:600 13px Inter;letter-spacing:.14em;text-transform:uppercase;color:#9cc9bd;margin:0}
.tabs{display:inline-flex;border:1px solid #1f5a5c;border-radius:12px;overflow:hidden}
.tabs button{font:600 13px Inter;color:#eafff6;background:transparent;border:0;padding:0 14px;min-height:40px;cursor:pointer}
.tabs button[aria-selected=true]{background:#4df0b0;color:#02241a}
.cv{position:relative;touch-action:none;user-select:none;margin-top:8px}.cv svg{width:100%;display:block;overflow:visible}
.rd{font:500 13px "JetBrains Mono",monospace;color:#c8ff5a;margin-top:6px;min-height:20px}
.tips{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.tips li label{display:flex;align-items:center;gap:12px;background:#0c2a2c;border:1px solid #1f5a5c;border-radius:14px;padding:10px 14px;min-height:48px;cursor:pointer}
.tips input{width:22px;height:22px;accent-color:#4df0b0;flex:none}
.tips em{margin-left:auto;font:500 13px "JetBrains Mono",monospace;font-style:normal;color:#c8ff5a;white-space:nowrap}
.tot{display:flex;justify-content:space-between;margin-top:10px;font-weight:600}
.tot span:last-child{font:600 20px Outfit,sans-serif;color:#c8ff5a}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:900px){.card{grid-template-columns:1fr;padding:18px}.tiles{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.mote,.sweep{animation:none!important}}
</style></head><body>
<div class="bg" id="bg" aria-hidden="true"></div><div class="ov"></div>
<main class="w"><div class="card" id="card">

<p class="eb">Nimbus N2 · Battery</p>

<div id="motes"></div>
<div class="phone" id="phone"></div>
<div class="big" id="big" aria-hidden="true">76%</div>
</div>

<div class="sw">
<div class="swr"><label for="sp">Plugged in</label><span class="tg"><input type="checkbox" id="sp" role="switch"><i></i></span></div>

<div class="hc"><div class="hh"><h2>Charge history</h2><div class="tabs" role="tablist" aria-label="History range"><button role="tab" aria-selected="true" data-r="24" id="t24">24 hours</button><button role="tab" aria-selected="false" data-r="7" id="t7" tabindex="-1">7 days</button></div></div>
<div class="cv" id="cv"><svg id="cs" viewBox="0 0 640 220" role="slider" tabindex="0" aria-label="Charge history cursor" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"></svg></div><div class="rd" id="rd"></div></div>
<h2>Tips to extend battery life</h2>
<ul class="tips" id="tips"></ul>
<div class="tot"><span>Estimated gain</span><span id="gain">+0 min per day</span></div>
<p class="sr" id="live" aria-live="polite"></p>
</section></div></main>
<script>/*SCENES-START*/
