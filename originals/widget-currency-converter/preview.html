<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Currency Converter Ticker — Widgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#0b1030;color:#eef1ff;font:400 15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden;position:relative}
.bg{position:fixed;inset:-10%;z-index:0;filter:blur(50px);transform:scale(1.2)}.bg svg{width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;z-index:0;background:rgba(7,11,34,.5)}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #0b1030}
.tk{position:relative;z-index:2;display:flex;align-items:center;background:#0a0f2e;border-bottom:1px solid #232c63;height:48px;overflow:hidden}
.tkv{flex:1;overflow:hidden;white-space:nowrap}
.tkr{display:inline-flex;animation:mq 60s linear infinite}
.tk:hover .tkr,.tk:focus-within .tkr,.tk.p .tkr{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.it{display:inline-flex;gap:8px;align-items:center;padding:0 22px;font:500 14px "IBM Plex Mono",monospace;border-right:1px solid #232c63}
.it b{font-weight:500;color:#eef1ff}.up{color:#4df0b0}.dn{color:#ff7a6b}
.pz{flex:none;margin:0 8px;font:600 12px Inter;color:#eef1ff;background:#161e4e;border:1px solid #2e3a80;border-radius:10px;min-height:36px;padding:0 12px;cursor:pointer}
.w{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:26px 16px 44px}
.card{background:rgba(14,20,56,.82);border:1px solid #2e3a80;border-radius:26px;padding:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.eb{font:600 12px Inter;letter-spacing:.18em;text-transform:uppercase;color:#ffd36b;margin:0 0 4px}
h1{font:600 clamp(24px,4vw,32px)/1.1 Sora,sans-serif;margin:0 0 16px}
.row{display:grid;grid-template-columns:1.3fr 1fr auto 1fr;gap:10px;align-items:end}
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#a9b3e0;margin-bottom:4px;font-weight:600}
input,select{width:100%;font:500 18px Inter,sans-serif;color:#eef1ff;background:#0d1440;border:1px solid #2e3a80;border-radius:14px;padding:0 14px;min-height:52px;color-scheme:dark}
.amt{position:relative}.amt span{position:absolute;left:14px;bottom:13px;font:500 18px "IBM Plex Mono",monospace;color:#a9b3e0}.amt input{padding-left:44px;font:600 22px Sora,sans-serif}
.sw{width:52px;height:52px;border-radius:50%;border:1px solid #2e3a80;background:#1b2670;color:#fff;cursor:pointer;display:grid;place-items:center}
.sw:hover{background:#2a38a0}.sw svg{width:22px;height:22px;transition:transform .4s}
.err{color:#ffb4a8;font-size:13px;min-height:20px;margin:6px 0 0}
.q{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.q button,.chip button{font:600 13px Inter;color:#eef1ff;background:#161e4e;border:1px solid #2e3a80;border-radius:99px;min-height:40px;padding:0 14px;cursor:pointer}
.q button:hover,.chip button:hover{background:#222e80}
.notes{position:relative;height:230px;margin:6px 0 8px}
.note{position:absolute;top:20px;width:min(300px,56%);transition:left .45s cubic-bezier(.4,0,.2,1),transform .45s,opacity .2s;filter:drop-shadow(0 18px 18px rgba(0,0,0,.45))}
.note svg{display:block;width:100%}
.n1{left:6%;transform:rotate(-6deg)}.n2{left:auto;right:6%;transform:rotate(5deg);top:36px}
.arc .n1{left:30%;transform:rotate(0) translateY(-14px);opacity:.5}.arc .n2{right:30%;transform:rotate(0) translateY(14px);opacity:.5}
.res{text-align:center;margin:4px 0 14px}
.rb{font:600 clamp(30px,6vw,56px)/1.05 Sora,sans-serif;font-variant-numeric:tabular-nums}
.rb small{font:500 .35em "IBM Plex Mono",monospace;color:#a9b3e0;margin-left:6px}
.rt{font:500 14px "IBM Plex Mono",monospace;color:#a9b3e0;margin-top:4px}
.ud{font-size:13px;color:#a9b3e0;margin-top:2px}
.cp{margin-top:8px;font:600 13px Inter;color:#eef1ff;background:#161e4e;border:1px solid #2e3a80;border-radius:12px;min-height:40px;padding:0 14px;cursor:pointer}
.sp{background:#0d1440;border:1px solid #232c63;border-radius:18px;padding:14px 16px;margin-bottom:14px}
.sph{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font:500 13px "IBM Plex Mono",monospace;color:#a9b3e0}
.sph h2{font:600 13px Inter;letter-spacing:.12em;text-transform:uppercase;margin:0;color:#a9b3e0}
.spv{touch-action:none;user-select:none;margin-top:6px}.spv svg{width:100%;display:block;overflow:visible}
.rd{font:500 13px "IBM Plex Mono",monospace;color:#ffd36b;min-height:20px;margin-top:4px}
.fv{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fv h2{font:600 13px Inter;letter-spacing:.12em;text-transform:uppercase;margin:0 6px 0 0;color:#a9b3e0}
.star{font:600 13px Inter;color:#eef1ff;background:#161e4e;border:1px solid #2e3a80;border-radius:99px;min-height:40px;padding:0 14px;cursor:pointer}
.star[aria-pressed=true]{background:#ffd36b;color:#2a1c00;border-color:#ffd36b}
.chip{display:inline-flex;gap:2px}.chip .x{padding:0 10px;min-width:40px}
.note2{color:#7f8bc4;font-size:13px;margin:14px 0 0;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){.row{grid-template-columns:1fr auto 1fr}.row .amt{grid-column:1/-1}.card{padding:18px}.notes{height:190px}.note{width:62%}.it{font-size:13px}}
@media(prefers-reduced-motion:reduce){.tkr{animation:none}.tkv{overflow-x:auto}.note,.sw svg{transition:none}}
</style></head><body>
<div class="bg" id="bg" aria-hidden="true"></div><div class="ov"></div>
<div class="tk" aria-label="Rate ticker, sample values"><div class="tkv" id="tkv"><div class="tkr" id="tkr"></div></div><button class="pz" id="pz" aria-pressed="false">Pause ticker</button></div>
<main class="w"><div class="card">
<p class="eb">Mintly Rates</p><h1>Convert money</h1>
<div class="row"><div class="amt"><label for="am">Amount</label><span id="sym">$</span><input id="am" inputmode="decimal" value="1250" autocomplete="off"></div>
<div><label for="fr">From</label><select id="fr"></select></div>
<button class="sw" id="sw" aria-label="Swap currencies"><svg id="swi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg></button>
<div><label for="to">To</label><select id="to"></select></div></div>
<p class="err" id="err" role="alert"></p>
<div class="q" id="q"></div>
<div class="notes" id="notes" aria-hidden="true"><div class="note n1" id="n1"></div><div class="note n2" id="n2"></div></div>
<div class="res" id="res"><div class="rb" id="rb">0</div><div class="rt" id="rt"></div><div class="ud" id="ud"></div><button class="cp" id="cp">Copy result</button></div>
<div class="sp"><div class="sph"><h2 id="sph">30-day trend</h2><span id="sps"></span></div><div class="spv" id="spv"><svg id="ss" viewBox="0 0 640 200" role="slider" tabindex="0" aria-label="Rate history cursor" aria-valuemin="0" aria-valuemax="30" aria-valuenow="30"></svg></div><div class="rd" id="rd"></div></div>
<div class="fv"><h2>Favourite pairs</h2><button class="star" id="star" aria-pressed="false">&#9734; Favourite this pair</button><span id="favs" style="display:contents"></span></div>
<p class="note2">Sample rates for demonstration, not for trading.</p>
<div class="sr" id="live" aria-live="polite"></div>
</div></main>
<script>/*SCENES-START*/
var SC=(function(){
 var uid=0,s=1;function id(p){return p+(++uid)}
 function R(seed){var x=seed||1;return function(){x=(x*9301+49297)%233280;return x/233280}}
 var PAL={

 function grad(i,stops,vert){var n=stops.length;return '<linearGradient id="'+i+'" x1="0" y1="0" x2="'+(vert===false?1:0)+'" y2="'+(vert===false?0:1)+'">'+stops.map(function(c,k){return '<stop offset="'+(k/(n-1)).toFixed(2)+'" stop-color="'+c+'"/>'}).join('')+'</linearGradient>'}
 function grain(op){var i=id('gn');return '<filter id="'+i+'" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .6 0"/></filter><rect width="100%" height="100%" filter="url(#'+i+')" opacity="'+(op==null?.22:op)+'" style="mix-blend-mode:overlay"/>'}
 function vig(w,h,str){var i=id('vg');return '<radialGradient id="'+i+'" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="'+(str==null?.45:str)+'"/></radialGradient><rect width="'+w+'" height="'+h+'" fill="url(#'+i+')"/>'}
 function wrap(w,h,inner,cls){return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"'+(cls?' class="'+cls+'"':'')+'>'+inner+'</svg>'}
 function ridge(r,w,base,amp,col,rough,id2){var d='M0 '+(base+amp)+' ',x=0,y;var pts=[];var n=Math.round(w/16);var ph=r()*6;for(var i=0;i<=n;i++){var xx=i/n*w,v=Math.sin(i*.35+ph)*.5+Math.sin(i*.9+ph*2)*.25+(r()-.5)*rough;pts.push([xx,base-v*amp])}d='M0 '+(base+amp*3)+' L'+pts.map(function(p){return p[0].toFixed(0)+' '+p[1].toFixed(1)}).join(' L')+' L'+w+' '+(base+amp*3)+'Z';return '<path d="'+d+'" fill="'+col+'"/>'}
 function landscape(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),g2=id('sn');var sunY=o.sunY!=null?o.sunY:h*.52,sunX=o.sunX!=null?o.sunX:w*(.3+r()*.4);

  var bases=[h*.56,h*.64,h*.74,h*.86];P.ridge.forEach(function(col,i){out+=ridge(r,w,bases[i],h*(.07+i*.01),col,.5-i*.08);if(i<P.ridge.length-1){var mi=id('ms');out+='<defs><linearGradient id="'+mi+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P.mist+'" stop-opacity="0"/><stop offset="1" stop-color="'+P.mist+'" stop-opacity=".45"/></linearGradient></defs><rect y="'+(bases[i]-10)+'" width="'+w+'" height="'+(h*.2)+'" fill="url(#'+mi+')"/>'}});
  if(o.trees!==false){var tc=P.ridge[3];for(var t=0;t<(o.trees||26);t++){var tx=r()*w,ty=h*(.86+r()*.1),th=h*(.06+r()*.1);out+='<path d="M'+tx.toFixed(0)+' '+(ty-th).toFixed(0)+' L'+(tx-th*.28).toFixed(0)+' '+ty.toFixed(0)+' L'+(tx+th*.28).toFixed(0)+' '+ty.toFixed(0)+'Z" fill="'+tc+'"/>'}}

 function sea(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),gs=id('sa'),hz=h*.5;var sx=w*(.35+r()*.3);
  var out='<defs>'+grad(g,P.sky)+grad(gs,[P.sky[2],P.ridge[1],P.ridge[3]])+'</defs><rect width="'+w+'" height="'+hz+'" fill="url(#'+g+')"/><rect y="'+hz+'" width="'+w+'" height="'+(h-hz)+'" fill="url(#'+gs+')"/>';
  out+='<circle cx="'+sx+'" cy="'+(hz-h*.04)+'" r="'+(h*.05)+'" fill="'+P.sun+'"/><circle cx="'+sx+'" cy="'+(hz-h*.04)+'" r="'+(h*.2)+'" fill="'+P.sun+'" opacity=".25"/>';
  for(var i=0;i<46;i++){var y=hz+4+Math.pow(r(),1.6)*(h-hz-6),ww=20+(y-hz)*(1.2+r()*3),x=sx+(r()-.5)*(60+(y-hz)*1.4);out+='<rect x="'+(x-ww/2).toFixed(0)+'" y="'+y.toFixed(0)+'" width="'+ww.toFixed(0)+'" height="'+(1+(y-hz)/90).toFixed(1)+'" rx="2" fill="'+P.sun+'" opacity="'+(.15+r()*.5).toFixed(2)+'"/>'}

  out+=ridge(r,w,hz+4,h*.015,P.ridge[2],.2)+grain(o.grain)+vig(w,h);return wrap(w,h,out,o.cls)}
 function city(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'night'],r=R(seed),g=id('sk');var out='<defs>'+grad(g,P.sky)+'</defs><rect width="'+w+'" height="'+h+'" fill="url(#'+g+')"/>';
  if(P.star)for(var i=0;i<60;i++)out+='<circle cx="'+(r()*w).toFixed(0)+'" cy="'+(r()*h*.4).toFixed(0)+'" r="'+(.5+r()*1.2).toFixed(1)+'" fill="#fff" opacity="'+(.3+r()*.6).toFixed(2)+'"/>';

   var step=wl?11:16;for(var yy=base-bh+10;yy<base-4;yy+=step){for(var xx=x+6;xx<x+bw-8;xx+=step){if(r()>(wl?.55:.7))out+='<rect x="'+xx.toFixed(0)+'" y="'+yy.toFixed(0)+'" width="4" height="6" fill="'+(r()>.6?'#ffe2a0':'#ffc66e')+'" opacity="'+(.5+r()*.5).toFixed(2)+'"/>'}}x+=bw+2+r()*6}
   var mi=id('ms');out+='<defs><linearGradient id="'+mi+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P.mist+'" stop-opacity="0"/><stop offset="1" stop-color="'+P.mist+'" stop-opacity=".35"/></linearGradient></defs><rect y="'+(base-h*.1)+'" width="'+w+'" height="'+(h*.2)+'" fill="url(#'+mi+')"/>'}

 function interior(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,r=R(seed),wall=o.wall||'#e9dfd0',floor=o.floor||'#b58a5e',acc=o.acc||'#2f6b4f',g=id('lt'),gf=id('fl');

  out+='<polygon points="'+wx+','+(wy+wh)+' '+(wx+ww)+','+(wy+wh)+' '+(wx-w*.25)+','+h+' '+(wx-w*.55)+','+h+'" fill="url(#'+g+')" style="mix-blend-mode:screen"/>';
  out+='<rect x="'+(w*.08)+'" y="'+(h*.56)+'" width="'+(w*.32)+'" height="'+(h*.2)+'" rx="14" fill="'+acc+'"/><rect x="'+(w*.06)+'" y="'+(h*.5)+'" width="'+(w*.36)+'" height="'+(h*.14)+'" rx="18" fill="'+acc+'" opacity=".88"/><ellipse cx="'+(w*.24)+'" cy="'+(h*.78)+'" rx="'+(w*.2)+'" ry="'+(h*.025)+'" fill="rgba(0,0,0,.18)"/>';
  out+='<rect x="'+(w*.46)+'" y="'+(h*.6)+'" width="'+(w*.07)+'" height="'+(h*.15)+'" rx="6" fill="#4a3320"/><path d="M'+(w*.495)+' '+(h*.6)+' q-30 -60 -10 -110 M'+(w*.495)+' '+(h*.6)+' q30 -70 24 -120 M'+(w*.495)+' '+(h*.6)+' q-6 -80 4 -140" stroke="#2f7a4a" stroke-width="10" fill="none" stroke-linecap="round"/>';

s+='<path d="'+p+'L'+X(n-1)+' '+(CH-PB)+'L'+X(0)+' '+(CH-PB)+'Z" fill="url(#sg)"/><path id="sl" d="'+p+'" fill="none" stroke="'+col+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
var cx=X(S.cur),cy=Y(a[S.cur]);s+='<line x1="'+cx+'" x2="'+cx+'" y1="10" y2="'+(CH-PB)+'" stroke="#ffd36b" stroke-dasharray="4 4"/><circle cx="'+cx+'" cy="'+cy+'" r="6" fill="#ffd36b" stroke="#0d1440" stroke-width="3"/>';

var ch=(a[n-1]/a[0]-1)*100,dl=S.cur===n-1?'Now':(n-1-S.cur)+' days ago';var txt=dl+' · 1 '+S.fr+' = '+r4(a[S.cur])+' '+S.to;$('#rd').textContent=txt;sv.setAttribute('aria-valuetext',txt);
$('#sps').textContent='High '+r4(Math.max.apply(0,a))+' · Low '+r4(Math.min.apply(0,a))+' · '+(ch>=0?'▲ +':'▼ ')+ch.toFixed(2)+'%';

function favs(){var key=S.fr+'>'+S.to,on=S.fav.indexOf(key)>-1;var b=$('#star');b.setAttribute('aria-pressed',on);b.innerHTML=(on?'★ Favourited':'☆ Favourite this pair');

setInterval(function(){S.upd+=1;if(S.upd>=5){S.upd=0;var r=SC.R(Date.now()%9999);CUR.forEach(function(c){var o=R[c[0]];if(c[0]!=='USD')R[c[0]]=o*(1+(r()-.5)*.0012)});tick();calc();spark(false)}ud()},1000);
drawNotes();tick();calc();spark(true);favs();ud();
