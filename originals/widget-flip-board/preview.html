<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Departure Flip Board — Widgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Oswald:wght@500&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--cw:clamp(14px,calc((100vw - 120px)/42),25px)}
body{margin:0;min-height:100vh;background:#1b1740;color:#f4ecd8;font:500 15px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:hidden;position:relative}
.bgp{position:fixed;inset:0;z-index:0;pointer-events:none}.bgp svg{width:100%;height:100%;display:block}
.bgp:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(10,8,20,.2),rgba(10,8,20,.45))}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #14110f}
.w{position:relative;z-index:1;max-width:1020px;margin:0 auto;padding:28px 14px 44px}
.frame{position:relative;padding:14px;border-radius:20px;background:linear-gradient(180deg,#e2c27a,#b08d57 40%,#8a6a30);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.35),0 34px 60px rgba(0,0,0,.55)}
.frame .sc{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f2dcaa,#7a5a24);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.sc:after{content:"";position:absolute;left:2px;right:2px;top:50%;height:1.5px;background:rgba(0,0,0,.5);transform:rotate(35deg)}
.board{background:#14110f;border-radius:10px;padding:14px 16px 18px;box-shadow:inset 0 0 0 2px #3a2a10,inset 0 12px 30px rgba(0,0,0,.6)}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.hd svg{width:34px;height:34px;color:#d8b56a;flex:none}
.hd h1{font:500 clamp(22px,4vw,34px)/1 Oswald,sans-serif;letter-spacing:.14em;margin:0;color:#f4ecd8}
.eb{font:700 11px "Space Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:#d8b56a;display:block;margin-top:4px}
.clk{margin-left:auto;font:700 clamp(16px,3vw,26px) "Space Mono",monospace;color:#ffc247;font-variant-numeric:tabular-nums}

.cap{font:700 11px "Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#9a8e72;margin-bottom:6px}
.row{margin-bottom:7px}
.grp{display:flex;gap:2px}
.fc{position:relative;display:block;width:calc(var(--cw)*.78);height:calc(var(--cw)*1.4);font:500 calc(var(--cw)*1.18)/calc(var(--cw)*1.4) Oswald,sans-serif;perspective:300px;color:#f4ecd8}
.fc>span{position:absolute;left:0;right:0;overflow:hidden;background:#1d1a17;height:50%;border-radius:3px}
.fc b{position:absolute;left:0;right:0;text-align:center;font-weight:500;height:calc(var(--cw)*1.4)}
.fc .t,.fc .ft{top:0;border-radius:3px 3px 0 0;background:linear-gradient(#242019,#1d1a17)}
.fc .bm,.fc .fb{bottom:0;top:auto;border-radius:0 0 3px 3px;background:linear-gradient(#1d1a17,#171411)}
.fc .t b,.fc .ft b{top:0}.fc .bm b,.fc .fb b{bottom:0;top:auto}
.fc .ft{transform-origin:50% 100%;z-index:3;backface-visibility:hidden}
.fc .fb{transform-origin:50% 0;transform:rotateX(90deg);z-index:2;backface-visibility:hidden}
.fc:after{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;margin-top:-.75px;background:#0a0908;z-index:5}
.sp{display:block;width:calc(var(--cw)*.78);height:1px}
.s-bd .gs .fc{color:#ffc247}.s-dl .gs .fc{color:#ff7a6b}.s-lc .gs .fc{color:#fff}.s-lc .gs .fc>span{background:#c23b30!important}.s-dp .gs .fc{color:#8a8378}.s-dp .grp:not(.gs) .fc{color:#8a8378}.s-cx .gs .fc{color:#ff7a6b}.s-cx .grp:not(.gs) .fc{color:#8a8378}

button.b{font:700 14px "DM Sans",sans-serif;color:#f4ecd8;background:rgba(20,17,15,.85);border:1px solid #8a6a30;border-radius:12px;min-height:44px;padding:0 16px;cursor:pointer}

.swt input{width:20px;height:20px;accent-color:#ffc247;margin:0}
.nx{margin-left:auto;font:700 12px "Space Mono",monospace;color:#f4ecd8;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){:root{--cw:calc(((100vw - 88px)/17 - 2px)/.78)}

.row{grid-template-columns:repeat(17,calc(var(--cw)*.78 + 2px));justify-content:center;column-gap:0;row-gap:3px;margin-bottom:12px}

.nx{margin-left:0;width:100%}}
@media(prefers-reduced-motion:reduce){}

</main>
