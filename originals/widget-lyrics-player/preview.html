<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyrics Now Playing — Widgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#14183a;color:#fff;font:400 15px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:hidden;position:relative}
.bg{position:fixed;inset:-20%;z-index:0;filter:blur(60px) saturate(1.4);transform:scale(1.4)}.bg svg{width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;z-index:0;background:rgba(11,13,34,.46)}
.ov svg{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #0b0d22}
.w{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:30px 18px;display:grid;grid-template-columns:360px 1fr;gap:26px;min-height:100vh;align-items:center}
.pl{display:flex;flex-direction:column;gap:14px}
.eb{font:700 12px "DM Sans";letter-spacing:.18em;text-transform:uppercase;color:#fff3d6;opacity:.85;margin:0}
.cover{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 26px 60px rgba(0,0,0,.55);transform:rotate(-1deg);aspect-ratio:1}
.cover>svg{display:block;width:100%;height:100%}
.glow{position:absolute;left:50%;top:44%;width:60%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,200,110,.55),transparent 65%);animation:gp 6s ease-in-out infinite;animation-play-state:paused;pointer-events:none;mix-blend-mode:screen}
.playing .glow{animation-play-state:running}
@keyframes gp{50%{transform:translate(-50%,-50%) scale(1.15);opacity:.75}}
h1{font:600 32px/1.1 Fraunces,serif;margin:2px 0 0}
.ar{color:#d9dcf5;margin:0}
.seek{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums;font-size:13px;color:#d9dcf5}
input[type=range]{width:100%;accent-color:#fff3d6;height:28px}
.tr{display:flex;justify-content:center;align-items:center;gap:20px}
.ib{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:grid;place-items:center}
.ib:hover{background:rgba(255,255,255,.22)}
.ib svg{width:22px;height:22px}
.pp{width:68px;height:68px;background:#fff3d6;color:#2a1a00}.pp:hover{background:#fff}.pp svg{width:30px;height:30px}
.tg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tg button,.tg label{font:600 13px "DM Sans",sans-serif;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:0 14px;min-height:40px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.tg button[aria-pressed=true],.tg button.on{background:#fff3d6;color:#2a1a00;border-color:#fff3d6}
.tg svg{width:16px;height:16px}
.lp{position:relative;background:rgba(10,12,36,.5);border:1px solid rgba(255,255,255,.12);border-radius:28px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);height:min(80vh,640px);overflow:hidden}
.ly{height:100%;overflow-y:auto;padding:40vh 28px;scrollbar-width:none;scroll-behavior:smooth}
.ly::-webkit-scrollbar{display:none}
.sec{font:700 11px "DM Sans";letter-spacing:.2em;text-transform:uppercase;color:#fff3d6;opacity:.7;margin:26px 0 6px}
.ln{display:block;width:100%;text-align:left;background:none;border:0;color:rgba(255,255,255,.45);font:500 var(--fs,26px)/1.3 "DM Sans",sans-serif;padding:8px 6px;border-radius:12px;cursor:pointer;transform-origin:left center;transition:transform .3s,color .3s,filter .3s;filter:blur(var(--bl,0px))}
.ln:hover{color:#fff}
.ln.past{color:rgba(255,255,255,.7)}
.ln.act{color:#fff;font-family:Fraunces,serif;font-weight:600;font-size:calc(var(--fs,26px)*1.3);transform:scale(1.02);filter:none}
.ln .w2{background:linear-gradient(90deg,#fff3d6 var(--p,0%),rgba(255,255,255,.8) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ln:not(.act) .w2{background:none;color:inherit;-webkit-text-fill-color:currentColor}
.k0 .ln.act .w2{background:none;color:#fff;-webkit-text-fill-color:#fff}
.gap{display:flex;gap:8px;padding:14px 6px}.gap i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.5);animation:dp 1.2s infinite}.gap i:nth-child(2){animation-delay:.2s}.gap i:nth-child(3){animation-delay:.4s}
.gap.off i{animation:none;opacity:.3}
@keyframes dp{50%{transform:scale(.6);opacity:.4}}
.sync{position:absolute;right:18px;bottom:18px;background:#fff3d6;color:#2a1a00;border:0;border-radius:99px;font:700 13px "DM Sans";padding:0 16px;min-height:42px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:900px){.w{grid-template-columns:1fr;gap:18px;padding:18px 14px}.cover{width:240px;margin:0 auto}.pl{align-items:stretch}.lp{height:60vh}.ln{--fs:22px}.ly{padding:30vh 18px}h1{text-align:center}.ar,.eb{text-align:center}}

</main>
