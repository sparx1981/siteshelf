<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#05081a;color:#eef1ff;font:400 15px/1.5 Manrope,system-ui,sans-serif;overflow-x:hidden;position:relative}
.bgp{position:fixed;inset:0;z-index:0;pointer-events:none}.bgp svg{width:100%;height:100%;display:block}
:focus-visible{outline:3px solid #ffe9a8;outline-offset:3px;box-shadow:0 0 0 6px #05081a}
.w{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:36px 20px 56px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pn{background:rgba(12,19,50,.82);border:1px solid #27336b;border-radius:24px;padding:26px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.eb{font:700 12px Manrope;letter-spacing:.2em;text-transform:uppercase;color:#8fb4ff;margin:0 0 6px}
h1{font:500 15px/1.4 Manrope;margin:0;color:#a3afdb}
.stage{text-align:center;overflow:hidden}
.moon{position:relative;width:min(320px,78vw);aspect-ratio:1;margin:14px auto 6px}
.moon .halo{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,233,168,.35),transparent 62%);animation:br 8s ease-in-out infinite;pointer-events:none}
@keyframes br{50%{opacity:.75}}
.moon svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .4s}
.moon svg.off{opacity:0}
.ph{font:italic 500 clamp(38px,7vw,64px)/1.05 Fraunces,serif;margin:10px 0 4px;color:#fff6d8}
.sub{color:#a3afdb;margin:0 0 18px;font-variant-numeric:tabular-nums}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
button,input[type=date]{font:500 14px Manrope,sans-serif;color:#eef1ff;background:#141c45;border:1px solid #33407f;border-radius:12px;padding:0 14px;min-height:44px;cursor:pointer}
input[type=date]{color-scheme:dark;cursor:text}
button:hover{background:#1c2660}
.go{background:#ffe9a8;color:#2a2205;border-color:#ffe9a8;font-weight:700}.go:hover{background:#fff1c4}
.seg{display:inline-flex;margin-top:14px;border:1px solid #33407f;border-radius:12px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-checked=true]{background:#8fb4ff;color:#07102e;font-weight:700}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.f{background:#111940;border:1px solid #27336b;border-radius:16px;padding:12px 14px}
.f small{display:block;color:#a3afdb;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.f b{display:block;font:500 24px/1.2 Fraunces,serif;font-variant-numeric:tabular-nums;color:#fff6d8}
.f span{font-size:13px;color:#8fb4ff}
.cal h2,.up h2{font:700 14px Manrope;letter-spacing:.14em;text-transform:uppercase;color:#a3afdb;margin:0}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ch strong{font:500 20px Fraunces,serif}
.ch button{min-width:44px;padding:0}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;font-size:12px;color:#7d8ac0;padding:4px 0}
.days button{position:relative;min-height:48px;padding:2px 0 0;border-radius:12px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.days button svg{width:26px;height:26px;display:block}
.days button i{font:500 11px/1 Manrope;font-style:normal;color:#c3cdf2;font-variant-numeric:tabular-nums}
.days button.out{opacity:.4}
.days button.tod{border-color:#ffe9a8}
.days button[aria-pressed=true]{background:#26336f;border-color:#8fb4ff}
.days button[aria-pressed=true] i{color:#fff}
.up{margin-top:18px}
.up ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.up li button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:6px 12px;background:#111940}
.up li svg{width:30px;height:30px;flex:none}
.up li em{margin-left:auto;font-style:normal;color:#a3afdb;font-variant-numeric:tabular-nums}
.note{grid-column:1/-1;color:#7d8ac0;font-size:13px;text-align:center;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:900px){.w{grid-template-columns:1fr;padding:20px 14px 40px}.pn{padding:20px}}
@media(prefers-reduced-motion:reduce){.moon .halo{animation:none}.moon svg{transition:none}}

<input type="date" id="dt" aria-label="Date">
<button id="next" aria-label="Next day">&rarr;</button>
<button id="today" class="go">Today</button>
</div>
<div class="seg" role="radiogroup" aria-label="View from which hemisphere"><button role="radio" aria-checked="true" data-h="n" tabindex="0">Northern view</button><button role="radio" aria-checked="false" data-h="s" tabindex="-1">Southern view</button></div>
</section>
<section class="pn" aria-label="Lunar details">
<div class="facts">
<div class="f"><small>Illumination</small><b id="fi">0%</b><span id="fi2">of the disc lit</span></div>
<div class="f"><small>Moon age</small><b id="fa">0.0 d</b><span>of 29.5 days</span></div>
<div class="f"><small>Next full moon</small><b id="ff">-</b><span id="ff2"></span></div>
<div class="f"><small>Next new moon</small><b id="fn">-</b><span id="fn2"></span></div>
</div>
<div class="cal">
<div class="ch"><button id="pm" aria-label="Previous month">&lsaquo;</button><strong id="mn" aria-live="polite"></strong><button id="nm" aria-label="Next month">&rsaquo;</button></div>
<div class="dow" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
<div class="days" id="days" role="group" aria-label="Month calendar of moon phases"></div>
</div>
<div class="up"><h2>Upcoming phases</h2><ul id="up"></ul></div>
</section>
<p class="note">Phases use the mean synodic month of 29.53 days, so times can be off by up to a day.</p>
<div class="sr" id="live" aria-live="polite"></div>
</main>

$('#days').addEventListener('click',function(e){var b=e.target.closest('button[data-d]');if(b)go(parse(b.dataset.d),true,true)});
$('#up').addEventListener('click',function(e){var b=e.target.closest('button[data-d]');if(b)go(parse(b.dataset.d),true)});
$('#days').addEventListener('keydown',function(e){var k=e.key,d=null;
if(k==='ArrowLeft')d=addDays(cur,-1);else if(k==='ArrowRight')d=addDays(cur,1);else if(k==='ArrowUp')d=addDays(cur,-7);else if(k==='ArrowDown')d=addDays(cur,7);
else if(k==='PageUp')d=addMonths(cur,-1);else if(k==='PageDown')d=addMonths(cur,1);
else if(k==='Home')d=addDays(cur,-((cur.getUTCDay()+6)%7));else if(k==='End')d=addDays(cur,6-((cur.getUTCDay()+6)%7));
if(d){e.preventDefault();go(d,true,true)}});
var seg=document.querySelectorAll('.seg button');
function setH(s,focus){south=s;try{localStorage.setItem('la-hemi',s?'s':'n')}catch(e){}seg.forEach(function(b){var on=(b.dataset.h==='s')===s;b.setAttribute('aria-checked',on);b.tabIndex=on?0:-1;if(on&&focus)b.focus()});render(false);$('#live').textContent=s?'Southern hemisphere view':'Northern hemisphere view'}
seg.forEach(function(b){b.onclick=function(){setH(b.dataset.h==='s')};b.onkeydown=function(e){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key)>-1){e.preventDefault();setH(!south,true)}}});
seg.forEach(function(b){var on=(b.dataset.h==='s')===south;b.setAttribute('aria-checked',on);b.tabIndex=on?0:-1});
render(false);
})();
</script></body></html>
