<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match Scoreboard — Widgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--h:#ff8a3d;--a:#3fd0e0}
body{margin:0;min-height:100vh;background:#0b1030;color:#f1f4ff;font:400 15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden;position:relative}
.bgp{position:fixed;inset:0;z-index:0;pointer-events:none}.bgp svg{width:100%;height:100%;display:block}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #0d1330}
.w{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 16px 48px}
.pn{background:rgba(13,19,48,.88);border:1px solid #2a3470;border-radius:24px;padding:24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.eb{font:600 12px Inter;letter-spacing:.2em;text-transform:uppercase;color:#ffd84d;margin:0}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid #3a4590;border-radius:99px;padding:4px 14px;font-weight:600;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#ff5a5f;animation:pl 1.4s ease-in-out infinite}.dot.off{background:#7480b8;animation:none}
@keyframes pl{50%{opacity:.35;transform:scale(.8)}}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:18px 0 8px}
.tm{display:flex;align-items:center;gap:14px}.tm.aw{justify-content:flex-end;text-align:right;flex-direction:row-reverse}
.tm svg{width:72px;height:80px;flex:none}
.tm h2{font:600 clamp(18px,3vw,28px)/1.1 Oswald,sans-serif;text-transform:uppercase;margin:0;letter-spacing:.02em}
.tm small{display:block;color:#a9b3e0;font-size:12px}
.tm .cr.flash{animation:fl 1.2s}@keyframes fl{0%,60%{filter:drop-shadow(0 0 18px #ffd84d)}100%{filter:none}}
.sc{text-align:center}
.score{font:600 clamp(64px,11vw,124px)/.95 Oswald,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.score span.p{animation:pp 1.2s}@keyframes pp{20%{color:#ffd84d;transform:scale(1.15)}}
.score span{display:inline-block}.score i{font-style:normal;color:#6f7ab5;margin:0 .1em}
.clock{font:600 28px Oswald,sans-serif;color:#ffd84d;font-variant-numeric:tabular-nums}
.tl{position:relative;height:96px;margin:6px 4px 12px}
.tl .ln{position:absolute;left:0;right:0;top:46px;height:6px;background:#232c63;border-radius:6px}
.tl .fill{position:absolute;left:0;top:46px;height:6px;background:linear-gradient(90deg,var(--h),#ffd84d);border-radius:6px;width:0}
.tl .ht{position:absolute;left:50%;top:38px;width:2px;height:22px;background:#6f7ab5}
.tl .ht b{position:absolute;top:24px;left:-14px;font-size:11px;color:#a9b3e0;font-weight:500}
.ev{position:absolute;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:transparent;border:0;padding:0;display:grid;place-items:center;cursor:pointer;color:#f1f4ff}
.ev span{width:28px;height:28px;border-radius:50%;background:#161e4e;border:2px solid;display:grid;place-items:center}
.ev.h{top:0}.ev.a{top:52px}.ev.h span{border-color:var(--h)}.ev.a span{border-color:var(--a)}
.ev svg{width:15px;height:15px}.ev.on span{background:#2a3470}.ev.future{opacity:.38}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
button.b,select{font:600 14px Inter,sans-serif;color:#f1f4ff;background:#171f52;border:1px solid #3a4590;border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
button.b:hover{background:#222c6a}.go{background:#ffd84d!important;color:#251c00!important;border-color:#ffd84d!important}
select{color-scheme:dark}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}
h3{font:600 13px Inter;letter-spacing:.14em;text-transform:uppercase;color:#a9b3e0;margin:0 0 10px}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:340px;overflow:auto}
.feed li{display:flex;gap:10px;align-items:flex-start;background:#121a46;border:1px solid #232c63;border-radius:14px;padding:9px 12px;animation:si .4s}
@keyframes si{from{opacity:0;transform:translateY(-8px)}}
.feed .mn{font:600 14px Oswald,sans-serif;min-width:46px;color:#ffd84d}.feed svg{width:18px;height:18px;flex:none;margin-top:2px}
.feed .g{border-color:#ffd84d}.feed em{font-style:normal;color:#a9b3e0;font-size:12px;display:block}
.st{display:grid;gap:12px}
.sr2{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.sr2 b{font-weight:600}.sr2 .l{text-align:left}.sr2 .r{text-align:right}
.lab{grid-column:1/-1;font-size:12px;color:#a9b3e0;text-align:center;letter-spacing:.08em;text-transform:uppercase}
.bar{display:flex;height:8px;border-radius:8px;overflow:hidden;background:#232c63;grid-column:1/-1;gap:2px}.bar i{display:block;height:100%;transition:width .5s}.bar .h{background:var(--h)}.bar .a{background:var(--a)}
.empty{color:#a9b3e0;padding:10px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:820px){.cols{grid-template-columns:1fr}.pn{padding:16px}.sb{grid-template-columns:1fr auto 1fr}.tm{flex-direction:column;gap:2px;text-align:center}.tm.aw{flex-direction:column;text-align:center}.tm svg{width:52px;height:58px}.tm h2 .f{display:none}.tm h2 .s{display:inline}}
.tm h2 .s{display:none}
@media(prefers-reduced-motion:reduce){.dot,.feed li,.score span.p,.cr.flash{animation:none}.bar i{transition:none}}
</style></head><body>
<div class="bgp" id="bgp"></div>
<main class="w"><div class="pn">
<div class="top"><p class="eb">Millstone Park · League Night</p><span class="chip"><i class="dot off" id="dot"></i><span id="phase">Kick-off</span></span></div>
<div class="sb">
<div class="tm"><svg class="cr" id="crh" viewBox="0 0 72 80" aria-hidden="true"></svg><div><h2><span class="f">Harbord Rovers</span><span class="s">RVR</span></h2><small>Home</small></div></div>
<div class="sc"><div class="score" aria-label="Score" id="score"><span id="sh">0</span><i>:</i><span id="sa">0</span></div><div class="clock" id="clock">0'</div></div>
<div class="tm aw"><svg class="cr" id="cra" viewBox="0 0 72 80" aria-hidden="true"></svg><div><h2><span class="f">Lantern United</span><span class="s">LNU</span></h2><small>Away</small></div></div>
</div>
<div class="tl" id="tl"><div class="ln"></div><div class="fill" id="fill"></div><div class="ht"><b>HT</b></div></div>
<div class="ctl"><button class="b go" id="play">Play</button><label class="sr" for="spd">Speed</label><select id="spd"><option value="1">1x speed</option><option value="5" selected>5x speed</option><option value="20">20x speed</option></select><button class="b" id="jh">Jump to half-time</button><button class="b" id="jf">Jump to full time</button><button class="b" id="rs">Reset</button></div>
<div class="cols"><section><h3>Match events</h3><ul class="feed" id="feed"></ul></section><section><h3>Live stats</h3><div class="st" id="st"></div></section></div>
<div class="sr" id="live" aria-live="polite"></div>
</div></main>
<script>/*SCENES-START*/
var SC=(function(){
 var uid=0,s=1;function id(p){return p+(++uid)}

 function landscape(seed,o){o=o||{};var w=o.w||1200,h=o.h||700,P=PAL[o.pal||'dusk'],r=R(seed),g=id('sk'),g2=id('sn');var sunY=o.sunY!=null?o.sunY:h*.52,sunX=o.sunX!=null?o.sunX:w*(.3+r()*.4);

  var bases=[h*.56,h*.64,h*.74,h*.86];P.ridge.forEach(function(col,i){out+=ridge(r,w,bases[i],h*(.07+i*.01),col,.5-i*.08);if(i<P.ridge.length-1){var mi=id('ms');out+='<defs><linearGradient id="'+mi+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P.mist+'" stop-opacity="0"/><stop offset="1" stop-color="'+P.mist+'" stop-opacity=".45"/></linearGradient></defs><rect y="'+(bases[i]-10)+'" width="'+w+'" height="'+(h*.2)+'" fill="url(#'+mi+')"/>'}});

$('#score').setAttribute('aria-label','Score: Harbord Rovers '+sc[0]+', Lantern United '+sc[1]);
$('#clock').textContent=mi>=90?(mi>90?"90+"+(mi-90)+"'":"90'"):mi+"'";
$('#phase').textContent=mi===0&&!playing?'Kick-off':mi<45?'First half':mi===45?'Half-time':mi<90?'Second half':'Full time';
$('#dot').className='dot'+(playing?'':' off');
$('#fill').style.width=(Math.min(90,m)/90*100)+'%';
btns.forEach(function(b,i){b.classList.toggle('future',ALL[i].m>mi);b.classList.toggle('on',ALL[i].m<=mi)});
// feed
if(mi!==lastMin||silent){var rows=[];ALL.forEach(function(e){if(e.m<=mi)rows.push({m:e.m,t:e.t,x:e.x,c:e.c})});
FEED.forEach(function(f){if(f[0]<=mi&&f[0]>0)rows.push({m:f[0],t:'whistle',x:f[2],c:'',w:1})});if(mi>=0)rows.push({m:0,t:'whistle',x:FEED[0][2],c:'',w:1});
rows.sort(function(a,b){return b.m-a.m||(a.w?1:-1)});
var old=$('#feed').dataset.n|0;
$('#feed').innerHTML=rows.map(function(e){return'<li class="'+(e.t==='goal'?'g':'')+'" style="'+(silent?'animation:none':'')+'"><span class="mn">'+e.m+"'</span>"+ICON[e.t]+'<span>'+e.x+(e.c?'<em>'+e.c+'</em>':'')+'</span></li>'}).join('');
$('#feed').dataset.n=rows.length;
if(!silent&&mi>lastMin){ALL.forEach(function(e){if(e.m>lastMin&&e.m<=mi&&(e.t==='goal'||e.t==='rc'||e.t==='yc'))announce(e.m+' minutes. '+e.x)});if(lastMin<45&&mi>=45)announce('Half-time. '+sc[0]+' - '+sc[1]);if(lastMin<90&&mi>=90)announce('Full time. '+sc[0]+' - '+sc[1])}
lastMin=mi;
var P=POS[k],S=SH[k],T=ST[k],C=CO[k],F=FO[k];
function row(l,a,b){var tot=a+b||1;return'<div class="sr2"><b class="l">'+a+'</b><span class="lab" style="grid-column:auto;text-align:center">'+l+'</span><b class="r">'+b+'</b><div class="bar"><i class="h" style="width:'+(a/tot*100)+'%"></i><i class="a" style="width:'+(b/tot*100)+'%"></i></div></div>'}
$('#st').innerHTML=row('Possession %',Math.round(P),Math.round(100-P))+row('Shots',S[0],S[1])+row('On target',T[0],T[1])+row('Corners',C[0],C[1])+row('Fouls',F[0],F[1])}
$('#play').textContent=playing?'Pause':(cur>=90?'Watch again':'Play')}
function seek(m){cur=m;render(cur,true)}
function loop(t){if(!playing)return;var dt=(t-last)/1000;last=t;if(pauseHT>0){pauseHT-=dt;if(pauseHT<=0)pauseHT=-1;requestAnimationFrame(loop);return}
var prev=cur;cur+=dt*spd;if(prev<45&&cur>=45&&pauseHT!==-1){cur=45;pauseHT=3}else if(pauseHT===-1&&cur>=45){pauseHT=0}
if(cur>=93){cur=93;playing=false}render(cur);if(playing)requestAnimationFrame(loop);else render(cur,true)}
function play(){if(playing){playing=false;render(cur,true);return}if(cur>=90){cur=0;pauseHT=0;lastMin=-1;announce('Replaying the match.')}playing=true;last=performance.now();render(cur,true);requestAnimationFrame(loop)}
$('#play').onclick=play;
$('#spd').onchange=function(){spd=+this.value};
$('#jh').onclick=function(){playing=false;pauseHT=0;seek(45);announce('Half-time. '+score(45).join(' - '))};
$('#jf').onclick=function(){playing=false;seek(93);announce('Full time. '+score(90).join(' - '))};
$('#rs').onclick=function(){playing=false;pauseHT=0;lastMin=-1;seek(0);announce('Reset to kick-off.')};
document.addEventListener('keydown',function(e){if(e.key===' '&&(document.activeElement===document.body||!document.activeElement.closest('button,select,input'))){e.preventDefault();play()}});
// start mid-match so the first view shows a live game
cur=68;pauseHT=0;lastMin=-1;render(cur,true);
})();
