<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunrise Sunset Arc — Widgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#0b1026;color:#eef1ff;font:400 15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #0b1026}
.w{max-width:1000px;margin:0 auto;padding:28px 16px 48px}
.card{border-radius:28px;overflow:hidden;background:#0e1430;box-shadow:0 30px 80px rgba(0,0,0,.5);border:1px solid #232c5a}
.scene{position:relative;height:430px;overflow:hidden}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hd{position:absolute;left:24px;top:20px;right:24px;z-index:3;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.eb{font:600 12px Inter;letter-spacing:.18em;text-transform:uppercase;color:#ffd36b;margin:0 0 4px}
h1{font:600 clamp(28px,5vw,44px)/1.05 "Bricolage Grotesque",sans-serif;margin:0}
.big{position:absolute;right:24px;top:18px;z-index:3;font:600 clamp(44px,8vw,84px)/1 "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums;text-shadow:0 2px 20px rgba(0,0,0,.5);text-align:right}
.big small{display:block;font:600 14px Inter;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.sunh{cursor:grab;outline:none}.sunh:focus-visible .fr{stroke:#fff;stroke-width:3}
.fr{fill:none;stroke:transparent}
.panel{padding:22px 26px 26px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.row label{font-weight:600;color:#a7b0d6}
select,input[type=date],button{font:500 14px Inter,sans-serif;color:#eef1ff;background:#161e48;border:1px solid #333f7c;border-radius:12px;padding:0 12px;min-height:44px}
select,input[type=date]{color-scheme:dark}
button{cursor:pointer;font-weight:600}button:hover{background:#202a62}
input[type=range]{flex:1;min-width:200px;accent-color:#ffd36b;height:32px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 10px}
.c{background:#121a42;border:1px solid #232c5a;border-radius:16px;padding:12px 14px}
.c small{display:block;color:#a7b0d6;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.c b{display:block;font:600 22px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums;margin-top:2px}
.c span{font-size:13px;color:#a7b0d6;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:9px;background:#232c5a;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9a62,#ffd36b);border-radius:9px;width:50%}
.msg{margin:8px 0 0;font-weight:500}.msg em{font-style:normal;color:#ffd36b}
.note{font-size:13px;color:#8a94c4;margin:12px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cl{animation:dr 90s linear infinite alternate}@keyframes dr{to{transform:translateX(60px)}}
.rays{animation:rt 60s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes rt{to{transform:rotate(360deg)}}
@media(max-width:760px){.scene{height:320px}.panel{padding:16px}.grid{grid-template-columns:1fr 1fr}.big{top:auto;bottom:10px;right:14px}.hd{left:16px;top:14px}}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.cl,.rays{animation:none}}
</style></head><body>
<main class="w"><div class="card">
<div class="scene" id="scene">
<div class="hd"><p class="eb">Halcyon Daylight</p><h1 id="ttl">Pennick Bay</h1></div>
<div class="big" id="bigt">12:00<small id="state">Daytime</small></div>
<svg id="sv" viewBox="0 0 1000 430" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
<svg id="ov" viewBox="0 0 1000 430" preserveAspectRatio="xMidYMid slice" style="z-index:2" overflow="visible"></svg>
</div>
<div class="panel">
<div class="row"><label for="town">Town</label><select id="town"></select>
<label for="dt">Date</label><button id="pd" aria-label="Previous day">&larr;</button><input type="date" id="dt"><button id="nd" aria-label="Next day">&rarr;</button></div>
<div class="row"><label for="sl">Time</label><input type="range" id="sl" min="0" max="1439" step="1" value="720"><button id="b1">Sunrise</button><button id="b2">Noon</button><button id="b3">Sunset</button><button id="b4">Now</button></div>
<div class="grid">
<div class="c"><small>Sunrise</small><b id="rs">--</b><span id="rs2"></span></div>
<div class="c"><small>Sunset</small><b id="ss">--</b><span id="ss2"></span></div>
<div class="c"><small>Daylight length</small><b id="dl">--</b><div class="bar"><i id="db"></i></div></div>
<div class="c"><small>Golden hour</small><b id="gh">--</b><span id="gh2"></span></div>
</div>
<p class="msg" id="msg"></p><p class="note">Approximate solar times ignoring altitude and atmospheric refraction.</p>
<div class="sr" id="live" aria-live="polite"></div>
</div></div></main>

if(ann){var now=Date.now();if(now-(render.t||0)>900){$('#live').textContent=hm(m)+', '+state2(el)+', sun '+el.toFixed(0)+' degrees';render.t=now}}}
function state2(el){return el<-12?'Night':el<-.83?'Twilight':el<6?'Golden hour':'Daytime'}
function bind(){var h=$('#sunh');if(!h)return;h.addEventListener('keydown',function(e){var dl={ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1,PageDown:-60,PageUp:60}[e.key];if(dl!=null){e.preventDefault();setMin(state.min+dl,true,true)}else if(e.key==='Home'){e.preventDefault();setMin(0,true,true)}else if(e.key==='End'){e.preventDefault();setMin(1439,true,true)}})}
function setMin(m,user,focus){state.min=Math.max(0,Math.min(1439,Math.round(m)));if(user)state.live=false;render(true);if(focus){var h=$('#sunh');if(h)h.focus()}}
var ov=$('#ov'),drag=false;
function fromPtr(e){var r=$('#ov').getBoundingClientRect(),vb=1000/430,sc=Math.max(r.width/1000,r.height/430),ox=(r.width-1000*sc)/2,x=((e.clientX-r.left)-ox)/sc;setMin(720+(x-500)/AR*720,true)}
$('#scene').addEventListener('pointerdown',function(e){if(e.target.closest('.sunh')||e.target.closest('#ov')){drag=true;$('#scene').setPointerCapture(e.pointerId);fromPtr(e)}});
$('#scene').addEventListener('pointermove',function(e){if(drag)fromPtr(e)});
$('#scene').addEventListener('pointerup',function(){drag=false});$('#scene').addEventListener('pointercancel',function(){drag=false});
$('#sl').addEventListener('input',function(){setMin(+this.value,true)});
$('#town').addEventListener('change',function(){state.town=+this.value;render(false);$('#live').textContent=TOWNS[state.town][0]+' selected.'});
$('#dt').addEventListener('change',function(){var p=this.value.split('-');if(p.length===3&&+p[0]){state.date=new Date(Date.UTC(+p[0],+p[1]-1,+p[2],12));render(false)}});
$('#pd').onclick=function(){state.date=new Date(state.date.getTime()-864e5);render(false)};
$('#nd').onclick=function(){state.date=new Date(state.date.getTime()+864e5);render(false)};
function goto(k){var T=TOWNS[state.town],r=cross(T[2],state.date,-.83,true),s=cross(T[2],state.date,-.83,false);var v=k==='r'?r:k==='s'?s:720;if(v==null){$('#live').textContent='The sun does not cross the horizon on this date.';return}setMin(v,true)}
$('#b1').onclick=function(){goto('r')};$('#b2').onclick=function(){goto('n')};$('#b3').onclick=function(){goto('s')};
$('#b4').onclick=function(){var n=new Date();state.date=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate(),12));state.live=true;state.min=n.getHours()*60+n.getMinutes();render(true)};
setInterval(function(){if(state.live){var n=new Date();state.min=n.getHours()*60+n.getMinutes();render(false)}},30000);
var s0=cross(TOWNS[0][2],state.date,-.83,false);if(s0!=null){state.min=Math.round(s0-40);state.live=false}
render(false);
})();
</script></body></html>
