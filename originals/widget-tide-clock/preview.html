<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tide Clock — Widgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;700&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#173a42;color:#e8f6f8;font:400 15px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:hidden;position:relative}
.bgp{position:fixed;inset:0;z-index:0;pointer-events:none}.bgp svg{width:100%;height:100%;display:block}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #0a2230}
.w{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:32px 18px 48px}
.pn{background:rgba(10,34,48,.84);border:1px solid #23506a;border-radius:24px;padding:26px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.eb{font:700 12px "DM Sans";letter-spacing:.18em;text-transform:uppercase;color:#5fd6e6;margin:0 0 2px}
h1{font:600 28px/1.1 Sora,sans-serif;margin:0}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 14px;border-radius:99px;border:1px solid;font-weight:700}
.chip.up{color:#5fd6e6;border-color:#5fd6e6}.chip.dn{color:#ff9d7a;border-color:#ff9d7a}
.clock{font:500 15px "DM Mono",monospace;color:#9cc3cf}
.main>*{min-width:0}.main{display:grid;grid-template-columns:330px 1fr;gap:24px;align-items:start}
.gz{display:flex;gap:16px;align-items:center}
.gauge{width:150px;flex:none}.gauge svg{width:100%;display:block}
.big{font:600 clamp(48px,7vw,76px)/1 Sora,sans-serif;font-variant-numeric:tabular-nums}
.big small{font-size:.35em;color:#9cc3cf;margin-left:4px}
.rate{color:#9cc3cf;margin-top:6px}
.chart{position:relative;touch-action:none;user-select:none}
.chart svg{width:100%;display:block;overflow:visible}
.hd{cursor:grab}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.ctl label{font-weight:700;color:#9cc3cf}
input[type=range]{flex:1;min-width:160px;accent-color:#5fd6e6;height:32px}
button{font:700 14px "DM Sans",sans-serif;color:#e8f6f8;background:#123348;border:1px solid #2c6482;border-radius:12px;padding:0 14px;min-height:44px;cursor:pointer}
button:hover{background:#1a4660}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 16px}
.cd{background:#0e2b3d;border:1px solid #23506a;border-radius:16px;padding:14px 16px}
.cd small{display:block;color:#9cc3cf;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.cd b{display:block;font:600 20px Sora,sans-serif;margin:2px 0}
.cd.ok{border-color:#3fbf8a}.cd.no{border-color:#ff9d7a}
.cd p{margin:0;color:#c9e2e8;font-size:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:#9cc3cf;font-weight:500;padding:6px 10px;border-bottom:1px solid #23506a}
td{padding:8px 10px;border-bottom:1px solid #173f55;font-family:"DM Mono",monospace}
td:first-child{font-family:"DM Sans";font-weight:700}
.note{color:#7ea6b3;font-size:13px;margin:14px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wv1{animation:wv 6s linear infinite}.wv2{animation:wv 9s linear infinite reverse}
@keyframes wv{to{transform:translateX(-60px)}}
.buoy{animation:bb 3.2s ease-in-out infinite}@keyframes bb{50%{transform:translateY(2px)}}
@media(max-width:820px){.chart{overflow-x:auto;padding-bottom:6px}.chart svg{min-width:620px}.main{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.pn{padding:18px}.gz{justify-content:center}}
@media(prefers-reduced-motion:reduce){.wv1,.wv2,.buoy{animation:none}}
</style></head><body>
<div class="bgp" id="bgp"></div>
<main class="w"><div class="pn">
<div class="top"><div><p class="eb">Pennick Bay · Harbour wall</p><h1>Tide Clock</h1></div><span class="chip up" id="chip"></span><span class="clock" id="clk"></span></div>
<div class="main">
<div class="gz">

<rect x="46" y="10" width="64" height="320" rx="6" fill="#0b2a3a" stroke="#2c6482" stroke-width="2"/>
<g clip-path="url(#col)"><g id="water"><g class="wv1"><path id="w1" fill="url(#wg)"/></g><g class="wv2" opacity=".5"><path id="w2" fill="#bff6fb"/></g></g><rect x="46" y="312" width="64" height="18" fill="url(#sand)"/><ellipse cx="62" cy="318" rx="6" ry="3.5" fill="#8f8a80"/><ellipse cx="94" cy="321" rx="5" ry="3" fill="#a39d90"/></g>
<g id="ticks"></g><g class="buoy"><g id="buoy"><ellipse cx="78" cy="0" rx="9" ry="5" fill="#ff7a5c"/><rect x="76.5" y="-14" width="3" height="10" fill="#e8f6f8"/><circle cx="78" cy="-15" r="2.5" fill="#ffe29a"/></g></g></svg></div>
<div><div class="big" id="big">0.00<small>m</small></div><div class="rate" id="rate"></div></div>
</div>
<div><div class="chart" id="chart"><svg viewBox="0 0 720 300" id="cs" aria-hidden="true"></svg></div>
<div class="ctl"><label for="sl">Time</label><input type="range" id="sl" min="-360" max="1800" step="5" value="0"><button id="bn">Now</button><button id="bh">Next high</button><button id="bl">Next low</button></div></div>
</div>
<div class="cards"><div class="cd" id="c1"><small>Causeway walk</small><b></b><p></p></div><div class="cd" id="c2"><small>Slipway launch</small><b></b><p></p></div><div class="cd"><small>Next change</small><b id="nc"></b><p id="nc2"></p></div></div>
<div class="tw"><table><caption class="sr">Next four tide turns</caption><thead><tr><th>Turn</th><th>Time</th><th>Height</th></tr></thead><tbody id="tb"></tbody></table></div>
<p class="note">Illustrative harmonic model for demonstration, not for navigation.</p>
<div class="sr" id="live" aria-live="polite"></div>
</div></main>
