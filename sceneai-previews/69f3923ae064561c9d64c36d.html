<style>

.sub{color:#a3acb8;font-size:17px;line-height:1.6;max-width:480px;margin:0 0 28px;opacity:0;animation:fu .7s 2.1s forwards}

button:focus-visible,a:focus-visible{outline:3px solid #6cc4ff;outline-offset:3px}
.lo{position:relative;z-index:5;max-width:1280px;width:100%;margin:0 auto;padding:40px 24px 36px;opacity:0;animation:fi .9s 3.2s forwards}.lo p{font-size:13px;color:#8d97a5;margin:0 0 18px}.lo p b{color:#fff;font-weight:600}

@keyframes fu{to{opacity:1;transform:none}}@keyframes fd{to{opacity:1}}@keyframes fi{to{opacity:1}}
@media(max-width:820px){nav ul,.gs{display:none}.ham{display:block}h1{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}video{display:none}}

<script>
const h=document.getElementById("h");let d=.9;const L=[["Stay","Ahead","With","*Cutting-Edge*"],["Realtime","Price","Alerts"]];
h.innerHTML=L.map(l=>'<span class="l">'+l.map(w=>{const em=w[0]=="*",t=em?w.slice(1,-1):w,s='<span class="w" aria-hidden="true" style="animation-delay:'+d.toFixed(2)+'s">'+(em?"<em>"+t+"</em>":t)+"&nbsp;</span>";d+=.22;return s}).join("")+"</span>").join("");
