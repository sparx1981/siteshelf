<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oasis — Master your day, boost productivity</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#0b0c10;color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(60% 50% at 70% 20%,#2a1a6e,#0b0c10 65%)}.bg video{width:100%;height:100%;object-fit:cover}
nav{position:fixed;top:0;left:0;right:0;z-index:30;padding:20px 24px;transition:background .3s,border-color .3s;border-bottom:1px solid transparent;animation:fd .8s both}
nav.s{background:rgba(14,15,20,.9);backdrop-filter:blur(12px);border-bottom-color:rgba(255,255,255,.05)}
.ni{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.lg{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}.lg i{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center}
.lk{display:flex;gap:34px;list-style:none;margin:0;padding:0}.lk a{color:#A1A1AA;font-size:14px;font-weight:500;text-decoration:none}.lk a:hover{color:#fff}
.li{background:#1c1d22;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 20px;font:500 14px Inter;cursor:pointer}
.ham{display:none;background:none;border:0;color:#fff;cursor:pointer}
.mm{position:fixed;inset:0;z-index:40;background:#0b0c10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;opacity:0;pointer-events:none;transition:opacity .25s}.mm.open{opacity:1;pointer-events:auto}.mm a{color:#fff;font-size:26px;font-weight:600;text-decoration:none}.mm .x{position:absolute;top:20px;right:22px;background:none;border:0;color:#fff;font-size:32px;cursor:pointer}
main{position:relative;z-index:5;max-width:1400px;margin:0 auto;padding:180px 24px 0}
h1{font-size:clamp(40px,7vw,72px);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:0 0 24px}
.sub{color:#A1A1AA;font-size:20px;line-height:1.6;max-width:650px;margin:0 0 40px}
.w{display:inline-block;opacity:0;animation:fu .6s forwards}
.bt{display:flex;gap:16px;opacity:0;animation:fu .7s 2.2s forwards}
.p{background:#6744FF;color:#fff;border:0;border-radius:12px;padding:14px 32px;font:500 16px Inter;cursor:pointer}.p:hover{background:#5836e6}
.sc{background:#1c1d22;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 32px;font:500 16px Inter;cursor:pointer}.sc:hover{background:#26272d}
button:focus-visible,a:focus-visible{outline:3px solid #a89bff;outline-offset:3px}
.dm{max-width:1100px;margin:100px auto 0;opacity:0;animation:fs .9s 2.8s forwards}
.dm .fr{background:#0e0f14;border:1px solid rgba(255,255,255,.1);border-bottom:0;border-radius:24px 24px 0 0;overflow:hidden}.dm img{display:block;width:100%;height:auto}
.mock{padding:18px;display:grid;grid-template-columns:170px 1fr;gap:14px;min-height:380px}.mock .sb{background:#16171d;border-radius:12px}.mock .gr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}.mock .gr i{height:96px;background:#16171d;border-radius:12px}.mock .gr i.t{grid-column:1/-1;height:170px;background:linear-gradient(120deg,#1b1840,#16171d)}
@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@keyframes fd{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}@keyframes fs{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@media(max-width:820px){.lk,.li{display:none}.ham{display:block}.bt{flex-direction:column}.sub{font-size:17px}main{padding-top:130px}.mock{grid-template-columns:1fr}.mock .sb{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.w,.bt,.dm{opacity:1}video{display:none}}
</style></head><body><div class="bg"><video autoplay muted loop playsinline preload="metadata"><source src="https://cdn.sceneai.art/Hero%20Section%20Video/973fa3f6-7715-4e73-9cfd-100ee86285b5.mp4" type="video/mp4"></video></div>
<nav id="nv"><div class="ni"><span class="lg"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b0c10" stroke-width="2.4" stroke-linecap="round"><path d="M3 12c3-6 6 6 9 0s6 6 9 0"/></svg></i>Oasis</span><ul class="lk"><li><a href="#">Product</a></li><li><a href="#">Customer</a></li><li><a href="#">Pricing</a></li><li><a href="#">Resources</a></li><li><a href="#">Company</a></li></ul><button class="li">Log in</button><button class="ham" id="hb" aria-label="Open menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div></nav>
<div class="mm" id="mm" role="dialog" aria-label="Menu"><button class="x" id="cx" aria-label="Close menu">×</button><a href="#">Product</a><a href="#">Customer</a><a href="#">Pricing</a><a href="#">Resources</a><a href="#">Company</a><a href="#">Log in</a></div>
<main><h1 id="h" aria-label="Master your day, boost productivity"></h1><p class="sub" id="s" aria-label="Manage projects effortlessly with smart tools, stay on track, meet deadlines, and keep your team productive."></p>
<div class="bt"><button class="p">Get started</button><button class="sc">How it works</button></div>
<div class="dm"><div class="fr"><img src="https://cdn.sceneai.art/Hero%20section%20image/f818ffa9-3074-43cc-8ca5-953c97da9edd.png" alt="Oasis dashboard" onerror="this.parentNode.innerHTML='<div class=mock><div class=sb></div><div class=gr><i class=t></i><i></i><i></i><i></i></div></div>'"></div></div></main>
<script>
let d=.1;function w(el,t,step){el.innerHTML=t.split(" ").map(x=>{const s='<span class="w" aria-hidden="true" style="animation-delay:'+d.toFixed(2)+'s">'+x+"&nbsp;</span>";d+=step;return s}).join("")}
w(document.getElementById("h"),"Master your day, boost productivity",.11);w(document.getElementById("s"),"Manage projects effortlessly with smart tools, stay on track, meet deadlines, and keep your team productive.",.05);
const nv=document.getElementById("nv");addEventListener("scroll",()=>nv.classList.toggle("s",scrollY>20),{passive:true});
const mm=document.getElementById("mm");document.getElementById("hb").onclick=()=>mm.classList.add("open");document.getElementById("cx").onclick=()=>mm.classList.remove("open");addEventListener("keydown",e=>{if(e.key=="Escape")mm.classList.remove("open")});
</script></body></html>
