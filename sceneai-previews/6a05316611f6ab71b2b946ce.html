<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trav — Begin Your Next Big Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#3d7a8a,#1d4a5a 60%,#0a1a22)}.bg video{width:100%;height:100%;object-fit:cover}.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3)}
header{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:24px 24px}
.lg{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;letter-spacing:.03em}.lg i{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);display:grid;place-items:center}
nav ul{display:none;list-style:none;margin:0;padding:0;gap:40px}nav a{color:rgba(255,255,255,.95);text-decoration:none;font-size:14px;font-weight:500}nav a:hover{opacity:.8}
.ham{background:none;border:0;color:#fff;padding:6px;cursor:pointer}
.mm{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);backdrop-filter:blur(18px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;opacity:0;pointer-events:none;transition:opacity .3s}.mm.open{opacity:1;pointer-events:auto}.mm a{color:#fff;font-size:26px;font-weight:500;text-decoration:none}.mm button{position:absolute;top:22px;right:22px;background:none;border:0;color:#fff;font-size:32px;cursor:pointer}
main{height:100dvh;min-height:600px;max-width:896px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pin{filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));margin-bottom:22px;opacity:0;animation:up .7s .1s forwards}
h1{font-size:38px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0 0 20px}
.sub{font-size:16px;font-weight:500;color:rgba(255,255,255,.95);line-height:1.6;max-width:480px;margin:0 0 32px}
.word-wrap{display:inline-block;opacity:0;transform:translateY(15px);animation:up .6s forwards}
.cta{background:#fff;color:#000;border:0;border-radius:99px;padding:14px 32px;font:500 15px Inter;cursor:pointer;transition:box-shadow .3s;opacity:0}.cta:hover{box-shadow:0 0 28px 6px rgba(255,255,255,.45)}.cta.show{animation:up .7s forwards}
@keyframes up{to{opacity:1;transform:none}}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(min-width:768px){header{padding:40px 64px}nav ul{display:flex}.ham{display:none}h1{font-size:60px;letter-spacing:-.02em}.sub{font-size:17px}}
@media(prefers-reduced-motion:reduce){.word-wrap,.pin{animation:none;opacity:1;transform:none}.cta{opacity:1;animation:none!important}video{display:none}.mm{transition:none}}
</style></head><body><div class="bg"><video autoplay muted loop playsinline preload="metadata"><source src="https://cdn.sceneai.art/Hero%20Section%20Video/0519be39-d8d1-48a5-84ee-f8a1ec038cd6.mp4" type="video/mp4"></video></div>
<header><div class="lg"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></i>Trav</div>
<nav aria-label="Main"><ul><li><a href="#">Home</a></li><li><a href="#">Our Story</a></li><li><a href="#">FAQ</a></li><li><a href="#">Policies</a></li></ul></nav><button class="ham" id="hb" aria-label="Open menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></header>
<div class="mm" id="mm" role="dialog" aria-label="Menu"><button id="cx" aria-label="Close menu">×</button><a href="#">Home</a><a href="#">Our Story</a><a href="#">FAQ</a><a href="#">Policies</a></div>
<main><svg class="pin" width="44" height="44" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg>
<h1 id="h">Begin Your Next<br class="hidden md:block">Big Adventure</h1><p class="sub" id="s">Discover hidden gems, plan unforgettable trips, and<br class="hidden md:block">explore the world — all in one seamless app.</p><button class="cta" id="c">Download Now</button></main>
<script>
document.addEventListener("DOMContentLoaded",()=>{let d=.5;[["h",.09],["s",.045]].forEach(([id,step])=>{const el=document.getElementById(id);[...el.childNodes].forEach(n=>{if(n.nodeType==3){const f=document.createDocumentFragment();n.textContent.split(/(\s+)/).forEach(t=>{if(!t.trim()){f.append(t);return}const sp=document.createElement("span");sp.className="word-wrap";sp.textContent=t;sp.style.animationDelay=d.toFixed(2)+"s";d+=step;f.append(sp)});n.replaceWith(f)}})});
const c=document.getElementById("c");c.style.animationDelay=(d+.2)+"s";c.classList.add("show")});
const mm=document.getElementById("mm");document.getElementById("hb").onclick=()=>mm.classList.add("open");document.getElementById("cx").onclick=()=>mm.classList.remove("open");addEventListener("keydown",e=>{if(e.key=="Escape")mm.classList.remove("open")});
</script></body></html>
