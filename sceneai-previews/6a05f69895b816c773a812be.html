<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ratw — Plan better, start your day right</title>

<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#e5e7eb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,system-ui,sans-serif}
.si{opacity:0;transform:translateY(30px);animation:fu .9s cubic-bezier(.2,.8,.2,1) forwards}@keyframes fu{to{opacity:1;transform:none}}
.d-bg{animation-delay:.2s}.d-nav{animation-delay:1s}.d-h1{animation-delay:1.8s}.d-p{animation-delay:2.6s}.d-btn{animation-delay:3.4s}
.wr{position:relative;width:100%;max-width:1400px;aspect-ratio:4/3;min-height:600px;border-radius:2rem;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.28);background:#000}

.v{position:absolute;inset:0;background:linear-gradient(170deg,#d98c5f,#7a4a3a 55%,#2a1a1a)}.v video{width:100%;height:100%;object-fit:cover;opacity:.9}.v:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.2)}
.nv{position:absolute;top:0;left:0;width:100%;padding:24px;display:flex;justify-content:space-between;align-items:flex-start;z-index:30}
@media(min-width:768px){.nv{padding:40px;align-items:center}}
.lg{color:#fff;font-size:24px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.dn{display:none;align-items:center;gap:32px}.dn a{color:#fff;text-decoration:none;font-size:14px;font-weight:500}.dn a:hover{opacity:.8}.dn button{background:#fff;color:#000;border:0;border-radius:99px;padding:10px 22px;font:600 14px Inter;cursor:pointer}
@media(min-width:768px){.dn{display:flex}.tg{display:none!important}}
.tg{position:relative}.tb{width:48px;height:48px;background:#fff;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.tb svg{grid-area:1/1;transition:opacity .2s,transform .3s}.tb .cl{opacity:0;transform:rotate(-90deg)}.tb.open .ham{opacity:0;transform:rotate(90deg)}.tb.open .cl{opacity:1;transform:none}
.dd{position:absolute;top:64px;right:0;width:256px;background:#fff;border-radius:1rem;padding:8px;box-shadow:0 18px 40px rgba(0,0,0,.25);opacity:0;visibility:hidden;transform:translateY(-10px) scale(.95);transition:all .25s}.dd.open{opacity:1;visibility:visible;transform:none}
.dd a{display:block;padding:12px 14px;border-radius:10px;color:#111;text-decoration:none;font-weight:500}.dd a:hover{background:#f3f4f6}
.hc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px 48px;text-align:center;z-index:20}
@media(min-width:768px){.hc{padding-bottom:96px}}
h1{margin:0;color:#fff;font-size:42px;line-height:1.1;font-weight:600;letter-spacing:-.02em}@media(min-width:768px){h1{font-size:58px}}
h1 em{font:italic 400 1em "Playfair Display",serif}
.hc p{margin:20px 0 28px;color:rgba(255,255,255,.9);font-size:18px;line-height:1.5}
.cta{background:#fff;color:#000;border:0;border-radius:99px;padding:16px 36px;font:600 16px Inter;cursor:pointer;transition:transform .25s}.cta:hover{transform:scale(1.05)}
button:focus-visible,a:focus-visible{outline:3px solid #ffd166;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.si{animation:none;opacity:1;transform:none}video{display:none}}
</style></head><body><div class="wr si d-bg"><div class="v"><video autoplay muted loop playsinline preload="metadata"><source src="https://cdn.sceneai.art/Hero%20Section%20Video/e988037c-bf57-4b3b-8ba9-b69167028de8.mp4" type="video/mp4"></video></div>
<nav class="nv si d-nav" aria-label="Main"><span class="lg">Ratw</span><div class="dn"><a href="#">Home</a><a href="#">Pricing</a><a href="#">About</a><a href="#">Insights</a><a href="#">Contact</a><button>Get template</button></div>
<div class="tg"><button class="tb" id="tb" aria-label="Toggle menu" aria-expanded="false"><svg class="ham" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><svg class="cl" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="dd" id="dd"><a href="#">Home</a><a href="#">Pricing</a><a href="#">About</a><a href="#">Insights</a><a href="#">Contact</a></div></div></nav>
<div class="hc"><h1 class="si d-h1">Plan better, <br class="hide-m"> start your day <em>right</em></h1><p class="si d-p">A smarter planner for tasks<br>priorities and daily structure</p><button class="cta si d-btn">Create your plan</button></div></div>
<script>const tb=document.getElementById("tb"),dd=document.getElementById("dd");tb.onclick=()=>{const o=dd.classList.toggle("open");tb.classList.toggle("open",o);tb.setAttribute("aria-expanded",o)};addEventListener("keydown",e=>{if(e.key=="Escape"&&dd.classList.contains("open"))tb.click()})</script></body></html>
