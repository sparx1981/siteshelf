<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jetfly — Gulfstream Charters On Your Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#fff;color:#111;font-family:Inter,system-ui,sans-serif;padding:20px;min-height:100vh;display:flex;flex-direction:column}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 12px 18px}
.logo{font-weight:500;font-size:20px}nav{display:flex;gap:30px}nav a{color:#6b7280;text-decoration:none;font-size:14px}nav a:hover{color:#111}
.rq{justify-self:end;background:#000;color:#fff;border:0;border-radius:99px;padding:11px 22px;font:500 14px Inter;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer}
.vp{position:relative;flex:1;min-height:560px;border-radius:48px;overflow:hidden;background:linear-gradient(180deg,#6aa3d9,#355f8c 55%,#16263a);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;color:#fff;padding:0 24px 40px}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vg{position:absolute;inset:0;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.5))}
.in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
h1{font-weight:300;font-size:76px;line-height:1.02;letter-spacing:-.03em;margin:0 0 18px;text-shadow:0 2px 10px rgba(0,0,0,.3)}
h1 em{font:italic 400 1em "Playfair Display",serif}
.d{max-width:440px;font-size:15px;color:rgba(255,255,255,.9);line-height:1.6;margin:0 0 28px}
.w{display:inline-block;opacity:0;transform:translateY(15px);filter:blur(4px);animation:in .8s forwards;animation-delay:var(--t)}@keyframes in{to{opacity:1;transform:none;filter:none}}
.cta{background:#fff;color:#000;border:0;border-radius:99px;padding:16px 34px;font:500 16px Inter;cursor:pointer;opacity:0;animation:in .8s forwards;transition:transform .25s}.cta:hover{transform:scale(1.04)}
button:focus-visible{outline:3px solid #4f8cff;outline-offset:3px}
@media(max-width:760px){body{padding:12px}h1{font-size:40px}header{grid-template-columns:auto auto}nav{display:none}.vp{border-radius:32px;min-height:520px}}
@media(prefers-reduced-motion:reduce){.w,.cta{animation:none;opacity:1;transform:none;filter:none}video{display:none}}
</style></head><body>
<header><span class="logo">Jetfly</span><nav aria-label="Main"><a href="#">Fleet</a><a href="#">Services</a><a href="#">Saftey</a><a href="#">About us</a></nav><button class="rq">Request a quote</button></header>
<section class="vp"><video autoplay muted loop playsinline preload="metadata"><source src="https://cdn.sceneai.art/Hero%20Section%20Video/ab1347aa-b8fc-4f38-ac9d-9a6238bf8647.mov"></video><div class="vg"></div>
<div class="in"><h1 id="h" aria-label="Gulfstream Charters On Your Schedule"></h1><p class="d" id="d" aria-label="JetCrest connects you with Gulfstream aircraft and seasoned crews, so you can leave when you are ready and land where you need to be."></p><button class="cta" id="c">Instant Charter Request</button></div></section>
<script>
const h=document.getElementById("h"),d=document.getElementById("d");let t=300;
function sp(el,text,gap,cls){return text.split(" ").map(w=>{const s='<span class="w" aria-hidden="true" style="--t:'+t+'ms">'+(cls&&cls.test(w)?"<em>"+w+"</em>":w)+"&nbsp;</span>";t+=gap;return s}).join("")}
h.innerHTML=sp(h,"Gulfstream Charters",120)+"<br>"+sp(h,"On Your Schedule",120,/^Your$/);
d.innerHTML=sp(d,"JetCrest connects you with Gulfstream aircraft and seasoned crews, so you can leave when you are ready and land where you need to be.",40);
document.getElementById("c").style.animationDelay=(t+300)+"ms";
</script></body></html>
