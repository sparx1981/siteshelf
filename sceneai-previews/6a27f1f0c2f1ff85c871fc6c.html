<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome back — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#000;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:20px;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(60% 60% at 30% 40%,#7a2a10,#1a0f1c 60%,#000)}.bg video{width:100%;height:100%;object-fit:cover;transform:scale(1.05)}.bg:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.1);backdrop-filter:blur(4px)}
.card{position:relative;z-index:2;display:flex;width:100%;max-width:1040px;min-height:650px;background:#fff;border:1px solid #e5e7eb;border-radius:2.5rem;box-shadow:0 30px 80px rgba(0,0,0,.45);padding:12px;gap:12px}
.l{flex:0 0 45%;border-radius:2rem;overflow:hidden;background:linear-gradient(160deg,#ff512f,#2a1030 60%,#0c0c0e);position:relative}.l video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.r{flex:1;position:relative;padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.blob{position:absolute;top:-60px;left:-60px;width:256px;height:256px;border-radius:50%;filter:blur(80px);background:linear-gradient(135deg,#FF512F,#F09819);opacity:.2;pointer-events:none}
.r>*{position:relative}
h1{text-align:center;font-size:40px;font-weight:600;letter-spacing:-.03em;color:#111827;margin:0 0 6px}.sub{text-align:center;font-size:14px;color:#6b7280;margin:0 0 28px}
.soc{display:flex;align-items:center;justify-content:space-between;width:100%;background:#f9fafb;border:1px solid #e5e7eb;border-radius:1.25rem;padding:16px 18px;margin-bottom:12px;font:500 15px Inter;color:#111827;cursor:pointer}
.soc span{display:flex;align-items:center;gap:12px}.soc svg.ar{color:#9ca3af;transition:color .2s}.soc:hover svg.ar{color:#111827}
.dv{display:flex;align-items:center;gap:14px;margin:20px 0;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#9ca3af}.dv:before,.dv:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#d1d5db)}.dv:after{background:linear-gradient(270deg,transparent,#d1d5db)}
.em{display:flex;align-items:center;justify-content:space-between;background:#f9fafb;border:1px solid #e5e7eb;border-radius:1.25rem;padding:8px 8px 8px 20px;transition:.2s}.em:focus-within{background:#fff;border-color:#9ca3af}
.em label{display:block;font-size:11px;color:#6b7280}.em input{border:0;outline:0;background:transparent;font:500 15px Inter;color:#111827;width:100%;padding:2px 0}
.go{position:relative;width:52px;height:52px;border-radius:50%;border:0;padding:0;background:none;cursor:pointer;flex:none}
.go:before,.go:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#00c6ff,#0072ff,#ff007a,#ff8a00,#00c6ff)}
.go:after{inset:-4px;filter:blur(10px);opacity:0;transition:opacity .3s;z-index:-1}
.go i{position:absolute;inset:3px;border-radius:50%;background:#000;display:grid;place-items:center;box-shadow:inset 0 2px 8px rgba(255,255,255,.2);z-index:1}.go i svg{transition:transform .25s}
.go:hover:before,.go:hover:after{animation:sp 2.5s linear infinite}.go:hover:after{opacity:1}.go:hover i svg{transform:translateX(2px)}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{min-height:20px;text-align:center;font-size:13px;margin-top:10px;color:#b42318}.msg.ok{color:#136a3a}
.ft{text-align:center;font-size:14px;color:#6b7280;margin-top:22px}.ft a{font-weight:600;background:linear-gradient(90deg,#FF512F,#F09819);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #0072ff;outline-offset:2px}.em input:focus-visible{outline:0}
@media(max-width:820px){.card{flex-direction:column;border-radius:2rem}.l{flex:none;height:200px}h1{font-size:32px}}
@media(prefers-reduced-motion:reduce){.go:hover:before,.go:hover:after{animation:none}video{display:none}}
</style></head><body><div class="bg"><video autoplay muted loop playsinline preload="metadata"><source src="https://cdn.midjourney.com/video/71048e88-d8e6-470e-88ef-555c01eacb12/0.mp4" type="video/mp4"></video></div>
<main class="card"><div class="l" aria-hidden="true"><video autoplay muted loop playsinline preload="metadata"><source src="https://cdn.midjourney.com/video/71048e88-d8e6-470e-88ef-555c01eacb12/0.mp4" type="video/mp4"></video></div>
<section class="r"><div class="blob"></div><h1>Welcome back</h1><p class="sub">Sign in to your account</p>
<button class="soc"><span><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22 12.200c0-.7-.1-1.400-.2-2H12v3.800h5.600a4.800 4.800 0 0 1-2.100 3.100v2.600h3.400c2-1.800 3.100-4.500 3.100-7.500z"/><path fill="#34A853" d="M12 22c2.800 0 5.200-.9 6.900-2.500l-3.400-2.600c-.9.600-2.100 1-3.500 1-2.700 0-5-1.800-5.800-4.300H2.700v2.700A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.200 13.600a6 6 0 0 1 0-3.800V7.100H2.700a10 10 0 0 0 0 9.200z"/><path fill="#EA4335" d="M12 5.900c1.500 0 2.900.5 4 1.600l3-3A10 10 0 0 0 2.700 7.100l3.500 2.700C7 7.700 9.300 5.900 12 5.900z"/></svg>Continue with Google</span><svg class="ar" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
<button class="soc"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="#111"><path d="M18.200 2h3.300l-7.200 8.300L22.800 22h-6.600l-5.200-6.800L5 22H1.700l7.700-8.800L1.300 2H8l4.700 6.200zm-1.200 18h1.800L7.100 3.900H5.200z"/></svg>Continue with X</span><svg class="ar" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
<div class="dv">or</div>
<form id="f" novalidate><div class="em"><div style="flex:1;min-width:0"><label for="e">Email</label><input id="e" type="email" placeholder="Enter your email" autocomplete="email"></div><button class="go" aria-label="Continue"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></button></div><div class="msg" id="m" role="status"></div></form>
<p class="ft">Don't have an account? <a href="#">Sign up</a></p></section></main>
<script>document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();const v=document.getElementById("e").value.trim(),m=document.getElementById("m");if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){m.className="msg";m.textContent="Please enter a valid email address.";return}m.className="msg ok";m.textContent="Check your inbox — we sent a sign-in link to "+v+"."})</script></body></html>
