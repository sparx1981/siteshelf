<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Healcure — Healthcare for Good</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#fff;background:#0b1f24}
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(160deg,#2c6e72,#143b44 55%,#0b1f24),url("https://cdn.sceneai.art/Hero%20Section%20Video/802fa01f-44ef-4ab4-ac73-62015fe06eef.png") center/cover}
.hero:before{content:"";position:absolute;inset:0;background:url("https://cdn.sceneai.art/Hero%20Section%20Video/802fa01f-44ef-4ab4-ac73-62015fe06eef.png") center/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.2) 40%,rgba(0,0,0,.78))}
.fade{opacity:0;animation:f .9s forwards}@keyframes f{to{opacity:1}}
nav{position:relative;z-index:5;max-width:1340px;width:100%;margin:0 auto;padding:24px;display:flex;align-items:center;justify-content:space-between}
.lg{font-size:22px;font-weight:600}nav ul{display:flex;gap:34px;list-style:none;margin:0;padding:0}nav a{color:#fff;text-decoration:none;font-size:14px;font-weight:400}nav a:hover{opacity:.8}
.bk{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#000;border:0;border-radius:99px;padding:10px 18px;font:500 13px Inter;cursor:pointer}
.ol{display:inline-flex;align-items:center;gap:8px;background:transparent;color:#fff;border:1px solid #fff;border-radius:99px;padding:10px 18px;font:500 13px Inter;cursor:pointer}
.ham{display:none;background:none;border:0;color:#fff;cursor:pointer}.mm{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;opacity:0;pointer-events:none;transition:opacity .3s}.mm.open{opacity:1;pointer-events:auto}.mm a{color:#fff;font-size:24px;text-decoration:none}.mm .x{position:absolute;top:20px;right:22px;background:none;border:0;color:#fff;font-size:32px;cursor:pointer}
.c{position:relative;z-index:5;flex:1;max-width:1340px;width:100%;margin:0 auto;padding:0 24px 44px;display:flex;flex-direction:column;justify-content:flex-end}
.tb{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;padding:5px 14px 5px 5px;border-radius:99px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);font-size:14px;margin-bottom:20px}.tb b{background:#fff;color:#000;border-radius:99px;padding:3px 12px;font-weight:500}
h1{font-size:42px;font-weight:500;line-height:1.12;letter-spacing:-.02em;margin:0 0 16px}
.sub{font-size:15px;font-weight:400;line-height:1.6;color:rgba(255,255,255,.88);margin:0 0 26px}
.w{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(4px);animation:wi .7s forwards}@keyframes wi{to{opacity:1;transform:none;filter:none}}
.bt{display:flex;gap:12px;flex-wrap:wrap}
.rv{display:flex;align-items:center;gap:14px;margin-top:38px}.av{display:flex}.av i{width:40px;height:40px;border-radius:50%;border:2px solid #fff;margin-left:-12px;background:var(--c);background-size:cover}.av i:first-child{margin:0}
.rv small{display:block;font-size:13px;color:rgba(255,255,255,.85)}.st{color:#fbbf24;letter-spacing:2px;font-size:14px}
button:focus-visible,a:focus-visible{outline:3px solid #7ee0d4;outline-offset:3px}
@media(max-width:820px){nav ul,nav>.bk{display:none}.ham{display:block}h1{font-size:34px}}
@media(prefers-reduced-motion:reduce){.fade{animation:none;opacity:1}.w{animation:none;opacity:1;transform:none;filter:none}}
</style></head><body><section class="hero">
<nav class="fade" aria-label="Main"><span class="lg">Healcure</span><ul><li><a href="#">Home</a></li><li><a href="#">About</a></li><li><a href="#">Services</a></li><li><a href="#">Doctors</a></li><li><a href="#">Blog</a></li></ul><button class="bk">Book An Appointment <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><button class="ham" id="hb" aria-label="Open menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></nav>
<div class="mm" id="mm" role="dialog" aria-label="Menu"><button class="x" id="cx" aria-label="Close menu">×</button><a href="#">Home</a><a href="#">About</a><a href="#">Services</a><a href="#">Doctors</a><a href="#">Blog</a></div>
<div class="c"><div class="tb fade" style="animation-delay:.3s"><b>Trusted</b>20,000+ Patients Worldwide</div><h1 id="h" aria-label="Healthcare for Good Today. Tomorrow. Always."></h1><p class="sub" id="s" aria-label="Take charge of your well-being and explore the many advantages of modern healthcare through our trusted platform."></p>
<div class="bt fade" id="bt"><button class="bk">Book An Appointment <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><button class="ol">About Us <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
<div class="rv fade" id="rv"><span class="av"><i style="--c:#c98b6b;background-image:url(https://cdn.sceneai.art/Only%20man%20image/0ccd6017-25fc-493b-abdf-321915dde101.jpg)"></i><i style="--c:#8a6a55;background-image:url(https://cdn.sceneai.art/Only%20man%20image/7e1339ef-7a01-4979-93c8-21d97af291ee.webp)"></i><i style="--c:#d4a98a;background-image:url(https://cdn.sceneai.art/Image%20for%20any%20section/2d8032d8-c1cd-4827-84db-0aeba1109c1b.jpg)"></i><i style="--c:#a07a60;background-image:url(https://cdn.sceneai.art/Image%20for%20any%20section/470b31f2-d1b5-4730-96a2-aca680204172.jpg)"></i></span><div><span class="st" aria-label="5 stars">★★★★★</span><small>Baser on 20K+ Reviews</small></div></div></div></section>
<script>
let d=.5;function sp(el,html,step){el.innerHTML=html.split(/(<br>)/).map(p=>p=="<br>"?p:p.split(" ").filter(Boolean).map(w=>{const s='<span class="w" aria-hidden="true" style="animation-delay:'+d.toFixed(2)+'s">'+w+"&nbsp;</span>";d+=step;return s}).join("")).join("")}
sp(document.getElementById("h"),"Healthcare for Good <br>Today. Tomorrow. Always.",.12);sp(document.getElementById("s"),"Take charge of your well-being and explore the many <br>advantages of modern healthcare through our trusted platform.",.05);
document.getElementById("bt").style.animationDelay=document.getElementById("rv").style.animationDelay=(d+.1)+"s";
const mm=document.getElementById("mm");document.getElementById("hb").onclick=()=>mm.classList.add("open");document.getElementById("cx").onclick=()=>mm.classList.remove("open");addEventListener("keydown",e=>{if(e.key=="Escape")mm.classList.remove("open")});
</script></body></html>
