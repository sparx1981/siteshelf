<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airlines — Travel the World Without Any Stress</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;scrollbar-width:none}body::-webkit-scrollbar{display:none}
body{font-family:Inter,system-ui,sans-serif;color:#fff;background:#0b2a44}
.hero{position:relative;height:100vh;min-height:560px;overflow:hidden;background:linear-gradient(180deg,#5aa5d8,#1d4f7a 60%,#0b2a44)}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.1),rgba(0,0,0,.4))}
nav{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:24px clamp(20px,5vw,64px)}
.fu{opacity:0;transform:translateY(20px);animation:fu .8s forwards}@keyframes fu{to{opacity:1;transform:none}}
.logo{font-size:20px;font-weight:600}
.menu{display:flex;gap:32px;list-style:none;margin:0;padding:0}.menu a{color:rgba(255,255,255,.9);text-decoration:none;font-size:14px;font-weight:400}.menu a:hover{color:#fff}
.btn-o{background:transparent;color:#fff;border:1px solid #fff;border-radius:99px;padding:9px 20px;font:400 14px Inter;cursor:pointer;transition:.25s}.btn-o:hover{background:#fff;color:#000}
.ham{display:none;background:none;border:0;color:#fff;padding:6px;cursor:pointer}
.mm{position:absolute;z-index:6;top:70px;left:16px;right:16px;background:rgba(0,0,0,.7);backdrop-filter:blur(14px);border-radius:16px;padding:16px;display:none}.mm.open{display:block}.mm a{display:block;color:#fff;text-decoration:none;padding:10px 6px;font-size:15px}
.c{position:relative;z-index:2;height:calc(100% - 80px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;margin-top:-40px}
h1{font-weight:500;font-size:38px;line-height:1.1;margin:0 0 18px;letter-spacing:-.01em}
.c p{font-size:15px;color:rgba(255,255,255,.8);max-width:560px;margin:0 0 30px;line-height:1.6}
.cta{background:#fff;color:#000;border:0;border-radius:99px;padding:12px 26px;font:500 15px Inter;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer;transition:.25s}.cta:hover{transform:scale(1.05);box-shadow:0 14px 34px rgba(0,0,0,.35)}
button:focus-visible,a:focus-visible{outline:3px solid #ffd166;outline-offset:3px}
@media(min-width:768px){h1{font-size:56px}.c p{font-size:18px}}
@media(max-width:820px){.menu,.btn-o{display:none}.ham{display:block}}
@media(prefers-reduced-motion:reduce){.fu{animation:none;opacity:1;transform:none}video{display:none}.cta{transition:none}}
</style></head><body><section class="hero"><video autoplay muted loop playsinline preload="metadata"><source src="https://cdn.sceneai.art/Hero%20Section%20Video/01d1f8de-fec0-4bf5-8b48-9fc2dbc8c6b0.mp4" type="video/mp4"></video><div class="ov"></div>
<nav class="fu"><span class="logo">Airlines</span><ul class="menu"><li><a href="#">About</a></li><li><a href="#">Services</a></li><li><a href="#">Locations</a></li><li><a href="#">Places</a></li><li><a href="#">Support</a></li></ul><button class="btn-o">Start Travel</button><button class="ham" id="hb" aria-label="Open menu" aria-expanded="false"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></nav>
<div class="mm" id="mm"><a href="#">About</a><a href="#">Services</a><a href="#">Locations</a><a href="#">Places</a><a href="#">Support</a></div>
<div class="c"><h1 class="fu" style="animation-delay:.25s">Travel the World<br>Without Any Stress</h1><p class="fu" style="animation-delay:.4s">Let us take care of the planning while you enjoy meaningful travel experiences crafted just for you.</p><button class="cta fu" style="animation-delay:.55s">Start Exploring</button></div></section>
<script>const hb=document.getElementById("hb"),mm=document.getElementById("mm");hb.onclick=()=>{const o=mm.classList.toggle("open");hb.setAttribute("aria-expanded",o)}</script></body></html>
