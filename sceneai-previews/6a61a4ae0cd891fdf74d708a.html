<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paradiso — Subscribe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#f3f1ec;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:20px}
.card{position:relative;width:100%;max-width:1200px;height:550px;border-radius:32px;overflow:hidden;background:linear-gradient(135deg,#243b55,#141e30 60%,#3a2a4d);display:grid;place-items:center;text-align:center;color:#fff;padding:24px}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.in{position:relative;z-index:1;max-width:640px;width:100%}
h1{font-weight:500;font-size:clamp(28px,5vw,46px);line-height:1.1;letter-spacing:-.02em;margin:0 0 14px}
p{font-size:15px;font-weight:400;line-height:1.6;margin:0 0 28px;color:rgba(255,255,255,.85)}
.w{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(4px);animation:in .7s forwards;animation-delay:calc(var(--i)*90ms + 200ms);white-space:pre}
.s{opacity:0;transform:translateY(14px);animation:in .7s forwards}
@keyframes in{to{opacity:1;transform:none;filter:none}}
form{display:flex;gap:8px;background:rgba(255,255,255,.95);border-radius:99px;padding:6px;max-width:460px;margin:0 auto}
input{flex:1;min-width:0;border:0;outline:0;background:none;padding:0 16px;font:400 15px Inter;color:#111}
input::placeholder{color:#777;font-weight:400}
button{background:#000;color:#fff;border:0;border-radius:99px;padding:13px 26px;font:500 15px Inter;cursor:pointer;transition:transform .2s}button:hover{transform:scale(1.04)}
input:focus-visible,button:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
.msg{min-height:22px;margin-top:12px;font-size:14px}
@media(max-width:560px){form{flex-direction:column;border-radius:20px;padding:10px}input{padding:12px 14px}button{width:100%}.card{border-radius:24px}}
@media(prefers-reduced-motion:reduce){.w,.s{animation:none;opacity:1;transform:none;filter:none}video{display:none}}
</style></head><body><section class="card" aria-labelledby="h">
<video autoplay muted loop playsinline preload="metadata"><source src="https://cdn.sceneai.art/Hero%20Section%20Video/adec243d-ffda-48cf-a8a8-26e6d6bcbe9b.mp4" type="video/mp4"></video><div class="ov"></div>
<div class="in"><h1 id="h" aria-label="Be the first to know about nearby homes."></h1>
<p class="s" style="animation-delay:1.3s">Enjoy seamless moving experiences with trusted<br> professionals by your side every step.</p>
<form id="f" class="s" style="animation-delay:1.6s" novalidate><input id="e" type="email" placeholder="Enter your email address" aria-label="Email address"><button>Subscribe</button></form><div class="msg s" id="m" role="status" style="animation-delay:1.6s"></div></div></section>
<script>
const h=document.getElementById("h");let i=0;const line=(t)=>t.split(" ").map(w=>'<span class="w" aria-hidden="true" style="--i:'+(i++)+'">'+w+' </span>').join("");
h.innerHTML=line("Be the first to know")+"<br>"+line("about nearby homes.");
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();const v=document.getElementById("e").value.trim(),m=document.getElementById("m");if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){m.textContent="Please enter a valid email address.";return}m.textContent="You're on the list — we'll email you about nearby homes.";e.target.reset()});
</script></body></html>
