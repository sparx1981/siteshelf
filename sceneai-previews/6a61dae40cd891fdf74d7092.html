<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portiva — Creative Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(120deg,#1c1410,#4a2e1c 50%,#0e0a08)}.bg video{width:100%;height:100%;object-fit:cover}
.fd{opacity:0;transform:translateY(12px);animation:u .8s forwards}@keyframes u{to{opacity:1;transform:none}}
header{display:flex;align-items:center;justify-content:space-between;padding:26px clamp(20px,5vw,64px)}
.lg{font-size:24px;font-weight:500}nav{display:flex;gap:36px}nav a{color:#fff;text-decoration:none;font-size:15px}nav a:hover{opacity:.75}
.pill{background:#fff;color:#000;border:0;border-radius:99px;padding:11px 24px;font:500 14px Inter;cursor:pointer}
main{min-height:calc(100vh - 100px);display:flex;flex-direction:column;justify-content:center;padding:0 clamp(20px,5vw,64px) 60px}
.lb{font-size:14px;margin-bottom:22px}
h1{font-size:62px;font-weight:500;line-height:1.05;letter-spacing:-.03em;margin:0 0 26px;max-width:720px}
.w{display:inline-block;opacity:0;transform:translateY(24px);animation:u .7s forwards}
.pr{display:flex;align-items:center;gap:12px;margin-bottom:30px;font-size:14px}.pr .s{color:#c25e2e;letter-spacing:2px;font-size:17px}
.bt{display:flex;gap:12px;flex-wrap:wrap}
.b1{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#000;border:0;border-radius:99px;padding:6px 6px 6px 22px;font:500 14px Inter;cursor:pointer}.b1 i{width:30px;height:30px;border-radius:50%;background:#000;display:grid;place-items:center}
.b2{background:rgba(255,255,255,.08);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:12px 24px;font:500 14px Inter;cursor:pointer}.b2:hover{background:rgba(255,255,255,.16)}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(max-width:820px){nav{display:none}h1{font-size:38px}}
@media(prefers-reduced-motion:reduce){.fd,.w{animation:none;opacity:1;transform:none}video{display:none}}
</style></head><body><div class="bg"><video autoplay muted loop playsinline preload="metadata"><source src="https://cdn.sceneai.art/Hero%20section%20video%20file%20(2)/13c2a27f-30ac-44f1-866d-94fca9c614d7.mp4" type="video/mp4"></video></div>
<header class="fd" id="hd" style="animation-delay:1s"><span class="lg">Portiva</span><nav aria-label="Main"><a href="#">About</a><a href="#">Brands</a><a href="#">Careers</a><a href="#">Partners</a></nav><button class="pill">Chat with us</button></header>
<main><div class="lb fd" style="animation-delay:.9s">| Creative Agency</div><h1 id="h" aria-label="Less complexity, more impact in every project."></h1>
<div class="pr fd" style="animation-delay:1.6s"><span class="s" aria-label="5 stars">★★★★★</span><span>3000+ Customers</span></div>
<div class="bt fd" style="animation-delay:1.8s"><button class="b1">Chat With Us<i><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></button><button class="b2">Our Works</button></div></main>
<script>let d=.2;document.getElementById("h").innerHTML=["Less complexity,","more impact in","every project."].map(l=>l.split(" ").map(w=>{const s='<span class="w" aria-hidden="true" style="animation-delay:'+d.toFixed(2)+'s">'+w+"&nbsp;</span>";d+=.12;return s}).join("")+"<br>").join("")</script></body></html>
